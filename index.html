t nach – reichte nach – hat nachgereicht","br":"Sonradan uzatmak = eksik belgeyi tamamlamak. Alman bürokrasisinin standart fiili.","tr":"sonradan sunmak, tamamlamak","s":"Die fehlende Bescheinigung können Sie bis Freitag nachreichen.","st":"Eksik belgeyi cumaya kadar sonradan sunabilirsiniz.","f":"einreichen (sunmak) · die Einreichung (sunma, ibraz) · die Nachreichung (sonradan sunma)"},{"w":"nachfragen","t":"Verb + bei (D)","k":"nach + fragen","c":"fragt nach – fragte nach – hat nachgefragt","br":"Peşinden sormak = tekrar sormak, durumu sormak. İsim hâli ekonomide „talep“ demektir.","tr":"tekrar sormak, sorup öğrenmek","s":"Ich habe beim Amt noch einmal nachgefragt.","st":"Dairede bir kez daha sordum.","f":"die Nachfrage (talep; soru) · das Angebot und die Nachfrage (arz ve talep)"},{"w":"nachlassen","t":"Verb","k":"nach + lassen (bırakmak)","c":"lässt nach – ließ nach – hat nachgelassen","br":"Gerilimi geriye bırakmak = azalmak, gevşemek. Ticarette: fiyattan indirmek.","tr":"azalmak, hafiflemek; indirim yapmak","s":"Die Beschwerden haben nach zwei Tagen deutlich nachgelassen.","st":"Şikâyetler iki gün sonra belirgin şekilde azaldı.","f":"der Nachlass (indirim; miras) · nachlässig (savsak)","m":[{"tr":"indirim yapmak","s":"Beim Preis hat der Händler etwas nachgelassen.","st":"Satıcı fiyattan biraz indirdi."}]},{"w":"nachgehen","t":"Verb + Dativ","k":"nach + gehen","c":"geht nach – ging nach – ist nachgegangen","br":"Peşinden gitmek: bir konuyu takip edip araştırmak; mesleği icra etmek; saatin geri kalması.","tr":"peşine düşmek, araştırmak; (işi) yapmak","s":"Ich gehe der Sache morgen nach.","st":"Konunun peşine yarın düşeceğim.","f":"nachgehend (peşinden giden) · der Nachgang (im Nachgang: sonrasında)","m":[{"tr":"(mesleği) icra etmek","s":"Sie geht seit Jahren einer selbstständigen Tätigkeit nach.","st":"Yıllardır serbest bir iş yapıyor."}]},{"w":"nachholen","t":"Verb","k":"nach + holen (getirmek)","c":"holt nach – holte nach – hat nachgeholt","br":"holen getirmektir; nach- geriden, sonradan getirir. Kaçırılanı sonradan yapmak: dersi, sınavı, kutlamayı. Aynı mantık der Nachholbedarf’ta yaşar: „telafi edilmesi gereken birikmiş eksik“.","tr":"telafi etmek, sonradan yapmak","s":"Den Geburtstag holen wir am Wochenende nach.","st":"Doğum gününü hafta sonu telafi ederiz.","f":"der Nachholbedarf (telafi ihtiyacı) · nachholend (telafi eden)"},{"w":"nachbessern","t":"Verb","k":"nach + besser + -n","c":"bessert nach – besserte nach – hat nachgebessert","br":"Sonradan daha iyi hâle getirmek = düzeltme yapmak. İnşaat ve tüketici hukukunun anahtar fiili.","tr":"sonradan düzeltmek, ayıbı gidermek","s":"Der Handwerker muss noch einmal nachbessern.","st":"Ustanın bir kez daha düzeltmesi gerekiyor.","f":"die Nachbesserung (sonradan düzeltme) · besser (daha iyi) · verbessern (iyileştirmek)"},{"w":"nachkommen","t":"Verb + Dativ","k":"nach + kommen","c":"kommt nach – kam nach – ist nachgekommen","br":"Bir yükümlülüğün arkasından gitmek = onu yerine getirmek. Resmî yazı kalıbı: seiner Pflicht nachkommen.","tr":"(yükümlülüğü) yerine getirmek; sonradan gelmek","s":"Der Vermieter ist seiner Auskunftspflicht nicht nachgekommen.","st":"Ev sahibi bilgi verme yükümlülüğünü yerine getirmedi.","f":"die Nachkommen (torunlar) · nachkommend (sonradan gelen)"},{"w":"nachdenken","t":"Verb + über (A)","k":"nach + denken","c":"denkt nach – dachte nach – hat nachgedacht","br":"Bir düşüncenin izini sürmek = derinlemesine düşünmek. denken ani, nachdenken sürekli düşünmedir.","tr":"düşünmek, kafa yormak","s":"Über diesen Vorschlag muss ich in Ruhe nachdenken.","st":"Bu öneri üzerine sakin kafayla düşünmem lazım.","f":"nachdenklich (dalgın, düşünceli) · das Nachdenken (düşünme)"},{"w":"nachprüfen","t":"Verb","k":"nach + prüfen","c":"prüft nach – prüfte nach – hat nachgeprüft","br":"prüfen sınamaktır; nach- işlemi sonradan bir kez daha yapar. Yani başkasının verdiği bilgiyi teyit etmek. überprüfen bütünü denetler, nachprüfen tek bir noktayı doğrular. Sıfatı nachprüfbar, iddianın denetlenebilir olduğunu söyler.","tr":"teyit etmek, yeniden kontrol etmek","s":"Diese Angaben lassen sich jederzeit nachprüfen.","st":"Bu bilgiler her zaman teyit edilebilir.","f":"nachprüfbar (teyit edilebilir) · die Nachprüfung (teyit incelemesi) · überprüfen (gözden geçirmek)"},{"w":"nachahmen","t":"Verb","k":"nach + ahmen (eski: örnek almak)","c":"ahmt nach – ahmte nach – hat nachgeahmt","br":"Bir örneğin peşinden gitmek. ahmen bugün tek başına kullanılmaz; eski „örnek almak“ anlamına bağlanır, ama bu türetme kesin değildir. Kelimeyi ailesiyle tut: die Nachahmung (taklit), nachahmenswert (örnek alınası), das Vorbild (örnek).","tr":"taklit etmek","s":"Kinder ahmen das Verhalten Erwachsener nach.","st":"Çocuklar yetişkinlerin davranışlarını taklit eder.","f":"die Nachahmung (taklit) · nachahmenswert (örnek alınası)"}]},{"n":"Ön ekler: mit- · zu-","e":"birlikte olma · yönelme · onay verme","c":"#b0722d","g":"Ön ekler","cards":[{"w":"mitteilen","t":"Verb + Dativ","k":"mit + teilen (paylaşmak)","c":"teilt mit – teilte mit – hat mitgeteilt","br":"Bilgiyi biriyle paylaşmak = bildirmek. Resmî yazışmanın en sık fiili: Hiermit teile ich Ihnen mit …","tr":"bildirmek, iletmek","s":"Teilen Sie uns bitte Ihre neue Adresse mit.","st":"Lütfen yeni adresinizi bize bildirin.","f":"die Mitteilung (bildirim) · der Teil (parça, bölüm) · teilen (paylaşmak; bölmek)"},{"w":"mitwirken","t":"Verb + an/bei (D)","k":"mit + wirken (etki etmek)","c":"wirkt mit – wirkte mit – hat mitgewirkt","br":"Birlikte etki etmek = katkıda bulunmak. Hukukta Mitwirkungspflicht: işbirliği yükümlülüğü.","tr":"katkıda bulunmak, iştirak etmek","s":"An der Erstellung des Gutachtens haben drei Experten mitgewirkt.","st":"Bilirkişi raporunun hazırlanmasına üç uzman katkıda bulundu.","f":"die Mitwirkung (katkı, iştirak) · die Mitwirkungspflicht (işbirliği yükümlülüğü) · wirken (etki etmek; …görünmek)"},{"w":"mitbestimmen","t":"Verb","k":"mit + be + stimmen (ses vermek)","c":"bestimmt mit – bestimmte mit – hat mitbestimmt","br":"Kararın sesine ortak olmak = söz hakkı sahibi olmak. İş hukukunda Mitbestimmung temel kavramdır.","tr":"birlikte karar vermek, söz sahibi olmak","s":"Der Betriebsrat kann bei Arbeitszeiten mitbestimmen.","st":"İşçi temsil kurulu çalışma saatlerinde söz sahibi olabilir.","f":"die Mitbestimmung (ortak karar hakkı) · bestimmen (belirlemek) · die Stimme (ses; oy)"},{"w":"mitbekommen","t":"Verb","k":"mit + bekommen","c":"bekommt mit – bekam mit – hat mitbekommen","br":"Olup biteni yanında almak = fark etmek, kulağına gelmek. Günlük dilde çok işlek.","tr":"fark etmek, farkına varmak","s":"Von der Änderung habe ich gar nichts mitbekommen.","st":"Değişiklikten hiç haberim olmadı.","f":"bekommen (almak) · mitkriegen (günlük)"},{"w":"zustimmen","t":"Verb + Dativ","k":"zu + stimmen (ses vermek)","c":"stimmt zu – stimmte zu – hat zugestimmt","br":"Sesini bir görüşe doğru vermek = onaylamak. Karşıtı: ablehnen (geri yaslamak).","tr":"onaylamak, katılmak","s":"Dem Vorschlag hat der Ausschuss einstimmig zugestimmt.","st":"Komisyon öneriyi oybirliğiyle onayladı.","f":"die Zustimmung (onay) · zustimmend (onaylayıcı) · ablehnen (reddetmek)"},{"w":"zulassen","t":"Verb","k":"zu + lassen","c":"lässt zu – ließ zu – hat zugelassen","br":"lassen bırakmaktır; zu- yaklaşmasına izin verir: bir şeyin yanına gelmesine engel olmamak. Oradan resmî anlam doğar: ruhsat vermek. Aileden die Zulassung (tescil, ruhsat), zulässig (caiz), unzulässig (hukuka aykırı).","tr":"izin vermek; ruhsat vermek","s":"Das Gericht hat die Berufung zugelassen.","st":"Mahkeme istinaf yolunu açtı.","f":"die Zulassung (ruhsat) · zulässig (caiz) · unzulässig (hukuka aykırı, caiz değil)","m":[{"tr":"ruhsat, tescil vermek","s":"Das Fahrzeug ist seit Mai auf meinen Namen zugelassen.","st":"Araç mayıstan beri benim adıma tescilli."}]},{"w":"zutreffen","t":"Verb + auf (A)","k":"zu + treffen (isabet etmek)","c":"trifft zu – traf zu – hat zugetroffen","br":"Hedefe tam oturmak = doğru olmak, geçerli olmak. Formlarda: Zutreffendes bitte ankreuzen.","tr":"doğru olmak, geçerli olmak","s":"Diese Beschreibung trifft auf unseren Fall nicht zu.","st":"Bu tanım bizim durumumuza uymuyor.","f":"zutreffend (yerinde, doğru) · treffen (isabet etmek; buluşmak)"},{"w":"zustehen","t":"Verb + Dativ","k":"zu + stehen","c":"steht zu – stand zu – hat zugestanden","br":"Bir hakkın birine doğru durması = ona ait olması. Hak dilinin temel fiili.","tr":"hakkı olmak, ait olmak","s":"Ihnen steht eine Belegeinsicht ohne Kosten zu.","st":"Ücretsiz belge inceleme hakkınız var.","f":"der Anspruch (hak talebi) · zugestehen (kabul etmek) · das Zugeständnis (taviz)","m":[{"tr":"zugestehen: kabul etmek, tanımak","s":"Man muss ihm zugestehen, dass er sorgfältig gearbeitet hat.","st":"Özenli çalıştığını teslim etmek gerekir."}]},{"w":"zunehmen","t":"Verb","k":"zu + nehmen","c":"nimmt zu – nahm zu – hat zugenommen","br":"Kendine ekleyerek almak = artmak; kişi için: kilo almak. Karşıtı: abnehmen.","tr":"artmak; kilo almak","s":"Die Zahl der Beschwerden hat deutlich zugenommen.","st":"Şikâyet sayısı belirgin şekilde arttı.","f":"die Zunahme (artış) · abnehmen (azalmak) · zunehmend (giderek artan)","m":[{"tr":"kilo almak","s":"Im Winter nehme ich regelmäßig zwei Kilo zu.","st":"Kışın düzenli olarak iki kilo alıyorum."}]},{"w":"zuordnen","t":"Verb + Dativ","k":"zu + ordnen (düzenlemek)","c":"ordnet zu – ordnete zu – hat zugeordnet","br":"ordnen düzene koymaktır; zu- eşyayı ait olduğu yere doğru yöneltir. Yani her şeyi kendi kutusuna koymak: eşleştirme. Aileden die Ordnung (düzen), die Zuordnung (eşleştirme), einordnen (bağlamına oturtmak).","tr":"eşleştirmek, sınıflandırmak","s":"Diese Kosten lassen sich keiner Wohnung eindeutig zuordnen.","st":"Bu masraflar hiçbir daireye net olarak atfedilemiyor.","f":"die Zuordnung (eşleştirme) · die Ordnung (düzen) · einordnen (sınıflandırmak)"},{"w":"zuweisen","t":"Verb + Dativ","k":"zu + weisen (göstermek)","c":"weist zu – wies zu – hat zugewiesen","br":"weisen göstermektir; zu- göstermeyi birine doğru yöneltir: parmakla gösterip vermek. İdari dilde kaynak, yer ya da kadro dağıtmanın fiilidir. İsim die Zuweisung; yakını anweisen (talimat vermek) ve die Anweisung.","tr":"tahsis etmek, vermek","s":"Der Trainer weist jedem Spieler eine Position zu.","st":"Antrenör her oyuncuya bir mevki veriyor.","f":"die Zuweisung (tahsis) · anweisen (talimat vermek) · die Anweisung (talimat)"},{"w":"zumuten","t":"Verb + Dativ","k":"zu + muten (Mut: güç)","c":"mutet zu – mutete zu – hat zugemutet","br":"Mut yürek ve güçtür; muten eskiden „bir şeyi birinden istemek“ demekti. zu- talebi karşıya yöneltir: birine bir yükü reva görmek. Bu yüzden zumutbar „makul olarak beklenebilir“, unzumutbar ise kira ve iş hukukunun eşik kelimesidir.","tr":"(birinden) katlanmasını beklemek, yüklemek","s":"Einen solchen Umweg kann man niemandem zumuten.","st":"Böyle bir dolambaçlı yol kimseden beklenemez.","f":"zumutbar (makul olarak beklenebilir) · unzumutbar (katlanılamaz) · die Zumutung (haddi aşan talep)"}]},{"n":"Ön ekler: über- · unter-","e":"üstünlük · aşırılık · aktarma · altında kalma","c":"#3f5fb0","g":"Ön ekler","cards":[{"w":"übernehmen","t":"Verb","k":"über + nehmen","c":"übernimmt – übernahm – hat übernommen","br":"Bir şeyi üstüne alıp taşımak = devralmak, üstlenmek. über- ayrılmadığında soyut anlam taşır; ayrıldığında somut („üstünden“).","tr":"devralmak, üstlenmek","s":"Die Kosten übernimmt in diesem Fall die Versicherung.","st":"Masrafları bu durumda sigorta üstleniyor.","f":"die Übernahme (devralma) · übernommen (devralınmış) · die Kostenübernahme (masrafın üstlenilmesi)"},{"w":"überprüfen","t":"Verb","k":"über + prüfen","c":"überprüft – überprüfte – hat überprüft","br":"Bütünün üstünden geçerek kontrol etmek. prüfen tekil bir sınamadır, überprüfen bütünsel denetimdir.","tr":"gözden geçirmek, denetlemek","s":"Wir haben sämtliche Positionen noch einmal überprüft.","st":"Bütün kalemleri bir kez daha gözden geçirdik.","f":"die Überprüfung (denetim, gözden geçirme) · die Prüfung (sınav; inceleme) · nachprüfen (teyit etmek)"},{"w":"überzeugen","t":"Verb + von (D)","k":"über + zeugen (tanıklık etmek)","c":"überzeugt – überzeugte – hat überzeugt","br":"Zeuge = tanık. Birini kanıtlarla kaplayıp tanık yapmak = ikna etmek. sich überzeugen: kendi gözüyle görmek.","tr":"ikna etmek; sich ~ : bizzat görmek","s":"Die Begründung hat das Gericht nicht überzeugt.","st":"Gerekçe mahkemeyi ikna etmedi.","f":"die Überzeugung (kanaat) · überzeugend (ikna edici) · der Zeuge (tanık)","m":[{"tr":"sich überzeugen: bizzat görüp emin olmak","s":"Überzeugen Sie sich selbst von der Qualität.","st":"Kaliteyi kendiniz görün."}]},{"w":"übersehen","t":"Verb","k":"über + sehen","c":"übersieht – übersah – hat übersehen","br":"Bakışın üstünden geçip gitmesi = gözden kaçırmak. Ayrılırsa (über|sehen) tersi olur: tümünü görebilmek.","tr":"gözden kaçırmak; (tümünü) kavramak","s":"Entschuldigung, ich habe deine Nachricht übersehen.","st":"Kusura bakma, mesajını gözden kaçırmışım.","f":"unübersehbar (gözden kaçmayacak kadar açık) · übersichtlich (düzenli) · die Übersicht (genel bakış)","m":[{"tr":"(ayrılınca) tümünü görebilmek","s":"Von hier oben kann man das ganze Gelände übersehen.","st":"Buradan bütün araziyi görebilirsiniz."}]},{"w":"übertragen","t":"Verb + auf (A)","k":"über + tragen (taşımak)","c":"überträgt – übertrug – hat übertragen","br":"Üstünden öbür tarafa taşımak = aktarmak, devretmek, yayınlamak. Latince transferre birebir aynı.","tr":"aktarmak, devretmek; yayınlamak","s":"Kannst du die Zahlen in die Tabelle übertragen?","st":"Rakamları tabloya aktarabilir misin?","f":"die Übertragung (aktarım; yayın) · übertragbar (bulaşıcı, devredilebilir) · transferieren (aktarmak)","m":[{"tr":"yayınlamak","s":"Das Spiel wird live im Fernsehen übertragen.","st":"Maç televizyonda canlı yayınlanıyor."}]},{"w":"übertreiben","t":"Verb","k":"über + treiben (sürmek)","c":"übertreibt – übertrieb – hat übertrieben","br":"treiben sürmek, itmektir; über- sınırın ötesine geçirir. Yani bir şeyi olması gereken ölçünün üstüne sürmek. Partizip’i sıfat olmuştur: übertrieben (abartılı). Karşıtı untertreiben — az göstermek, nadir ama vardır.","tr":"abartmak","s":"Er übertreibt gern, wenn es um Zahlen geht.","st":"Konu rakamlar olunca abartmayı sever.","f":"übertrieben (abartılı) · die Übertreibung (abartı) · treiben (sürmek, itmek)"},{"w":"überweisen","t":"Verb","k":"über + weisen (göstermek, yöneltmek)","c":"überweist – überwies – hat überwiesen","br":"Parayı ya da hastayı bir yerden öbürüne yöneltmek = havale etmek, sevk etmek.","tr":"havale etmek; (hastayı) sevk etmek","s":"Den Betrag habe ich bereits am Montag überwiesen.","st":"Tutarı pazartesi günü çoktan havale ettim.","f":"die Überweisung (havale; sevk) · der Überweisungsträger (havale formu) · weisen (göstermek)"},{"w":"überstehen","t":"Verb","k":"über + stehen","c":"übersteht – überstand – hat überstanden","br":"stehen durmaktır; über- „üstünde kalarak“ katar: dalga geçerken ayakta kalmak. Zor bir dönemi hasarsız atlatmayı anlatır. durchstehen dişini sıkıp dayanmadır, überstehen ise sonunda kurtulmuş olmaktır: Das haben wir überstanden.","tr":"atlatmak, üstesinden gelmek","s":"Die Prüfungsphase haben wir alle gut überstanden.","st":"Sınav dönemini hepimiz iyi atlattık.","f":"überstanden (atlatılmış) · durchstehen (sonuna kadar dayanmak) · ausstehen (beklemede olmak)"},{"w":"unternehmen","t":"Verb","k":"unter + nehmen","c":"unternimmt – unternahm – hat unternommen","br":"Bir işi eline alıp altına girmek = girişimde bulunmak. Aynı kökten Unternehmen: girişim, şirket.","tr":"girişimde bulunmak, yapmak","s":"Wollen wir am Wochenende etwas unternehmen?","st":"Hafta sonu bir şeyler yapalım mı?","f":"das Unternehmen (şirket) · der Unternehmer (girişimci) · die Unternehmung (girişim)"},{"w":"unterstützen","t":"Verb","k":"unter + Stütze (destek) + -en","c":"unterstützt – unterstützte – hat unterstützt","br":"Stütze payandadır; unter- onu altına yerleştirir: yıkılmasın diye destek koymak. Yani yardım burada „alttan tutmak“ imgesiyle kurulur. İsim die Unterstützung; ilgili helfen doğrudan yardımdır, unterstützen ise sürekli destektir.","tr":"desteklemek","s":"Der Antrag wird vom gesamten Kollegium unterstützt.","st":"Başvuru bütün öğretmenler kurulu tarafından destekleniyor.","f":"die Unterstützung (destek) · die Stütze (destek, payanda) · unterstützend (destekleyici)"},{"w":"unterscheiden","t":"Verb + zwischen (D) / von (D)","k":"unter + scheiden (ayırmak)","c":"unterscheidet – unterschied – hat unterschieden","br":"scheiden = ayırmak. İki şeyin arasına ayrım koymak = fark gözetmek. İsim: Unterschied.","tr":"ayırt etmek; sich ~ : farklı olmak","s":"Man muss zwischen Betriebskosten und Instandhaltungskosten unterscheiden.","st":"İşletme giderleri ile bakım giderlerini birbirinden ayırmak gerekir.","f":"der Unterschied (fark) · unterschiedlich (farklı) · entscheiden (karar vermek)","m":[{"tr":"sich unterscheiden: farklı olmak","s":"Die beiden Abrechnungen unterscheiden sich nur in einem Punkt.","st":"İki hesaplama yalnızca tek noktada farklılaşıyor."}]},{"w":"unterlassen","t":"Verb","k":"unter + lassen","c":"unterlässt – unterließ – hat unterlassen","br":"Yapmayı alta bırakmak = yapmaktan kaçınmak. Hukukta Unterlassung: bir eylemden kaçınma borcu.","tr":"yapmamak, kaçınmak","s":"Bitte unterlassen Sie künftig solche Bemerkungen.","st":"Lütfen bundan böyle bu tür yorumlardan kaçının.","f":"die Unterlassung (kaçınma, yapmama) · die Unterlassungserklärung (ihlalden kaçınma taahhüdü) · das Unterlassen (yapmama, ihmal)"},{"w":"unterliegen","t":"Verb + Dativ","k":"unter + liegen","c":"unterliegt – unterlag – ist unterlegen","br":"Altında yatmak: bir kurala tabi olmak; yarışmada altta kalmak = yenilmek.","tr":"tabi olmak; yenilmek","s":"Diese Daten unterliegen dem Datenschutz.","st":"Bu veriler veri korumasına tabidir.","f":"unterlegen (yenik, alt seviyede) · die Unterlegenheit (geride kalma)","m":[{"tr":"yenilmek, kaybetmek","s":"Im Berufungsverfahren ist er unterlegen.","st":"İstinaf sürecinde davayı kaybetti."}]},{"w":"unterschätzen","t":"Verb","k":"unter + schätzen (değer biçmek)","c":"unterschätzt – unterschätzte – hat unterschätzt","br":"Gerçek değerin altında tahmin etmek. Karşıtı überschätzen: fazla değer biçmek.","tr":"hafife almak, küçümsemek","s":"Den Aufwand für die Prüfung habe ich völlig unterschätzt.","st":"İnceleme için gereken emeği tamamen hafife almışım.","f":"überschätzen (olduğundan fazla değerlendirmek) · schätzen (tahmin etmek; değer vermek) · die Schätzung (tahmin)"}]},{"n":"Ön ekler: durch- · um-","e":"içinden geçme · dönüşüm · etrafını sarma","c":"#0e7a6b","g":"Ön ekler","cards":[{"w":"durchsetzen","t":"Verb","k":"durch + setzen (koymak)","c":"setzt durch – setzte durch – hat durchgesetzt","br":"Bir şeyi engellerin içinden geçirip yerine oturtmak = kabul ettirmek. sich durchsetzen: kendini kabul ettirmek.","tr":"kabul ettirmek, hayata geçirmek","s":"Seinen Anspruch konnte er erst vor Gericht durchsetzen.","st":"Hakkını ancak mahkemede kabul ettirebildi.","f":"die Durchsetzung (kabul ettirme) · durchsetzungsfähig (iradesini kabul ettirebilen) · setzen (koymak, oturtmak)"},{"w":"durchführen","t":"Verb","k":"durch + führen (yönetmek)","c":"führt durch – führte durch – hat durchgeführt","br":"Bir işi baştan sona götürmek = gerçekleştirmek. Resmî dilde „yapmak“ın karşılığı: eine Prüfung durchführen.","tr":"gerçekleştirmek, yürütmek","s":"Die Schule führt jedes Jahr ein Sportfest durch.","st":"Okul her yıl bir spor şenliği düzenliyor.","f":"die Durchführung (gerçekleştirme) · führen (yönetmek; götürmek) · durchführbar (uygulanabilir)"},{"w":"durchschauen","t":"Verb","k":"durch + schauen (bakmak)","c":"durchschaut – durchschaute – hat durchschaut","br":"Bir şeyin içinden bakmak = numarayı anlamak. Ayrılmadan kullanılınca hep bu mecazî anlamı taşır.","tr":"(niyeti) anlamak, çözmek","s":"Seine Taktik habe ich schnell durchschaut.","st":"Taktiğini çabuk çözdüm.","f":"durchsichtig (şeffaf) · die Durchsicht (gözden geçirme)"},{"w":"durchhalten","t":"Verb","k":"durch + halten (tutmak)","c":"hält durch – hielt durch – hat durchgehalten","br":"halten tutmaktır; durch- „baştan sona“ katar: bırakmadan tutunabilmek. Kararlılık kelimesidir; ismi das Durchhaltevermögen (dayanma gücü). aushalten katlanmaktır, durchhalten ise sona kadar sürdürmektir — biri pasif, öbürü etkin.","tr":"dayanmak, sonuna kadar sürdürmek","s":"Dieses Lernpensum hält man keine drei Wochen durch.","st":"Bu çalışma temposuna üç hafta bile dayanılmaz.","f":"das Durchhaltevermögen (dayanma gücü) · durchhalten müssen (dayanmak zorunda olmak)"},{"w":"durchgehen","t":"Verb","k":"durch + gehen","c":"geht durch – ging durch – ist durchgegangen","br":"Baştan sona geçmek: bir listeyi tek tek incelemek; ayrıca bir teklifin kabul edilmesi.","tr":"gözden geçirmek; (teklif) geçmek","s":"Gehen wir die Positionen einzeln durch.","st":"Kalemleri tek tek gözden geçirelim.","f":"durchgehend (kesintisiz) · durchsehen (gözden geçirmek)","m":[{"tr":"(teklif, yasa) kabul edilmek","s":"Der Antrag ist im Ausschuss ohne Gegenstimme durchgegangen.","st":"Başvuru komisyondan karşı oy olmadan geçti."}]},{"w":"durchsuchen","t":"Verb","k":"durch + suchen (aramak)","c":"durchsucht – durchsuchte – hat durchsucht","br":"Bir alanın her yerini baştan sona aramak. Ayrılınca (durch|suchen) günlük anlamda „karıştırarak aramak“.","tr":"arama yapmak, didik didik aramak","s":"Ich habe die ganze Wohnung nach dem Schlüssel durchsucht.","st":"Anahtar için bütün evi aradım.","f":"die Durchsuchung (arama) · der Durchsuchungsbeschluss (arama kararı)"},{"w":"umsetzen","t":"Verb","k":"um + setzen (koymak)","c":"setzt um – setzte um – hat umgesetzt","br":"Bir şeyi başka bir biçime çevirerek koymak = hayata geçirmek. um- burada dönüşüm demektir.","tr":"uygulamaya koymak, hayata geçirmek","s":"Die Idee ist gut, aber schwer umzusetzen.","st":"Fikir iyi ama hayata geçirmesi zor.","f":"die Umsetzung (hayata geçirme) · der Umsatz (ciro) · umsetzbar (uygulanabilir)"},{"w":"umgehen","t":"Verb + mit (D) / + Akkusativ","k":"um + gehen","c":"geht um / umgeht – ging um / umging – ist umgegangen / hat umgangen","br":"gehen gitmektir; um- etrafında dolanmayı bildirir. Ayrılmayan hâlde soyuttur: kuralın etrafından dolaşmak = onu delmek. Ayrılan hâlde mit + Dativ ile „bir şeyle nasıl dolaştığın“ = ona nasıl davrandığındır. Vurgu anlamı belirler.","tr":"muamele etmek (mit+D); (kuralı) dolanmak","s":"Mit dieser Ausrede umgeht er jede klare Antwort.","st":"Bu bahaneyle her net cevabı atlatıyor.","f":"der Umgang (muamele, ilişki) · die Umgehung (dolanma, atlatma) · die Umgehungsstraße (çevre yolu)","m":[{"tr":"mit+D (ayrılan): muamele etmek","s":"Mit sensiblen Daten muss man sorgfältig umgehen.","st":"Hassas verilerle özenle muamele edilmeli."}]},{"w":"umgeben","t":"Verb + von (D)","k":"um + geben","c":"umgibt – umgab – hat umgeben","br":"geben vermektir; um- vermeyi etrafa dağıtır: çepeçevre sarmak. Genelde edilgen kullanılır: von etwas umgeben sein. İsim die Umgebung hem çevre hem yakın muhit demektir; bilgisayarda ise „ortam“.","tr":"çevrelemek, sarmak","s":"Das Grundstück ist von einer hohen Hecke umgeben.","st":"Arsa yüksek bir çitle çevrili.","f":"die Umgebung (çevre) · umgebend (çevreleyen)"},{"w":"umziehen","t":"Verb","k":"um + ziehen (çekmek)","c":"zieht um – zog um – ist umgezogen","br":"Kendini başka yere çekmek = taşınmak; refleksif kullanımda: üstünü değiştirmek. um- yine „değişim“ demektir.","tr":"taşınmak; sich ~ : üstünü değiştirmek","s":"Wir sind im Sommer nach Alsdorf umgezogen.","st":"Yazın Alsdorf’a taşındık.","f":"der Umzug (taşınma; geçit töreni) · der Auszug (taşınma; alıntı) · der Einzug (taşınıp girme)","m":[{"tr":"sich umziehen: üstünü değiştirmek","s":"Zieh dich bitte vor dem Termin um.","st":"Randevudan önce lütfen üstünü değiştir."}]},{"w":"umgestalten","t":"Verb","k":"um + Gestalt (biçim) + -en","c":"gestaltet um – gestaltete um – hat umgestaltet","br":"Gestalt biçimdir (bkz. gestalten: biçim vermek); um- değişimi bildirir. Yani var olanın biçimini değiştirmek — yıkıp yeniden yapmak değil. Aynı um- mantığı umbauen, umziehen, umdenken, umsetzen fiillerinde de çalışır.","tr":"yeniden düzenlemek, biçim değiştirmek","s":"Der Schulhof wird im nächsten Jahr komplett umgestaltet.","st":"Okul bahçesi gelecek yıl tamamen yeniden düzenlenecek.","f":"die Umgestaltung (yeniden düzenleme) · gestalten (biçimlendirmek) · die Gestaltung (biçimlendirme)"},{"w":"umdenken","t":"Verb","k":"um + denken","c":"denkt um – dachte um – hat umgedacht","br":"denken düşünmektir; um- yönü çevirir: düşünceyi başka istikamete döndürmek. Tek bir fikri değil, alışkanlığı değiştirmeyi anlatır — bu yüzden çoğunlukla toplumsal bağlamda geçer: Beim Energieverbrauch müssen wir umdenken.","tr":"düşünce biçimini değiştirmek","s":"Bei den Energiekosten müssen wir alle umdenken.","st":"Enerji masraflarında hepimiz düşünce biçimimizi değiştirmeliyiz.","f":"das Umdenken (zihniyet değişimi) · umlernen (yeniden öğrenmek)"}]},{"n":"Ön ekler: hin- · her-","e":"konuşandan uzağa / konuşana doğru","c":"#a03f6e","g":"Ön ekler","cards":[{"w":"hinweisen","t":"Verb + auf (A)","k":"hin + weisen (göstermek)","c":"weist hin – wies hin – hat hingewiesen","br":"hin- = konuşandan uzağa, oraya doğru. Parmağı bir şeye doğru uzatmak = dikkat çekmek. Resmî yazının anahtar fiili.","tr":"dikkat çekmek, işaret etmek","s":"Ich möchte darauf hinweisen, dass morgen Feiertag ist.","st":"Yarının tatil olduğuna dikkat çekmek isterim.","f":"der Hinweis (uyarı, ipucu) · hinweisend (işaret eden) · aufweisen (göstermek, içermek)"},{"w":"hinzufügen","t":"Verb + Dativ","k":"hin + zu + fügen (eklemek)","c":"fügt hinzu – fügte hinzu – hat hinzugefügt","br":"fügen parçaları birleştirmektir (bkz. sich fügen, die Fuge: derz); hin + zu var olana doğru ekler. Yani bütüne yeni bir parça yerleştirmek. Yakınları: ergänzen eksiği tamamlar, beifügen belgeye ek koyar, hinzukommen kendiliğinden eklenir.","tr":"eklemek, ilave etmek","s":"Ich habe der Liste noch drei Sachen hinzugefügt.","st":"Listeye üç şey daha ekledim.","f":"die Hinzufügung (ekleme) · hinzukommen (eklenmek) · zufügen (zarar vermek)"},{"w":"hinnehmen","t":"Verb","k":"hin + nehmen","c":"nimmt hin – nahm hin – hat hingenommen","br":"Verileni olduğu gibi almak = itiraz etmeden kabullenmek. Genelde olumsuz cümlede: nicht hinnehmbar.","tr":"katlanmak, itirazsız kabul etmek","s":"Diese Verzögerung müssen wir nicht hinnehmen.","st":"Bu gecikmeye katlanmak zorunda değiliz.","f":"hinnehmbar (katlanılabilir) · unhinnehmbar (kabul edilemez) · nicht hinnehmbar (kabul edilemez)"},{"w":"hinterlegen","t":"Verb","k":"hinter (arkasında) + legen","c":"hinterlegt – hinterlegte – hat hinterlegt","br":"legen koymaktır; hinter- onu arkaya, güvenli bir yere koyar. Yani gözden uzak ama kayıtlı biçimde bırakmak: emanet ya da teminat. Aileden die Hinterlegung ve hinterlassen (geride bırakmak, miras bırakmak).","tr":"emanet etmek, teminat olarak yatırmak","s":"Den Schlüssel hinterlege ich beim Nachbarn.","st":"Anahtarı komşuya bırakıyorum.","f":"die Hinterlegung (emanete bırakma) · hinterlassen (geride bırakmak) · der Nachlass (indirim; miras)"},{"w":"hinausgehen","t":"Verb + über (A)","k":"hin + aus + gehen","c":"geht hinaus – ging hinaus – ist hinausgegangen","br":"Bir sınırın ötesine, dışına yürümek = aşmak. Yazı dilinde: über etwas hinausgehen.","tr":"dışarı çıkmak; (sınırı) aşmak","s":"Die Forderung geht deutlich über das gesetzlich Zulässige hinaus.","st":"Talep yasal olarak izin verilenin belirgin biçimde ötesine geçiyor.","f":"darüber hinaus (bunun ötesinde, ayrıca) · hinausschieben (ertelemek)"},{"w":"herausfinden","t":"Verb","k":"her + aus + finden","c":"findet heraus – fand heraus – hat herausgefunden","br":"finden bulmaktır; her + aus bulunanı dışarıdan bana doğru çıkarır. Yani bilgiyi kendiliğinden bulmak değil, araştırıp ortaya çıkarmak. Yakını herausbekommen; kardeşi sich herausstellen — kendiliğinden ortaya çıkmak.","tr":"öğrenmek, ortaya çıkarmak","s":"Ich will herausfinden, warum das Internet ständig ausfällt.","st":"İnternetin neden sürekli kesildiğini öğrenmek istiyorum.","f":"herausbekommen (öğrenmek, çözmek) · die Herausforderung (meydan okuma)"},{"w":"sich herausstellen","t":"Verb","k":"her + aus + stellen","c":"stellt heraus – stellte heraus – hat herausgestellt","br":"Kendini dışarı, görünür yere koymak = sonunda ortaya çıkmak. Kalıp: Es hat sich herausgestellt, dass…","tr":"ortaya çıkmak, anlaşılmak","s":"Es hat sich herausgestellt, dass die Zählernummer falsch war.","st":"Sayaç numarasının yanlış olduğu ortaya çıktı.","f":"herausstellen (öne çıkarmak) · sich erweisen als (…olduğu ortaya çıkmak)"},{"w":"hervorheben","t":"Verb","k":"her + vor + heben (kaldırmak)","c":"hebt hervor – hob hervor – hat hervorgehoben","br":"heben kaldırmaktır; her + vor onu öne ve yukarı çeker: diğerlerinin arasından ayırıp göstermek. Metinde vurgulamak, konuşmada altını çizmek. Sıfatı hervorragend „öne çıkan“ yani mükemmel demektir — aynı imge.","tr":"vurgulamak, öne çıkarmak","s":"Besonders hervorzuheben ist die schnelle Bearbeitung.","st":"Özellikle vurgulanması gereken şey işlemin hızlı yapılması.","f":"die Hervorhebung (vurgulama) · hervorragend (mükemmel) · betonen (vurgulamak)"},{"w":"hervorgehen","t":"Verb + aus (D)","k":"her + vor + gehen","c":"geht hervor – ging hervor – ist hervorgegangen","br":"gehen gitmektir; her + vor onu öne ve konuşana doğru çıkarır. Bir şey metnin içinden öne çıkıyorsa oradan anlaşılıyordur: Aus dem Schreiben geht hervor, dass … Aynı yapı hervorheben ve hervorbringen fiillerinde de çalışır.","tr":"(bir şeyden) anlaşılmak; doğmak","s":"Aus der E-Mail geht nicht hervor, wann er kommt.","st":"E-postadan ne zaman geleceği anlaşılmıyor.","f":"hervorbringen (ortaya çıkarmak) · sich ergeben aus (…dan doğmak)"},{"w":"herbeiführen","t":"Verb","k":"her + bei + führen","c":"führt herbei – führte herbei – hat herbeigeführt","br":"Bir sonucu buraya, yanımıza getirmek = ona yol açmak. Resmî dilde: eine Entscheidung herbeiführen.","tr":"(sonuç) doğurmak, sağlamak","s":"Wir hoffen, eine gütliche Einigung herbeizuführen.","st":"Dostane bir anlaşma sağlamayı umuyoruz.","f":"die Herbeiführung (sağlama, yol açma) · führen (yönetmek; götürmek) · verursachen (sebep olmak)"},{"w":"heranziehen","t":"Verb","k":"her + an + ziehen","c":"zieht heran – zog heran – hat herangezogen","br":"Bir kaynağı kendine doğru çekmek = ona başvurmak, onu esas almak; kişi için: sorumlu tutmak.","tr":"(kaynağı) kullanmak, esas almak; sorumlu tutmak","s":"Für den Vergleich ziehe ich die Zahlen vom letzten Jahr heran.","st":"Karşılaştırma için geçen yılın rakamlarını esas alıyorum.","f":"die Heranziehung (esas alma) · herangehen (yaklaşmak) · heranwachsen (büyümek, yetişmek)"},{"w":"herangehen","t":"Verb + an (A)","k":"her + an + gehen","c":"geht heran – ging heran – ist herangegangen","br":"gehen gitmektir; her + an bir işe yaklaşmayı bildirir: konunun yanına varıp başlamak. Nasıl başlandığını anlatır, bu yüzden hep bir tarzla gelir: systematisch, vorsichtig, locker herangehen. İsim: die Herangehensweise.","tr":"(bir işe) yaklaşmak, girişmek","s":"An solche Aufgaben sollte man systematisch herangehen.","st":"Bu tür görevlere sistemli yaklaşmak gerekir.","f":"die Herangehensweise (yaklaşım biçimi) · vorgehen (işlem yapmak, ilerlemek)"}]},{"n":"Ön ekler: zer- · miss- · un-","e":"parçalanma · yanlışlık · olumsuzlama","c":"#c2306a","g":"Ön ekler","cards":[{"w":"zerstören","t":"Verb","k":"zer + stören (rahatsız etmek)","c":"zerstört – zerstörte – hat zerstört","br":"zer- = parçalara ayırarak. Rahatsız etmenin en uç hâli: parçalayıp yok etmek.","tr":"yıkmak, yok etmek","s":"Der Sturm hat das halbe Dach zerstört.","st":"Fırtına çatının yarısını yıktı.","f":"die Zerstörung (yıkım) · zerstörerisch (yıkıcı) · stören (rahatsız etmek)"},{"w":"zerbrechen","t":"Verb","k":"zer + brechen (kırmak)","c":"zerbricht – zerbrach – ist/hat zerbrochen","br":"brechen tek bir kırıktır; zer- ise „parçalara ayrılarak“ demektir — bu ön ek daima çokluğu ve geri dönüşsüzlüğü katar. Nesnesiz hâli ist ile çekilir (kırıldı), nesneli hâli hat ile. Sıfatı zerbrechlich, kargo kutularının uyarısıdır.","tr":"paramparça olmak/etmek","s":"Beim Umzug sind zwei Teller zerbrochen.","st":"Taşınma sırasında iki tabak kırıldı.","f":"zerbrechlich (kırılgan) · der Bruch (kırık, kopuş)"},{"w":"zerreißen","t":"Verb","k":"zer + reißen (yırtmak)","c":"zerreißt – zerriss – hat zerrissen","br":"reißen yırtmaktır; zer- yırtığı parçalanmaya çevirir: tek yırtık değil, paramparça. Mecazî kullanımı da güçlüdür: Die Geduld reißt (sabır taşar), zerrissen sein = içi parçalanmış, kararsız olmak.","tr":"parçalara yırtmak","s":"Er hat den Vertrag wütend zerrissen.","st":"Sözleşmeyi öfkeyle parçaladı.","f":"zerrissen (parçalanmış) · der Riss (çatlak)"},{"w":"zerlegen","t":"Verb","k":"zer + legen (koymak)","c":"zerlegt – zerlegte – hat zerlegt","br":"Parçalarını ayrı ayrı yere koymak = sökmek, analiz etmek. Bu uygulamanın yaptığı işin adı.","tr":"parçalara ayırmak, tahlil etmek","s":"Man kann fast jedes deutsche Wort in seine Bestandteile zerlegen.","st":"Neredeyse her Almanca kelime parçalarına ayrılabilir.","f":"die Zerlegung (parçalara ayırma) · der Bestandteil (bileşen)"},{"w":"zerfallen","t":"Verb","k":"zer + fallen (düşmek)","c":"zerfällt – zerfiel – ist zerfallen","br":"fallen düşmektir; zer- düşüşü parçalara böler: bütünün dağılarak çökmesi. Bina, imparatorluk ve ilişki için kullanılır. İsim der Zerfall bilimde ayrışma, tarihte çöküş demektir — aynı imge iki alanda.","tr":"dağılmak, çökmek","s":"Das Gebäude zerfällt seit Jahren.","st":"Bina yıllardır çürüyor.","f":"der Zerfall (çözülme, çöküş) · zerfallen (Adj)"},{"w":"zerstreuen","t":"Verb","k":"zer + streuen (serpmek)","c":"zerstreut – zerstreute – hat zerstreut","br":"streuen serpmektir (bkz. Salz streuen: tuz serpmek); zer- serpmeyi her yöne dağıtmaya çevirir. Kalabalık dağılır, kaygı dağılır, dikkat dağılır. Sıfatı zerstreut (dalgın), ismi die Zerstreuung (oyalanma).","tr":"dağıtmak; sich ~ : dağılmak, oyalanmak","s":"Die Menge zerstreute sich innerhalb weniger Minuten.","st":"Kalabalık birkaç dakika içinde dağıldı.","f":"die Zerstreuung (oyalanma) · zerstreut (dalgın)"},{"w":"missverstehen","t":"Verb","k":"miss + verstehen","c":"missversteht – missverstand – hat missverstanden","br":"miss- = yanlış (İngilizce misunderstand ile aynı). Anlamayı yanlış yapmak.","tr":"yanlış anlamak","s":"Ich habe Ihre Frage offenbar missverstanden.","st":"Sorunuzu anlaşılan yanlış anlamışım.","f":"das Missverständnis (yanlış anlaşılma) · missverständlich (yanlış anlaşılmaya açık)"},{"w":"misslingen","t":"Verb","k":"miss + lingen (bkz. gelingen)","c":"misslingt – misslang – ist misslungen","br":"gelingen bir işin kendiliğinden yolunda gitmesidir; miss- onu tersine çevirir. Dikkat: özne iştir, kişi değil — Der Versuch ist misslungen. Kişiyi suçlamayan bu yapı Almancada sık kullanılır. Karşıtı gelingen, ismi der Misserfolg.","tr":"başarısız olmak, tutmamak","s":"Der Versuch, eine Einigung zu erzielen, ist misslungen.","st":"Anlaşmaya varma denemesi başarısız oldu.","f":"gelingen (başarıyla sonuçlanmak) · misslungen (başarısız olmuş) · der Misserfolg (başarısızlık)"},{"w":"missachten","t":"Verb","k":"miss + achten (dikkat etmek, saymak)","c":"missachtet – missachtete – hat missachtet","br":"achten = dikkate almak, saygı göstermek. miss- olumsuzlar: kasıtlı olarak uymamak.","tr":"uymamak, hiçe saymak","s":"Er hat die Anweisungen der Schulleitung bewusst missachtet.","st":"Okul yönetiminin talimatlarını bilerek hiçe saydı.","f":"die Missachtung (hiçe sayma) · achten (saygı duymak) · beachten (dikkate almak)"},{"w":"missbrauchen","t":"Verb","k":"miss + brauchen (kullanmak)","c":"missbraucht – missbrauchte – hat missbraucht","br":"brauchen kullanmaktır; miss- kullanımı yanlış yöne çevirir. Yetkiyi, güveni ya da ilacı amacı dışında kullanmak. Sıfatı missbräuchlich hukukta „hakkın kötüye kullanılması“ anlamına gelir: missbräuchliche Klausel.","tr":"kötüye kullanmak, istismar etmek","s":"Er hat sein Amt für private Zwecke missbraucht.","st":"Görevini kişisel amaçlar için kötüye kullandı.","f":"der Missbrauch (kötüye kullanım) · missbräuchlich (kötüye kullanım niteliğinde)"},{"w":"misstrauen","t":"Verb + Dativ","k":"miss + trauen (güvenmek)","c":"misstraut – misstraute – hat misstraut","br":"trauen güvenmektir; miss- olumsuzlar ve Dativ nesne alır: jemandem misstrauen. Vertrauen açık güvendir, Misstrauen ise kuşkudur; siyasette birleşiği vardır: das Misstrauensvotum (güvensizlik oyu).","tr":"güvenmemek, kuşku duymak","s":"Ich misstraue solchen Versprechen.","st":"Böyle sözlere güvenmiyorum.","f":"das Misstrauen (güvensizlik) · misstrauisch (kuşkucu) · vertrauen (güvenmek)"},{"w":"unzumutbar","t":"Adjektiv","k":"un + zu + muten + bar","c":"—","br":"zumuten = birinden makul olarak beklemek; -bar = -ebilir; un- = değil → makul olarak beklenemez. Kira ve iş hukukunda anahtar kelime.","tr":"katlanılamaz, beklenemez","s":"Ein solcher Baulärm ist für die Mieter unzumutbar.","st":"Böyle bir inşaat gürültüsü kiracılar için katlanılabilir değil.","f":"zumutbar (makul olarak beklenebilir) · die Zumutung (haddini aşan talep) · muten ((eski) yüklemek, beklemek)"},{"w":"unverzüglich","t":"Adverb / Adjektiv","k":"un + Verzug (gecikme) + -lich","c":"—","br":"Verzug = gecikme (ver+ziehen: sürüncemeye çekmek). un- + -lich → gecikmesiz. Hukukta „derhal“ demenin standart yolu.","tr":"derhal, gecikmeksizin","s":"Der Mangel ist dem Vermieter unverzüglich anzuzeigen.","st":"Kusur ev sahibine gecikmeksizin bildirilmelidir.","f":"der Verzug (gecikme, temerrüt) · in Verzug geraten (temerrüde düşmek) · verzögern (geciktirmek)"},{"w":"unabhängig","t":"Adjektiv + von (D)","k":"un + ab + hängen + -ig","c":"—","br":"abhängen = bir şeye asılı olmak = ona bağlı olmak. un- koparır: bağımsız. „unabhängig davon, ob…“ kalıbı yazı dilinde çok işlek.","tr":"bağımsız; ~ davon, ob… : …olup olmadığından bağımsız olarak","s":"Das gilt unabhängig davon, wer den Antrag gestellt hat.","st":"Bu, başvuruyu kimin yaptığından bağımsız olarak geçerlidir.","f":"abhängig (bağımlı) · die Abhängigkeit (bağımlılık) · die Unabhängigkeit (bağımsızlık)"}]},{"n":"Son ekler: -bar · -sam · -haft · -lich","e":"sıfat üreten ekler ve verdikleri anlam","c":"#7a52c9","g":"Son ekler","cards":[{"w":"verfügbar","t":"Adjektiv","k":"verfügen + -bar","c":"—","br":"-bar = „…-ebilir“ (edilgen imkân). Kök tragen → tragbar: taşınabilir. Fiil gövdesine eklenir.","tr":"mevcut, kullanılabilir","s":"Die Unterlagen sind ab Montag digital verfügbar.","st":"Belgeler pazartesiden itibaren dijital olarak mevcut.","f":"die Verfügbarkeit (kullanılabilirlik) · verfügen (karar vermek; tasarruf etmek) · zur Verfügung (emre amade)"},{"w":"nachvollziehbar","t":"Adjektiv","k":"nach + voll + ziehen + -bar","c":"—","br":"nachvollziehen = birinin adımlarını arkadan tam olarak çizmek → anlamak. -bar: bu şekilde izlenebilir = anlaşılır, makul.","tr":"anlaşılabilir, makul","s":"Die Ablehnung war für uns nicht nachvollziehbar.","st":"Ret kararı bizim için anlaşılır değildi.","f":"nachvollziehen (izleyip anlamak) · der Nachvollzug (takip, yeniden izleme)"},{"w":"zumutbar","t":"Adjektiv","k":"zu + muten + -bar","c":"—","br":"Mut = güç, cesaret; jemandem etwas zumuten = birine bir yükü yüklemek. -bar: yüklenebilir = makul olarak beklenebilir.","tr":"makul olarak beklenebilir, katlanılabilir","s":"Ein Arbeitsweg von 90 Minuten gilt noch als zumutbar.","st":"90 dakikalık bir işe gidiş yolu hâlâ makul sayılıyor.","f":"unzumutbar (katlanılamaz) · die Zumutung (haddi aşan talep) · zumuten (birinden beklemek, yüklemek)"},{"w":"belastbar","t":"Adjektiv","k":"be + Last + -bar","c":"—","br":"belasten = yük yüklemek. -bar: yük alabilir → hem malzeme hem insan için kullanılır.","tr":"yük kaldırabilen, dayanıklı","s":"Die Zahlen sind statistisch nicht belastbar.","st":"Rakamlar istatistiksel olarak sağlam değil.","f":"die Belastbarkeit (dayanıklılık) · die Belastung (yük, baskı) · belasten (yüklemek, zorlamak)"},{"w":"unvermeidlich","t":"Adjektiv","k":"un + vermeiden + -lich","c":"—","br":"vermeiden = önlemek; -lich burada -bar gibi imkân verir; un- olumsuzlar → önlenemez.","tr":"kaçınılmaz","s":"Eine Nachzahlung war bei diesem Verbrauch unvermeidlich.","st":"Bu tüketimde ek ödeme kaçınılmazdı.","f":"vermeidbar (önlenebilir) · die Vermeidung (önleme, kaçınma)"},{"w":"sparsam","t":"Adjektiv","k":"sparen + -sam","c":"—","br":"-sam = „…eğilimi taşıyan“. sparen (biriktirmek) → biriktirme eğilimli = tutumlu.","tr":"tutumlu, az tüketen","s":"Das neue Gerät ist deutlich sparsamer im Verbrauch.","st":"Yeni cihaz tüketimde belirgin şekilde daha tutumlu.","f":"sparen (biriktirmek, tasarruf etmek) · die Ersparnis (tasarruf) · die Sparsamkeit (tutumluluk)"},{"w":"aufmerksam","t":"Adjektiv + auf (A)","k":"auf + merken + -sam","c":"—","br":"merken = fark etmek; auf- yönelim verir; -sam eğilim: dikkatini yöneltme eğiliminde olan.","tr":"dikkatli, özenli","s":"Er hat mich auf einen Fehler in der Tabelle aufmerksam gemacht.","st":"Tablodaki bir hataya dikkatimi çekti.","f":"die Aufmerksamkeit (dikkat) · merken (fark etmek; aklında tutmak) · unaufmerksam (dikkatsiz)"},{"w":"wirksam","t":"Adjektiv","k":"wirken + -sam","c":"—","br":"wirken = etki etmek → etki etme eğilimindeki = etkili. Hukukta: yürürlükte, geçerli.","tr":"etkili; hukuken geçerli","s":"Die Kündigung wird zum 30. Juni wirksam.","st":"Fesih 30 Haziran itibarıyla yürürlüğe girer.","f":"die Wirksamkeit (etkinlik, geçerlilik) · unwirksam (geçersiz) · die Wirkung (etki)"},{"w":"langsam","t":"Adjektiv","k":"lang + -sam","c":"—","br":"lang = uzun. Uzun sürme eğiliminde olan = yavaş. -sam ekinin sıfata eklendiği ender örnek.","tr":"yavaş","s":"Der Vorgang kommt nur langsam voran.","st":"İşlem ancak yavaş ilerliyor.","f":"die Langsamkeit (yavaşlık) · verlangsamen (yavaşlatmak)"},{"w":"fehlerhaft","t":"Adjektiv","k":"Fehler + -haft","c":"—","br":"-haft = „…niteliğini taşıyan“ (haben ile akraba). Hata taşıyan = hatalı.","tr":"hatalı, kusurlu","s":"Die Rechnung ist fehlerhaft — da stimmt etwas nicht.","st":"Fatura hatalı, burada bir şey tutmuyor.","f":"der Fehler (hata) · fehlerfrei (hatasız) · die Fehlerhaftigkeit (kusurluluk)"},{"w":"dauerhaft","t":"Adjektiv","k":"Dauer + -haft","c":"—","br":"Dauer süredir (dauern: sürmek); -haft eki „o niteliği taşıyan“ katar. Yani zaman içinde tutunan, geçici olmayan. Karşıtları vorübergehend ve befristet; yakını nachhaltig — o etkinin sürmesini vurgular, dauerhaft ise şeyin kendisinin sürmesini.","tr":"kalıcı, sürekli","s":"Wir suchen eine dauerhafte Lösung, kein Provisorium.","st":"Kalıcı bir çözüm arıyoruz, geçici bir şey değil.","f":"dauern (sürmek) · die Dauer (süre) · andauernd (sürekli)"},{"w":"vorteilhaft","t":"Adjektiv","k":"Vorteil (vor + Teil) + -haft","c":"—","br":"Vorteil = önde olan pay = avantaj (karşıtı Nachteil: arkada kalan pay).","tr":"avantajlı, elverişli","s":"Diese Regelung ist für Mieter besonders vorteilhaft.","st":"Bu düzenleme kiracılar için özellikle avantajlı.","f":"der Vorteil (avantaj) · der Nachteil (dezavantaj) · nachteilig (dezavantajlı)"},{"w":"gesetzlich","t":"Adjektiv","k":"Gesetz + -lich","c":"—","br":"-lich = „…ile ilgili, …e ait“. Gesetz (setzen kökünden: konulmuş kural) → yasaya ilişkin.","tr":"yasal, kanuni","s":"Der gesetzliche Urlaubsanspruch beträgt 20 Tage.","st":"Yasal izin hakkı 20 gündür.","f":"das Gesetz (yasa) · setzen (koymak, oturtmak) · gesetzwidrig (yasaya aykırı)"},{"w":"beruflich","t":"Adjektiv","k":"Beruf + -lich","c":"—","br":"Beruf = be+rufen: kişinin çağrıldığı iş = meslek. -lich: mesleğe ilişkin.","tr":"mesleki, iş ile ilgili","s":"Aus beruflichen Gründen kann ich den Termin nicht wahrnehmen.","st":"Mesleki nedenlerle randevuya katılamıyorum.","f":"der Beruf (meslek) · berufstätig (çalışan) · die Berufung (çağrı, itiraz yolu)"},{"w":"gründlich","t":"Adjektiv","k":"Grund + -lich","c":"—","br":"Grund dip ve temeldir; -lich onu niteliğe çevirir: dibe kadar inen. Yani yüzeyde kalmayan çalışma. Yakınları sorgfältig (özenli) ve ausführlich (ayrıntılı); farkı derinliktir — gründlich işin köküne iner.","tr":"iyice, esaslı, derinlemesine","s":"Ich muss die Wohnung mal wieder gründlich putzen.","st":"Evi bir kez daha iyice temizlemem lazım.","f":"der Grund (sebep, temel) · begründen (gerekçelendirmek) · grundsätzlich (ilke olarak)"},{"w":"ausschließlich","t":"Adverb / Adjektiv","k":"aus + schließen + -lich","c":"—","br":"ausschließen = dışarıda bırakmak. Diğer her şeyi dışarıda bırakan = yalnızca.","tr":"yalnızca, sadece","s":"Der Raum wird ausschließlich für Prüfungen genutzt.","st":"Bu oda yalnızca sınavlar için kullanılıyor.","f":"ausschließen (hariç tutmak) · der Ausschluss (hariç tutma) · einschließlich (dahil)"},{"w":"sorgfältig","t":"Adjektiv","k":"Sorge (kaygı) + Falte/falten + -ig","c":"—","br":"Sorgfalt = kaygıyı katlayarak taşımak = özen. Hukukta Sorgfaltspflicht: özen yükümlülüğü.","tr":"özenli, itinalı","s":"Lies den Vertrag sorgfältig durch, bevor du unterschreibst.","st":"İmzalamadan önce sözleşmeyi dikkatle oku.","f":"die Sorgfalt (özen) · die Sorge (kaygı; bakım) · sorgfältigst (en büyük özenle)"},{"w":"geeignet","t":"Adjektiv + für (A)","k":"ge + eignen (uygun kılmak)","c":"—","br":"eigen = kendine ait; sich eignen = bir işe kendine uygun düşmek. Partizip biçimi sıfat olmuş.","tr":"uygun, elverişli","s":"Dieses Verfahren ist für unseren Fall nicht geeignet.","st":"Bu yöntem bizim durumumuz için uygun değil.","f":"sich eignen (uygun olmak) · die Eignung (uygunluk, yeterlilik) · der Eignungstest (yetenek testi)"}]},{"n":"Son ekler: isim üretenler","e":"-ung · -heit/-keit · -schaft · -nis · -tum","c":"#c96a1e","g":"Son ekler","cards":[{"w":"die Kündigung","t":"Nomen, -en","k":"kündigen + -ung","c":"die Kündigung, die Kündigungen","br":"-ung fiili sürece/eyleme çevirir ve daima dişildir. kündigen (kund = bilinen; bildirmek) → bildirim yoluyla sona erdirme.","tr":"fesih, işten çıkarma bildirimi","s":"Die Kündigung muss schriftlich und fristgerecht erfolgen.","st":"Fesih yazılı ve süresine uygun yapılmalıdır.","f":"kündigen (feshetmek) · die Kündigungsfrist (fesih süresi) · unkündbar (feshedilemez)"},{"w":"die Verpflichtung","t":"Nomen, -en","k":"ver + Pflicht (görev) + -ung","c":"die Verpflichtung, die Verpflichtungen","br":"Pflicht = görev; verpflichten = birini göreve bağlamak; -ung o bağlanmanın kendisi.","tr":"yükümlülük","s":"Aus dem Vertrag ergeben sich mehrere Verpflichtungen.","st":"Sözleşmeden birden fazla yükümlülük doğuyor.","f":"die Pflicht (görev, yükümlülük) · verpflichten (yükümlü kılmak) · pflichtbewusst (görev bilinci olan)"},{"w":"die Genehmigung","t":"Nomen, -en","k":"genehmigen (genehm = uygun) + -ung","c":"die Genehmigung, die Genehmigungen","br":"genehm = hoşa giden, uygun. Bir şeyi uygun bulma eylemi = izin, onay. Bau- ile birleşince ruhsat.","tr":"izin, onay, ruhsat","s":"Für den Umbau ist eine Genehmigung des Bauamts erforderlich.","st":"Tadilat için imar dairesinin izni gerekiyor.","f":"genehmigen (onaylamak) · die Baugenehmigung (yapı ruhsatı) · genehmigungspflichtig (izne tabi)"},{"w":"die Zuständigkeit","t":"Nomen, -en","k":"zu + stehen → zuständig + -keit","c":"die Zuständigkeit, die Zuständigkeiten","br":"-heit/-keit sıfatı soyut isme çevirir (daima dişil). zuständig = bir işin başında duran = yetkili.","tr":"yetki, görev alanı","s":"Für diesen Antrag liegt die Zuständigkeit beim Ordnungsamt.","st":"Bu başvuruda yetki zabıta dairesindedir.","f":"zuständig (yetkili) · der Zuständigkeitsbereich (görev alanı) · stehen (durmak)"},{"w":"die Sicherheit","t":"Nomen, -en","k":"sicher + -heit","c":"die Sicherheit, die Sicherheiten","br":"-heit ünsüzle biten kısa sıfatlarda, -keit ise -ig/-lich/-bar ile bitenlerde kullanılır: sicher→Sicherheit, möglich→Möglichkeit.","tr":"güvenlik; kesinlik; teminat","s":"Mit Sicherheit lässt sich das erst nach der Prüfung sagen.","st":"Bu kesin olarak ancak incelemeden sonra söylenebilir.","f":"sicher (güvenli; emin) · versichern (sigortalamak; temin etmek) · die Versicherung (sigorta)"},{"w":"die Bereitschaft","t":"Nomen, -en","k":"bereit (hazır) + -schaft","c":"die Bereitschaft, die Bereitschaften","br":"-schaft bir durumu veya topluluğu adlandırır (schaffen ile akraba: yaratılmış hâl). bereit → hazır olma hâli.","tr":"hazır olma, isteklilik, nöbet","s":"Er zeigte keine Bereitschaft, den Fehler zu korrigieren.","st":"Hatayı düzeltmeye hiç istekli görünmedi.","f":"bereit (hazır) · die Freundschaft (dostluk) · die Wissenschaft (bilim)"},{"w":"die Eigenschaft","t":"Nomen, -en","k":"eigen (kendine ait) + -schaft","c":"die Eigenschaft, die Eigenschaften","br":"eigen „kendine ait, öz“ demektir; -schaft eki bir durumu ya da topluluğu adlandırır. Yani bir şeyin kendine ait olan yanı = özellik. İkinci anlamı sıfattır: in seiner Eigenschaft als Klassenlehrer. Aileden das Eigentum, eigentlich.","tr":"özellik, nitelik; sıfat (rol)","s":"In seiner Eigenschaft als Klassenlehrer hat er das Gespräch geführt.","st":"Sınıf öğretmeni sıfatıyla görüşmeyi o yürüttü.","f":"eigen (kendine ait, öz) · das Eigentum (mülkiyet) · eigentlich (aslında)","m":[{"tr":"özellik, nitelik","s":"Diese Eigenschaft macht das Material besonders widerstandsfähig.","st":"Bu özellik malzemeyi özellikle dayanıklı kılıyor."}]},{"w":"das Ergebnis","t":"Nomen, -se","k":"ergeben + -nis","c":"das Ergebnis, die Ergebnisse","br":"-nis fiilden sonucu ya da durumu üretir; çoğu nötr, bazıları dişil (die Erlaubnis). ergeben = ortaya çıkarmak.","tr":"sonuç","s":"Das Ergebnis der Prüfung liegt noch nicht vor.","st":"Sınavın sonucu henüz elde değil.","f":"sich ergeben (doğmak) · die Erkenntnis (kavrayış, bulgu) · das Verständnis (anlayış)"},{"w":"das Hindernis","t":"Nomen, -se","k":"hindern (engellemek) + -nis","c":"das Hindernis, die Hindernisse","br":"hindern engellemektir; -nis eki fiilden somut sonuç üretir. Yani engelleyen şeyin kendisi. Aynı ekle das Ergebnis, das Verständnis, das Bedürfnis. Aileden verhindern (önlemek) ve die Behinderung (engel).","tr":"engel","s":"Die fehlende Zustimmung war das größte Hindernis.","st":"Eksik onay en büyük engeldi.","f":"hindern (engellemek) · verhindern (önlemek) · behindert (engelli)"},{"w":"das Bedürfnis","t":"Nomen, -se","k":"be + dürfen + -nis","c":"das Bedürfnis, die Bedürfnisse","br":"bedürfen = ihtiyaç duymak (dürfen: izin/gereklilik kökü). Sonuç ismi: ihtiyaç.","tr":"ihtiyaç, gereksinim","s":"Die Wohnung entspricht nicht den Bedürfnissen einer Familie.","st":"Daire bir ailenin ihtiyaçlarını karşılamıyor.","f":"bedürfen (ihtiyaç duymak) · bedürftig (muhtaç) · das Grundbedürfnis (temel ihtiyaç)"},{"w":"das Eigentum","t":"Nomen (çoğulsuz)","k":"eigen + -tum","c":"das Eigentum","br":"-tum bir alanı ya da hâli adlandırır (Reichtum, Wachstum, Bürgertum). eigen → sahip olunan alan = mülkiyet. Besitz (zilyetlik) ile karıştırma.","tr":"mülkiyet, mülk","s":"Das Grundstück steht im Eigentum der Stadt.","st":"Arsa şehrin mülkiyetinde.","f":"eigen (kendine ait, öz) · der Eigentümer (mülk sahibi) · der Besitz (zilyetlik)"},{"w":"das Wachstum","t":"Nomen (çoğulsuz)","k":"wachsen + -tum","c":"das Wachstum","br":"wachsen büyümektir; -tum eki süreci ya da alanı adlandırır — daima nötr: das Wachstum, das Eigentum, das Reichtum. Ekonomide artış, biyolojide büyüme demektir. Sıfatı yoktur; onun yerine wachsend (artmakta olan) kullanılır.","tr":"büyüme, artış","s":"Das Wachstum hat sich im zweiten Quartal verlangsamt.","st":"Büyüme ikinci çeyrekte yavaşladı.","f":"wachsen (büyümek) · erwachsen (yetişkin) · das Bevölkerungswachstum (nüfus artışı)"},{"w":"das Gespräch","t":"Nomen, -e","k":"Ge- + sprechen","c":"das Gespräch, die Gespräche","br":"Ge- ön eki isimde toplu/tekrarlı bir bütün kurar: Ge+sprechen = konuşmanın bütünü. Aynı mantık: Gebäude, Gebirge, Gerede.","tr":"konuşma, görüşme","s":"Das Gespräch mit der Schulleitung verlief konstruktiv.","st":"Okul yönetimiyle görüşme yapıcı geçti.","f":"sprechen (konuşmak) · gesprächig (konuşkan) · das Gebäude (bina) · das Gebirge (dağ silsilesi)"},{"w":"der Lehrling","t":"Nomen, -e","k":"lehren + -ling","c":"der Lehrling, die Lehrlinge","br":"-ling bir niteliğin taşıyıcısı olan kişiyi üretir ve daima erildir: Lehrling, Frühling, Neuling.","tr":"çırak, stajyer (bugün: Auszubildende)","s":"Der Betrieb bildet jedes Jahr zwei Lehrlinge aus.","st":"İşletme her yıl iki çırak yetiştiriyor.","f":"lehren (öğretmek) · die Lehre (meslek eğitimi; öğreti) · der Neuling (acemi, yeni gelen)"}]},{"n":"Bileşik kelime mantığı","e":"Fugen-s, son kelime kuralı, kısaltmalar","c":"#495867","g":"Son ekler","cards":[{"w":"der Wasserhahn","t":"Nomen, ¨-e","k":"Wasser (su) + Hahn (horoz, musluk)","c":"der Wasserhahn, die Wasserhähne","br":"Temel kural: bileşiğin SON kelimesi cinsi, çoğulu ve asıl anlamı belirler. das Wasser + der Hahn → der Wasserhahn. Baştaki kelime yalnızca tarif eder: hangi horoz? su horozu.","tr":"musluk","s":"Der Wasserhahn in der Küche tropft seit Wochen.","st":"Mutfaktaki musluk haftalardır damlıyor.","f":"das Grundwort (belirleyici son kelime) · das Bestimmungswort (niteleyen ilk kelime) · der Hahn (horoz; musluk)"},{"w":"der Arbeitsplatz","t":"Nomen, ¨-e","k":"Arbeit + s + Platz","c":"der Arbeitsplatz, die Arbeitsplätze","br":"Araya giren -s bağlantı sesidir (Fugen-s), iyelik değildir. Telaffuzu kolaylaştırır: Arbeitplatz demek zordur, Arbeitsplatz akar.","tr":"iş yeri, çalışma yeri; istihdam","s":"In der Region sind über tausend Arbeitsplätze entstanden.","st":"Bölgede binden fazla istihdam oluştu.","f":"die Arbeit (iş) · der Platz (yer) · das Fugen-s (bağlantı s’si)"},{"w":"die Verwaltungsgebühr","t":"Nomen, -en","k":"Verwaltung + s + Gebühr","c":"die Verwaltungsgebühr, -en","br":"Kural: -ung, -heit, -keit, -schaft, -ion, -tät ile biten kelimelerden sonra Fugen-s DAİMA gelir. Bu tek kural yüzlerce bileşiği güvenle kurmanı sağlar.","tr":"yönetim harcı","s":"Für die Bearbeitung wird eine Verwaltungsgebühr erhoben.","st":"İşlem için bir yönetim harcı alınıyor.","f":"die Verwaltung (idare) · die Gebühr (harç, ücret) · gebührenfrei (harçsız)"},{"w":"die Sicherheitsvorkehrung","t":"Nomen, -en","k":"Sicherheit + s + Vorkehrung","c":"die Sicherheitsvorkehrung, -en","br":"Aynı kural işbaşında: -heit → -s zorunlu. Vorkehrung = vor + kehren (çevirmek): önceden çevrilip hazırlanan tedbir.","tr":"güvenlik önlemi","s":"Am Flughafen gelten strenge Sicherheitsvorkehrungen.","st":"Havaalanında sıkı güvenlik önlemleri geçerli.","f":"die Sicherheit (güvenlik) · die Vorkehrung (tedbir) · Vorkehrungen treffen (önlem almak)"},{"w":"die Straßenbahn","t":"Nomen, -en","k":"Straße + n + Bahn","c":"die Straßenbahn, -en","br":"İkinci bağlantı biçimi: -n. Kural basit — ilk kelimenin çoğul hâli -n alıyorsa bileşikte de -n girer: Straße/Straßen → Straßenbahn.","tr":"tramvay","s":"Die Straßenbahn fährt alle zehn Minuten.","st":"Tramvay on dakikada bir kalkıyor.","f":"die Straße (cadde) · die Bahn (yol; tren) · die Fugen-n (bağlantı n’si)"},{"w":"der Familienname","t":"Nomen, -n","k":"Familie + n + Name","c":"der Familienname, die Familiennamen","br":"Aynı -n kuralı: Familie/Familien. Ayrıca dikkat — der Name zayıf çekimlidir: des Namens, dem Namen.","tr":"soyadı","s":"Bitte tragen Sie Vor- und Familiennamen getrennt ein.","st":"Lütfen adı ve soyadını ayrı ayrı yazın.","f":"die Familie (aile) · der Name (ad) · der Vorname (ön ad)"},{"w":"das Klassenzimmer","t":"Nomen, -","k":"Klasse + n + Zimmer","c":"das Klassenzimmer, die -zimmer","br":"Klasse/Klassen → Klassenzimmer. Son kelime das Zimmer olduğu için bileşik de nötr: das Klassenzimmer.","tr":"sınıf (mekân)","s":"Das Klassenzimmer wird über Mittag gelüftet.","st":"Sınıf öğle arasında havalandırılıyor.","f":"die Klasse (sınıf) · das Zimmer (oda) · der Klassenraum (derslik)"},{"w":"die Tageszeitung","t":"Nomen, -en","k":"Tag + es + Zeitung","c":"die Tageszeitung, -en","br":"Üçüncü bağlantı biçimi: -es. Genelde tek heceli eril ve nötr isimlerde: Tag → Tageszeitung, Land → Landeshauptstadt, Jahr → Jahresende.","tr":"günlük gazete","s":"Die Meldung stand gestern in mehreren Tageszeitungen.","st":"Haber dün birkaç günlük gazetede yer aldı.","f":"der Tag (gün) · die Zeitung (gazete) · das Jahresende (yıl sonu)"},{"w":"der Handschuh","t":"Nomen, -e","k":"Hand + Schuh (bağlantı sesi yok)","c":"der Handschuh, die Handschuhe","br":"Bağlantı sesi hep gerekmez: Hand + Schuh doğrudan birleşir. „El ayakkabısı“ — Almancanın somut mantığı: eldiven.","tr":"eldiven","s":"Im Chemieraum sind Handschuhe vorgeschrieben.","st":"Kimya sınıfında eldiven zorunlu.","f":"die Hand (el) · der Schuh (ayakkabı) · das Handtuch (havlu: el bezi)"},{"w":"der Tagesordnungspunkt","t":"Nomen, -e","k":"Tag + es + Ordnung + s + Punkt","c":"der Tagesordnungspunkt, -e","br":"Katmanlı bileşik: (Tages+ordnung) + s + Punkt. Uzun kelimeleri sağdan sola okumak çözer: hangi Punkt? — Tagesordnung’un maddesi. Kısaltması: TOP 3.","tr":"gündem maddesi","s":"Wir kommen jetzt zu Tagesordnungspunkt vier.","st":"Şimdi dördüncü gündem maddesine geçiyoruz.","f":"die Tagesordnung (gündem) · der Punkt (nokta, madde) · TOP (gündem maddesi kısaltması)"},{"w":"die Rechtsschutzversicherung","t":"Nomen, -en","k":"Recht + s + Schutz + Versicherung","c":"die Rechtsschutzversicherung, -en","br":"Sağdan sola çöz: Versicherung (sigorta) → neyin? Rechtsschutz (hukuki koruma) → neyin? Recht. Üç parçalı dev kelimeler böyle okunur.","tr":"hukuki koruma sigortası","s":"Ohne Rechtsschutzversicherung ist ein Prozess ein finanzielles Risiko.","st":"Hukuki koruma sigortası olmadan dava mali bir risktir.","f":"der Schutz (koruma) · schützen (korumak) · die Versicherung (sigorta)"},{"w":"die E-Mail-Adresse","t":"Nomen, -n","k":"E-Mail + Bindestrich + Adresse","c":"die E-Mail-Adresse, -n","br":"Kısa çizgi kuralı: yabancı kelime, tek harf ya da kısaltma içeren bileşiklerde araya çizgi girer — E-Mail-Adresse, Kfz-Kennzeichen, DIN-Norm, 3-Zimmer-Wohnung.","tr":"e-posta adresi","s":"Bitte geben Sie Ihre E-Mail-Adresse leserlich an.","st":"Lütfen e-posta adresinizi okunaklı yazın.","f":"die Adresse (adres) · das Kfz-Kennzeichen (araç plakası) · der Bindestrich (kısa çizgi)"},{"w":"die Kita","t":"Nomen, -s","k":"Kinder + tagesstätte kısaltması","c":"die Kita, die Kitas","br":"Kurzwort mantığı: uzun bileşiğin parçalarından hece alınır. Kinder-tages-stätte → Kita. Aynı yolla: Azubi (Auszubildende), Uni, Abi.","tr":"kreş, gündüz bakımevi","s":"Unser Sohn geht seit September in die Kita.","st":"Oğlumuz eylülden beri kreşe gidiyor.","f":"die Kindertagesstätte (gündüz bakımevi) · der Azubi (çırak) · das Abi (lise bitirme sınavı)"},{"w":"der Pkw / der Lkw","t":"Nomen, -s","k":"Personenkraftwagen / Lastkraftwagen","c":"der Pkw, die Pkws","br":"Kısaltmayı açınca anlam kendiliğinden çıkar: Personen-kraft-wagen = kişi taşıyan güç arabası, Last-kraft-wagen = yük arabası. Kraft (güç) ortak parçadır — motorlu taşıt demenin eski yolu. Aynı mantık: das Kfz (Kraftfahrzeug).","tr":"otomobil / kamyon","s":"Vor dem Haus dürfen nur Pkw parken.","st":"Evin önüne yalnızca otomobiller park edebilir.","f":"der Wagen (araba) · die Last (yük) · die Kraft (güç)"}]},{"n":"Son ekler: -los · -voll · -mäßig · -weise","e":"yokluk · doluluk · ölçü · tarz","c":"#0d8ab5","g":"Son ekler","cards":[{"w":"mühelos","t":"Adjektiv","k":"Mühe (zahmet) + -los","c":"—","br":"Mühe zahmet ve emektir; -los eki yokluk bildirir (İngilizce -less ile aynı kök). Yani hiç zorlanmadan. Karşıtı mühsam: aynı kökten ama -sam ile, „zahmet gerektiren“. Tek kök, iki ek, iki zıt anlam.","tr":"zahmetsiz, kolayca","s":"Sie hat die Aufgabe mühelos gelöst.","st":"Görevi zahmetsizce çözdü.","f":"die Mühe (zahmet) · sich Mühe geben (çaba göstermek) · mühsam (zahmetli)"},{"w":"rücksichtslos","t":"Adjektiv","k":"Rücksicht + -los","c":"—","br":"Rücksicht „geriye bakış“tır: dönüp arkanda kalanı görmek, yani başkasını gözetmek. -los eki bu bakışı tamamen kaldırır. Almanya’da ağır bir sitemdir; karşıtı rücksichtsvoll, fiili berücksichtigen (dikkate almak).","tr":"düşüncesiz, pervasız","s":"Er hat sich gegenüber den Nachbarn rücksichtslos verhalten.","st":"Komşulara karşı pervasızca davrandı.","f":"die Rücksicht (gözetme, nezaket) · rücksichtsvoll (düşünceli) · berücksichtigen (dikkate almak)"},{"w":"zweifellos","t":"Adverb","k":"Zweifel + -los","c":"—","br":"Zweifel şüphedir ve kökünde zwei (iki) vardır: iki seçenek arasında kalmak. -los onu ortadan kaldırır. Yazı dilinde ohne Zweifel yerine tek kelime olarak kullanılır; yakınları zweifelsohne ve fraglos.","tr":"şüphesiz, kuşkusuz","s":"Das ist zweifellos der wichtigste Punkt des Schreibens.","st":"Bu, yazının kuşkusuz en önemli noktası.","f":"der Zweifel (şüphe) · bezweifeln (şüphe duymak) · zweifelhaft (şüpheli)"},{"w":"anspruchsvoll","t":"Adjektiv","k":"Anspruch (an + sprechen) + -voll","c":"—","br":"Anspruch = birinden talep edilen hak / iddia. -voll = dolu: talebi yüksek olan = zorlu, seçici.","tr":"zorlu, iddialı, talepkâr","s":"Der Kurs ist sprachlich sehr anspruchsvoll.","st":"Kurs dil açısından çok zorlu.","f":"der Anspruch (hak talebi) · Anspruch haben auf (hakkı olmak) · anspruchslos (iddiasız)"},{"w":"eindrucksvoll","t":"Adjektiv","k":"Eindruck (ein + drücken) + -voll","c":"—","br":"Eindruck „içeri basılan iz“dir (ein + drücken) — izlenim, mühür gibi düşünülmüştür. -voll eki onu doldurur: iz bırakan, etkileyici. Aileden beeindrucken (etkilemek) ve der Druck (baskı).","tr":"etkileyici","s":"Sie hat ihre Position eindrucksvoll verteidigt.","st":"Konumunu etkileyici biçimde savundu.","f":"der Eindruck (izlenim) · beeindrucken (etkilemek) · beeindruckend (etkileyici)"},{"w":"regelmäßig","t":"Adjektiv / Adverb","k":"Regel + -mäßig","c":"—","br":"Regel kural, Maß ölçüdür; -mäßig eki „o ölçüye göre“ demektir. Yani kurala uygun aralıklarla tekrarlanan. Aynı ekle verhältnismäßig, planmäßig, ordnungsgemäß. Karşıtı unregelmäßig; yakını häufig (sık).","tr":"düzenli, düzenli olarak","s":"Ich gehe dreimal die Woche regelmäßig laufen.","st":"Haftada üç kez düzenli olarak koşuyorum.","f":"die Regel (kural) · das Maß (ölçü) · unregelmäßig (düzensiz)"},{"w":"verhältnismäßig","t":"Adjektiv / Adverb","k":"Verhältnis (oran) + -mäßig","c":"—","br":"Verhältnis = iki şeyin birbirine oranı. Orana uygun = ölçülü, orantılı. Hukukta temel ilke.","tr":"orantılı; nispeten","s":"Die Maßnahme muss verhältnismäßig sein.","st":"Tedbir orantılı olmak zorundadır.","f":"das Verhältnis (oran; ilişki) · die Verhältnismäßigkeit (orantılılık) · unverhältnismäßig (orantısız)"},{"w":"planmäßig","t":"Adjektiv / Adverb","k":"Plan + -mäßig","c":"—","br":"Plana göre = tarifeye uygun. Tren ve uçak duyurularının standart kelimesi.","tr":"planlandığı gibi, tarifesinde","s":"Der Zug fährt planmäßig um 7:42 Uhr ab.","st":"Tren tarifesine uygun olarak 7:42’de kalkıyor.","f":"der Plan (plan) · außerplanmäßig (plan dışı) · die Planmäßigkeit (plana uygunluk)"},{"w":"beispielsweise","t":"Adverb","k":"Beispiel + -s- + -weise","c":"—","br":"-weise = „…tarzında, …yoluyla“ (Weise = tarz). Örnek yoluyla = örneğin. Yazı dilinde z. B. yerine.","tr":"örneğin","s":"Zu den umlagefähigen Kosten zählen beispielsweise Müllabfuhr und Grundsteuer.","st":"Yansıtılabilir masraflara örneğin çöp toplama ve emlak vergisi dahildir.","f":"das Beispiel (örnek) · die Weise (tarz, biçim) · zum Beispiel (örneğin)"},{"w":"teilweise","t":"Adverb","k":"Teil + -weise","c":"—","br":"Teil parçadır; -weise eki „tarzında, biçiminde“ katar (Weise: tarz). Yani bütün değil, parça parça. Aynı kalıptan schrittweise, stückweise, ausnahmsweise. Resmî yazıda kısmen kabul bildirmenin kelimesidir: teilweise stattgegeben.","tr":"kısmen","s":"Die Serie habe ich nur teilweise gesehen.","st":"Diziyi yalnızca kısmen izledim.","f":"der Teil (parça, bölüm) · anteilig (pay oranında) · der Anteil (pay)"},{"w":"möglicherweise","t":"Adverb","k":"möglich + -er- + -weise","c":"—","br":"Mümkün olan tarzda = muhtemelen. Sıfat + -erweise kalıbı cümleye ihtimal katar.","tr":"muhtemelen, belki","s":"Möglicherweise liegt ein Übertragungsfehler vor.","st":"Muhtemelen bir aktarım hatası var.","f":"möglich (mümkün) · die Möglichkeit (olanak) · glücklicherweise (bereket versin)"},{"w":"schrittweise","t":"Adverb / Adjektiv","k":"Schritt + -weise","c":"—","br":"Schritt adımdır; -weise onu tarza çevirir: adım adım ilerleyen. Bir anda değil, kademeli. Yakınları allmählich (yavaş yavaş) ve nach und nach; farkı planlı oluşudur — schrittweise bir sıra izler.","tr":"adım adım, kademeli","s":"Wir gewöhnen den Hund schrittweise an das Alleinsein.","st":"Köpeği yalnız kalmaya adım adım alıştırıyoruz.","f":"der Schritt (adım) · schrittweise Einführung (kademeli geçiş)"},{"w":"erfolgreich","t":"Adjektiv","k":"Erfolg + -reich","c":"—","br":"-reich = „…bakımından zengin“. Erfolg = er+folgen: sonucun ardından gelmesi = başarı.","tr":"başarılı","s":"Der Antrag war überraschend schnell erfolgreich.","st":"Başvuru şaşırtıcı biçimde hızlı sonuç verdi.","f":"der Erfolg (başarı) · erfolglos (başarısız) · folgen (takip etmek; uymak)"},{"w":"einflussreich","t":"Adjektiv","k":"Einfluss + -reich","c":"—","br":"Einfluss = ein + fließen, yani „içeri akan“: etki. -reich eki „o bakımdan zengin“ katar. Yani etkisi çok olan, sözü geçen. Aynı kalıptan erfolgreich, hilfreich, zahlreich; karşıtı -arm ve -los ekleridir.","tr":"nüfuzlu, etkili","s":"Er gilt in der Kommission als einflussreich.","st":"Komisyonda nüfuzlu biri sayılıyor.","f":"der Einfluss (etki) · beeinflussen (etkilemek) · einflusslos (etkisiz, nüfuzsuz)"},{"w":"fehlerfrei","t":"Adjektiv","k":"Fehler + -frei","c":"—","br":"-frei = „…dan arınmış, …siz“. -los daha çok eksikliği, -frei ise istenmeyen şeyden kurtulmuşluğu anlatır.","tr":"hatasız","s":"Der Text ist nahezu fehlerfrei.","st":"Metin neredeyse hatasız.","f":"kostenfrei (ücretsiz) · schadstofffrei (zararlı madde içermeyen) · der Fehler (hata)"},{"w":"risikoarm","t":"Adjektiv","k":"Risiko + -arm","c":"—","br":"-arm eki „…bakımından fakir“ demektir ve -reich’ın tam karşıtıdır: kalorienarm, nährstoffarm, einkommensschwach. Yani riski az olan. Sıralama: risikofrei > risikoarm > riskant.","tr":"düşük riskli","s":"Sie bevorzugt risikoarme Anlagen.","st":"Düşük riskli yatırımları tercih ediyor.","f":"kalorienarm (düşük kalorili) · nährstoffreich (besin değeri yüksek) · arm (fakir; az)"}]},{"n":"Kök zincirleri: temel fiiller I","e":"tragen → beantragen → der Antrag","c":"#1e6b4f","g":"Kök aileleri","cards":[{"w":"Zincir: tragen","t":"Kök zinciri","k":"tragen → vortragen → beantragen → der Antrag","c":"trägt – trug – hat getragen","br":"Somut hareket soyuta açılıyor: taşımak → düşünceyi karşıya taşımak (sunmak) → talebi mercie taşımak (başvurmak) → taşınan talebin kendisi (başvuru). Ön ek yönü, son ek kelime türünü değiştiriyor.","tr":"taşımak → sunmak → başvurmak → başvuru","s":"Ich habe den Antrag gestellt, nachdem ich die Idee im Kollegium vorgetragen hatte.","st":"Fikri öğretmenler kurulunda sunduktan sonra başvuruyu yaptım.","f":"der Vertrag (sözleşme) · der Auftrag (görev) · der Beitrag (katkı) · der Ertrag (getiri) · betragen (tutmak) · ertragen (katlanmak)"},{"w":"Zincir: ziehen","t":"Kök zinciri","k":"ziehen → erziehen → die Erziehung / beziehen → der Bezug","c":"zieht – zog – hat gezogen","br":"Çekmek fiili yönüne göre başka bir hayata giriyor: çocuğu belli yöne çeke çeke yetiştirmek (erziehen), bir şeyi kendine çekip ilişki kurmak (beziehen), öne çekip tercih etmek (vorziehen), çekip almak (entziehen).","tr":"çekmek → yetiştirmek → terbiye / ilişkilendirmek → atıf","s":"Erziehung heißt auch, Grenzen zu ziehen.","st":"Terbiye demek aynı zamanda sınır çizmek demek.","f":"der Vorzug (üstünlük) · der Entzug (geri alma) · der Umzug (taşınma) · der Auszug (alıntı; çıkış) · zügig (hızlı)"},{"w":"Zincir: stehen","t":"Kök zinciri","k":"stehen → verstehen → das Verständnis / bestehen → der Bestand","c":"steht – stand – hat gestanden","br":"„Durmak“ Almancada zihinsel hâlin de temeli: bir şeyin önünde doğru durabilmek = anlamak. Sağlam durmak = var olmak, sınavı geçmek; karşıda durmak = direnmek.","tr":"durmak → anlamak → anlayış / var olmak → mevcut","s":"Ich habe Verständnis dafür, aber die Regel besteht weiter.","st":"Bunu anlayışla karşılıyorum ama kural yürürlükte kalıyor.","f":"der Zustand (durum) · der Umstand (koşul) · der Widerstand (direnç) · die Entstehung (oluşum) · beständig (kalıcı)"},{"w":"Zincir: stellen","t":"Kök zinciri","k":"stellen → vorstellen → die Vorstellung / herstellen → die Herstellung","c":"stellt – stellte – hat gestellt","br":"„Dikmek, yerleştirmek“ nereye yerleştirdiğine göre anlam alıyor: önüne koymak (tanıtmak, hayal etmek), içine koymak (işe almak, ayarlamak), buraya koymak (üretmek), sipariş etmek.","tr":"koymak → tanıtmak → tasavvur / üretmek → üretim","s":"Darf ich mich kurz vorstellen? Ich habe da eine Frage.","st":"Kısaca kendimi tanıtabilir miyim? Bir sorum olacaktı.","f":"die Einstellung (tutum; ayar) · die Bestellung (sipariş) · die Anstellung (istihdam) · die Stellung (konum) · zustellen (tebliğ etmek)"},{"w":"Zincir: setzen","t":"Kök zinciri","k":"setzen → ersetzen → der Ersatz / voraussetzen → die Voraussetzung","c":"setzt – setzte – hat gesetzt","br":"Oturtmak fiili: yerine oturtmak (ikame), içine oturtmak (kullanmak), önceden oturtmak (ön koşul), öteye oturtmak (çevirmek). Gesetz de buradan: konulmuş kural.","tr":"koymak → yerine koymak → yedek / önceden koymak → ön koşul","s":"Ohne diese Voraussetzung lässt sich das Gerät nicht ersetzen.","st":"Bu ön koşul olmadan cihaz değiştirilemez.","f":"der Einsatz (gayret; kullanım) · der Absatz (paragraf; satış) · der Zusatz (ek) · das Gesetz (yasa) · die Umsetzung (hayata geçirme)"},{"w":"Zincir: legen","t":"Kök zinciri","k":"legen → vorlegen → die Vorlage / überlegen → die Überlegung","c":"legt – legte – hat gelegt","br":"legen yatay koymaktır ve ön ek koymanın yerini belirler: vor- birinin önüne (sunmak → die Vorlage), über- üst üste koyup tartmak (düşünmek → die Überlegung), aus- açıp sermek (yorumlamak), an- yanına koymak (kurmak → die Anlage).","tr":"koymak → sunmak → şablon / düşünmek → düşünce","s":"Nach kurzer Überlegung habe ich ihm den Plan vorgelegt.","st":"Kısa bir düşünmenin ardından planı ona sundum.","f":"die Grundlage (temel) · die Auflage (şart; baskı) · die Anlage (ek; tesis) · die Auslegung (yorum) · die Beilage (garnitür)"},{"w":"Zincir: geben","t":"Kök zinciri","k":"geben → angeben → die Angabe / ergeben → das Ergebnis","c":"gibt – gab – hat gegeben","br":"Vermek fiili yön aldıkça değişiyor: işaret ederek vermek (beyan etmek), dışarı vermek (harcamak), yukarı vermek (pes etmek), ortaya çıkarmak (sonuç doğurmak).","tr":"vermek → beyan etmek → beyan / doğurmak → sonuç","s":"Die Angaben im Formular ergeben zusammen ein klares Bild.","st":"Formdaki beyanlar bir araya gelince net bir tablo çıkıyor.","f":"die Ausgabe (gider; sayı) · die Übergabe (teslim) · die Vorgabe (talimat) · die Aufgabe (görev) · das Angebot (teklif)"},{"w":"Zincir: nehmen","t":"Kök zinciri","k":"nehmen → annehmen → die Annahme / ausnehmen → die Ausnahme","c":"nimmt – nahm – hat genommen","br":"Almak fiili: kendine almak (kabul etmek, varsaymak), dışarı almak (istisna), altına almak (girişmek), pay almak (katılmak).","tr":"almak → kabul etmek → varsayım / hariç tutmak → istisna","s":"Ich nehme an, dass es diesmal keine Ausnahme gibt.","st":"Sanırım bu kez istisna olmayacak.","f":"die Teilnahme (katılım) · die Einnahme (gelir) · das Unternehmen (şirket) · die Abnahme (azalma; kabul) · die Maßnahme (tedbir)"},{"w":"Zincir: halten","t":"Kök zinciri","k":"halten → verhalten → das Verhalten / enthalten → der Inhalt","c":"hält – hielt – hat gehalten","br":"Tutmak: kendini şu şekilde tutmak (davranmak), içinde tutmak (içermek), alttan tutmak (geçindirmek), bir yerde kendini tutmak (kalmak).","tr":"tutmak → davranmak → davranış / içermek → içerik","s":"Der Vertrag enthält nichts über das Verhalten bei Lärm.","st":"Sözleşmede gürültü hâlindeki davranışa dair bir şey yok.","f":"das Verhältnis (oran; ilişki) · der Unterhalt (nafaka) · der Aufenthalt (ikamet) · der Haushalt (hane; bütçe) · die Unterhaltung (sohbet)"},{"w":"Zincir: kommen","t":"Kök zinciri","k":"kommen → herkommen → die Herkunft / einkommen → das Einkommen","c":"kommt – kam – ist gekommen","br":"Gelmek fiili eski isim biçimiyle -kunft üretir: varış (Ankunft), köken (Herkunft), gelecek (Zukunft). İçeri gelen ise gelirdir.","tr":"gelmek → nereden gelmek → köken / içeri gelmek → gelir","s":"Seine Herkunft sagt nichts über sein Einkommen.","st":"Kökeni geliri hakkında hiçbir şey söylemez.","f":"die Ankunft (varış) · die Zukunft (gelecek) · das Abkommen (anlaşma) · vorkommen (rastlanmak) · nachkommen (yerine getirmek)"},{"w":"Zincir: gehen","t":"Kök zinciri","k":"gehen → vorgehen → der Vorgang / zugehen → der Zugang","c":"geht – ging – ist gegangen","br":"gehen gitmektir ve isim hâli -gang’dır. Ön ek yönü verir: vor- önde akan iş (der Vorgang: süreç), zu- bir şeye giden yol (der Zugang: erişim), über- üstünden geçiş (der Übergang), ein- içeri giriş (der Eingang).","tr":"gitmek → ilerlemek → süreç / ulaşmak → erişim","s":"Der Zugang ist frei, aber der ganze Vorgang dauert.","st":"Erişim serbest ama bütün süreç zaman alıyor.","f":"der Übergang (geçiş) · der Eingang (giriş) · der Ausgang (çıkış; sonuç) · der Umgang (muamele) · die Vergangenheit (geçmiş)"},{"w":"Zincir: fahren","t":"Kök zinciri","k":"fahren → erfahren → die Erfahrung / verfahren → das Verfahren","c":"fährt – fuhr – ist gefahren","br":"Yol almak: yol alarak öğrenmek (erfahren) ve yol boyunca birikeni saklamak (Erfahrung: tecrübe). Belli bir yolu izlemek ise usul olur: das Verfahren.","tr":"gitmek → öğrenmek → tecrübe / işlemek → usul","s":"Aus Erfahrung weiß ich, wie lange so ein Verfahren dauert.","st":"Tecrübeden biliyorum, böyle bir süreç ne kadar sürüyor.","f":"die Abfahrt (kalkış) · die Zufahrt (giriş yolu) · die Einfahrt (araç girişi) · erfahren (tecrübeli) · die Gefahr (tehlike)"},{"w":"Zincir: bringen","t":"Kök zinciri","k":"bringen → verbringen / vorbringen → beibringen","c":"bringt – brachte – hat gebracht","br":"Getirmek: zamanı taşıyıp tüketmek (geçirmek), öne getirmek (ileri sürmek), yanına getirmek (öğretmek), altına yerleştirmek (barındırmak).","tr":"getirmek → (zaman) geçirmek → ileri sürmek → öğretmek","s":"Wer hat dir eigentlich beigebracht, so gut zu kochen?","st":"Bu kadar iyi yemek yapmayı sana kim öğretti?","f":"unterbringen (yerleştirmek) · die Unterbringung (barınma) · umbringen (öldürmek) · verbringen (zaman geçirmek)"},{"w":"Zincir: laufen","t":"Kök zinciri","k":"laufen → verlaufen → der Verlauf / ablaufen → der Ablauf","c":"läuft – lief – ist gelaufen","br":"Koşmak/akmak: belli bir yönde akmak (seyretmek → seyir), sonuna kadar akmak (süresi dolmak → akış, işleyiş). Zamanla ilgili resmî kelimelerin çoğu bu kökten.","tr":"koşmak → seyretmek → seyir / dolmak → akış","s":"Der Ablauf war klar, aber der Abend ist ganz anders verlaufen.","st":"Akış nettü ama akşam bambaşka geçti.","f":"der Zulauf (rağbet) · die Laufbahn (kariyer) · unterlaufen (hata olmak) · laufend (süregelen)"}]},{"n":"Kök zincirleri: temel fiiller II","e":"sprechen → Anspruch, greifen → Begriff","c":"#7a3f6b","g":"Kök aileleri","cards":[{"w":"Zincir: sprechen","t":"Kök zinciri","k":"sprechen → ansprechen → der Anspruch / versprechen → das Versprechen","c":"spricht – sprach – hat gesprochen","br":"Söz kökü: birine yöneltilen söz hak talebine dönüşüyor (Anspruch), karşıya verilen söz vaat oluyor, karşıya konan söz itiraz ve çelişki oluyor (Widerspruch).","tr":"konuşmak → hitap etmek → hak talebi / söz vermek → vaat","s":"Er hat mir sein Wort gegeben — auf dieses Versprechen habe ich einen Anspruch.","st":"Bana söz verdi — bu vaat üzerinde hakkım var.","f":"der Widerspruch (itiraz; çelişki) · die Absprache (mutabakat) · die Aussprache (telaffuz) · entsprechen (uymak) · die Besprechung (toplantı)"},{"w":"Zincir: schreiben","t":"Kök zinciri","k":"schreiben → vorschreiben → die Vorschrift / unterschreiben → die Unterschrift","c":"schreibt – schrieb – hat geschrieben","br":"Yazmak: önüne yazıp uyulmasını istemek (kural), altına yazmak (imza), etrafında yazmak (dolaylı anlatım), reçete yazmak.","tr":"yazmak → zorunlu kılmak → yönetmelik / imzalamak → imza","s":"Ohne Unterschrift gilt das Formular nicht.","st":"İmza olmadan form geçerli değil.","f":"die Beschreibung (betimleme) · die Abschrift (suret) · verschreiben (reçete yazmak) · umschreiben (dolaylı anlatmak)"},{"w":"Zincir: sehen","t":"Kök zinciri","k":"sehen → absehen → die Absicht / einsehen → die Einsicht","c":"sieht – sah – hat gesehen","br":"Bakış kökü niyet ve kavrayış üretiyor: gözü hedefe dikmek (niyet), içine bakmak (kavrayış, dosya incelemesi), önceden bakmak (dikkat, tedbir), üstünden bakmak (gözetim).","tr":"görmek → hedeflemek → niyet / içine bakmak → kavrayış","s":"Mit Absicht hat er das sicher nicht gemacht.","st":"Bunu kasten yapmadığı kesin.","f":"die Vorsicht (dikkat) · die Aufsicht (gözetim) · die Übersicht (genel bakış) · absehbar (öngörülebilir) · die Rücksicht (gözetme)"},{"w":"Zincir: hören","t":"Kök zinciri","k":"hören → gehören → die Zugehörigkeit / anhören → die Anhörung","c":"hört – hörte – hat gehört","br":"Duymak kökü aidiyet üretiyor: birine „kulak vermek“ ondan sayılmaya dönüşüyor (gehören: ait olmak). Resmî dilde ise dinlenme hakkı: die Anhörung.","tr":"duymak → ait olmak → aidiyet / dinlemek → dinlenme","s":"Das Fahrrad gehört mir, auch wenn es anders aussieht.","st":"Bisiklet benim, başka türlü görünse de.","f":"zuhören (kulak vermek) · aufhören (son vermek) · der Zuhörer (dinleyici) · die Zugehörigkeit (aidiyet)"},{"w":"Zincir: fallen","t":"Kök zinciri","k":"fallen → auffallen → auffällig / zufallen → der Zufall","c":"fällt – fiel – ist gefallen","br":"Düşmek: algının üstüne düşmek (dikkat çekmek), payına düşmek (tesadüf — „başına düşen“), programın dışına düşmek (iptal), gözden düşmek (hoşa gitmemek).","tr":"düşmek → göze çarpmak → dikkat çekici / paya düşmek → tesadüf","s":"Es war reiner Zufall, dass mir der Fehler aufgefallen ist.","st":"Hatanın gözüme çarpması tamamen tesadüftü.","f":"der Ausfall (iptal; arıza) · der Vorfall (olay) · entfallen (düşmek; iptal olmak) · gefallen (hoşa gitmek)"},{"w":"Zincir: werfen","t":"Kök zinciri","k":"werfen → vorwerfen → der Vorwurf / entwerfen → der Entwurf","c":"wirft – warf – hat geworfen","br":"Atmak: birinin önüne atmak (suçlama), dışarı atmak (taslak), reddedip atmak (verwerfen). Somut hareketten üç ayrı soyut kavram.","tr":"atmak → suçlamak → suçlama / tasarlamak → taslak","s":"Statt Vorwürfe zu machen, hat sie einen Entwurf mitgebracht.","st":"Suçlamak yerine bir taslak getirdi.","f":"verwerfen (reddetmek) · der Wurf (atış) · unterwerfen (boyun eğdirmek) · vorwurfsvoll (sitemkâr)"},{"w":"Zincir: schlagen","t":"Kök zinciri","k":"schlagen → vorschlagen → der Vorschlag / zuschlagen → der Zuschlag","c":"schlägt – schlug – hat geschlagen","br":"Vurmak: fikri karşının önüne vurmak (öneri), fiyatın üstüne vurmak (ek ücret), aşağı vurmak (yağış), kayda vurmak (zu Buche schlagen).","tr":"vurmak → önermek → öneri / eklemek → ek ücret","s":"Ich mache einen Vorschlag: Wir teilen die Kosten.","st":"Bir önerim var: masrafı paylaşalım.","f":"der Niederschlag (yağış) · der Schlag (vuruş) · einschlagen (yönelmek) · die Schlagzeile (manşet)"},{"w":"Zincir: greifen","t":"Kök zinciri","k":"greifen → begreifen → der Begriff / eingreifen → der Eingriff","c":"greift – griff – hat gegriffen","br":"Elle kavramak, zihinle kavramaya dönüşüyor: der Begriff = kavram. Türkçe „kavram“ da tam olarak bunu yapıyor. İçeri uzanan el ise müdahale oluyor.","tr":"kavramak → anlamak → kavram / müdahale etmek → müdahale","s":"Diesen Begriff habe ich erst später richtig begriffen.","st":"Bu kavramı ancak sonradan tam kavradım.","f":"der Angriff (saldırı) · der Zugriff (erişim) · greifbar (elle tutulur) · unbegreiflich (anlaşılmaz)"},{"w":"Zincir: fassen","t":"Kök zinciri","k":"fassen → verfassen → die Verfassung / zusammenfassen → die Zusammenfassung","c":"fasst – fasste – hat gefasst","br":"Tutmak, kapsamak: kaleme alıp kapsamak (metin, anayasa), bir araya t
