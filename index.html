ung.","st":"Bunu normalde sorumluluk sigortası karşılar.","f":"haften für (sorumlu olmak) · die Haftung (sorumluluk) · der Schaden (zarar)"},{"w":"die Hausratversicherung","t":"Nomen, -en","k":"Hausrat (ev eşyası) + Versicherung","c":"die Hausratversicherung, -en","br":"Evdeki taşınır eşyayı yangın, su ve hırsızlığa karşı korur. Binanın kendisi ise Gebäudeversicherung ile korunur ve o ev sahibine aittir.","tr":"ev eşyası sigortası","s":"Der Wasserschaden läuft über die Hausratversicherung.","st":"Su hasarı ev eşyası sigortasından karşılanıyor.","f":"der Hausrat (ev eşyası) · die Gebäudeversicherung (bina sigortası) · der Einbruch (hırsızlık)"},{"w":"die Selbstbeteiligung","t":"Nomen, -en","k":"selbst (kendi) + Beteiligung (katılım)","c":"die Selbstbeteiligung, -en","br":"Hasarın kendin üstlendiğin sabit kısmı: muafiyet. Yüksek muafiyet primi düşürür — sigortanın temel takası budur.","tr":"muafiyet, kendi payın","s":"Bei 300 Euro Selbstbeteiligung wird der Beitrag deutlich günstiger.","st":"300 avro muafiyette prim belirgin şekilde ucuzluyor.","f":"der Beitrag (prim) · der Schaden (hasar) · übernehmen (üstlenmek)"},{"w":"die Schadensmeldung","t":"Nomen, -en","k":"Schaden (hasar) + Meldung (bildirim)","c":"die Schadensmeldung, -en","br":"Hasarın sigortaya bildirilmesi; genelde „unverzüglich“ yani gecikmeksizin yapılmalıdır. Geç bildirim ödemeyi tehlikeye atar.","tr":"hasar bildirimi","s":"Die Schadensmeldung muss unverzüglich erfolgen.","st":"Hasar bildirimi gecikmeksizin yapılmalıdır.","f":"melden (bildirmek) · unverzüglich (gecikmeksizin) · der Schadensfall (hasar durumu)"},{"w":"die Police","t":"Nomen, -n","k":"İtalyanca polizza: belge","c":"die Police, -n","br":"Sigorta sözleşmesinin belgesi. İçindeki anahtar bilgiler: Versicherungssumme (teminat tutarı), Laufzeit (süre), Beitrag (prim).","tr":"poliçe","s":"In der Police steht, was genau versichert ist.","st":"Poliçede tam olarak neyin sigortalandığı yazıyor.","f":"die Versicherungssumme (teminat) · die Laufzeit (süre) · versichern (sigortalamak)"},{"w":"der Versicherungsschutz","t":"Nomen (çoğulsuz)","k":"Versicherung + Schutz (koruma)","c":"der Versicherungsschutz","br":"Sigortanın fiilen kapsadığı koruma. Kritik soru daima aynıdır: Besteht Versicherungsschutz? Prim ödenmediyse ya da olay istisnadaysa koruma yoktur.","tr":"sigorta teminatı, kapsam","s":"Für diesen Fall besteht kein Versicherungsschutz.","st":"Bu durum için sigorta teminatı yok.","f":"schützen (korumak) · die Deckung (teminat) · der Ausschluss (kapsam dışı)"},{"w":"grobe Fahrlässigkeit (sigorta)","t":"Kavram","k":"grob (ağır) + Fahrlässigkeit (ihmal)","c":"—","br":"Sigortanın ödemeyi kısabildiği ya da reddedebildiği eşik: kapıyı açık bırakmak, kırmızıda geçmek. Basit ihmal (einfache Fahrlässigkeit) genelde kapsamdadır.","tr":"ağır ihmal","s":"Bei grober Fahrlässigkeit kann die Leistung gekürzt werden.","st":"Ağır ihmalde ödeme kısılabilir.","f":"fahrlässig (ihmalkâr) · kürzen (kısmak) · der Vorsatz (kasıt)"},{"w":"kündigen (Versicherung)","t":"Verb","k":"kündigen + Frist","c":"kündigt – kündigte – hat gekündigt","br":"Sigorta genelde bir yıllıktır ve süre bitiminden üç ay önce feshedilmezse kendiliğinden uzar. Ayrıca zam yapıldığında olağanüstü fesih hakkı doğar: Sonderkündigungsrecht.","tr":"(sigortayı) feshetmek","s":"Ich habe die Versicherung fristgerecht zum Jahresende gekündigt.","st":"Sigortayı yıl sonu itibarıyla süresinde feshettim.","f":"die Kündigungsfrist (fesih süresi) · sich verlängern (uzamak) · das Sonderkündigungsrecht (olağanüstü fesih hakkı)"},{"w":"die Beitragserhöhung","t":"Nomen, -en","k":"Beitrag (prim) + Erhöhung (artış)","c":"die Beitragserhöhung, -en","br":"Prim artışı bildirimi. Sözleşmelerin çoğunda bu bildirim, olağanüstü fesih hakkını tetikler — yani zam mektubu aynı zamanda çıkış kapısıdır.","tr":"prim artışı","s":"Nach der Beitragserhöhung habe ich den Anbieter gewechselt.","st":"Prim artışından sonra şirketi değiştirdim.","f":"der Beitrag (prim) · wechseln (değiştirmek) · der Anbieter (sağlayıcı)"},{"w":"die Krankenversicherung","t":"Nomen, -en","k":"krank (hasta) + Versicherung","c":"die Krankenversicherung, -en","br":"Almanya’da zorunludur; iki sistem vardır: gesetzlich (yasal, gelire göre prim) ve privat (özel, riske göre prim). Aile üyeleri yasal sistemde ücretsiz kapsanabilir: die Familienversicherung.","tr":"sağlık sigortası","s":"Die Kinder sind über mich mitversichert.","st":"Çocuklar benim üzerimden sigortalı.","f":"gesetzlich (yasal) · privat (özel) · die Familienversicherung (aile sigortası)"},{"w":"die Rentenversicherung","t":"Nomen, -en","k":"Rente (emekli aylığı) + Versicherung","c":"die Rentenversicherung, -en","br":"Zorunlu emeklilik sistemi; bordroda kesinti olarak görünür. Yıllık bilgilendirme: die Renteninformation — kaç yıl priminin olduğunu ve tahmini aylığı gösterir.","tr":"emeklilik sigortası","s":"Die Renteninformation kommt einmal im Jahr.","st":"Emeklilik bilgilendirmesi yılda bir kez geliyor.","f":"die Rente (emekli aylığı) · in Rente gehen (emekli olmak) · die Beitragsjahre (prim yılları)"},{"w":"die Arbeitslosenversicherung","t":"Nomen, -en","k":"arbeitslos (işsiz) + Versicherung","c":"die Arbeitslosenversicherung, -en","br":"İşsizlik parasını finanse eden zorunlu sigorta. Şart: son iki yılda en az on iki ay prim. Başvuru yeri: die Agentur für Arbeit.","tr":"işsizlik sigortası","s":"Man muss sich sofort bei der Agentur für Arbeit melden.","st":"Derhal iş kurumuna başvurmak gerekiyor.","f":"das Arbeitslosengeld (işsizlik parası) · sich arbeitslos melden (işsiz kaydı yaptırmak) · die Sperrzeit (bekleme süresi)"},{"w":"die Zusatzversicherung","t":"Nomen, -en","k":"Zusatz (ek) + Versicherung","c":"die Zusatzversicherung, -en","br":"Yasal sigortanın karşılamadığını tamamlayan isteğe bağlı ek: diş, gözlük, yurt dışı. Karar ölçütü basit: prim mi ucuz, olası masraf mı?","tr":"tamamlayıcı sigorta","s":"Für Zahnersatz lohnt sich oft eine Zusatzversicherung.","st":"Diş protezi için tamamlayıcı sigorta çoğu zaman değer.","f":"der Zusatz (ek) · die Leistung (edim, karşılama) · sich lohnen (değmek)"},{"w":"im Schadensfall","t":"Kalıp","k":"Schaden (hasar) + Fall (durum)","c":"—","br":"„Hasar hâlinde“: poliçelerin standart kalıbı. Aynı yapı her alanda kurulur: im Krankheitsfall, im Todesfall, im Zweifelsfall (şüphe hâlinde).","tr":"hasar hâlinde","s":"Im Schadensfall rufen Sie bitte zuerst die Hotline an.","st":"Hasar hâlinde lütfen önce çağrı merkezini arayın.","f":"der Fall (durum) · im Zweifelsfall (şüphe hâlinde) · die Hotline (çağrı hattı)"}]},{"n":"Trafik, araç ve yol","e":"TÜV, Bußgeld, Werkstatt, Führerschein…","c":"#6b5a3a","g":"Hukuk & idare dili","cards":[{"w":"die Zulassung (Kfz)","t":"Nomen, -en","k":"zu + lassen (izin vermek)","c":"die Zulassung, -en","br":"Aracın trafiğe kaydı ve plakanın verilmesi. Yeri: die Zulassungsstelle. Aynı kelime ilaç ve okul kaydında da „resmî izin“ demektir.","tr":"araç tescili, ruhsat","s":"Für die Zulassung brauchen Sie die eVB-Nummer der Versicherung.","st":"Tescil için sigortanın eVB numarası gerekiyor.","f":"zulassen (izin vermek) · die Zulassungsstelle (tescil dairesi) · abmelden (kaydı silmek)"},{"w":"der TÜV / die Hauptuntersuchung","t":"Nomen","k":"Technischer Überwachungsverein / Haupt + Untersuchung","c":"der TÜV","br":"İki yılda bir yapılan zorunlu teknik muayene. Halk dilinde TÜV (kurumun adı), resmî adı Hauptuntersuchung (HU). Plakadaki renkli etiket bir sonraki tarihi gösterir.","tr":"araç muayenesi","s":"Der TÜV ist im November fällig.","st":"Araç muayenesi kasımda dolacak.","f":"die Untersuchung (muayene) · fällig (vadesi gelmiş) · die Plakette (etiket)"},{"w":"das Bußgeld ↔ die Verwarnung","t":"Ceza çifti","k":"Buße (kefaret, ceza) / warnen (uyarmak)","c":"—","br":"Küçük ihlal önce uyarı ve düşük tutarla kapanır (Verwarnung); ağırsa Bußgeldbescheid gelir, puan ve yasak eklenebilir. Buße aslında dinî „kefaret“ kelimesidir.","tr":"idari para cezası ↔ uyarı cezası","s":"Für zu schnelles Fahren kam ein Bußgeldbescheid.","st":"Hız aşımı için ceza kararı geldi.","f":"der Bußgeldbescheid (ceza kararı) · die Punkte in Flensburg (ceza puanı) · das Fahrverbot (sürüş yasağı)"},{"w":"der Blitzer","t":"Nomen, -","k":"blitzen (şimşek çakmak, flaş patlatmak)","c":"der Blitzer, -","br":"Hız kamerası; kelime flaşın parlamasından geliyor. Konuşma dilinde: geblitzt werden — „flaşlanmak“, yani radara yakalanmak.","tr":"hız kamerası, radar","s":"Ich bin auf der B57 geblitzt worden.","st":"B57 yolunda radara yakalandım.","f":"blitzen (flaşlamak) · die Geschwindigkeit (hız) · die Radarkontrolle (radar denetimi)"},{"w":"die Werkstatt","t":"Nomen, ¨-en","k":"Werk (iş, eser) + Statt (yer)","c":"die Werkstatt, -stätten","br":"İşin yapıldığı yer = atölye, tamirhane. Randevu dili: einen Termin in der Werkstatt machen, das Auto in die Werkstatt bringen.","tr":"tamirhane, atölye","s":"Das Auto ist bis Freitag in der Werkstatt.","st":"Araba cumaya kadar tamirhanede.","f":"das Werk (iş, fabrika) · reparieren (tamir etmek) · der Kostenvoranschlag (keşif)"},{"w":"der Reifenwechsel","t":"Nomen, -","k":"Reifen (lastik) + Wechsel (değişim)","c":"der Reifenwechsel, -","br":"Mevsimlik lastik değişimi. Almanya’da kural durum bazlıdır: buz ve karda kış lastiği zorunludur (Winterreifenpflicht). Hatırlatma kalıbı: von O bis O — Ekim’den Paskalya’ya.","tr":"lastik değişimi","s":"Den Reifenwechsel mache ich immer im Oktober.","st":"Lastik değişimini hep ekimde yaptırırım.","f":"der Winterreifen (kış lastiği) · wechseln (değiştirmek) · die Werkstatt (tamirhane)"},{"w":"die Panne ↔ der Unfall","t":"Karıştırılan çift","k":"Panne (arıza) / Unfall (kaza)","c":"—","br":"Panne aracın bozulmasıdır, Unfall çarpışmadır. Yol yardımı: der Pannendienst; kazada ise Unfallbericht ve gerekirse polis.","tr":"yolda kalma ↔ kaza","s":"Zum Glück war es nur eine Panne, kein Unfall.","st":"Neyse ki sadece arızaydı, kaza değil.","f":"der Pannendienst (yol yardım) · der Unfallbericht (kaza tutanağı) · abschleppen (çekiciyle çekmek)"},{"w":"abschleppen","t":"Verb","k":"ab + schleppen (sürüklemek)","c":"schleppt ab – schleppte ab – hat abgeschleppt","br":"Çekiciyle götürmek. İki bağlamda karşına çıkar: arızalı aracı taşımak ve yanlış park edileni kaldırmak — ikincisinde masraf araç sahibine yazılır.","tr":"çekiciyle çekmek","s":"Falschparker werden hier sofort abgeschleppt.","st":"Hatalı park edenler burada hemen çekiliyor.","f":"der Abschleppdienst (çekici hizmeti) · schleppen (sürüklemek) · die Halteverbotszone (park yasağı bölgesi)"},{"w":"die Vorfahrt beachten","t":"Kollokation","k":"Vorfahrt (geçiş üstünlüğü) + beachten","c":"—","br":"Trafik kuralı dilinin çekirdeği. Kural yoksa sağdan gelen geçer: rechts vor links. Levha dili: Vorfahrt gewähren (yol ver).","tr":"geçiş üstünlüğüne uymak","s":"An dieser Kreuzung gilt rechts vor links.","st":"Bu kavşakta sağdan gelen geçer kuralı geçerli.","f":"rechts vor links (sağdan gelen önceliklidir) · gewähren (tanımak) · die Kreuzung (kavşak)"},{"w":"die Umweltplakette","t":"Nomen, -n","k":"Umwelt (çevre) + Plakette (etiket)","c":"die Umweltplakette, -n","br":"Çevre bölgelerine (Umweltzone) girebilmek için ön cama yapıştırılan renkli etiket. Etiketsiz girmek para cezasına yol açar.","tr":"çevre etiketi","s":"Ohne grüne Umweltplakette darf man hier nicht einfahren.","st":"Yeşil çevre etiketi olmadan buraya girilemez.","f":"die Umweltzone (çevre bölgesi) · die Umwelt (çevre) · einfahren (girmek)"},{"w":"der Parkschein ↔ die Parkscheibe","t":"Park çifti","k":"Schein (bilet) / Scheibe (kadran)","c":"—","br":"Ücretli parkta makineden bilet alınır (Parkschein); ücretsiz ama süreli parkta ise karton kadran ayarlanır (Parkscheibe) — varış saatini gösterir.","tr":"park bileti ↔ park saati kartonu","s":"Hier reicht die Parkscheibe, zwei Stunden sind frei.","st":"Burada park kartonu yeterli, iki saat ücretsiz.","f":"parken (park etmek) · der Parkautomat (park makinesi) · das Halteverbot (durma yasağı)"},{"w":"die Fahrgemeinschaft (yol)","t":"Nomen, -en","k":"fahren + Gemeinschaft (topluluk)","c":"die Fahrgemeinschaft, -en","br":"Aynı yola giden birkaç kişinin tek araçla gitmesi. Masraf paylaşımı kalıbı: sich an den Spritkosten beteiligen (yakıt masrafına katılmak).","tr":"ortak araç kullanımı","s":"Wir haben für die Fortbildung eine Fahrgemeinschaft gebildet.","st":"Eğitim için ortak araç grubu kurduk.","f":"die Mitfahrgelegenheit (araca binme imkânı) · die Spritkosten (yakıt masrafı) · gemeinsam (ortak)"},{"w":"die Verkehrskontrolle","t":"Nomen, -n","k":"Verkehr (trafik) + Kontrolle (denetim)","c":"die Verkehrskontrolle, -n","br":"Yol kenarı denetimi. Duyacağın kalıplar: Führerschein und Fahrzeugschein bitte; Fahren Sie bitte rechts ran (sağa çekin).","tr":"trafik denetimi","s":"Bei der Verkehrskontrolle war zum Glück alles in Ordnung.","st":"Trafik denetiminde neyse ki her şey yolundaydı.","f":"rechts ranfahren (sağa çekmek) · der Fahrzeugschein (ruhsat) · kontrollieren (denetlemek)"},{"w":"der Führerschein (Punkte)","t":"Nomen, -e","k":"führen (yönetmek) + Schein (belge)","c":"der Führerschein, -e","br":"„Aracı yönetme belgesi“. Ceza puanları Flensburg’daki merkezde tutulur: sekiz puanda ehliyet gider. Deyim: Punkte in Flensburg sammeln.","tr":"ehliyet","s":"Bei acht Punkten ist der Führerschein weg.","st":"Sekiz puanda ehliyet gider.","f":"führen (yönetmek) · der Entzug (geri alma) · das Fahrverbot (sürüş yasağı)"}]},{"n":"Sürücü kursu: kayıt, ders, sınav","e":"Fahrschule, Theoriestunde, Sonderfahrten…","c":"#2f6a7a","g":"Hukuk & idare dili","cards":[{"w":"die Fahrschule","t":"Nomen, -n","k":"fahren (sürmek) + Schule (okul)","c":"die Fahrschule, -n","br":"Sürücü kursu. Kayıt olmaya sich anmelden denir; kayıt ücreti die Anmeldegebühr, ders ücreti ise saat başına hesaplanır. Eğitmen: der Fahrlehrer / die Fahrlehrerin.","tr":"sürücü kursu","s":"Ich habe mich in der Fahrschule für die Klasse D angemeldet.","st":"Sürücü kursuna D sınıfı için kayıt oldum.","f":"der Fahrlehrer (sürücü eğitmeni) · sich anmelden (kayıt olmak) · die Ausbildung (eğitim)"},{"w":"die Theoriestunde ↔ die Fahrstunde","t":"Ders çifti","k":"Theorie (kuram) / fahren (sürmek) + Stunde","c":"—","br":"Eğitim ikiye ayrılır: sınıfta Theoriestunden (her biri 90 dakika), direksiyonda Fahrstunden (her biri 45 dakika). Otobüs sınıfında teori saat sayısı temel sınıflardan fazladır ve ayrıca sınıfa özel dersler (klassenspezifischer Stoff) vardır.","tr":"teori dersi ↔ direksiyon dersi","s":"Diese Woche habe ich zwei Theoriestunden und eine Fahrstunde.","st":"Bu hafta iki teori dersim ve bir direksiyon dersim var.","f":"der Unterricht (ders) · die Doppelstunde (çift ders) · die Praxis (uygulama)"},{"w":"die Sonderfahrten","t":"Nomen (çoğul)","k":"Sonder- (özel) + Fahrt (sürüş)","c":"die Sonderfahrten (Pl.)","br":"Zorunlu özel sürüşler: Überlandfahrt (şehirlerarası), Autobahnfahrt (otoyol), Nachtfahrt (gece). Sayıları sınıfa göre belirlidir ve sınava girebilmek için tamamlanmış olmalıdır — eksikse sınav tarihi verilmez.","tr":"zorunlu özel sürüşler","s":"Die Sonderfahrten müssen vor der Prüfung abgeschlossen sein.","st":"Zorunlu özel sürüşler sınavdan önce tamamlanmış olmalı.","f":"die Überlandfahrt (şehirlerarası sürüş) · die Nachtfahrt (gece sürüşü) · die Pflichtstunde (zorunlu ders)"},{"w":"die theoretische Prüfung","t":"Nomen, -en","k":"Theorie + Prüfung (sınav)","c":"die Prüfung, -en","br":"Bilgisayarda çoktan seçmeli sınav. Sorular hata puanıyla ölçülür (Fehlerpunkte); belirli bir puanı aşarsan kalırsın. Yanlış cevapta puan ağırlığı sorunun tehlikesine göre değişir.","tr":"teorik sınav","s":"Die theoretische Prüfung habe ich beim zweiten Versuch bestanden.","st":"Teorik sınavı ikinci denemede geçtim.","f":"der Fehlerpunkt (hata puanı) · der Fragebogen (soru formu) · ankreuzen (işaretlemek)"},{"w":"bestehen ↔ durchfallen","t":"Sınav çifti","k":"bestehen (ayakta kalmak) / durch + fallen (elenmek)","c":"besteht – bestand / fällt durch – fiel durch","br":"bestehen sınavda ayakta kalmaktır; durchfallen ise „eleğin içinden düşmek“ — kalmak. Tekrar için bekleme süresi vardır: teoride iki hafta. Kalıp: beim ersten Versuch bestehen.","tr":"sınavı geçmek ↔ kalmak","s":"Wer durchfällt, muss zwei Wochen warten.","st":"Kalan iki hafta beklemek zorunda.","f":"der Versuch (deneme) · die Wiederholung (tekrar) · die Prüfungsgebühr (sınav ücreti)"},{"w":"die praktische Prüfung","t":"Nomen, -en","k":"Praxis (uygulama) + Prüfung","c":"die praktische Prüfung, -en","br":"Direksiyon sınavı. Sınavda bir uzman (der Prüfer) yanında oturur; sürüş öncesi araç kontrolü (Abfahrtkontrolle) sorulur, ardından şehir içi ve manevra bölümleri gelir. Ağır hata (schwerer Fehler) sınavı bitirir.","tr":"direksiyon sınavı","s":"Bei der praktischen Prüfung wurde zuerst die Abfahrtkontrolle abgefragt.","st":"Direksiyon sınavında önce araç ön kontrolü soruldu.","f":"der Prüfer (sınav görevlisi) · die Abfahrtkontrolle (kalkış öncesi kontrol) · das Fahrmanöver (manevra)"},{"w":"der Sehtest","t":"Nomen, -s","k":"sehen (görmek) + Test","c":"der Sehtest, -s","br":"Ehliyet başvurusunun ön şartlarından: gözlükçüde ya da hekimde yapılır ve belgesi başvuruya eklenir. Otobüs sınıfında ayrıca kapsamlı sağlık raporu ve göz uzmanı raporu istenir.","tr":"göz testi","s":"Ohne Sehtest kann der Antrag nicht bearbeitet werden.","st":"Göz testi olmadan başvuru işleme alınmıyor.","f":"die Bescheinigung (belge) · die Untersuchung (muayene) · die Tauglichkeit (uygunluk)"},{"w":"der Erste-Hilfe-Kurs","t":"Nomen, -e","k":"Erste Hilfe (ilk yardım) + Kurs","c":"der Erste-Hilfe-Kurs, -e","br":"Ehliyet için zorunlu ilk yardım kursu: dokuz ders saati. Kısa çizgi kuralı burada görülür — birden çok kelimeli bileşiklerde parçalar çizgiyle bağlanır.","tr":"ilk yardım kursu","s":"Den Erste-Hilfe-Kurs habe ich am Wochenende gemacht.","st":"İlk yardım kursunu hafta sonu yaptım.","f":"die Erste Hilfe (ilk yardım) · die Teilnahmebescheinigung (katılım belgesi) · der Nachweis (belge)"},{"w":"die Führerscheinstelle","t":"Nomen, -n","k":"Führerschein (ehliyet) + Stelle (birim)","c":"die Führerscheinstelle, -n","br":"Ehliyet işlemlerinin yürütüldüğü resmî birim; başvuru buraya yapılır, sınav izni buradan çıkar. Kursu seçsen de başvuruyu genelde kurs senin adına iletir.","tr":"ehliyet işlemleri dairesi","s":"Der Antrag geht über die Fahrschule an die Führerscheinstelle.","st":"Başvuru kurs aracılığıyla ehliyet dairesine gidiyor.","f":"der Führerschein (ehliyet) · beantragen (başvurmak) · die Behörde (resmî kurum)"},{"w":"die Klasse D ↔ D1","t":"Ehliyet sınıfı","k":"Fahrerlaubnisklasse (sürüş izni sınıfı)","c":"—","br":"D sınıfı, sekizden fazla yolcu taşıyan otobüsler içindir; D1 ise 16 yolcuya kadar küçük otobüsler. Römorkla birlikte olan hâli DE ve D1E’dir. Yaş ve ön koşullar sınıfa göre değişir.","tr":"otobüs ehliyeti sınıfı D / D1","s":"Für den Linienbus brauche ich die Klasse D.","st":"Hat otobüsü için D sınıfı gerekiyor.","f":"die Fahrerlaubnis (sürüş izni) · der Anhänger (römork) · die Voraussetzung (ön koşul)"},{"w":"die Grundqualifikation (BKF)","t":"Nomen, -en","k":"Grund (temel) + Qualifikation","c":"die Grundqualifikation, -en","br":"Yolcu taşımacılığını meslek olarak yapmak için ehliyet tek başına yetmez: mesleki temel yeterlilik gerekir. Ehliyete işlenen anahtar sayı 95’tir; bu yüzden günlük dilde D95 denir.","tr":"mesleki temel yeterlilik (şoförlük)","s":"Ohne Grundqualifikation darf man gewerblich keine Fahrgäste befördern.","st":"Temel yeterlilik olmadan ticari olarak yolcu taşınamaz.","f":"die Weiterbildung (yenileme eğitimi) · die Schlüsselzahl 95 (anahtar sayı 95) · gewerblich (ticari)"},{"w":"der Personenbeförderungsschein","t":"Nomen, -e","k":"Person + Beförderung (taşıma) + Schein (belge)","c":"der Personenbeförderungsschein, -e","br":"Kısaltması P-Schein. Taksi, servis ve benzeri yolcu taşımacılığı için gereken ek belge; sağlık raporu ve sabıka kaydı istenir. befördern hem taşımak hem terfi ettirmek demektir — ikisi de „ileri götürmek“.","tr":"yolcu taşıma belgesi (P-Schein)","s":"Für den Fahrdienst brauchen Sie zusätzlich einen P-Schein.","st":"Servis hizmeti için ayrıca P-Schein gerekiyor.","f":"befördern (taşımak; terfi ettirmek) · die Beförderung (taşıma) · das Führungszeugnis (iyi hâl belgesi)"},{"w":"die Prüfungsgebühr","t":"Nomen, -en","k":"Prüfung + s + Gebühr (harç)","c":"die Prüfungsgebühr, -en","br":"Sınav ücreti kurs ücretinden ayrıdır ve TÜV ya da DEKRA gibi denetim kuruluşuna ödenir. Kalmak hâlinde yeniden ödenir — bu yüzden hazırlıksız girmek pahalıdır.","tr":"sınav ücreti","s":"Die Prüfungsgebühr wird bei jedem Versuch neu fällig.","st":"Sınav ücreti her denemede yeniden ödeniyor.","f":"die Gebühr (harç) · fällig (vadesi gelmiş) · die Kosten (masraflar)"},{"w":"die Probezeit (Führerschein)","t":"Nomen, -en","k":"Probe (deneme) + Zeit","c":"die Probezeit, -en","br":"Yeni ehliyette iki yıllık deneme süresi. Ağır bir ihlal (A-Verstoß) süreyi dört yıla uzatır ve seminer zorunluluğu getirir. Aynı kelime iş hukukunda da deneme süresidir — mantık aynı: henüz kesinleşmemiş durum.","tr":"ehliyette deneme süresi","s":"In der Probezeit wiegt jeder Verstoß schwerer.","st":"Deneme süresinde her ihlal daha ağır sayılır.","f":"der Verstoß (ihlal) · das Aufbauseminar (telafi semineri) · verlängern (uzatmak)"}]},{"n":"Trafik teorisi: kural ve levhalar","e":"Vorfahrt, Bremsweg, toter Winkel, überholen…","c":"#7a5a2a","g":"Hukuk & idare dili","cards":[{"w":"das Verkehrszeichen","t":"Nomen, -","k":"Verkehr (trafik) + Zeichen (işaret)","c":"das Verkehrszeichen, -","br":"Levhalar üçe ayrılır: Gefahrzeichen (üçgen, uyarır), Vorschriftzeichen (yuvarlak, emreder), Richtzeichen (dikdörtgen, bilgi verir). Şekli görünce işlevini bilirsin — teori sınavının temel mantığı budur.","tr":"trafik levhası","s":"Runde Verkehrszeichen schreiben etwas vor, dreieckige warnen.","st":"Yuvarlak levhalar emreder, üçgen olanlar uyarır.","f":"das Gefahrzeichen (tehlike levhası) · das Zusatzzeichen (ek levha) · vorschreiben (zorunlu kılmak)"},{"w":"die Vorfahrt gewähren","t":"Kural kalıbı","k":"Vorfahrt (geçiş üstünlüğü) + gewähren (tanımak)","c":"gewährt – gewährte – hat gewährt","br":"gewähren bir hakkı tanımaktır. Levhası ters üçgendir. Kural yoksa rechts vor links geçerlidir; ışık, polis ve levha bu sıralamayı bozar — teoride hiyerarşi daima aynıdır.","tr":"yol vermek, geçiş üstünlüğü tanımak","s":"An dieser Kreuzung müssen Sie die Vorfahrt gewähren.","st":"Bu kavşakta yol vermeniz gerekiyor.","f":"rechts vor links (sağdan gelen önceliklidir) · die Kreuzung (kavşak) · missachten (uymamak)"},{"w":"der Bremsweg ↔ der Anhalteweg","t":"Mesafe çifti","k":"bremsen (fren yapmak) / anhalten (durmak) + Weg","c":"—","br":"Bremsweg yalnızca fren basıldıktan sonraki mesafedir; Anhalteweg ise tepki mesafesiyle birlikte toplam duruş mesafesidir. Sınav formülü: Anhalteweg = Reaktionsweg + Bremsweg. Otobüste kütle yüzünden ikisi de uzar.","tr":"fren mesafesi ↔ toplam duruş mesafesi","s":"Der Anhalteweg ist immer länger als der reine Bremsweg.","st":"Toplam duruş mesafesi salt fren mesafesinden daima uzundur.","f":"die Reaktionszeit (tepki süresi) · bremsen (fren yapmak) · der Sicherheitsabstand (takip mesafesi)"},{"w":"der Sicherheitsabstand","t":"Nomen, ¨-e","k":"Sicherheit (güvenlik) + Abstand (mesafe)","c":"der Sicherheitsabstand, -abstände","br":"Öndeki araçla arada tutulan mesafe. Kaba kural: hızın yarısı kadar metre (50 km/s → 25 m). Kamyon ve otobüste daha büyük tutulur; ayrıca yağmurda ve buzda iki katına çıkarılır.","tr":"takip mesafesi","s":"Halber Tacho — das ist der übliche Sicherheitsabstand.","st":"Hızın yarısı — alışılmış takip mesafesi budur.","f":"der Abstand (mesafe) · auffahren (arkadan çarpmak) · der Tacho (hız göstergesi)"},{"w":"der tote Winkel","t":"Kavram","k":"tot (ölü) + Winkel (açı)","c":"der tote Winkel","br":"Aynaların göremediği alan. Otobüs ve kamyonda hayati önemdedir: sağa dönüşte bisikletliler tam bu alanda kalır. Çözüm çifttir: Spiegel kontrol et ve ayrıca Schulterblick yap — omuz üstünden bak.","tr":"kör nokta","s":"Vor dem Abbiegen immer den toten Winkel prüfen.","st":"Dönüşten önce daima kör noktayı kontrol et.","f":"der Schulterblick (omuz üstü bakış) · der Außenspiegel (dış ayna) · abbiegen (dönmek)"},{"w":"überholen","t":"Verb","k":"über + holen (almak)","c":"überholt – überholte – hat überholt","br":"Öndekinin üstünden geçip önüne almak. Ayrılmayan ön ekli olduğu için ge- almaz. Kural: soldan geçilir, görüş yeterliyse ve levha yasaklamıyorsa. Yasak levhası: das Überholverbot.","tr":"sollamak, geçmek","s":"Bei unklarer Verkehrslage darf nicht überholt werden.","st":"Trafik durumu belirsizken sollama yapılamaz.","f":"das Überholverbot (sollama yasağı) · die Gegenfahrbahn (karşı şerit) · einscheren (şerite girmek)"},{"w":"die Geschwindigkeitsbegrenzung","t":"Nomen, -en","k":"Geschwindigkeit (hız) + Begrenzung (sınırlama)","c":"die Geschwindigkeitsbegrenzung, -en","br":"Yuvarlak kırmızı çerçeveli levha. Otobüs ve ağır araçlar için ayrı sınırlar geçerlidir — otoyolda genelde 80 ya da 100. Ayrıca hava ve yük durumu hıza uyum zorunluluğu getirir.","tr":"hız sınırlaması","s":"Für Busse gilt auf der Autobahn eine eigene Geschwindigkeitsbegrenzung.","st":"Otoyolda otobüsler için ayrı bir hız sınırı geçerli.","f":"die Geschwindigkeit (hız) · begrenzen (sınırlamak) · das Tempolimit (hız limiti)"},{"w":"blinken ↔ der Blinker","t":"Sinyal çifti","k":"blinken (yanıp sönmek) / der Blinker (sinyal)","c":"blinkt – blinkte – hat geblinkt","br":"Sinyal vermek niyeti bildirmektir, izin istemek değil. Kural: her yön değişikliğinde, şerit değiştirmede ve duraktan çıkarken. Almanya’da duraktan çıkan otobüse yol verme zorunluluğu vardır.","tr":"sinyal vermek ↔ sinyal lambası","s":"Blinken nicht vergessen, bevor Sie die Spur wechseln.","st":"Şerit değiştirmeden önce sinyal vermeyi unutmayın.","f":"die Spur (şerit) · abbiegen (dönmek) · die Absicht (niyet)"},{"w":"der Kreisverkehr","t":"Nomen, -e","k":"Kreis (daire) + Verkehr (trafik)","c":"der Kreisverkehr, -e","br":"Göbekli kavşak. Kural: içerideki önceliklidir, girerken sinyal verilmez, çıkarken verilir. Uzun araçlarda iç şeritten dönüş yarıçapı hesaba katılır.","tr":"göbekli kavşak","s":"Im Kreisverkehr wird nur beim Ausfahren geblinkt.","st":"Göbekli kavşakta yalnızca çıkarken sinyal verilir.","f":"die Ausfahrt (çıkış) · einfahren (girmek) · die Vorfahrt (geçiş üstünlüğü)"},{"w":"die Einbahnstraße","t":"Nomen, -n","k":"ein + Bahn (yol) + Straße","c":"die Einbahnstraße, -n","br":"Tek yönlü yol. Mecazî kullanımı da vardır: eine Einbahnstraße sein — karşılıksız, tek taraflı ilişki. Levhası mavi ok; ters yönden girmek ağır ihlaldir.","tr":"tek yönlü yol","s":"Das ist eine Einbahnstraße — da dürfen Sie nicht rein.","st":"Burası tek yönlü — oraya giremezsiniz.","f":"die Bahn (yol, hat) · die Sackgasse (çıkmaz sokak) · die Fahrtrichtung (gidiş yönü)"},{"w":"der Zebrastreifen","t":"Nomen, -","k":"Zebra + Streifen (şerit)","c":"der Zebrastreifen, -","br":"Yaya geçidi; resmî adı der Fußgängerüberweg. Kural nettir: yayaya geçiş hakkı verilir, üzerinde durulmaz ve sollama yapılmaz. Otobüste yumuşak fren için erken yavaşlamak gerekir.","tr":"yaya geçidi","s":"Am Zebrastreifen haben Fußgänger Vorrang.","st":"Yaya geçidinde yayaların önceliği vardır.","f":"der Fußgänger (yaya) · der Vorrang (öncelik) · anhalten (durmak)"},{"w":"die Fahrbahn ↔ die Spur","t":"Yol çifti","k":"fahren + Bahn (yol) / die Spur (iz, şerit)","c":"—","br":"Fahrbahn taşıtların kullandığı yol yüzeyinin tamamıdır; Spur ise onun içindeki tek şerit. Levha ve kural metinlerinde ikisi ayrı geçer: die Fahrbahn verlassen ↔ die Spur wechseln.","tr":"taşıt yolu ↔ şerit","s":"Wechseln Sie erst die Spur, wenn die Fahrbahn frei ist.","st":"Yol boş olduğunda şerit değiştirin.","f":"der Seitenstreifen (emniyet şeridi) · der Gehweg (kaldırım) · der Radweg (bisiklet yolu)"},{"w":"die Verkehrssicherheit","t":"Nomen (çoğulsuz)","k":"Verkehr + Sicherheit (güvenlik)","c":"die Verkehrssicherheit","br":"Aracın ve sürüşün güvenli olma hâli. Araç için verkehrssicher olmak zorunludur — lastik, fren, ışıklar. Sürücü bundan sorumludur; eksikse yola çıkmak ihlaldir.","tr":"trafik güvenliği","s":"Der Fahrer ist für die Verkehrssicherheit des Fahrzeugs verantwortlich.","st":"Aracın trafik güvenliğinden sürücü sorumludur.","f":"verkehrssicher (trafiğe elverişli) · die Mängel (kusurlar) · haften (sorumlu olmak)"},{"w":"die Gefahrenbremsung","t":"Nomen, -en","k":"Gefahr (tehlike) + Bremsung (frenleme)","c":"die Gefahrenbremsung, -en","br":"Acil durum freni: mümkün olan en kısa mesafede durmak. Otobüste ayakta yolcu olduğu için son çaredir — bu yüzden mesafe ve öngörü (vorausschauendes Fahren) çok daha önemlidir.","tr":"acil fren","s":"Eine Gefahrenbremsung ist im Bus immer das letzte Mittel.","st":"Otobüste acil fren daima son çaredir.","f":"bremsen (fren yapmak) · vorausschauend (öngörülü) · der Notfall (acil durum)"}]},{"n":"Otobüs ve mesleki sürücülük","e":"Fahrgäste, Haltestelle, Lenkzeit, Abfahrtkontrolle…","c":"#3f6a4a","g":"Hukuk & idare dili","cards":[{"w":"der Fahrgast","t":"Nomen, ¨-e","k":"fahren + Gast (misafir)","c":"der Fahrgast, die Fahrgäste","br":"Kelimenin içinde tutum var: yolcu „misafir“ sayılır. Duyuru dilinde de bu geçer: Liebe Fahrgäste … Ayrıca die Fahrgastrechte — gecikme ve iptalde yolcunun hakları.","tr":"yolcu","s":"Liebe Fahrgäste, bitte halten Sie sich fest.","st":"Değerli yolcular, lütfen tutunun.","f":"der Gast (misafir) · die Fahrgastrechte (yolcu hakları) · befördern (taşımak)"},{"w":"die Haltestelle","t":"Nomen, -n","k":"halten (durmak) + Stelle (yer)","c":"die Haltestelle, -n","br":"Durak: durulan yer. Yakınları: die Endhaltestelle (son durak), die Ersatzhaltestelle (geçici durak). Duraktan çıkan otobüse yol verilmesi yasal zorunluluktur — sinyal verildiği anda.","tr":"durak","s":"An der nächsten Haltestelle steigen viele Fahrgäste zu.","st":"Bir sonraki durakta çok yolcu biniyor.","f":"halten (durmak) · zusteigen (binmek) · die Endstation (son durak)"},{"w":"einsteigen ↔ aussteigen ↔ umsteigen","t":"Yolcu hareketleri","k":"ein/aus/um + steigen (yükselmek)","c":"steigt ein – stieg ein – ist eingestiegen","br":"Ön ek yönü verir: içeri binmek, dışarı inmek, değiştirerek aktarma yapmak. Duyuru kalıbı: Bitte alle aussteigen! Kapı uyarısı: Vorsicht bei der Abfahrt.","tr":"binmek ↔ inmek ↔ aktarma yapmak","s":"Bitte hinten einsteigen und vorne aussteigen.","st":"Lütfen arkadan binin, önden inin.","f":"zusteigen (sonradan binmek) · der Umstieg (aktarma) · die Tür (kapı)"},{"w":"die Abfahrtkontrolle","t":"Nomen, -n","k":"Abfahrt (kalkış) + Kontrolle (kontrol)","c":"die Abfahrtkontrolle, -n","br":"Yola çıkmadan önceki zorunlu araç kontrolü: lastikler, ışıklar, frenler, sıvılar, aynalar, acil çıkışlar. Direksiyon sınavında sözlü olarak sorulur ve gösterilmesi istenir.","tr":"kalkış öncesi araç kontrolü","s":"Bei der Abfahrtkontrolle prüfe ich zuerst Reifen und Beleuchtung.","st":"Kalkış kontrolünde önce lastikleri ve aydınlatmayı kontrol ediyorum.","f":"die Abfahrt (kalkış) · prüfen (kontrol etmek) · der Mangel (kusur)"},{"w":"die Lenkzeit ↔ die Ruhezeit","t":"Süre çifti","k":"lenken (direksiyon çevirmek) / Ruhe (dinlenme)","c":"—","br":"Mesleki sürücülüğün en katı kuralı: kesintisiz direksiyon süresi sınırlıdır (kural olarak 4,5 saat), ardından mola gelir; günlük ve haftalık dinlenme süreleri ayrıca belirlidir. İhlal ağır para cezasıdır.","tr":"direksiyon süresi ↔ dinlenme süresi","s":"Nach viereinhalb Stunden Lenkzeit ist eine Pause vorgeschrieben.","st":"Dört buçuk saat direksiyondan sonra mola zorunlu.","f":"lenken (yönlendirmek) · die Pause (mola) · vorgeschrieben (zorunlu kılınmış)"},{"w":"der Fahrtenschreiber","t":"Nomen, -","k":"Fahrt (sürüş) + schreiben (yazmak)","c":"der Fahrtenschreiber, -","br":"Takograf: sürüş ve dinlenme sürelerini kaydeden cihaz. Dijital hâlinde sürücü kendi kartını takar: die Fahrerkarte. Denetimde kayıtlar okunur — kayıt eksikse sorumluluk sürücüdedir.","tr":"takograf","s":"Vor der Fahrt stecke ich die Fahrerkarte in den Fahrtenschreiber.","st":"Yola çıkmadan önce sürücü kartını takografa takıyorum.","f":"die Fahrerkarte (sürücü kartı) · aufzeichnen (kaydetmek) · die Kontrolle (denetim)"},{"w":"rangieren","t":"Verb","k":"Fransızca ranger: sıraya dizmek","c":"rangiert – rangierte – hat rangiert","br":"Dar alanda manevra yapmak: ileri geri alarak aracı yerleştirmek. Uzun araçta kritik olan iki şey vardır: der Wendekreis (dönüş çapı) ve arka aksın içeriden dönmesi — die Nachlaufachse.","tr":"manevra yapmak","s":"Auf dem Betriebshof muss man oft rangieren.","st":"Garaj alanında sık sık manevra yapmak gerekiyor.","f":"der Wendekreis (dönüş çapı) · rückwärts (geri geri) · einweisen (yönlendirmek)"},{"w":"der Außenspiegel ↔ der Rückspiegel","t":"Ayna çifti","k":"außen (dış) / zurück (geri) + Spiegel","c":"—","br":"Otobüste iç ayna sınırlıdır; asıl görüş dış aynalardan gelir. Bu yüzden ayarları kalkış öncesinde yapılır ve kör nokta aynaları eklenir: der Weitwinkelspiegel, der Rampenspiegel.","tr":"dış ayna ↔ iç dikiz aynası","s":"Stellen Sie die Außenspiegel vor der Abfahrt richtig ein.","st":"Dış aynaları kalkıştan önce doğru ayarlayın.","f":"der Spiegel (ayna) · einstellen (ayarlamak) · der tote Winkel (kör nokta)"},{"w":"der Notausstieg","t":"Nomen, -e","k":"Not (acil) + Ausstieg (çıkış)","c":"der Notausstieg, -e","br":"Acil çıkış: pencere ya da tavan kapağı. Yanındaki araçlar: der Nothammer (cam kırma çekici), der Feuerlöscher (yangın söndürücü), der Verbandskasten. Kalkış kontrolünün parçasıdır.","tr":"acil çıkış","s":"Die Notausstiege müssen jederzeit frei zugänglich sein.","st":"Acil çıkışlar her zaman erişilebilir olmalı.","f":"der Nothammer (acil çekiç) · der Feuerlöscher (yangın söndürücü) · frei halten (boş tutmak)"},{"w":"die Fahrgastsicherheit","t":"Nomen (çoğulsuz)","k":"Fahrgast + Sicherheit","c":"die Fahrgastsicherheit","br":"Otobüs sürüşünü otomobilden ayıran şey budur: ayakta yolcu vardır. Bu yüzden yumuşak hızlanma, erken frenleme ve kapı güvenliği (die Türfreigabe) sürüş tarzını belirler.","tr":"yolcu güvenliği","s":"Sanftes Bremsen gehört zur Fahrgastsicherheit.","st":"Yumuşak frenleme yolcu güvenliğinin parçasıdır.","f":"sanft (yumuşak) · beschleunigen (hızlanmak) · die Türfreigabe (kapı serbest bırakma)"},{"w":"der Linienverkehr ↔ der Reiseverkehr","t":"Taşıma türü çifti","k":"Linie (hat) / Reise (seyahat)","c":"—","br":"Linienverkehr sabit güzergâh ve tarifeye bağlıdır (şehir içi otobüs); Reiseverkehr ise turlar ve kiralık seferlerdir. Çalışma saatleri, ücret ve belgeler ikisinde farklı düzenlenir.","tr":"hat taşımacılığı ↔ seyahat taşımacılığı","s":"Im Linienverkehr gilt ein fester Fahrplan.","st":"Hat taşımacılığında sabit bir tarife geçerlidir.","f":"der Fahrplan (tarife) · die Linie (hat) · der Reisebus (turizm otobüsü)"},{"w":"der Fahrplan ↔ die Verspätung","t":"Tarife çifti","k":"Fahrt + Plan / ver + spät","c":"—","br":"Tarifeye bağlı çalışmanın iki yüzü: plan ve ondan sapma. Duyuru kalıpları sabittir: Wir haben heute etwa fünf Minuten Verspätung; der Anschluss wird erreicht/nicht erreicht.","tr":"tarife ↔ gecikme","s":"Wir haben heute leider einige Minuten Verspätung.","st":"Bugün maalesef birkaç dakika gecikmemiz var.","f":"pünktlich (dakik) · der Anschluss (aktarma bağlantısı) · die Umleitung (güzergâh değişikliği)"},{"w":"die Beförderungspflicht","t":"Nomen, -en","k":"Beförderung (taşıma) + Pflicht (yükümlülük)","c":"die Beförderungspflicht, -en","br":"Hat taşımacılığında taşıyıcı, koşulları sağlayan yolcuyu taşımak zorundadır — keyfî ret yoktur. Karşı tarafta ise die Beförderungsbedingungen: yolcunun uyacağı kurallar.","tr":"taşıma yükümlülüğü","s":"Im Linienverkehr besteht grundsätzlich eine Beförderungspflicht.","st":"Hat taşımacılığında kural olarak taşıma yükümlülüğü vardır.","f":"befördern (taşımak) · die Beförderungsbedingungen (taşıma koşulları) · ausschließen (hariç tutmak)"},{"w":"vorausschauend fahren","t":"Sürüş tarzı","k":"voraus (ileriye) + schauen (bakmak)","c":"—","br":"İleriye bakarak sürmek: durumu erken okuyup sert manevradan kaçınmak. Mesleki sürücülüğün ve yakıt tasarrufunun ortak ilkesidir; sınavda da bu tarz değerlendirilir.","tr":"öngörülü sürüş","s":"Wer vorausschauend fährt, muss seltener stark bremsen.","st":"Öngörülü süren daha az sert fren yapmak zorunda kalır.","f":"die Voraussicht (öngörü) · der Bremsweg (fren mesafesi) · sparsam (tasarruflu)"}]},{"n":"Araç tekniği ve kumandalar","e":"Kupplung, Getriebe, Abblendlicht, Reifendruck…","c":"#5a5f7a","g":"Hukuk & idare dili","cards":[{"w":"die Kupplung","t":"Nomen, -en","k":"kuppeln (bağlamak, kenetlemek)","c":"die Kupplung, -en","br":"kuppeln iki şeyi birbirine kenetlemektir; debriyaj motorla şanzımanı kenetler ya da ayırır. Aynı kökten die Anhängerkupplung (römork bağlantısı). Fiil hâli: kuppeln, einkuppeln, auskuppeln.","tr":"debriyaj","s":"Beim Anfahren am Berg kommt es auf die Kupplung an.","st":"Yokuşta kalkışta iş debriyaja bakar.","f":"einkuppeln (debriyajı bırakmak) · auskuppeln (debriyaja basmak) · anfahren (kalkış yapmak)"},{"w":"das Getriebe ↔ die Automatik","t":"Aktarma çifti","k":"treiben (sürmek) → Getriebe / automatisch","c":"das Getriebe, -","br":"treiben sürmektir; Getriebe gücü tekerleğe süren düzenektir: şanzıman. Manuel hâli das Schaltgetriebe, otomatik hâli die Automatik. Otobüslerin çoğu otomatiktir — sınav aracının türü ehliyete işlenir.","tr":"şanzıman ↔ otomatik vites","s":"Der Bus hat ein Automatikgetriebe, geschaltet wird kaum.","st":"Otobüsün otomatik şanzımanı var, neredeyse vites değiştirilmiyor.","f":"schalten (vites değiştirmek) · der Gang (vites) · treiben (sürmek)"},{"w":"schalten ↔ der Gang","t":"Vites çifti","k":"schalten (devreye almak) / Gang (yürüyüş, vites)","c":"schaltet – schaltete – hat geschaltet","br":"der Gang „yürüyüş“ demektir (gehen kökünden); vites de aracın yürüyüş kademesidir. schalten devreye almaktır — ışık ve cihazlar için de kullanılır: das Licht einschalten.","tr":"vites değiştirmek ↔ vites","s":"Im zweiten Gang anfahren, dann hochschalten.","st":"İkinci viteste kalkış yap, sonra vites yükselt.","f":"hochschalten (vites yükseltmek) · runterschalten (vites küçültmek) · der Leerlauf (boş vites)"},{"w":"die Bremse ↔ die Handbremse","t":"Fren çifti","k":"bremsen (frenlemek) / Hand (el)","c":"die Bremse, -n","br":"Otobüste sistem farklıdır: die Druckluftbremse (havalı fren) ve uzun inişlerde der Retarder (yıpratmayan yavaşlatıcı). El freni park frenidir: die Feststellbremse.","tr":"fren ↔ el freni","s":"Vor dem Aussteigen immer die Feststellbremse anziehen.","st":"İnmeden önce daima el frenini çek.","f":"die Druckluftbremse (havalı fren) · der Retarder (yavaşlatıcı) · anziehen (çekmek)"},{"w":"das Gaspedal ↔ das Bremspedal","t":"Pedal çifti","k":"Gas (gaz) / bremsen + Pedal","c":"—","br":"Konuşma dilinde Gas geben (gaz vermek) ve vom Gas gehen (gazı kesmek) kalıplaşmıştır. Debriyaj pedalı ise das Kupplungspedal — otomatik araçta yoktur.","tr":"gaz pedalı ↔ fren pedalı","s":"Geh vom Gas und bremse sanft.","st":"Gazı kes ve yumuşak fren yap.","f":"Gas geben (gaz vermek) · sanft (yumuşak) · beschleunigen (hızlanmak)"},{"w":"das Abblendlicht ↔ das Fernlicht","t":"Far çifti","k":"abblenden (kısmak) / fern (uzak)","c":"—","br":"abblenden ışığı kısmaktır: kısa far. Fernlicht ise uzun fardır ve karşıdan araç gelince kısılmak zorundadır. Üçüncüsü das Standlicht (park ışığı), dördüncüsü die Nebelschlussleuchte.","tr":"kısa far ↔ uzun far","s":"Bei Gegenverkehr sofort abblenden.","st":"Karşıdan araç gelince hemen farı kıs.","f":"die Beleuchtung (aydınlatma) · der Gegenverkehr (karşı yön trafiği) · blenden (gözünü almak)"},{"w":"die Warnblinkanlage","t":"Nomen, -n","k":"warnen (uyarmak) + blinken + Anlage","c":"die Warnblinkanlage, -n","br":"Dörtlü flaşör. Kullanım kuralı bellidir: arızada, kuyruğun sonuna yaklaşırken ve çekilirken. Konuşma dilinde kısaca: den Warnblinker anmachen.","tr":"dörtlü flaşör","s":"Bei einer Panne sofort die Warnblinkanlage einschalten.","st":"Arızada hemen dörtlü flaşörü aç.","f":"warnen (uyarmak) · das Warndreieck (reflektör üçgen) · die Panne (arıza)"},{"w":"der Scheibenwischer","t":"Nomen, -","k":"Scheibe (cam) + wischen (silmek)","c":"der Scheibenwischer, -","br":"Cam sileceği: „cam silen“. Aynı kökten die Windschutzscheibe (ön cam — rüzgârdan koruyan cam) ve das Wischwasser. Kalkış kontrolünün parçasıdır.","tr":"cam sileceği","s":"Die Scheibenwischer sind abgenutzt und müssen gewechselt werden.","st":"Silecekler yıpranmış, değiştirilmeli.","f":"die Windschutzscheibe (ön cam) · wischen (silmek) · die Sicht (görüş)"},{"w":"der Reifendruck","t":"Nomen (çoğulsuz)","k":"Reifen (lastik) + Druck (basınç)","c":"der Reifendruck","br":"Lastik basıncı; otobüste yük ve güvenlik açısından kritiktir. Kontrol dizisi: Reifendruck, Profiltiefe (diş derinliği), Beschädigungen. Yasal asgari diş derinliği vardır.","tr":"lastik basıncı","s":"Den Reifendruck prüfe ich bei jeder Abfahrtkontrolle.","st":"Lastik basıncını her kalkış kontrolünde bakıyorum.","f":"die Profiltiefe (diş derinliği) · der Reifen (lastik) · aufpumpen (şişirmek)"},{"w":"der Ölstand ↔ das Kühlwasser","t":"Sıvı çifti","k":"Öl (yağ) + Stand (seviye) / kühlen (soğutmak)","c":"—","br":"Stand seviye demektir (bkz. der Zählerstand). Motor sıvılarının kontrolü kalkış öncesinin standart adımıdır: Ölstand, Kühlwasser, Bremsflüssigkeit, Scheibenwaschwasser.","tr":"yağ seviyesi ↔ soğutma suyu","s":"Ölstand und Kühlwasser gehören zur täglichen Kontrolle.","st":"Yağ seviyesi ve soğutma suyu günlük kontrole dahildir.","f":"nachfüllen (tamamlamak) · die Bremsflüssigkeit (fren hidroliği) · der Stand (seviye)"},{"w":"die Zündung ↔ der Anlasser","t":"Çalıştırma çifti","k":"zünden (ateşlemek) / anlassen (çalıştırmak)","c":"—","br":"zünden ateşlemektir: kontak. anlassen ise motoru çalıştırmaktır — aynı fiil „bırakıvermek“ anlamına da gelir. Kalıp: den Motor anlassen ya da starten.","tr":"kontak ↔ marş","s":"Zündung an, dann den Motor starten.","st":"Kontağı aç, sonra motoru çalıştır.","f":"der Zündschlüssel (kontak anahtarı) · starten (çalıştırmak) · abstellen (motoru durdurmak)"},{"w":"die Luftfederung ↔ das Kneeling","t":"Otobüs tekniği","k":"Luft (hava) + Feder (yay) / İngilizce kneel (diz çökmek)","c":"—","br":"Otobüsün havalı süspansiyonu aracı alçaltıp yükseltebilir. Durakta kapı tarafını indirme işlemine Kneeling denir — araç „diz çöker“, böylece yaşlı ve engelli yolcu kolay biner.","tr":"havalı süspansiyon ↔ alçalma (kneeling)","s":"An der Haltestelle senkt der Bus die Tür per Kneeling ab.","st":"Durakta otobüs kapı tarafını alçaltıyor.","f":"die Feder (yay) · absenken (alçaltmak) · die Rampe (rampa)"},{"w":"die Rollstuhlrampe","t":"Nomen, -n","k":"Rollstuhl (tekerlekli sandalye) + Rampe","c":"die Rollstuhlrampe, -n","br":"Rollstuhl „yuvarlanan sandalye“dir. Rampa açma, tekerlekli sandalyeyi sabitleme ve yolcuyu bilgilendirme sürücünün görevidir — bu adımlar sınavda ve mesleki eğitimde sorulur.","tr":"tekerlekli sandalye rampası","s":"Ich klappe die Rollstuhlrampe aus und sichere den Rollstuhl.","st":"Rampayı açıyorum ve tekerlekli sandalyeyi sabitliyorum.","f":"ausklappen (açmak) · sichern (sabitlemek) · barrierefrei (engelsiz)"},{"w":"der Verschleiß","t":"Nomen (çoğulsuz)","k":"verschleißen (aşınmak)","c":"der Verschleiß","br":"Kullanımdan doğan aşınma: lastik, fren balatası, debriyaj. Bakım dilinde temel kavramdır ve masraf tartışmasının merkezindedir: Verschleißteile genelde garanti kapsamı dışındadır.","tr":"aşınma, yıpranma","s":"Bremsbeläge sind typische Verschleißteile.","st":"Fren balataları tipik aşınma parçalarıdır.","f":"abnutzen (aşındırmak) · das Verschleißteil (aşınan parça) · die Wartung (bakım)"}]},{"n":"Kaza, arıza ve denetim","e":"Warndreieck, Unfallbericht, Alkoholkontrolle…","c":"#8a3f3f","g":"Hukuk & idare dili","cards":[{"w":"die Unfallstelle absichern","t":"Kollokation","k":"ab + sichern (güvenceye almak)","c":"sichert ab – sicherte ab – hat abgesichert","br":"Kaza yerinin ilk işi: güvenliği sağlamak. Sıra sabittir — Warnblinker, Warnweste, Warndreieck, sonra Notruf, sonra Erste Hilfe. Bu sıra sınavda da sorulur.","tr":"kaza yerini emniyete almak","s":"Zuerst die Unfallstelle absichern, dann den Notruf wählen.","st":"Önce kaza yerini emniyete al, sonra acili ara.","f":"sichern (güvenceye almak) · die Warnweste (reflektörlü yelek) · der Notruf (acil çağrı)"},{"w":"das Warndreieck ↔ die Warnweste","t":"Güvenlik çifti","k":"warnen (uyarmak) + Dreieck / Weste","c":"—","br":"İkisi de araçta bulundurulması zorunludur. Üçgen şehir dışında yaklaşık 100 m, otoyolda 150–200 m geriye konur; yelek araçtan inmeden önce giyilir — dışarıda giyilmesi çok geçtir.","tr":"reflektörlü üçgen ↔ reflektörlü yelek","s":"Die Warnweste ziehe ich schon im Fahrzeug an.","st":"Reflektörlü yeleği daha araçtayken giyiyorum.","f":"warnen (uyarmak) · aufstellen (dikmek, yerleştirmek) · die Pflicht (zorunluluk)"},{"w":"der Notruf 112","t":"Kalıp","k":"Not (acil) + Ruf (çağrı)","c":"—","br":"Acil çağrı. Bildirim beş soruya göre yapılır: Wo? Was? Wie viele Verletzte? Welche Verletzungen? Warten auf Rückfragen. Son madde önemlidir — telefonu ilk kapatan sen olmazsın.","tr":"acil çağrı (112)","s":"Beim Notruf zuerst sagen, wo genau der Unfall passiert ist.","st":"Acil çağrıda önce kazanın tam olarak nerede olduğunu söyle.","f":"der Notfall (acil durum) · der Verletzte (yaralı) · die Rückfrage (ek soru)"},{"w":"der Unfallbericht","t":"Nomen, -e","k":"Unfall (kaza) + Bericht (rapor)","c":"der Unfallbericht, -e","br":"Kaza tutanağı; sigortanın işlem yapabilmesi için gerekir. İçinde yer alanlar: tarih ve saat, yer, taraflar, plakalar, sigortalar, tanıklar, çizimli kroki (die Unfallskizze).","tr":"kaza tutanağı","s":"Wir haben den Unfallbericht gemeinsam ausgefüllt und unterschrieben.","st":"Kaza tutanağını birlikte doldurup imzaladık.","f":"die Unfallskizze (kaza krokisi) · der Zeuge (tanık) · die Versicherung (sigorta)"},{"w":"der Schaden aufnehmen","t":"Kollokation","k":"Schaden (hasar) + aufnehmen (kayda almak)","c":"nimmt auf – nahm auf – hat aufgenommen","br":"Hasarın kayda geçirilmesi: polis ya da sigorta eksperi tarafından. aufnehmen burada „içine alıp kaydetmek“ anlamındadır — aynı fiil ses kaydı ve kabul için de kullanılır.","tr":"hasarı kayda almak, tespit etmek","s":"Die Polizei hat den Schaden vor Ort aufgenommen.","st":"Polis hasarı olay yerinde tespit etti.","f":"der Sachverständige (eksper) · die Schadensmeldung (hasar bildirimi) · begutachten (incelemek)"},{"w":"liegen bleiben","t":"Verb","k":"liegen (yatmak) + bleiben (kalmak)","c":"bleibt liegen – blieb liegen – ist liegen geblieben","br":"Aracın yolda kalması: „yatıp kalmak“. Kişi için farklı fiil kullanılır: stehen bleiben (durmak). Sonrası: der Pannendienst ya da abschleppen lassen.","tr":"(araç) yolda kalmak","s":"Der Bus ist mit einem Defekt auf der Landstraße liegen geblieben.","st":"Otobüs arızayla şehirlerarası yolda kaldı.","f":"die Panne (arıza) · der Pannendienst (yol yardım) · abschleppen (çekmek)"},{"w":"die Fahrzeugpapiere","t":"Nomen (çoğul)","k":"Fahrzeug (araç) + Papiere (belgeler)","c":"die Fahrzeugpapiere (Pl.)","br":"Denetimde istenen belgeler: der Führerschein, die Zulassungsbescheinigung Teil I (eski adıyla Fahrzeugschein) ve mesleki sürüşte ayrıca Fahrerkarte, Tachoausdruck, Bescheinigungen.","tr":"araç belgeleri","s":"Führerschein und Fahrzeugpapiere, bitte.","st":"Ehliyet ve araç belgeleri, lütfen.","f":"der Fahrzeugschein (ruhsat) · die Zulassung (tescil) · die Kontrolle (denetim)"},{"w":"die Alkoholkontrolle","t":"Nomen, -n","k":"Alkohol + Kontrolle","c":"die Alkoholkontrolle, -n","br":"Alkol denetimi. Mesleki sürücülük ve deneme süresi için sıfır sınırı geçerlidir; genel sınır 0,5 promildir ama sürüş hatası varsa daha düşük değerler de sonuç doğurur. Ölçüm: der Atemalkoholtest.","tr":"alkol denetimi","s":"Für Busfahrer im Dienst gilt die Null-Promille-Grenze.","st":"Görevdeki otobüs sürücüleri için sıfır promil sınırı geçerli.","f":"die Promille (promil) · der Atemtest (nefes testi) · der Entzug (ehliyet iptali)"},{"w":"der Bußgeldbescheid","t":"Nomen, -e","k":"Bußgeld (para cezası) + Bescheid (karar)","c":"der Bußgeldbescheid, -e","br":"Ceza kararı: tutar, ihlal, puan ve varsa sürüş yasağı yazılıdır. Sonunda daima kanun yolu bildirimi bulunur — iki hafta içinde Einspruch mümkündür. Süre kaçarsa karar kesinleşir.","tr":"idari para cezası kararı","s":"Gegen den Bußgeldbescheid kann man innerhalb von zwei Wochen Einspruch einlegen.","st":"Ceza kararına iki hafta içinde itiraz edilebilir.","f":"der Einspruch (itiraz) · das Fahrverbot (sürüş yasağı) · die Frist (süre)"},{"w":"die Punkte in Flensburg","t":"Kalıp","k":"Punkt (puan) + yer adı","c":"—","br":"Ceza puanları Flensburg’daki merkezî sicilde tutulur; bu yüzden puan almak „Punkte in Flensburg sammeln“ diye anılır. Sekiz puanda ehliyet geri alınır. Resmî adı: das Fahreignungsregister.","tr":"ceza puanı","s":"Zwei Punkte in Flensburg und 200 Euro Bußgeld.","st":"İki ceza puanı ve 200 avro para cezası.","f":"der Punkteabbau (puan indirimi) · das Fahrverbot (sürüş yasağı) · der Entzug (iptal)"},{"w":"die Fahrerlaubnis entziehen","t":"Kollokation","k":"Fahrerlaubnis (sürüş izni) + entziehen (geri almak)","c":"entzieht – entzog – hat entzogen","br":"Belge (Führerschein) ile izin (Fahrerlaubnis) farklıdır: kâğıt alınır, ama asıl kaybedilen izindir. Geri alma sonrası yeniden başvuru gerekir; ağır hâllerde die MPU (uygunluk incelemesi) istenir.","tr":"sürüş iznini geri almak","s":"Bei wiederholten Verstößen wird die Fahrerlaubnis entzogen.","st":"Tekrarlanan ihlallerde sürüş izni geri alınır.","f":"der Entzug (geri alma) · die Sperrfrist (yasak süresi) · die MPU (tıbbi-psikolojik inceleme)"},{"w":"die Verkehrsunfallflucht","t":"Nomen (çoğulsuz)","k":"Unfall (kaza) + Flucht (kaçış)","c":"die Unfallflucht","br":"Kazadan sonra beklemeden ayrılmak — Almanya’da suçtur, park hâlindeki bir araca çizik atıp gitmek bile. Kural: makul süre bekle, olmazsa polise bildir. Not bırakmak yeterli değildir.","tr":"kaza yerinden kaçma","s":"Auch bei kleinen Kratzern gilt Wegfahren als Unfallflucht.","st":"Küçük çiziklerde bile ayrılmak kaza yerinden kaçma sayılır.","f":"die Flucht (kaçış) · sich entfernen (uzaklaşmak) · die Anzeige (ihbar)"},{"w":"der Zeuge ↔ die Aussage","t":"Kaza sonrası çift","k":"zeugen (tanıklık etmek) / aussagen (ifade vermek)","c":"—","br":"Kazada tanık bilgisi altın değerindedir: ad, telefon ve mümkünse kısa ifade. Aynı kökten das Zeugnis (belge) ve überzeugen (ikna etmek — kanıtla tanık kılmak).","tr":"tanık ↔ ifade","s":"Notieren Sie unbedingt Namen und Telefonnummer der Zeugen.","st":"Tanıkların adını ve telefonunu mutlaka not edin.","f":"aussagen (ifade vermek) · das Zeugnis (belge) · überzeugen (ikna etmek)"},{"w":"die Haftpflicht (Kfz)","t":"Nomen, -en","k":"haften (sorumlu olmak) + Pflicht","c":"die Haftpflicht, -en","br":"Araçta zorunlu sigorta budur: başkasına verilen zararı karşılar. Kendi aracının hasarı için ayrı poliçeler gerekir: die Teilkasko ve die Vollkasko — kapsamları ve muafiyetleri farklıdır.","tr":"zorunlu mali sorumluluk sigortası","s":"Den Schaden am anderen Fahrzeug übernimmt die Haftpflicht.","st":"Diğer aracın hasarını zorunlu sigorta karşılıyor.","f":"die Vollkasko (kasko) · die Teilkasko (kısmi kasko) · die Selbstbeteiligung (muafiyet)"}]},{"n":"Duyurular ve yolcu iletişimi","e":"Durchsage, Haltewunsch, Fahrschein, Schwarzfahren…","c":"#2f7a6a","g":"Hukuk & idare dili","cards":[{"w":"die Durchsage","t":"Nomen, -n","k":"durch (boyunca) + sagen (söylemek)","c":"die Durchsage, -n","br":"Hoparlörden yapılan duyuru: sözün araçtan „geçerek“ herkese ulaşması. Fiil hâli durchsagen. Yakınları: die Ansage (duyuru, anons) ve die Ankündigung (önceden bildirim).","tr":"anons, duyuru","s":"Nach der Durchsage stiegen alle Fahrgäste um.","st":"Anonstan sonra bütün yolcular aktarma yaptı.","f":"ansagen (anons etmek) · die Ansage (anons) · der Lautsprecher (hoparlör)"},{"w":"„Bitte zurücktreten“","t":"Duyuru kalıbı","k":"zurück (geri) + treten (adım atmak)","c":"—","br":"Kapı ve peron duyurularının standart cümlesi: geri çekilin. Aynı fiil siyasette „istifa etmek“, hukukta „sözleşmeden dönmek“ demektir — üçünde de geri adım vardır.","tr":"Lütfen geri çekilin","s":"Bitte zurücktreten, die Türen schließen automatisch.","st":"Lütfen geri çekilin, kapılar otomatik kapanıyor.","f":"zurücktreten (geri çekilmek; istifa etmek) · die Tür (kapı) · Vorsicht (dikkat)"},{"w":"der Haltewunsch","t":"Nomen, ¨-e","k":"halten (durmak) + Wunsch (istek)","c":"der Haltewunsch, -wünsche","br":"Yolcunun durma isteği: düğmeye basıldığında panelde „Wagen hält“ yazar. Şehir içi otobüste durak, istek üzerine kullanılır — istek gelmezse ve inen yoksa durulmayabilir.","tr":"durma isteği (durak butonu)","s":"Bei Haltewunsch bitte rechtzeitig drücken.","st":"Durmak istiyorsanız lütfen zamanında butona basın.","f":"drücken (basmak) · die Haltestelle (durak) · aussteigen (inmek)"},{"w":"der Fahrschein ↔ das Ticket","t":"Bilet çifti","k":"Fahrt + Schein (belge) / İngilizce ticket","c":"—","br":"Resmî kelime der Fahrschein ya da die Fahrkarte; Ticket günlük ve dijital kullanımda yaygındır. Türleri: die Einzelfahrkarte, die Tageskarte, die Monatskarte, das Deutschlandticket.","tr":"bilet","s":"Ihren Fahrschein bitte — haben Sie ein Monatsticket?","st":"Biletiniz lütfen — aylık kartınız var mı?","f":"die Fahrkarte (bilet) · entwerten (damgalamak) · gültig (geçerli)"},{"w":"schwarzfahren","t":"Verb","k":"schwarz (kara, kayıt dışı) + fahren","c":"fährt schwarz – fuhr schwarz – ist schwarzgefahren","br":"Biletsiz seyahat. schwarz burada „kayıt dışı“ demektir — aynı mantık die Schwarzarbeit (kayıt dışı çalışma) ve der Schwarzmarkt’ta da var. Cezası: das erhöhte Beförderungsentgelt.","tr":"kaçak seyahat etmek, biletsiz binmek","s":"Wer schwarzfährt, zahlt 60 Euro erhöhtes Beförderungsentgelt.","st":"Biletsiz binen 60 avro artırılmış taşıma ücreti öder.","f":"die Schwarzarbeit (kayıt dışı iş) · der Kontrolleur (kontrolör) · das Bußgeld (ceza)"},{"w":"der Kontrolleur","t":"Nomen, -e","k":"Kontrolle (denetim) + -eur","c":"der Kontrolleur, -e","br":"Bilet kontrolörü; -eur eki Fransızcadan gelen meslek ekidir: der Ingenieur, der Friseur, der Redakteur. Kalıp: Die Fahrscheine bitte.","tr":"bilet kontrolörü","s":"Der Kontrolleur ist an der letzten Haltestelle zugestiegen.","st":"Kontrolör son durakta bindi.","f":"kontrollieren (denetlemek) · der Ausweis (kimlik) · vorzeigen (göstermek)"},{"w":"der Kinderwagen ↔ der Rollstuhl","t":"Özel alan","k":"Kind + Wagen / rollen (yuvarlanmak) + Stuhl","c":"—","br":"Otobüsün ortasındaki alan bu ikisine ayrılmıştır ve öncelik tekerlekli sandalyededir. Sürücünün görevleri: alanı boşalttırmak, rampayı açmak, sabitlemeyi kontrol etmek.","tr":"bebek arabası ↔ tekerlekli sandalye","s":"Der Platz in der Mitte ist für Rollstühle und Kinderwagen vorgesehen.","st":"Ortadaki alan tekerlekli sandalye ve bebek arabası için ayrılmış.","f":"der Stellplatz (yerleştirme alanı) · freihalten (boş tutmak) · der Vorrang (öncelik)"},{"w":"die Anzeige (Bus)","t":"Nomen, -n","k":"anzeigen (göstermek)","c":"die Anzeige, -n","br":"Otobüsteki gösterge paneli: hat numarası, sonraki durak, saat. Aynı kelime bambaşka alanlarda da geçer — gazete ilanı ve suç duyurusu. Ortak imge: bir şeyi görünür kılmak.","tr":"gösterge, ekran; ilan; ihbar","s":"Auf der Anzeige steht die nächste Haltestelle.","st":"Ekranda bir sonraki durak yazıyor.","f":"anzeigen (göstermek; ihbar etmek) · das Display (ekran) · die Ansage (anons)"},{"w":"„Vorsicht bei der Abfahrt“","t":"Duyuru kalıbı","k":"Vorsicht (dikkat) + Abfahrt (kalkış)","c":"—","br":"Kalkış uyarısı. Vorsicht kelimesinin içinde „önceden bakış“ vardır (vor + Sicht): tehlikeyi önceden görmek. Yakın kalıplar: Vorsicht, Stufe! ve Bitte festhalten.","tr":"Kalkışta dikkat","s":"Vorsicht bei der Abfahrt — bitte festhalten!","st":"Kalkışta dikkat — lütfen tutunun!","f":"die Vorsicht (dikkat) · sich festhalten (tutunmak) · die Stufe (basamak)"},{"w":"der Anschluss erreichen","t":"Kollokation","k":"Anschluss (aktarma) + erreichen (yetişmek)","c":"—","br":"Aktarmaya yetişmek. Duyuru kalıpları sabittir: Der Anschluss wird erreicht / wartet / kann nicht gehalten werden. Yolcunun en sık sorusu budur, cevabı hazır olmalı.","tr":"aktarmaya yetişmek","s":"Der Anschluss in Herzogenrath wird heute nicht erreicht.","st":"Herzogenrath’taki aktarmaya bugün yetişilemiyor.","f":"der Anschluss (bağlantı) · verpassen (kaçırmak) · die Verspätung (gecikme)"},{"w":"der Ersatzverkehr","t":"Nomen (çoğulsuz)","k":"Ersatz (yedek) + Verkehr (ulaşım)","c":"der Ersatzverkehr","br":"Arıza ya da inşaat nedeniyle konan alternatif sefer. Demiryolunda uzun hâli: der Schienenersatzverkehr (SEV). Duyuruda mutlaka güzergâh ve durak farkı belirtilir.","tr":"ikame sefer","s":"Zwischen den beiden Haltestellen fährt heute Ersatzverkehr.","st":"İki durak arasında bugün ikame sefer çalışıyor.","f":"der Ersatz (ikame) · die Umleitung (güzergâh değişikliği) · die Sperrung (kapatma)"},{"w":"die Beschwerde eines Fahrgastes","t":"Kollokation","k":"Beschwerde (şikâyet) + Fahrgast","c":"—","br":"Yolcu şikâyeti. Sürücü tarafında iki cümle işi çözer: anlayış göstermek (Ich verstehe Ihren Ärger) ve doğru adresi vermek (Bitte wenden Sie sich an den Kundenservice).","tr":"yolcu şikâyeti","s":"Ich verstehe Ihren Ärger — melden Sie das bitte beim Kundenservice.","st":"Kızgınlığınızı anlıyorum — bunu lütfen müşteri hizmetlerine bildirin.","f":"sich beschweren (şikâyet etmek) · der Kundenservice (müşteri hizmetleri) · sich wenden an (başvurmak)"},{"w":"das Fundbüro","t":"Nomen, -s","k":"finden (bulmak) + Büro","c":"das Fundbüro, -s","br":"Kayıp eşya bürosu: bulunanların toplandığı yer. Aynı kökten der Fund (buluntu) ve die Fundsache (bulunmuş eşya). Otobüste unutulan eşya oraya teslim edilir.","tr":"kayıp eşya bürosu","s":"Vergessene Sachen kommen ins Fundbüro.","st":"Unutulan eşyalar kayıp eşya bürosuna gidiyor.","f":"finden (bulmak) · die Fundsache (buluntu eşya) · abgeben (teslim etmek)"},{"w":"barrierefrei einsteigen","t":"Kollokation","k":"Barriere (engel) + frei + einsteigen","c":"—","br":"Engelsiz biniş: alçak tabanlı otobüs (der Niederflurbus), kneeling ve rampa birlikte çalışır. -frei eki „…dan arınmış“ demektir — aynı kalıptan stufenfrei, kostenfrei.","tr":"engelsiz biniş","s":"Der Niederflurbus ermöglicht barrierefreies Einsteigen.","st":"Alçak tabanlı otobüs engelsiz binişi mümkün kılıyor.","f":"der Niederflurbus (alçak tabanlı otobüs) · die Rampe (rampa) · barrierefrei (engelsiz)"}]},{"n":"İdare dili: karar · süre · tebliğ","e":"Bescheid, Frist, Zustellung, Widerruf…","c":"#31567f","g":"Hukuk & idare dili","cards":[{"w":"der Bescheid","t":"Nomen, -e","k":"be + Scheid (scheiden: ayırmak, karara bağlamak)","c":"der Bescheid, die Bescheide","br":"scheiden = ayırmak, hüküm vermek (bkz. entscheiden). Bir makamın konuyu ayırıp karara bağladığı yazı = resmî karar bildirimi. Almanya’da her idari işlem bir Bescheid ile biter.","tr":"resmî karar, bildirim yazısı","s":"Gegen den Bescheid können Sie innerhalb eines Monats Widerspruch einlegen.","st":"Karara bir ay içinde itiraz edebilirsiniz.","f":"bescheiden (karara bağlamak) · der Steuerbescheid (vergi kararı) · entscheiden (karar vermek)","m":[{"tr":"Bescheid geben / wissen: haber vermek / bilmek","s":"Sagen Sie mir bitte Bescheid, sobald die Unterlagen da sind.","st":"Belgeler gelir gelmez lütfen bana haber verin."}]},{"w":"die Frist","t":"Nomen, -en","k":"eski Almanca: tanınan zaman aralığı","c":"die Frist, die Fristen","br":"Alman hukukunun ekseni: bir hak yalnızca süresi içinde kullanılabilir. Fiilleri belirlidir: eine Frist wahren, einhalten, versäumen, verlängern.","tr":"süre, mühlet","s":"Die Frist beginnt mit dem Tag der Zustellung.","st":"Süre tebliğ günüyle birlikte başlar.","f":"fristgerecht (süresinde) · fristlos (süresiz, derhal) · die Fristverlängerung (süre uzatımı) · versäumen (kaçırmak)"},{"w":"die Zustellung","t":"Nomen, -en","k":"zu + stellen (koymak) + -ung","c":"die Zustellung, die Zustellungen","br":"Yazıyı muhatabın önüne koymak = tebliğ. Süreler bu anda başlar, gönderme tarihinde değil; bu yüzden Zustellung hukuken belirleyicidir.","tr":"tebliğ, resmî teslim","s":"Maßgeblich ist das Datum der Zustellung, nicht das Datum des Schreibens.","st":"Belirleyici olan tebliğ tarihidir, yazının tarihi değil.","f":"zustellen (tebliğ etmek) · die Zustellungsurkunde (tebliğ belgesi) · der Zugang (ulaşma)"},{"w":"die Anhörung","t":"Nomen, -en","k":"an + hören (dinlemek) + -ung","c":"die Anhörung, die Anhörungen","br":"Karar verilmeden önce ilgilinin dinlenmesi. „Rechtliches Gehör“ anayasal bir haktır: kimse dinlenmeden hakkında karar verilemez.","tr":"dinlenme, savunma alınması","s":"Vor Erlass des Bescheids erfolgt eine schriftliche Anhörung.","st":"Karar verilmeden önce yazılı olarak savunma alınır.","f":"anhören (dinlemek) · das rechtliche Gehör (dinlenilme hakkı) · die Stellungnahme (görüş yazısı)"},{"w":"die Rechtsbehelfsbelehrung","t":"Nomen, -en","k":"Recht + Behelf (be+helfen: çare) + Belehrung (lehren: öğretmek)","c":"die Rechtsbehelfsbelehrung, -en","br":"Üç parçalı dev kelime: hak + başvurulacak çare + bilgilendirme. Her resmî kararın sonunda yer alır ve itiraz yolunu ile süresini bildirir. Eksikse süre bir yıla uzar.","tr":"kanun yolları bildirimi","s":"Ohne Rechtsbehelfsbelehrung verlängert sich die Widerspruchsfrist auf ein Jahr.","st":"Kanun yolları bildirimi yoksa itiraz süresi bir yıla uzar.","f":"der Rechtsbehelf (kanun yolu) · die Belehrung (bilgilendirme) · behelfsmäßig (geçici çare niteliğinde)"},{"w":"der Widerruf","t":"Nomen, -e","k":"wider (karşı) + Ruf (rufen: çağırmak)","c":"der Widerruf, die Widerrufe","br":"Verilen sözü geri çağırmak = cayma. Tüketici hukukunda 14 günlük Widerrufsrecht standarttır.","tr":"cayma, geri alma","s":"Der Widerruf muss nicht begründet werden.","st":"Cayma için gerekçe gösterilmesi gerekmez.","f":"widerrufen (caymak) · das Widerrufsrecht (cayma hakkı) · die Widerrufsfrist (cayma süresi)"},{"w":"der Einspruch","t":"Nomen, ¨-e","k":"ein + Spruch (sprechen)","c":"der Einspruch, die Einsprüche","br":"Sürecin içine söz atmak = itiraz. Widerspruch idari kararlara, Einspruch vergi kararlarına ve ceza emirlerine karşı kullanılır — kelime seçimi hukuk alanını gösterir.","tr":"itiraz (vergi, ceza emri)","s":"Gegen den Steuerbescheid habe ich fristgerecht Einspruch eingelegt.","st":"Vergi kararına süresinde itiraz ettim.","f":"Einspruch erheben (itiraz etmek) · der Widerspruch (idari itiraz) · einspruchsfähig (itiraza açık)"},{"w":"die Vollmacht","t":"Nomen, -en","k":"voll (tam) + Macht (yetki, güç)","c":"die Vollmacht, die Vollmachten","br":"voll tam, Macht ise güç ve yetkidir (mögen/vermögen kökünden). Yani birine kendi adına hareket etme gücünü tam olarak devretmek. Aileden bevollmächtigen, der Bevollmächtigte (vekil), die Ermächtigung (yetkilendirme).","tr":"vekâlet, vekâletname","s":"Ohne schriftliche Vollmacht darf ich keine Auskunft erteilen.","st":"Yazılı vekâlet olmadan bilgi veremem.","f":"bevollmächtigen (vekâlet vermek) · der Bevollmächtigte (vekil) · die Macht (güç)"},{"w":"die Behörde","t":"Nomen, -n","k":"be + hören/gehören (ait olmak, sorumlu olmak)","c":"die Behörde, die Behörden","br":"Bir işin „ait olduğu“ merci. Kökeni gehören/hören ile ilişkilendirilir ama bu bağ kesin değil — hatırlatıcı olarak kullan, köken bilgisi olarak değil. Asıl işe yarayan soru şudur: Welche Behörde ist zuständig?","tr":"resmî daire, kurum","s":"Welche Behörde ist für diesen Antrag zuständig?","st":"Bu başvuruda hangi daire yetkili?","f":"behördlich (resmî) · das Amt (daire) · zuständig (yetkili) · die Zuständigkeit (yetki)"},{"w":"die Auskunft","t":"Nomen, ¨-e","k":"aus + Kunft (kommen: gelme)","c":"die Auskunft, die Auskünfte","br":"Kurumdan dışarı çıkan bilgi = bilgilendirme. Karşılığında bir Auskunftspflicht (bilgi verme yükümlülüğü) bulunur.","tr":"bilgi, bilgi verme","s":"Der Vermieter verweigert jede Auskunft über die Verteilerschlüssel.","st":"Ev sahibi dağıtım anahtarları hakkında her türlü bilgiyi vermeyi reddediyor.","f":"die Auskunftspflicht (bilgi verme yükümlülüğü) · Auskunft erteilen (bilgi vermek) · die Herkunft (köken)"},{"w":"die Einsicht","t":"Nomen, -en","k":"ein + Sicht (sehen: bakmak)","c":"die Einsicht, die Einsichten","br":"İçine bakmak: dosyayı inceleme hakkı; soyut anlamda: kavrayış, idrak. İki anlam da aynı „içeriyi görmek“ imgesinden çıkar.","tr":"inceleme hakkı (dosya, belge)","s":"Sie haben Anspruch auf Einsicht in die Originalbelege.","st":"Orijinal belgeleri inceleme hakkınız var.","f":"die Akteneinsicht (dosya incelemesi) · einsehen (incelemek; kabullenmek) · einsichtig (anlayışlı)","m":[{"tr":"kavrayış, idrak","s":"Er zeigte keinerlei Einsicht in sein Fehlverhalten.","st":"Hatalı davranışını hiçbir şekilde idrak etmedi."}]},{"w":"die Mahnung","t":"Nomen, -en","k":"mahnen (uyarmak) + -ung","c":"die Mahnung, die Mahnungen","br":"Ödemeye çağıran uyarı. Hukuken önemlidir: borçlu ancak Mahnung’dan sonra Verzug’a (temerrüde) düşer.","tr":"ihtar, ödeme uyarısı","s":"Nach der zweiten Mahnung folgt in der Regel das gerichtliche Mahnverfahren.","st":"İkinci ihtardan sonra kural olarak icra takibi başlar.","f":"mahnen (uyarmak) · das Mahnverfahren (icra takibi) · die Abmahnung (ihtarname, uyarı)"},{"w":"der Nachweis","t":"Nomen, -e","k":"nach + weisen (göstermek)","c":"der Nachweis, die Nachweise","br":"Bir şeyin izini sonradan gösterebilme = belgeli kanıt. Beweis daha genel, Nachweis belgeye dayanır.","tr":"belge, kanıt","s":"Als Nachweis genügt eine Kopie des Kontoauszugs.","st":"Kanıt olarak hesap özetinin bir kopyası yeterli.","f":"nachweisen (kanıtlamak) · der Beweis (delil) · nachweislich (kanıtlandığı üzere)"},{"w":"die Anlage","t":"Nomen, -n","k":"an + legen (koymak)","c":"die Anlage, die Anlagen","br":"Bir şeyin yanına konulanı adlandırır: yazının ekine konan belge, arsaya kurulan tesis, bankaya konan yatırım. Tek imge, üç alan.","tr":"ek (yazışmada)","s":"Die Belege finden Sie in der Anlage.","st":"Belgeleri ekte bulabilirsiniz.","f":"anlegen (koymak, kurmak, yatırmak) · die Heizungsanlage (kalorifer tesisatı) · die Geldanlage (yatırım)","m":[{"tr":"tesis, sistem","s":"Die Wartung der Anlage erfolgt jährlich.","st":"Tesisin bakımı yılda bir yapılır."},{"tr":"yatırım","s":"Sie sucht eine sichere Anlage für ihre Ersparnisse.","st":"Birikimi için güvenli bir yatırım arıyor."}]}]},{"n":"Hukuk dili: hak · yükümlülük · sorumluluk","e":"Haftung, Vorsatz, Verjährung, Forderung…","c":"#6d3550","g":"Hukuk & idare dili","cards":[{"w":"die Haftung","t":"Nomen, -en","k":"haften (yapışmak) + -ung","c":"die Haftung, die Haftungen","br":"haften = yapışmak. Zarar kişiye yapışır, ondan ayrılmaz = sorumluluk. GmbH’deki „beschränkte Haftung“ sınırlı sorumluluk demektir.","tr":"sorumluluk (hukuki)","s":"Für Schäden am Gemeinschaftseigentum besteht keine persönliche Haftung.","st":"Ortak mülkiyetteki hasarlar için kişisel sorumluluk yoktur.","f":"haften für (…den sorumlu olmak) · die Haftpflichtversicherung (sorumluluk sigortası) · haftbar (sorumlu tutulabilir)"},{"w":"die Fahrlässigkeit","t":"Nomen, -en","k":"fahren lassen (bırakıvermek) + -ig + -keit","c":"die Fahrlässigkeit, -en","br":"Kelimenin içinde resim var: bir şeyi „gitmesine izin vererek“ ihmal etmek. Kasıt (Vorsatz) ile arasındaki fark cezanın ağırlığını belirler.","tr":"ihmal, taksir","s":"Der Schaden ist durch grobe Fahrlässigkeit entstanden.","st":"Zarar ağır ihmal sonucu oluştu.","f":"fahrlässig (ihmalkâr) · grob fahrlässig (ağır ihmalli) · der Vorsatz (kasıt)"},{"w":"der Vorsatz","t":"Nomen, ¨-e","k":"vor + Satz (setzen: koymak)","c":"der Vorsatz, die Vorsätze","br":"Önceden konulan karar = kasıt. Günlük dilde aynı kelime „iyi niyetli karar“ demektir: gute Vorsätze fürs neue Jahr.","tr":"kasıt","s":"Die Tat wurde mit Vorsatz begangen.","st":"Fiil kasten işlendi.","f":"vorsätzlich (kasten) · der Satz (cümle; sıçrama) · sich vornehmen (niyet etmek)","m":[{"tr":"(günlük) niyet, karar","s":"Meine guten Vorsätze halten selten bis Februar.","st":"İyi niyetli kararlarım nadiren şubata kadar dayanır."}]},{"w":"die Verjährung","t":"Nomen, -en","k":"ver + Jahr (yıl) + -ung","c":"die Verjährung, die Verjährungen","br":"Kök das Jahr (yıl); ver- „geçip gitme“ katar, -ung süreci adlandırır. Yani yılların geçmesiyle talebin gücünü yitirmesi. Fiil hâli verjähren; sıfat unverjährbar — zamanaşımına uğramayan.","tr":"zamanaşımı","s":"Die Forderung ist inzwischen verjährt.","st":"Alacak bu arada zamanaşımına uğradı.","f":"verjähren (zamanaşımına uğramak) · die Verjährungsfrist (zamanaşımı süresi) · unverjährbar (zamanaşımına uğramaz)"},{"w":"der Verzug","t":"Nomen (çoğulsuz)","k":"ver + Zug (ziehen: çekmek)","c":"der Verzug","br":"Ödemeyi sürüncemeye çekmek = temerrüt. Verzug’a düşen borçlu gecikme faizi ve masraflardan sorumlu olur.","tr":"temerrüt, gecikme","s":"Mit der zweiten Mahnung geriet der Mieter in Verzug.","st":"İkinci ihtarla kiracı temerrüde düştü.","f":"in Verzug geraten (temerrüde düşmek) · die Verzugszinsen (gecikme faizi) · unverzüglich (gecikmeksizin)"},{"w":"die Beweislast","t":"Nomen, -en","k":"Beweis (kanıt) + Last (yük)","c":"die Beweislast, die Beweislasten","br":"Kanıtlama yükünü kim taşıyorsa davayı çoğunlukla o kaybeder ya da kazanır. Kalıp: Die Beweislast liegt bei …","tr":"ispat yükü","s":"Die Beweislast für die Zustellung liegt beim Vermieter.","st":"Tebliğin ispat yükü ev sahibindedir.","f":"der Beweis (delil) · beweisen (kanıtlamak) · die Beweislastumkehr (ispat yükünün yer değiştirmesi)"},{"w":"die Forderung","t":"Nomen, -en","k":"fordern (talep etmek) + -ung","c":"die Forderung, die Forderungen","br":"Talep edilen şey; hukukta somut olarak: alacak. Anspruch hakkın kendisidir, Forderung o hakkın parayla ifade edilen tarafıdır.","tr":"talep; alacak","s":"Die Forderung des Vermieters ist der Höhe nach nicht nachvollziehbar.","st":"Ev sahibinin talebi tutar olarak anlaşılır değil.","f":"fordern (talep etmek) · die Geldforderung (para alacağı) · der Anspruch (hak talebi)"},{"w":"die Abmahnung","t":"Nomen, -en","k":"ab + mahnen (uyarmak) + -ung","c":"die Abmahnung, die Abmahnungen","br":"Bir davranışı kesmeye yönelik resmî uyarı. İş hukukunda fesihten önceki zorunlu adımdır: önce uyarı, sonra fesih.","tr":"ihtarname, resmî uyarı","s":"Vor einer verhaltensbedingten Kündigung ist in der Regel eine Abmahnung erforderlich.","st":"Davranış nedenli fesihten önce kural olarak bir ihtar gerekir.","f":"abmahnen (ihtar etmek) · die Mahnung (ödeme ihtarı) · die Kündigung (fesih)"},{"w":"die Willenserklärung","t":"Nomen, -en","k":"Wille (irade) + Erklärung (beyan)","c":"die Willenserklärung, -en","br":"Alman özel hukukunun temel taşı: hukuki sonuç doğurmak isteyen irade beyanı. Sözleşme, iki uyumlu Willenserklärung’dan doğar.","tr":"irade beyanı","s":"Eine Kündigung ist eine einseitige Willenserklärung.","st":"Fesih tek taraflı bir irade beyanıdır.","f":"der Wille (irade) · erklären (beyan etmek) · die Erklärung (beyan)"},{"w":"die Rechtskraft","t":"Nomen (çoğulsuz)","k":"Recht (hukuk) + Kraft (güç)","c":"die Rechtskraft","br":"Kararın artık sarsılamayacak hâle gelmesi = kesinleşme. Süre geçince karar „hukuk gücü“ kazanır.","tr":"kesinleşme, kesin hüküm gücü","s":"Nach Ablauf der Frist erwächst der Bescheid in Rechtskraft.","st":"Sürenin dolmasıyla karar kesinleşir.","f":"rechtskräftig (kesinleşmiş) · in Kraft treten (yürürlüğe girmek) · die Kraft (güç)"},{"w":"die Duldung","t":"Nomen, -en","k":"dulden (katlanmak) + -ung","c":"die Duldung, die Duldungen","br":"Bir duruma resmen karşı çıkmayıp katlanma. Hukukta „izin“ değildir; sadece müdahale edilmemesidir — bu ayrım sonuçları belirler.","tr":"katlanma, göz yumma","s":"Die jahrelange Duldung begründet keinen Anspruch.","st":"Yıllarca göz yumulması bir hak doğurmaz.","f":"dulden (katlanmak) · duldsam (hoşgörülü) · die Zustimmung (onay)"},{"w":"die Vertretung","t":"Nomen, -en","k":"ver + treten (adım atmak) + -ung","c":"die Vertretung, die Vertretungen","br":"Birinin yerine adım atmak = onu temsil etmek. Okulda: derse giren yedek öğretmen; hukukta: temsil yetkisi.","tr":"temsil; vekâlet, yerine bakma","s":"In der Vertretung des Klassenlehrers übernehme ich die Elterngespräche.","st":"Sınıf öğretmeninin vekili olarak veli görüşmelerini ben yürütüyorum.","f":"vertreten (temsil etmek) · der Vertreter (temsilci) · die Stellvertretung (vekâlet)"},{"w":"die Erstattung","t":"Nomen, -en","k":"er + statt (yer) + -en + -ung","c":"die Erstattung, die Erstattungen","br":"Statt = yer; erstatten = yerine koymak, geri vermek. Parada: iade; Anzeige erstatten kalıbında ise „resmen yerine koymak“ = suç duyurusunda bulunmak.","tr":"geri ödeme, iade","s":"Die Erstattung des Guthabens erfolgt innerhalb von vier Wochen.","st":"Alacak bakiyesinin iadesi dört hafta içinde yapılır.","f":"erstatten (iade etmek) · Anzeige erstatten (suç duyurusunda bulunmak) · die Rückerstattung (geri ödeme)"},{"w":"die Befugnis","t":"Nomen, -se","k":"be + fügen (yerleştirmek) + -nis","c":"die Befugnis, die Befugnisse","br":"fügen = yerleştirmek, uydurmak (bkz. verfügen). Bir işi yapmaya „uygun kılınmış olma“ = yetki.","tr":"yetki, salahiyet","s":"Zu einer solchen Anordnung fehlt dem Amt die Befugnis.","st":"Böyle bir emir için dairenin yetkisi yok.","f":"befugt (yetkili) · unbefugt (yetkisiz) · verfügen (tasarrufta bulunmak)"}]},{"n":"Kısaltmalar ve okuma işaretleri","e":"z. B., bzw., ggf., i. d. R., §, zzgl.…","c":"#6b6b3a","g":"Hukuk & idare dili","cards":[{"w":"z. B. / bzw.","t":"Kısaltma","k":"zum Beispiel / beziehungsweise","c":"—","br":"bzw. iki işi görür: „ya da“ ile „sırasıyla“. Aslı beziehen (ilişkilendirmek) — iki öğeyi karşılıklı bağlar.","tr":"örneğin / ya da, sırasıyla","s":"Bringen Sie einen Ausweis mit, z. B. den Reisepass bzw. den Personalausweis.","st":"Bir kimlik getirin, örneğin pasaport ya da kimlik kartı.","f":"das Beispiel (örnek) · beziehungsweise (ya da) · oder (veya)"},{"w":"ggf. / evtl.","t":"Kısaltma","k":"gegebenenfalls / eventuell","c":"—","br":"ggf. resmî yazının „gerekirse“sidir: koşul gerçekleşirse. evtl. ise sadece ihtimal bildirir: belki. Formlarda ggf. çok sık geçer.","tr":"gerekirse / belki","s":"Bitte legen Sie ggf. eine Kopie bei; evtl. brauchen wir noch ein Foto.","st":"Gerekirse bir kopya ekleyin; belki bir de fotoğraf gerekecek.","f":"gegebenenfalls (gerekirse) · eventuell (belki) · unter Umständen (duruma göre)"},{"w":"i. d. R. / u. U.","t":"Kısaltma","k":"in der Regel / unter Umständen","c":"—","br":"i. d. R. kuralı, u. U. istisnayı işaret eder: „genelde şöyledir, ama bazı durumlarda başka“. İkisi resmî metinlerde yan yana kullanılır.","tr":"kural olarak / duruma göre","s":"Die Bearbeitung dauert i. d. R. zwei Wochen, u. U. auch länger.","st":"İşlem kural olarak iki hafta sürer, duruma göre daha uzun da sürebilir.","f":"die Regel (kural) · der Umstand (koşul) · normalerweise (normalde)"},{"w":"u. a. / v. a.","t":"Kısaltma","k":"unter anderem / vor allem","c":"—","br":"u. a. listenin eksik olduğunu söyler (diğerlerinin yanı sıra), v. a. ise ağırlık noktasını gösterir (her şeyden önce). İkisi karıştırılınca cümlenin vurgusu değişir.","tr":"diğerlerinin yanı sıra / özellikle","s":"Wir brauchen u. a. Kopien, v. a. aber die Originalquittungen.","st":"Diğerlerinin yanı sıra kopyalara, ama özellikle orijinal makbuzlara ihtiyacımız var.","f":"unter anderem (bunlar arasında) · vor allem (özellikle) · insbesondere (bilhassa)"},{"w":"d. h. / bzgl.","t":"Kısaltma","k":"das heißt / bezüglich","c":"—","br":"d. h. açıklama getirir („yani“), bzgl. konuyu işaret eder („…ile ilgili“). Yazışmada bzgl. yerine in Bezug auf da kullanılır.","tr":"yani / …ile ilgili","s":"Bzgl. Ihrer Anfrage: Die Frist endet am 30., d. h. am Montag.","st":"Sorunuzla ilgili: süre 30’unda, yani pazartesi bitiyor.","f":"das heißt (yani) · bezüglich (…ilişkin) · der Bezug (ilişki)"},{"w":"ca. / ggü.","t":"Kısaltma","k":"circa / gegenüber","c":"—","br":"ca. Latince „etrafında“ demektir: yaklaşık. ggü. ise karşılaştırma ya da muhataplık bildirir: …e karşı, …e kıyasla.","tr":"yaklaşık / …e kıyasla, karşısında","s":"Die Kosten liegen bei ca. 300 Euro, ggü. dem Vorjahr sind das 20 Prozent mehr.","st":"Masraflar yaklaşık 300 avro, geçen yıla kıyasla yüzde 20 fazla.","f":"circa (yaklaşık) · gegenüber (karşısında) · im Vergleich zu (…e kıyasla)"},{"w":"zzgl. / inkl. / excl.","t":"Kısaltma","k":"zuzüglich / inklusive / exklusive","c":"—","br":"Fiyat okumanın anahtarı: zzgl. eklenecek, inkl. dahil, excl. hariç. Kira ilanlarında da aynı mantık: kalt (yan giderler hariç) ↔ warm (dahil).","tr":"hariç, eklenerek / dahil / hariç","s":"Der Preis beträgt 850 Euro zzgl. Nebenkosten, inkl. Stellplatz.","st":"Fiyat 850 avro artı yan giderler, otopark dahil.","f":"zuzüglich (eklenerek) · abzüglich (düşülerek) · die Warmmiete (giderler dahil kira)"},{"w":"§ Abs. Nr. Satz","t":"Yasa okuma","k":"Paragraf – Absatz – Nummer – Satz","c":"—","br":"Alman yasa atfı yukarıdan aşağı daralır: § madde, Abs. fıkra, Satz cümle, Nr. bent. § 556 Abs. 3 S. 1 BGB okunuşu: 556. maddenin 3. fıkrasının 1. cümlesi.","tr":"madde – fıkra – bent – cümle","s":"Das ergibt sich aus § 556 Abs. 3 Satz 1 BGB.","st":"Bu, Medeni Kanun’un 556. maddesinin 3. fıkrasının 1. cümlesinden çıkıyor.","f":"der Paragraf (madde) · der Absatz (fıkra) · das BGB (Alman Medeni Kanunu)"},{"w":"f. / ff. / vgl.","t":"Kaynak gösterme","k":"folgende / fortfolgende / vergleiche","c":"—","br":"S. 12 f. = 12 ve sonraki sayfa; S. 12 ff. = 12 ve devamı. vgl. okuru başka bir yere yollar: „karşılaştır“. Akademik yazının standart üçlüsü.","tr":"ve sonrası / ve devamı / karşılaştırınız","s":"Vgl. dazu Müller 2023, S. 45 ff.","st":"Bununla ilgili karşılaştırınız: Müller 2023, s. 45 ve devamı.","f":"folgend (sonraki) · vergleichen (karşılaştırmak) · die Quelle (kaynak)"},{"w":"o. g. / s. o. / s. u.","t":"Kısaltma","k":"oben genannt / siehe oben / siehe unten","c":"—","br":"Metin içinde yön gösterir: yukarıda anılan, yukarıya bak, aşağıya bak. Resmî yazıda tekrar etmemek için kullanılır.","tr":"yukarıda anılan / yukarı bak / aşağı bak","s":"Die o. g. Unterlagen habe ich bereits übersandt (s. o.).","st":"Yukarıda anılan belgeleri çoktan gönderdim (yukarı bakınız).","f":"oben (yukarıda) · unten (aşağıda) · erwähnt (anılan)"},{"w":"MwSt. / netto / brutto","t":"Fatura dili","k":"Mehrwertsteuer (katma değer vergisi)","c":"—","br":"netto vergisiz, brutto vergi dahil tutardır. Maaşta da aynı çift geçerlidir: Bruttolohn (kesintiler öncesi) ↔ Nettolohn (ele geçen).","tr":"KDV / vergisiz / vergi dahil","s":"Der Betrag versteht sich netto zzgl. 19 Prozent MwSt.","st":"Tutar vergisizdir, ayrıca yüzde 19 KDV eklenir.","f":"die Mehrwertsteuer (KDV) · der Bruttolohn (brüt maaş) · der Nettolohn (net maaş)"},{"w":"Az. / Rg.-Nr. / Kd.-Nr.","t":"Dosya numaraları","k":"Aktenzeichen / Rechnungsnummer / Kundennummer","c":"—","br":"Aktenzeichen her resmî dosyanın kimliğidir: yazışmada mutlaka baş tarafa yazılır, yoksa dosya bulunamaz. Faturada Rg.-Nr., abonelikte Kd.-Nr. aynı işi görür.","tr":"dosya numarası / fatura no / müşteri no","s":"Bitte geben Sie bei allen Schreiben unser Az. 12/2025 an.","st":"Bütün yazışmalarda 12/2025 dosya numaramızı belirtin.","f":"die Akte (dosya) · das Zeichen (işaret) · die Rechnung (fatura)"},{"w":"Hd. / p. A. / c/o","t":"Adres kısaltmaları","k":"zu Händen / per Adresse","c":"—","br":"z. Hd. kişiyi işaret eder, p. A. ve c/o ise „şunun adresi üzerinden“ demektir: kendi adresin yoksa başkasının adresi üzerinden posta alırsın.","tr":"…nın dikkatine / …adresi üzerinden","s":"Herr Altundag, p. A. Familie Yilmaz, An der Tröt 38.","st":"Bay Altundag, Yılmaz ailesi adresi üzerinden, An der Tröt 38.","f":"zu Händen (elden) · der Empfänger (alıcı) · die Anschrift (adres)"},{"w":"i. A. / i. V. / gez.","t":"İmza kısaltmaları","k":"im Auftrag / in Vertretung / gezeichnet","c":"—","br":"i. A. „talimatla“ imzalar (dar yetki), i. V. „vekâleten“ imzalar (geniş yetki), gez. ise ıslak imza yerine „imzalıdır“ demektir. Yetkinin sınırını bu iki harf belirler.","tr":"talimatla / vekâleten / imzalı","s":"i. A. Klein — Sachbearbeiterin.","st":"Talimatla Klein — dosya sorumlusu."
