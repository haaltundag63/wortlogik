  const box = el("groups"); box.innerHTML = "";
  const groups = [];
  DATA.forEach((s,i)=>{ let g = groups.find(x=>x.n===s.g); if(!g){ g={n:s.g, secs:[]}; groups.push(g); } g.secs.push(i); });

  groups.forEach(g=>{
    const secs = g.secs.filter(i=>{
      if(!q) return true;
      const s = DATA[i];
      if(s.n.toLowerCase().includes(q) || g.n.toLowerCase().includes(q)) return true;
      return s.cards.some(c => (c.w+" "+c.k+" "+c.tr+" "+c.f).toLowerCase().includes(q));
    });
    if(!secs.length) return;
    const wrap = document.createElement("div"); wrap.className = "grp";
    const count = secs.reduce((n,i)=>n+DATA[i].cards.length,0);
    let gd=0, gdue=0;
    secs.forEach(i=>DATA[i].cards.forEach((c,ci)=>{const id=i+"-"+ci; if(isDone(id))gd++; if(isDue(id))gdue++;}));
    const gp = count ? Math.round(gd/count*100) : 0;
    let gnext = 0;
    secs.forEach(i=>DATA[i].cards.forEach((c,ci)=>{const id=i+"-"+ci;
      if(isDone(id)){const d=daysLeft(id); if(d>0 && (!gnext||d<gnext))gnext=d;}}));
    const open = q ? true : (openGroups[g.n] !== false);
    const meta = GROUP_META[g.n] || {};
    const rank = groups.indexOf(g)+1;
    wrap.innerHTML = '<h2><span class="gh"><b>'+rank+'. '+g.n+'</b>'+(meta.w?'<i>'+meta.w+'</i>':'')+
      '<span class="gprog"><span class="bar2"><i style="width:'+gp+'%"></i></span><span>✓ '+gd+' · kalan <b>'+(count-gd)+'</b> · %'+gp+(gdue?' · <span class="due">'+gdue+' tekrar</span>':(gnext?' · en yakın tekrar '+gnext+' gün':''))+'</span></span>'+
      '</span> <em>'+(open?"▾":"▸")+'</em></h2>';
    const grid = document.createElement("div"); grid.className = "grid" + (open?"":" hidden");
    secs.forEach(i=>{
      const s = DATA[i], d = secDone(i), pct = Math.round(d/s.cards.length*100);
      const sdue = s.cards.reduce((n,c,ci)=>n+(isDue(i+"-"+ci)?1:0),0);
      const t = document.createElement("div"); t.className = "tile"; t.style.borderTopColor = s.c;
      if(pct===100)t.className += " full";
      t.innerHTML =
        '<div class="thead"><span class="ring" style="--p:'+pct+';--c:'+s.c+'"><i>'+pct+'%</i></span>'+
        '<span><h3>'+s.n+'</h3><div class="sub2">'+s.cards.length+' kart · çevrilen '+d+'</div></span></div>'+
        '<p>'+s.e+'</p>'+
        '<div class="foot"><span class="pill">kalan '+(s.cards.length-d)+'</span>'+
        (sdue?'<span class="duebadge">'+sdue+' tekrar</span>':'')+
        '<span class="mini"><i style="width:'+pct+'%;background:'+s.c+'"></i></span></div>';
      t.onclick = ()=> openStudy(i, q);
      grid.appendChild(t);
    });
    const gOpen = groupUnlocked(g.n);
    if(!gOpen){
      wrap.classList.add("locked");
      const prev = GROUPS_SEQ[GROUPS_SEQ.indexOf(g.n)-1];
      const msg = document.createElement("div"); msg.className = "lockmsg";
      msg.innerHTML = "🔒 Bu grup henüz kilitli. Açılması için <b>"+prev+"</b> grubunun %"+UNLOCK_PCT+"’i bitmeli — şu an %"+groupPct(prev)+".";
      wrap.appendChild(msg);
      wrap.querySelector("h2").onclick = ()=>{};
      box.appendChild(wrap); return;
    }
    wrap.querySelector("h2").onclick = ()=>{ openGroups[g.n] = !open; renderHome(el("search").value); };
    wrap.appendChild(grid); box.appendChild(wrap);
  });
  const total = ALL.length, d = Object.keys(done).length;
  const due = ALL.reduce((n,c)=>n+(isDue(c.id)?1:0),0);
  el("st-due").textContent = due;
  el("go-due").textContent = due ? "Tekrarı başlat ("+due+")" : "Tekrar bekleyen yok";
  const inDays = k => ALL.reduce((n,c)=> n + (isDone(c.id) && daysLeft(c.id) === k ? 1 : 0), 0);
  const within = k => ALL.reduce((n,c)=> n + (isDone(c.id) && daysLeft(c.id) > 0 && daysLeft(c.id) <= k ? 1 : 0), 0);
  const soon = ALL.filter(c=>isDone(c.id) && daysLeft(c.id) > 0).map(c=>daysLeft(c.id));
  const min = soon.length ? Math.min(...soon) : 0;
  const restNew = Math.max(0, goal - day.n);
  const restDue = due;
  const restAll = restNew + restDue;
  const planned = goal + due + (day.r||0);
  const doneToday = day.n + (day.r||0);
  el("day-bar").style.width = (planned ? Math.min(100, Math.round(doneToday/planned*100)) : 0) + "%";
  el("go-today").textContent = restAll ? "Bugünün destesi (" + restAll + ")" : "Bugün tamam ✓";
  const goalLine = restAll
    ? "Bugünkü program: <b>"+planned+"</b> kart · bitti "+(day.n + (day.r||0))+" · <b class=\"rest\">kalan "+restAll+"</b> ("+restNew+" yeni + "+restDue+" tekrar)"
    : "Bugünkü program tamam ✓ · "+(day.n + (day.r||0))+" kart yapıldı";
  el("st-plan").innerHTML = goalLine + "<br>" + (due
    ? "Bugün <b>"+due+"</b> kart tekrar edilmeli · yarın "+inDays(1)+" · 7 gün içinde "+within(7)
    : (min ? "Bugün tekrar yok · en yakın tekrar <b>"+min+" gün</b> sonra ("+inDays(min)+" kart)" : "Henüz tekrar planı yok — bir kartı ✓ ile işaretle, takvim başlasın"));
  el("st-total").textContent = total;
  el("st-done").textContent = d;
  const p = total ? Math.round(d/total*100) : 0;
  el("st-pct").textContent = p + "%";
  el("st-bar").style.width = p + "%";
}

/* ---------- study ---------- */
let list = [], idx = 0, flipped = false;
let sessionFlips = 0;
let mode = { filter:"all", shuffle:false, reverse:false, free:false };
const shuffleArr = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function applyMode(cards){
  let l = cards.slice();
  if(mode.filter==="star") l = l.filter(c=>star[c.id]);
  if(mode.filter==="new")  l = l.filter(c=>!isDone(c.id));
  if(mode.filter==="due")  l = l.filter(c=>isDue(c.id));
  if(mode.shuffle) l = shuffleArr(l);
  return l;
}

function openStudy(si, q){
  const s = DATA[si];
  list = s.cards.map((c,ci)=>({...c, si, ci, sec:s.n, id:si+"-"+ci}));
  if(q){
    const f = list.filter(c => (c.w+" "+c.k+" "+c.tr+" "+c.f).toLowerCase().includes(q));
    if(f.length) list = f;
  }
  list = applyMode(list);
  if(!list.length){ alert(mode.filter==="star" ? "Bu bölümde yıldızlı kart yok." : "Bu bölümdeki tüm kartlar çalışıldı."); return; }
  idx = 0; flipped = false;
  el("s-title").textContent = s.n; el("s-title").dataset.n = s.n;
  el("study").classList.add("on");
  draw();
}

function draw(){
  const c = list[idx];
  if(!c){ el("face-f").innerHTML = '<p class="empty">Kart yok.</p>'; return; }
  el("card").classList.remove("flip"); flipped = false;
  const restHere = list.filter(x=>!isDone(x.id)).length;
  el("s-count").textContent = (idx+1)+" / "+list.length+(restHere?" · kalan "+restHere:"");
  el("s-title").textContent = (el("s-title").dataset.n || el("s-title").textContent).replace(/ · yeni \d+\$/,"") + (sessionFlips?" · yeni "+sessionFlips:"");
  el("s-srs").innerHTML = srsText(c.id);
  el("s-bar").style.width = ((idx+1)/list.length*100) + "%";
  el("card").classList.toggle("rev", mode.reverse);
  if(mode.reverse){
    el("face-f").innerHTML =
      '<div class="tags"><span class="tag rev">Türkçe → Almanca</span><span class="tag">'+c.t+'</span></div>'+
      '<h2 class="word">'+c.tr+'</h2>'+
      '<p class="satz">'+c.st+'</p>'+
      '<div class="hint">karta dokun → Almancası</div>';
    el("face-b").innerHTML =
      '<div class="mean">'+c.w+'</div>'+
      '<div class="blk"><h4>Yapı</h4><p>'+c.k+(c.c&&c.c!=="—"?' · '+c.c:'')+'</p></div>'+
      '<div class="blk logic"><h4>Mantık köprüsü</h4><p>'+c.br+'</p></div>'+
      '<div class="blk"><h4>Cümle</h4><p>'+c.s+'</p></div>';
    el("b-star").classList.toggle("on", !!star[c.id]);
    el("b-done").style.opacity = done[c.id] ? 1 : .75;
    return;
  }
  el("face-f").innerHTML =
    '<div class="tags"><span class="tag acc">'+c.t+'</span>'+(c.c && c.c!=="—" ? '<span class="tag">'+c.c+'</span>' : '')+(c.m&&c.m.length ? '<span class="tag multi">'+(c.m.length+1)+' anlam</span>' : '')+'</div>'+
    '<h2 class="word">'+c.w+'</h2>'+
    '<div class="split">'+c.k+'</div>'+
    '<p class="satz">'+c.s+'</p>'+
    '<div class="hint">karta dokun → mantık ve anlam · ✓ = çalışıldı say ve tekrara al</div>';
  let extra = "";
  if(c.m && c.m.length){
    extra = c.m.map((x,i)=>'<div class="blk mean2"><h4>Anlam '+(i+2)+'</h4><p class="m-tr">'+x.tr+'</p><p class="m-de">'+x.s+'</p><p class="m-st">'+x.st+'</p></div>').join("");
  }
  el("face-b").innerHTML =
    '<div class="mean">'+(c.m&&c.m.length?'1. ':'')+c.tr+'</div>'+
    '<div class="blk logic"><h4>Mantık köprüsü</h4><p>'+c.br+'</p></div>'+
    '<div class="blk"><h4>Cümle</h4><p>'+c.st+'</p></div>'+
    extra+
    '<div class="blk fam"><h4>Kelime ailesi</h4>'+c.f.split(" · ").map(x=>{
      const i=x.lastIndexOf(" (");
      return i>0 ? '<p class="fi"><b>'+x.slice(0,i)+'</b><span>'+x.slice(i+2,-1)+'</span></p>' : '<p class="fi"><b>'+x+'</b></p>';
    }).join("")+'</div>';
  el("b-star").classList.toggle("on", !!star[c.id]);
  el("b-done").style.opacity = done[c.id] ? 1 : .75;
}

el("card").onclick = async ()=>{
  flipped = !flipped; el("card").classList.toggle("flip", flipped);
  if(flipped){
    const c = list[idx];
    if(c && !isDone(c.id)){
      done[c.id] = { n: 1, t: Date.now() };
      sessionFlips++;
      await sset("wl-done", done);
      await logToday(true);
      renderHome(el("search").value);
      el("s-srs").innerHTML = srsText(c.id);
      const restHere = list.filter(x=>!isDone(x.id)).length;
      el("s-count").textContent = (idx+1)+" / "+list.length+(restHere?" · kalan "+restHere:"");
  el("s-title").textContent = (el("s-title").dataset.n || el("s-title").textContent).replace(/ · yeni \d+\$/,"") + (sessionFlips?" · yeni "+sessionFlips:"");
    }
  }
};
el("b-next").onclick = ()=>{ if(idx < list.length-1){ idx++; draw(); } else { summary(); } };
function summary(){
  const total=list.length, fertig=list.filter(c=>isDone(c.id)).length, offen=total-fertig;
  const morgen=list.filter(c=>isDone(c.id)&&daysLeft(c.id)===1).length;
  const bald=list.filter(c=>isDone(c.id)&&daysLeft(c.id)>0).map(c=>daysLeft(c.id));
  const min=bald.length?Math.min(...bald):0;
  alert("Deste sonu\n\nToplam: "+total+" kart\n✓ işaretlenen: "+fertig+"\nHenüz işaretlenmeyen: "+offen+
    (min?("\n\nEn yakın tekrar: "+min+" gün sonra"+(morgen?" (yarın "+morgen+" kart)":"")):"\n\nHiç kart ✓ ile işaretlenmedi — bu yüzden tekrar takvimi başlamadı."));
}
el("b-prev").onclick = ()=>{ if(idx > 0){ idx--; draw(); } };
el("b-star").onclick = async ()=>{ const c = list[idx]; star[c.id] = !star[c.id]; if(!star[c.id]) delete star[c.id]; el("b-star").classList.toggle("on", !!star[c.id]); await sset("wl-star", star); };
async function mark(c, level){
  const first = !isDone(c.id);
  done[c.id] = { n: level, t: Date.now() };
  await sset("wl-done", done);
  await logToday(first);
}
el("b-know").onclick = async ()=>{ const c = list[idx];
  await mark(c, STEPS.length);
  toast("Biliyorum · " + STEPS[STEPS.length-1] + " gün sonra tekrar");
  el("s-srs").innerHTML = srsText(c.id);
  if(idx < list.length-1){ idx++; draw(); } else { draw(); }
};
el("b-done").onclick = async ()=>{ const c = list[idx];
  const first = !isDone(c.id);
  done[c.id] = { n: Math.min(lvl(c.id)+1, STEPS.length), t: Date.now() };
  await logToday(first);
  await sset("wl-done", done);
  toast("Kaydedildi · " + STEPS[Math.min(lvl(c.id), STEPS.length)-1] + " gün sonra tekrar");
  el("s-srs").innerHTML = srsText(c.id);
  checkUnlock(c.si);
  if(idx < list.length-1){ idx++; draw(); } else { draw(); } };
el("btn-back").onclick = ()=>{ el("study").classList.remove("on"); renderHome(el("search").value); };
function checkUnlock(si){
  if(si === undefined) return;
  const g = DATA[si].g, i = GROUPS_SEQ.indexOf(g), next = GROUPS_SEQ[i+1];
  if(next && !ALWAYS_OPEN.includes(next) && groupPct(g) === UNLOCK_PCT) toast("Yeni grup açıldı: " + next);
  else if(secComplete(si)) toast("Bölüm tamam: " + DATA[si].n);
}
el("search").oninput = e => renderHome(e.target.value);

document.querySelectorAll(".chip[data-f]").forEach(b=>{
  b.onclick = ()=>{ mode.filter = b.dataset.f;
    document.querySelectorAll(".chip[data-f]").forEach(x=>x.classList.toggle("on", x===b)); };
});
el("t-free").onclick = ()=>{ mode.free=!mode.free; el("t-free").classList.toggle("on",mode.free); renderHome(el("search").value); };
el("t-shuffle").onclick = ()=>{ mode.shuffle=!mode.shuffle; el("t-shuffle").classList.toggle("on",mode.shuffle); };
el("t-rev").onclick = ()=>{ mode.reverse=!mode.reverse; el("t-rev").classList.toggle("on",mode.reverse); if(el("study").classList.contains("on")) draw(); };

function startList(cards, title){
  if(!cards.length){ alert("Bu seçimde kart yok."); return; }
  list = cards; idx = 0; flipped = false;
  el("s-title").textContent = title; el("s-title").dataset.n = title;
  el("study").classList.add("on");
  draw();
}
el("go-today").onclick = ()=>{
  const dueC = ALL.filter(c=>isDue(c.id));
  const restNew = Math.max(0, goal - day.n);
  const newC = shuffleArr(ALL.filter(c=>!isDone(c.id) && unlocked(c.si))).slice(0, restNew);
  const deck = shuffleArr(dueC.concat(newC));
  if(!deck.length){ alert("Bugünün programı tamam. Yarın "+ALL.reduce((n,c)=>n+(isDone(c.id)&&daysLeft(c.id)===1?1:0),0)+" tekrar var."); return; }
  startList(deck, "Bugünün destesi ("+dueC.length+" tekrar + "+newC.length+" yeni)");
};
document.querySelectorAll(".gchip").forEach(b=>{
  b.onclick = async ()=>{ goal = +b.dataset.g;
    document.querySelectorAll(".gchip").forEach(x=>x.classList.toggle("on", x===b));
    await sset("wl-goal", goal); renderHome(el("search").value); };
});
el("go-due").onclick = ()=> startList(shuffleArr(ALL.filter(c=>isDue(c.id))), "Tekrar zamanı gelenler");
el("go-star").onclick = ()=> startList(shuffleArr(ALL.filter(c=>star[c.id])), "★ Yıldızlı kartlar");
el("go-new").onclick  = ()=> startList(shuffleArr(ALL.filter(c=>!isDone(c.id) && unlocked(c.si))).slice(0,60), "Çalışılmamış kartlar");
el("go-all").onclick  = ()=> startList(shuffleArr(ALL.filter(c=>unlocked(c.si))).slice(0,20), "Rastgele 20 kart");
el("reset").onclick = async ()=>{
  if(!confirm("Tüm ilerleme ve yıldızlar silinsin mi?")) return;
  done = {}; star = {}; day = { d: today(), n: 0, r: 0 }; await sset("wl-day", day);
  await sset("wl-done", done);
  toast("Kaydedildi · " + STEPS[Math.min(lvl(c.id), STEPS.length)-1] + " gün sonra tekrar");
  el("s-srs").innerHTML = srsText(c.id); await sset("wl-star", star);
  renderHome(el("search").value);
};
document.addEventListener("keydown", e=>{
  if(!el("study").classList.contains("on")) return;
  if(e.key === "ArrowRight") el("b-next").click();
  if(e.key === "ArrowLeft") el("b-prev").click();
  if(e.key === " "){ e.preventDefault(); el("card").click(); }
});

(async ()=>{
  
  done = (await sget("wl-done")) || {};
  star = (await sget("wl-star")) || {};
  day = (await sget("wl-day")) || { d: today(), n: 0, r: 0 };
  if(day.d !== today()) day = { d: today(), n: 0, r: 0 };
  goal = (await sget("wl-goal")) || 20;
  document.querySelectorAll(".gchip").forEach(b=>b.classList.toggle("on", +b.dataset.g === goal));
  migrate();
  const secs = DATA.length, cards = ALL.length;
  el("foot").innerHTML = "Wortlogik · "+cards+" kart · "+secs+" bölüm · sürüm 1.1<br>"+"kayıtlı ilerleme: "+Object.keys(done).length+" kart · kayıt: "+(hasWS?"uygulama deposu":(hasLS?"tarayıcı belleği":"yalnızca bu oturum"))+"<br>"+
    "İlerleme bu cihazda saklanıyor" + (hasWS ? "" : (hasLS ? " (tarayıcı belleği)" : " (yalnızca bu oturum)")) +
    "<br>iPhone’da: Paylaş → Ana Ekrana Ekle";
  renderHome("");
})();
</script>
