lefon yerine kısa bir e-posta yazayım.","f":"die Statt (yer) · stattdessen (onun yerine) · stattfinden (gerçekleşmek)"},{"w":"oberhalb ↔ unterhalb","t":"Edat çifti (+ Genitiv)","k":"ober/unter + halb (yan, taraf)","c":"—","br":"halb burada „yarım“ değil, „taraf“ demektir — innerhalb ve außerhalb ile aynı yapı. Yani üst tarafında ve alt tarafında. Temassızdır: über’den farkı, sınırı değil bölgeyi göstermesidir.","tr":"…üst tarafında ↔ …alt tarafında","s":"Oberhalb des Dorfes beginnt der Wald.","st":"Köyün üst tarafında orman başlıyor.","f":"innerhalb (içinde) · außerhalb (dışında) · über (üstünde)"},{"w":"diesseits ↔ jenseits","t":"Edat çifti (+ Genitiv)","k":"dies (bu) / jen (öte) + Seite (taraf)","c":"—","br":"Seite taraftır: bu yaka ↔ öte yaka. Somut sınır için de mecazî sınır için de kullanılır: jenseits der Grenze, jenseits aller Vernunft (aklın ötesinde).","tr":"…bu yakasında ↔ …öte yakasında","s":"Jenseits der Grenze gelten andere Regeln.","st":"Sınırın öte yakasında başka kurallar geçerli.","f":"die Seite (taraf) · die Grenze (sınır) · jenseitig (öte taraftaki)"},{"w":"mittels / vermittels (+ Genitiv)","t":"Präposition","k":"Mittel (araç) + -s","c":"—","br":"das Mittel araçtır (bkz. die Mitte: orta — aradaki şey). Yani „şu araçla“. Teknik ve resmî metinlerin kelimesi; günlük dilde yerine mit ya da mithilfe kullanılır.","tr":"…aracılığıyla, …vasıtasıyla","s":"Die Daten werden mittels eines sicheren Verfahrens übertragen.","st":"Veriler güvenli bir yöntemle aktarılıyor.","f":"das Mittel (araç) · mithilfe (yardımıyla) · das Verfahren (yöntem)"},{"w":"samt / nebst (+ Dativ)","t":"Präposition (eski)","k":"samt (birlikte) / nebst (yanında)","c":"—","br":"İkisi de „ile birlikte“ demektir ama bugün eskimiştir; resmî metinlerde ve emlak ilanlarında hâlâ görülür: samt Zubehör (aksesuarlarıyla birlikte). Günlük karşılığı: mit ya da einschließlich.","tr":"…ile birlikte (eski kullanım)","s":"Die Wohnung wird samt Einbauküche vermietet.","st":"Daire ankastre mutfağıyla birlikte kiraya veriliyor.","f":"insgesamt (toplam olarak) · zusammen (birlikte) · das Zubehör (aksesuar)"}]},{"n":"Telefon ve görüşme kalıpları","e":"resmî konuşmanın hazır cümleleri","c":"#4d7c5f","g":"Edatlı fiiller & kalıplar","cards":[{"w":"Ich rufe an wegen …","t":"Kalıp","k":"anrufen + wegen (+ Genitiv)","c":"ruft an – rief an – hat angerufen","br":"Konuşmayı açan cümle: konuyu ilk saniyede söylemek Almanca telefon görüşmesinin beklentisidir. Kısa hâli: Es geht um …","tr":"… nedeniyle arıyorum","s":"Ich rufe an wegen der Nebenkostenabrechnung für 2025.","st":"2025 yan gider hesabı nedeniyle arıyorum.","f":"anrufen (aramak) · Es geht um … (konu şu) · wegen (…yüzünden)"},{"w":"Worum geht es?","t":"Kalıp","k":"worum (wo + r + um) + gehen","c":"—","br":"„Konu neyin etrafında dönüyor?“ es geht um kalıbının sorusu. Santralin ilk sorusudur; cevabı hazır olmalı.","tr":"Konu nedir?","s":"Worum geht es genau, damit ich Sie richtig verbinden kann?","st":"Sizi doğru bağlayabilmem için konu tam olarak nedir?","f":"es geht um (söz konusu olan) · der Grund (sebep) · das Anliegen (talep, mesele)"},{"w":"Könnten Sie mich bitte verbinden?","t":"Kalıp","k":"verbinden (bağlamak) + Konjunktiv II","c":"verbindet – verband – hat verbunden","br":"binden = bağlamak; hattı bağlamak. Konjunktiv rica kipini kurar. Karşı taraf: Ich stelle Sie durch.","tr":"Beni bağlayabilir misiniz?","s":"Könnten Sie mich bitte mit Herrn Claßen verbinden?","st":"Beni lütfen Bay Claßen’a bağlayabilir misiniz?","f":"verbinden (bağlamak) · durchstellen (hattı aktarmak) · die Verbindung (bağlantı)"},{"w":"Er ist gerade nicht am Platz","t":"Kalıp","k":"am Platz (yerinde) sein","c":"—","br":"„Şu an yerinde değil“ — nerede olduğunu söylemeden kibarca bilgi verme. Eşdeğerleri: Er ist in einer Besprechung / nicht im Haus.","tr":"Şu an yerinde değil","s":"Herr Frink ist gerade nicht am Platz — kann ich etwas ausrichten?","st":"Bay Frink şu an yerinde değil — bir şey iletebilir miyim?","f":"der Platz (yer) · die Besprechung (toplantı) · ausrichten (iletmek)"},{"w":"Kann ich etwas ausrichten?","t":"Kalıp","k":"ausrichten (iletmek)","c":"richtet aus – richtete aus – hat ausgerichtet","br":"Mesajı karşıya yöneltmek. Telefonun standart nezaket cümlesi; cevabı: Sagen Sie ihm bitte, dass …","tr":"Bir şey iletmemi ister misiniz?","s":"Kann ich ihm etwas ausrichten, oder rufen Sie später zurück?","st":"Ona bir şey ileteyim mi, yoksa sonra mı arayacaksınız?","f":"ausrichten (iletmek) · zurückrufen (geri aramak) · die Nachricht (mesaj)"},{"w":"Ich melde mich zurück","t":"Kalıp","k":"sich melden (bildirmek) + zurück","c":"meldet – meldete – hat gemeldet","br":"„Kendimi geri bildiririm“ = size döneceğim. Zaman eklemek Almanca nezaketinde önemlidir: bis morgen, im Laufe der Woche.","tr":"Size döneceğim","s":"Ich melde mich bis spätestens Freitag bei Ihnen zurück.","st":"En geç cumaya kadar size döneceğim.","f":"sich melden (haber vermek) · die Rückmeldung (geri bildirim) · zurückrufen (geri aramak)"},{"w":"Da bin ich überfragt","t":"Kalıp","k":"über + fragen → überfragt (soruyla aşılmış)","c":"—","br":"„Bu soru beni aşıyor“ — bilmediğini kabul etmenin kibar ve doğal yolu. „Ich weiß nicht“ ten çok daha profesyonel durur.","tr":"Orada bilgim yok, beni aşar","s":"Bei der Berechnung bin ich überfragt — da hilft Ihnen die Fachabteilung weiter.","st":"Hesaplama konusunda bilgim yok — orada uzman birim yardımcı olur.","f":"überfragen (yanıtlayamayacağı soruyu sormak) · weiterhelfen (yardımcı olmak) · die Fachabteilung (uzman birim)"},{"w":"Habe ich Sie richtig verstanden, dass …?","t":"Kalıp","k":"richtig verstehen + dass-cümlesi","c":"—","br":"Anlaşılanı geri yansıtıp teyit etmek. Yanlış anlaşılmaların önünü kesen tek cümle; zor görüşmelerde en değerli kalıp.","tr":"Sizi doğru mu anladım: …?","s":"Habe ich Sie richtig verstanden, dass der Termin verschoben wurde?","st":"Sizi doğru mu anladım: randevu ertelendi mi?","f":"verstehen (anlamak) · das Missverständnis (yanlış anlaşılma) · bestätigen (teyit etmek)"},{"w":"Darf ich kurz einhaken?","t":"Kalıp","k":"ein + Haken (çengel) → çengel atmak","c":"hakt ein – hakte ein – hat eingehakt","br":"Konuşmaya çengel atıp araya girmek. Sözü kesmenin kabul gören biçimi; izin isteyerek yapılır.","tr":"Kısaca araya girebilir miyim?","s":"Darf ich an dieser Stelle kurz einhaken?","st":"Bu noktada kısaca araya girebilir miyim?","f":"der Haken (çengel) · unterbrechen (sözünü kesmek) · nachhaken (üstüne gitmek, deşmek)"},{"w":"Lassen Sie mich bitte ausreden","t":"Kalıp","k":"aus + reden (konuşmayı sonuna kadar götürmek)","c":"redet aus – redete aus – hat ausgeredet","br":"aus- burada „sonuna kadar“: sözü bitirmek. Nazik ama net bir sınır cümlesi.","tr":"Lütfen sözümü bitireyim","s":"Lassen Sie mich bitte kurz ausreden, dann können Sie gern antworten.","st":"Lütfen sözümü bitireyim, sonra memnuniyetle cevap verebilirsiniz.","f":"ausreden (sözünü bitirmek) · unterbrechen (kesmek) · jemandem etwas ausreden (vazgeçirmek)"},{"w":"Ich fasse kurz zusammen","t":"Kalıp","k":"zusammenfassen (bir arada tutmak)","c":"fasst zusammen – fasste zusammen – hat zusammengefasst","br":"Görüşmeyi kapatırken üzerinde anlaşılanı tekrar etmek. Sonradan çıkacak tartışmaları önleyen adım; ardından yazılı teyit gelir.","tr":"Kısaca özetliyorum","s":"Ich fasse kurz zusammen: Du kaufst ein, ich koche.","st":"Kısaca özetliyorum: sen alışverişi yap, ben yemek yapayım.","f":"die Zusammenfassung (özet) · festhalten (kayda geçirmek) · schriftlich bestätigen (yazılı teyit etmek)"},{"w":"Ich komme darauf zurück","t":"Kalıp","k":"zurückkommen auf (A)","c":"kommt zurück – kam zurück – ist zurückgekommen","br":"Bir konuya sonra dönmek. Şimdi tartışmayı kapatır ama konuyu kapatmaz — müzakerede zaman kazandıran cümle.","tr":"Bu konuya döneceğim","s":"Auf diesen Punkt komme ich im nächsten Gespräch zurück.","st":"Bu noktaya bir sonraki görüşmede döneceğim.","f":"zurückkommen auf (…e dönmek) · aufgreifen (konuyu yeniden ele almak) · vertagen (ertelemek)"},{"w":"Vielen Dank für Ihre Zeit","t":"Kalıp","k":"Dank (teşekkür) + für + Zeit (zaman)","c":"—","br":"Görüşmeyi kapatan standart cümle. Almanca nezaketi zamanı bir değer sayar; teşekkür ona yöneliktir.","tr":"Zaman ayırdığınız için teşekkürler","s":"Vielen Dank für Ihre Zeit und die schnelle Auskunft.","st":"Zaman ayırdığınız ve hızlı bilgi verdiğiniz için çok teşekkürler.","f":"der Dank (teşekkür) · danken (teşekkür etmek) · die Auskunft (bilgi)"},{"w":"Ich hätte da noch eine Bitte","t":"Kalıp","k":"hätte (Konjunktiv II) + die Bitte (rica)","c":"—","br":"Konjunktiv ricayı küçültür, da ve noch onu araya sıkıştırır. Görüşmenin sonunda ek talep açmanın en yumuşak yolu.","tr":"Bir ricam daha olacaktı","s":"Ich hätte da noch eine Bitte: Könnten Sie mir das schriftlich bestätigen?","st":"Bir ricam daha olacaktı: bunu bana yazılı teyit edebilir misiniz?","f":"die Bitte (rica) · bitten um (rica etmek) · schriftlich (yazılı)"}]},{"n":"Resmî yazı iskeleti","e":"Betreff, hiermit, anbei, vorsorglich, hilfsweise…","c":"#5c4b8a","g":"Edatlı fiiller & kalıplar","cards":[{"w":"der Betreff","t":"Nomen, -e","k":"betreffen (ilgilendirmek)","c":"der Betreff, die Betreffe","br":"betreffen = bir konuya değmek, onu ilgilendirmek. Konu satırı: bir bakışta dosyanın hangi işe ait olduğunu söyler. Kısaltması: Betr.","tr":"konu (satırı)","s":"Betreff: Widerspruch gegen die Nebenkostenabrechnung 2025.","st":"Konu: 2025 yan gider hesabına itiraz.","f":"betreffen (ilgilendirmek) · betreffend (ilgili) · der Verwendungszweck (havale açıklaması)"},{"w":"Sehr geehrte Damen und Herren","t":"Kalıp","k":"geehrt (ehren: saygı göstermek) → saygıdeğer","c":"—","br":"Muhatabı bilmediğinde tek doğru hitap. İsim biliniyorsa daima isim kullanılır: Sehr geehrte Frau Klein. Hitaptan sonra virgül gelir ve sonraki cümle küçük harfle başlar.","tr":"Sayın Yetkili / Sayın İlgililer","s":"Sehr geehrte Damen und Herren, hiermit lege ich Widerspruch ein.","st":"Sayın İlgililer, işbu yazıyla itiraz ediyorum.","f":"ehren (saygı göstermek) · die Ehre (onur) · Mit freundlichen Grüßen (saygılarımla)"},{"w":"hiermit","t":"Adverb","k":"hier (burada) + mit (ile)","c":"—","br":"„Bu yazıyla“ — yazıyı hukuki işlemin kendisi hâline getirir. Bir irade beyanı açan kelimedir: hiermit kündige ich, hiermit widerspreche ich.","tr":"işbu yazıyla, bununla","s":"Hiermit widerrufe ich meine Einwilligung zur Datenverarbeitung.","st":"İşbu yazıyla veri işlemeye verdiğim rızayı geri alıyorum.","f":"die Willenserklärung (irade beyanı) · hiermit bestätige ich (işbu yazıyla teyit ederim) · damit (bununla)"},{"w":"anbei / in der Anlage","t":"Kalıp","k":"an + bei (yanında) / Anlage (ek)","c":"—","br":"Kâğıt ekleri duyurur. anbei kısa ve resmîdir, in der Anlage biraz daha ağır. E-postada dosya için im Anhang kullanılır.","tr":"ekte, ilişikte","s":"Anbei übersende ich Ihnen die Kopien der Zählerstände.","st":"Ekte size sayaç değerlerinin kopyalarını gönderiyorum.","f":"die Anlage (ek belge) · der Anhang (e-posta eki) · beifügen (iliştirmek)"},{"w":"fristwahrend","t":"Adjektiv","k":"Frist (süre) + wahren (korumak)","c":"—","br":"wahren = korumak, muhafaza etmek. Gerekçe henüz hazır değilse önce kısa bir yazı gönderilir: itiraz süresini korur, gerekçe sonra sunulur. Alman hukukunda hayat kurtaran kelime.","tr":"süreyi koruyan (ön itiraz)","s":"Fristwahrend lege ich Widerspruch ein; die Begründung reiche ich nach.","st":"Süreyi korumak üzere itiraz ediyorum; gerekçeyi sonradan sunacağım.","f":"wahren (korumak) · die Frist (süre) · nachreichen (sonradan sunmak)"},{"w":"vorsorglich","t":"Adverb / Adjektiv","k":"Vorsorge (önceden bakım) + -lich","c":"—","br":"„Her ihtimale karşı“: bir işlemi zorunlu olmasa da güvence için yapmak. Hukuk yazışmasının temkin kelimesi.","tr":"ihtiyaten, her ihtimale karşı","s":"Vorsorglich weise ich darauf hin, dass die Zahlung unter Vorbehalt erfolgt.","st":"İhtiyaten belirtirim ki ödeme çekince altında yapılmaktadır.","f":"die Vorsorge (önlem) · der Vorbehalt (çekince) · unter Vorbehalt (çekince ile)"},{"w":"hilfsweise","t":"Adverb","k":"Hilfe (yardım) + -weise (tarzında)","c":"—","br":"Birinci talep kabul edilmezse geçerli olacak ikinci talebi açar: „olmazsa şu“. Dilekçelerde basamak kurar: Hauptantrag — hilfsweise Hilfsantrag.","tr":"ikincil olarak, olmazsa","s":"Ich beantrage die Aufhebung des Bescheids, hilfsweise die Herabsetzung des Betrags.","st":"Kararın kaldırılmasını, olmazsa tutarın indirilmesini talep ediyorum.","f":"der Hilfsantrag (ikincil talep) · beantragen (talep etmek) · ersatzweise (yerine geçmek üzere)"},{"w":"unter Vorbehalt","t":"Kalıp","k":"vor + behalten (saklamak)","c":"—","br":"„Hakkı saklı tutarak“: ödemeyi yaparsın ama itiraz hakkını kaybetmezsin. Kayıtsız ödeme, borcu kabul sayılabilir — bu iki kelime bunu önler.","tr":"çekince ile, hakkı saklı tutarak","s":"Die Zahlung erfolgt ausdrücklich unter Vorbehalt der Rückforderung.","st":"Ödeme, geri isteme hakkı açıkça saklı tutularak yapılmaktadır.","f":"der Vorbehalt (çekince) · sich vorbehalten (hakkını saklı tutmak) · die Rückforderung (geri talep)"},{"w":"im Übrigen","t":"Kalıp","k":"übrig (geriye kalan)","c":"—","br":"„Bunun dışında, kaldı ki“ — asıl argümandan sonra ek bir noktayı eklemenin resmî yolu. Dilekçelerde çok sık.","tr":"kaldı ki, ayrıca","s":"Im Übrigen fehlt der Abrechnung die Angabe des Verteilerschlüssels.","st":"Kaldı ki hesapta dağıtım anahtarı da belirtilmemiş.","f":"übrig (geriye kalan) · übrigens (bu arada) · ferner (ayrıca)"},{"w":"Ich bitte um Bestätigung","t":"Kalıp","k":"bitten um + Bestätigung (bestätigen: teyit etmek)","c":"—","br":"Yazışmayı kapatan güvenlik cümlesi: karşı tarafın yazıyı aldığını yazılı hâle getirir. İspat yükü açısından değerlidir.","tr":"Teyit rica ederim","s":"Ich bitte um kurze Bestätigung des Eingangs.","st":"Yazının ulaştığına dair kısa bir teyit rica ederim.","f":"bestätigen (teyit etmek) · der Eingang (ulaşma) · die Empfangsbestätigung (alındı teyidi)"},{"w":"Für Rückfragen stehe ich zur Verfügung","t":"Kalıp","k":"Rückfrage (geri soru) + zur Verfügung stehen","c":"—","br":"Yazının kapanış nezaketi: konuyu kapatmadan iletişimi açık bırakır. Neredeyse her resmî mektubun son cümlesinden biridir.","tr":"Sorularınız için hazırım","s":"Für Rückfragen stehe ich Ihnen gerne zur Verfügung.","st":"Sorularınız için memnuniyetle hazırım.","f":"die Rückfrage (geri soru) · zur Verfügung stehen (hazır olmak) · sich melden (haber vermek)"},{"w":"Mit freundlichen Grüßen","t":"Kalıp","k":"freundlich (dostça) + Grüße (selamlar)","c":"—","br":"Standart kapanış; kısaltması MfG sayılır ama resmî yazıda açık yazılır. Daha sıcak biçimi Mit besten Grüßen, resmîsi Hochachtungsvoll (bugün ağır ve mesafeli durur).","tr":"Saygılarımla","s":"Mit freundlichen Grüßen — Haci Altundag","st":"Saygılarımla — Haci Altundag","f":"der Gruß (selam) · grüßen (selamlamak) · Hochachtungsvoll (en derin saygılarımla)"},{"w":"Im Voraus vielen Dank","t":"Kalıp","k":"im Voraus (önceden) + Dank","c":"—","br":"Yapılacak iş için önceden teşekkür. Fazla kullanılırsa baskı gibi durabilir; bu yüzden yalnızca somut bir rica sonrasında konur.","tr":"Şimdiden teşekkürler","s":"Im Voraus vielen Dank für Ihre Mühe.","st":"Zahmetiniz için şimdiden çok teşekkürler.","f":"im Voraus (önceden) · vorab (peşinen) · die Mühe (zahmet)"},{"w":"zu Händen (z. Hd.)","t":"Kalıp","k":"zu + Hände (eller)","c":"—","br":"„…nın eline“: kurum adresine yazarken kişiyi işaretler. Zarfın üstünde kurum yazar, altında z. Hd. Frau/Herr … gelir.","tr":"…nın dikkatine, elden","s":"Stadtverwaltung Alsdorf, z. Hd. Herrn Claßen.","st":"Alsdorf Belediyesi, Sayın Claßen’in dikkatine.","f":"die Hand (el) · der Empfänger (alıcı) · der Absender (gönderen)"}]},{"n":"Zamir mantığı: da(r)- ve wo(r)-","e":"edat + zamir birleşmeleri: darauf, womit, dabei…","c":"#116d8c","g":"Zamir & zarf mantığı","cards":[{"w":"darauf","t":"Pronominaladverb","k":"da (o şey) + r + auf","c":"—","br":"Kural: nesne bir eşya ya da bir olguysa „auf es“ denmez, da + edat birleştirilir. Edat sesli harfle başlıyorsa araya bağlayıcı r girer: da-r-auf.","tr":"onun üzerine, ona (o şeye)","s":"Ich habe Sie mehrfach darauf hingewiesen.","st":"Sizi buna defalarca dikkat çekmiştim.","f":"hinweisen auf (…e dikkat çekmek) · warten auf → darauf warten (onu beklemek) · achten auf (dikkat etmek)"},{"w":"damit","t":"Pronominaladverb / Konjunktion","k":"da + mit","c":"—","br":"Sessizle başlayan edatta r gerekmez. İki işlev: (1) „onunla“, (2) amaç bağlacı „ki“ — cümle sonunda fiil.","tr":"onunla; (bağlaç) …sın diye","s":"Damit bin ich nicht einverstanden.","st":"Bununla hemfikir değilim.","f":"einverstanden sein mit (…ile hemfikir olmak) · rechnen mit → damit rechnen (bunu beklemek)"},{"w":"dabei","t":"Pronominaladverb","k":"da + bei","c":"—","br":"„O sırada, bu işte“. Metinde bir eylemi eşzamanlı ikinci bir bilgiyle bağlar.","tr":"bu sırada, bu bağlamda; yanında","s":"Ich koche gern und höre dabei Musik.","st":"Yemek yapmayı severim ve bu sırada müzik dinlerim.","f":"beitragen (katkıda bulunmak) · dabei sein (orada olmak, katılmak) · bei etwas bleiben (bir şeyde ısrar etmek)"},{"w":"dafür","t":"Pronominaladverb","k":"da + für","c":"—","br":"„Onun için, o lehte“. dagegen ile ikili karşıtlık kurar: dafür sein / dagegen sein.","tr":"onun için, o yönde; buna karşılık","s":"Dafür gibt es bislang keinen einzigen Beleg.","st":"Bunun için şimdiye dek tek bir kanıt yok.","f":"sich interessieren für → sich dafür interessieren (buna ilgi duymak) · dagegen (buna karşı)"},{"w":"davon","t":"Pronominaladverb","k":"da + von","c":"—","br":"„Ondan, o konudan“. ausgehen von → davon ausgehen (varsaymak) kalıbı yazı dilinde çok sık.","tr":"ondan, bundan; o konuda","s":"Davon war in dem Schreiben mit keinem Wort die Rede.","st":"Yazıda bundan tek kelimeyle bahsedilmemişti.","f":"davon ausgehen (bunu varsaymak) · abhängen von → davon abhängen (buna bağlı olmak)"},{"w":"daran","t":"Pronominaladverb","k":"da + r + an","c":"—","br":"an sesliyle başlar → r girer. denken an → daran denken; liegen an → daran liegen (ondan kaynaklanmak).","tr":"ona, onda, o konuda","s":"Daran hat offenbar niemand gedacht.","st":"Bunu belli ki kimse düşünmemiş.","f":"denken an (…i düşünmek) · sich erinnern an (…i hatırlamak) · es liegt daran, dass… (bunun sebebi …olmasıdır)"},{"w":"darüber","t":"Pronominaladverb","k":"da + r + über","c":"—","br":"„Onun hakkında / üstünde“. sprechen über, sich beschweren über gibi über alan fiillerin zamiri.","tr":"onun hakkında, bunun üzerine","s":"Darüber müssen wir noch einmal in Ruhe sprechen.","st":"Bunun hakkında sakin kafayla bir daha konuşmalıyız.","f":"sich beschweren über (…den şikâyet etmek) · nachdenken über (…üzerine düşünmek) · sich freuen über (olan bir şeye sevinmek)"},{"w":"dazu","t":"Pronominaladverb","k":"da + zu","c":"—","br":"„Ona, bu amaçla, buna ek olarak“. Metinde ek bilgi bağlamak için de kullanılır.","tr":"buna, bu konuda; ayrıca","s":"Dazu möchte ich Folgendes anmerken.","st":"Bu konuda şunu belirtmek isterim.","f":"beitragen zu (…e katkı sunmak) · führen zu → dazu führen, dass… (…ile sonuçlanmak)"},{"w":"dadurch","t":"Pronominaladverb","k":"da + durch","c":"—","br":"„Bunun aracılığıyla“ = sebep-sonuç köprüsü. Kalıp: dadurch, dass… (…yaparak).","tr":"bu sayede, bunun sonucunda","s":"Dadurch, dass wir früher losgefahren sind, haben wir den Stau umfahren.","st":"Erken çıktığımız için trafiği atlattık.","f":"durch (aracılığıyla, içinden) · hindurch (boyunca, içinden) · dadurch, dass… (…yoluyla)"},{"w":"dagegen","t":"Pronominaladverb","k":"da + gegen","c":"—","br":"da (o şey) + gegen (karşı): „ona karşı“. İki işi vardır — karşıtlık bildirir (Ich bin dagegen) ve iki durumu karşılaştırır (buna karşılık). Kalıp: etwas dagegen haben. Karşıtı dafür; yakını hingegen.","tr":"ona karşı; buna karşılık","s":"Ich bin dagegen — lass uns eine andere Lösung suchen.","st":"Ben buna karşıyım, başka bir çözüm arayalım.","f":"dagegen sein (karşı olmak) · etwas dagegen haben (itirazı olmak)","m":[{"tr":"etwas dagegen haben: itirazı olmak","s":"Wenn Sie nichts dagegen haben, beginnen wir gleich.","st":"İtirazınız yoksa hemen başlıyoruz."}]},{"w":"worauf","t":"Frageadverb","k":"wo + r + auf","c":"—","br":"Soru tarafı aynı mantıkla kurulur: wo + edat. Kişi sorulursa edat + wen/wem kullanılır: auf wen wartest du?","tr":"neyin üzerine, neyi (bekliyorsun vb.)","s":"Worauf stützt sich diese Behauptung?","st":"Bu iddia neye dayanıyor?","f":"sich stützen auf (…e dayanmak) · worauf es ankommt (önemli olan)"},{"w":"worüber","t":"Frageadverb","k":"wo + r + über","c":"—","br":"wo + r + über: soru tarafındaki kalıp. über ile çalışan fiillerin sorusu böyle kurulur — sprechen über → worüber. Kural nettir: nesne eşya ya da konuysa wo(r)-, insansa edat + soru zamiri: über wen? Cevap tarafı da simetriktir: darüber.","tr":"ne hakkında","s":"Worüber genau haben Sie sich beschwert?","st":"Tam olarak ne hakkında şikâyette bulundunuz?","f":"sich beschweren über (…den şikâyet etmek) · worüber man spricht (konuşulan konu)"},{"w":"womit","t":"Frageadverb","k":"wo + mit","c":"—","br":"wo + mit: mit alan fiillerin sorusu. Sessizle başladığı için bağlayıcı r girmez — bu, wo(r)- ailesinin tek kuralıdır. Nesne insansa yapı değişir: mit wem? Cevabı damit’tir; aynı kelime ayrıca amaç bağlacıdır.","tr":"ne ile, neyle","s":"Womit begründen Sie diese Entscheidung?","st":"Bu kararı neyle gerekçelendiriyorsunuz?","f":"begründen mit (…ile gerekçelendirmek) · rechnen mit (…i hesaba katmak) · womit ich nicht gerechnet habe (hiç beklemediğim şey)"},{"w":"wofür","t":"Frageadverb","k":"wo + für","c":"—","br":"„Ne için“. Cevabı genelde dafür ile başlar; bu ikisi hep çift çalışır.","tr":"ne için","s":"Wofür genau werden diese 240 Euro berechnet?","st":"Bu 240 avro tam olarak ne için hesaplanıyor?","f":"dafür (bunun için) · wofür es sich lohnt (uğruna değer olan şey)"}]},{"n":"Soru kelimeleri","e":"wer/wen/wem, wohin/woher, wieso, inwiefern…","c":"#8a5f3f","g":"Zamir & zarf mantığı","cards":[{"w":"wer ↔ wen ↔ wem ↔ wessen","t":"Soru zamiri çekimi","k":"kişi sorusunun dört hâli","c":"wer – wen – wem – wessen","br":"Kişi sorusu artikel gibi çekilir: özne wer, belirtme wen, yönelme wem, tamlayan wessen. Cevabın hâli soruyu belirler: Wen hast du gefragt? → den Kollegen.","tr":"kim ↔ kimi ↔ kime ↔ kimin","s":"Wem hast du den Schlüssel gegeben — und wen hast du gefragt?","st":"Anahtarı kime verdin — ve kime sordun?","f":"der Kasus (hâl) · wessen (kimin) · das Fragewort (soru kelimesi)"},{"w":"wo ↔ wohin ↔ woher","t":"Yer sorusu üçlüsü","k":"wo (nerede) + hin (oraya) / her (buradan)","c":"—","br":"Almanca yeri üçe böler: duruş wo, gidiş wohin, geliş woher. Türkçede „nereye/nerede/nereden“ ile birebir örtüşür. Ayrılabilir de yazılır: Wo gehst du hin?","tr":"nerede ↔ nereye ↔ nereden","s":"Wo bist du, wohin gehst du und woher kommst du gerade?","st":"Neredesin, nereye gidiyorsun ve şu an nereden geliyorsun?","f":"hin (oraya) · her (buraya) · dorthin (oraya)"},{"w":"wann ↔ seit wann ↔ bis wann","t":"Zaman soruları","k":"wann + edat","c":"—","br":"Zaman sorusu edatla daralır: wann (ne zaman), seit wann (ne zamandan beri — hâlâ süren), bis wann (ne zamana kadar — sınır), wie lange (ne kadar süre), ab wann (ne zamandan itibaren).","tr":"ne zaman ↔ ne zamandan beri ↔ ne zamana kadar","s":"Bis wann muss der Antrag da sein — und seit wann läuft die Frist?","st":"Başvuru ne zamana kadar orada olmalı — ve süre ne zamandan beri işliyor?","f":"wie lange (ne kadar süre) · ab wann (ne zamandan itibaren) · die Frist (süre)"},{"w":"warum ↔ wieso ↔ weshalb","t":"Sebep soruları","k":"warum / wieso / weshalb / weswegen","c":"—","br":"Dördü de „neden“ demektir. Fark tondadır: warum nötr, wieso konuşma dilinde ve çoğu kez şaşkınlık taşır, weshalb ve weswegen yazı dilinde daha resmîdir. Anlam farkı yok, üslup farkı var.","tr":"neden, niçin","s":"Wieso hast du nichts gesagt? — Warum hätte ich das tun sollen?","st":"Neden hiçbir şey söylemedin? — Bunu niye yapaydım ki?","f":"weswegen (ne sebeple) · der Grund (sebep) · deshalb (bu yüzden)"},{"w":"wozu ↔ warum","t":"Amaç ↔ sebep","k":"wozu (ne amaçla) / warum (ne sebeple)","c":"—","br":"warum geriye bakar: sebebi sorar. wozu ileriye bakar: amacı sorar. Cevapları da farklıdır — warum → weil …, wozu → um … zu. Türkçede ikisi de „niye“ olduğu için ayrım kaybolur.","tr":"ne amaçla ↔ ne sebeple","s":"Wozu brauchst du das Formular? — Um den Antrag zu stellen.","st":"Formu ne için lazım? — Başvuruyu yapmak için.","f":"um … zu (…mek için) · der Zweck (amaç) · weil (çünkü)"},{"w":"wie viel ↔ wie viele","t":"Miktar soruları","k":"viel (sayılamayan) / viele (sayılabilir)","c":"—","br":"Sayılamayanda tekil: Wie viel Zeit? Wie viel Geld? Sayılabilirde çoğul: Wie viele Leute? Wie viele Tage? Yeni imlada ayrı yazılır. Yakınları: wie oft, wie lange, wie weit.","tr":"ne kadar ↔ kaç tane","s":"Wie viel Zeit haben wir und wie viele Aufgaben sind es?","st":"Ne kadar vaktimiz var ve kaç görev var?","f":"wie oft (kaç kez) · wie lange (ne kadar süre) · die Menge (miktar)"},{"w":"welcher / welche / welches","t":"Seçim sorusu","k":"welch- + artikel eki","c":"welcher – welchen – welchem","br":"Bilinen bir kümeden seçim ister ve artikel gibi çekilir: Welchen Bus nimmst du? was für ein ise niteliği sorar. Ayrıca ilgi zamiri olarak da kullanılır ama yazı dilinde der/die/das tercih edilir.","tr":"hangi(si)","s":"Welchen Termin nehmen wir — den am Dienstag oder den am Freitag?","st":"Hangi randevuyu alıyoruz — salı olanı mı cuma olanı mı?","f":"was für ein (nasıl bir) · die Auswahl (seçenek) · das Relativpronomen (ilgi zamiri)"},{"w":"inwiefern / inwieweit","t":"Sınırlama sorusu","k":"in + wie + fern/weit (ne kadar uzağa)","c":"—","br":"„Ne bakımdan, ne ölçüde“ — evet/hayırla cevaplanmaz, sınır ister. Sınav sorularının ve tartışma metinlerinin klasik açılışıdır: Inwiefern trifft diese Aussage zu?","tr":"ne bakımdan, ne ölçüde","s":"Inwiefern hat sich die Lage seitdem verändert?","st":"Durum o zamandan beri ne ölçüde değişti?","f":"insofern (bu bakımdan) · zutreffen (geçerli olmak) · der Aspekt (yön)"},{"w":"was ↔ was für ein","t":"Soru çifti","k":"was (ne) / was für ein (nasıl bir)","c":"—","br":"was nesneyi sorar, was für ein niteliği. für burada „için“ değildir ve hâli etkilemez: Was für einen Wagen fahren Sie? — einen, für yüzünden değil, fahren yüzünden Akkusativ.","tr":"ne ↔ nasıl bir","s":"Was ist passiert — und was für ein Formular brauchen Sie?","st":"Ne oldu — ve nasıl bir form lazım?","f":"welcher (hangisi) · wie (nasıl) · die Art (tür)"},{"w":"wie ↔ wie so etwas","t":"Tarz sorusu","k":"wie (nasıl)","c":"—","br":"Tarzı sorar ve bileşiklerle daralır: wie oft, wie lange, wie weit, wie alt, wie groß. Ayrıca ölçü sorularının tamamı bu kelimeyle kurulur — Türkçede „kaç yaşında, ne kadar uzak“ dediğimiz yer.","tr":"nasıl; ne kadar (ölçüde)","s":"Wie weit ist es bis zum Bahnhof und wie lange dauert es zu Fuß?","st":"Gara ne kadar uzak ve yürüyerek ne kadar sürüyor?","f":"wie viel (ne kadar) · wie oft (kaç kez) · das Maß (ölçü)"},{"w":"wofür ↔ für wen","t":"Edatlı soru çifti","k":"wo(r)- eşya için · edat + zamir insan için","c":"—","br":"Kural nettir: nesne eşya ya da olguysa wo(r)- birleşimi (wofür, worauf, womit), insansa edat + soru zamiri (für wen, auf wen, mit wem). Aynı ayrım cevap tarafında da geçerlidir: dafür ↔ für ihn.","tr":"ne için ↔ kim için","s":"Wofür ist das Geld — und für wen hast du es abgehoben?","st":"Bu para ne için — ve kim için çektin?","f":"worauf (neyin üzerine) · mit wem (kiminle) · dafür (bunun için)"},{"w":"woran ↔ an wen","t":"Edatlı soru çifti","k":"wo + r + an / an + wen","c":"—","br":"an ile çalışan fiillerin sorusu: denken an → Woran denkst du? (bir şey) ↔ An wen denkst du? (biri). Bağlayıcı r, edat sesliyle başladığı için girer.","tr":"neyi ↔ kimi (düşünüyorsun)","s":"Woran liegt das — und an wen sollen wir uns wenden?","st":"Bu neden kaynaklanıyor — ve kime başvurmalıyız?","f":"liegen an (…dan kaynaklanmak) · sich wenden an (başvurmak) · denken an (düşünmek)"},{"w":"Soru cümlesinde dizim","t":"Yapı kuralı","k":"soru kelimesi 1., fiil 2. sırada","c":"—","br":"W-sorusunda soru kelimesi başta, çekimli fiil hemen arkasındadır. Evet/hayır sorusunda ise fiil doğrudan başa geçer. Yan cümlede ise soru kelimesi bağlaç olur ve fiil sona gider: Ich weiß nicht, wo er ist.","tr":"soru dizimi","s":"Wann kommst du? — Kommst du überhaupt? — Ich weiß nicht, wann du kommst.","st":"Ne zaman geliyorsun? — Geliyor musun ki? — Ne zaman geldiğini bilmiyorum.","f":"die W-Frage (soru kelimeli soru) · ob (…ıp ımadığı) · der Nebensatz (yan cümle)"},{"w":"höfliche Frage: Könnten Sie …?","t":"Nezaket sorusu","k":"Konjunktiv II + soru dizimi","c":"—","br":"Doğrudan soru emir gibi durabilir; Konjunktiv onu bir adım uzaklaştırır: Können Sie …? nötrdür, Könnten Sie …? nazik, Dürfte ich Sie bitten …? en resmîsidir. Kademeyi duruma göre seçersin.","tr":"…ebilir misiniz? (nazik)","s":"Könnten Sie mir kurz erklären, wie das Formular auszufüllen ist?","st":"Formun nasıl doldurulacağını bana kısaca açıklayabilir misiniz?","f":"dürfen (izin) · bitten um (rica etmek) · höflich (nazik)"}]},{"n":"Zarflar: sıklık ve zaman","e":"immer, meistens, selten, gerade, noch, erst…","c":"#4e7f52","g":"Zamir & zarf mantığı","cards":[{"w":"immer ↔ nie","t":"Sıklık zarfı","k":"immer (daima) / nie (asla)","c":"—","br":"Sıklık ekseninin iki ucu. Arada: meistens, oft, manchmal, selten. Almanca bu zarfları genelde fiilden hemen sonra koyar: Ich gehe immer früh schlafen.","tr":"daima ↔ asla","s":"Ich stehe immer um sechs auf, aber sonntags nie.","st":"Her zaman altıda kalkarım ama pazarları asla.","f":"immer noch (hâlâ) · niemals (asla) · stets (daima, resmî)"},{"w":"meistens ↔ selten","t":"Sıklık zarfı","k":"meist (çoğu) + -ens / selten (nadir)","c":"—","br":"Sıklık sıralaması: immer > meistens > oft > manchmal > selten > nie. Yüzde vermeden alışkanlık anlatmanın yolu bu skala.","tr":"çoğunlukla ↔ nadiren","s":"Meistens koche ich selbst, selten bestellen wir etwas.","st":"Çoğunlukla kendim pişiririm, nadiren bir şey söyleriz.","f":"häufig (sık) · gelegentlich (ara sıra) · kaum (neredeyse hiç)"},{"w":"manchmal ↔ ab und zu","t":"Sıklık zarfı","k":"manch (bazı) + mal / ab und zu (bir gelip bir giderek)","c":"—","br":"İkisi de „ara sıra“ demektir; ab und zu biraz daha seyrek ve daha konuşma dilidir. Yakınları: hin und wieder, gelegentlich.","tr":"bazen ↔ ara sıra","s":"Ab und zu gehen wir noch spazieren.","st":"Ara sıra hâlâ yürüyüşe çıkıyoruz.","f":"hin und wieder (arada bir) · gelegentlich (ara sıra) · öfter (daha sık)"},{"w":"ständig ↔ dauernd","t":"Sıklık zarfı","k":"stehen kökü / dauern (sürmek)","c":"—","br":"İkisi de „sürekli“ demektir ve genelde şikâyet tonu taşır: Er ruft dauernd an. Yansız hâli: laufend, immer wieder.","tr":"durmadan, sürekli (çoğu kez şikâyetle)","s":"Das Handy klingelt ständig.","st":"Telefon durmadan çalıyor.","f":"laufend (süregelen) · immer wieder (tekrar tekrar) · andauernd (aralıksız)"},{"w":"gerade","t":"Zaman zarfı","k":"gerade (düz; tam şu an)","c":"—","br":"Şu anda olan işi işaretler: Ich koche gerade. Geçmişte kullanılırsa „az önce“ olur: Er ist gerade gegangen. Sıfat anlamı ayrıdır: düz.","tr":"tam şu anda; az önce","s":"Ich bin gerade unterwegs, ich rufe später an.","st":"Şu an yoldayım, sonra ararım.","f":"soeben (az önce) · momentan (şu an) · aktuell (güncel olarak)"},{"w":"noch ↔ nicht mehr","t":"Zaman çifti","k":"noch (hâlâ) / nicht mehr (artık değil)","c":"—","br":"Devam eden durum noch, sona ermiş durum nicht mehr ile anlatılır. Aynı eksende: schon (çoktan) ↔ noch nicht (henüz değil). Dört kelime, dört ayrı an.","tr":"hâlâ ↔ artık değil","s":"Wohnt ihr noch in Aachen? — Nein, nicht mehr.","st":"Hâlâ Aachen’de mi oturuyorsunuz? — Hayır, artık değil.","f":"schon (çoktan) · noch nicht (henüz değil) · immer noch (hâlâ)"},{"w":"erst ↔ schon","t":"Zaman çifti","k":"erst (ancak, henüz) / schon (çoktan)","c":"—","br":"Aynı rakam, iki bakış: Es ist erst acht = daha sekiz (erken sayıyorum); Es ist schon acht = saat sekiz olmuş (geç sayıyorum). Konuşanın değerlendirmesini taşırlar.","tr":"ancak, daha ↔ çoktan","s":"Es ist erst halb sieben — und du bist schon fertig?","st":"Daha altı buçuk — sen çoktan hazır mısın?","f":"schon (çoktan) · bereits (hâlihazırda) · gerade erst (daha yeni)"},{"w":"bereits","t":"Zaman zarfı","k":"bereit (hazır) + -s","c":"—","br":"schon’un yazı dilindeki karşılığı: „hâlihazırda“. Resmî yazışmada schon yerine bu kullanılır.","tr":"çoktan, hâlihazırda","s":"Die Unterlagen sind bereits unterwegs.","st":"Belgeler çoktan yolda.","f":"schon (çoktan) · inzwischen (bu arada) · noch nicht (henüz değil)"},{"w":"sofort ↔ gleich","t":"Zaman çifti","k":"sofort (derhal) / gleich (birazdan)","c":"—","br":"sofort şimdi, hemen; gleich ise „birazdan, birkaç dakikaya“. Türkçede ikisi de „hemen“ olduğu için karışır; Almanca’da gleich bir bekleme payı içerir.","tr":"derhal ↔ birazdan","s":"Ich komme gleich — sofort geht leider nicht.","st":"Birazdan geliyorum — hemen olmuyor maalesef.","f":"umgehend (gecikmeden) · demnächst (yakında) · später (sonra)"},{"w":"allmählich ↔ plötzlich","t":"Tarz zarfı","k":"allmählich (yavaş yavaş) / plötzlich (aniden)","c":"—","br":"Değişimin hızı: kademeli mi, bir anda mı. allmählich ayrıca sabırsızlık bildirir: Es reicht allmählich — artık yeter.","tr":"yavaş yavaş ↔ aniden","s":"Allmählich wird es kalt — und plötzlich ist Winter.","st":"Yavaş yavaş soğuyor — sonra bir anda kış oluyor.","f":"nach und nach (giderek) · auf einmal (birdenbire) · zunehmend (giderek artan)"},{"w":"wieder ↔ noch einmal","t":"Tekrar","k":"wieder (tekrar) / noch einmal (bir kez daha)","c":"—","br":"wieder aynı şeyin yinelenmesidir, noch einmal ise ek bir kez daha. İkisi bir arada da gelir: schon wieder (yine mi!) — sitem tonu taşır.","tr":"tekrar ↔ bir kez daha","s":"Kannst du das bitte noch einmal erklären? — Schon wieder?","st":"Bunu bir kez daha açıklayabilir misin? — Yine mi?","f":"erneut (yeniden) · nochmals (tekrar) · wiederholen (tekrarlamak)"},{"w":"vorhin ↔ nachher","t":"Gün içi zaman","k":"vorhin (az önce) / nachher (birazdan sonra)","c":"—","br":"Aynı gün içindeki yakın geçmiş ve yakın gelecek. Daha uzak olanlar: früher (eskiden) ↔ später (ileride).","tr":"az önce ↔ birazdan, sonra","s":"Vorhin war noch Kaffee da — nachher koche ich neuen.","st":"Az önce kahve vardı — birazdan yenisini yaparım.","f":"eben (demin) · gleich (birazdan) · später (sonra)"},{"w":"morgens / mittags / abends","t":"Zaman zarfı","k":"isim + -s = alışkanlık zarfı","c":"—","br":"Sonundaki -s düzenli tekrarı gösterir: morgens = her sabah. Tek seferlik zaman ise edatla kurulur: am Morgen. Aynı kalıp: montags, sonntags, nachts.","tr":"sabahları / öğlenleri / akşamları","s":"Montags arbeite ich länger, abends bin ich kaputt.","st":"Pazartesileri daha uzun çalışıyorum, akşamları bitiyorum.","f":"nachts (geceleri) · werktags (iş günleri) · am Morgen (o sabah)"},{"w":"heutzutage","t":"Zaman zarfı","k":"heute + zu + Tage","c":"—","br":"„Bugünlerde, günümüzde“: geçmişle karşılaştırma açar. Yazı ve tartışma dilinin klasiği: Heutzutage macht das kaum noch jemand.","tr":"günümüzde, bugünlerde","s":"Heutzutage erledigt man das meiste online.","st":"Günümüzde çoğu şey internetten hallediliyor.","f":"früher (eskiden) · damals (o zamanlar) · gegenwärtig (şu anda)"}]},{"n":"Zarflar: tarz ve tutum","e":"gern, leider, unbedingt, versehentlich…","c":"#6f5a8c","g":"Zamir & zarf mantığı","cards":[{"w":"gern ↔ ungern","t":"Tutum zarfı","k":"gern (severek) / un + gern","c":"lieber – am liebsten","br":"Almanca „sevmek“i çoğu zaman fiil değil zarfla kurar: Ich koche gern = yemek yapmayı severim. Dereceleri: gern → lieber → am liebsten.","tr":"severek ↔ istemeyerek","s":"Ich fahre gern Fahrrad, aber ungern im Regen.","st":"Bisiklete binmeyi severim ama yağmurda pek sevmem.","f":"lieber (tercihen) · am liebsten (en çok) · mögen (sevmek)"},{"w":"leider ↔ zum Glück","t":"Değerlendirme zarfı","k":"leider (maalesef) / Glück (şans)","c":"—","br":"Konuşanın olaya verdiği değeri işaretler. Resmî yazıda leider kötü haberin standart girişidir: Leider müssen wir Ihnen mitteilen …","tr":"maalesef ↔ neyse ki","s":"Leider ist der Kurs voll — zum Glück gibt es einen zweiten Termin.","st":"Maalesef kurs dolu — neyse ki ikinci bir tarih var.","f":"glücklicherweise (bereket versin) · bedauerlicherweise (üzücü biçimde) · das Glück (şans)"},{"w":"hoffentlich","t":"Değerlendirme zarfı","k":"hoffen (ummak) + -entlich","c":"—","br":"Cümleye umut katar ve yüklem gerektirmez: Hoffentlich klappt es. Türkçedeki „inşallah“ ile birebir aynı işlevde.","tr":"umarım, inşallah","s":"Hoffentlich hält das Wetter bis morgen.","st":"Umarım hava yarına kadar dayanır.","f":"die Hoffnung (umut) · hoffen auf (ummak) · wahrscheinlich (muhtemelen)"},{"w":"unbedingt","t":"Vurgu zarfı","k":"un + bedingt (koşullu)","c":"—","br":"„Koşulsuz“: mutlaka. Olumsuzda anlam değişir — nicht unbedingt „ille de değil, şart değil“ demektir.","tr":"mutlaka; (olumsuzda) ille de değil","s":"Das musst du unbedingt probieren!","st":"Bunu mutlaka denemelisin!","f":"die Bedingung (koşul) · bedingt (kısmen) · auf jeden Fall (her hâlükârda)"},{"w":"absichtlich ↔ versehentlich","t":"Niyet çifti","k":"Absicht (niyet) / Versehen (dalgınlık)","c":"—","br":"Kasıt mı kaza mı: hukukta Vorsatz ↔ Fahrlässigkeit ayrımının günlük karşılığı. Yakın biçim: aus Versehen.","tr":"kasten ↔ yanlışlıkla","s":"Das war versehentlich, nicht absichtlich.","st":"Bu yanlışlıkla oldu, kasten değil.","f":"aus Versehen (yanlışlıkla) · der Vorsatz (kasıt) · das Missgeschick (aksilik)"},{"w":"zufällig","t":"Tarz zarfı","k":"Zufall (tesadüf) + -ig","c":"—","br":"Payına düşen = tesadüf. Soruda kibar bir yumuşatıcıya döner: Hast du zufällig einen Stift? — nazikçe „acaba“ demenin yolu.","tr":"tesadüfen; acaba","s":"Hast du zufällig seine Nummer?","st":"Acaba onun numarası sende var mı?","f":"der Zufall (tesadüf) · rein zufällig (tamamen tesadüfen) · absichtlich (kasten)"},{"w":"natürlich ↔ selbstverständlich","t":"Onay zarfı","k":"Natur (doğa) / selbst + verstehen","c":"—","br":"İkisi de „tabii ki“ demektir; selbstverständlich daha resmî ve daha güçlüdür: „kendiliğinden anlaşılır“. Nezaket cevabı olarak sıkça: Selbstverständlich!","tr":"tabii ki ↔ elbette, doğal olarak","s":"Selbstverständlich schicke ich Ihnen die Unterlagen zu.","st":"Elbette belgeleri size gönderirim.","f":"klar (tabii) · die Selbstverständlichkeit (doğal olan şey) · natürlich (doğal olarak)"},{"w":"wahrscheinlich ↔ sicherlich","t":"Kesinlik zarfı","k":"wahr + scheinen / sicher","c":"—","br":"Kesinlik skalası: vielleicht < wahrscheinlich < sicherlich < bestimmt < auf jeden Fall. Cümlenin ne kadar iddialı olduğunu bu skala belirler.","tr":"muhtemelen ↔ herhâlde, kesinlikle","s":"Er kommt wahrscheinlich später, sicherlich aber vor acht.","st":"Muhtemelen geç gelir ama herhâlde sekizden önce.","f":"vielleicht (belki) · bestimmt (kesin) · auf keinen Fall (asla)"},{"w":"eigentlich ↔ tatsächlich","t":"Gerçeklik çifti","k":"eigen (öz) / Tat (fiil, edim)","c":"—","br":"eigentlich beklenen ile gerçek arasındaki farkı işaretler („aslında“), tatsächlich ise gerçekten olduğunu doğrular („gerçekten de“). Biri şüphe, öbürü teyit taşır.","tr":"aslında ↔ gerçekten de","s":"Eigentlich wollte ich absagen — tatsächlich bin ich dann doch hingegangen.","st":"Aslında iptal edecektim — sonunda gerçekten de gittim.","f":"die Tatsache (olgu) · in Wirklichkeit (gerçekte) · ursprünglich (başlangıçta)"},{"w":"ausdrücklich","t":"Vurgu zarfı","k":"aus + drücken + -lich","c":"—","br":"İçindekini açıkça dışa vurmuş olan: „açık açık, sarahaten“. Sözleşme ve yazışmada bir şeyin zımnen değil açıkça söylendiğini vurgular.","tr":"açıkça, sarahaten","s":"Ich habe ausdrücklich darum gebeten.","st":"Bunu açıkça rica etmiştim.","f":"der Ausdruck (ifade) · ausdrücken (ifade etmek) · stillschweigend (zımnen)"},{"w":"überhaupt nicht ↔ ziemlich","t":"Derece uçları","k":"überhaupt (esasen) / ziemlich (epey)","c":"—","br":"Yoğunluk ölçeği: überhaupt nicht (hiç) < kaum < ein bisschen < ziemlich < sehr < äußerst. Günlük konuşmada tonu bu ölçek taşır.","tr":"hiç ↔ epey","s":"Das gefällt mir überhaupt nicht — deins finde ich ziemlich gut.","st":"Bu bana hiç uymadı — seninkini epey iyi buldum.","f":"gar nicht (hiç) · ein bisschen (biraz) · sehr (çok)"},{"w":"einfach (zarf)","t":"Tonlama zarfı","k":"einfach (basitçe)","c":"—","br":"Sıfat olarak „kolay“, zarf olarak ise „öylece, sadece“ demektir: Ich habe es einfach vergessen. Cümleye teklifsizlik ve gerekçesizlik katar.","tr":"öylece, sadece; kolayca","s":"Ruf einfach an, wenn du Fragen hast.","st":"Sorun olursa öylece ara.","f":"einfach (kolay) · vereinfachen (basitleştirmek) · schlicht (sade)"},{"w":"vielleicht ↔ auf keinen Fall","t":"Kesinlik uçları","k":"viel + leicht / kein + Fall","c":"—","br":"İhtimalin iki ucu: belki ↔ asla. Ricayı yumuşatan biçim: Könntest du vielleicht …? Reddin en kesin biçimi: auf keinen Fall.","tr":"belki ↔ hiçbir şekilde","s":"Vielleicht klappt es morgen — heute auf keinen Fall.","st":"Belki yarın olur — bugün kesinlikle olmaz.","f":"eventuell (belki) · keinesfalls (asla) · auf jeden Fall (mutlaka)"},{"w":"immerhin ↔ wenigstens","t":"Teselli çifti","k":"immer + hin / wenig + -stens","c":"—","br":"Kötü tablodan olumlu bir kalıntı çeker. wenigstens beklentinin altındaki asgariyi vurgular, immerhin ise „hiç yoktan iyidir“ tonundadır.","tr":"hiç değilse ↔ en azından","s":"Immerhin hat er sich entschuldigt — wenigstens das.","st":"Hiç değilse özür diledi — en azından o kadar.","f":"zumindest (en azından) · nur (sadece) · schließlich (ne de olsa)"}]},{"n":"Zarf mantığı: bağlayıcı zarflar","e":"cümleleri birbirine bağlayan C1 zarfları","c":"#a8433f","g":"Zamir & zarf mantığı","cards":[{"w":"dennoch","t":"Konjunktionaladverb","k":"denn + noch","c":"—","br":"„Buna rağmen yine de“. Zarf olduğu için ardından fiil gelir: Dennoch bleibt…","tr":"buna rağmen, yine de","s":"Es hat geregnet; dennoch sind wir spazieren gegangen.","st":"Yağmur yağdı; yine de yürüyüşe çıktık.","f":"trotzdem (buna rağmen) · gleichwohl (yine de) · obwohl (bağlaç, fiil sonda)"},{"w":"allerdings","t":"Adverb","k":"aller + Ding + -s","c":"—","br":"„Bütün şeyler göz önüne alınırsa“. İki işlevi var: onaylayıp sınırlama koymak (ne var ki) ve vurgulu evet.","tr":"ne var ki, ancak; elbette","s":"Das Essen war gut, allerdings viel zu teuer.","st":"Yemek güzeldi, ne var ki çok pahalıydı.","f":"jedoch (ancak, fakat) · freilich (tabii ki; gerçi) · indes (oysa, bu arada)","m":[{"tr":"vurgulu onay: elbette, hem de nasıl","s":"„Hast du das wirklich gesagt?“ – „Allerdings!“","st":"„Bunu gerçekten söyledin mi?“ – „Elbette!“"}]},{"w":"folglich","t":"Konjunktionaladverb","k":"folgen + -lich","c":"—","br":"„Bunun ardından gelen olarak“ = mantıksal sonuç. Yazı dilinde deshalb’ın resmî hâli.","tr":"dolayısıyla, bu nedenle","s":"Der Bus fiel aus; folglich kamen alle zu spät.","st":"Otobüs iptal oldu; dolayısıyla herkes geç kaldı.","f":"die Folge (sonuç; dizi) · infolgedessen (bunun sonucunda) · demzufolge (buna göre)"},{"w":"demnach","t":"Konjunktionaladverb","k":"dem + nach","c":"—","br":"„Buna göre“ — önceki bilgiye dayanan çıkarım. folglich mantıksal, demnach aktarımsaldır.","tr":"buna göre, anlaşılan","s":"Demnach wäre eine Nachzahlung gar nicht fällig.","st":"Buna göre bir ek ödeme hiç doğmuyor olurdu.","f":"nach (…e göre; sonra) · danach (ondan sonra) · dementsprechend (buna uygun olarak)"},{"w":"ohnehin","t":"Adverb","k":"ohne + hin","c":"—","br":"„Zaten, öyle ya da böyle“. Argümanda bir noktayı gereksiz kılmak için kullanılır.","tr":"zaten, nasılsa","s":"Diese Kosten sind ohnehin nicht umlagefähig.","st":"Bu masraflar zaten kiracıya yansıtılamaz.","f":"sowieso (zaten) · eh (günlük) · ohnedies (zaten)"},{"w":"hingegen","t":"Konjunktionaladverb","k":"hin + gegen","c":"—","br":"İki şeyi karşı karşıya koyar. dagegen ile yakın, ama hingegen yalnızca karşılaştırma yapar.","tr":"buna karşılık, oysa","s":"Die Grundsteuer ist umlagefähig, die Verwaltungskosten hingegen nicht.","st":"Emlak vergisi yansıtılabilir, yönetim giderleri ise değil.","f":"dagegen (buna karşı) · demgegenüber (buna karşılık) · wohingegen (oysa ki)"},{"w":"zudem","t":"Adverb","k":"zu + dem","c":"—","br":"zu + dem: „buna ek olarak“. Argüman dizerken ikinci ve sonraki noktaları ekler. Yakınları außerdem (nötr), überdies ve ferner (daha resmî), obendrein (günlük ve biraz sitemli). Aynı işi gören zarflar cümlenin tonunu değiştirir.","tr":"ayrıca, üstelik","s":"Die Wohnung ist klein; zudem ist sie ziemlich laut.","st":"Daire küçük; üstelik epey gürültülü.","f":"außerdem (ayrıca) · überdies (üstelik) · ferner (ayrıca)"},{"w":"ferner","t":"Adverb","k":"fern (uzak) + -er","c":"—","br":"Aslında „daha uzağa“ = listede bir sonraki madde. Resmî yazıların sıralama zarfı.","tr":"ayrıca, bunun yanı sıra","s":"Ferner weisen wir darauf hin, dass die Belegeinsicht kostenlos ist.","st":"Ayrıca belge incelemesinin ücretsiz olduğunu belirtiriz.","f":"des Weiteren (ayrıca) · weiterhin (bundan böyle de, ayrıca) · fern (uzak)"},{"w":"insofern","t":"Adverb","k":"in + so + fern","c":"—","br":"„Şu kadarıyla, bu açıdan“. Bir ifadenin geçerlilik alanını daraltır: insofern, als… (…olduğu ölçüde).","tr":"bu bakımdan, şu kadarıyla","s":"Insofern ist Ihre Kritik berechtigt.","st":"Bu bakımdan eleştiriniz haklı.","f":"insoweit (o ölçüde) · inwiefern (ne bakımdan)"},{"w":"vielmehr","t":"Adverb","k":"viel + mehr","c":"—","br":"Reddedilen ifadenin yerine doğrusunu koyar: „hayır, aksine şu“. nicht … , vielmehr … kalıbı.","tr":"aksine, bilakis","s":"Es handelt sich nicht um einen Fehler, vielmehr um eine bewusste Entscheidung.","st":"Bu bir hata değil, aksine bilinçli bir karar.","f":"sondern (aksine, bilakis) · stattdessen (onun yerine) · im Gegenteil (aksine)"},{"w":"immerhin","t":"Adverb","k":"immer + hin","c":"—","br":"immer daima, hin ise yön ve sınır bildirir: „her şeye rağmen bu kadarı var“. Kötü tablodan olumlu bir kalıntı çeker. wenigstens asgariyi vurgular, immerhin ise beklenenden azına razı olmayı. Yakını zumindest.","tr":"hiç değilse, en azından; ne de olsa","s":"Das Wetter war schlecht, immerhin hat es nicht geschneit.","st":"Hava kötüydü, hiç değilse kar yağmadı.","f":"wenigstens (en azından) · zumindest (hiç değilse) · schließlich (nihayet; ne de olsa)"},{"w":"andernfalls","t":"Adverb","k":"ander + -n + Fall + -s","c":"—","br":"„Başka türlü olursa“ = aksi hâlde. Resmî uyarı cümlelerinin standart kelimesi.","tr":"aksi hâlde, yoksa","s":"Bitte zahlen Sie bis zum 30.; andernfalls behalten wir uns rechtliche Schritte vor.","st":"Lütfen 30’una kadar ödeyin; aksi hâlde yasal yollara başvurma hakkımızı saklı tutarız.","f":"sonst (yoksa; başka türlü) · ansonsten (aksi hâlde) · widrigenfalls (aksi hâlde (resmî))"},{"w":"gegebenenfalls","t":"Adverb (kısaltma: ggf.)","k":"gegeben + -en + Fall + -s","c":"—","br":"„Verilen durum ortaya çıkarsa“ = duruma göre, gerekirse. Alman idari dilinin en sık kısaltmalarından.","tr":"gerekirse, duruma göre","s":"Die Unterlagen sind gegebenenfalls nachzureichen.","st":"Belgeler gerekirse sonradan sunulacaktır.","f":"eventuell (belki, olası) · unter Umständen (duruma göre, belki) · ggf. (gerekirse (kısaltma))"},{"w":"keineswegs","t":"Adverb","k":"kein + -es + Weg + -s","c":"—","br":"„Hiçbir yoldan“ = kesinlikle değil. Vurgulu ret için nicht yerine kullanılır.","tr":"kesinlikle değil, asla","s":"Damit ist die Angelegenheit keineswegs erledigt.","st":"Bu konu bununla kesinlikle kapanmış değil.","f":"keinesfalls (hiçbir surette) · durchaus nicht (kesinlikle değil) · mitnichten (asla)"},{"w":"bislang","t":"Adverb","k":"bis + lang","c":"—","br":"„Şu ana dek olan süre boyunca“ = şimdiye kadar. bisher ile eşanlamlı, yazı dilinde daha resmî.","tr":"şimdiye kadar","s":"Eine Antwort ist bislang nicht eingegangen.","st":"Şimdiye kadar bir cevap ulaşmadı.","f":"bisher (şimdiye kadar) · bis heute (bugüne dek) · seither (o zamandan beri)"}]},{"n":"Belirsiz ve işaret zamirleri","e":"man, jemand, irgend-, dieselbe, derjenige…","c":"#2f6f7f","g":"Zamir & zarf mantığı","cards":[{"w":"jemand ↔ niemand","t":"Belirsiz zamir","k":"je (herhangi) + Mann / nie (asla) + Mann","c":"jemand – jemanden – jemandem","br":"İkisi de „Mann“ kökünden gelir ama kişi belirtmez. Çekimleri düzenlidir ve konuşmada sık atılır: Ich habe jemand(en) gesehen.","tr":"biri ↔ kimse","s":"Hat jemand meine Brille gesehen? — Nein, niemand.","st":"Gözlüğümü gören oldu mu? — Hayır, kimse.","f":"man (belirsiz özne) · irgendjemand (herhangi biri) · keiner (hiçbiri)"},{"w":"irgend-","t":"Belirsiz ön ek","k":"irgend + wer/was/wo/wann/wie","c":"—","br":"Belirsizliği bir kat artırır: wer (kim) → irgendwer (herhangi biri). Aynı kalıptan irgendwas, irgendwo, irgendwann, irgendwie, irgendein. Tek ön ekle bütün soru kelimeleri belirsizleşir.","tr":"herhangi bir …","s":"Irgendwann müssen wir das Thema irgendwie klären.","st":"Bir noktada bu konuyu bir şekilde çözmemiz lazım.","f":"irgendwo (bir yerde) · irgendwie (bir şekilde) · irgendwann (bir ara)"},{"w":"einige ↔ mehrere ↔ manche","t":"Miktar zamirleri","k":"ein (bir) / mehr (daha çok) / manch (bazı)","c":"—","br":"Miktar sıralaması: einige birkaç, mehrere ondan biraz fazla, manche ise sayıdan çok „bir kısmı, kimi“ demektir — seçicilik bildirir.","tr":"birkaç / birden çok / bazı","s":"Einige kamen zu spät, mehrere fehlten ganz, manche entschuldigten sich nicht einmal.","st":"Birkaçı geç geldi, birçoğu hiç gelmedi, bazıları özür bile dilemedi.","f":"wenige (az sayıda) · viele (çok) · sämtliche (tümü)"},{"w":"sämtliche ↔ alle","t":"Kapsam zamirleri","k":"sammeln (toplamak) kökünden","c":"—","br":"İkisi de „hepsi“ demektir ama sämtliche daha resmî ve kapsayıcıdır: „istisnasız tümü“. Resmî yazıda alle yerine sık kullanılır.","tr":"tüm, istisnasız hepsi","s":"Sämtliche Unterlagen liegen inzwischen vor.","st":"Bütün belgeler bu arada elde bulunuyor.","f":"alle (hepsi) · gesamt (bütün) · jeder (her biri)"},{"w":"jeder ↔ jeweils","t":"Dağıtım","k":"je (her) + der / je + weils","c":"—","br":"jeder tek tek kişiyi ya da şeyi işaret eder (her biri), jeweils ise dağılımı: her defasında şu kadar. Rakamla birlikte gelirse mutlaka jeweils olur.","tr":"her biri / her defasında","s":"Jeder bekommt zwei Blätter, jeweils mit Aufgaben auf beiden Seiten.","st":"Herkes iki yaprak alıyor, her biri iki yüzü de soru dolu.","f":"jedermann (herkes) · pro (başına) · je (her biri)"},{"w":"derselbe ↔ der gleiche","t":"Karıştırılan çift","k":"selbe (tam aynısı) / gleich (aynı türden)","c":"—","br":"derselbe tek ve aynı nesnedir; der gleiche aynı türden başka bir nesnedir. Wir haben dasselbe Auto = ortak tek araba; das gleiche Auto = aynı model iki araba.","tr":"tam aynısı ↔ aynı türden","s":"Wir wohnen im selben Haus, aber wir haben nicht die gleichen Nachbarn.","st":"Aynı binada oturuyoruz ama komşularımız aynı değil.","f":"gleich (aynı) · selbst (kendisi) · identisch (özdeş)"},{"w":"derjenige, der …","t":"İşaret zamiri","k":"der + jenige + ilgi cümlesi","c":"derjenige – diejenige – dasjenige","br":"İlgi cümlesini bekleyen bir işaret zamiri: „şu kişi ki …“. Resmî dilde kim olduğunu daraltmak için kullanılır; günlükte yerine wer geçer.","tr":"…olan kişi, o kimse","s":"Derjenige, der zuletzt geht, macht bitte das Licht aus.","st":"En son çıkan lütfen ışığı kapatsın.","f":"wer (kim, …en kimse) · jener (o) · der Relativsatz (ilgi cümlesi)"},{"w":"einander","t":"Karşılıklılık zamiri","k":"ein + ander (birbiri)","c":"—","br":"„Birbirini“ demenin resmî yolu; sich ile de anlatılır ama sich belirsiz kalabilir. Edatla birleşir: miteinander, voneinander, füreinander, gegeneinander.","tr":"birbirini, birbirine","s":"Wir helfen einander, wo wir können.","st":"Elimizden geldiğince birbirimize yardım ediyoruz.","f":"miteinander (birlikte) · voneinander (birbirinden) · gegenseitig (karşılıklı)"},{"w":"was für ein ↔ welcher","t":"Soru zamirleri","k":"was für ein (nasıl bir) / welcher (hangisi)","c":"—","br":"was für ein niteliği sorar (nasıl bir araba?), welcher ise bilinen bir kümeden seçim ister (hangisi?). İkisini karıştırmak cevabı da değiştirir.","tr":"nasıl bir … / hangisi","s":"Was für ein Handy hast du? — Und welches soll ich nehmen?","st":"Nasıl bir telefonun var? — Peki ben hangisini alayım?","f":"welcher (hangi) · wie (nasıl) · die Auswahl (seçenek)"},{"w":"beide ↔ beides","t":"İkilik","k":"beide (iki kişi/şey) / beides (iki şey birden)","c":"—","br":"beide sayılabilir iki öğeyi ayrı ayrı gösterir; beides ikisini tek blok olarak alır ve tekil fiil ister: Beides ist möglich.","tr":"her ikisi / ikisi birden","s":"Beide Wege sind gut — beides funktioniert.","st":"Her iki yol da iyi — ikisi de işe yarar.","f":"beid- (iki) · alle beide (ikisi de) · entweder … oder (ya …ya)"},{"w":"etwas ↔ nichts","t":"Belirsiz zamir","k":"etwas (bir şey) / nichts (hiçbir şey)","c":"—","br":"Sıfatla birleşince sıfat büyük harfle ve nötr çekilir: etwas Neues, nichts Besonderes. Bu küçük kural yazıda çok sık gözden kaçar.","tr":"bir şey ↔ hiçbir şey","s":"Gibt es etwas Neues? — Nein, nichts Wichtiges.","st":"Yeni bir şey var mı? — Hayır, önemli bir şey yok.","f":"nichts Besonderes (özel bir şey değil) · irgendetwas (herhangi bir şey) · alles (her şey)"},{"w":"selbst ↔ sogar","t":"Karıştırılan çift","k":"selbst (kendisi; hatta) / sogar (hatta)","c":"—","br":"selbst iki iş görür: isimden SONRA gelirse „kendisi“ (Ich mache das selbst), isimden ÖNCE gelirse „hatta“ (Selbst der Chef kam). sogar yalnızca ikinci anlamı taşır.","tr":"kendisi; hatta / hatta","s":"Selbst der Chef hat mitgeholfen — ich habe den Rest selbst gemacht.","st":"Hatta patron bile yardım etti — gerisini ben kendim yaptım.","f":"sogar (hatta) · selber (kendisi, günlük) · persönlich (bizzat)"},{"w":"solch- / so ein","t":"İşaret","k":"solch (böyle) / so ein (böyle bir)","c":"—","br":"Aynı işi görürler: so ein günlük, solch ein yazınsaldır. Çoğulda solche kullanılır: solche Fälle. Vurgulu biçimi: ein solcher Fall.","tr":"böyle bir, bu tür","s":"So ein Fall ist mir noch nie begegnet; solche Fehler passieren selten.","st":"Böyle bir vakayla hiç karşılaşmamıştım; bu tür hatalar nadiren olur.","f":"solche (bu tür) · derartig (bu türden) · ähnlich (benzer)"},{"w":"man ↔ einem/einen","t":"Çekim kuralı","k":"man → Akkusativ einen, Dativ einem","c":"—","br":"man yalnızca özne olabilir; nesne konumunda einen/einem’e döner. Bu ayrım bilinmezse cümle yarıda kalır: Wenn man müde ist, hilft einem nur Schlaf.","tr":"belirsiz özne ve çekimi","s":"Wenn man krank ist, glaubt einem niemand die Ausrede.","st":"İnsan hastayken bahanesine kimse inanmıyor.","f":"man (belirsiz özne) · jemand (biri) · einem (Dativ hâli)"}]},{"n":"Modal partikeller","e":"doch, mal, wohl, eben — cümlenin tonunu kuran küçük kelimeler","c":"#a44a3f","g":"Zamir & zarf mantığı","cards":[{"w":"doch","t":"Modalpartikel","k":"doch (yine de) → tonlama parçacığı","c":"—","br":"Partikeller çeviriye gelmez, tonu taşır. doch konuşanın beklentisiyle gerçek arasındaki farkı işaretler: „hani öyle olması gerekirdi“. Ricada ise yumuşatır: Komm doch mit.","tr":"hani, ya; (rica) hadi","s":"Das haben wir doch letzte Woche schon besprochen.","st":"Bunu hani geçen hafta zaten konuşmuştuk.","f":"doch (yine de, ama) · ja (zaten) · schon (elbette)"},{"w":"mal","t":"Modalpartikel","k":"einmal (bir kere) kısalması","c":"—","br":"Talebi „bir kerelik, küçük bir şey“ boyutuna indirir: emir cümlesinin sertliğini alır. Almancada rica kipi yerine çoğu zaman bu tek hece kullanılır.","tr":"bir, hele bir (rica yumuşatıcı)","s":"Schauen Sie sich das mal in Ruhe an.","st":"Şuna hele bir sakince bakın.","f":"einmal (bir kez) · kurz (kısaca) · doch mal (hadi bir)"},{"w":"ja","t":"Modalpartikel","k":"ja (evet) → onay parçacığı","c":"—","br":"Cümle içinde „zaten biliyorsun“ demektir: ortak bilgiye gönderme yapar. Vurgulu söylenirse uyarıya döner: Mach das ja nicht! (sakın yapma).","tr":"zaten, bildiğin gibi; (vurgulu) sakın","s":"Der Termin ist ja bereits bestätigt.","st":"Randevu zaten teyit edilmiş durumda.","f":"bekanntlich (bilindiği gibi) · schließlich (ne de olsa) · ohnehin (zaten)"},{"w":"wohl","t":"Modalpartikel","k":"wohl (iyi) → tahmin parçacığı","c":"—","br":"„Sanırım, herhâlde“ — konuşanın emin olmadığını gösterir. Konjunktiv’li dürfte ile aynı işi görür ama günlük ve yazı dilinde de geçerlidir.","tr":"herhâlde, muhtemelen","s":"Er hat es wohl vergessen.","st":"Herhâlde unutmuş.","f":"vermutlich (muhtemelen) · dürfte (…olsa gerek) · offenbar (görünüşe göre)"},{"w":"eben","t":"Modalpartikel","k":"eben (düz, tam)","c":"—","br":"„İşte tam da bu yüzden, değiştirilemez“ — kaçınılmazlığı işaretler. Tek başına cevap olarak da kullanılır: Eben! = Aynen.","tr":"işte, zaten öyle","s":"So ist die Rechtslage eben.","st":"Hukuki durum işte böyle.","f":"halt (işte, öyle) · nun einmal (ne yapalım öyle) · eben erst (daha demin)"},{"w":"halt","t":"Modalpartikel","k":"halten kökünden, güney Almanca kullanım","c":"—","br":"eben ile aynı işi görür: durumu kabullenme. Güney Almanya ve Avusturya’da yaygın, kuzeyde eben tercih edilir.","tr":"işte, ne yapalım","s":"Dann müssen wir halt einen neuen Termin suchen.","st":"O zaman yeni bir randevu aramak zorundayız işte.","f":"eben (işte) · nun mal (öyle işte) · leider (maalesef)"},{"w":"schon","t":"Modalpartikel","k":"schon (çoktan) → güvence parçacığı","c":"—","br":"Zaman zarfı olarak „çoktan“; partikel olarak „merak etme, olur o“ — endişeyi hafifletir. İkinci kullanım: kısmi onay (schon, aber …).","tr":"merak etme, olur; gerçi","s":"Das wird schon klappen.","st":"Merak etme, olacak o iş.","f":"bestimmt (kesin) · sicher (elbette) · zwar … aber (gerçi …ama)"},{"w":"etwa","t":"Modalpartikel","k":"etwa (yaklaşık) → soru parçacığı","c":"—","br":"Soruda „yoksa … mı?“ tonunu verir ve olumsuz cevap bekler. Zarf olarak ise „yaklaşık“ demektir; ikisini bağlam ayırır.","tr":"yoksa …mı?; (zarf) yaklaşık","s":"Hast du das etwa schon wieder verloren?","st":"Yoksa bunu yine mi kaybettin?","f":"ungefähr (yaklaşık) · doch nicht (yoksa …değil) · vielleicht (belki)"},{"w":"denn","t":"Modalpartikel","k":"denn (çünkü) → soru yumuşatıcı","c":"—","br":"Soruyu meraklı ve nazik yapar: Was ist das? kuru, Was ist das denn? doğal. Bağlaç olarak ayrı bir kelimedir: çünkü.","tr":"(soruda) peki, ki","s":"Wo bleibst du denn so lange?","st":"Neredesin bu kadar zamandır?","f":"denn (çünkü) · eigentlich (aslında) · nun (peki)"},{"w":"bloß / nur","t":"Modalpartikel","k":"bloß (çıplak, sadece)","c":"—","br":"Soruda çaresizliği, emirde uyarıyı güçlendirir: Wo ist bloß der Beleg? (nerede şu belge!) — Mach das bloß nicht! (sakın yapma).","tr":"bir tek, sadece; (vurgulu) sakın","s":"Wo habe ich bloß die Quittung hingelegt?","st":"Nereye koydum şu makbuzu ya?","f":"nur (sadece) · bloß nicht (sakın yapma) · ja nicht (sakın)"},{"w":"ruhig","t":"Modalpartikel","k":"ruhig (sakin)","c":"—","br":"İzin verirken kaygıyı alır: „gönül rahatlığıyla yapabilirsin“. Sıfat anlamı (sakin) ile karıştırma; partikelde cümlenin ortasında durur.","tr":"gönül rahatlığıyla, çekinme","s":"Sie können mich ruhig direkt anrufen.","st":"Beni çekinmeden doğrudan arayabilirsiniz.","f":"gern (memnuniyetle) · ohne Weiteres (rahatlıkla) · ruhig (sakin)"},{"w":"eigentlich","t":"Modalpartikel","k":"eigen (kendine ait) + -lich","c":"—","br":"„Aslına bakılırsa“: ya konuyu yan yoldan açar (soruda), ya beklenen ile gerçek arasındaki farkı işaretler (haber cümlesinde).","tr":"aslında; (soruda) bu arada, peki","s":"Wie spät ist es eigentlich?","st":"Saat kaç oldu bu arada?","f":"eigen (kendine ait) · genau genommen (tam olarak bakılırsa) · ursprünglich (başlangıçta)"},{"w":"überhaupt","t":"Modalpartikel / Adverb","k":"über + Haupt (baş) → „bütününe bakılırsa“","c":"—","br":"Olumsuzu güçlendirir (überhaupt nicht: hiç) ya da sorunun temelini sorgular: Ist das überhaupt zulässig? = bu esasen caiz mi?","tr":"hiç; esasen, zaten","s":"Hast du überhaupt zugehört?","st":"Sen hiç dinledin mi ki?","f":"gar nicht (hiç) · grundsätzlich (esasen) · das Haupt (baş)"},{"w":"zwar … aber","t":"Kalıp","k":"zwar (gerçi, aslında) + aber (ama)","c":"—","br":"Önce karşı tarafa hak verir, sonra kendi noktasını koyar. Tartışmada en etkili nezaket kalıbı: itiraz etmeden önce onaylamak.","tr":"gerçi … ama","s":"Das Handy ist zwar günstig, aber der Akku hält nichts aus.","st":"Telefon ucuz, ama pili hiç dayanmıyor.","f":"einerseits … andererseits (bir yandan …öte yandan) · allerdings (ne var ki) · dennoch (yine de)"}]},{"n":"Yer ve yön zarfları","e":"hin/her, dorthin, unterwegs, überall…","c":"#5a7f4f","g":"Zamir & zarf mantığı","cards":[{"w":"hin ↔ her","t":"Yön mantığı","k":"hin: konuşandan uzağa · her: konuşana doğru","c":"—","br":"Almancanın yön ekseni konuşanın bulunduğu yerdir. Komm her! (bana gel) ↔ Geh hin! (oraya git). Bütün hin-/her- fiilleri bu tek eksene göre çalışır.","tr":"oraya doğru ↔ buraya doğru","s":"Komm mal her und schau hin!","st":"Bir gel buraya ve şuna bak!","f":"hinaus (dışarı, uzağa) · herein (içeri, buraya) · hinüber (karşıya)"},{"w":"dorthin ↔ dorther","t":"Yön zarfı","k":"dort (orada) + hin/her","c":"—","br":"Yer zarfına yön eklenir: dort duruştur, dorthin gidiştir, dorther gelenin yönüdür. Aynı kalıp: hierhin, hierher, wohin, woher.","tr":"oraya ↔ oradan","s":"Wir fahren morgen dorthin und kommen abends wieder zurück.","st":"Yarın oraya gidip akşam geri döneriz.","f":"wohin (nereye) · woher (nereden) · hierher (buraya)"},{"w":"drüben","t":"Yer zarfı","k":"drüben (über kökünden: karşı taraf)","c":"—","br":"„Öbür tarafta“: caddenin, odanın ya da sınırın karşısı. Almanya’da tarihsel bir kullanımı da vardı: drüben = duvarın öte yakası.","tr":"karşıda, öbür tarafta","s":"Die Apotheke ist gleich da drüben.","st":"Eczane hemen şurada, karşıda.","f":"gegenüber (karşısında) · nebenan (yan tarafta) · hinüber (karşıya)"},{"w":"nebenan ↔ gegenüber","t":"Yer zarfı","k":"neben (yanında) + an / gegen + über","c":"—","br":"nebenan bitişiktir, gegenüber karşıdadır. Komşuluk tarif ederken ikisi ayrımı belirler: die Wohnung nebenan ↔ das Haus gegenüber.","tr":"yan tarafta ↔ karşısında","s":"Nebenan wird gebaut, und gegenüber ist eine Baustelle.","st":"Yan tarafta inşaat var, karşıda da bir şantiye.","f":"daneben (yanında) · davor (önünde) · dahinter (arkasında)"},{"w":"geradeaus","t":"Yön tarifi","k":"gerade (düz) + aus","c":"—","br":"gerade düz, aus ise „bu yönde devam“ demektir: düzlüğü bozmadan sür. Yol tarifinin çekirdek kelimesidir ve yanına daima yön fiilleri gelir: abbiegen (dönmek), vorbeigehen (yanından geçmek), überqueren (karşıya geçmek).","tr":"dosdoğru, düz ileri","s":"Gehen Sie geradeaus und an der Ampel rechts.","st":"Dosdoğru gidin ve ışıklarda sağa dönün.","f":"abbiegen (dönmek) · die Ampel (trafik lambası) · die Kreuzung (kavşak)"},{"w":"unterwegs","t":"Zarf","k":"unter + Weg (yol)","c":"—","br":"„Yolun üstünde“ = yolda, henüz varmadan. Hem kişi hem kargo için: Ich bin unterwegs / Das Paket ist unterwegs.","tr":"yolda, yol üstünde","s":"Ich bin schon unterwegs, in zehn Minuten bin ich da.","st":"Yoldayım, on dakikaya oradayım.","f":"der Weg (yol) · ankommen (varmak) · losfahren (yola çıkmak)"},{"w":"überall ↔ nirgendwo","t":"Yer zarfı","k":"über + all (her yerde) / nirgend + wo","c":"—","br":"Kapsam çifti: her yerde ↔ hiçbir yerde. Aynı kalıptan irgendwo (bir yerde) ve anderswo (başka yerde).","tr":"her yerde ↔ hiçbir yerde","s":"Ich habe überall gesucht, aber der Zettel ist nirgendwo.","st":"Her yere baktım ama kâğıt hiçbir yerde yok.","f":"irgendwo (bir yerde) · anderswo (başka yerde) · woanders (başka bir yerde)"},{"w":"hierzulande ↔ andernorts","t":"Yer karşılaştırması","k":"hier + zu Lande / ander + Ort + -s","c":"—","br":"Ülkeleri karşılaştırırken kullanılır: burada böyle, başka yerde şöyle. Yazı dilinde ülke adı tekrar etmemek için tercih edilir.","tr":"bu ülkede ↔ başka yerlerde","s":"Hierzulande zahlt man Miete kalt, andernorts ist alles inklusive.","st":"Bu ülkede kira yan giderler hariç ödenir, başka yerlerde her şey dahildir.","f":"das Land (ülke) · der Ort (yer) · anderswo (başka yerde)"},{"w":"vorne ↔ hinten","t":"Konum çifti","k":"vor (ön) / hinter (arka) + -en","c":"—","br":"Duruş bildirir; yön istenince hin/her eklenir: nach vorne, von hinten. Sınıfta, kuyrukta, araçta sürekli kullanılır.","tr":"önde ↔ arkada","s":"Setz dich bitte nach vorne, hinten hört man nichts.","st":"Lütfen öne otur, arkada hiçbir şey duyulmuyor.","f":"vorn (önde) · nach vorne (öne doğru) · von hinten (arkadan)"},{"w":"oben ↔ unten","t":"Konum çifti","k":"ober (üst) / unter (alt)","c":"—","br":"Kat tarifinde de metin içinde de aynı çift: yukarıda ↔ aşağıda. Resmî yazıda s. o. / s. u. kısaltmaları bu kelimelerden gelir.","tr":"yukarıda ↔ aşağıda","s":"Wir wohnen oben, die Vermieterin unten.","st":"Biz üstte oturuyoruz, ev sahibi altta.","f":"nach oben (yukarıya) · von unten (aşağıdan) · obig (yukarıdaki)"},{"w":"draußen ↔ drinnen","t":"Konum çifti","k":"aus (dışarı) / in (içeri) → dr- eklenmiş biçimler","c":"—","br":"Duruş: dışarıda ↔ içeride. Yön istenince farklı kelimeler girer: nach draußen, raus, rein. Konuşmada raus/rein çok sık.","tr":"dışarıda ↔ içeride","s":"Bei dem Wetter bleiben wir lieber drinnen.","st":"Bu havada içeride kalalım daha iyi.","f":"raus (dışarı) · rein (içeri) · im Freien (açık havada)"},{"w":"weg ↔ fort","t":"Uzaklaşma","k":"weg (uzağa) / fort (ileriye, uzağa)","c":"—","br":"İkisi de „gitmiş, burada değil“ demektir; weg günlük, fort daha yazınsaldır. Fiillerle birleşir: weggehen, wegwerfen, fortsetzen, fortfahren.","tr":"gitmiş, uzakta","s":"Meine Brille ist weg — such du mal, ich muss gleich weg.","st":"Gözlüğüm kayıp — sen bir bak, benim hemen çıkmam lazım.","f":"weggehen (gitmek) · wegwerfen (atmak) · fortsetzen (sürdürmek)"},{"w":"entlang ↔ vorbei","t":"Hareket yönü","k":"entlang (boyunca) / vorbei (yanından geçerek)","c":"—","br":"entlang bir hat boyunca gitmektir (den Fluss entlang), vorbei ise bir noktanın yanından geçip gitmektir (am Haus vorbei). Yol tarifinde ikisi peş peşe kullanılır.","tr":"boyunca ↔ yanından geçerek","s":"Gehen Sie den Fluss entlang und dann am Rathaus vorbei.","st":"Nehir boyunca gidin, sonra belediye binasının yanından geçin.","f":"vorbeikommen (uğramak) · entlanggehen (boyunca yürümek) · die Strecke (güzergâh)"},{"w":"rundherum / ringsum","t":"Çevre","k":"rund (yuvarlak) + herum / rings (halka) + um","c":"—","br":"„Çepeçevre“: bir şeyin bütün çevresini kapsar. Fiille de birleşir: herumlaufen (etrafta dolaşmak), herumreden (lafı dolandırmak).","tr":"çepeçevre, etrafında","s":"Rundherum war alles ruhig.","st":"Etrafta her yer sessizdi.","f":"herum (etrafında) · ringsum (çepeçevre) · die Umgebung (çevre)"}]},{"n":"Zaman zarfları: yazı dili","e":"mittlerweile, vorerst, umgehend, seinerzeit…","c":"#3d5a80","g":"Zamir & zarf mantığı","cards":[{"w":"mittlerweile","t":"Adverb","k":"mittler (ortadaki) + Weile (süre)","c":"—","br":"„Aradan geçen sürede“ = bu arada, artık. Bir durumun değiştiğini bildirir: eskiden başkaydı, şimdi böyle.","tr":"bu arada, artık","s":"Mittlerweile kocht er besser als ich.","st":"Artık benden daha iyi yemek yapıyor.","f":"die Weile (süre) · inzwischen (bu arada) · eine Weile (bir süre)"},{"w":"inzwischen","t":"Adverb","k":"in + zwischen (arasında)","c":"—","br":"İki an arasında geçen zaman. mittlerweile ile neredeyse eşanlamlı; inzwischen ayrıca „o sırada, bu esnada“ anlamını da taşır.","tr":"bu arada, o esnada","s":"Ich rufe beim Amt an; du kannst inzwischen die Unterlagen sortieren.","st":"Ben daireyi arayayım; sen bu arada belgeleri ayırabilirsin.","f":"zwischen (arasında) · zwischenzeitlich (ara dönemde) · mittlerweile (artık)"},{"w":"seither","t":"Adverb","k":"seit (…den beri) + her (buraya doğru)","c":"—","br":"Geçmişteki bir andan bugüne uzanan çizgi: „o zamandan bu yana“. seitdem ile eşanlamlı; seitdem ayrıca bağlaç olabilir, seither olamaz.","tr":"o zamandan beri","s":"Wir haben uns 2019 gesehen; seither nichts mehr gehört.","st":"2019’da görüştük; o zamandan beri ses seda yok.","f":"seitdem (o zamandan beri; …den beri) · seit (…den beri) · bislang (şimdiye kadar)"},{"w":"seinerzeit","t":"Adverb","k":"seiner (onun) + Zeit (zaman)","c":"—","br":"„Kendi zamanında“ = o zamanlar. damals ile aynı işi görür ama resmî ve yazınsaldır; geçmişteki bir dönemi mesafeyle anar.","tr":"o zamanlar, vaktiyle","s":"Die Regelung war seinerzeit unumstritten.","st":"Düzenleme o zamanlar tartışmasızdı.","f":"damals (o zaman) · einst (bir zamanlar) · die Zeit (zaman)"},{"w":"zwischenzeitlich","t":"Adverb","k":"Zwischenzeit (ara dönem) + -lich","c":"—","br":"İki tarih arasındaki dönemde olan. Resmî yazışmada gecikmeleri anlatmanın nötr yolu.","tr":"ara dönemde, bu süre zarfında","s":"Zwischenzeitlich hat sich die Rechtslage geändert.","st":"Bu süre zarfında hukuki durum değişti.","f":"die Zwischenzeit (ara dönem) · inzwischen (bu arada) · vorübergehend (geçici olarak)"},{"w":"vorerst","t":"Adverb","k":"vor (önce) + erst (ilkin)","c":"—","br":"„Şimdilik, ilk aşamada“ — kararın geçici olduğunu işaret eder. Resmî yazıda kapıyı açık bırakmanın kelimesi.","tr":"şimdilik","s":"Weitere Schritte werden vorerst nicht eingeleitet.","st":"Şimdilik başka adım atılmayacak.","f":"zunächst (öncelikle) · vorläufig (geçici olarak) · endgültig (nihai)"},{"w":"zunächst","t":"Adverb","k":"zu + nächst (en yakın)","c":"—","br":"„En yakın adım olarak“ = önce, ilkin. Sıralama kurar: zunächst … anschließend … abschließend.","tr":"önce, ilk olarak","s":"Zunächst trinken wir einen Kaffee, dann reden wir.","st":"Önce bir kahve içelim, sonra konuşuruz.","f":"anschließend (ardından) · abschließend (son olarak) · nächst (en yakın)"},{"w":"künftig","t":"Adjektiv / Adverb","k":"Kunft (kommen: geliş) + -ig","c":"—","br":"Zukunft ile aynı kök: gelecek olan. „Bundan böyle“ anlamında resmî duyuruların kelimesi.","tr":"bundan böyle, gelecekte","s":"Anträge sind künftig ausschließlich digital einzureichen.","st":"Başvurular bundan böyle yalnızca dijital sunulacak.","f":"die Zukunft (gelecek) · zukünftig (gelecekteki) · fortan (bundan sonra)"},{"w":"fortan","t":"Adverb","k":"fort (ileri, uzağa) + an (itibaren)","c":"—","br":"„Şu andan ileriye doğru“ = bundan sonra. künftig ile yakın, ama daha edebî ve kesin bir kopuş bildirir.","tr":"bundan sonra, o andan itibaren","s":"Fortan galt eine strengere Hausordnung.","st":"O andan itibaren daha sıkı bir bina yönetmeliği geçerli oldu.","f":"fort (ileri) · fortsetzen (sürdürmek) · von nun an (şu andan itibaren)"},{"w":"nachträglich","t":"Adjektiv / Adverb","k":"nach + tragen (taşımak) + -lich","c":"—","br":"Nachtrag = sonradan eklenen. Olay bittikten sonra yapılan: sonradan, geriye dönük.","tr":"sonradan, geriye dönük","s":"Die Genehmigung kann nicht nachträglich erteilt werden.","st":"İzin sonradan verilemez.","f":"der Nachtrag (sonradan ek) · nachreichen (sonradan sunmak) · rückwirkend (geçmişe etkili)"},{"w":"umgehend","t":"Adjektiv / Adverb","k":"um + gehen + -end","c":"—","br":"Aslında „hemen dolaşıma girerek“ = gecikmeden. unverzüglich ile eşanlamlıdır; ikisi de resmî yazıda „derhal“ demenin yoludur.","tr":"derhal, gecikmeden","s":"Wir bitten um umgehende Rückmeldung.","st":"Derhal geri bildirim rica ederiz.","f":"unverzüglich (gecikmeksizin) · sofort (hemen) · umgehen (dolaşmak)"},{"w":"jederzeit","t":"Adverb","k":"jede (her) + Zeit (zaman)","c":"—","br":"„Her zamanda“ = istenildiği an. Hak bildiren cümlelerde sık: jederzeit widerrufbar — her an cayılabilir.","tr":"her zaman, istenildiği an","s":"Sie können die Einwilligung jederzeit widerrufen.","st":"Onayı her zaman geri alabilirsiniz.","f":"jedes Mal (her seferinde) · zu jeder Zeit (her vakit) · widerrufen (caymak)"},{"w":"zeitweise","t":"Adverb","k":"Zeit + -weise (tarzında)","c":"—","br":"-weise eki yine iş başında: zaman tarzında = zaman zaman, geçici olarak.","tr":"zaman zaman, geçici olarak","s":"Der Aufzug war zeitweise außer Betrieb.","st":"Asansör zaman zaman devre dışıydı.","f":"die Weise (tarz) · vorübergehend (geçici) · dauerhaft (kalıcı)"},{"w":"hierzulande","t":"Adverb","k":"hier (burada) + zu + Lande (ülkede)","c":"—","br":"Donmuş eski Dativ biçimi (zu Lande). „Bu ülkede, bizde“ — Almanya’yı kastederek karşılaştırma yaparken kullanılır.","tr":"bu ülkede, bizde","s":"Hierzulande ist ein solcher Nachweis zwingend erforderlich.","st":"Bu ülkede böyle bir belge zorunlu.","f":"das Land (ülke) · zu Lande (karada) · andernorts (başka yerde)"}]},{"n":"Sıfatlar: günlük zıt çiftler","e":"groß/klein, teuer/günstig, laut/leise…","c":"#a35a2f","g":"Sıfat aileleri","cards":[{"w":"groß ↔ klein","t":"Sıfat çifti","k":"groß (büyük) / klein (küçük)","c":"größer – am größten","br":"Boyut ekseninin temeli. Düzensiz üstünlük derecesi: groß → größer → am größten. İnsan boyu için de aynı: Wie groß bist du?","tr":"büyük ↔ küçük","s":"Die Wohnung ist schön, aber für vier Personen zu klein.","st":"Daire güzel ama dört kişi için fazla küçük.","f":"die Größe (boyut) · vergrößern (büyütmek) · verkleinern (küçültmek)"},{"w":"teuer ↔ günstig / billig","t":"Sıfat çifti","k":"teuer (pahalı) / günstig (uygun) / billig (ucuz)","c":"teurer – am teuersten","br":"günstig ile billig aynı değil: günstig „fiyatı uygun, iyi teklif“ demektir ve olumludur; billig ucuzluğun yanında kalitesizliği ima eder. İlanlarda daima günstig kullanılır.","tr":"pahalı ↔ uygun fiyatlı / ucuz (kalitesiz tonuyla)","s":"Das Angebot ist günstig — billig ist es aber nicht.","st":"Teklif uygun fiyatlı — ama ucuz değil.","f":"der Preis (fiyat) · preiswert (fiyatına değer) · sich lohnen (değmek)"},{"w":"voll ↔ leer","t":"Sıfat çifti","k":"voll (dolu) / leer (boş)","c":"—","br":"Doluluk ekseni. Fiil hâlleri de düzenli: füllen ↔ leeren. Mecazî: voller Ideen (fikir dolu), leere Versprechen (boş vaatler).","tr":"dolu ↔ boş","s":"Der Bus war so voll, dass ich stehen musste.","st":"Otobüs o kadar doluydu ki ayakta kaldım.","f":"füllen (doldurmak) · leeren (boşaltmak) · die Leere (boşluk)"},{"w":"hell ↔ dunkel","t":"Sıfat çifti","k":"hell (aydınlık) / dunkel (karanlık)","c":"—","br":"Işık ekseni; renk tonu için de kullanılır: hellblau, dunkelblau. Daire ilanlarında övgü kelimesi: eine helle Wohnung.","tr":"aydınlık ↔ karanlık","s":"Die Küche ist hell, das Schlafzimmer eher dunkel.","st":"Mutfak aydınlık, yatak odası daha karanlık.","f":"die Helligkeit (aydınlık) · dunkelblau (koyu mavi) · beleuchten (aydınlatmak)"},{"w":"laut ↔ leise","t":"Sıfat çifti","k":"laut (gürültülü) / leise (sessiz)","c":"—","br":"Ses ekseni. laut aynı zamanda edattır: laut Vertrag (sözleşmeye göre) — kökü „ses“ olduğu için „söylenene göre“ demektir.","tr":"gürültülü ↔ sessiz","s":"Könntest du bitte etwas leiser sprechen?","st":"Biraz daha alçak sesle konuşabilir misin?","f":"der Lärm (gürültü) · die Lautstärke (ses düzeyi) · die Ruhe (sessizlik)"},{"w":"sauber ↔ schmutzig","t":"Sıfat çifti","k":"sauber (temiz) / schmutzig (kirli)","c":"—","br":"Temizlik ekseni. Kira dilinde önemli bir kalıp: besenrein — „süpürülmüş hâlde“, dairenin teslim standardı.","tr":"temiz ↔ kirli","s":"Die Wohnung muss bei der Übergabe besenrein sein.","st":"Daire teslimde süpürülmüş hâlde olmalı.","f":"putzen (temizlemek) · der Schmutz (kir) · besenrein (süpürülmüş)"},{"w":"warm ↔ kalt / kühl","t":"Sıfat çifti","k":"warm (sıcak) / kalt (soğuk) / kühl (serin)","c":"wärmer – am wärmsten","br":"Sıcaklık ekseni; kira dilinde ayrı bir anlam kazanır: Warmmiete (yan giderler dahil) ↔ Kaltmiete (hariç). İlanları okurken bu tek kelime bütçeyi değiştirir.","tr":"sıcak ↔ soğuk / serin","s":"Die Kaltmiete beträgt 700 Euro, warm sind es 890.","st":"Çıplak kira 700 avro, giderler dahil 890.","f":"die Wärme (sıcaklık) · die Warmmiete (giderler dahil kira) · abkühlen (soğutmak)"},{"w":"hart ↔ weich","t":"Sıfat çifti","k":"hart (sert) / weich (yumuşak)","c":"härter – am härtesten","br":"Fiziksel sertlik, mecazî olarak da katılık: harte Bedingungen, weiche Faktoren. Suyun sertliği de aynı kelime: hartes Wasser — kireç oranı.","tr":"sert ↔ yumuşak","s":"Die Matratze ist mir zu hart.","st":"Yatak bana fazla sert.","f":"die Härte (sertlik) · hartnäckig (inatçı) · weich werden (yumuşamak)"},{"w":"breit ↔ schmal","t":"Sıfat çifti","k":"breit (geniş) / schmal (dar)","c":"—","br":"Genişlik ekseni. weit ile karıştırma: breit ölçüdür (iki metre genişliğinde), weit mesafedir ya da bolluktur (geniş bir pantolon, uzak bir yol).","tr":"geniş ↔ dar (ölçü olarak)","s":"Der Flur ist nur einen Meter breit.","st":"Koridor yalnızca bir metre genişliğinde.","f":"die Breite (genişlik) · weit (uzak; bol) · eng (dar, sıkışık)"},{"w":"dick ↔ dünn","t":"Sıfat çifti","k":"dick (kalın) / dünn (ince)","c":"—","br":"Kalınlık ekseni: hem nesne hem insan için. İnsan için kibar biçim: kräftig ya da schlank (ince, olumlu). dünn insan için genelde zayıflığa işaret eder.","tr":"kalın ↔ ince","s":"Zieh dir eine dickere Jacke an.","st":"Daha kalın bir ceket giy.","f":"die Dicke (kalınlık) · schlank (ince, fit) · verdünnen (inceltmek, sulandırmak)"},{"w":"süß ↔ sauer ↔ salzig ↔ bitter","t":"Tat sıfatları","k":"dört temel tat","c":"—","br":"Tat ekseni. Mecazî kullanımları da vardır: sauer sein (birine kızgın olmak), bittere Wahrheit (acı gerçek), süß (sevimli).","tr":"tatlı ↔ ekşi ↔ tuzlu ↔ acı (kahve gibi)","s":"Die Soße ist mir zu sauer.","st":"Sos bana fazla ekşi.","f":"scharf (acı, baharatlı) · herzhaft (tuzlu, doyurucu) · sauer sein (kızgın olmak)"},{"w":"lecker ↔ scheußlich","t":"Değerlendirme çifti","k":"lecker (lezzetli) / scheußlich (berbat)","c":"—","br":"Günlük değerlendirme dilinin uçları. Ara tonlar: ganz gut (fena değil), okay, nicht so meins (bana göre değil).","tr":"lezzetli ↔ berbat","s":"Das war richtig lecker — danke!","st":"Bu gerçekten çok lezzetliydi — teşekkürler!","f":"schmecken (tadı olmak) · der Geschmack (tat, zevk) · furchtbar (korkunç)"},{"w":"müde ↔ wach / fit","t":"Durum çifti","k":"müde (yorgun) / wach (uyanık) / fit (formda)","c":"—","br":"Günlük hâl bildirimi. Kalıplar: hundemüde (çok yorgun), wieder fit sein (toparlanmış olmak), noch wach sein (hâlâ uyanık olmak).","tr":"yorgun ↔ uyanık, formda","s":"Ich bin heute einfach zu müde für Sport.","st":"Bugün spor için fazla yorgunum.","f":"erschöpft (bitkin) · ausgeruht (dinlenmiş) · aufwachen (uyanmak)"},{"w":"wichtig ↔ egal","t":"Değer çifti","k":"wichtig (önemli) / egal (fark etmez)","c":"—","br":"Önem ekseni. Kalıplar: Das ist mir wichtig ↔ Das ist mir egal. Ayrıca egal ob/wie/was: …olsa da olmasa da.","tr":"önemli ↔ fark etmez","s":"Mir ist wichtig, dass wir pünktlich anfangen.","st":"Zamanında başlamamız benim için önemli.","f":"die Bedeutung (önem, anlam) · gleichgültig (kayıtsız) · egal wie (nasıl olursa olsun)"}]},{"n":"Sıfatlar: kişi ve davranış","e":"freundlich, geduldig, faul, großzügig…","c":"#8a6a3a","g":"Sıfat aileleri","cards":[{"w":"freundlich ↔ unfreundlich","t":"Sıfat çifti","k":"Freund (arkadaş) + -lich","c":"—","br":"„Arkadaşça“: Almancada nezaketin temel kelimesi. Yazışmanın kapanışı bile bu kelimeyle kurulur: Mit freundlichen Grüßen.","tr":"nazik, güler yüzlü ↔ ters","s":"Die Frau am Schalter war ausgesprochen freundlich.","st":"Gişedeki kadın son derece güler yüzlüydü.","f":"der Freund (arkadaş) · die Freundlichkeit (nezaket) · höflich (kibar)"},{"w":"höflich ↔ unverschämt","t":"Sıfat çifti","k":"Hof (saray) + -lich / un + Scham (utanç)","c":"—","br":"höflich „saraya yakışır“ demektir — kibarlık sarayın diliydi. Karşıtı utanç duygusunu yitirmiş olan: unverschämt (arsız).","tr":"kibar ↔ arsız, yüzsüz","s":"Er hat höflich, aber sehr bestimmt widersprochen.","st":"Kibarca ama çok kararlı biçimde itiraz etti.","f":"der Hof (avlu, saray) · die Höflichkeit (nezaket) · die Scham (utanç)"},{"w":"ehrlich ↔ unehrlich","t":"Sıfat çifti","k":"Ehre (onur) + -lich","c":"—","br":"Onurlu olan = dürüst. Kalıp: Ehrlich gesagt … (açıkçası). Aynı kökten die Ehre, ehren (saygı göstermek), geehrt (saygıdeğer).","tr":"dürüst ↔ dürüst olmayan","s":"Ehrlich gesagt habe ich das ganz vergessen.","st":"Açıkçası bunu tamamen unutmuşum.","f":"die Ehre (onur) · die Ehrlichkeit (dürüstlük) · aufrichtig (samimi)"},{"w":"geduldig ↔ ungeduldig","t":"Sıfat çifti","k":"Geduld (sabır) + -ig","c":"—","br":"Geduld, dulden (katlanmak) kökünden: katlanma gücü. Öğretmenlik dilinin en sık
