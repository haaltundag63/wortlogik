iehen","t":"Verb (çift)","k":"über + ziehen","c":"überzieht – überzog – hat überzogen / zieht über – zog über – hat übergezogen","br":"Ayrılmayan überZIEHen: sınırın üstüne çekmek = aşmak (süre, hesap). Ayrılan ÜBERziehen: üstüne giymek. Somut giyinme ayrılır, soyut aşma ayrılmaz.","tr":"aşmak (süre, hesap) (ayrılmaz)","s":"Ich habe die Redezeit leider deutlich überzogen.","st":"Konuşma süresini maalesef belirgin şekilde aştım.","f":"der Überziehungskredit (kredili mevduat) · überzogen (abartılı) · überschreiten (aşmak)","m":[{"tr":"üstüne giymek (ayrılan)","s":"Zieh dir eine Jacke über, es ist kalt.","st":"Bir ceket giy üstüne, hava soğuk."}]},{"w":"durchschauen ↔ durchschauen","t":"Verb (çift)","k":"durch + schauen","c":"durchschaut – durchschaute – hat durchschaut / schaut durch – schaute durch – hat durchgeschaut","br":"Ayrılmayan durchSCHAUen: içini görmek = niyeti çözmek. Ayrılan DURCHschauen: baştan sona gözden geçirmek. Yine aynı kural: soyut olan ayrılmaz.","tr":"(niyeti) çözmek (ayrılmaz)","s":"Diese Masche haben wir längst durchschaut.","st":"Bu oyunu çoktan çözdük.","f":"durchsichtig (şeffaf) · die Durchsicht (gözden geçirme) · durchgehen (tek tek incelemek)","m":[{"tr":"gözden geçirmek (ayrılan)","s":"Schau die Unterlagen bitte noch einmal durch.","st":"Belgeleri lütfen bir kez daha gözden geçir."}]}]},{"n":"Duygu ve tepki fiilleri","e":"bedauern, staunen, zögern, gönnen…","c":"#6f5f9c","g":"Kök aileleri","cards":[{"w":"bedauern","t":"Verb","k":"be + dauern (sürmek; acı vermek)","c":"bedauert – bedauerte – hat bedauert","br":"Eski dauern „acı vermek“ anlamı taşırdı (es dauert mich = bana dokunuyor). Resmî yazının nezaket fiili: Wir bedauern, Ihnen mitteilen zu müssen …","tr":"üzülmek, esef etmek","s":"Wir bedauern die entstandenen Unannehmlichkeiten.","st":"Oluşan rahatsızlıktan dolayı üzgünüz.","f":"bedauerlich (üzücü) · bedauerlicherweise (maalesef) · das Bedauern (esef)"},{"w":"bereuen","t":"Verb","k":"be + Reue (pişmanlık)","c":"bereut – bereute – hat bereut","br":"Reue = pişmanlık. bedauern dıştaki duruma üzülmedir, bereuen kendi yaptığına pişmanlıktır — bu ayrım özür yazarken belirleyicidir.","tr":"pişman olmak","s":"Diese Entscheidung habe ich nie bereut.","st":"Bu karardan hiç pişman olmadım.","f":"die Reue (pişmanlık) · reuig (pişman) · bedauern (üzülmek)"},{"w":"sich wundern über (A)","t":"Verb","k":"Wunder (mucize) + -n","c":"wundert – wunderte – hat gewundert","br":"Beklenmedik olana karşı verilen iç tepki: şaşırmak. Kalıp: Es wundert mich, dass … — beni şaşırtan şu ki.","tr":"şaşırmak","s":"Ich wundere mich über die Höhe der Nachzahlung.","st":"Ek ödemenin tutarına şaşırıyorum.","f":"das Wunder (mucize) · wunderbar (harika) · verwundert (şaşkın)"},{"w":"staunen","t":"Verb","k":"eski Almanca: donup kalmak","c":"staunt – staunte – hat gestaunt","br":"Beklenmedik karşısında donup kalmak — hayranlık içerir, bu yüzden sich wundern’den ayrılır: wundern kafa karışıklığı, staunen hayranlıktır. Kökeni eski Germen dillerine dayanır, kesin türetmesi tartışmalı; ayrımı kullanımdan öğren.","tr":"hayretle şaşırmak, hayran kalmak","s":"Die Klasse staunte über das Ergebnis des Versuchs.","st":"Sınıf deneyin sonucuna hayretle baktı.","f":"erstaunlich (şaşırtıcı) · das Erstaunen (hayret) · staunenswert (hayranlık verici)"},{"w":"sich ärgern über (A)","t":"Verb","k":"arg (kötü, fena) + -ern","c":"ärgert – ärgerte – hat geärgert","br":"arg = kötü; kötüye yorulan şeye içerlemek. Refleksifsiz kullanılırsa yön değişir: jemanden ärgern = birini kızdırmak.","tr":"sinirlenmek, canı sıkılmak","s":"Über solche Formfehler ärgere ich mich jedes Jahr.","st":"Böyle şekil hatalarına her yıl sinirleniyorum.","f":"der Ärger (kızgınlık, sorun) · ärgerlich (can sıkıcı) · verärgert (kızgın)"},{"w":"zögern","t":"Verb","k":"ziehen (çekmek) kökünden: zamanı çekmek","c":"zögert – zögerte – hat gezögert","br":"Kararı öne çekmeyip geriye sürmek = duraksamak. Aynı kökten verzögern (geciktirmek). Kalıp: ohne zu zögern — hiç duraksamadan.","tr":"tereddüt etmek, duraksamak","s":"Sie hat keine Sekunde gezögert.","st":"Bir saniye bile tereddüt etmedi.","f":"verzögern (geciktirmek) · zögerlich (tereddütlü) · unverzüglich (gecikmeksizin)"},{"w":"sich sträuben gegen (A)","t":"Verb","k":"Strauß/strupp: diken diken olmak","c":"sträubt – sträubte – hat gesträubt","br":"Kedinin tüylerinin diken diken olması: içgüdüsel direnç. İnsanda: bir şeye içten içe karşı koymak.","tr":"içten içe direnmek, ayak diremek","s":"Er sträubt sich gegen jede zusätzliche Kontrolle.","st":"Her ek denetime ayak diriyor.","f":"sich wehren gegen (karşı koymak) · der Widerstand (direnç) · widerwillig (isteksizce)"},{"w":"aufatmen","t":"Verb","k":"auf + atmen (nefes almak)","c":"atmet auf – atmete auf – hat aufgeatmet","br":"Tutulan nefesi salıvermek = rahatlamak. Vücut hareketi doğrudan duyguya dönüşmüş bir fiil.","tr":"rahat bir nefes almak","s":"Nach der Zusage konnten alle aufatmen.","st":"Onaydan sonra herkes rahat bir nefes aldı.","f":"atmen (nefes almak) · der Atem (nefes) · die Erleichterung (rahatlama)"},{"w":"gönnen","t":"Verb + Dativ","k":"eski: birine iyilik dilemek","c":"gönnt – gönnte – hat gegönnt","br":"Başkasının kazandığına içten sevinmek, çok görmemek — Türkçede tek kelimesi yok. Karşıtı missgönnen; kökeni eski Almancaya dayanır ve kesin türetmesi belirsizdir. Kelimeyi karşıtıyla birlikte tutmak en sağlam yol: gönnen ↔ Neid (kıskançlık).","tr":"çok görmemek, hakkını teslim etmek","s":"Diesen Erfolg gönne ich ihr von Herzen.","st":"Bu başarıyı ona yürekten çok görmüyorum.","f":"missgönnen (çok görmek) · der Neid (kıskançlık) · sich etwas gönnen (kendine izin vermek)"},{"w":"bewundern","t":"Verb","k":"be + Wunder (mucize) + -n","c":"bewundert – bewunderte – hat bewundert","br":"Bir şeyi mucize gibi görmek = hayranlık duymak. sich wundern (şaşırmak) ile aynı kök, ama be- onu dışa, nesneye yöneltir.","tr":"hayran olmak","s":"Ich bewundere ihre Geduld in solchen Gesprächen.","st":"Böyle görüşmelerdeki sabrına hayranım.","f":"die Bewunderung (hayranlık) · bewundernswert (hayranlık verici) · das Wunder (mucize)"},{"w":"schätzen","t":"Verb","k":"Schatz (hazine) + -en","c":"schätzt – schätzte – hat geschätzt","br":"Schatz = hazine. Bir şeye hazine değeri biçmek: hem „tahmin etmek“ hem „kıymet vermek“. İki anlam da „değer biçme“den çıkar.","tr":"tahmin etmek; kıymet vermek","s":"Ich schätze den Aufwand auf etwa zehn Stunden.","st":"Emeği yaklaşık on saat olarak tahmin ediyorum.","f":"der Schatz (hazine) · die Schätzung (tahmin) · wertschätzen (değer vermek)","m":[{"tr":"değer vermek, takdir etmek","s":"Ich schätze Ihre offene Art sehr.","st":"Açık sözlü tavrınıza çok değer veriyorum."}]},{"w":"befürchten","t":"Verb","k":"be + Furcht (korku)","c":"befürchtet – befürchtete – hat befürchtet","br":"Furcht = korku. Olumsuz bir ihtimali beklemek = endişe etmek. Kalıp: Ich befürchte, dass … — kötü haberi yumuşatarak vermenin yolu.","tr":"endişe etmek, korkmak (bir ihtimalden)","s":"Ich befürchte, wir haben den letzten Bus verpasst.","st":"Korkarım son otobüsü kaçırdık.","f":"die Furcht (korku) · die Befürchtung (endişe) · fürchten (korkmak)"},{"w":"hoffen auf (A)","t":"Verb","k":"hoffen (ummak) + auf","c":"hofft – hoffte – hat gehofft","br":"Beklentiyi geleceğe bağlamak. Edat auf’tur çünkü umut ileriye, bir hedefe yönelir — sich freuen auf ile aynı mantık.","tr":"ummak, ümit etmek","s":"Wir hoffen auf eine rasche und einvernehmliche Lösung.","st":"Hızlı ve karşılıklı rızaya dayalı bir çözüm umuyoruz.","f":"die Hoffnung (umut) · hoffentlich (inşallah) · aussichtsreich (umut verici)"},{"w":"sich gedulden","t":"Verb","k":"Geduld (sabır) + -en","c":"geduldet – geduldete – hat geduldet","br":"Geduld, dulden (katlanmak) kökünden gelir: katlanma gücü = sabır. sich gedulden: sabırla beklemek. Resmî yazının kalıbı: Wir bitten Sie, sich noch zu gedulden.","tr":"sabretmek, sabırla beklemek","s":"Wir bitten Sie, sich noch wenige Tage zu gedulden.","st":"Birkaç gün daha sabretmenizi rica ederiz.","f":"die Geduld (sabır) · geduldig (sabırlı) · dulden (katlanmak)"}]},{"n":"Beden, hareket ve kaza","e":"stolpern, sich verletzen, heben, rutschen…","c":"#7a4a5a","g":"Kök aileleri","cards":[{"w":"sich verletzen","t":"Verb","k":"ver + letzen (eski: zarar vermek)","c":"verletzt – verletzte – hat verletzt","br":"Aynı kök hem bedeni hem kuralı kapsar: eine Regel verletzen (kuralı ihlal etmek), jemanden verletzen (birini yaralamak ya da incitmek). Üç alan tek fiilde.","tr":"yaralanmak; incitmek","s":"Beim Sport hat er sich am Knie verletzt.","st":"Sporda dizini yaraladı.","f":"die Verletzung (yaralanma; ihlal) · verletzend (kırıcı) · sich wehtun (canını yakmak)"},{"w":"stolpern ↔ rutschen","t":"Hareket çifti","k":"stolpern (takılmak) / rutschen (kaymak)","c":"stolpert – stolperte – ist gestolpert","br":"İkisi de düşme sebebidir ama farklıdır: bir şeye takılmak stolpern, zeminde kaymak rutschen. Kaygan zemin uyarısı: Vorsicht, rutschig!","tr":"takılmak ↔ kaymak","s":"Ich bin über die Stufe gestolpert.","st":"Basamağa takıldım.","f":"hinfallen (düşmek) · rutschig (kaygan) · die Stufe (basamak)"},{"w":"hinfallen ↔ aufstehen","t":"Hareket çifti","k":"hin + fallen / auf + stehen","c":"fällt hin – fiel hin – ist hingefallen","br":"Yön mantığı: hin- yere doğru, auf- yukarı. Deyim de aynı çiftten kurulur: Immer wieder aufstehen — her seferinde yeniden kalkmak.","tr":"düşmek ↔ kalkmak","s":"Das Kind ist hingefallen, aber sofort wieder aufgestanden.","st":"Çocuk düştü ama hemen yeniden kalktı.","f":"stürzen (sert düşmek) · aufheben (yerden kaldırmak) · der Sturz (düşüş)"},{"w":"heben ↔ tragen","t":"Hareket çifti","k":"heben (kaldırmak) / tragen (taşımak)","c":"hebt – hob – hat gehoben","br":"heben yerden yukarı kaldırmaktır (tek hareket), tragen ise taşımaktır (süreklilik). Sırt uyarısı: aus den Knien heben, nicht aus dem Rücken.","tr":"kaldırmak ↔ taşımak","s":"Heb den Karton bitte aus den Knien.","st":"Kutuyu lütfen dizlerinden kaldır.","f":"anheben (biraz kaldırmak) · schwer (ağır) · der Rücken (sırt)"},{"w":"sich bücken ↔ sich strecken","t":"Hareket çifti","k":"bücken (eğilmek) / strecken (uzatmak)","c":"bückt – bückte – hat gebückt","br":"Eğilme ve gerinme. İlgili: sich beugen (eğilmek, boyun eğmek), die Beugung (çekim, eğilme) — dilbilgisindeki çekim de aynı imgeden.","tr":"eğilmek ↔ gerinmek, uzanmak","s":"Ich habe mich gebückt und mir den Rücken verrenkt.","st":"Eğildim ve belimi tuttum.","f":"sich beugen (eğilmek) · die Bewegung (hareket) · dehnen (esnetmek)"},{"w":"drücken ↔ ziehen (kapı)","t":"Günlük çift","k":"drücken (itmek) / ziehen (çekmek)","c":"—","br":"Kapılardaki iki kelime: Drücken (it) ↔ Ziehen (çek). Almanya’da her kapıda karşına çıkar; karıştırmak günlük hayatın klasik anıdır.","tr":"itmek ↔ çekmek","s":"An der Tür steht „Ziehen“, nicht „Drücken“.","st":"Kapıda „çek“ yazıyor, „it“ değil.","f":"der Druck (baskı) · der Zug (çekiş) · die Klinke (kapı kolu)"},{"w":"greifen ↔ loslassen","t":"Hareket çifti","k":"greifen (kavramak) / los + lassen (bırakmak)","c":"greift – griff – hat gegriffen","br":"Tutmak ve bırakmak. loslassen mecazî olarak da güçlüdür: bir konuyu ya da kişiyi bırakabilmek. Aynı kökten: der Griff, begreifen.","tr":"kavramak ↔ bırakmak","s":"Lass bitte kurz los, ich halte das schon.","st":"Bırakıver biraz, ben tutuyorum.","f":"der Griff (tutamak; kavrayış) · festhalten (sıkı tutmak) · begreifen (kavramak)"},{"w":"schütteln ↔ nicken","t":"Baş hareketleri","k":"schütteln (sallamak) / nicken (baş sallamak)","c":"—","br":"İki jest: den Kopf schütteln = hayır, nicken = evet. Ayrıca die Hand schütteln — el sıkışmak; Almanya’da tanışmanın standart jesti.","tr":"başını iki yana sallamak ↔ başını sallayarak onaylamak","s":"Er hat nur den Kopf geschüttelt.","st":"Sadece başını iki yana salladı.","f":"die Hand schütteln (el sıkışmak) · zustimmen (onaylamak) · ablehnen (reddetmek)"},{"w":"der Sturz ↔ die Prellung","t":"Kaza çifti","k":"stürzen (düşmek) / prellen (çarpmak)","c":"—","br":"Düşüşün kendisi Sturz, sonucu ise çoğu kez Prellung (berelenme) ya da die Zerrung (kas zorlanması). Kırık ise der Bruch — kesirle aynı kelime.","tr":"düşme ↔ berelenme","s":"Nach dem Sturz war es zum Glück nur eine Prellung.","st":"Düşmeden sonra neyse ki sadece berelenmeydi.","f":"der Bruch (kırık) · die Zerrung (zorlanma) · röntgen (röntgen çekmek)"},{"w":"der Verbandskasten","t":"Nomen, ¨-","k":"Verband (sargı, birlik) + Kasten (kutu)","c":"der Verbandskasten, -kästen","br":"Araçta bulundurulması zorunlu ilk yardım çantası. Verband hem sargı bezi hem dernek demektir — ikisi de „bağlamak“tan (binden).","tr":"ilk yardım çantası","s":"Der Verbandskasten im Auto ist abgelaufen.","st":"Arabadaki ilk yardım çantasının süresi dolmuş.","f":"der Verband (sargı; birlik) · das Pflaster (yara bandı) · die Erste Hilfe (ilk yardım)"},{"w":"die Erste Hilfe leisten","t":"Kollokation","k":"Hilfe (yardım) + leisten (yerine getirmek)","c":"leistet – leistete – hat geleistet","br":"Almanya’da ilk yardım yapmamak suçtur: unterlassene Hilfeleistung. Yani „yardım etmeyi ihmal“ hukuki bir kavramdır.","tr":"ilk yardım yapmak","s":"Jeder ist verpflichtet, Erste Hilfe zu leisten.","st":"Herkes ilk yardım yapmakla yükümlüdür.","f":"die Hilfeleistung (yardım edimi) · unterlassen (yapmamak) · der Notruf (acil çağrı)"},{"w":"sich ausruhen ↔ sich erholen","t":"Dinlenme çifti","k":"aus + ruhen / er + holen","c":"—","br":"sich ausruhen kısa dinlenmedir (bir saat, bir öğle); sich erholen ise toparlanma sürecidir (tatil, hastalık sonrası). Kalıp: Erhol dich gut!","tr":"biraz dinlenmek ↔ toparlanmak","s":"Ruh dich kurz aus, dann machen wir weiter.","st":"Kısa bir dinlen, sonra devam ederiz.","f":"die Erholung (toparlanma) · die Pause (mola) · die Ruhe (dinginlik)"},{"w":"sich bewegen ↔ die Bewegung","t":"Hareket ailesi","k":"be + wegen (Weg: yol)","c":"bewegt – bewegte – hat bewegt","br":"Kök „yol“: yola koymak = hareket ettirmek. Mecazî anlamı duygusaldır: Das hat mich sehr bewegt (beni çok etkiledi). Sağlık dilinde: mehr Bewegung.","tr":"hareket etmek / hareket","s":"Der Arzt sagt, ich brauche mehr Bewegung.","st":"Doktor daha çok harekete ihtiyacım olduğunu söylüyor.","f":"der Weg (yol) · beweglich (hareketli) · bewegend (dokunaklı)"},{"w":"belasten ↔ schonen (Körper)","t":"Kullanım çifti","k":"be + Last (yük) / schonen (esirgemek)","c":"—","br":"Vücuda yük bindirmek ↔ onu koruyup esirgemek. Tavsiye kalıbı: das Knie schonen. Aynı fiil kaynak için de kullanılır: Ressourcen schonen.","tr":"yüklenmek ↔ esirgemek, korumak","s":"Das Knie sollten Sie noch zwei Wochen schonen.","st":"Dizinizi iki hafta daha korumalısınız.","f":"die Belastung (yüklenme) · schonend (nazik, koruyucu) · die Schonung (esirgeme)"}]},{"n":"Hava, doğa ve mevsim","e":"Niederschlag, Glätte, Tauwetter, Dämmerung…","c":"#3f7d8c","g":"Kök aileleri","cards":[{"w":"der Niederschlag","t":"Nomen, ¨-e","k":"nieder (aşağı) + Schlag (schlagen: vurmak)","c":"der Niederschlag, die Niederschläge","br":"Aşağı vuran = yağış (yağmur, kar, dolu hepsi birden). Kimyada aynı kelime çökeltidir; mecazî kalıp: sich niederschlagen in — bir şeye yansımak.","tr":"yağış","s":"Für morgen sind kräftige Niederschläge angekündigt.","st":"Yarın için kuvvetli yağış bekleniyor.","f":"niederschlagen (aşağı vurmak) · sich niederschlagen in (…e yansımak) · der Regen (yağmur)"},{"w":"die Dürre","t":"Nomen, -n","k":"dürr (kuru, cılız) + -e","c":"die Dürre, die Dürren","br":"dürr = kupkuru. Sıfattan isim kalıbı (hoch→Höhe gibi). Trockenheit genel kuruluk, Dürre ise zarar veren uzun kuraklıktır.","tr":"kuraklık","s":"Die Dürre hat die Ernte deutlich verringert.","st":"Kuraklık hasadı belirgin şekilde azalttı.","f":"dürr (kuru) · die Trockenheit (kuruluk) · die Ernte (hasat)"},{"w":"der Frost","t":"Nomen, ¨-e","k":"frieren (donmak)","c":"der Frost, die Fröste","br":"Sıfırın altındaki hava. Bileşikleri günlük hayatta iş görür: der Nachtfrost, frostfrei, der Frostschutz (antifriz).","tr":"don, ayaz","s":"In der Nacht ist mit leichtem Frost zu rechnen.","st":"Gece hafif don bekleniyor.","f":"frieren (donmak, üşümek) · der Frostschutz (antifriz) · das Eis (buz)"},{"w":"die Glätte","t":"Nomen (çoğulsuz)","k":"glatt (kaygan, düz) + -e","c":"die Glätte","br":"glatt = pürüzsüz, kaygan. Kışın yol kayganlığı; sabahları uyarı olarak duyulur: Glatteisgefahr. Aynı kökten glätten (düzeltmek).","tr":"kayganlık, buzlanma","s":"Wegen Glätte fällt der Schulbus heute aus.","st":"Buzlanma nedeniyle okul servisi bugün iptal.","f":"glatt (kaygan) · das Glatteis (buzlanma) · streuen (tuz serpmek)"},{"w":"der Nebel","t":"Nomen, -","k":"eski Hint-Avrupa kökü: bulut, sis","c":"der Nebel, die Nebel","br":"Sis. Latince nebula ve Yunanca nephos ile akrabadır — ortak Hint-Avrupa kökünden. Parçalara ayrılmaz, bu yüzden köprüsü kullanımdadır: neblig (sisli), die Nebelschlussleuchte (arka sis lambası), die Sichtweite (görüş mesafesi).","tr":"sis","s":"Auf der Autobahn herrschte dichter Nebel.","st":"Otoyolda yoğun sis vardı.","f":"neblig (sisli) · die Sicht (görüş) · die Sichtweite (görüş mesafesi)"},{"w":"schwül","t":"Adjektiv","k":"schwellen (şişmek) kökü","c":"—","br":"Nemli ve boğucu sıcak. Kökeni tartışmalıdır — bazı kaynaklar schwelen (için için yanmak) ile bağ kurar; kesin sayma. Pratikte önemli olan yazım farkı: schwül (boğucu) ↔ schwul (eşcinsel). Umlaut anlamı tümüyle değiştirir.","tr":"boğucu sıcak, bunaltıcı","s":"Es war den ganzen Tag drückend schwül.","st":"Bütün gün bunaltıcı derecede boğucuydu.","f":"drückend (bunaltıcı) · die Schwüle (boğuculuk) · feucht (nemli)"},{"w":"die Hitzewelle","t":"Nomen, -n","k":"Hitze (sıcaklık) + Welle (dalga)","c":"die Hitzewelle, -n","br":"Sıcağın dalga hâlinde gelmesi. -welle eki başka alanlarda da işler: die Grippewelle, die Kündigungswelle — hepsi „toplu ve geçici bir akın“.","tr":"sıcak dalgası","s":"Während der Hitzewelle bekamen die Kinder hitzefrei.","st":"Sıcak dalgasında çocuklar okuldan erken bırakıldı.","f":"die Hitze (sıcaklık) · hitzefrei (aşırı sıcak nedeniyle tatil) · die Welle (dalga)"},{"w":"das Hochwasser","t":"Nomen (çoğulsuz)","k":"hoch (yüksek) + Wasser (su)","c":"das Hochwasser","br":"hoch yüksek, Wasser sudur: suyun normal seviyesinin üstüne çıkması. Bileşiğin son kelimesi türü belirler, bu yüzden das. Sonucu farklı bir kelimedir: die Überschwemmung — su karayı bastığında. Biri seviye, öbürü olay.","tr":"su seviyesinin yükselmesi, taşkın","s":"Der Pegel steigt; für morgen wird Hochwasser erwartet.","st":"Su seviyesi yükseliyor; yarın için taşkın bekleniyor.","f":"der Pegel (su seviyesi) · die Überschwemmung (sel basması) · der Damm (set)"},{"w":"die Überschwemmung","t":"Nomen, -en","k":"über (üstüne) + schwemmen (sürüklemek) + -ung","c":"die Überschwemmung, -en","br":"schwemmen = suyun bir şeyi sürükleyip taşıması. Suyun karayı basması = sel. Aynı kökten anschwemmen (kıyıya vurmak).","tr":"sel, su baskını","s":"Nach den Regenfällen kam es zu Überschwemmungen im Keller.","st":"Yağışlardan sonra bodrumda su baskını oldu.","f":"schwemmen (sürüklemek) · das Hochwasser (taşkın) · der Schaden (hasar)"},{"w":"das Tauwetter","t":"Nomen (çoğulsuz)","k":"tauen (erimek) + Wetter (hava)","c":"das Tauwetter","br":"Karın eridiği hava. Siyasette de kullanılır: gerginliğin çözülmesi. Aynı kökten der Tau (çiy) ve auftauen (buzunu çözmek).","tr":"kar erime havası; yumuşama","s":"Mit dem Tauwetter steigt die Hochwassergefahr.","st":"Karların erimesiyle taşkın riski artıyor.","f":"tauen (erimek) · auftauen (buzunu çözmek) · der Tau (çiy)"},{"w":"der Hagel","t":"Nomen (çoğulsuz)","k":"eski Cermen kökü: dolu tanesi","c":"der Hagel","br":"Buz tanesi hâlindeki yağış. Mecazî kullanımı yoğunluk anlatır: ein Hagel von Vorwürfen — suçlama yağmuru.","tr":"dolu","s":"Der Hagel hat mehrere Dächer beschädigt.","st":"Dolu birkaç çatıya zarar verdi.","f":"hageln (dolu yağmak) · der Hagelschaden (dolu hasarı) · das Unwetter (fırtınalı hava)"},{"w":"die Dämmerung","t":"Nomen, -en","k":"dämmern (loşlaşmak) + -ung","c":"die Dämmerung, -en","br":"Ne tam gündüz ne tam gece: alacakaranlık. İkiye ayrılır: Morgendämmerung ve Abenddämmerung. Mecazî: es dämmert mir — kafamda ışık yandı.","tr":"alacakaranlık, tan/akşam karanlığı","s":"In der Dämmerung ist die Unfallgefahr am größten.","st":"Alacakaranlıkta kaza riski en yüksektir.","f":"dämmern (loşlaşmak; yavaş anlaşılmak) · die Morgendämmerung (tan) · das Zwielicht (yarı ışık)"},{"w":"wechselhaft","t":"Adjektiv","k":"wechseln (değişmek) + -haft","c":"—","br":"Değişkenlik niteliği taşıyan = kararsız. Hava raporlarının klasiği; insan için de kullanılır: wechselhafte Stimmung.","tr":"değişken, kararsız (hava)","s":"Das Wetter bleibt bis zum Wochenende wechselhaft.","st":"Hava hafta sonuna kadar değişken kalıyor.","f":"wechseln (değiştirmek) · der Wechsel (değişim) · beständig (istikrarlı)"},{"w":"mild","t":"Adjektiv","k":"mild (yumuşak, ılıman)","c":"—","br":"Havada ılıman, tatta yumuşak, cezada hafif. Üç alanda da „sertliğin alınmış hâli“. Karşıtları: streng (sert), scharf (keskin), rau (haşin).","tr":"ılıman; yumuşak, hafif","s":"Der Winter war in diesem Jahr ungewöhnlich mild.","st":"Bu yıl kış alışılmadık şekilde ılımandı.","f":"die Milde (yumuşaklık) · mildern (hafifletmek) · rau (haşin)"}]},{"n":"Mutfak ve yemek dili","e":"Zutat, abschmecken, anbraten, Gericht…","c":"#a35d3a","g":"Kök aileleri","cards":[{"w":"die Zutat","t":"Nomen, -en","k":"zu + tun (koymak) → katılan şey","c":"die Zutat, die Zutaten","br":"„Eklenen şey“ = malzeme. Aynı kökten zutun, die Tat (eylem). Ambalajlarda daima çoğuldur: Zutaten.","tr":"malzeme (yemekte)","s":"Alle Zutaten werden zuerst gewogen.","st":"Bütün malzemeler önce tartılır.","f":"tun (yapmak, koymak) · die Tat (eylem) · das Rezept (tarif)"},{"w":"abschmecken","t":"Verb","k":"ab + schmecken (tatmak)","c":"schmeckt ab – schmeckte ab – hat abgeschmeckt","br":"ab- burada „sonuca doğru“: tadına bakıp son ayarı yapmak. Tariflerin kapanış cümlesi: mit Salz und Pfeffer abschmecken.","tr":"tadına bakıp lezzet ayarı yapmak","s":"Zum Schluss mit Salz und Pfeffer abschmecken.","st":"Sonunda tuz ve karabiberle tat ayarı yapın.","f":"schmecken (tat vermek) · der Geschmack (tat) · würzen (baharatlamak)"},{"w":"anbraten","t":"Verb","k":"an (kısmen) + braten (kızartmak)","c":"brät an – briet an – hat angebraten","br":"an- ön eki kısmi hareket bildirir: tamamen değil, biraz. Eti dışını mühürleyecek kadar kızartmak. Aynı mantık: anlesen, antrinken, anschneiden.","tr":"mühürlemek, hafif kızartmak","s":"Das Fleisch zuerst scharf anbraten, dann schmoren.","st":"Eti önce yüksek ateşte mühürleyin, sonra ağır ateşte pişirin.","f":"braten (kızartmak) · schmoren (ağır ateşte pişirmek) · der Braten (fırın eti)"},{"w":"dünsten","t":"Verb","k":"Dunst (buhar) + -en","c":"dünstet – dünstete – hat gedünstet","br":"Dunst = hafif buhar. Az sıvıda, kapalı kapta buharla pişirmek. dämpfen ise doğrudan buharda pişirmedir; kochen suda kaynatmaktır.","tr":"az suda buharda pişirmek","s":"Das Gemüse nur kurz dünsten, damit es bissfest bleibt.","st":"Sebzeyi diri kalsın diye kısa süre buğulayın.","f":"der Dunst (buhar) · dämpfen (buharda pişirmek) · bissfest (diri, al dente)"},{"w":"garen","t":"Verb","k":"gar (pişmiş) + -en","c":"gart – garte – hat gegart","br":"gar = pişmiş, tamam. Pişirmenin üst kavramı: yöntemi belirtmeden „pişirmek“. gar olmayan şey roh’tur.","tr":"pişirmek (genel), pişmek","s":"Der Auflauf gart im Ofen etwa 40 Minuten.","st":"Fırın yemeği fırında yaklaşık 40 dakika pişer.","f":"gar (pişmiş) · roh (çiğ) · die Garzeit (pişme süresi)"},{"w":"verrühren","t":"Verb","k":"ver + rühren (karıştırmak)","c":"verrührt – verrührte – hat verrührt","br":"rühren = kaşıkla karıştırmak; ver- „tamamen birbirine karışana kadar“ katar. Aynı fiilin mecazî anlamı duygusaldır: es rührt mich (dokunuyor).","tr":"iyice karıştırmak","s":"Mehl und Eier glatt verrühren.","st":"Un ve yumurtayı pürüzsüz olana dek karıştırın.","f":"rühren (karıştırmak; duygulandırmak) · umrühren (çevirerek karıştırmak) · der Teig (hamur)"},{"w":"die Prise","t":"Nomen, -n","k":"Fransızca prise: tutam (prendre: almak)","c":"die Prise, die Prisen","br":"İki parmak arasına alınan miktar = tutam. Tariflerin en küçük ölçüsü: eine Prise Salz.","tr":"tutam","s":"Eine Prise Salz genügt völlig.","st":"Bir tutam tuz fazlasıyla yeter.","f":"das Salz (tuz) · der Teelöffel (çay kaşığı) · der Esslöffel (yemek kaşığı)"},{"w":"der Teig","t":"Nomen, -e","k":"eski kök: yoğrulan şey (bkz. İngilizce dough)","c":"der Teig, die Teige","br":"Yoğrulan kütle = hamur. Kabarması das Aufgehen’dir: hamur „yukarı gider“.","tr":"hamur","s":"Den Teig zugedeckt 30 Minuten gehen lassen.","st":"Hamuru üstü kapalı 30 dakika mayalanmaya bırakın.","f":"kneten (yoğurmak) · aufgehen (kabarmak) · die Hefe (maya)"},{"w":"die Beilage","t":"Nomen, -n","k":"bei (yanında) + Lage (legen: koymak)","c":"die Beilage, die Beilagen","br":"Yanına konan = garnitür. Aynı kelime gazetede „ek“ demektir: Wochenendbeilage. İki anlam da „yanına koyulan“dan.","tr":"garnitür, yan yemek","s":"Als Beilage gibt es Kartoffeln oder Reis.","st":"Garnitür olarak patates ya da pilav var.","f":"beilegen (yanına koymak; eklemek) · die Anlage (ek) · das Hauptgericht (ana yemek)"},{"w":"das Gericht","t":"Nomen, -e","k":"richten (düzenlemek, hazırlamak; yargılamak)","c":"das Gericht, die Gerichte","br":"richten hem „hazırlamak, düzenlemek“ hem „yargılamak“ demektir. Bu yüzden das Gericht hem hazırlanmış yemek hem mahkemedir — Almancanın en şaşırtıcı ikizi.","tr":"yemek (tabak olarak)","s":"Das Gericht des Tages steht auf der Tafel.","st":"Günün yemeği tabelada yazıyor.","f":"richten (hazırlamak; yargılamak) · anrichten (tabağa koymak) · das Hauptgericht (ana yemek)","m":[{"tr":"mahkeme","s":"Das Gericht hat die Klage abgewiesen.","st":"Mahkeme davayı reddetti."}]},{"w":"herzhaft ↔ süß","t":"Karşıt çift","k":"Herz (yürek) + -haft / süß (tatlı)","c":"—","br":"Almanca tatları ikiye böler: herzhaft (tuzlu, doyurucu — „yürekli“) ve süß. Kahvaltıda bile sorulur: herzhaft oder süß?","tr":"tuzlu, doyurucu ↔ tatlı","s":"Frühstücken Sie lieber herzhaft oder süß?","st":"Kahvaltıyı tuzlu mu tatlı mı tercih edersiniz?","f":"das Herz (yürek) · deftig (ağır, doyurucu) · die Süßspeise (tatlı yemek)"},{"w":"die Haltbarkeit","t":"Nomen (çoğulsuz)","k":"halten (dayanmak) + -bar + -keit","c":"die Haltbarkeit","br":"Ne kadar dayanabildiği. Ambalajdaki kalıp: mindestens haltbar bis — „en az şu tarihe kadar dayanır“, yani son kullanma değil, asgari tazelik tarihi.","tr":"dayanma süresi, raf ömrü","s":"Mindestens haltbar bis: 12.03.2027.","st":"En az şu tarihe kadar dayanır: 12.03.2027.","f":"haltbar (dayanıklı) · das Mindesthaltbarkeitsdatum (asgari tazelik tarihi) · verderben (bozulmak)"},{"w":"abtropfen lassen","t":"Kalıp","k":"ab (aşağı) + tropfen (damlamak)","c":"lässt abtropfen – ließ abtropfen","br":"Suyunu damlata damlata süzdürmek. lassen burada „bırakmak“: eylemin kendiliğinden olmasına izin vermek — kalıbın mantığı budur.","tr":"suyunu süzdürmek","s":"Die Nudeln kurz abtropfen lassen.","st":"Makarnanın suyunu kısaca süzdürün.","f":"der Tropfen (damla) · abgießen (suyunu dökmek) · das Sieb (süzgeç)"},{"w":"die Nachspeise","t":"Nomen, -n","k":"nach (sonra) + Speise (yemek)","c":"die Nachspeise, -n","br":"Yemekten sonra gelen = tatlı. Sıra bellidir: Vorspeise → Hauptgericht → Nachspeise. Ön ekler menüyü kendiliğinden sıralar.","tr":"tatlı (son yemek)","s":"Als Nachspeise gibt es Apfelkuchen.","st":"Tatlı olarak elmalı kek var.","f":"die Vorspeise (başlangıç) · das Hauptgericht (ana yemek) · die Speise (yemek)"}]},{"n":"Güçlü fiil kalıpları (Ablaut)","e":"düzensiz sanılan fiiller aslında 9 kalıba oturur","c":"#1f5f8b","g":"Dilbilgisi mantığı","cards":[{"w":"ei – ie – ie","t":"Ablaut kalıbı","k":"bleiben – blieb – geblieben","c":"bleibt – blieb – ist geblieben","br":"Güçlü fiiller ezberlenmez, kalıba oturur. Bu kalıpta ei uzun ie’ye döner ve iki hâlde de aynı kalır. Üyeleri: schreiben, steigen, treiben, leihen, scheinen, schweigen, weisen, meiden, entscheiden.","tr":"kalıp 1: kalmak, yazmak, binmek…","s":"Ich bin gestern zu Hause geblieben und habe zwei Briefe geschrieben.","st":"Dün evde kaldım ve iki mektup yazdım.","f":"schreiben (yazmak) · steigen (yükselmek) · entscheiden (karar vermek) · scheinen (görünmek)"},{"w":"ei – i – i","t":"Ablaut kalıbı","k":"greifen – griff – gegriffen","c":"greift – griff – hat gegriffen","br":"Yine ei ile başlar, ama bu kez kısa i olur. Ayırt etme yolu: kökte çift ünsüz varsa kısa. Üyeleri: pfeifen, reiten, schneiden, streiten, beißen, gleiten, leiden.","tr":"kalıp 2: kavramak, kesmek, tartışmak…","s":"Wir haben lange gestritten, dann hat er einfach zum Telefon gegriffen.","st":"Uzun süre tartıştık, sonra telefona uzanıverdi.","f":"schneiden (kesmek) · streiten (tartışmak) · reiten (ata binmek) · leiden (acı çekmek)"},{"w":"ie – o – o","t":"Ablaut kalıbı","k":"fliegen – flog – geflogen","c":"fliegt – flog – ist geflogen","br":"ie’den o’ya geçiş. Üyeleri: biegen, bieten, frieren, schieben, verlieren, wiegen, ziehen (zog – gezogen), schließen, genießen.","tr":"kalıp 3: uçmak, sunmak, kaybetmek…","s":"Wir sind nach Istanbul geflogen und haben den Urlaub sehr genossen.","st":"İstanbul’a uçtuk ve tatilin tadını çok çıkardık.","f":"verlieren (kaybetmek) · schließen (kapatmak) · anbieten (sunmak) · ziehen (çekmek)"},{"w":"i – a – u","t":"Ablaut kalıbı","k":"finden – fand – gefunden","c":"findet – fand – hat gefunden","br":"En kalabalık kalıplardan: i → a → u. Üyeleri: binden, singen, trinken, sinken, springen, zwingen, gelingen, verschwinden, klingen.","tr":"kalıp 4: bulmak, içmek, şarkı söylemek…","s":"Ich habe den Schlüssel gefunden, den du gesucht hast.","st":"Aradığın anahtarı buldum.","f":"trinken (içmek) · singen (şarkı söylemek) · gelingen (başarmak) · verschwinden (kaybolmak)"},{"w":"i – a – o","t":"Ablaut kalıbı","k":"beginnen – begann – begonnen","c":"beginnt – begann – hat begonnen","br":"Bir öncekinin ikizi ama Partizip o ile biter. Yalnızca birkaç fiil: gewinnen, schwimmen, spinnen, rinnen. Karıştırmamak için ikisini birlikte öğren.","tr":"kalıp 5: başlamak, kazanmak, yüzmek","s":"Der Kurs hat schon begonnen, aber sie hat trotzdem gewonnen.","st":"Kurs çoktan başlamıştı ama yine de kazandı.","f":"gewinnen (kazanmak) · schwimmen (yüzmek) · der Beginn (başlangıç)"},{"w":"e – a – o","t":"Ablaut kalıbı","k":"nehmen – nahm – genommen","c":"nimmt – nahm – hat genommen","br":"Present’te e→i değişimi de olur (nimmt, spricht, hilft). Üyeleri: sprechen, treffen, brechen, helfen, sterben, werfen, stehlen, empfehlen.","tr":"kalıp 6: almak, konuşmak, yardım etmek…","s":"Er hat mir geholfen und den schweren Karton genommen.","st":"Bana yardım etti ve ağır kutuyu aldı.","f":"sprechen (konuşmak) · helfen (yardım etmek) · empfehlen (önermek) · werfen (atmak)"},{"w":"e – a – e","t":"Ablaut kalıbı","k":"geben – gab – gegeben","c":"gibt – gab – hat gegeben","br":"Partizip başladığı sesliye döner. Üyeleri: lesen, sehen, essen, treten, vergessen, messen, geschehen. Present yine e→i/ie: gibt, liest, sieht.","tr":"kalıp 7: vermek, okumak, görmek…","s":"Hast du gesehen, was er mir gegeben hat?","st":"Bana ne verdiğini gördün mü?","f":"lesen (okumak) · sehen (görmek) · vergessen (unutmak) · essen (yemek)"},{"w":"a – u – a","t":"Ablaut kalıbı","k":"fahren – fuhr – gefahren","c":"fährt – fuhr – ist gefahren","br":"Present’te a→ä olur (fährt, trägt, schläft). Üyeleri: tragen, schlagen, laden, wachsen, waschen, graben, einladen.","tr":"kalıp 8: gitmek, taşımak, yıkamak…","s":"Wir sind mit dem Auto gefahren und haben die Koffer selbst getragen.","st":"Arabayla gittik ve valizleri kendimiz taşıdık.","f":"tragen (taşımak) · einladen (davet etmek) · waschen (yıkamak) · wachsen (büyümek)"},{"w":"a – ie – a","t":"Ablaut kalıbı","k":"fallen – fiel – gefallen","c":"fällt – fiel – ist gefallen","br":"Partizip yine a’ya döner. Üyeleri: halten, lassen, schlafen, raten, blasen, gefallen. Bu kalıp sık kullanılan fiillerin çoğunu barındırır.","tr":"kalıp 9: düşmek, tutmak, uyumak…","s":"Das Bild ist von der Wand gefallen, während alle geschlafen haben.","st":"Herkes uyurken tablo duvardan düştü.","f":"halten (tutmak) · lassen (bırakmak) · schlafen (uyumak) · gefallen (hoşa gitmek)"},{"w":"Mischverben","t":"Karma fiiller","k":"zayıf ek + sesli değişimi","c":"bringt – brachte – hat gebracht","br":"Hem sesliyi değiştirir (güçlü gibi) hem -te/-t eki alır (zayıf gibi). Sekiz üyesi vardır: bringen, denken, kennen, nennen, rennen, brennen, senden, wenden.","tr":"karma grup: getirmek, düşünmek, tanımak…","s":"Ich habe lange nachgedacht und dir das Buch mitgebracht.","st":"Uzun düşündüm ve sana kitabı getirdim.","f":"denken (düşünmek) · kennen (tanımak) · nennen (adlandırmak) · rennen (koşmak)"},{"w":"Präsens: a→ä, e→i/ie","t":"Şimdiki zaman kuralı","k":"du/er biçiminde kök seslisi değişir","c":"fährst/fährt · gibst/gibt · siehst/sieht","br":"Değişim yalnızca du ve er/sie/es biçimlerinde olur; wir/ihr/sie değişmez. Modal fiiller ayrıdır: ich kann, ich muss (tekilde sesli değişir, çoğulda geri döner).","tr":"tekil 2. ve 3. kişide sesli değişimi","s":"Du fährst zu schnell und siehst die Schilder nicht.","st":"Çok hızlı gidiyorsun ve levhaları görmüyorsun.","f":"fahren (gitmek) · sehen (görmek) · nehmen (almak) · laufen (koşmak: läuft)"},{"w":"Perfekt: haben mi sein mi?","t":"Yardımcı fiil kuralı","k":"sein: yer/durum değişimi · haben: geri kalan hepsi","c":"ist gegangen / hat gearbeitet","br":"sein alan üç grup vardır: yer değiştirme (gehen, fahren, fliegen), durum değişimi (einschlafen, aufwachen, sterben, wachsen) ve üç istisna: sein, bleiben, werden. Nesnesi olan fiil daima haben alır.","tr":"Perfekt yardımcı fiilinin seçimi","s":"Ich bin nach Hause gegangen und habe sofort geschlafen.","st":"Eve gittim ve hemen uyudum.","f":"bleiben (kalmak: ist) · werden (olmak: ist) · einschlafen (uykuya dalmak: ist)"},{"w":"Partizip II: ge- kuralı","t":"Yapı kuralı","k":"ge + kök + t/en","c":"gemacht · gesehen · verstanden · studiert","br":"Zayıf fiil ge-…-t, güçlü fiil ge-…-en alır. ge- iki durumda DÜŞER: ayrılmayan ön ek varsa (verstehen → verstanden) ve fiil -ieren ile bitiyorsa (studieren → studiert).","tr":"üçüncü hâlin kuruluşu","s":"Ich habe alles verstanden und den Text schon korrigiert.","st":"Her şeyi anladım ve metni çoktan düzelttim.","f":"verstehen (anlamak) · korrigieren (düzeltmek) · bezahlen (ödemek: bezahlt)"},{"w":"Ayrılan fiilde ge- ortada","t":"Yapı kuralı","k":"ön ek + ge + kök + t/en","c":"aufgestanden · eingekauft · mitgebracht","br":"Ayrılan ön ek varsa ge- ön ekle kök arasına girer. Aynı mantık zu ile de işler: aufzustehen, einzukaufen — zu da tam o noktaya oturur.","tr":"ayrılan fiillerde ortaç ve zu","s":"Ich bin früh aufgestanden, um in Ruhe einzukaufen.","st":"Rahat alışveriş yapmak için erken kalktım.","f":"aufstehen (kalkmak) · einkaufen (alışveriş yapmak) · mitbringen (yanında getirmek)"}]},{"n":"Modal fiiller","e":"können, müssen, dürfen, sollen, wollen…","c":"#2f6b8f","g":"Dilbilgisi mantığı","cards":[{"w":"können","t":"Modalverb","k":"kennen ile ortak kök: bilmek → yapabilmek","c":"kann – konnte – hat gekonnt / können","br":"Kök „bilmek“tir: bir işi biliyorsan yapabilirsin. Üç yönü vardır: yetenek (Ich kann schwimmen), imkân (Heute kann ich nicht) ve izin (Kann ich kurz raus?) — sonuncusunda dürfen daha doğrudur ama konuşmada können yaygındır.","tr":"…ebilmek","s":"Ich kann heute leider nicht kommen.","st":"Bugün maalesef gelemiyorum.","f":"kennen (tanımak) · die Kenntnis (bilgi) · fähig sein (yetili olmak)"},{"w":"dürfen","t":"Modalverb","k":"eski: bir şeye ihtiyacı olmak → izinli olmak","c":"darf – durfte – hat gedurft / dürfen","br":"İzin fiilidir: kural ya da kişi izin veriyor mu? können yetenektir, dürfen izindir — bu ayrım tabelalarda görülür: Hier darf man nicht parken. Kibar rica biçimi Konjunktiv’dir: Dürfte ich Sie kurz stören?","tr":"…mesine izin olmak","s":"Hier darf man nicht rauchen.","st":"Burada sigara içilmez.","f":"die Erlaubnis (izin) · verboten (yasak) · zulässig (caiz)"},{"w":"müssen","t":"Modalverb","k":"eski: zorunda olmak, gerekmek","c":"muss – musste – hat gemusst / müssen","br":"Zorunluluk dıştan gelir: kural, durum ya da mantık. İkinci kullanımı çıkarımdır: Er muss krank sein (hasta olmalı) — burada zorunluluk değil, kesine yakın tahmin.","tr":"…mek zorunda olmak","s":"Ich muss noch zur Post, bevor sie schließt.","st":"Kapanmadan postaneye gitmem lazım.","f":"die Pflicht (zorunluluk) · notwendig (gerekli) · erforderlich (gerekli, resmî)"},{"w":"sollen","t":"Modalverb","k":"eski Schuld (borç) kökü: borçlu olmak","c":"soll – sollte – hat gesollt / sollen","br":"Zorunluluk burada başkasının iradesinden gelir: birinin isteğini aktarır. Üç kullanım: talimat (Ich soll das abgeben), tavsiye (Du solltest schlafen) ve söylenti (Er soll sehr streng sein — öyle deniyor).","tr":"…meli; …mesi isteniyor","s":"Ich soll dir Grüße von deiner Schwester ausrichten.","st":"Kız kardeşinden sana selam söylemem istendi.","f":"die Schuld (borç, kusur) · sollte (tavsiye) · angeblich (sözde)"},{"w":"wollen","t":"Modalverb","k":"Wille (irade) kökünden","c":"will – wollte – hat gewollt / wollen","br":"İrade fiilidir; kökünde der Wille vardır. Doğrudan söylenince sert durabilir, bu yüzden nezakette möchten kullanılır. İkinci kullanımı iddia aktarır: Er will nichts gewusst haben — bilmediğini iddia ediyor.","tr":"istemek","s":"Was willst du eigentlich damit sagen?","st":"Bununla aslında ne demek istiyorsun?","f":"der Wille (irade) · beabsichtigen (niyet etmek) · freiwillig (gönüllü)"},{"w":"mögen ↔ möchten","t":"Modalverb çifti","k":"mögen (hoşlanmak) → Konjunktiv möchte","c":"mag – mochte / möchte","br":"möchten aslında mögen’in Konjunktiv II biçimidir — yani „isterdim“. Bu yüzden nazik durur ve wollen’in kibar karşılığı olmuştur. mögen ise beğeniyi anlatır ve genelde nesneyle gelir: Ich mag Tee.","tr":"hoşlanmak ↔ istemek (nazik)","s":"Ich mag keinen Kaffee, ich möchte lieber Tee.","st":"Kahve sevmem, tercihen çay isterim.","f":"gefallen (hoşuna gitmek) · gern (severek) · der Wunsch (dilek)"},{"w":"nicht müssen ↔ nicht dürfen","t":"Olumsuzluk tuzağı","k":"zorunlu değil ↔ yasak","c":"—","br":"Türkçe konuşanın en pahalı hatası burada: nicht müssen „gerek yok“ demektir, nicht dürfen ise „yasak“. Du musst nicht kommen = gelmen şart değil. Du darfst nicht kommen = gelmen yasak. Aynı olumsuzluk, iki ayrı dünya.","tr":"gerek yok ↔ yasak","s":"Du musst nicht mitkommen — aber reingehen darfst du nicht.","st":"Gelmen şart değil — ama içeri girmen yasak.","f":"brauchen nicht zu (gerek yok) · verboten (yasak) · freiwillig (isteğe bağlı)"},{"w":"nicht brauchen … zu","t":"Kalıp","k":"brauchen (ihtiyaç duymak) + zu + mastar","c":"braucht – brauchte – hat gebraucht","br":"nicht müssen’in konuşma dilindeki karşılığı: Du brauchst nicht zu kommen. Kural: brauchen yalnızca olumsuz ya da nur ile modal gibi kullanılır — olumluda modal olmaz. Konuşmada zu sık düşer.","tr":"…mene gerek yok","s":"Du brauchst nicht extra anzurufen, eine Nachricht reicht.","st":"Ayrıca aramana gerek yok, bir mesaj yeter.","f":"brauchen (ihtiyaç duymak) · müssen (zorunda olmak) · nötig (gerekli)"},{"w":"lassen (yaptırmak)","t":"Modal benzeri fiil","k":"lassen (bırakmak) + mastar","c":"lässt – ließ – hat lassen","br":"İki işi vardır: izin vermek (Lass mich kurz reden) ve yaptırmak (Ich lasse das Auto reparieren — kendim tamir etmiyorum, tamir ettiriyorum). İkinci kullanım Türkçedeki ettirgen ekinin karşılığıdır.","tr":"bırakmak; …ettirmek","s":"Ich lasse die Heizung nächste Woche warten.","st":"Kaloriferin bakımını gelecek hafta yaptıracağım.","f":"sich lassen + Infinitiv (…ebilir) · loslassen (bırakıvermek) · verlassen (terk etmek)"},{"w":"Modalverben: tahmin ölçeği","t":"Kullanım kuralı","k":"muss > dürfte > kann > könnte","c":"—","br":"Modal fiiller ikinci bir işte de kullanılır: konuşanın ne kadar emin olduğunu göstermek. Sıra nettir: Er muss zu Hause sein (kesine yakın) > dürfte (muhtemelen) > kann (mümkün) > könnte (belki). Tek kelime, farklı kesinlik.","tr":"kesinlik derecesini bildirme","s":"Er dürfte längst zu Hause sein — sicher ist es nicht.","st":"Çoktan evde olmalı — ama kesin değil.","f":"wohl (herhâlde) · vermutlich (muhtemelen) · bestimmt (kesin)"},{"w":"sollte (tavsiye)","t":"Konjunktiv kullanımı","k":"sollen → sollte","c":"—","br":"Konjunktiv II biçimi tavsiyeye döner: Du solltest mehr schlafen. Emir değildir, öneridir — bu yüzden veli görüşmesinde ve karnede en sık kullanılan kiptir. Geçmiş hâli sitem taşır: Das hättest du sagen sollen.","tr":"…meli (tavsiye)","s":"Sie sollten das schriftlich festhalten.","st":"Bunu yazılı olarak kayda geçirmelisiniz.","f":"müssen (zorunluluk) · empfehlen (önermek) · besser wäre es (daha iyi olurdu)"},{"w":"wollen ↔ werden","t":"Karıştırılan çift","k":"wollen (irade) / werden (gelecek yardımcısı)","c":"—","br":"Türkçede ikisi de „-ecek“ gibi çevrilebilir ama Almanca ayırır: wollen niyettir, werden gelecek ya da tahmindir. Ich will anrufen = arama niyetim var; Ich werde anrufen = arayacağım.","tr":"istemek ↔ …ecek","s":"Ich will das klären — ich werde morgen anrufen.","st":"Bunu netleştirmek istiyorum — yarın arayacağım.","f":"die Absicht (niyet) · das Futur (gelecek zaman) · vorhaben (niyetinde olmak)"},{"w":"können ↔ kennen ↔ wissen","t":"Karıştırılan üçlü","k":"können (yapabilmek) / kennen (tanımak) / wissen (bilmek)","c":"—","br":"Türkçede üçü de „bilmek“le çevrilebilir: Ich kann Deutsch (dili kullanabiliyorum), Ich kenne ihn (onu tanıyorum), Ich weiß, dass … (şu olguyu biliyorum). Beceri, tanışıklık ve olgu — üç ayrı bilgi türü.","tr":"yapabilmek ↔ tanımak ↔ (olguyu) bilmek","s":"Ich kann Türkisch, ich kenne den Text, aber ich weiß nicht, wer ihn geschrieben hat.","st":"Türkçe biliyorum, metni tanıyorum ama kimin yazdığını bilmiyorum.","f":"die Fähigkeit (beceri) · die Kenntnis (aşinalık) · das Wissen (bilgi)"},{"w":"Modalverben: tekil çekimi","t":"Çekim kuralı","k":"tekilde sesli değişir, çoğulda geri döner","c":"ich kann – wir können · ich muss – wir müssen","br":"Modal fiillerin ich ve er biçimleri eksiz kalır ve kök seslisi değişir: ich kann, er kann (asla „er kannt“ değil). Çoğulda mastar sesli geri gelir. Tek istisna sollen: sesli hiç değişmez.","tr":"modal fiillerin çekim mantığı","s":"Ich muss noch arbeiten, aber wir müssen nicht lange bleiben.","st":"Daha çalışmam lazım ama uzun kalmamız gerekmiyor.","f":"der Umlaut (ünlü değişimi) · das Präteritum (geçmiş) · die Endung (ek)"}]},{"n":"Dilbilgisi tuzakları","e":"Dativ fiilleri, n-Deklination, sıfat ekleri, çoğul","c":"#8c4a6b","g":"Dilbilgisi mantığı","cards":[{"w":"Dativ fiilleri","t":"Rektion kuralı","k":"nesne Dativ alır, Akkusativ değil","c":"hilft mir · gehört dir · gefällt uns","br":"Mantığı: eylem nesneye yönelir ama onu değiştirmez — yardım edersin, kişi değişmez. Liste kısadır: helfen, danken, gehören, gefallen, passen, fehlen, begegnen, folgen, antworten, gratulieren, zuhören, vertrauen, schaden.","tr":"Dativ isteyen fiiller","s":"Kannst du mir kurz helfen? Das Regal gefällt mir nicht.","st":"Bana kısaca yardım eder misin? Bu raf hoşuma gitmedi.","f":"helfen (yardım etmek) · gefallen (hoşuna gitmek) · gehören (ait olmak) · fehlen (eksik olmak)"},{"w":"n-Deklination","t":"Çekim kuralı","k":"eril isim yalın dışında hep -n/-en alır","c":"der Junge – den Jungen – dem Jungen","br":"Kural: canlı varlık bildiren, -e ile biten eril isimler ve birkaç ek kelime. Üyeleri: Junge, Kollege, Kunde, Nachbar, Mensch, Student, Präsident, Herr (tekil -n, çoğul -en). İki özel: der Name ve das Herz Genitiv’de -ns alır.","tr":"zayıf eril isim çekimi","s":"Ich habe den Kollegen gefragt und dem Nachbarn Bescheid gesagt.","st":"Meslektaşa sordum ve komşuya haber verdim.","f":"der Kollege (meslektaş) · der Kunde (müşteri) · der Mensch (insan) · der Name (ad)"},{"w":"Sıfat ekleri: sinyal kuralı","t":"Çekim mantığı","k":"artikel sinyal veriyorsa sıfat -e/-en","c":"der gute Preis · ein guter Preis · guter Preis","br":"Tek soru: cins ve hâl bilgisini artikel taşıyor mu? Taşıyorsa sıfat rahatlar (-e ya da -en). Taşımıyorsa (ein, kein, artikelsiz) sıfat sinyali üstlenir ve der/die/das ekini alır: ein guter Mann, kaltes Wasser.","tr":"sıfat sonunun tek mantığı","s":"Das ist ein guter Plan — aber der gute Plan braucht Zeit.","st":"Bu iyi bir plan — ama o iyi plan zaman ister.","f":"der Artikel (tanımlık) · der Kasus (hâl) · unbestimmt (belirsiz)"},{"w":"Çoğul mantığı","t":"Yapı kuralı","k":"cinsiyet çoğulu büyük ölçüde belirler","c":"die Frauen · die Tische · die Bilder · die Autos","br":"Kaba ama işleyen kural: dişil isimlerin ~%90’ı -(e)n alır; eril ve nötr tek heceliler -e ve çoğu kez Umlaut alır; -er/-el/-en ile bitenler değişmez (der Lehrer → die Lehrer); yabancı kelimeler -s alır.","tr":"çoğul eki nasıl tahmin edilir","s":"Die Lehrer holen die Stühle, die Kinder bringen die Bücher.","st":"Öğretmenler sandalyeleri alıyor, çocuklar kitapları getiriyor.","f":"die Endung (ek) · der Umlaut (ünlü değişimi) · das Fremdwort (yabancı kelime)"},{"w":"die Verbklammer","t":"Cümle yapısı","k":"fiil ikinci sırada, ikinci parça en sonda","c":"—","br":"Almanca cümle bir parantez gibi çalışır: yardımcı ya da çekimli fiil ikinci sırada açar, mastar/ortaç/ayrılan ön ek en sonda kapatır. Cümlenin asıl bilgisi bu yüzden sona saklanır.","tr":"fiil parantezi","s":"Ich habe gestern Abend noch schnell die Wäsche aufgehängt.","st":"Dün akşam çabucak çamaşırları astım.","f":"das Mittelfeld (orta alan) · trennbar (ayrılabilir) · das Partizip (ortaç)"},{"w":"weil ↔ denn ↔ deshalb","t":"Bağlaç mantığı","k":"aynı anlam, üç farklı dizim","c":"—","br":"Üçü de sebep bildirir ama yapıyı farklı kurar: weil yan cümle açar (fiil sonda), denn iki ana cümleyi bağlar (dizim değişmez), deshalb zarftır (fiil hemen arkasından gelir). Anlamı değil, yeri seçersin.","tr":"çünkü / bu yüzden yapıları","s":"Ich bleibe zu Hause, weil ich müde bin. Ich bin müde, deshalb bleibe ich zu Hause.","st":"Evde kalıyorum çünkü yorgunum. Yorgunum, bu yüzden evde kalıyorum.","f":"weil (çünkü, fiil sonda) · denn (çünkü, düz dizim) · deshalb (bu yüzden, devrik)"},{"w":"Wechselpräpositionen","t":"Edat mantığı","k":"wohin? → Akkusativ · wo? → Dativ","c":"in die Schule ↔ in der Schule","br":"Dokuz edat iki hâl alır: in, an, auf, über, unter, vor, hinter, neben, zwischen. Hareket varsa Akkusativ, duruş varsa Dativ. Fiil çifti de bunu izler: legen/liegen, stellen/stehen, setzen/sitzen, hängen/hängen.","tr":"iki hâl alan edatlar","s":"Ich lege das Buch auf den Tisch; jetzt liegt es auf dem Tisch.","st":"Kitabı masaya koyuyorum; şimdi masanın üstünde duruyor.","f":"der Akkusativ (belirtme hâli) · der Dativ (yönelme hâli) · die Richtung (yön)"},{"w":"sich: Akkusativ mi Dativ mi?","t":"Refleksif mantığı","k":"başka nesne varsa sich → Dativ","c":"ich wasche mich ↔ ich wasche mir die Hände","br":"Kural tek cümlelik: cümlede başka bir Akkusativ nesne varsa refleksif zamir Dativ olur. mich/dich → mir/dir. Aynı mantık: ich merke mir das, ich kaufe mir etwas.","tr":"refleksif zamirin hâli","s":"Ich ziehe mich um und wasche mir noch schnell die Hände.","st":"Üstümü değiştiriyorum ve çabucak ellerimi yıkıyorum.","f":"sich merken (aklında tutmak) · sich vorstellen (hayal etmek) · reflexiv (dönüşlü)"},{"w":"nicht ↔ kein","t":"Olumsuzlama mantığı","k":"kein: isimden önce · nicht: geri kalan her şey","c":"kein Auto ↔ nicht schnell","br":"Belirsiz artikelli ya da artikelsiz isim kein alır; belirli artikelli isim, sıfat, fiil ve zarf nicht alır. nicht’in yeri: cümlenin sonuna yakın, ama fiilin ikinci parçasından ve sıfattan önce.","tr":"olumsuzlukta kein mi nicht mi","s":"Ich habe kein Auto und fahre nicht gern mit dem Bus.","st":"Arabam yok ve otobüsle gitmeyi sevmiyorum.","f":"die Verneinung (olumsuzlama) · gar nicht (hiç) · niemand (kimse)"},{"w":"zu + Infinitiv ne zaman?","t":"Yapı kuralı","k":"ikinci fiil zu alır — modal fiillerden sonra almaz","c":"Ich versuche zu kommen. ↔ Ich kann kommen.","br":"Modal fiiller, werden, sehen, hören, lassen, gehen zu almaz. Onun dışında bir fiil ikinci fiil alıyorsa zu gelir: versuchen, versprechen, vergessen, anfangen, aufhören, vorhaben.","tr":"mastarda zu kuralı","s":"Ich habe vergessen, dir zu schreiben, aber ich wollte dich anrufen.","st":"Sana yazmayı unuttum ama seni aramak istiyordum.","f":"vorhaben (niyetinde olmak) · aufhören (bırakmak) · anfangen (başlamak)"},{"w":"es: üç ayrı iş","t":"Zamir mantığı","k":"hava/zaman · es gibt · kalıp özne","c":"—","br":"es üç işi görür: doğa olayları (es regnet, es ist kalt), varlık kalıbı (es gibt + Akkusativ) ve cümleyi başlatan kukla özne (es geht um, es handelt sich um, es fehlt an).","tr":"es’in kullanım alanları","s":"Es regnet, und in der Küche gibt es nichts mehr zu essen.","st":"Yağmur yağıyor ve mutfakta yiyecek hiçbir şey kalmamış.","f":"es gibt (vardır) · es geht um (konu şudur) · es fehlt an (eksik)"},{"w":"Modalverben im Perfekt","t":"Yapı kuralı","k":"haben + mastar + mastar (çift mastar)","c":"hat arbeiten müssen","br":"Modal fiilin yanında ikinci fiil varsa Partizip yerine mastar kullanılır: Ich habe arbeiten müssen — gemusst değil. Yalnız başına ise normal ortaç alır: Ich habe es nicht gekonnt.","tr":"modal fiillerde çift mastar","s":"Am Wochenende habe ich leider arbeiten müssen.","st":"Hafta sonu maalesef çalışmak zorunda kaldım.","f":"müssen (zorunda olmak) · können (yapabilmek) · der Infinitiv (mastar)"},{"w":"Genitiv → von + Dativ","t":"Kullanım mantığı","k":"konuşma dilinde Genitiv von’a döner","c":"das Auto meines Bruders → von meinem Bruder","br":"Genitiv yazı dilinde yaşar, konuşmada büyük ölçüde von + Dativ’e bırakır. İsimlerde ise -s hem yazıda hem konuşmada kalır: Hacis Auto, Annas Buch.","tr":"tamlamada Genitiv ve von","s":"Das ist das Fahrrad von meinem Bruder.","st":"Bu, kardeşimin bisikleti.","f":"der Genitiv (tamlayan hâli) · von (…nın) · gehören (ait olmak)"},{"w":"Fragewort ya da doğrudan soru","t":"Soru mantığı","k":"W-Frage: soru kelimesi + fiil · Ja/Nein: fiil başta","c":"Wann kommst du? ↔ Kommst du?","br":"Soru kelimesi varsa o birinci, fiil ikinci sırada. Yoksa fiil doğrudan başa geçer. Yan cümlede ise soru kelimesi bağlaç olur ve fiil sona gider: Ich weiß nicht, wann er kommt.","tr":"soru cümlesi dizimi","s":"Weißt du, wann der Zug kommt? — Kommt er überhaupt heute?","st":"Trenin ne zaman geleceğini biliyor musun? — Bugün geliyor mu ki?","f":"die W-Frage (soru kelimeli soru) · der Nebensatz (yan cümle) · ob (…ıp ımadığı)"}]},{"n":"Zaman ve çatı mantığı","e":"Perfekt, Passiv, Partizip — kuralın arkasındaki fikir","c":"#4a5d8f","g":"Dilbilgisi mantığı","cards":[{"w":"das Perfekt ↔ das Präteritum","t":"Dilbilgisi mantığı","k":"haben/sein + Partizip II ↔ tek kelimelik geçmiş","c":"hat gemacht ↔ machte","br":"Fark zaman değil, ortamdır: Perfekt konuşma dilinin geçmişidir, Präteritum yazı dilinin. İstisna: sein, haben ve modal fiiller konuşurken de Präteritum kullanır (war, hatte, musste).","tr":"konuşma geçmişi ↔ yazı geçmişi","s":"Gestern habe ich den Antrag abgeschickt — im Bericht steht: Der Antrag ging gestern ein.","st":"Dün başvuruyu gönderdim — raporda ise: başvuru dün ulaştı.","f":"das Partizip II (üçüncü hâl) · die Erzählzeit (anlatı zamanı) · mündlich (sözlü)"},{"w":"das Plusquamperfekt","t":"Dilbilgisi mantığı","k":"hatte/war + Partizip II","c":"hatte gemacht – war gegangen","br":"„Geçmişin geçmişi“: iki olay da olmuşsa, önce olanı bu kip işaretler. Genelde nachdem ile birlikte çalışır: nachdem + Plusquamperfekt, ana cümle Präteritum.","tr":"miş’li geçmişin öncesi","s":"Nachdem alle gegangen waren, habe ich aufgeräumt.","st":"Herkes gittikten sonra toparladım.","f":"nachdem (…dıktan sonra) · vorher (önce) · das Perfekt (geçmiş)"},{"w":"das Vorgangspassiv","t":"Dilbilgisi mantığı","k":"werden + Partizip II","c":"wird geprüft – wurde geprüft – ist geprüft worden","br":"Etken cümlede fail önemlidir; edilgen cümlede iş önemlidir. Almanca resmî dili bu yüzden edilgen sever: kim yaptığı değil, ne yapıldığı yazılır.","tr":"süreç edilgeni (yapılıyor)","s":"Der Antrag wird derzeit geprüft.","st":"Başvuru şu anda inceleniyor.","f":"werden (olmak; edilgen yardımcısı) · von + Dativ (fail) · durch + Akkusativ (araç)"},{"w":"das Zustandspassiv","t":"Dilbilgisi mantığı","k":"sein + Partizip II","c":"ist geprüft – war geprüft","br":"werden süreci, sein sonucu anlatır: „inceleniyor“ ile „incelenmiş durumda“ farkı. Tek yardımcı fiil değişikliği, tamamen başka bilgi.","tr":"durum edilgeni (yapılmış hâlde)","s":"Der Antrag ist bereits geprüft.","st":"Başvuru çoktan incelenmiş durumda.","f":"sein (olmak) · geprüft (incelenmiş) · abgeschlossen (tamamlanmış)"},{"w":"sich lassen + Infinitiv","t":"Kalıp (edilgen yerine)","k":"lassen (bırakmak) + mastar","c":"lässt sich – ließ sich – hat lassen","br":"„Kendini yapılmaya bırakıyor“ = yapılabilir. kann … werden yerine kullanılan zarif kısayol; yazı dilinde çok yaygın.","tr":"…ebilir (edilgen imkân)","s":"Der Fehler lässt sich leicht beheben.","st":"Hata kolayca giderilebilir.","f":"lassen (bırakmak) · behebbar (giderilebilir) · man kann (…yapılabilir)"},{"w":"sein + zu + Infinitiv","t":"Kalıp (edilgen yerine)","k":"sein + zu + mastar","c":"ist zu prüfen – war zu prüfen","br":"Bağlama göre iki anlam: zorunluluk (muss geprüft werden) ya da imkân (kann geprüft werden). Resmî metinlerin en sık kısayolu; genelde zorunluluk okunur.","tr":"…melidir / …ebilir","s":"Die Unterlagen sind bis Freitag einzureichen.","st":"Belgeler cumaya kadar sunulmalıdır.","f":"müssen (zorunda olmak) · einzureichen (sunulacak) · das Gerundivum (zorunluluk sıfatı)"},{"w":"man","t":"Pronomen (edilgen yerine)","k":"Mann (insan) kökünden, ama kişi belirtmez","c":"—","br":"Faili gizlemenin en kolay yolu. Türkçedeki edilgen ekiyle aynı işi görür: „yapılır“ = man macht. Akkusativ: einen, Dativ: einem.","tr":"(belirsiz özne) …ılır","s":"Das darf man nicht verallgemeinern.","st":"Bu genelleştirilmemeli.","f":"jemand (biri) · niemand (kimse) · einem (Dativ hâli)"},{"w":"das Partizip I","t":"Dilbilgisi mantığı","k":"Infinitiv + d","c":"laufend, steigend, wachsend","br":"Etken ve eşzamanlı: „…makta olan“. steigende Kosten = artmakta olan masraflar. Partizip II ise edilgen ve tamamlanmıştır: gestiegene Kosten = artmış masraflar.","tr":"…en, …makta olan (etken ortaç)","s":"Bei laufendem Verfahren geben wir keine Auskunft.","st":"Süreç devam ederken bilgi vermiyoruz.","f":"laufend (süregelen) · das Partizip II (edilgen ortaç) · gleichzeitig (eşzamanlı)"},{"w":"das erweiterte Partizip","t":"Dilbilgisi mantığı","k":"artikel + uzun niteleme + Partizip + isim","c":"—","br":"Yan cümle sıfata sıkıştırılır: die im Mai eingereichten Unterlagen = mayısta sunulan belgeler. Çözme yolu: sondan başla, ortacı fiile çevir, ilgi cümlesi kur.","tr":"genişletilmiş ortaç yapısı","s":"Die gestern von dir gekaufte Milch ist schon sauer.","st":"Dün senin aldığın süt çoktan ekşimiş.","f":"der Relativsatz (ilgi cümlesi) · das Partizip II (ortaç) · die Amtssprache (resmî dil)"},{"w":"das Futur II","t":"Dilbilgisi mantığı","k":"werden + Partizip II + haben/sein","c":"wird geprüft haben","br":"„Gelecekte tamamlanmış olacak“ ya da geçmişe dair güçlü tahmin: Er wird es vergessen haben = herhâlde unutmuştur. İkinci kullanım günlükte daha sıktır.","tr":"…mış olacak; …mıştır herhâlde","s":"Bis heute Abend wird er es geschafft haben.","st":"Bu akşama kadar bitirmiş olur.","f":"wohl (herhâlde) · vermutlich (muhtemelen) · das Futur I (gelecek zaman)"},{"w":"werden: üç ayrı iş","t":"Dilbilgisi mantığı","k":"werden = olmak / gelecek / edilgen","c":"wird – wurde – ist geworden / worden","br":"Tek fiil üç iş yapar: tam fiil (Lehrer werden), gelecek yardımcısı (wird kommen), edilgen yardımcısı (wird geprüft). Partizip farkı ayırır: geworden (tam fiil) ↔ worden (edilgen).","tr":"olmak / gelecek / edilgen yardımcısı","s":"Er ist Lehrer geworden; der Antrag ist geprüft worden.","st":"Öğretmen oldu; başvuru incelendi.","f":"geworden (olmuş) · worden (edilgen ortağı) · bekommen (almak)"},{"w":"der Konjunktiv I ↔ II","t":"Dilbilgisi mantığı","k":"sei/habe ↔ wäre/hätte","c":"—","br":"Konjunktiv I aktarır (o söyledi, ben üstlenmiyorum), Konjunktiv II gerçek dışını kurar (öyle olsaydı). Biri mesafe, öbürü varsayım işaretidir.","tr":"aktarım kipi ↔ gerçek dışı kip","s":"Er sagt, er sei krank gewesen — wäre er gesund, hätte er teilgenommen.","st":"Hasta olduğunu söylüyor — sağlıklı olsaydı katılırdı.","f":"die indirekte Rede (dolaylı anlatım) · irreal (gerçek dışı) · angeblich (sözde)"},{"w":"die Nominalisierung","t":"Dilbilgisi mantığı","k":"fiil ya da sıfat → isim","c":"—","br":"Almanca resmî dili fiili isme çevirir: prüfen → die Prüfung; bu, cümleyi sıkıştırır ve faili gizler. Anlamak için ters işlemi yap: ismi tekrar fiile çevir.","tr":"isimleştirme (resmî dilin motoru)","s":"Nach dem Essen gehen wir spazieren.","st":"Yemekten sonra yürüyüşe çıkıyoruz.","f":"das Verb (fiil) · die Verbalisierung (fiilleştirme) · der Nominalstil (isim ağırlıklı üslup)"},{"w":"die Wortstellung: TeKaMoLo","t":"Dilbilgisi mantığı","k":"Temporal – Kausal – Modal – Lokal","c":"—","br":"Ortadaki zarfların sırası: önce ne zaman, sonra neden, sonra nasıl, en sonda nerede. Kural değil, güvenli varsayılan sıralamadır; vurgu değişince sıra da değişebilir.","tr":"zaman – sebep – tarz – yer sıralaması","s":"Ich fahre morgen wegen eines Termins mit dem Zug nach Köln.","st":"Yarın bir randevu nedeniyle trenle Köln’e gidiyorum.","f":"die Wortstellung (kelime sırası) · das Mittelfeld (orta alan) · die Betonung (vurgu)"}]},{"n":"es- kalıpları","e":"es gibt, es klappt, es lohnt sich, es reicht…","c":"#4a7a8a","g":"Dilbilgisi mantığı","cards":[{"w":"es gibt (+ Akkusativ)","t":"Kalıp","k":"geben (vermek) + es","c":"es gibt – es gab – es hat gegeben","br":"Kelimesi kelimesine „o veriyor“: varlığı anlatmanın Almanca yolu. Daima es ile ve daima Akkusativ ile gelir — bu yüzden Es gibt einen Fehler, „ein Fehler“ değil. Türkçedeki „var“ karşılığıdır.","tr":"var(dır)","s":"Gibt es hier in der Nähe eine Apotheke?","st":"Buralarda yakında eczane var mı?","f":"vorhanden (mevcut) · existieren (var olmak) · bestehen (var olmak, resmî)"},{"w":"es geht mir gut / es geht um","t":"Kalıp","k":"gehen (gitmek) + es","c":"es geht – es ging – es ist gegangen","br":"gehen burada „yürümek“ değil „işlemek“tir. Üç kalıp: es geht mir gut (hâlim iyi — Dativ), es geht um (konu şudur), es geht nicht (olmuyor). Üçü de „yürüyüş“ imgesinden çıkar.","tr":"hâlim …; konu …","s":"Mir geht es gut, danke — worum geht es denn?","st":"İyiyim, teşekkürler — konu nedir peki?","f":"das Anliegen (mesele) · sich handeln um (söz konusu olmak) · funktionieren (işlemek)"},{"w":"es klappt","t":"Kalıp","k":"klappen (kapak sesi çıkarmak → oturmak)","c":"klappt – klappte – hat geklappt","br":"klappen aslında bir kapağın tam oturmasıdır; o „tık“ sesi işin yolunda gitmesine dönüşmüş. Günlük dilde funktionieren’in yerine geçer ve daha sıcaktır: Hat es geklappt?","tr":"oldu, yolunda gitti","s":"Hoffentlich klappt es diesmal mit dem Termin.","st":"Umarım bu sefer randevu işi olur.","f":"funktionieren (çalışmak) · gelingen (başarıyla sonuçlanmak) · scheitern (başarısız olmak)"},{"w":"es lohnt sich","t":"Kalıp","k":"Lohn (ücret, karşılık) + sich","c":"lohnt – lohnte – hat gelohnt","br":"der Lohn emeğin karşılığıdır: „karşılığını veriyor“ = değer. Karar cümlelerinin kelimesidir: Lohnt sich das? Olumsuzu net bir tavsiyedir: Das lohnt sich nicht.","tr":"değer, zahmetine değer","s":"Für zwei Tage lohnt sich die weite Fahrt nicht.","st":"İki gün için o uzun yol zahmetine değmez.","f":"der Lohn (ücret) · sich rentieren (kârlı olmak) · der Aufwand (emek, masraf)"},{"w":"es reicht (mir)","t":"Kalıp","k":"reichen (uzanmak, yetmek)","c":"reicht – reichte – hat gereicht","br":"reichen gereken sınıra uzanmaktır: yetmek. Dativ ile duygusal anlam kazanır: Mir reicht’s — sabrım tükendi. Aynı fiilden ausreichen (yeterli olmak) ve die Reichweite (erim).","tr":"yeter; (Dativ ile) bıktım","s":"Eine Stunde reicht völlig — und langsam reicht es mir.","st":"Bir saat fazlasıyla yeter — ve artık bana yetti.","f":"ausreichen (yetmek) · genug (yeterli) · die Geduld (sabır)"},{"w":"es passt (mir)","t":"Kalıp","k":"passen (uymak) + Dativ","c":"passt – passte – hat gepasst","br":"Üç alanda çalışır: kıyafet bedene uyar, randevu programa uyar, insanlar birbirine uyar. Dativ nesne alır: Passt es dir am Freitag? Reddi de kalıptır: Das passt mir gerade gar nicht.","tr":"uyuyor, uygun","s":"Passt es Ihnen am Dienstag um zehn?","st":"Salı saat on size uyar mı?","f":"anpassen (uyarlamak) · unpassend (uygunsuz) · der Termin (randevu)"},{"w":"es eilt / es hat Zeit","t":"Karşıt kalıplar","k":"eilen (acele etmek) / Zeit haben","c":"—","br":"Aciliyetin iki ucu: Es eilt (acele var) ↔ Das hat Zeit (acelesi yok). Kişi için farklı kurulur: Ich bin in Eile. Sıfatı eilig; kargoda die Eilsendung.","tr":"acele var ↔ acelesi yok","s":"Es eilt nicht — das hat bis nächste Woche Zeit.","st":"Acelesi yok — gelecek haftaya kadar bekler.","f":"eilig (acele) · dringend (ivedi) · die Eile (acele)"},{"w":"es macht nichts","t":"Kalıp","k":"machen + nichts","c":"—","br":"„Bir şey yapmıyor“ = önemi yok. Özür alan tarafın standart cevabıdır. Yakınları: kein Problem, halb so wild, passt schon. Karşıtı: Das macht viel aus (bu çok fark eder).","tr":"önemli değil, zararı yok","s":"Entschuldigung, ich habe es vergessen! — Macht nichts.","st":"Kusura bakma, unuttum! — Önemli değil.","f":"ausmachen (fark etmek) · egal (fark etmez) · kein Problem (sorun değil)"},{"w":"es stimmt","t":"Kalıp","k":"stimmen (uyuşmak, doğru olmak)","c":"stimmt – stimmte – hat gestimmt","br":"Kök die Stimme (ses): sesler uyuşuyorsa doğrudur. Hesapta da kullanılır: Die Rechnung stimmt nicht. Kasada ise bahşiş kalıbıdır: Stimmt so.","tr":"doğru, tutuyor","s":"Die Zahlen stimmen nicht — da fehlt eine Position.","st":"Rakamlar tutmuyor — bir kalem eksik.","f":"die Stimme (ses) · zustimmen (onaylamak) · abstimmen (oylamak)"},{"w":"es fällt mir schwer / leicht","t":"Kalıp","k":"fallen (düşmek) + Dativ + schwer/leicht","c":"—","br":"Kelimesi kelimesine „bana ağır düşüyor“: zorlanmayı kişiye değil işe yükler. Bu yüzden itiraf cümlesi olarak nazik durur: Es fällt mir schwer, Nein zu sagen.","tr":"bana zor / kolay geliyor","s":"Es fällt mir schwer, das jetzt zu entscheiden.","st":"Bunu şimdi karara bağlamak bana zor geliyor.","f":"schwerfallen (zor gelmek) · leichtfallen (kolay gelmek) · die Schwierigkeit (zorluk)"},{"w":"es kommt vor, dass …","t":"Kalıp","k":"vorkommen (rastlanmak)","c":"—","br":"Bir şeyin ara sıra olduğunu bildirir: „olur öyle“. Sıklık zarfıyla ölçülür: Das kommt selten / immer wieder vor. Dativ eklenirse algı bildirir: Das kommt mir bekannt vor.","tr":"olur, rastlanır","s":"Es kommt vor, dass die Post zwei Tage braucht.","st":"Postanın iki gün sürdüğü oluyor.","f":"vorkommen (olmak; …gibi gelmek) · passieren (olmak) · gelegentlich (ara sıra)"},{"w":"es hängt davon ab","t":"Kalıp","k":"abhängen von (bağlı olmak)","c":"—","br":"Kararı koşula bağlar. Devamı genelde ob ile gelir: Es hängt davon ab, ob es regnet. Konuşma dilindeki kısa hâli ayrı bir kalıptır: Kommt drauf an.","tr":"şuna bağlı","s":"Es hängt davon ab, wie viel Zeit wir noch haben.","st":"Ne kadar vaktimiz kaldığına bağlı.","f":"abhängig (bağlı) · je nachdem (duruma göre) · die Bedingung (koşul)"},{"w":"es sieht so aus, als ob …","t":"Kalıp","k":"aussehen (görünmek) + als ob","c":"—","br":"Görünüşe dayalı tahmin kurar ve als ob Konjunktiv II ister. Kısa biçimi: Es sieht ganz danach aus. Yakın kalıp: Es scheint, als …","tr":"öyle görünüyor ki …","s":"Es sieht so aus, als ob wir früher fertig wären.","st":"Görünüşe göre erken bitireceğiz.","f":"scheinen (görünmek) · anscheinend (görünüşe göre) · der Anschein (görüntü)"},{"w":"es bleibt dabei","t":"Kalıp","k":"bleiben (kalmak) + dabei","c":"—","br":"Kararın değişmediğini bildirir: „öyle kalıyor“. Görüşme kapanışında teyit olarak kullanılır. Karşıtı: Wir ändern das noch. Yakını: Damit ist es beschlossen.","tr":"öyle kalıyor, karar bu","s":"Es bleibt dabei: Wir treffen uns Freitag um vier.","st":"Karar bu: cuma dörtte buluşuyoruz.","f":"dabei bleiben (kararında kalmak) · endgültig (nihai) · vereinbart (kararlaştırılmış)"}]},{"n":"Yan cümle ve bağlaç mantığı","e":"als/wenn/wann, um…zu, als ob, obwohl…","c":"#476b9c","g":"Dilbilgisi mantığı","cards":[{"w":"als ↔ wenn ↔ wann","t":"Bağlaç ayrımı","k":"als (geçmişte bir kez) · wenn (tekrar/koşul) · wann (soru)","c":"—","br":"Türkçede üçü de „…dığında“. Almanca ayırır: geçmişte tek seferlik olay als, tekrarlanan ya da gelecek olan wenn, soru ise wann. Tek kelimelik hata en sık burada olur.","tr":"…dığında (tek sefer / tekrar) / ne zaman","s":"Als ich klein war, sind wir jeden Sommer ans Meer gefahren; wenn wir jetzt fahren, dann nur kurz.","st":"Küçükken her yaz denize giderdik; şimdi gidersek yalnızca kısa süre.","f":"als (…dığında, geçmiş) · wenn (…ise) · wann (ne zaman)"},{"w":"ob","t":"Bağlaç","k":"dolaylı evet/hayır sorusu","c":"—","br":"Soru kelimesi olmayan soru yan cümleye girerken ob alır: „…ıp ımadığı“. wenn ile karıştırma — wenn koşuldur, ob sorudur.","tr":"…ıp ımadığı","s":"Ich weiß nicht, ob er heute noch kommt.","st":"Bugün gelip gelmeyeceğini bilmiyorum.","f":"die indirekte Frage (dolaylı soru) · wenn (…ise) · fragen (sormak)"},{"w":"um … zu ↔ damit","t":"Amaç bağlacı","k":"um…zu (özne aynı) · damit (özne farklı)","c":"—","br":"Kural tek satır: iki cümlenin öznesi aynıysa um … zu, farklıysa damit. Almanca bunu zorunlu tutar; Türkçede ikisi de „…sın diye“.","tr":"…mek için / …sın diye","s":"Ich stehe früh auf, um in Ruhe zu frühstücken — und damit die Kinder pünktlich rauskommen.","st":"Rahat kahvaltı etmek için erken kalkıyorum — ve çocuklar zamanında çıksın diye.","f":"das Ziel (amaç) · zu + Infinitiv (mastar) · der Zweck (amaç)"},{"w":"ohne … zu ↔ statt … zu","t":"Mastar kalıpları","k":"ohne (…meden) · statt (…yerine)","c":"—","br":"um … zu ile aynı ailedendir ve aynı şartı taşır: özne aynı olmalı. Farklıysa ohne dass / statt dass kullanılır.","tr":"…meden / …ecek yerde","s":"Er ist gegangen, ohne sich zu verabschieden, statt kurz Bescheid zu sagen.","st":"Kısaca haber verecek yerde vedalaşmadan gitti.","f":"sich verabschieden (vedalaşmak) · anstatt (yerine) · ohne (…siz)"},{"w":"obwohl ↔ trotzdem","t":"Karşıtlık","k":"obwohl (bağlaç, fiil sonda) · trotzdem (zarf, fiil ikinci)","c":"—","br":"Aynı anlamı iki farklı dizimle kurarlar; weil ↔ deshalb çiftiyle birebir aynı mantık. Anlamı değil, cümledeki yeri seçersin.","tr":"…mesine rağmen / buna rağmen","s":"Obwohl es geregnet hat, sind wir gelaufen. Es hat geregnet, trotzdem sind wir gelaufen.","st":"Yağmur yağmasına rağmen yürüdük. Yağmur yağdı, buna rağmen yürüdük.","f":"trotz (rağmen, Genitiv) · dennoch (yine de) · zwar … aber (gerçi …ama)"},{"w":"als ob + Konjunktiv II","t":"Gerçek dışı karşılaştırma","k":"als ob (…mış gibi)","c":"—","br":"Gerçek olmayan benzetme, bu yüzden Konjunktiv II ister. Kısa biçiminde ob düşer ve fiil hemen als’ın arkasına geçer: Er tut, als wüsste er alles.","tr":"…mış gibi","s":"Er tut so, als ob er nichts gewusst hätte.","st":"Hiçbir şey bilmiyormuş gibi davranıyor.","f":"so tun als ob (…mış gibi yapmak) · der Konjunktiv II (gerçek dışı kip) · scheinbar (görünüşte)"},{"w":"seit ↔ seitdem ↔ vor","t":"Zaman ayrımı","k":"seit (süregelen) · vor (bitmiş) · seitdem (bağlaç)","c":"—","br":"seit hâlâ süren zamanı ölçer ve Präsens ister: Ich wohne seit drei Jahren hier. vor bitmiş bir anı gösterir ve Perfekt alır: Ich bin vor drei Jahren umgezogen. Türkçede ikisi de „üç yıl önce/üç yıldır“.","tr":"…den beri / …önce","s":"Ich wohne seit drei Jahren in Alsdorf; vor drei Jahren bin ich hierhergezogen.","st":"Üç yıldır Alsdorf’ta oturuyorum; üç yıl önce buraya taşındım.","f":"seitdem (o zamandan beri) · seither (o günden bu yana) · vorher (önce)"},{"w":"bevor ↔ nachdem","t":"Zaman bağlacı","k":"bevor (önce) · nachdem (sonra)","c":"—","br":"nachdem zaman kaymasını zorunlu kılar: yan cümle bir kademe geride olur (Plusquamperfekt + Präteritum ya da Perfekt + Präsens). bevor’da böyle bir zorunluluk yoktur.","tr":"…meden önce / …dıktan sonra","s":"Nachdem ich gegessen hatte, ging ich raus — aber bevor ich gehe, räume ich auf.","st":"Yemek yedikten sonra dışarı çıktım — ama gitmeden önce toparlarım.","f":"das Plusquamperfekt (geçmişin geçmişi) · danach (ondan sonra) · zuvor (önceden)"},{"w":"während","t":"Bağlaç + edat","k":"während (…iken; …sırasında)","c":"—","br":"İki iş görür: eşzamanlılık (…iken) ve karşıtlık (oysa). Edat olarak Genitiv alır: während der Ferien. Bağlamdan hangi anlam olduğu anlaşılır.","tr":"…iken; …sırasında; oysa","s":"Während ich koche, macht sie die Hausaufgaben.","st":"Ben yemek yaparken o ödevlerini yapıyor.","f":"gleichzeitig (aynı anda) · hingegen (buna karşılık) · dabei (bu sırada)"},{"w":"der Relativsatz","t":"Cümle yapısı","k":"ilgi zamiri = artikel biçimi, fiil sonda","c":"der/die/das · dem/den · dessen/deren","br":"İlgi zamirinin CİNSİ önceki isimden, HÂLİ ise kendi cümlesindeki görevinden gelir. İki ayrı soru, iki ayrı kaynak — kural bu kadar.","tr":"…en, …dığı (ilgi cümlesi)","s":"Der Kollege, dem ich das Buch geliehen habe, ist heute krank.","st":"Kitabı ödünç verdiğim meslektaş bugün hasta.","f":"das Relativpronomen (ilgi zamiri) · der Bezug (gönderme) · dessen (onun, eril)"},{"w":"entweder … oder / weder … noch","t":"İkili bağlaçlar","k":"ya … ya / ne … ne","c":"—","br":"weder … noch zaten olumsuzdur, ayrıca nicht almaz. sowohl … als auch ise iki tarafı da olumlar: hem … hem.","tr":"ya … ya / ne … ne","s":"Entweder rufst du an oder du schreibst — weder das eine noch das andere ist passiert.","st":"Ya ararsın ya yazarsın — ne biri ne öbürü oldu.","f":"sowohl … als auch (hem …hem) · nicht nur … sondern auch (yalnızca …değil, ayrıca)"},{"w":"falls ↔ wenn ↔ sofern","t":"Koşul bağlaçları","k":"falls (ihtimal) · wenn (koşul/tekrar) · sofern (…olduğu ölçüde)","c":"—","br":"falls ihtimali vurgular („şayet“), wenn nötr koşuldur, sofern resmî sınırlama koyar. Üçünde de fiil sonda; wenn atılırsa fiil başa geçer: Sollte es regnen, …","tr":"şayet / …ise / …olduğu sürece","s":"Falls du keine Zeit hast, verschieben wir es einfach.","st":"Şayet vaktin yoksa, öylece erteleriz.","f":"sofern (…olduğu ölçüde) · andernfalls (aksi hâlde) · die Bedingung (koşul)"},{"w":"indem","t":"Bağlaç","k":"in + dem → „şunu yaparak“","c":"—","br":"Yöntemi anlatır: nasıl? Türkçedeki „-arak/-erek“ ekiyle birebir aynı iş. Sık karıştırılan yakını dadurch, dass — o sebebi vurgular.","tr":"…arak, …erek","s":"Man spart Heizkosten, indem man richtig lüftet.","st":"Doğru havalandırarak ısıtma masrafından tasarruf edilir.","f":"dadurch, dass (…yoluyla) · die Methode (yöntem) · so (böylece)"},{"w":"je nachdem, ob/wie","t":"Kalıp","k":"je + nachdem + dolaylı soru","c":"—","br":"„Duruma göre“ diyerek cevabı koşula bağlar. Tek başına da cevap olarak kullanılır: Je nachdem. — Duruma göre.","tr":"…e göre değişir, duruma göre","s":"Je nachdem, wie das Wetter wird, grillen wir oder bleiben drinnen.","st":"Havanın durumuna göre ya mangal yaparız ya içeride kalırız.","f":"je nach (…göre) · abhängen von (…e bağlı) · unterschiedlich (değişken)"}]},{"n":"Bağlaçlar: dizim ve kullanım","e":"aber/sondern, sobald, sodass, zumal, wobei…","c":"#5f6b2f","g":"Dilbilgisi mantığı","cards":[{"w":"aber ↔ sondern","t":"Bağlaç çifti","k":"aber (ama) / sondern (aksine)","c":"—","br":"sondern yalnızca olumsuz bir cümleden sonra gelir ve yanlış olanın yerine doğrusunu koyar: nicht A, sondern B. aber ise sınırlama getirir ve olumlu cümleden sonra da gelir. Türkçede ikisi de „ama“ olduğu için sürekli karışır.","tr":"ama ↔ aksine, bilakis","s":"Das ist kein Fehler, sondern Absicht — aber trotzdem unglücklich.","st":"Bu hata değil, kasıt — ama yine de talihsiz.","f":"nicht … sondern (…değil …) · jedoch (ancak) · dennoch (yine de)"},{"w":"und / oder / sowie","t":"Bağlama","k":"und (ve) / oder (veya) / sowie (ve ayrıca)","c":"—","char":"","br":"Üçü de aynı düzeydeki öğeleri bağlar ve dizimi değiştirmez (Position 0). sowie yazı dilinde listenin son öğesini ekler: Unterlagen, Belege sowie eine Kopie des Ausweises. beziehungsweise (bzw.) ise „ya da, sırasıyla“ demektir.","tr":"ve / veya / ve ayrıca","s":"Bitte bringen Sie den Ausweis sowie eine aktuelle Bescheinigung mit.","st":"Lütfen kimliği ve ayrıca güncel bir belgeyi getirin.","f":"beziehungsweise (ya da) · außerdem (ayrıca) · ebenso (aynı şekilde)"},{"w":"sobald ↔ solange","t":"Zaman bağlacı çifti","k":"so + bald (yakında) / so + lange (uzun)","c":"—","br":"sobald bir anı işaretler: o olur olmaz. solange ise süre boyunca geçerliliği: o sürdüğü müddetçe. İkisinde de fiil sona gider. Koşul tonu taşırlar: Solange du krank bist, bleib zu Hause.","tr":"…ır ımaz ↔ …dığı sürece","s":"Sobald der Bescheid da ist, melde ich mich — solange warte ich ab.","st":"Karar gelir gelmez haber veririm — o zamana kadar bekliyorum.","f":"sofort (derhal) · während (…iken) · bis (…e kadar)"},{"w":"sodass","t":"Sonuç bağlacı","k":"so + dass","c":"—","br":"Sonucu bildirir: öyle oldu ki. damit amacı bildirir (niyet), sodass sonucu (netice). Ayrık yazılırsa vurgu değişir: so laut, dass … — „o kadar yüksek sesli ki“.","tr":"…öyle ki, dolayısıyla","s":"Der Bus hatte Verspätung, sodass wir den Anschluss verpasst haben.","st":"Otobüs gecikti, dolayısıyla aktarmayı kaçırdık.","f":"damit (…sın diye) · folglich (dolayısıyla) · die Folge (sonuç)"},{"w":"damit ↔ sodass","t":"Amaç ↔ sonuç","k":"damit (niyet) / sodass (netice)","c":"—","br":"Aynı cümle iki şekilde kurulabilir ama anlam değişir: Ich erkläre es langsam, damit alle mitkommen (amacım bu) ↔ Ich habe langsam erklärt, sodass alle mitgekommen sind (sonuç bu oldu). Biri baştaki niyet, öbürü ortaya çıkan netice.","tr":"…sın diye ↔ …öyle ki","s":"Ich schreibe es auf, damit nichts vergessen wird.","st":"Hiçbir şey unutulmasın diye yazıyorum.","f":"um … zu (…mek için) · der Zweck (amaç) · das Ergebnis (sonuç)"},{"w":"zumal","t":"Bağlaç","k":"zu + mal (kez, hele)","c":"—","br":"Zaten var olan bir gerekçeyi güçlendirir: „hele ki, üstelik“. Yeni bir sebep değil, mevcut sebebi ağırlaştıran ek bir sebep verir. Yan cümle kurar, fiil sona gider.","tr":"hele ki, üstelik","s":"Wir sollten früher losfahren, zumal es schneien soll.","st":"Erken çıkmalıyız, hele ki kar yağacakmış.","f":"besonders (özellikle) · vor allem (her şeyden önce) · ohnehin (zaten)"},{"w":"wobei","t":"Bağlaç","k":"wo + bei (yanında)","c":"—","br":"İki iş görür: eşzamanlı bir ayrıntı ekler (…, wobei die Kosten steigen) ve konuşmada söyleneni yumuşatıp sınırlar: Wobei — so schlimm war es auch wieder nicht. İkinci kullanım günlük dilde çok yaygındır.","tr":"…ki bu arada; gerçi","s":"Der Plan ist gut, wobei die Umsetzung schwierig bleibt.","st":"Plan iyi, gerçi uygulanması zor kalıyor.","f":"allerdings (ne var ki) · dabei (bu sırada) · einschränken (sınırlamak)"},{"w":"wohingegen","t":"Karşıtlık bağlacı","k":"wo + hin + gegen","c":"—","br":"İki durumu karşı karşıya koyar ve yan cümle kurar (fiil sonda). hingegen zarftır ve dizimi değiştirmez; wohingegen bağlaçtır. Aynı anlam, iki farklı yapı.","tr":"oysa, buna karşılık","s":"Die Miete blieb gleich, wohingegen die Nebenkosten deutlich stiegen.","st":"Kira aynı kaldı, oysa yan giderler belirgin şekilde arttı.","f":"hingegen (buna karşılık) · während (oysa) · dagegen (buna karşı)"},{"w":"nicht nur … sondern auch","t":"İkili bağlaç","k":"nicht nur (yalnızca değil) + sondern auch","c":"—","br":"İki öğeyi de olumlar ve ikincisini vurgular. sondern burada kuralına uyar: önünde olumsuz vardır. Yazı dilinde argüman güçlendirmenin standart kalıbıdır.","tr":"yalnızca … değil, ayrıca …","s":"Der Vertrag ist nicht nur unklar, sondern auch unvollständig.","st":"Sözleşme yalnızca belirsiz değil, ayrıca eksik.","f":"sowohl … als auch (hem …hem) · außerdem (ayrıca) · zudem (üstelik)"},{"w":"sowohl … als auch","t":"İkili bağlaç","k":"so + wohl (hem) + als auch","c":"—","br":"İki öğeyi eşit ağırlıkla toplar: hem A hem B. Fiil çoğul olur. Karşıtı weder … noch — ikisini birden olumsuzlar ve ayrıca nicht almaz.","tr":"hem … hem de","s":"Sowohl die Eltern als auch die Lehrer waren einverstanden.","st":"Hem veliler hem öğretmenler hemfikirdi.","f":"weder … noch (ne …ne) · beide (her ikisi) · gemeinsam (ortak)"},{"w":"geschweige denn","t":"Kalıp","k":"schweigen (susmak) → „… bir yana, sus“","c":"—","br":"Kelimenin içinde susma var: „onu hiç söyleme bile“. Olumsuz bir cümleden sonra gelir ve daha uçtaki örneği ekler: Ich habe keine Zeit für Sport, geschweige denn für Urlaub.","tr":"…bir yana, …şöyle dursun","s":"Er hat nicht mal geantwortet, geschweige denn sich entschuldigt.","st":"Cevap bile vermedi, özür dilemek şöyle dursun.","f":"schweigen (susmak) · erst recht nicht (hele hiç) · schon gar nicht (asla)"},{"w":"wenngleich / obgleich","t":"Karşıtlık bağlacı","k":"wenn/ob + gleich","c":"—","br":"obwohl’un yazınsal kardeşleri: aynı anlam, daha resmî ton. Üçünde de fiil sona gider. Kısa biçimi de vardır: wenn auch — Er kam, wenn auch spät.","tr":"…mesine rağmen (yazı dili)","s":"Der Antrag wurde bewilligt, wenngleich mit Auflagen.","st":"Başvuru kabul edildi, gerçi şartlarla birlikte.","f":"obwohl (rağmen) · trotzdem (buna rağmen) · dennoch (yine de)"},{"w":"bis / seitdem (bağlaç)","t":"Zaman bağlaçları","k":"bis (…e kadar) / seitdem (…den beri)","c":"—","br":"İkisi hem edat hem bağlaçtır. Bağlaç olarak yan cümle kurar ve fiili sona gönderir: Warte, bis ich zurück bin. seitdem ayrıca zarftır — o zaman fiil hemen arkasından gelir: Seitdem sehen wir uns kaum.","tr":"…e kadar / …den beri","s":"Warte bitte, bis ich fertig bin.","st":"Lütfen ben bitirene kadar bekle.","f":"solange (…dığı sürece) · seit (…den beri) · bevor (…meden önce)"},{"w":"Bağlaç türleri ve dizim","t":"Yapı kuralı","k":"Konjunktion · Subjunktion · Konjunktionaladverb","c":"—","br":"Üç tür, üç dizim: und/oder/aber/denn/sondern dizimi hiç değiştirmez; weil/dass/obwohl fiili sona gönderir; deshalb/trotzdem/folglich ise zarftır, fiil hemen arkalarından gelir. Anlamı değil, yapıyı bunlar belirler.","tr":"bağlaçların üç dizim tipi","s":"Es regnete, deshalb blieben wir zu Hause, weil niemand nass werden wollte.","st":"Yağmur yağdı, bu yüzden evde kaldık, çünkü kimse ıslanmak istemedi.","f":"der Nebensatz (yan cümle) · die Wortstellung (dizim) · die Verbklammer (fiil parantezi)"}]},{"n":"Karşılaştırma ve derece","e":"so…wie, immer besser, möglichst, ziemlich…","c":"#7a6a3f","g":"Dilbilgisi mantığı","cards":[{"w":"so … wie ↔ als","t":"Karşılaştırma","k":"eşitlik: so … wie · üstünlük: Komparativ + als","c":"—","br":"Eşitse wie, farklıysa als. Türkçedeki „kadar“ ile „-den“ ayrımıyla aynı: onun kadar hızlı ↔ ondan hızlı. Karışması en sık görülen hatalardan.","tr":"…kadar / …den daha","s":"Der neue Weg ist nicht so kurz wie der alte, aber sicherer als er.","st":"Yeni yol eskisi kadar kısa değil ama ondan daha güvenli.","f":"der Komparativ (üstünlük derecesi) · gleich (aynı) · der Unterschied (fark)"},{"w":"Komparativ: -er","t":"Derece kuralı","k":"sıfat + -er (+ Umlaut)","c":"schnell → schneller · alt → älter","br":"Tek heceli sıfatların çoğu Umlaut alır: alt, jung, groß, stark, warm, kalt, lang, kurz. Düzensizler azdır: gut → besser, viel → mehr, gern → lieber, hoch → höher, nah → näher.","tr":"üstünlük derecesi","s":"Heute ist es deutlich wärmer als gestern.","st":"Bugün dünden belirgin şekilde daha sıcak.","f":"gut → besser (daha iyi) · viel → mehr (daha çok) · gern → lieber (daha severek)"},{"w":"Superlativ: am …-sten","t":"Derece kuralı","k":"am + sıfat + -sten / der/die/das …-ste","c":"am schnellsten · der schnellste Weg","br":"İki biçimi vardır: yüklem olarak am schnellsten, isim önünde der schnellste. -d, -t, -s, -z ile bitenler araya e alır: am ältesten, am heißesten.","tr":"en üstünlük derecesi","s":"Am schnellsten geht es mit dem Rad.","st":"En hızlısı bisikletle olur.","f":"der Superlativ (en üstünlük) · am besten (en iyisi) · am liebsten (en çok tercihen)"},{"w":"immer + Komparativ","t":"Kalıp","k":"immer (daima) + üstünlük derecesi","c":"—","br":"Süregelen artışı anlatır: giderek daha… İngilizcedeki „…er and …er“ ile aynı iş. Eş biçimi: immer
