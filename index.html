,"f":"der Auftrag (talimat) · die Vertretung (vekâlet) · unterschreiben (imzalamak)"}]},{"n":"Daireler ve belgeler","e":"Bürgeramt, Anmeldung, Führungszeugnis…","c":"#3f5a6b","g":"Hukuk & idare dili","cards":[{"w":"das Bürgeramt","t":"Nomen, ¨-er","k":"Bürger (vatandaş) + Amt (daire)","c":"das Bürgeramt, -ämter","br":"Vatandaşın gündelik işlerini gördüğü daire: adres kaydı, kimlik, ehliyet işleri. Şehirden şehre adı değişir: Bürgerbüro, Einwohnermeldeamt, Bürgerservice.","tr":"nüfus/vatandaş hizmetleri dairesi","s":"Für die Anmeldung müssen Sie zum Bürgeramt.","st":"Adres kaydı için nüfus dairesine gitmeniz gerekiyor.","f":"das Amt (daire) · der Bürger (vatandaş) · der Termin (randevu)"},{"w":"die Anmeldung ↔ die Abmeldung","t":"Kayıt çifti","k":"an/ab + melden (bildirmek)","c":"—","br":"Almanya’da adres bildirimi yasal zorunluluktur: taşındıktan sonra iki hafta içinde Anmeldung. Şehirden ayrılırken Abmeldung, aynı şehir içinde taşınınca Ummeldung.","tr":"kayıt yaptırma ↔ kaydı sildirme","s":"Die Anmeldung muss innerhalb von zwei Wochen erfolgen.","st":"Adres kaydı iki hafta içinde yapılmalı.","f":"die Ummeldung (adres değişikliği) · melden (bildirmek) · die Meldepflicht (bildirim yükümlülüğü)"},{"w":"die Meldebescheinigung","t":"Nomen, -en","k":"melden + Bescheinigung (belge)","c":"die Meldebescheinigung, -en","br":"Nerede oturduğunu resmen gösteren belge. Okul kaydı, banka ve sigorta işlemlerinde sık istenir; Bürgeramt’tan alınır.","tr":"ikametgâh belgesi","s":"Für die Schulanmeldung brauchen wir eine Meldebescheinigung.","st":"Okul kaydı için ikametgâh belgesi gerekiyor.","f":"bescheinigen (belgelemek) · die Bescheinigung (belge) · der Wohnsitz (ikamet yeri)"},{"w":"das Führungszeugnis","t":"Nomen, -se","k":"Führung (davranış, idare) + Zeugnis (belge)","c":"das Führungszeugnis, -se","br":"„Kendini nasıl yönettiğine dair belge“. Öğretmenlik, çocuklarla çalışma ve birçok işe başvuruda istenir; Bürgeramt üzerinden başvurulur, posta ile gelir.","tr":"iyi hâl belgesi, sabıka kaydı belgesi","s":"Für die Stelle wird ein erweitertes Führungszeugnis verlangt.","st":"Bu pozisyon için genişletilmiş iyi hâl belgesi isteniyor.","f":"die Führung (idare, davranış) · das Zeugnis (belge) · beantragen (başvurmak)"},{"w":"der Personalausweis","t":"Nomen, -e","k":"Person + Ausweis (kimlik)","c":"der Personalausweis, -e","br":"weisen (göstermek) kökünden: kişiyi gösteren belge. Almanya’da 16 yaşından itibaren zorunludur. Yanındakiler: der Reisepass, der Führerschein.","tr":"kimlik kartı","s":"Bitte bringen Sie Ihren Personalausweis mit.","st":"Lütfen kimliğinizi yanınızda getirin.","f":"der Ausweis (kimlik) · ausweisen (kimlik göstermek) · der Reisepass (pasaport)"},{"w":"die Beglaubigung","t":"Nomen, -en","k":"be + Glaube (inanç) + -igung","c":"die Beglaubigung, -en","br":"Bir kopyanın aslına uygunluğunun resmen onaylanması: „inanılır kılma“. Kalıp: eine beglaubigte Kopie. Bürgeramt ya da noter yapar.","tr":"onaylama, tasdik","s":"Wir brauchen eine beglaubigte Kopie des Zeugnisses.","st":"Diplomanın onaylı bir kopyası gerekiyor.","f":"beglaubigen (tasdik etmek) · die Kopie (kopya) · der Notar (noter)"},{"w":"die Vollmacht (kurum)","t":"Nomen, -en","k":"voll + Macht (yetki)","c":"die Vollmacht, -en","br":"Başkası adına işlem yaptırmanın anahtarı. Dairede iş takibi için genelde yazılı vekâlet ve iki kimlik istenir. İlgili: der Bevollmächtigte.","tr":"vekâletname","s":"Mit einer schriftlichen Vollmacht kann das auch jemand anders erledigen.","st":"Yazılı vekâletle bunu başkası da halledebilir.","f":"bevollmächtigen (vekâlet vermek) · die Macht (güç) · die Unterschrift (imza)"},{"w":"das Formular ausfüllen","t":"Kollokation","k":"Formular (form) + ausfüllen (doldurmak)","c":"füllt aus – füllte aus – hat ausgefüllt","br":"Form doldurulur (ausfüllen), imzalanır (unterschreiben), teslim edilir (einreichen ya da abgeben). Bu üçlü Alman bürokrasisinin temel dizisidir.","tr":"formu doldurmak","s":"Füllen Sie das Formular bitte vollständig aus und unterschreiben Sie unten.","st":"Formu lütfen eksiksiz doldurun ve aşağıyı imzalayın.","f":"einreichen (sunmak) · unterschreiben (imzalamak) · vollständig (eksiksiz)"},{"w":"der Sachbearbeiter","t":"Nomen, -","k":"Sache (dosya, iş) + bearbeiten (işlemek)","c":"der Sachbearbeiter, -","br":"Dosyayı fiilen işleyen memur. Yazışmada muhatabın adıdır; Az. (dosya numarası) ile birlikte yazılırsa iş çok hızlanır.","tr":"dosya sorumlusu, memur","s":"Fragen Sie am besten direkt bei der zuständigen Sachbearbeiterin nach.","st":"En iyisi doğrudan yetkili dosya sorumlusuna sorun.","f":"bearbeiten (işlemek) · die Bearbeitung (işleme) · zuständig (yetkili)"},{"w":"die Wartezeit ↔ die Bearbeitungszeit","t":"Süre çifti","k":"warten (beklemek) / bearbeiten (işlemek)","c":"—","br":"İkisi farklıdır: Wartezeit randevuya kadar geçen süre, Bearbeitungszeit ise başvurunun işlenme süresi. Gecikme sorarken doğru kelime işi hızlandırır.","tr":"bekleme süresi ↔ işlem süresi","s":"Die Bearbeitungszeit beträgt derzeit etwa sechs Wochen.","st":"İşlem süresi şu anda yaklaşık altı hafta.","f":"die Frist (süre) · sich gedulden (sabretmek) · der Rückstand (birikmiş iş)"},{"w":"das Anliegen vorbringen","t":"Kollokation","k":"Anliegen (talep) + vorbringen (ileri sürmek)","c":"bringt vor – brachte vor – hat vorgebracht","br":"Şalterde ilk cümle: Ich habe folgendes Anliegen … Kısa ve net bir Anliegen, memurun doğru formu bulmasını sağlar.","tr":"talebini dile getirmek","s":"Ich habe folgendes Anliegen: Ich möchte meine Adresse ummelden.","st":"Şöyle bir talebim var: adresimi değiştirmek istiyorum.","f":"das Anliegen (talep) · Worum geht es? (konu nedir) · das Schalter (gişe)"},{"w":"der Nachweis erbringen","t":"Kollokation","k":"Nachweis (kanıt) + erbringen (ortaya koymak)","c":"erbringt – erbrachte – hat erbracht","br":"erbringen „ortaya çıkarmak, sunmak“ demektir: Nachweis erbringen, Leistung erbringen. Resmî dilde vorlegen’in daha ağır hâli.","tr":"kanıt sunmak, belgelemek","s":"Den Nachweis über die Zahlung müssen Sie selbst erbringen.","st":"Ödeme kanıtını kendiniz sunmanız gerekiyor.","f":"der Nachweis (kanıt belge) · vorlegen (ibraz etmek) · die Leistung (edim)"},{"w":"die Gebührenordnung","t":"Nomen, -en","k":"Gebühr (harç) + Ordnung (düzen)","c":"die Gebührenordnung, -en","br":"Hangi işlemin ne kadar harç aldığını gösteren resmî tarife. Fatura tartışmasında dayanaktır: ücret keyfi değil, tarifeye bağlıdır.","tr":"harç tarifesi","s":"Die Kosten richten sich nach der Gebührenordnung.","st":"Masraflar harç tarifesine göre belirlenir.","f":"die Gebühr (harç) · gebührenpflichtig (harca tabi) · die Ordnung (düzen)"},{"w":"der Antrag auf … (kalıp)","t":"Kalıp","k":"Antrag + auf + Akkusativ","c":"—","br":"Başvurunun resmî adı daima bu kalıpla kurulur: Antrag auf Wohngeld, Antrag auf Fristverlängerung, Antrag auf Akteneinsicht. Formun adını bilmek işlemin yarısıdır.","tr":"… talebi, … başvurusu","s":"Ich stelle hiermit einen Antrag auf Fristverlängerung.","st":"İşbu yazıyla süre uzatımı talebinde bulunuyorum.","f":"beantragen (başvurmak) · der Antragsteller (başvuran) · die Bewilligung (kabul, tahsis)"}]},{"n":"İş ve başvuru dili","e":"Bewerbung, Probezeit, befristet, Überstunden…","c":"#4a5f7a","g":"Hukuk & idare dili","cards":[{"w":"die Bewerbung","t":"Nomen, -en","k":"be + werben (çabalamak) + -ung","c":"die Bewerbung, -en","br":"werben eskiden „bir şeyi elde etmek için uğraşmak“tı; bugün reklam anlamı da buradan. Kendini bir iş için ortaya koyma = başvuru dosyası.","tr":"iş başvurusu","s":"Die Bewerbung schicke ich heute Abend raus.","st":"Başvuruyu bu akşam gönderiyorum.","f":"sich bewerben um (başvurmak) · der Bewerber (aday) · werben (reklam yapmak)"},{"w":"das Anschreiben ↔ der Lebenslauf","t":"Belge çifti","k":"an + schreiben / Leben + Lauf (akış)","c":"—","br":"Başvuru iki parçadır: Anschreiben niyet mektubudur (neden ben?), Lebenslauf ise „hayatın akışı“ — tablo hâlinde özgeçmiş. Almanya’da ikisi ayrı ve zorunludur.","tr":"niyet mektubu ↔ özgeçmiş","s":"Im Anschreiben erkläre ich kurz, warum die Stelle zu mir passt.","st":"Niyet mektubunda pozisyonun bana neden uyduğunu kısaca açıklıyorum.","f":"der Lauf (akış) · die Unterlagen (evrak) · das Zeugnis (belge, karne)"},{"w":"das Vorstellungsgespräch","t":"Nomen, -e","k":"Vorstellung (tanıtım) + s + Gespräch","c":"das Vorstellungsgespräch, -e","br":"„Kendini tanıtma görüşmesi“. sich vorstellen fiilinin iki anlamı burada birleşir: kendini tanıtmak ve karşı tarafın seni gözünde canlandırması.","tr":"iş görüşmesi, mülakat","s":"Das Vorstellungsgespräch ist am Dienstag um zehn.","st":"İş görüşmesi salı saat onda.","f":"sich vorstellen (kendini tanıtmak) · die Einladung (davet) · die Zusage (olumlu cevap)"},{"w":"die Probezeit","t":"Nomen, -en","k":"Probe (deneme) + Zeit","c":"die Probezeit, -en","br":"Deneme süresi; genelde altı ay. Bu süre içinde fesih bildirim süresi iki haftaya düşer — yani karşılıklı bağ zayıftır. Aynı kökten: probieren, die Probe (prova, numune).","tr":"deneme süresi","s":"In der Probezeit beträgt die Kündigungsfrist nur zwei Wochen.","st":"Deneme süresinde fesih ihbar süresi yalnızca iki haftadır.","f":"probieren (denemek) · die Probe (prova) · die Kündigungsfrist (fesih süresi)"},{"w":"befristet ↔ unbefristet","t":"Sözleşme çifti","k":"Frist (süre) + be- / un-","c":"—","br":"Sözleşmenin kaderini belirleyen tek kelime: befristet süreye bağlıdır ve kendiliğinden sona erer; unbefristet süresizdir ve ancak fesihle biter.","tr":"süreli ↔ süresiz (sözleşme)","s":"Der Vertrag ist zunächst auf zwei Jahre befristet.","st":"Sözleşme başlangıçta iki yıl süreli.","f":"die Frist (süre) · die Befristung (süre sınırı) · die Verlängerung (uzatma)"},{"w":"Vollzeit ↔ Teilzeit","t":"Çalışma biçimi","k":"voll (tam) / Teil (kısım) + Zeit","c":"—","br":"Tam zamanlı genelde 38–40 saat; Teilzeit her türlü azaltılmış süredir. Ayrıca Minijob: aylık kazancı sınırlı, sosyal sigortası farklı olan küçük iş.","tr":"tam zamanlı ↔ yarı zamanlı","s":"Sie arbeitet seit der Elternzeit in Teilzeit.","st":"Ebeveyn izninden beri yarı zamanlı çalışıyor.","f":"die Arbeitszeit (çalışma süresi) · der Minijob (küçük iş) · die Elternzeit (ebeveyn izni)"},{"w":"die Überstunde","t":"Nomen, -n","k":"über (fazla) + Stunde (saat)","c":"die Überstunde, -n","br":"Normal sürenin üstüne kalan saat. Ya ödenir ya izinle telafi edilir: abfeiern (izin olarak kullanmak) ya da das Arbeitszeitkonto’ya yazılır.","tr":"fazla mesai","s":"Die Überstunden kann ich zum Glück abfeiern.","st":"Fazla mesaileri neyse ki izin olarak kullanabiliyorum.","f":"abfeiern (izinle telafi etmek) · das Arbeitszeitkonto (mesai hesabı) · der Ausgleich (denkleştirme)"},{"w":"der Urlaubsanspruch","t":"Nomen, ¨-e","k":"Urlaub (izin) + s + Anspruch (hak)","c":"der Urlaubsanspruch, -sprüche","br":"Yasal asgari: beş günlük haftada 20 iş günü. Sözleşme daha fazlasını verebilir, daha azını veremez — bu mantık bütün iş hukukunda geçerlidir.","tr":"izin hakkı","s":"Mein Urlaubsanspruch beträgt 30 Tage im Jahr.","st":"İzin hakkım yılda 30 gün.","f":"der Anspruch (hak) · der Resturlaub (kalan izin) · beantragen (talep etmek)"},{"w":"das Arbeitszeugnis","t":"Nomen, -se","k":"Arbeit + Zeugnis (belge)","c":"das Arbeitszeugnis, -se","br":"İşten ayrılırken verilen bonservis. Alman iş dünyasının gizli dili buradadır: „stets zu unserer vollsten Zufriedenheit“ en yüksek not, „zu unserer Zufriedenheit“ ise zayıf anlamına gelir.","tr":"bonservis, çalışma belgesi","s":"Beim Ausscheiden haben Sie Anspruch auf ein qualifiziertes Arbeitszeugnis.","st":"İşten ayrılırken nitelikli bir bonservis alma hakkınız var.","f":"das Zeugnis (belge) · die Beurteilung (değerlendirme) · ausscheiden (ayrılmak)"},{"w":"der Betriebsrat","t":"Nomen, ¨-e","k":"Betrieb (işletme) + Rat (kurul)","c":"der Betriebsrat, -räte","br":"Çalışanların seçtiği temsil kurulu. Mitbestimmung ilkesinin somut hâli: çalışma saatleri ve işe alım gibi konularda söz hakkı vardır.","tr":"işçi temsil kurulu","s":"Ohne den Betriebsrat geht bei den Arbeitszeiten nichts.","st":"Çalışma saatlerinde işçi kurulu olmadan hiçbir şey olmuyor.","f":"die Mitbestimmung (ortak karar hakkı) · der Rat (kurul; öğüt) · die Personalabteilung (insan kaynakları)"},{"w":"das Gehalt ↔ der Lohn","t":"Ücret çifti","k":"halten kökünden Gehalt / Lohn (karşılık)","c":"das Gehalt, ¨-er / der Lohn, ¨-e","br":"Gehalt aylık sabit maaştır (memur, büro), Lohn ise saat ya da işe göre ödenen ücrettir. Brüt-net ayrımı ikisinde de aynı: brutto ↔ netto.","tr":"maaş ↔ yevmiye, ücret","s":"Das Gehalt wird immer zum Monatsende überwiesen.","st":"Maaş her zaman ay sonunda yatırılıyor.","f":"der Bruttolohn (brüt ücret) · die Gehaltsabrechnung (maaş bordrosu) · der Mindestlohn (asgari ücret)"},{"w":"die Fortbildung ↔ die Weiterbildung","t":"Eğitim çifti","k":"fort (ileri) / weiter (devam) + Bildung","c":"—","br":"İkisi de mesleki eğitimdir: Fortbildung mevcut işte derinleşmedir, Weiterbildung ise yeni alana açılmayı da kapsar. Okul dilinde Fortbildung öğretmen semineridir.","tr":"hizmet içi eğitim ↔ ileri eğitim","s":"Am Freitag habe ich eine Fortbildung, der Unterricht fällt aus.","st":"Cuma günü hizmet içi eğitimim var, ders iptal.","f":"die Bildung (eğitim) · die Schulung (kurs) · sich fortbilden (kendini geliştirmek)"},{"w":"die Kündigung ↔ der Aufhebungsvertrag","t":"Sona erme çifti","k":"kündigen / Aufhebung (kaldırma)","c":"—","br":"Fesih tek taraflıdır ve süreye bağlıdır; Aufhebungsvertrag ise karşılıklı anlaşmayla ilişkiyi bitirir. İkincisi işsizlik parasında bekleme süresine yol açabilir — bu yüzden kelime seçimi kritiktir.","tr":"fesih ↔ karşılıklı sonlandırma","s":"Statt einer Kündigung wurde ein Aufhebungsvertrag angeboten.","st":"Fesih yerine karşılıklı sonlandırma sözleşmesi önerildi.","f":"kündigen (feshetmek) · die Sperrzeit (bekleme süresi) · die Abfindung (tazminat)"},{"w":"die Zusage ↔ die Absage","t":"Cevap çifti","k":"zu + sagen / ab + sagen","c":"—","br":"Yön mantığı yine iş başında: zu- karşıya doğru evet, ab- geri çevirir. Başvurunun iki olası sonucu; kalıp: eine Absage erhalten.","tr":"olumlu cevap ↔ ret","s":"Nach zwei Absagen kam gestern endlich eine Zusage.","st":"İki retten sonra dün nihayet olumlu cevap geldi.","f":"zusagen (kabul etmek) · absagen (iptal etmek) · die Rückmeldung (geri bildirim)"}]},{"n":"Vergi dili","e":"Steuererklärung, Freibetrag, absetzen…","c":"#7a4a2f","g":"Hukuk & idare dili","cards":[{"w":"die Steuererklärung","t":"Nomen, -en","k":"Steuer (vergi) + Erklärung (beyan)","c":"die Steuererklärung, -en","br":"erklären burada „açıklamak“ değil „beyan etmek“ demektir. Yıllık gelir beyanı; çoğu çalışan için gönüllüdür ve genelde iade getirir.","tr":"vergi beyannamesi","s":"Die Steuererklärung mache ich meistens im Frühjahr.","st":"Vergi beyannamesini genelde ilkbaharda yapıyorum.","f":"erklären (beyan etmek) · das Finanzamt (vergi dairesi) · die Erstattung (iade)"},{"w":"das Finanzamt","t":"Nomen, ¨-er","k":"Finanz + Amt (daire)","c":"das Finanzamt, -ämter","br":"Vergi dairesi. Kararı Steuerbescheid ile bildirir; ona itiraz Widerspruch değil Einspruch’tur — hangi kelime hangi kurumda geçerli, bu ayrım önemlidir.","tr":"vergi dairesi","s":"Der Bescheid vom Finanzamt kam gestern.","st":"Vergi dairesinin kararı dün geldi.","f":"der Steuerbescheid (vergi kararı) · der Einspruch (itiraz) · die Steuernummer (vergi numarası)"},{"w":"die Steuerklasse","t":"Nomen, -n","k":"Steuer + Klasse (sınıf)","c":"die Steuerklasse, -n","br":"Aylık kesintiyi belirleyen sınıf (I–VI). Medeni hâl ve eş durumuna göre değişir; yıl sonunda beyanla dengelenir — yani sınıf nihai vergiyi değil, aylık nakit akışını belirler.","tr":"vergi sınıfı","s":"Nach der Heirat haben wir die Steuerklasse gewechselt.","st":"Evlendikten sonra vergi sınıfını değiştirdik.","f":"die Lohnsteuer (gelir vergisi kesintisi) · der Ehegattensplitting (eş bölüşümü) · wechseln (değiştirmek)"},{"w":"der Freibetrag","t":"Nomen, ¨-e","k":"frei (muaf) + Betrag (tutar)","c":"der Freibetrag, -beträge","br":"Vergiden muaf tutulan tutar: bu sınırın altındaki gelir vergilendirilmez. Aynı mantık başka alanlarda da var: der Grundfreibetrag, der Kinderfreibetrag.","tr":"vergiden muaf tutar","s":"Bis zum Freibetrag zahlen Sie darauf keine Steuern.","st":"Muafiyet sınırına kadar bunun için vergi ödemezsiniz.","f":"frei (serbest, muaf) · der Betrag (tutar) · steuerfrei (vergisiz)"},{"w":"absetzen (Steuer)","t":"Verb","k":"ab + setzen (koymak)","c":"setzt ab – setzte ab – hat abgesetzt","br":"Bir gideri vergiye esas gelirden düşmek: „aşağı koymak“. Kalıp: von der Steuer absetzen. Aynı fiil ticarette „satmak“, günlükte „indirmek“ demektir.","tr":"vergiden düşmek","s":"Arbeitsmittel kann man von der Steuer absetzen.","st":"İş malzemeleri vergiden düşülebilir.","f":"der Absatz (satış; paragraf) · abziehen (çıkarmak) · absetzbar (indirilebilir)"},{"w":"die Werbungskosten","t":"Nomen (çoğul)","k":"Werbung (kazanç için çaba) + Kosten","c":"die Werbungskosten (Pl.)","br":"Yanıltıcı bir kelime: reklam değil, geliri elde etmek için yapılan masraflar. werben’in eski anlamı „kazanmak için uğraşmak“tır — kelime o anlamı korumuş.","tr":"gelir elde etme giderleri","s":"Fahrtkosten zur Arbeit zählen zu den Werbungskosten.","st":"İşe gidiş yol masrafları gelir elde etme giderlerine dahildir.","f":"werben (uğraşmak; reklam yapmak) · die Pendlerpauschale (yol götürüsü) · absetzen (düşmek)"},{"w":"die Pauschale","t":"Nomen, -n","k":"pauschal (toptan, götürü)","c":"die Pauschale, -n","br":"Tek tek hesaplamak yerine sabit götürü tutar. Vergide belge istemeden kabul edilen miktar; günlük dilde ise „her şey dahil“ fiyat: der Pauschalpreis.","tr":"götürü tutar, maktu bedel","s":"Ohne Belege gilt die Pauschale von 1.230 Euro.","st":"Belge olmadan 1.230 avroluk götürü tutar geçerli.","f":"pauschal (toptan) · die Kostenpauschale (masraf götürüsü) · der Beleg (belge)"},{"w":"die Rückerstattung","t":"Nomen, -en","k":"zurück + erstatten (yerine koymak)","c":"die Rückerstattung, -en","br":"Fazla ödenenin geri verilmesi. Vergi beyanının en beklenen sonucu; kalıp: eine Rückerstattung erhalten.","tr":"geri ödeme, iade","s":"Mit einer Rückerstattung rechne ich frühestens im Juni.","st":"İadeyi en erken haziranda bekliyorum.","f":"erstatten (iade etmek) · die Nachzahlung (ek ödeme) · das Guthaben (alacak)"},{"w":"der Steuerberater","t":"Nomen, -","k":"Steuer + beraten (danışmanlık yapmak)","c":"der Steuerberater, -","br":"Vergi danışmanı; karmaşık durumlarda ücreti kendini amorti eder. Alternatifi der Lohnsteuerhilfeverein — çalışanlar için ucuz üyelik esaslı destek.","tr":"mali müşavir","s":"Bei so vielen Belegen lohnt sich ein Steuerberater.","st":"Bu kadar çok belge varken mali müşavir kendini amorti eder.","f":"beraten (danışmanlık yapmak) · die Beratung (danışmanlık) · sich lohnen (değmek)"},{"w":"brutto ↔ netto","t":"Ücret çifti","k":"brutto (ham) / netto (temiz)","c":"—","br":"İtalyanca kökenli: brutto „ham, kaba“, netto „temiz“. Maaşta brüt kesintiler öncesi, net ele geçendir. Faturada ise netto vergisiz, brutto KDV dahildir.","tr":"brüt ↔ net","s":"Brutto klingt gut, netto bleibt weniger übrig.","st":"Brüt kulağa hoş geliyor, net olarak daha azı kalıyor.","f":"die Abzüge (kesintiler) · die Sozialabgaben (sosyal kesintiler) · die MwSt. (KDV)"},{"w":"die Abgabe ↔ der Beitrag","t":"Kesinti çifti","k":"abgeben (vermek) / beitragen (katkıda bulunmak)","c":"—","br":"Abgabe devlete verilen zorunlu paydır (vergi, harç); Beitrag ise bir ortak kasaya katkıdır (sigorta primi, üyelik aidatı). Bordroda ikisi ayrı satırdır.","tr":"resmî kesinti ↔ prim, aidat","s":"Von der Bruttolohn gehen Steuern und Beiträge ab.","st":"Brüt ücretten vergiler ve primler düşülüyor.","f":"die Sozialabgaben (sosyal kesintiler) · der Krankenkassenbeitrag (sağlık primi) · abgeben (vermek)"},{"w":"die Frist versäumen","t":"Kollokation","k":"versäumen (kaçırmak) + Frist","c":"versäumt – versäumte – hat versäumt","br":"säumen = oyalanmak; ver- ile „oyalanıp kaçırmak“. Vergi ve idare hukukunda en pahalı fiil budur. Kurtarma yolu: Antrag auf Wiedereinsetzung in den vorigen Stand.","tr":"süreyi kaçırmak","s":"Wer die Frist versäumt, verliert den Anspruch.","st":"Süreyi kaçıran hakkını kaybeder.","f":"die Versäumnis (ihmal) · fristgerecht (süresinde) · die Wiedereinsetzung (eski hâle getirme)"},{"w":"die Belegpflicht","t":"Nomen (çoğulsuz)","k":"Beleg (belge) + Pflicht (yükümlülük)","c":"die Belegpflicht","br":"Harcamayı belgeleme zorunluluğu. Vergi dairesi artık belgeleri baştan istemez ama saklama süresi boyunca isteyebilir — bu yüzden fişler atılmaz.","tr":"belgeleme yükümlülüğü","s":"Die Belege müssen Sie aufbewahren, auch wenn Sie sie nicht einreichen.","st":"Belgeleri sunmasanız da saklamanız gerekiyor.","f":"der Beleg (belge) · aufbewahren (saklamak) · die Aufbewahrungsfrist (saklama süresi)"}]},{"n":"Alışveriş ve tüketici hakları","e":"Widerrufsrecht, Garantie, Ersatzteil, Rücksendung…","c":"#9c6a2a","g":"Hukuk & idare dili","cards":[{"w":"das Widerrufsrecht","t":"Nomen, -e","k":"Widerruf (cayma) + Recht (hak)","c":"das Widerrufsrecht, -e","br":"İnternetten alışverişte 14 gün içinde gerekçesiz cayma hakkı. Mağazadan alınan sağlam üründe böyle bir hak YOKTUR — oradaki değişim mağazanın jestidir.","tr":"cayma hakkı","s":"Beim Onlinekauf haben Sie 14 Tage Widerrufsrecht.","st":"İnternetten alışverişte 14 gün cayma hakkınız var.","f":"widerrufen (caymak) · die Widerrufsfrist (cayma süresi) · der Umtausch (değişim)"},{"w":"die Garantie ↔ die Gewährleistung","t":"Karıştırılan çift","k":"Garantie (gönüllü taahhüt) / Gewähr + leisten (yasal)","c":"—","br":"Gewährleistung yasadan doğar, iki yıldır ve satıcıya karşıdır. Garantie ise üreticinin gönüllü ek taahhüdüdür; süresi ve kapsamı serbesttir. Karıştırınca yanlış adrese başvurulur.","tr":"garanti (gönüllü) ↔ yasal ayıp sorumluluğu","s":"Die Garantie ist abgelaufen, die Gewährleistung gilt aber noch.","st":"Garanti süresi doldu ama yasal sorumluluk hâlâ geçerli.","f":"der Mangel (ayıp) · der Hersteller (üretici) · der Händler (satıcı)"},{"w":"die Rücksendung","t":"Nomen, -en","k":"zurück + senden (göndermek)","c":"die Rücksendung, -en","br":"İadenin fiziksel tarafı: paketi geri göndermek. Kalıplar: das Rücksendeetikett (iade etiketi), die Rücksendung ist kostenlos.","tr":"iade gönderimi","s":"Die Rücksendung ist innerhalb Deutschlands kostenlos.","st":"Almanya içinde iade gönderimi ücretsiz.","f":"zurückschicken (geri göndermek) · das Paket (kargo) · die Erstattung (para iadesi)"},{"w":"das Ersatzteil","t":"Nomen, -e","k":"Ersatz (yedek) + Teil (parça)","c":"das Ersatzteil, -e","br":"Yerine konacak parça. Tamir tartışmasında anahtar soru: Ersatzteile hâlâ üretiliyor mu? Değilse tamir yerine değişim gündeme gelir.","tr":"yedek parça","s":"Für dieses Modell gibt es keine Ersatzteile mehr.","st":"Bu model için artık yedek parça yok.","f":"der Ersatz (ikame) · reparieren (tamir etmek) · der Austausch (değişim)"},{"w":"der Kassenbon","t":"Nomen, -s","k":"Kasse (kasa) + Bon (fiş)","c":"der Kassenbon, -s","br":"Alışverişin kanıtı; garanti, değişim ve vergi için saklanır. Eş anlamlıları: der Kassenzettel, die Quittung, der Beleg.","tr":"kasa fişi","s":"Ohne Kassenbon wird nichts umgetauscht.","st":"Fiş olmadan hiçbir şey değiştirilmiyor.","f":"die Quittung (makbuz) · der Beleg (belge) · aufbewahren (saklamak)"},{"w":"die Lieferung ↔ die Abholung","t":"Teslim çifti","k":"liefern (teslim etmek) / abholen (alıp gitmek)","c":"—","br":"Teslimatın iki yolu: eve gelir (Lieferung) ya da sen alırsın (Abholung). Mağazadan alma modeli: Click & Collect. Kargo takibi: die Sendungsverfolgung.","tr":"teslimat ↔ gelip alma","s":"Lieferung dauert drei Tage, Abholung geht sofort.","st":"Teslimat üç gün sürüyor, gelip almak hemen mümkün.","f":"liefern (teslim etmek) · die Sendung (gönderi) · der Liefertermin (teslim tarihi)"},{"w":"der Mangel ↔ der Defekt","t":"Kusur çifti","k":"mangeln (eksik olmak) / defectus (bozukluk)","c":"—","br":"Mangel hukuki kavramdır: sözleşmede vaat edilenden sapma — kozmetik bile olabilir. Defekt ise teknik bozukluktur. Şikâyette hukuki kelime Mangel’dir.","tr":"ayıp, kusur ↔ teknik arıza","s":"Ich möchte einen Mangel anzeigen: Das Gerät startet nicht.","st":"Bir ayıp bildirmek istiyorum: cihaz açılmıyor.","f":"mangelhaft (ayıplı) · beanstanden (kusur bildirmek) · die Reklamation (şikâyet)"},{"w":"die Nachbesserung ↔ die Ersatzlieferung","t":"Hak çifti","k":"nachbessern (düzeltmek) / Ersatz + Lieferung","c":"—","br":"Ayıplı üründe önce satıcının iki seçeneği vardır: tamir (Nachbesserung) ya da yenisini gönderme (Ersatzlieferung). Bunlar başarısız olursa para iadesi ya da indirim gündeme gelir.","tr":"onarım ↔ yenisiyle değiştirme","s":"Nach zwei erfolglosen Nachbesserungen können Sie vom Vertrag zurücktreten.","st":"İki başarısız onarımdan sonra sözleşmeden dönebilirsiniz.","f":"zurücktreten (sözleşmeden dönmek) · die Minderung (bedel indirimi) · der Rücktritt (dönme)"},{"w":"vom Vertrag zurücktreten","t":"Kollokation","k":"zurück + treten (adım atmak)","c":"tritt zurück – trat zurück – ist zurückgetreten","br":"Sözleşmeden geri adım atmak: alışveriş bozulur, para geri gelir. Aynı fiil siyasette istifa demektir — ikisi de „geri çekilme“ imgesinden.","tr":"sözleşmeden dönmek; istifa etmek","s":"In diesem Fall können Sie vom Kaufvertrag zurücktreten.","st":"Bu durumda satış sözleşmesinden dönebilirsiniz.","f":"der Rücktritt (dönme; istifa) · die Rückabwicklung (geri işleme) · rückgängig machen (geri almak)"},{"w":"das Angebot ↔ die Werbung","t":"Karıştırılan çift","k":"anbieten (sunmak) / werben (reklam yapmak)","c":"—","br":"Angebot somut bir tekliftir ya da indirimdeki üründür (im Angebot); Werbung ise reklamın kendisidir. Hukukta Angebot bağlayıcı bir irade beyanı olabilir.","tr":"teklif, indirimli ürün ↔ reklam","s":"Die Milch ist diese Woche im Angebot.","st":"Süt bu hafta indirimde.","f":"anbieten (sunmak) · der Rabatt (iskonto) · die Reklame (reklam)"},{"w":"die Haltbarkeit ↔ das Verfallsdatum","t":"Tarih çifti","k":"haltbar (dayanıklı) / verfallen (bozulmak, geçersizleşmek)","c":"—","br":"Mindesthaltbarkeitsdatum asgari tazelik tarihidir — geçmesi ürünün bozulduğu anlamına gelmez. Verbrauchsdatum ise et ve balıkta gerçek son kullanma tarihidir.","tr":"asgari tazelik ↔ son kullanma tarihi","s":"Das Mindesthaltbarkeitsdatum ist kein Verfallsdatum.","st":"Asgari tazelik tarihi son kullanma tarihi değildir.","f":"haltbar (dayanıklı) · verderben (bozulmak) · das Verbrauchsdatum (tüketim tarihi)"},{"w":"das Pfand","t":"Nomen, ¨-er","k":"Pfand (rehin, güvence)","c":"das Pfand, die Pfänder","br":"Şişe ve kutuda geri iade karşılığı alınan depozito. Aynı kelime hukukta rehindir — ikisi de „geri alınmak üzere tutulan güvence“. Makinesi: der Pfandautomat.","tr":"depozito (şişe)","s":"Die Flaschen bringe ich morgen zum Pfandautomaten.","st":"Şişeleri yarın depozito makinesine götürürüm.","f":"pfandfrei (depozitosuz) · die Kaution (kira depozitosu) · zurückgeben (iade etmek)"},{"w":"die Verbraucherzentrale","t":"Nomen, -n","k":"Verbraucher (tüketici) + Zentrale (merkez)","c":"die Verbraucherzentrale, -n","br":"Tüketici danışma merkezi: sözleşme, abonelik ve alışveriş uyuşmazlıklarında ucuz hukuki destek verir. Kiracı için karşılığı der Mieterverein’dır.","tr":"tüketici danışma merkezi","s":"Bei so einem Vertrag hilft die Verbraucherzentrale weiter.","st":"Böyle bir sözleşmede tüketici merkezi yardımcı olur.","f":"der Verbraucher (tüketici) · verbrauchen (tüketmek) · die Beratung (danışmanlık)"},{"w":"das Kleingedruckte","t":"Nomen (sıfat çekimli)","k":"klein + gedruckt (basılmış)","c":"das Kleingedruckte","br":"„Küçük basılmış olan“: sözleşmenin altındaki asıl şartlar. Resmî adı die AGB (Allgemeine Geschäftsbedingungen). Deyim: Lies das Kleingedruckte!","tr":"küçük puntolu şartlar","s":"Das Problem steht wie immer im Kleingedruckten.","st":"Sorun her zamanki gibi küçük puntolarda yazıyor.","f":"die AGB (genel işlem şartları) · die Bedingung (şart) · unwirksam (geçersiz)"}]},{"n":"Banka ve para dili","e":"Überweisung, Dauerauftrag, Lastschrift, Zinsen…","c":"#2f6a52","g":"Hukuk & idare dili","cards":[{"w":"die Überweisung","t":"Nomen, -en","k":"über + weisen (yöneltmek)","c":"die Überweisung, -en","br":"Parayı bir hesaptan öbürüne yöneltmek. Aynı kelime sağlıkta sevk demektir — ikisi de „karşıya yöneltme“ imgesinden çıkar.","tr":"havale","s":"Die Überweisung ist heute Morgen rausgegangen.","st":"Havale bu sabah çıktı.","f":"überweisen (havale etmek) · die IBAN (hesap numarası) · der Empfänger (alıcı)"},{"w":"der Dauerauftrag ↔ die Lastschrift","t":"Ödeme çifti","k":"Dauer (süreklilik) + Auftrag / Last (yük) + Schrift","c":"—","br":"Dauerauftrag sen kurarsın: sabit tutar, sabit tarih (kira için idealdir). Lastschrift’te ise karşı taraf çeker; tutar değişebilir (elektrik, telefon). Kontrol kimde, fark burada.","tr":"düzenli ödeme talimatı ↔ otomatik ödeme (karşı taraf çeker)","s":"Die Miete zahle ich per Dauerauftrag, den Strom per Lastschrift.","st":"Kirayı düzenli talimatla, elektriği otomatik ödemeyle ödüyorum.","f":"die Einzugsermächtigung (tahsil yetkisi) · widerrufen (iptal etmek) · die Buchung (kayıt)"},{"w":"der Kontoauszug","t":"Nomen, ¨-e","k":"Konto + Auszug (çekilmiş özet)","c":"der Kontoauszug, -züge","br":"Hesaptan „çekilip alınan“ özet. Ödemenin kanıtı olarak resmî yazışmada en sık istenen belgedir.","tr":"hesap özeti, ekstre","s":"Als Nachweis reicht ein Kontoauszug.","st":"Kanıt olarak bir hesap özeti yeterli.","f":"der Auszug (alıntı; çıkış) · der Nachweis (kanıt) · die Buchung (işlem kaydı)"},{"w":"die Buchung","t":"Nomen, -en","k":"Buch (defter) + -ung","c":"die Buchung, -en","br":"Deftere geçirme: bankada işlem kaydı, seyahatte rezervasyon. Aynı kökten die Buchhaltung (muhasebe) ve zu Buche schlagen (hesaba yansımak).","tr":"kayıt, işlem; rezervasyon","s":"Die Buchung erscheint erst morgen auf dem Konto.","st":"İşlem hesapta ancak yarın görünecek.","f":"buchen (kaydetmek; rezerve etmek) · die Buchhaltung (muhasebe) · das Buch (defter)"},{"w":"der Dispo(kredit)","t":"Nomen, -e","k":"disponieren (tasarruf etmek)","c":"der Dispokredit, -e","br":"disponieren tasarruf etmek, serbestçe yönetmektir (kök: dis + ponere, ayrı ayrı yerleştirmek). Dispokredit, hesabın üstünde serbestçe tasarruf hakkıdır — yani eksiye düşme izni. Fiil hâli: das Konto überziehen.","tr":"kredili mevduat, eksiye düşme limiti","s":"Den Dispo sollte man wirklich nur im Notfall nutzen.","st":"Kredili mevduatı gerçekten yalnızca acil durumda kullanmalı.","f":"überziehen (limitten fazla harcamak) · die Zinsen (faiz) · der Kredit (kredi)"},{"w":"die Zinsen","t":"Nomen (çoğul)","k":"census (vergi, kira) kökünden","c":"die Zinsen (Pl.)","br":"Latince census (vergi, kira ödemesi) kökünden gelir — yani paranın kullanımı için ödenen kira. Almanca daima çoğul kullanır. Bileşikleri oranı ve türü gösterir: der Zinssatz, die Verzugszinsen, zinslos.","tr":"faiz","s":"Für das Sparkonto gibt es kaum noch Zinsen.","st":"Birikim hesabına neredeyse hiç faiz verilmiyor.","f":"der Zinssatz (faiz oranı) · die Verzugszinsen (gecikme faizi) · das Guthaben (bakiye)"},{"w":"die Rate","t":"Nomen, -n","k":"pro rata (paya göre)","c":"die Rate, -n","br":"Latince pro rata: „paya düşen ölçüde“. Yani bütünün bölünmüş parçası. Ödemede taksit, istatistikte oran demektir — ikisi de aynı „pay“ fikrinden. Kalıp: in Raten zahlen; ilgili die Ratenzahlung.","tr":"taksit; oran","s":"Können wir das auch in Raten zahlen?","st":"Bunu taksitle de ödeyebilir miyiz?","f":"die Ratenzahlung (taksitli ödeme) · die Anzahlung (peşinat) · die Quote (oran)"},{"w":"die Gebühr ↔ die Kosten","t":"Ücret çifti","k":"gebühren (hak etmek, düşmek) / kosten","c":"die Gebühr, -en / die Kosten (Pl.)","br":"Gebühr resmî ve sabit bir bedeldir (harç, ücret tarifesi); Kosten ise doğan masrafların toplamıdır ve daima çoğuldur. Faturayı okurken bu ayrım kalemleri açıklar.","tr":"harç, sabit ücret ↔ masraflar","s":"Zur Miete kommen noch Gebühren für Müll und Wasser.","st":"Kiraya ayrıca çöp ve su ücretleri ekleniyor.","f":"gebührenfrei (ücretsiz) · die Kostenaufstellung (masraf dökümü) · der Beitrag (aidat)"},{"w":"die Mahngebühr","t":"Nomen, -en","k":"mahnen (uyarmak) + Gebühr","c":"die Mahngebühr, -en","br":"Ödeme gecikince eklenen ücret. Sıralama sabittir: Rechnung → Zahlungserinnerung (nazik hatırlatma) → Mahnung → Mahngebühr + Verzugszinsen → Inkasso.","tr":"gecikme ücreti","s":"Auf der Rechnung stehen jetzt zusätzlich fünf Euro Mahngebühr.","st":"Faturada şimdi ek olarak beş avro gecikme ücreti var.","f":"die Mahnung (ihtar) · die Zahlungserinnerung (ödeme hatırlatması) · das Inkasso (tahsilat)"},{"w":"das Konto sperren / freigeben","t":"Kollokation","k":"sperren (kapatmak) / freigeben (serbest bırakmak)","c":"sperrt – sperrte – hat gesperrt","br":"Kart kaybolunca ilk cümle budur: Ich möchte meine Karte sperren lassen. Karşıtı freigeben; aynı fiil çifti hesap ve erişim için de kullanılır.","tr":"hesabı/kartı bloke etmek ↔ açmak","s":"Ich habe meine Karte verloren und möchte sie sperren lassen.","st":"Kartımı kaybettim, bloke ettirmek istiyorum.","f":"die Sperrung (bloke) · das Sperrkonto (bloke hesap) · freigeben (serbest bırakmak)"},{"w":"bar ↔ mit Karte","t":"Ödeme biçimi","k":"bar (nakit) / die Karte","c":"—","br":"Kasada duyacağın soru: Bar oder mit Karte? Almanya’da nakit hâlâ yaygındır; bazı yerlerde uyarı asılıdır: Nur Barzahlung.","tr":"nakit ↔ kartla","s":"Zahlen Sie bar oder mit Karte?","st":"Nakit mi kartla mı ödeyeceksiniz?","f":"das Bargeld (nakit) · die EC-Karte (banka kartı) · kontaktlos (temassız)"},{"w":"die Quittung ↔ die Rechnung","t":"Belge çifti","k":"quittieren (aldığını onaylamak) / rechnen","c":"—","br":"Rechnung ödeme talebidir (henüz ödenmedi), Quittung ise ödendiğinin kanıtıdır. Vergi ve garanti için ikisi de saklanır.","tr":"makbuz (ödendi) ↔ fatura (ödenecek)","s":"Kann ich bitte eine Quittung bekommen?","st":"Bir makbuz alabilir miyim lütfen?","f":"der Kassenbon (kasa fişi) · der Beleg (belge) · bezahlen (ödemek)"},{"w":"das Sparkonto ↔ das Girokonto","t":"Hesap çifti","k":"sparen (biriktirmek) / giro (dolaşım)","c":"—","br":"Girokonto günlük dolaşım hesabıdır (maaş, kira, kart); Sparkonto ise biriktirme hesabı. Giro İtalyanca „dolaşım“ demektir — paranın döndüğü yer.","tr":"birikim hesabı ↔ vadesiz hesap","s":"Das Gehalt kommt aufs Girokonto, der Rest wandert aufs Sparkonto.","st":"Maaş vadesiz hesaba geliyor, kalanı birikim hesabına gidiyor.","f":"sparen (biriktirmek) · die Ersparnisse (birikim) · das Konto (hesap)"},{"w":"pfänden / die Pfändung","t":"Nomen + Verb","k":"Pfand (rehin) + -en","c":"pfändet – pfändete – hat gepfändet","br":"Alacaklının borçlunun malına ya da maaşına el koyması. Aynı kökten günlük hayattaki das Pfand: şişe depozitosu — ikisi de „geri alınmak üzere tutulan güvence“.","tr":"haciz koymak / haciz","s":"Ein Teil des Lohns kann gepfändet werden.","st":"Ücretin bir kısmına haciz konabilir.","f":"das Pfand (depozito; rehin) · die Pfändung (haciz) · der Gläubiger (alacaklı)"}]},{"n":"Aile ve sosyal ilişkiler","e":"Schwiegereltern, Sorgerecht, ledig, Bekannte…","c":"#8c5a7a","g":"Hukuk & idare dili","cards":[{"w":"die Schwiegereltern","t":"Nomen (çoğul)","k":"Schwieger- (evlilikle akraba) + Eltern","c":"die Schwiegereltern (Pl.)","br":"Schwieger- ön eki evlilikten doğan akrabalığı işaretler: Schwiegermutter, Schwiegersohn, Schwiegertochter. Kan bağı olanlar bu eki almaz.","tr":"kayınpeder ve kayınvalide","s":"Am Wochenende sind wir bei meinen Schwiegereltern.","st":"Hafta sonu kayınlarımdayız.","f":"die Schwiegermutter (kayınvalide) · der Schwager (kayınbirader) · die Schwägerin (görümce, baldız)"},{"w":"der Enkel ↔ der Neffe / die Nichte","t":"Akrabalık","k":"Enkel (torun) / Neffe (yeğen, erkek) / Nichte (yeğen, kız)","c":"der Enkel, - / der Neffe, -n / die Nichte, -n","br":"Türkçede „yeğen“ tek kelimedir, Almanca cinsiyete göre ayırır. Neffe n-Deklination’a girer: den Neffen, dem Neffen.","tr":"torun ↔ erkek yeğen / kız yeğen","s":"Mein Neffe kommt in die dritte Klasse, meine Nichte in die erste.","st":"Erkek yeğenim üçüncü sınıfa, kız yeğenim birinci sınıfa geçiyor.","f":"das Enkelkind (torun) · der Cousin (kuzen) · die Verwandten (akrabalar)"},{"w":"ledig ↔ verheiratet ↔ geschieden","t":"Medeni hâl","k":"ledig (bağsız) / Heirat (evlilik) / scheiden (ayırmak)","c":"—","br":"Formlarda Familienstand başlığı altında sorulur. ledig „hiç evlenmemiş“ demektir — boşanmış kişi ledig değil, geschieden’dir. Dördüncüsü: verwitwet (dul).","tr":"bekâr ↔ evli ↔ boşanmış","s":"Familienstand: geschieden, zwei Kinder.","st":"Medeni hâl: boşanmış, iki çocuk.","f":"der Familienstand (medeni hâl) · verwitwet (dul) · die Scheidung (boşanma)"},{"w":"der Bekannte ↔ der Freund","t":"İlişki çifti","k":"bekannt (tanınan) / Freund (arkadaş)","c":"der/die Bekannte (sıfat çekimli)","br":"Almanca bu ayrımı ciddiye alır: Bekannter tanıdıktır, Freund gerçek arkadaştır. Türkçedeki „arkadaş“ çoğu zaman Bekannter karşılığıdır. Ayrıca mein Freund sevgili anlamına da gelir.","tr":"tanıdık ↔ arkadaş","s":"Er ist eher ein Bekannter als ein Freund.","st":"O arkadaştan çok bir tanıdık.","f":"die Bekanntschaft (tanışıklık) · befreundet sein (arkadaş olmak) · der Kumpel (ahbap)"},{"w":"das Sorgerecht","t":"Nomen, -e","k":"Sorge (bakım) + Recht (hak)","c":"das Sorgerecht, -e","br":"Çocuğun bakımına ve onunla ilgili kararlara ilişkin hak. Boşanmada kural ortak velayettir (gemeinsames Sorgerecht); ziyaret hakkı ayrıdır: das Umgangsrecht.","tr":"velayet","s":"Die Eltern haben weiterhin das gemeinsame Sorgerecht.","st":"Ebeveynlerin ortak velayeti devam ediyor.","f":"das Umgangsrecht (kişisel ilişki hakkı) · die Sorge (bakım) · der Unterhalt (nafaka)"},{"w":"der Vormund ↔ der Betreuer","t":"Temsil çifti","k":"vor + Mund (eski: koruma) / betreuen (bakmak)","c":"—","br":"Vormund reşit olmayanın yasal temsilcisidir; Betreuer ise yetişkin biri kendi işlerini göremediğinde mahkemece atanır. İkisi de temsil eder ama farklı kişiler için.","tr":"vasi ↔ (yetişkin için) yasal bakıcı","s":"Das Gericht hat einen Betreuer für die Vermögensangelegenheiten bestellt.","st":"Mahkeme mal varlığı işleri için bir yasal bakıcı atadı.","f":"betreuen (bakmak, ilgilenmek) · die Betreuung (bakım) · bestellen (atamak)"},{"w":"die Patchworkfamilie","t":"Nomen, -n","k":"İngilizce patchwork (yama işi) + Familie","c":"die Patchworkfamilie, -n","br":"İngilizce patchwork, ayrı kumaş parçalarının dikilerek tek yorgan olmasıdır. Almanca bu imgeyi aileye taşımış: farklı ilişkilerden gelen çocukların tek çatı altında birleşmesi. Aynı alanın kelimeleri: der Stiefvater, die Halbschwester.","tr":"birleşik aile","s":"In einer Patchworkfamilie ist Organisation alles.","st":"Birleşik ailede her şey organizasyondur.","f":"der Stiefvater (üvey baba) · das Stiefkind (üvey çocuk) · die Halbschwester (üvey/yarı kız kardeş)"},{"w":"das Kindergeld","t":"Nomen (çoğulsuz)","k":"Kind (çocuk) + Geld (para)","c":"das Kindergeld","br":"Her çocuk için ödenen devlet desteği; Familienkasse üzerinden yürür. Eğitim sürerse 25 yaşına kadar devam eder — bu yüzden okul belgeleri sık istenir.","tr":"çocuk parası","s":"Das Kindergeld wird monatlich überwiesen.","st":"Çocuk parası aylık olarak yatırılıyor.","f":"die Familienkasse (aile kasası) · der Kinderzuschlag (çocuk ek ödemesi) · das Elterngeld (ebeveyn parası)"},{"w":"die Elternzeit","t":"Nomen, -en","k":"Eltern (anne baba) + Zeit","c":"die Elternzeit, -en","br":"Çocuk bakımı için işten ayrılmadan alınan izin; üç yıla kadar. Bu dönemde ödenen destek das Elterngeld’dir. İş yeri korunur, sözleşme askıya alınır.","tr":"ebeveyn izni","s":"Er nimmt zwei Monate Elternzeit.","st":"İki ay ebeveyn izni alıyor.","f":"das Elterngeld (ebeveyn parası) · die Auszeit (ara verme) · unbezahlt (ücretsiz)"},{"w":"der Umgang (mit Menschen)","t":"Nomen (çoğulsuz)","k":"um + gehen (etrafında dolaşmak)","c":"der Umgang","br":"Birinin insanlarla ilişki kurma biçimi: der Umgang mit Kindern. Aile hukukunda ise ziyaret hakkı anlamına gelir: das Umgangsrecht.","tr":"muamele, ilişki biçimi","s":"Sie hat einen sehr guten Umgang mit schwierigen Klassen.","st":"Zor sınıflarla ilişki kurmayı çok iyi biliyor.","f":"umgehen mit (muamele etmek) · umgänglich (geçimli) · der Umgangston (üslup)"},{"w":"die Rücksicht (sosyal)","t":"Nomen, -en","k":"Rück (geri) + Sicht (bakış)","c":"die Rücksicht, -en","br":"Komşuluk ve aile hayatının anahtar kavramı: dönüp ötekini görmek. Kalıp: Rücksicht nehmen auf. Karşıtı rücksichtslos, Almanya’da ağır bir sitemdir.","tr":"gözetme, saygı gösterme","s":"Ein bisschen mehr Rücksicht würde vieles einfacher machen.","st":"Biraz daha gözetmek çok şeyi kolaylaştırırdı.","f":"rücksichtsvoll (düşünceli) · rücksichtslos (pervasız) · berücksichtigen (dikkate almak)"},{"w":"sich vertragen ↔ streiten","t":"İlişki çifti","k":"ver + tragen (birbirini taşımak) / streiten","c":"verträgt – vertrug – hat vertragen","br":"Birbirini taşıyabilmek = geçinmek. Aynı kökten der Vertrag: iki tarafın birlikte taşıdığı yük. Karşıtı sich streiten: tartışmak, kavga etmek.","tr":"iyi geçinmek ↔ kavga etmek","s":"Die beiden vertragen sich wieder.","st":"İkisi yeniden iyi geçiniyor.","f":"der Vertrag (sözleşme) · der Streit (kavga) · sich versöhnen (barışmak)"},{"w":"die Nachbarschaft","t":"Nomen, -en","k":"nah (yakın) + Bauer/bar → Nachbar + -schaft","c":"die Nachbarschaft, -en","br":"Nachbar aslında „yakında oturan“ demektir. -schaft eki topluluk kurar: Nachbarschaft hem komşuluk ilişkisi hem çevredeki komşuların bütünü.","tr":"komşuluk; komşu çevresi","s":"In der Nachbarschaft kennt man sich noch.","st":"Bu komşulukta insanlar hâlâ birbirini tanıyor.","f":"der Nachbar (komşu) · nebenan (yan tarafta) · die Hausgemeinschaft (bina sakinleri)"},{"w":"der Verein","t":"Nomen, -e","k":"vereinen (birleştirmek)","c":"der Verein, -e","br":"Almanya’nın sosyal hayatının omurgası: spor, müzik, bahçe, kiracı derneği. Resmî kaydı olan biçimi e. V. (eingetragener Verein) kısaltmasıyla yazılır.","tr":"dernek, kulüp","s":"Mein Sohn ist seit zwei Jahren im Verein.","st":"Oğlum iki yıldır kulüpte.","f":"vereinen (birleştirmek) · das Mitglied (üye) · der Mitgliedsbeitrag (üyelik aidatı)"}]},{"n":"Gündelik işler: tamir, alışveriş, komşuluk","e":"Kostenvoranschlag, Gewährleistung, Ruhezeit…","c":"#7a5c3c","g":"Hukuk & idare dili","cards":[{"w":"der Handwerker","t":"Nomen, -","k":"Hand (el) + Werk (iş, eser) + -er","c":"der Handwerker, die Handwerker","br":"El işi yapan = usta, zanaatkâr. das Handwerk zanaatın kendisidir; Almanya’da meslek eğitimiyle korunan bir kurumdur.","tr":"usta, zanaatkâr","s":"Der Handwerker kommt am Donnerstag zwischen acht und zwölf.","st":"Usta perşembe sekizle on iki arasında geliyor.","f":"das Handwerk (zanaat) · der Betrieb (işletme) · die Reparatur (tamir)"},{"w":"der Kostenvoranschlag","t":"Nomen, ¨-e","k":"Kosten + vor (önceden) + Anschlag (tahmin, hesap)","c":"der Kostenvoranschlag, -schläge","br":"Masrafların önceden vurulan hesabı = keşif, fiyat teklifi. Bağlayıcı değildir; bağlayıcı olan das Festpreisangebot’tur — bu fark faturayı belirler.","tr":"maliyet tahmini, keşif","s":"Bitte erstellen Sie zunächst einen Kostenvoranschlag.","st":"Lütfen önce bir maliyet tahmini hazırlayın.","f":"das Angebot (teklif) · veranschlagen (tahmin etmek) · verbindlich (bağlayıcı)"},{"w":"die Gewährleistung","t":"Nomen, -en","k":"Gewähr (güvence) + leisten (yerine getirmek) + -ung","c":"die Gewährleistung, -en","br":"gewähren = bir hakkı tanımak. Satıcının yasal olarak yerine getirmek zorunda olduğu ayıp sorumluluğu. Garantie ise gönüllü ek taahhüttür — biri kanundan, öbürü sözden doğar.","tr":"yasal ayıp sorumluluğu","s":"Die Gewährleistung beträgt bei Neuware zwei Jahre.","st":"Yeni üründe yasal sorumluluk süresi iki yıldır.","f":"gewähren (tanımak, vermek) · die Garantie (garanti, gönüllü) · der Mangel (ayıp, kusur)"},{"w":"der Umtausch","t":"Nomen (çoğulsuz)","k":"um (değiştirerek) + Tausch (takas)","c":"der Umtausch","br":"Malı başkasıyla değiştirme. Dikkat: Almanya’da kusursuz ürünü değiştirmek yasal hak değil, mağazanın jestidir (Kulanz).","tr":"değişim, ürün değiştirme","s":"Ein Umtausch ist nur mit Kassenbon möglich.","st":"Değişim yalnızca fişle mümkün.","f":"umtauschen (değiştirmek) · der Kassenbon (kasa fişi) · die Kulanz (jest)"},{"w":"die Quittung","t":"Nomen, -en","k":"quittieren (aldığını onaylamak — quietus: ödenmiş)","c":"die Quittung, die Quittungen","br":"Latince „ödenmiş, aklanmış“: parayı aldığını onaylayan kâğıt. Mecazî kullanımı sert: die Quittung bekommen — hak ettiğini bulmak.","tr":"makbuz, fiş","s":"Bewahren Sie die Quittung für die Gewährleistung auf.","st":"Makbuzu yasal sorumluluk için saklayın.","f":"quittieren (imzalayıp almak) · der Beleg (belge) · der Kassenbon (kasa fişi)"},{"w":"die Anzahlung","t":"Nomen, -en","k":"an (kısmen) + zahlen (ödemek) + -ung","c":"die Anzahlung, -en","br":"an- ön eki kısmi hareket bildirir (anlesen: biraz okumak). Ödemenin bir kısmı = kapora. Kalan: die Restzahlung.","tr":"kapora, ön ödeme","s":"Eine Anzahlung von 30 Prozent ist üblich.","st":"Yüzde 30 kapora alışılmış bir şey.","f":"anzahlen (kapora vermek) · die Restzahlung (kalan ödeme) · die Rate (taksit)"},{"w":"die Hausordnung","t":"Nomen, -en","k":"Haus (ev) + Ordnung (düzen)","c":"die Hausordnung, -en","br":"Binanın iç kuralları. Kira sözleşmesinin eki olarak bağlayıcı hâle gelir; yasaya aykırı maddeleri geçersizdir.","tr":"bina yönetmeliği","s":"Laut Hausordnung ist das Grillen auf dem Balkon untersagt.","st":"Bina yönetmeliğine göre balkonda mangal yasak.","f":"die Ordnung (düzen) · untersagen (yasaklamak) · der Mietvertrag (kira sözleşmesi)"},{"w":"die Ruhezeit","t":"Nomen, -en","k":"Ruhe (sessizlik) + Zeit (zaman)","c":"die Ruhezeit, -en","br":"Gürültünün yasak olduğu saatler: genelde 22–06 ve öğle arası, pazar günü tam gün. Alman komşuluk hukukunun temel kavramı.","tr":"sessizlik saatleri","s":"Während der Ruhezeit sind Bohrarbeiten nicht zulässig.","st":"Sessizlik saatlerinde delme işleri caiz değil.","f":"die Ruhe (sessizlik) · die Nachtruhe (gece sessizliği) · die Lärmbelästigung (gürültü rahatsızlığı)"},{"w":"die Mülltrennung","t":"Nomen (çoğulsuz)","k":"Müll (çöp) + trennen (ayırmak) + -ung","c":"die Mülltrennung","br":"Çöpün türüne göre ayrılması. Renk sistemi: gelb (ambalaj), blau (kâğıt), braun (organik), schwarz (kalan).","tr":"çöp ayrıştırma","s":"Bei der Mülltrennung gibt es im Haus immer wieder Probleme.","st":"Binada çöp ayrıştırmada sürekli sorun çıkıyor.","f":"trennen (ayırmak) · der Restmüll (kalan çöp) · die Abfuhr (çöp toplama)"},{"w":"der Hausmeister","t":"Nomen, -","k":"Haus (ev) + Meister (usta)","c":"der Hausmeister, die Hausmeister","br":"Binanın ustası: küçük tamirler, ortak alanlar, sayaç okuma. Masrafı işletme gideri olarak kiracıya yansıtılabilir, ama tamiratı yansıtılamaz.","tr":"apartman görevlisi, kapıcı","s":"Melden Sie den Defekt bitte dem Hausmeister.","st":"Arızayı lütfen apartman görevlisine bildirin.","f":"der Meister (usta) · die Hausmeisterkosten (görevli masrafı) · umlagefähig (yansıtılabilir)"},{"w":"die Panne","t":"Nomen, -n","k":"Fransızca panne: arıza","c":"die Panne, die Pannen","br":"Aracın yolda kalması; mecazî olarak: aksama, terslik. Konuşma dilinde çok işlek.","tr":"arıza; aksilik","s":"Wegen einer Panne kam der Bus eine Stunde zu spät.","st":"Bir arıza yüzünden otobüs bir saat geç geldi.","f":"der Pannendienst (yol yardım) · die Störung (arıza) · reparieren (tamir etmek)"},{"w":"die Reklamation","t":"Nomen, -en","k":"re (geri) + clamare (bağırmak)","c":"die Reklamation, die Reklamationen","br":"Latince „geri bağırmak“: ayıplı mala itiraz. Aynı kökten Reklame (bağırarak duyurma = reklam) — ilginç biçimde iki zıt iş, tek kök.","tr":"ayıp bildirimi, şikâyet (ürün)","s":"Die Reklamation wurde ohne Diskussion anerkannt.","st":"Şikâyet tartışmasız kabul edildi.","f":"reklamieren (şikâyet etmek) · die Reklame (reklam) · beanstanden (kusur bildirmek)"},{"w":"die Wartung","t":"Nomen, -en","k":"warten (beklemek; bakım yapmak) + -ung","c":"die Wartung, die Wartungen","br":"warten eski anlamıyla „gözetmek, bakmak“tır (bkz. der Wärter: bekçi). Düzenli bakım = Wartung; arıza sonrası onarım = Reparatur.","tr":"periyodik bakım","s":"Die jährliche Wartung der Therme ist umlagefähig.","st":"Kombinin yıllık bakımı kiracıya yansıtılabilir.","f":"warten (bakım yapmak; beklemek) · der Wartungsvertrag (bakım sözleşmesi) · die Reparatur (tamir)"}]},{"n":"Enerji, ısıtma ve bina tekniği","e":"Dämmung, Verbrauch, Wärmepumpe, Betriebsstrom…","c":"#a2661f","g":"Hukuk & idare dili","cards":[{"w":"der Verbrauch","t":"Nomen (çoğulsuz)","k":"ver + brauchen (kullanmak)","c":"der Verbrauch","br":"brauchen = ihtiyaç duymak, kullanmak; ver- „tüketerek bitirme“ katar. Yan gider hesabının merkez kavramı: ölçülen tüketim.","tr":"tüketim","s":"Der Verbrauch lag im letzten Jahr deutlich über dem Durchschnitt.","st":"Tüketim geçen yıl ortalamanın belirgin şekilde üzerindeydi.","f":"verbrauchen (tüketmek) · der Verbraucher (tüketici) · verbrauchsabhängig (tüketime bağlı)"},{"w":"die Dämmung","t":"Nomen, -en","k":"dämmen (bent kurmak, tutmak) + -ung","c":"die Dämmung, -en","br":"dämmen = akışı bir bentle durdurmak (bkz. der Damm: set). Isının kaçışını durdurmak = yalıtım. Ses için de aynı kelime: Schalldämmung.","tr":"yalıtım","s":"Nach der Dämmung der Fassade sanken die Heizkosten spürbar.","st":"Cephe yalıtımından sonra ısıtma giderleri gözle görülür düştü.","f":"der Damm (set, bent) · dämmen (yalıtmak) · die Wärmedämmung (ısı yalıtımı)"},{"w":"die Wärmepumpe","t":"Nomen, -n","k":"Wärme (ısı) + Pumpe (pompa)","c":"die Wärmepumpe, -n","br":"Isıyı üretmez, dışarıdan içeri pompalar. Kelime çalışma ilkesini doğrudan söylüyor: ısı pompası.","tr":"ısı pompası","s":"Die Wärmepumpe arbeitet auch bei niedrigen Außentemperaturen.","st":"Isı pompası düşük dış sıcaklıklarda da çalışıyor.","f":"die Wärme (ısı) · warm (sıcak) · die Heizung (kalorifer)"},{"w":"die Heizkostenabrechnung","t":"Nomen, -en","k":"heizen (ısıtmak) + Kosten + Abrechnung","c":"die Heizkostenabrechnung, -en","br":"Sağdan sola çöz: hesap → neyin? → ısıtma masraflarının. Yasaya göre en az yüzde 50’si tüketime göre dağıtılmalıdır — sabit dağıtım tek başına hatalıdır.","tr":"ısıtma gideri hesabı","s":"Die Heizkostenabrechnung muss mindestens zu 50 Prozent verbrauchsabhängig sein.","st":"Isıtma gideri hesabının en az yüzde 50’si tüketime bağlı olmalıdır.","f":"heizen (ısıtmak) · die Heizkostenverordnung (ısıtma gideri yönetmeliği) · verbrauchsabhängig (tüketime bağlı)"},{"w":"der Betriebsstrom","t":"Nomen (çoğulsuz)","k":"Betrieb (işletme) + Strom (elektrik)","c":"der Betriebsstrom","br":"Kalorifer tesisatının kendi çalışması için harcadığı elektrik. Ayrı sayaç yoksa tahmini oran (genelde %3–5) kullanılır — hesaplarda sık tartışma konusu.","tr":"tesisatın işletme elektriği","s":"Der Betriebsstrom der Heizung darf nicht doppelt abgerechnet werden.","st":"Kaloriferin işletme elektriği çift kez hesaba yazılamaz.","f":"der Strom (elektrik; akıntı) · der Betrieb (işletme) · der Allgemeinstrom (ortak alan elektriği)"},{"w":"die Zwischenablesung","t":"Nomen, -en","k":"zwischen (ara) + ablesen (okumak) + -ung","c":"die Zwischenablesung, -en","br":"Dönem ortasında, örneğin taşınma gününde yapılan sayaç okuması. Doğru bölüşmenin tek dayanağı budur; yapılmazsa masraf gün sayısına göre tahmin edilir.","tr":"ara sayaç okuması","s":"Beim Auszug wurde eine Zwischenablesung vorgenommen.","st":"Taşınırken ara sayaç okuması yapıldı.","f":"ablesen (okumak) · der Zählerstand (sayaç değeri) · die Schlussrechnung (kapanış faturası)"},{"w":"die Grundgebühr","t":"Nomen, -en","k":"Grund (temel) + Gebühr (ücret)","c":"die Grundgebühr, -en","br":"Tüketimden bağımsız sabit ücret. Faturada iki kalem vardır: sabit Grundgebühr ve değişken Arbeitspreis — biri bağlantı için, öbürü kullanılan miktar için.","tr":"sabit abonelik ücreti","s":"Neben der Grundgebühr wird der tatsächliche Verbrauch berechnet.","st":"Sabit ücretin yanında gerçek tüketim de hesaplanıyor.","f":"die Gebühr (ücret) · der Arbeitspreis (birim tüketim ücreti) · der Abschlag (ara ödeme)"},{"w":"erneuerbare Energien","t":"Nomen (çoğul)","k":"erneuern (yenilemek) + -bar + Energie","c":"die erneuerbaren Energien (Pl.)","br":"-bar eki yine „…ebilir“: kendini yenileyebilen kaynaklar. Karşıtı fossile Energieträger — bir kez tükenince biter.","tr":"yenilenebilir enerjiler","s":"Der Anteil erneuerbarer Energien ist deutlich gestiegen.","st":"Yenilenebilir enerjilerin payı belirgin şekilde arttı.","f":"erneuern (yenilemek) · erneut (yeniden) · fossil (fosil)"},{"w":"die Nachhaltigkeit","t":"Nomen (çoğulsuz)","k":"nach + halten (tutmak) + -ig + -keit","c":"die Nachhaltigkeit","br":"Ormancılıktan gelir: ancak yeniden yetişecek kadar kesmek, yani etkisi „sonradan da tutan“ kullanım. Bugünkü çevre dilinin merkez kavramı.","tr":"sürdürülebilirlik","s":"Nachhaltigkeit ist inzwischen fester Bestandteil des Lehrplans.","st":"Sürdürülebilirlik artık müfredatın sabit parçası.","f":"nachhaltig (kalıcı, sürdürülebilir) · halten (tutmak) · langfristig (uzun vadeli)"},{"w":"der Schadstoff","t":"Nomen, -e","k":"Schaden (zarar) + Stoff (madde)","c":"der Schadstoff, die Schadstoffe","br":"Zarar maddesi. -stoff eki madde adı üretir: Baustoff, Brennstoff, Kunststoff, Rohstoff — hepsi „hangi işin maddesi“ sorusunu yanıtlar.","tr":"zararlı madde","s":"Die Messung ergab erhöhte Schadstoffwerte im Klassenraum.","st":"Ölçüm sınıfta yüksek zararlı madde değerleri gösterdi.","f":"der Schaden (zarar) · der Brennstoff (yakıt) · der Rohstoff (hammadde) · der Kunststoff (plastik)"},{"w":"die Sanierung","t":"Nomen, -en","k":"sanare (iyileştirmek — sanus: sağlıklı)","c":"die Sanierung, -en","br":"Latince sanare iyileştirmek, sanus ise sağlıklı demektir (bkz. der Sanitäter: sağlık görevlisi). Yani binayı „sağlığına kavuşturmak“ — tek bir tamir değil, kapsamlı yenileme. Fiil hâli sanieren; şirketler için de kullanılır.","tr":"esaslı yenileme, tadilat","s":"Die energetische Sanierung des Gebäudes beginnt im Frühjahr.","st":"Binanın enerji yenilemesi ilkbaharda başlıyor.","f":"sanieren (yenilemek) · die Modernisierung (modernizasyon) · die Instandsetzung (onarım)"},{"w":"der Schimmel","t":"Nomen (çoğulsuz)","k":"schimmeln (küflenmek)","c":"der Schimmel","br":"Kira uyuşmazlıklarının en sık konusu. Belirleyici soru sorumluluktur: yapı kusuru mu (ev sahibi) yoksa yanlış havalandırma mı (kiracı) — bunu genelde bilirkişi raporu çözer.","tr":"küf","s":"Bei Schimmelbefall ist eine Mietminderung grundsätzlich möglich.","st":"Küf oluşumunda kira indirimi kural olarak mümkündür.","f":"schimmeln (küflenmek) · lüften (havalandırmak) · die Feuchtigkeit (nem)"},{"w":"lüften","t":"Verb","k":"Luft (hava) + -en","c":"lüftet – lüftete – hat gelüftet","br":"Havayı değiştirmek. Almanya’da bir teknik terime dönüşmüştür: Stoßlüften (pencereyi tam açıp kısa süre) — kiracının yükümlülüğü genelde bu şekilde tanımlanır.","tr":"havalandırmak","s":"Es wird empfohlen, dreimal täglich stoßzulüften.","st":"Günde üç kez tam açarak havalandırmak öneriliyor.","f":"die Luft (hava) · das Stoßlüften (tam açıp havalandırma) · die Belüftung (havalandırma sistemi)"},{"w":"die Abnahme","t":"Nomen, -n","k":"ab + nehmen (almak)","c":"die Abnahme, -n","br":"İşi teslim alıp „kabul etmek“: inşaatta bu an hukuken kritiktir — Abnahme ile birlikte garanti süresi başlar ve ispat yükü el değiştirir.","tr":"kabul, teslim alma","s":"Mit der Abnahme beginnt die Gewährleistungsfrist.","st":"Kabul ile birlikte garanti süresi başlar.","f":"abnehmen (kabul etmek; azalmak) · das Abnahmeprotokoll (kabul tutanağı) · die Gewährleistung (yasal sorumluluk)"}]},{"n":"Sağlık ve kurum dili","e":"Krankenkasse, Attest, Befund, Zuzahlung…","c":"#1f7a8c","g":"Hukuk & idare dili","cards":[{"w":"die Krankenkasse","t":"Nomen, -n","k":"Kranke (hasta) + Kasse (kasa, sandık)","c":"die Krankenkasse, -n","br":"Kasse = ortak sandık. Hastalık için ortak kurulan sandık = sağlık sigortası kurumu. Almanya’da gesetzlich (yasal) ve privat (özel) diye ikiye ayrılır.","tr":"sağlık sigortası kurumu","s":"Die Krankenkasse übernimmt die Kosten nur teilweise.","st":"Sağlık sigortası masrafları yalnızca kısmen üstleniyor.","f":"die Kasse (kasa) · gesetzlich versichert (yasal sigortalı) · die Versicherung (sigorta)"},{"w":"die Krankmeldung","t":"Nomen, -en","k":"krank (hasta) + melden (bildirmek) + -ung","c":"die Krankmeldung, -en","br":"Hastalığın işverene bildirilmesi. Resmî belgesi Arbeitsunfähigkeitsbescheinigung’dur — „çalışamaz olma belgesi“, yani üç parçalı bir tanım.","tr":"hastalık bildirimi, rapor","s":"Die Krankmeldung muss spätestens am vierten Tag vorliegen.","st":"Rapor en geç dördüncü günde elde olmalı.","f":"melden (bildirmek) · die Arbeitsunfähigkeit (çalışamama hâli) · sich krankmelden (rapor almak)"},{"w":"das Attest","t":"Nomen, -e","k":"attestari (tanıklık etmek — testis: tanık)","c":"das Attest, die Atteste","br":"Latince „tanıklık“: hekimin bir duruma tanıklık ettiği yazı. Almanca eşdeğeri die Bescheinigung, aynı işi görür ama her alanda kullanılır.","tr":"doktor raporu, belge","s":"Für die Befreiung vom Sportunterricht ist ein Attest erforderlich.","st":"Beden dersinden muafiyet için doktor raporu gerekiyor.","f":"bescheinigen (belgelemek) · die Bescheinigung (belge) · attestieren (tasdik etmek)"},{"w":"die Bescheinigung","t":"Nomen, -en","k":"be + scheinen (görünmek, ışımak) + -ung","c":"die Bescheinigung, -en","br":"scheinen = görünmek; bescheinigen = bir şeyi resmen görünür kılmak, tasdik etmek. Bürokrasinin en genel belge kelimesi.","tr":"belge, tasdikname","s":"Eine Bescheinigung über die Teilnahme erhalten Sie am Ende.","st":"Katılım belgesini sonunda alacaksınız.","f":"bescheinigen (belgelemek) · der Nachweis (kanıt belge) · die Teilnahmebescheinigung (katılım belgesi)"},{"w":"der Befund","t":"Nomen, -e","k":"be + finden (bulmak)","c":"der Befund, die Befunde","br":"Muayenede bulunan şey = bulgu. „ohne Befund“ (o. B.) = bir şey bulunmadı. Aynı kökten sich befinden: bir durumda bulunmak.","tr":"bulgu, tetkik sonucu","s":"Der Befund liegt seit gestern vor.","st":"Tetkik sonucu dünden beri elde.","f":"befinden (bulmak, karar vermek) · sich befinden (bulunmak) · ohne Befund (bulgu yok)"},{"w":"die Behandlung","t":"Nomen, -en","k":"be + handeln (eylemek, el ile yapmak) + -ung","c":"die Behandlung, -en","br":"Hand = el; handeln = elle iş görmek. Birine el ile müdahale = tedavi; genel anlamda: muamele.","tr":"tedavi; muamele","s":"Die Behandlung dauert voraussichtlich sechs Wochen.","st":"Tedavi tahminen altı hafta sürecek.","f":"behandeln (tedavi etmek; ele almak) · die Hand (el) · die Gleichbehandlung (eşit muamele)"},{"w":"das Rezept","t":"Nomen, -e","k":"recipere (almak) → recipe: „al!“","c":"das Rezept, die Rezepte","br":"Latince buyruk kipi „al“: eczacıya verilen alma talimatı = reçete. Mutfakta da aynı kelime: ne alacağının listesi.","tr":"reçete; yemek tarifi","s":"Dieses Medikament gibt es nur auf Rezept.","st":"Bu ilaç yalnızca reçeteyle veriliyor.","f":"rezeptpflichtig (reçeteye tabi) · verschreiben (reçete yazmak) · die Vorschrift (talimat)"},{"w":"die Praxis","t":"Nomen, Praxen","k":"praxis (eylem, uygulama)","c":"die Praxis, die Praxen","br":"Yunanca „uygulama“: hekimin mesleği uyguladığı yer = muayenehane. Aynı kelime „pratik, uygulama“ demektir; çoğulu ayrımı belirler: Praxen (muayenehaneler).","tr":"muayenehane; uygulama, pratik","s":"Die Praxis ist freitags nur vormittags geöffnet.","st":"Muayenehane cuma günleri yalnızca sabah açık.","f":"praktisch (pratik) · in der Praxis (uygulamada) · die Theorie (kuram)"},{"w":"der Facharzt","t":"Nomen, ¨-e","k":"Fach (alan, branş) + Arzt (hekim)","c":"der Facharzt, die Fachärzte","br":"Fach = bölme, uzmanlık alanı (bkz. Fachlehrer, Fachwissen). Alan hekimi = uzman hekim; sevk için Überweisung gerekir.","tr":"uzman hekim","s":"Für den Facharzt brauchen Sie eine Überweisung.","st":"Uzman hekim için sevk belgesine ihtiyacınız var.","f":"das Fach (branş) · die Überweisung (sevk; havale) · der Hausarzt (aile hekimi)"},{"w":"die Notaufnahme","t":"Nomen, -n","k":"Not (sıkıntı, acil) + Aufnahme (kabul)","c":"die Notaufnahme, -n","br":"Not = darlık, sıkıntı (bkz. Notfall, Notausgang, notwendig: sıkıntıyı çeviren). Acil kabul birimi.","tr":"acil servis","s":"Wir mussten am Wochenende in die Notaufnahme.","st":"Hafta sonu acile gitmek zorunda kaldık.","f":"der Notfall (acil durum) · notwendig (gerekli) · die Aufnahme (kabul)"},{"w":"die Vorsorge","t":"Nomen, -n","k":"vor (önceden) + Sorge (bakım, kaygı)","c":"die Vorsorge, -n","br":"Önceden bakım = koruyucu tedbir. Sağlıkta tarama, hukukta Vorsorgevollmacht: gelecekteki durum için verilen vekâlet.","tr":"koruyucu tedbir, önlem","s":"Die jährliche Vorsorge wird von der Kasse bezahlt.","st":"Yıllık kontrol sigorta tarafından ödeniyor.","f":"vorsorgen (önceden tedbir almak) · die Vorsorgevollmacht (gelecek için vekâlet) · vorbeugen (önlemek)"},{"w":"die Zuzahlung","t":"Nomen, -en","k":"zu (ek olarak) + zahlen (ödemek) + -ung","c":"die Zuzahlung, -en","br":"Sigortanın üstüne hastanın eklediği pay = katkı payı. Aynı kalıp: Zuschuss (ek destek), Zuschlag (ek ücret).","tr":"katkı payı","s":"Für dieses Hilfsmittel fällt eine Zuzahlung von zehn Euro an.","st":"Bu yardımcı araç için on avro katkı payı doğuyor.","f":"der Zuschuss (destek ödemesi) · der Zuschlag (ek ücret) · befreit (muaf)"},{"w":"der Pflegegrad","t":"Nomen, -e","k":"Pflege (bakım) + Grad (derece)","c":"der Pflegegrad, die Pflegegrade","br":"pflegen = bakmak, özenle sürdürmek. Bakım ihtiyacının derecesi 1–5 arasında belirlenir ve alınacak desteği tayin eder.","tr":"bakım derecesi","s":"Der Pflegegrad wird vom Medizinischen Dienst festgestellt.","st":"Bakım derecesi tıbbi hizmet birimi tarafından belirleniyor.","f":"pflegen (bakmak) · die Pflege (bakım) · pflegebedürftig (bakıma muhtaç)"},{"w":"die Genesung","t":"Nomen, -en","k":"genesen (iyileşmek) + -ung","c":"die Genesung, -en","br":"genesen eski bir güçlü fiildir: sağlığına kavuşmak. Dilek kalıbı standarttır: Gute Besserung ya da baldige Genesung.","tr":"iyileşme, şifa bulma","s":"Wir wünschen Ihnen eine baldige Genesung.","st":"Size acil şifalar dileriz.","f":"genesen (iyileşmek) · die Besserung (düzelme) · der Genesende (iyileşmekte olan)"}]},{"n":"Sağlık: şikâyet ve muayene","e":"Beschwerden, Fieber, Termin, Überweisung…","c":"#4f7a86","g":"Hukuk & idare dili","cards":[{"w":"die Beschwerden (Medizin)","t":"Nomen (çoğul)","k":"be + schwer (ağır) + -en","c":"die Beschwerden (Pl.)","br":"Aynı kelime hem resmî şikâyet hem tıbbi yakınma demektir; kök aynı: içindeki ağırlığı dile getirmek. Muayenede ilk soru budur: Welche Beschwerden haben Sie?","tr":"şikâyetler, yakınmalar","s":"Seit wann haben Sie diese Beschwerden?","st":"Bu şikâyetleriniz ne zamandan beri var?","f":"schwer (ağır) · sich beschweren (şikâyet etmek) · die Schmerzen (ağrılar)"},{"w":"die Schmerzen","t":"Nomen (çoğul)","k":"Schmerz (acı)","c":"die Schmerzen (Pl.)","br":"Vücut bölgesiyle birleşerek kelime üretir: Kopfschmerzen, Rückenschmerzen, Bauchschmerzen, Halsschmerzen, Zahnschmerzen. Bir kalıp öğrenince hepsi çözülür.","tr":"ağrılar","s":"Ich habe seit gestern starke Kopfschmerzen.","st":"Dünden beri şiddetli baş ağrım var.","f":"schmerzhaft (acı veren) · das Schmerzmittel (ağrı kesici) · weh tun (acımak)"},{"w":"das Fieber ↔ die Erkältung","t":"Belirti çifti","k":"Fieber (ateş) / kalt (soğuk) → erkälten","c":"—","br":"erkälten „soğuk almak“ demektir — Türkçedeki „üşütmek“ ile birebir aynı mantık. Fieber ölçülen ateştir; kalıp: Fieber messen, Fieber haben.","tr":"ateş ↔ soğuk algınlığı","s":"Er hat leichtes Fieber und eine Erkältung.","st":"Hafif ateşi ve soğuk algınlığı var.","f":"sich erkälten (üşütmek) · das Fieberthermometer (derece) · der Husten (öksürük)"},{"w":"die Sprechstunde (Arzt)","t":"Nomen, -n","k":"sprechen + Stunde","c":"die Sprechstunde, -n","br":"Muayene saatleri. Randevusuz gelinen saat ise die offene Sprechstunde. Acil durumda hafta sonu için: der ärztliche Bereitschaftsdienst (116117).","tr":"muayene saatleri","s":"Die Sprechstunde ist montags von acht bis zwölf.","st":"Muayene saatleri pazartesileri sekizden on ikiye.","f":"der Termin (randevu) · die Praxis (muayenehane) · der Notdienst (nöbetçi hizmet)"},{"w":"die Überweisung (Arzt)","t":"Nomen, -en","k":"über + weisen (yöneltmek)","c":"die Überweisung, -en","br":"Aile hekiminin uzmana yönlendirme belgesi. Aynı kelimenin banka anlamıyla kökü aynı: bir yerden öbürüne yöneltmek.","tr":"sevk (uzman hekime)","s":"Für den Facharzt brauchen Sie eine Überweisung vom Hausarzt.","st":"Uzman hekim için aile hekiminden sevk gerekiyor.","f":"der Hausarzt (aile hekimi) · der Facharzt (uzman) · überweisen (yönlendirmek)"},{"w":"die Krankmeldung (AU)","t":"Nomen, -en","k":"krank + melden → Arbeitsunfähigkeitsbescheinigung","c":"die Krankmeldung, -en","br":"Resmî adı uzun ama şeffaftır: Arbeits-un-fähigkeits-bescheinigung = çalışamaz olma belgesi. İşverene en geç dördüncü günde ulaşmalı; sözleşme daha erken isteyebilir.","tr":"istirahat raporu","s":"Die Krankmeldung schicke ich der Schule noch heute.","st":"Raporu bugün okula göndereceğim.","f":"arbeitsunfähig (çalışamaz durumda) · sich krankmelden (rapor bildirmek) · der Arbeitgeber (işveren)"},{"w":"die Impfung","t":"Nomen, -en","k":"impfen (aşılamak)","c":"die Impfung, -en","br":"Kelime bahçıvanlıktan gelir: impfen aslında „aşı yapmak, çelik dikmek“ demekti — bitkiye yapılan aşı ile insana yapılan aynı kelimeyi paylaşır.","tr":"aşı","s":"Die Impfung wird im Impfpass eingetragen.","st":"Aşı, aşı kartına işleniyor.","f":"impfen (aşılamak) · der Impfpass (aşı kartı) · die Auffrischung (hatırlatma dozu)"},{"w":"die Vorsorgeuntersuchung","t":"Nomen, -en","k":"Vorsorge (önlem) + Untersuchung (muayene)","c":"die Vorsorgeuntersuchung, -en","br":"Şikâyet olmadan yapılan kontrol; sigorta karşılar. Çocuklarda U-Untersuchungen (U1–U9) diye numaralanır ve okul kaydında sorulur.","tr":"kontrol muayenesi, tarama","s":"Die Vorsorgeuntersuchung übernimmt die Krankenkasse.","st":"Kontrol muayenesini sağlık sigortası karşılıyor.","f":"die Vorsorge (önlem) · untersuchen (incelemek) · der Check-up (kontrol)"},{"w":"die Apotheke","t":"Nomen, -n","k":"apotheke (Yunanca: depo)","c":"die Apotheke, -n","br":"Yunanca „depo“ kökünden. Almanya’da reçeteli ilaç yalnızca eczaneden alınır; drogerie ise kozmetik ve serbest ürün satar — ikisi karıştırılmamalı. Nöbetçi: die Notdienstapotheke.","tr":"eczane","s":"Die Apotheke gegenüber hat heute Notdienst.","st":"Karşıdaki eczane bugün nöbetçi.","f":"die Drogerie (kozmetik marketi) · rezeptpflichtig (reçeteli) · das Medikament (ilaç)"},{"w":"die Packungsbeilage","t":"Nomen, -n","k":"Packung (kutu) + Beilage (ek)","c":"die Packungsbeilage, -n","br":"İlacın içindeki bilgi kâğıdı. Üstündeki standart uyarı Almanya’da bir deyim hâline gelmiştir: „Zu Risiken und Nebenwirkungen lesen Sie die Packungsbeilage.“","tr":"prospektüs","s":"Die Nebenwirkungen stehen in der Packungsbeilage.","st":"Yan etkiler prospektüste yazıyor.","f":"die Nebenwirkung (yan etki) · die Dosierung (doz) · die Beilage (ek)"},{"w":"die Nebenwirkung","t":"Nomen, -en","k":"neben (yan) + Wirkung (etki)","c":"die Nebenwirkung, -en","br":"Asıl etkinin yanında ortaya çıkan etki. neben- ön eki „ikincil, yan“ anlamı verir: Nebenkosten, Nebenjob, Nebensache.","tr":"yan etki","s":"Das Mittel wirkt gut, hat aber Nebenwirkungen.","st":"İlaç iyi etki ediyor ama yan etkileri var.","f":"die Wirkung (etki) · der Nebenjob (ek iş) · die Nebensache (tali mesele)"},{"w":"die Krankschreibung ↔ die Genesung","t":"Süreç çifti","k":"krank + schreiben / genesen (iyileşmek)","c":"—","br":"Krankschreibung hekimin yazılı olarak dinlenme vermesidir; Genesung ise sürecin sonucudur. Kalıp: krankgeschrieben sein — raporlu olmak.","tr":"rapor verilmesi ↔ iyileşme","s":"Ich bin noch bis Freitag krankgeschrieben.","st":"Cumaya kadar hâlâ raporluyum.","f":"krankschreiben (rapor vermek) · gesund (sağlıklı) · sich erholen (toparlanmak)"},{"w":"die Terminvergabe","t":"Nomen, -n","k":"Termin + Vergabe (verilme)","c":"die Terminvergabe, -n","br":"Randevu verme sistemi. Uzman hekimde uzun bekleme olursa devlet destekli hat devreye girer: die Terminservicestelle (116117).","tr":"randevu verme, randevu sistemi","s":"Die Terminvergabe läuft nur online.","st":"Randevu verme yalnızca internetten yürüyor.","f":"vergeben (vermek, tahsis etmek) · der Termin (randevu) · die Wartezeit (bekleme süresi)"},{"w":"der Notfall ↔ der Notdienst","t":"Acil çifti","k":"Not (sıkıntı) + Fall / Dienst","c":"—","br":"Not = darlık, sıkıntı. Notfall gerçek acil durumdur (112), Notdienst ise mesai dışı nöbet hizmetidir (116117). Yanlış numara sistemi tıkar; ayrım önemlidir.","tr":"acil durum ↔ nöbetçi hizmet","s":"Im Notfall wählen Sie 112, sonst 116117.","st":"Acil durumda 112’yi, aksi hâlde 116117’yi arayın.","f":"der Notruf (acil çağrı) · die Notaufnahme (acil servis) · notwendig (gerekli)"}]},{"n":"Restoran ve dışarıda yemek","e":"reservieren, bestellen, getrennt zahlen…","c":"#9c5a3a","g":"Hukuk & idare dili","cards":[{"w":"reservieren","t":"Verb","k":"reservare (saklamak, ayırmak)","c":"reserviert – reservierte – hat reserviert","br":"Latince reservare: geri ayırıp saklamak (re + servare). Yani bir yeri başkasına verilmeyecek şekilde ayırtmak. Aynı kökten die Reserve (yedek) ve das Reservat. İsim hâli die Reservierung; kısa cevabı: reserviert.","tr":"yer ayırtmak","s":"Ich möchte einen Tisch für vier Personen reservieren.","st":"Dört kişilik bir masa ayırtmak istiyorum.","f":"die Reservierung (rezervasyon) · der Tisch (masa) · besetzt (dolu)"},{"w":"die Speisekarte","t":"Nomen, -n","k":"Speise (yemek) + Karte (kart)","c":"die Speisekarte, -n","br":"Yemek listesi; içecekler ayrı listede olabilir: die Getränkekarte. Günün menüsü ise das Tagesgericht ya da die Tageskarte.","tr":"menü, yemek listesi","s":"Könnten wir bitte die Speisekarte haben?","st":"Menüyü alabilir miyiz lütfen?","f":"die Getränkekarte (içecek listesi) · das Tagesgericht (günün yemeği) · die Vorspeise (başlangıç)"},{"w":"bestellen (Restaurant)","t":"Verb","k":"be + stellen (koymak)","c":"bestellt – bestellte – hat bestellt","br":"Siparişi ortaya koymak. Garsonun sorusu: Was darf ich Ihnen bringen? Cevap kalıbı: Ich hätte gern … (Konjunktiv nezaketi).","tr":"sipariş vermek","s":"Ich hätte gern die Suppe und ein Wasser.","st":"Çorba ve bir su alayım.","f":"die Bestellung (sipariş) · die Bedienung (servis; garson) · servieren (servis etmek)"},{"w":"getrennt ↔ zusammen zahlen","t":"Ödeme çifti","k":"trennen (ayırmak) / zusammen (birlikte)","c":"—","br":"Almanya’da hesap masaya tek gelmez; garson sorar: Zusammen oder getrennt? Herkes kendi payını ödeyebilir — bu kültürel olarak normaldir.","tr":"ayrı ↔ birlikte ödemek","s":"Getrennt, bitte — ich zahle nur die Suppe.","st":"Ayrı olsun lütfen — ben yalnızca çorbayı ödüyorum.","f":"trennen (ayırmak) · die Rechnung (hesap) · zahlen (ödemek)"},{"w":"das Trinkgeld","t":"Nomen, -er","k":"trinken (içmek) + Geld (para)","c":"das Trinkgeld, -er","br":"Kelimenin içinde eski âdet var: „içki parası“. Bugün bahşiş; yaklaşık yüzde 5–10. Verme biçimi kalıptır: toplamı yukarı yuvarlayıp „Stimmt so“ denir.","tr":"bahşiş","s":"Machen Sie bitte 30 — stimmt so.","st":"30 yapın lütfen — üstü kalsın.","f":"stimmt so (üstü kalsın) · aufrunden (yukarı yuvarlamak) · die Bedienung (servis)"},{"w":"die Bedienung","t":"Nomen, -en","k":"bedienen (hizmet etmek)","c":"die Bedienung, -en","br":"Hem servis hizmeti hem servisi yapan kişi. Cihazlarda ise kullanım demektir: die Bedienungsanleitung (kullanım kılavuzu).","tr":"servis; garson","s":"Die Bedienung war heute besonders freundlich.","st":"Servis bugün özellikle güler yüzlüydü.","f":"bedienen (hizmet etmek) · die Bedienungsanleitung (kullanım kılavuzu) · der Kellner (garson)"},{"w":"die Vorspeise ↔ die Nachspeise","t":"Menü sırası","k":"vor / nach + Speise (yemek)","c":"—","br":"Menü sırası ön eklerle kurulur: Vorspeise → Hauptgericht → Nachspeise (ya da das Dessert). Ön eki bilen sırayı bilir.","tr":"başlangıç ↔ tatlı","s":"Als Vorspeise nehmen wir den Salat.","st":"Başlangıç olarak salatayı alıyoruz.","f":"das Hauptgericht (ana yemek) · das Dessert (tatlı) · die Beilage (garnitür)"},{"w":"die Portion ↔ die Beilage","t":"Servis çifti","k":"portio (pay) / bei + legen","c":"—","br":"Portion payına düşen miktardır; Beilage ise yanına konan garnitür. Küçük porsiyon: kleine Portion; çocuk için: der Kinderteller.","tr":"porsiyon ↔ garnitür","s":"Die Portionen sind hier ziemlich groß.","st":"Porsiyonlar burada epey büyük.","f":"der Teller (tabak) · satt (tok) · nachbestellen (ek sipariş vermek)"},{"w":"scharf ↔ mild (yemek)","t":"Tat çifti","k":"scharf (keskin, acı) / mild (yumuşak)","c":"—","br":"Acı biber anlamındaki „acı“ scharf’tır; bitter ise kahve ve çikolatanın acılığıdır. Sipariş verirken kritik ayrım: nicht zu scharf, bitte.","tr":"acı (baharatlı) ↔ hafif","s":"Bitte nicht zu scharf.","st":"Lütfen çok acı olmasın.","f":"bitter (acı, kahve gibi) · würzig (baharatlı) · die Schärfe (acılık)"},{"w":"vegetarisch ↔ vegan","t":"Beslenme çifti","k":"vegetarisch (etsiz) / vegan (hayvansal ürünsüz)","c":"—","br":"Vegetarisch ette yok, süt ve yumurta olabilir; vegan hiçbir hayvansal ürün içermez. Menülerde simgeyle gösterilir; ayrıca sorulur: Ist da Schweinefleisch drin?","tr":"vejetaryen ↔ vegan","s":"Haben Sie auch vegetarische Gerichte?","st":"Vejetaryen yemekleriniz de var mı?","f":"fleischlos (etsiz) · das Schweinefleisch (domuz eti) · die Zutaten (içindekiler)"},{"w":"zum Mitnehmen","t":"Kalıp","k":"mit + nehmen (yanına almak)","c":"—","br":"Paket servis kalıbı: Zum Mitnehmen, bitte. Karşıtı: zum Hieressen. Artan yemeği paketletmek de aynı fiille: Können Sie das einpacken?","tr":"paket olarak, götürmek üzere","s":"Einen Kaffee zum Mitnehmen, bitte.","st":"Bir kahve, paket olsun lütfen.","f":"einpacken (paketlemek) · zum Hieressen (burada yemek için) · die Lieferung (teslimat)"},{"w":"Ich hätte gern …","t":"Sipariş kalıbı","k":"haben → hätte (Konjunktiv II) + gern","c":"—","br":"Sipariş vermenin nazik yolu. Doğrudan Ich will kaba durur; Ich nehme … da yaygındır ama Ich hätte gern en kibarıdır.","tr":"… alayım / rica etsem","s":"Ich hätte gern die Nummer sieben, bitte.","st":"Yedi numarayı alayım lütfen.","f":"nehmen (almak) · bestellen (sipariş etmek) · bitte (lütfen)"},{"w":"Hat es geschmeckt?","t":"Kalıp","k":"schmecken (tadı olmak)","c":"—","br":"Garsonun standart sorusu. Cevap kalıpları: Sehr gut, danke / Es war lecker. schmecken Dativ alır: Das schmeckt mir.","tr":"Beğendiniz mi? / Nasıldı?","s":"Hat es Ihnen geschmeckt? — Sehr gut, danke.","st":"Beğendiniz mi? — Çok güzeldi, teşekkürler.","f":"schmecken (tat vermek) · lecker (lezzetli) · das Kompliment (iltifat)"},{"w":"Die Rechnung, bitte.","t":"Kalıp","k":"Rechnung (hesap)","c":"—","br":"Hesap istemenin standart cümlesi; daha kibarı: Könnten wir bitte zahlen? Almanya’da hesap istenmeden getirilmez — beklemek işe yaramaz.","tr":"Hesap lütfen.","s":"Wir würden gern zahlen — die Rechnung, bitte.","st":"Ödemek istiyoruz — hesap lütfen.","f":"zahlen (ödemek) · die Quittung (makbuz) · bar oder mit Karte (nakit mi kartla mı)"}]},{"n":"Dijital dil ve veri koruma","e":"Datenschutz, Einwilligung, Anhang, Schnittstelle…","c":"#3b5b8c","g":"Hukuk & idare dili","cards":[{"w":"der Datenschutz","t":"Nomen (çoğulsuz)","k":"Daten (veriler) + Schutz (koruma)","c":"der Datenschutz","br":"Dikkat: korunan veri değil, verisi işlenen kişidir. Almanya’da neredeyse her formda karşına çıkar; dayanağı DSGVO (AB veri koruma tüzüğü).","tr":"veri koruma","s":"Aus Datenschutzgründen dürfen wir diese Auskunft nicht erteilen.","st":"Veri koruma nedeniyle bu bilgiyi veremeyiz.","f":"schützen (korumak) · die DSGVO (AB veri koruma tüzüğü) · personenbezogen (kişiye ilişkin)"},{"w":"die Einwilligung","t":"Nomen, -en","k":"ein + Wille (irade) + -igung","c":"die Einwilligung, -en","br":"İradeyle „evet“ demek = rıza. Hukukta önceden verilirse Einwilligung, sonradan verilirse Genehmigung olur — zamanlama kelimeyi değiştirir.","tr":"rıza, muvafakat","s":"Ohne schriftliche Einwilligung der Eltern dürfen keine Fotos veröffentlicht werden.","st":"Velilerin yazılı rızası olmadan fotoğraf yayımlanamaz.","f":"einwilligen (razı olmak) · der Wille (irade) · widerrufen (geri almak)"},{"w":"die Zugangsdaten","t":"Nomen (çoğul)","k":"Zugang (erişim) + Daten (veriler)","c":"die Zugangsdaten (Pl.)","br":"Erişimi açan veriler: kullanıcı adı ve şifre. Daima çoğuldur — tekil kullanımı yanlıştır.","tr":"giriş bilgileri","s":"Die Zugangsdaten erhalten Sie per Post.","st":"Giriş bilgilerini posta ile alacaksınız.","f":"der Zugang (erişim) · das Passwort (şifre) · sich anmelden (giriş yapmak)"},{"w":"der Anhang","t":"Nomen, ¨-e","k":"an + hängen (asmak)","c":"der Anhang, die Anhänge","br":"Yazıya asılan şey = ek dosya. Resmî yazıda kâğıt ek için die Anlage, e-postada dosya için der Anhang kullanılır.","tr":"ek dosya (e-posta)","s":"Die Rechnung finden Sie im Anhang dieser E-Mail.","st":"Faturayı bu e-postanın ekinde bulabilirsiniz.","f":"anhängen (eklemek) · die Anlage (ek belge) · beifügen (iliştirmek)"},{"w":"hochladen ↔ herunterladen","t":"Verb (çift)","k":"hoch (yukarı) / herunter (aşağı) + laden (yüklemek)","c":"lädt hoch – lud hoch – hat hochgeladen","br":"Almanca İngilizceyi birebir çevirmiş: upload → hochladen, download → herunterladen. Yön mantığı aynı: sunucu yukarıda, kullanıcı aşağıda düşünülür.","tr":"yüklemek ↔ indirmek","s":"Laden Sie das Formular hoch, nachdem Sie es unterschrieben haben.","st":"Formu imzaladıktan sonra yükleyin.","f":"laden (yüklemek) · der Download (indirme) · die Datei (dosya)"},{"w":"die Datei","t":"Nomen, -en","k":"Daten (veri) + -ei (Kartei örneğinden)","c":"die Datei, die Dateien","br":"Yapay ama şeffaf bir kelime: Kartei (kart dosyası) örneğine göre kurulmuş. Dikkat — die Datei dosyadır, die Daten ise verilerdir.","tr":"dosya (bilgisayar)","s":"Die Datei ist zu groß für den Anhang.","st":"Dosya ek için fazla büyük.","f":"die Daten (veriler) · der Ordner (klasör) · speichern (kaydetmek)"},{"w":"speichern","t":"Verb","k":"Speicher (ambar, depo) + -n","c":"speichert – speicherte – hat gespeichert","br":"Speicher eskiden tahıl ambarıydı, sonra çatı katı, şimdi bellek. Kelime tarih boyunca hep „saklama yeri“ni adlandırdı.","tr":"kaydetmek, depolamak","s":"Ihre Angaben werden verschlüsselt gespeichert.","st":"Bilgileriniz şifreli olarak saklanıyor.","f":"der Speicher (bellek; ambar) · die Speicherung (kayıt) · löschen (silmek)"},{"w":"die Schnittstelle","t":"Nomen, -n","k":"Schnitt (kesit) + Stelle (yer)","c":"die Schnittstelle, -n","br":"İki sistemin kesiştiği yer = arayüz. Mecazî olarak insanlar için de kullanılır: iki birim arasındaki bağlantı noktası.","tr":"arayüz; kesişim noktası","s":"Der Sekretariatsbereich ist die Schnittstelle zwischen Eltern und Schulleitung.","st":"Sekreterlik, veliler ile okul yönetimi arasındaki kesişim noktası.","f":"der Schnitt (kesit) · schneiden (kesmek) · die Verbindung (bağlantı)"},{"w":"aktualisieren","t":"Verb","k":"aktuell (güncel) + -isieren","c":"aktualisiert – aktualisierte – hat aktualisiert","br":"-isieren eki yabancı sıfattan fiil üretir: modernisieren, digitalisieren, relativieren. Güncel hâle getirmek.","tr":"güncellemek","s":"Bitte aktualisieren Sie Ihre Kontaktdaten im Portal.","st":"Lütfen portaldaki iletişim bilgilerinizi güncelleyin.","f":"aktuell (güncel) · die Aktualisierung (güncelleme) · veraltet (eskimiş)"},{"w":"die Nutzungsbedingungen","t":"Nomen (çoğul)","k":"Nutzung (kullanım) + s + Bedingungen","c":"die Nutzungsbedingungen (Pl.)","br":"Fugen-s kuralı (-ung → -s). Kullanımın şartları; kabul edilmeden hizmet açılmaz — dijital sözleşmenin gövdesi.","tr":"kullanım koşulları","s":"Mit der Anmeldung akzeptieren Sie die Nutzungsbedingungen.","st":"Kayıt olmakla kullanım koşullarını kabul etmiş olursunuz.","f":"die Nutzung (kullanım) · nutzen (kullanmak) · die Bedingung (şart)"},{"w":"die Barrierefreiheit","t":"Nomen (çoğulsuz)","k":"Barriere (engel) + frei (serbest) + -heit","c":"die Barrierefreiheit","br":"-frei eki „…dan arınmış“
