övgüsü: Sie ist sehr geduldig mit den Kindern.","tr":"sabırlı ↔ sabırsız","s":"Mit den Kleinen muss man geduldig sein.","st":"Küçüklere karşı sabırlı olmak gerekir.","f":"die Geduld (sabır) · sich gedulden (sabretmek) · dulden (katlanmak)"},{"w":"fleißig ↔ faul","t":"Sıfat çifti","k":"Fleiß (gayret) / faul (tembel; çürük)","c":"—","br":"Karne ve değerlendirme dilinin ikilisi. faul ayrıca „çürük“ demektir: faules Obst — tembellik ile çürüme aynı kelimede buluşuyor.","tr":"çalışkan ↔ tembel","s":"Er ist nicht faul, er braucht nur klare Aufgaben.","st":"Tembel değil, sadece net görevlere ihtiyacı var.","f":"der Fleiß (gayret) · die Faulheit (tembellik) · sich anstrengen (çaba göstermek)"},{"w":"ordentlich ↔ chaotisch","t":"Sıfat çifti","k":"Ordnung (düzen) + -lich","c":"—","br":"ordentlich üç iş görür: düzenli, düzgün ve „hatırı sayılır“ (eine ordentliche Portion). Karne dilinde ise „iyi düzeyde“ demektir.","tr":"düzenli, düzgün ↔ dağınık","s":"Sie arbeitet sehr ordentlich und gibt alles pünktlich ab.","st":"Çok düzgün çalışıyor ve her şeyi zamanında teslim ediyor.","f":"die Ordnung (düzen) · aufräumen (toplamak) · unordentlich (dağınık)"},{"w":"hilfsbereit","t":"Sıfat","k":"Hilfe (yardım) + bereit (hazır)","c":"—","br":"„Yardıma hazır“: iki kelime bir arada karakteri anlatıyor. Aynı kalıp: gesprächsbereit, kompromissbereit, einsatzbereit.","tr":"yardımsever","s":"Die Nachbarn sind sehr hilfsbereit.","st":"Komşular çok yardımsever.","f":"die Hilfe (yardım) · bereit (hazır) · die Hilfsbereitschaft (yardımseverlik)"},{"w":"großzügig ↔ geizig","t":"Sıfat çifti","k":"groß + Zug (hamle) / Geiz (cimrilik)","c":"—","br":"„Büyük hamleli“ = cömert; ayrıca „ferah“ (eine großzügige Wohnung) ve „esnek“ (großzügig auslegen). Karşıtı geizig: cimri.","tr":"cömert; ferah ↔ cimri","s":"Der Vermieter war beim Termin sehr großzügig.","st":"Ev sahibi randevu konusunda çok esnek davrandı.","f":"der Zug (hamle) · die Großzügigkeit (cömertlik) · sparsam (tutumlu)"},{"w":"neugierig","t":"Sıfat","k":"neu (yeni) + gierig (aç gözlü)","c":"—","br":"„Yeniye aç“: merak. Olumlu da olumsuz da olabilir — çocukta merak, komşuda meraklılık. Kalıp: Ich bin gespannt (heyecanla merak ediyorum).","tr":"meraklı","s":"Ich bin neugierig, wie das ausgeht.","st":"Bunun nasıl biteceğini merak ediyorum.","f":"die Neugier (merak) · gespannt (merakla bekleyen) · das Interesse (ilgi)"},{"w":"streng ↔ locker","t":"Sıfat çifti","k":"streng (sıkı) / locker (gevşek)","c":"—","br":"Kural ekseninde iki uç: sıkı kural ↔ gevşek tutum. locker günlük dilde „rahat, sorun değil“ anlamında da kullanılır: Das schaffst du locker.","tr":"sıkı, katı ↔ gevşek, rahat","s":"Die Regeln sind streng, aber die Umsetzung ist ziemlich locker.","st":"Kurallar sıkı ama uygulama epey gevşek.","f":"die Strenge (sıkılık) · lockern (gevşetmek) · nachsichtig (hoşgörülü)"},{"w":"selbstbewusst ↔ schüchtern","t":"Sıfat çifti","k":"selbst + bewusst (bilincinde) / schüchtern","c":"—","br":"„Kendinin bilincinde olan“ = özgüvenli. Kibirle karıştırma: kibir arrogant’tır. Karşıtı çekingenlik: schüchtern.","tr":"özgüvenli ↔ çekingen","s":"Im Gespräch tritt sie sehr selbstbewusst auf.","st":"Görüşmede çok özgüvenli bir tavır sergiliyor.","f":"das Selbstbewusstsein (özgüven) · arrogant (kibirli) · zurückhaltend (ölçülü, çekingen)"},{"w":"gewissenhaft ↔ oberflächlich","t":"Sıfat çifti","k":"Gewissen (vicdan) / Oberfläche (yüzey)","c":"—","br":"Vicdanla çalışan ↔ yalnızca yüzeyde kalan. İş referanslarının anahtar sıfatları; Almanca bonservis dili bu kelimelerle ölçülür.","tr":"titiz, vicdanlı ↔ yüzeysel","s":"Er arbeitet gewissenhaft, nicht schnell, aber verlässlich.","st":"Titiz çalışıyor, hızlı değil ama güvenilir.","f":"das Gewissen (vicdan) · die Oberfläche (yüzey) · gründlich (esaslı)"},{"w":"pünktlich ↔ unpünktlich","t":"Sıfat çifti","k":"Punkt (nokta) + -lich","c":"—","br":"„Noktası noktasına“: Almanya’da sosyal bir norm. İlgili kalıplar: rechtzeitig (zamanında), verspätet (gecikmeli), auf die Minute (dakikası dakikasına).","tr":"dakik ↔ dakik olmayan","s":"Bitte sei pünktlich, der Termin ist knapp.","st":"Lütfen dakik ol, randevu sıkışık.","f":"der Punkt (nokta) · die Pünktlichkeit (dakiklik) · die Verspätung (gecikme)"},{"w":"gelassen ↔ nervös","t":"Sıfat çifti","k":"lassen (bırakmak) → gelassen / nervös","c":"—","br":"Bırakabilen sakindir; bırakamayan gerilir. Aynı eksende: entspannt (rahat), angespannt (gergin), unter Druck (baskı altında).","tr":"sakin, soğukkanlı ↔ gergin","s":"Bleib gelassen, das klärt sich morgen.","st":"Sakin ol, bu yarın çözülür.","f":"die Gelassenheit (sükûnet) · entspannt (rahat) · die Anspannung (gerilim)"}]},{"n":"Sıfatlar: nicelik ve gereklilik","e":"genug, ausreichend, knapp, nötig, überflüssig…","c":"#8a4a4a","g":"Sıfat aileleri","cards":[{"w":"viel ↔ wenig","t":"Nicelik çifti","k":"viel (çok) / wenig (az)","c":"mehr – am meisten","br":"Sayılamayanla kullanılır ve genelde çekim almaz: viel Zeit, wenig Geld. Sayılabilirlerde viele/wenige olur: viele Leute. Düzensiz dereceler: viel → mehr → am meisten.","tr":"çok ↔ az","s":"Ich habe wenig Zeit, aber viele Ideen.","st":"Az vaktim var ama çok fikrim var.","f":"mehr (daha çok) · weniger (daha az) · die Menge (miktar)"},{"w":"genug ↔ zu wenig","t":"Yeterlilik çifti","k":"genug (yeterli) / zu wenig (fazla az)","c":"—","br":"genug isimden önce ya da sonra gelebilir: genug Zeit / Zeit genug. Sıfatla daima sonra: schnell genug. Karşıtı zu wenig, aşırısı zu viel.","tr":"yeterli ↔ fazla az","s":"Wir haben genug Stühle, aber zu wenig Tische.","st":"Yeterli sandalye var ama masa az.","f":"ausreichend (yeterli) · reichen (yetmek) · zu viel (fazla)"},{"w":"ausreichend ↔ unzureichend","t":"Resmî yeterlilik","k":"aus + reichen (yetmek)","c":"—","br":"genug’un resmî hâli. Okul notu olarak da kullanılır: ausreichend = 4. Karşıtı unzureichend, resmî yazıda eksikliği bildirmenin kibar yolu.","tr":"yeterli ↔ yetersiz","s":"Die Begründung war unzureichend, deshalb wurde nachgefragt.","st":"Gerekçe yetersizdi, bu yüzden tekrar soruldu.","f":"reichen (yetmek) · ausreichen (yeterli olmak) · mangelhaft (kusurlu; not 5)"},{"w":"knapp ↔ reichlich","t":"Nicelik çifti","k":"knapp (kıt, ancak) / reichlich (bol)","c":"—","br":"Kıtlık ↔ bolluk. Rakamla kullanılınca yön bildirir: knapp 200 (biraz altı), reichlich 200 (rahat üstü). Zaman için de: knapp bei Zeit.","tr":"kıt, ancak ↔ bol bol","s":"Die Zeit ist knapp, das Material haben wir reichlich.","st":"Zaman kıt, malzeme bol bol var.","f":"gut (biraz üstü) · rund (yaklaşık) · üppig (fazlasıyla bol)"},{"w":"gering ↔ erheblich","t":"Ölçek çifti","k":"gering (az, küçük) / erheblich (kayda değer)","c":"—","br":"Resmî değerlendirme ekseni: gering < spürbar < erheblich < gravierend. Hukukta eşik belirler: geringfügiger Mangel sonuç doğurmaz, erheblicher Mangel doğurur.","tr":"az, düşük ↔ kayda değer","s":"Der Unterschied ist gering, die Folgen aber erheblich.","st":"Fark küçük ama sonuçları kayda değer.","f":"geringfügig (cüzi) · gravierend (ağır) · spürbar (hissedilir)"},{"w":"zahlreich","t":"Nicelik sıfatı","k":"Zahl (sayı) + -reich","c":"—","br":"„Sayıca zengin“ = çok sayıda. viele’nin yazı dilindeki karşılığı; rakam vermeden çokluk bildirir.","tr":"çok sayıda","s":"Zahlreiche Eltern haben sich beschwert.","st":"Çok sayıda veli şikâyette bulundu.","f":"die Zahl (sayı) · mehrere (birkaç) · unzählig (sayısız)"},{"w":"notwendig ↔ überflüssig","t":"Gereklilik çifti","k":"Not (sıkıntı) + wenden (çevirmek) / über + fließen","c":"—","br":"notwendig kelimenin içinde tanımını taşır: „sıkıntıyı çeviren“ = zorunlu. Karşıtı überflüssig: taşıp fazla gelen = gereksiz.","tr":"gerekli, zorunlu ↔ gereksiz","s":"Ein zweiter Termin ist überflüssig, ein Nachweis aber notwendig.","st":"İkinci bir randevu gereksiz ama bir belge gerekli.","f":"die Not (sıkıntı) · erforderlich (gerekli) · unnötig (lüzumsuz)"},{"w":"erforderlich","t":"Resmî gereklilik","k":"er + fordern (talep etmek) + -lich","c":"—","br":"„Talep edilen“: idari dilde nötig ve notwendig yerine kullanılır. Kalıp: Es ist erforderlich, dass … ya da Erforderlich sind: …","tr":"gerekli (resmî)","s":"Für die Anmeldung ist ein Lichtbild erforderlich.","st":"Kayıt için bir vesikalık fotoğraf gerekiyor.","f":"fordern (talep etmek) · die Anforderung (gereklilik) · nötig (lazım)"},{"w":"möglich ↔ unmöglich","t":"İmkân çifti","k":"mögen (istemek, olabilmek) + -lich","c":"—","br":"Kök mögen: istemek ve olabilmek. -lich eki „…ebilir olan“ katar: olabilir. un- olumsuzlar. Aynı aileden die Möglichkeit, ermöglichen (mümkün kılmak), möglicherweise (muhtemelen), möglichst (mümkün olduğunca).","tr":"mümkün ↔ imkânsız","s":"Ein Termin diese Woche ist leider nicht möglich.","st":"Bu hafta bir randevu maalesef mümkün değil.","f":"die Möglichkeit (olanak) · machbar (yapılabilir) · ermöglichen (imkân sağlamak)"},{"w":"üblich ↔ ungewöhnlich","t":"Alışkanlık çifti","k":"üben (alışkanlık edinmek) + -lich","c":"—","br":"„Alışılmış olan“: sözleşme ve fiyat tartışmalarında ölçüt kelimesidir — ortsüblich (bölgede alışılmış), branchenüblich (sektörde alışılmış). Kira artışının sınırı bu kavramla belirlenir.","tr":"alışıldık, olağan ↔ olağandışı","s":"Eine Kaution von drei Kaltmieten ist üblich.","st":"Üç çıplak kira tutarında depozito alışılmış bir şey.","f":"ortsüblich (bölgede alışılmış) · gewöhnlich (genelde) · die Gewohnheit (alışkanlık)"},{"w":"vollständig ↔ lückenhaft","t":"Tamlık çifti","k":"voll + stehen / Lücke (boşluk) + -haft","c":"—","br":"Eksiksizlik ekseni: resmî yazının en sık talebi vollständig ausfüllen. Karşıtı lückenhaft: boşlukları olan, eksik.","tr":"eksiksiz ↔ eksik, boşluklu","s":"Bitte füllen Sie das Formular vollständig aus.","st":"Lütfen formu eksiksiz doldurun.","f":"die Lücke (boşluk) · unvollständig (eksik) · ergänzen (tamamlamak)"},{"w":"deutlich ↔ unklar","t":"Netlik çifti","k":"deuten (işaret etmek) + -lich / un + klar","c":"—","br":"deutlich hem „net görülebilir“ hem „belirgin ölçüde“ demektir: deutlich teurer. Karşıtı unklar; ayrıca undeutlich (okunaksız, anlaşılmaz).","tr":"net, belirgin ↔ belirsiz","s":"Es ist mir immer noch unklar, wer das entschieden hat.","st":"Bunu kimin kararlaştırdığı hâlâ benim için belirsiz.","f":"deuten (yorumlamak) · verdeutlichen (netleştirmek) · eindeutig (tek anlamlı)"},{"w":"gültig ↔ abgelaufen","t":"Geçerlilik çifti","k":"gelten (geçerli olmak) / ablaufen (süresi dolmak)","c":"—","br":"Belge dilinin ikilisi: pasaport, bilet ve sözleşme ya gültig ya abgelaufen’dir. Ara biçim: verlängern (uzatmak), erneuern (yenilemek).","tr":"geçerli ↔ süresi dolmuş","s":"Mein Ausweis ist seit zwei Monaten abgelaufen.","st":"Kimliğimin süresi iki aydır dolmuş.","f":"gelten (geçerli olmak) · verlängern (uzatmak) · die Gültigkeit (geçerlilik)"},{"w":"zusätzlich ↔ inbegriffen","t":"Kapsam çifti","k":"Zusatz (ek) / begreifen → inbegriffen (dahil)","c":"—","br":"Fiyat ve tekliflerin anahtarı: bir kalem ya ek olarak gelir (zusätzlich, zzgl.) ya fiyata dahildir (inbegriffen, inklusive). Bu tek kelime bütçeyi belirler.","tr":"ek olarak ↔ fiyata dahil","s":"Frühstück ist im Preis inbegriffen, das Parken kostet zusätzlich.","st":"Kahvaltı fiyata dahil, otopark ek ücretli.","f":"inklusive (dahil) · zuzüglich (hariç, eklenerek) · der Zusatz (ek)"}]},{"n":"Eşdizimler: hangi sıfat hangi isimle","e":"starker Kaffee, hohe Kosten, große Mühe…","c":"#6b6b2a","g":"Sıfat aileleri","cards":[{"w":"stark ↔ schwach (eşdizim)","t":"Kollokation","k":"starker Kaffee · starke Schmerzen · schwacher Empfang","c":"—","br":"Almanca yoğunluğu isme göre farklı sıfatla anlatır: kahve stark olur, çay ise stark ya da kräftig; internet bağlantısı schwach olur, ama fiyat schwach olmaz. Yanlış eşleşme cümleyi anında yabancı gösterir.","tr":"koyu kahve, şiddetli ağrı, zayıf sinyal","s":"Ohne einen starken Kaffee komme ich morgens nicht in Gang.","st":"Sabahları koyu bir kahve olmadan çalışmaya başlayamıyorum.","f":"kräftig (kuvvetli) · heftig (şiddetli) · leicht (hafif)"},{"w":"hoch ↔ niedrig (rakam)","t":"Kollokation","k":"hohe Kosten · hohe Miete · niedrige Temperatur","c":"—","br":"Rakamla ifade edilen her şey hoch/niedrig alır: Kosten, Miete, Preis, Zinsen, Temperatur, Risiko. Dikkat: fiyat için teuer da denir ama Kosten için „teure Kosten“ yanlıştır — hohe Kosten doğrudur.","tr":"yüksek maliyet, yüksek kira ↔ düşük","s":"Die Nebenkosten sind in diesem Haus ungewöhnlich hoch.","st":"Bu binada yan giderler alışılmadık şekilde yüksek.","f":"teuer (pahalı) · gering (düşük) · steigen (artmak)"},{"w":"groß (eşdizim)","t":"Kollokation","k":"große Mühe · großes Interesse · großer Unterschied","c":"—","br":"Soyut kavramlarda „çok“ demenin yolu genelde groß’tur: große Angst, große Freude, großes Verständnis. Türkçedeki „büyük ilgi, büyük fark“ ile örtüşür.","tr":"büyük çaba, büyük ilgi, büyük fark","s":"Vielen Dank für die große Mühe.","st":"Gösterdiğiniz büyük emek için çok teşekkürler.","f":"die Mühe (zahmet) · gering (az) · erheblich (kayda değer)"},{"w":"dringend (eşdizim)","t":"Kollokation","k":"dringender Verdacht · dringend nötig · dringende Bitte","c":"—","br":"dringen = içeri işlemek, sızmak. „İçeri işleyen“ = ivedi, acil. Resmî yazıda aciliyeti bildirmenin standart kelimesi: Ich bitte dringend um …","tr":"acil, ivedi","s":"Ich brauche die Bestätigung dringend bis Freitag.","st":"Teyide cumaya kadar acilen ihtiyacım var.","f":"dringen (nüfuz etmek) · die Dringlichkeit (aciliyet) · eilig (acele)"},{"w":"triftig / stichhaltig","t":"Kollokation","k":"triftiger Grund · stichhaltiges Argument","c":"—","br":"Gerekçe ve argümanın gücünü anlatan iki kelime: triftiger Grund geçerli, kabul edilebilir sebep; stichhaltig ise „iğneye dayanan“ yani delinmeyen, sağlam argüman.","tr":"geçerli sebep / sağlam argüman","s":"Ohne triftigen Grund wird die Frist nicht verlängert.","st":"Geçerli bir sebep olmadan süre uzatılmıyor.","f":"der Grund (sebep) · schlüssig (tutarlı) · haltbar (savunulabilir)"},{"w":"rege / lebhaft","t":"Kollokation","k":"rege Beteiligung · lebhafte Diskussion","c":"—","br":"Canlılık bildiren iki sıfat: rege katılım ve yazışma için (reger Austausch), lebhaft tartışma ve çocuk için. İkisi de olumlu tondadır.","tr":"canlı, hareketli (katılım, tartışma)","s":"Die Beteiligung am Elternabend war erfreulich rege.","st":"Veli toplantısına katılım sevindirici derecede yüksekti.","f":"lebendig (canlı) · aktiv (etkin) · die Beteiligung (katılım)"},{"w":"herzlich (eşdizim)","t":"Kollokation","k":"herzlichen Dank · herzlich willkommen · herzliche Grüße","c":"—","br":"Herz (kalp) kökünden: „yürekten“. Nezaket kalıplarının çekirdeği; resmî yazışmada freundlich, samimi yazışmada herzlich kullanılır.","tr":"içten, yürekten","s":"Herzlichen Dank für Ihre schnelle Rückmeldung.","st":"Hızlı geri bildiriminiz için içten teşekkürler.","f":"das Herz (kalp) · herzhaft (doyurucu) · freundlich (nazik)"},{"w":"schwer ↔ leicht (eşdizim)","t":"Kollokation","k":"schwere Entscheidung · leichte Verspätung","c":"—","br":"Ağırlık sıfatı soyut alana taşınır: schwere Entscheidung, schwerer Fehler, schwere Zeiten ↔ leichte Erkältung, leichte Verspätung, leichtes Gepäck.","tr":"zor karar ↔ hafif gecikme","s":"Das war für uns alle eine schwere Entscheidung.","st":"Bu hepimiz için zor bir karardı.","f":"schwierig (zor) · schwerwiegend (ciddi) · geringfügig (cüzi)"},{"w":"eng (eşdizim)","t":"Kollokation","k":"enge Zusammenarbeit · enger Zeitplan · enger Freund","c":"—","br":"Dar olan yakındır: eng zusammenarbeiten = sıkı iş birliği, enger Freund = yakın arkadaş, enger Zeitplan = sıkışık program. Türkçedeki „sıkı fıkı“ ile aynı imge.","tr":"sıkı, yakın (iş birliği, arkadaşlık)","s":"Wir arbeiten hier eng mit dem Jugendamt zusammen.","st":"Burada gençlik dairesiyle sıkı iş birliği yapıyoruz.","f":"die Zusammenarbeit (iş birliği) · vertraut (yakın, aşina) · locker (gevşek)"},{"w":"offen (eşdizim)","t":"Kollokation","k":"offene Frage · offene Rechnung · offenes Gespräch","c":"—","br":"Kapanmamış olan: cevaplanmamış soru, ödenmemiş fatura, açık sözlü konuşma. Ödeme dilinde offener Betrag = bakiye borç.","tr":"açık, kapanmamış (soru, borç, konuşma)","s":"Es sind noch zwei Fragen offen.","st":"Hâlâ iki soru cevapsız duruyor.","f":"offenlegen (açıklamak) · der offene Betrag (bakiye) · klären (açıklığa kavuşturmak)"},{"w":"fest (eşdizim)","t":"Kollokation","k":"fester Termin · feste Zusage · festes Einkommen","c":"—","br":"Sabitlenmiş olan: kesin randevu, kesin söz, düzenli gelir, sürekli iş (feste Stelle). Fiil hâli: festlegen (belirlemek), festhalten (kayda geçirmek).","tr":"sabit, kesin (randevu, söz, gelir)","s":"Haben wir dafür schon einen festen Termin?","st":"Bunun için kesin bir randevumuz var mı?","f":"festlegen (belirlemek) · festhalten (kayda geçirmek) · vorläufig (geçici)"},{"w":"grob ↔ fein","t":"Kollokation","k":"grober Fehler · grobe Schätzung · feine Unterschiede","c":"—","br":"Kabalık–incelik ekseni: grober Fehler (ağır hata), grob fahrlässig (ağır ihmalli), grobe Schätzung (kaba tahmin) ↔ feine Unterschiede (ince farklar).","tr":"kaba, ağır ↔ ince","s":"Das war ein grober Fehler in der Berechnung.","st":"Bu hesaplamada ağır bir hataydı.","f":"grob fahrlässig (ağır ihmalli) · ungefähr (kabaca) · fein (ince)"},{"w":"gut gemeint ↔ gut gemacht","t":"Kalıp ayrımı","k":"gemeint (kastedilen) / gemacht (yapılan)","c":"—","br":"Alman deyişi: Gut gemeint ist nicht gut gemacht — iyi niyet iyi iş anlamına gelmez. Niyet ile sonucun ayrılığını anlatan en sık kullanılan kalıplardan.","tr":"iyi niyetli ↔ iyi yapılmış","s":"Gut gemeint ist eben nicht immer gut gemacht.","st":"İyi niyetli olmak her zaman iyi yapılmış olmak değildir.","f":"meinen (kastetmek) · die Absicht (niyet) · das Ergebnis (sonuç)"},{"w":"nachhaltig (eşdizim)","t":"Kollokation","k":"nachhaltiger Eindruck · nachhaltige Wirkung","c":"—","br":"Çevre dilinden çıkıp genel dile geçti: „etkisi sonradan da süren“. nachhaltiger Eindruck = kalıcı izlenim; nachhaltige Lösung = kalıcı çözüm.","tr":"kalıcı etkili, sürdürülebilir","s":"Der Vortrag hat einen nachhaltigen Eindruck hinterlassen.","st":"Sunum kalıcı bir izlenim bıraktı.","f":"die Nachhaltigkeit (sürdürülebilirlik) · dauerhaft (kalıcı) · vorübergehend (geçici)"}]},{"n":"Sık karıştırılan çiftler","e":"fordern/fördern, scheinbar/anscheinend, kennen/wissen…","c":"#b04a39","g":"Sıfat aileleri","cards":[{"w":"fordern ↔ fördern","t":"Karıştırılan çift","k":"fordern (talep etmek) / fördern (ilerletmek)","c":"fordert – forderte / fördert – förderte","br":"Tek harf, zıt yön: fordern karşıdan bir şey ister, fördern karşıya bir şey verir. Okulda ikisi birlikte anılır: fordern und fördern — hem talep et hem destekle.","tr":"talep etmek ↔ desteklemek","s":"Man muss Schüler fordern, ohne sie zu überfordern — und zugleich fördern.","st":"Öğrenciyi zorlamadan talep etmeli, aynı zamanda desteklemeli.","f":"die Forderung (talep) · die Förderung (destek) · überfordern (aşırı yüklemek) · unterfordern (yeterince zorlamamak)"},{"w":"scheinbar ↔ anscheinend","t":"Karıştırılan çift","k":"Schein (görüntü) + -bar / an + Schein + -end","c":"—","br":"scheinbar: görünüş yanıltıcıdır, gerçekte öyle değil. anscheinend: görünüşe göre öyle, muhtemelen doğru. Almanlar da karıştırır ama yazıda fark önemlidir.","tr":"görünüşte (aslında değil) ↔ görünüşe göre (muhtemelen öyle)","s":"Anscheinend ist er krank — das Problem ist nur scheinbar gelöst.","st":"Görünüşe göre hasta — sorun ise yalnızca görünüşte çözülmüş.","f":"der Schein (görüntü) · scheinen (görünmek) · offenbar (belli ki)"},{"w":"kennen ↔ wissen","t":"Karıştırılan çift","k":"kennen (tanımak) / wissen (bilmek)","c":"kennt – kannte / weiß – wusste","br":"kennen nesneyi doğrudan alır ve tanışıklık bildirir: Ich kenne die Regel. wissen bir olguyu, genelde yan cümleyle: Ich weiß, dass … Türkçe „tanımak/bilmek“ ayrımıyla aynı.","tr":"tanımak ↔ (olguyu) bilmek","s":"Ich kenne die Vorschrift, aber ich weiß nicht, ob sie noch gilt.","st":"Yönetmeliği biliyorum ama hâlâ geçerli mi bilmiyorum.","f":"erkennen (fark etmek) · das Wissen (bilgi) · die Kenntnis (bilgi, aşinalık)"},{"w":"legen ↔ liegen","t":"Karıştırılan çift","k":"legen (koymak, geçişli) / liegen (yatmak, geçişsiz)","c":"legt – legte – hat gelegt / liegt – lag – hat gelegen","br":"Kural üçlüde aynıdır: legen–liegen, stellen–stehen, setzen–sitzen. Nesne alan hareketlidir ve zayıf çekilir (legte); nesnesiz olan durumdur ve güçlü çekilir (lag).","tr":"koymak ↔ yatmak, bulunmak","s":"Ich lege den Schlüssel auf den Tisch; dort liegt schon dein Handy.","st":"Anahtarı masaya koyuyorum; orada zaten telefonun duruyor.","f":"stellen ↔ stehen (dikmek ↔ durmak) · setzen ↔ sitzen (oturtmak ↔ oturmak) · die Lage (konum)"},{"w":"wider ↔ wieder","t":"Karıştırılan çift","k":"wider (karşı) / wieder (tekrar)","c":"—","br":"Tek harf, tamamen ayrı iki kelime: widersprechen (karşı çıkmak) ↔ wiederholen (tekrarlamak). Yazarken ayırt etmenin yolu anlamı çevirmektir: karşı mı, tekrar mı?","tr":"karşı ↔ tekrar","s":"Er hat wiederholt widersprochen.","st":"Defalarca karşı çıktı.","f":"der Widerspruch (itiraz) · die Wiederholung (tekrar) · widerrufen (caymak) · wiederkommen (geri gelmek)"},{"w":"das ↔ dass","t":"Karıştırılan çift","k":"das (artikel/ilgi zamiri) / dass (bağlaç)","c":"—","br":"Sınama basittir: das yerine dieses ya da welches konabiliyorsa tek s ile yazılır; konamıyorsa bağlaçtır ve çift s alır.","tr":"o, ki (zamir) ↔ …dığı (bağlaç)","s":"Das Auto, das dort steht, ist so alt, dass es kaum noch fährt.","st":"Orada duran o araba, neredeyse gitmeyecek kadar eski.","f":"dieses (bu) · welches (hangisi ki) · der Nebensatz (yan cümle)"},{"w":"die Bedingung ↔ die Voraussetzung","t":"Karıştırılan çift","k":"be+dingen (şart koşmak) / voraus+setzen (önceden koymak)","c":"die Bedingung, -en / die Voraussetzung, -en","br":"Voraussetzung olmadan iş baştan mümkün değildir (ön koşul); Bedingung ise tarafların koyduğu şarttır. Biri gerçeklikten, öbürü anlaşmadan gelir.","tr":"şart ↔ ön koşul","s":"Die Voraussetzungen sind erfüllt; über die Bedingungen müssen wir noch verhandeln.","st":"Ön koşullar sağlandı; şartları hâlâ müzakere etmeliyiz.","f":"bedingt (koşullu) · unter der Bedingung, dass (…şartıyla) · vorausgesetzt (…kabul edilirse)"},{"w":"effektiv ↔ effizient","t":"Karıştırılan çift","k":"effectus (sonuç) / efficiens (verimli işleyen)","c":"—","br":"effektiv: doğru sonucu veriyor mu? effizient: sonucu en az kaynakla mı veriyor? Doğru işi yapmak ile işi doğru yapmak farkı.","tr":"etkili (sonuç veren) ↔ verimli (az kaynakla)","s":"Die Methode ist effektiv, aber alles andere als effizient.","st":"Yöntem etkili ama verimli olmaktan çok uzak.","f":"der Effekt (etki) · die Effizienz (verimlilik) · wirksam (etkili)"},{"w":"empfindlich ↔ empfindsam","t":"Karıştırılan çift","k":"empfinden (hissetmek) + -lich / + -sam","c":"—","br":"-lich burada „kolayca etkilenen“ (hassas, alıngan, dayanıksız); -sam ise „hissetme eğiliminde olan“ (duygulu, ince ruhlu). Aynı kök, iki ek, iki karakter.","tr":"hassas, alıngan ↔ duygulu, ince ruhlu","s":"Das Gerät ist empfindlich; sie ist eher empfindsam.","st":"Cihaz hassas; o ise daha çok ince ruhlu.","f":"empfinden (hissetmek) · die Empfindlichkeit (hassaslık) · das Empfinden (duyum)"},{"w":"anbieten ↔ anfordern","t":"Karıştırılan çift","k":"an + bieten (sunmak) / an + fordern (talep etmek)","c":"bietet an – bot an / fordert an – forderte an","br":"Yön farkı: anbieten benden karşıya gider, anfordern karşıdan bana. Aynı ön ek, zıt akış — resmî yazışmada karıştırılınca cümle tersine döner.","tr":"sunmak ↔ talep etmek","s":"Ich biete dir meine Hilfe an, aber anfordern musst du sie selbst.","st":"Sana yardımımı sunuyorum ama talep etmesi gereken sensin.","f":"das Angebot (teklif) · die Anforderung (talep) · anfragen (sormak)"},{"w":"die Frist ↔ der Termin","t":"Karıştırılan çift","k":"Frist (süre aralığı) / Termin (belirli an)","c":"die Frist, -en / der Termin, -e","br":"Frist bir aralıktır, içinde hareket edersin; Termin tek bir noktadır. „Bir ay içinde“ Frist, „14 Mayıs saat 10“ Termin.","tr":"süre (aralık) ↔ randevu (an)","s":"Die Frist läuft noch zwei Wochen; der Termin ist am Dienstag.","st":"Süre iki hafta daha işliyor; randevu ise salı.","f":"fristgerecht (süresinde) · der Termindruck (zaman baskısı) · die Fristverlängerung (süre uzatımı)"},{"w":"scheiden ↔ entscheiden","t":"Karıştırılan çift","k":"scheiden (ayırmak) / ent + scheiden","c":"scheidet – schied / entscheidet – entschied","br":"Aynı kök: ayırmak. scheiden fiilen ayırır (Scheidung: boşanma, ayrılık); entscheiden seçenekleri ayırıp birini seçer.","tr":"ayırmak, ayrılmak ↔ karar vermek","s":"Was die beiden Fälle scheidet, muss das Gericht entscheiden.","st":"İki davayı birbirinden ayıran şeye mahkeme karar vermeli.","f":"die Scheidung (ayrılık, boşanma) · die Entscheidung (karar) · unterscheiden (ayırt etmek)"},{"w":"gefährlich ↔ gefährdet","t":"Karıştırılan çift","k":"Gefahr (tehlike) + -lich / gefährden + -et","c":"—","br":"gefährlich tehlike kaynağıdır: başkasına zarar verir. gefährdet ise tehlike altındadır: kendisi risk altında. Etken ↔ edilgen ayrımı.","tr":"tehlikeli (kaynak) ↔ tehlike altında (mağdur)","s":"Die Stelle ist gefährlich; deshalb sind Schulkinder dort gefährdet.","st":"O nokta tehlikeli; bu yüzden okul çocukları orada risk altında.","f":"die Gefahr (tehlike) · gefährden (tehlikeye atmak) · die Gefährdung (tehlikeye atma)"},{"w":"anscheinend ↔ offenbar ↔ offensichtlich","t":"Üçlü ayrım","k":"Schein (görüntü) / offen (açık) + bar / offen + Sicht","c":"—","br":"Kesinlik sırası: anscheinend (görünüşe göre) < offenbar (belli ki, dolaylı kanıt var) < offensichtlich (gözle görülür, tartışmasız). Yazıda iddianın gücünü bu üçlü ayarlar.","tr":"görünüşe göre < belli ki < apaçık","s":"Er ist offensichtlich müde; anscheinend hat er wieder zu wenig geschlafen.","st":"Belli ki yorgun; görünüşe göre yine az uyumuş.","f":"der Schein (görüntü) · offen (açık) · die Sicht (bakış) · zweifellos (kuşkusuz)"}]},{"n":"Yanlış dostlar: Türkçe konuşana tuzaklar","e":"bekommen, also, Chef, Gymnasium…","c":"#963b3b","g":"Sıfat aileleri","cards":[{"w":"bekommen","t":"Verb (yanlış dost)","k":"be + kommen","c":"bekommt – bekam – hat bekommen","br":"Tuzak: İngilizce become (olmak) ile ses benzerliği yanıltır. Almanca bekommen = ALMAK. „Öğretmen oldum“ demek için ich bin Lehrer geworden denir.","tr":"almak (olmak DEĞİL)","s":"Zum Geburtstag habe ich einen Kalender bekommen.","st":"Doğum günümde bir takvim aldım.","f":"werden (olmak) · erhalten (almak, resmî) · kriegen (almak, günlük)"},{"w":"also","t":"Adverb (yanlış dost)","k":"all + so","c":"—","br":"all + so: „hepsi böyleyse“. Yani söylenenlerden çıkan sonuç. Bu yüzden sonuç bağlacıdır, ekleme değil. Türkçe konuşanın tuzağı İngilizce also’dur: „ayrıca“ demek için außerdem kullanılır.","tr":"demek ki, yani (ayrıca DEĞİL)","s":"Es regnet, also nehmen wir das Auto.","st":"Yağmur yağıyor, o zaman arabayı alıyoruz.","f":"außerdem (ayrıca) · folglich (dolayısıyla) · das heißt (yani)"},{"w":"eventuell","t":"Adverb (yanlış dost)","k":"eventus (olay, sonuç)","c":"—","br":"Tuzak: İngilizce eventually (sonunda) ile karıştırılır. Almanca eventuell = belki, olası. „Sonunda“ için schließlich denir.","tr":"belki, muhtemelen (sonunda DEĞİL)","s":"Eventuell brauchen wir noch eine zweite Bescheinigung.","st":"Belki bir belge daha gerekecek.","f":"schließlich (sonunda) · möglicherweise (muhtemelen) · gegebenenfalls (gerekirse)"},{"w":"sensibel","t":"Adjektiv (yanlış dost)","k":"sensus (duyu)","c":"—","br":"Tuzak: İngilizce sensible (makul) ile karıştırılır. Almanca sensibel = hassas, duyarlı. „Makul“ için vernünftig denir.","tr":"hassas, duyarlı (makul DEĞİL)","s":"Es handelt sich um sensible personenbezogene Daten.","st":"Söz konusu olan hassas kişisel verilerdir.","f":"vernünftig (makul) · empfindlich (hassas, dayanıksız) · die Sensibilität (duyarlılık)"},{"w":"das Gymnasium","t":"Nomen (yanlış dost)","k":"gymnasion (antik eğitim ve spor yeri)","c":"das Gymnasium, die Gymnasien","br":"Tuzak: Türkçedeki „jimnastik salonu“ çağrışımı yanıltır. Almanya’da Gymnasium akademik liseyi anlatır; spor salonu die Turnhalle’dir.","tr":"akademik lise (spor salonu DEĞİL)","s":"Nach der vierten Klasse wechselt sie aufs Gymnasium.","st":"Dördüncü sınıftan sonra liseye geçiyor.","f":"die Turnhalle (spor salonu) · die Gesamtschule (karma okul) · die Realschule (orta öğretim okulu)"},{"w":"der Chef","t":"Nomen (yanlış dost)","k":"Fransızca chef: baş","c":"der Chef, die Chefs","br":"Tuzak: İngilizce chef (aşçıbaşı) ile karıştırılır. Almanca Chef = amir, patron. Aşçı der Koch, aşçıbaşı der Chefkoch’tur.","tr":"amir, patron (aşçı DEĞİL)","s":"Das muss ich vorher mit meinem Chef abstimmen.","st":"Bunu önce amirimle görüşmem lazım.","f":"der Koch (aşçı) · der Vorgesetzte (üst, amir) · die Leitung (yönetim)"},{"w":"die Rente ↔ die Miete","t":"Karıştırılan çift","k":"Rente (düzenli gelir) / Miete (kira)","c":"die Rente, -n / die Miete, -n","br":"Tuzak: Türkçedeki „rant, kira geliri“ çağrışımı ters çalışır. Almanca Rente = emekli aylığı; kira ise Miete. „Kirada oturmak“ zur Miete wohnen’dir.","tr":"emekli aylığı ↔ kira","s":"Er geht nächstes Jahr in Rente; die Miete zahlt weiterhin seine Tochter.","st":"Gelecek yıl emekli oluyor; kirayı kızı ödemeye devam ediyor.","f":"in Rente gehen (emekli olmak) · der Rentner (emekli) · vermieten (kiraya vermek)"},{"w":"das Handy","t":"Nomen (sahte İngilizce)","k":"Almanca içinde üretilmiş İngilizce görünümlü kelime","c":"das Handy, die Handys","br":"İngilizcede böyle bir isim yok (mobile phone / cell phone). Almanya’da üretilmiş bir „Scheinanglizismus“. Aynı türden: der Beamer (projeksiyon), das Public Viewing.","tr":"cep telefonu","s":"Handys sind während der Klassenarbeit auszuschalten.","st":"Yazılı sınav sırasında cep telefonları kapatılacak.","f":"der Beamer (projeksiyon cihazı) · das Mobiltelefon (cep telefonu, resmî) · der Anglizismus (İngilizce alıntı)"},{"w":"die Aktion","t":"Nomen (yanlış dost)","k":"actio (eylem)","c":"die Aktion, die Aktionen","br":"Latince actio: eylem (agere: eylemek — bkz. reagieren, aktiv, der Akteur). Almancada günlük anlamı daralmıştır: mağazanın eylemi = kampanya, indirim. Borsadaki hisse ise die Aktie’dir; tek harf iki dünyayı ayırır.","tr":"kampanya, indirim; eylem","s":"Die Winterjacken sind diese Woche in der Aktion.","st":"Kışlık montlar bu hafta kampanyada.","f":"die Aktie (hisse senedi) · das Angebot (indirimli teklif) · der Akteur (aktör, taraf)"},{"w":"bekannt ↔ berühmt","t":"Karıştırılan çift","k":"bekannt (tanınan) / berühmt (ünlü)","c":"—","br":"bekannt = çevresinde tanınıyor, „bilinen“; berühmt = geniş kitlelerce ünlü. Ayrıca bekannt yalnızca „malum, bilinen bir şey“ anlamında da kullanılır: es ist bekannt, dass …","tr":"tanınan, bilinen ↔ ünlü","s":"Der Fall ist in der Stadt bekannt, aber nicht bundesweit berühmt.","st":"Olay şehirde biliniyor ama ülke çapında ünlü değil.","f":"kennen (tanımak) · der Bekannte (tanıdık) · der Ruhm (şöhret)"},{"w":"die Kur ↔ die Kür","t":"Karıştırılan çift","k":"Kur (tedavi) / Kür (serbest program)","c":"die Kur, -en / die Kür, -en","br":"Tek harf, iki dünya: die Kur sağlık tedavisi (auf Kur fahren); die Kür ise buz patenindeki serbest program, mecazî olarak zorunlu değil isteğe bağlı kısım — karşıtı die Pflicht.","tr":"kür, tedavi ↔ serbest bölüm","s":"Die Pflicht ist erledigt, jetzt kommt die Kür.","st":"Zorunlu kısım bitti, şimdi serbest bölüm geliyor.","f":"die Kur (tedavi) · die Pflicht (zorunlu kısım) · die Reha (rehabilitasyon)"},{"w":"bilden ↔ bauen","t":"Karıştırılan çift","k":"bilden (biçim vermek) / bauen (inşa etmek)","c":"bildet – bildete / baut – baute","br":"bilden soyut oluşturmadır: cümle kurmak, ekip oluşturmak, eğitim vermek (die Bildung). bauen ise fiziksel inşadır. Türkçede ikisi de „kurmak“ olduğu için sık karışır.","tr":"oluşturmak ↔ inşa etmek","s":"Wir bilden zwei Gruppen; das neue Gebäude wird erst nächstes Jahr gebaut.","st":"İki grup oluşturuyoruz; yeni bina ancak gelecek yıl inşa edilecek.","f":"die Bildung (eğitim; oluşum) · das Gebäude (bina) · der Bau (inşaat)"},{"w":"studieren ↔ lernen","t":"Karıştırılan çift","k":"studieren (üniversitede okumak) / lernen (öğrenmek)","c":"studiert – studierte / lernt – lernte","br":"studieren yalnızca üniversite düzeyi içindir. „Sınava çalışıyorum“ demek için lernen kullanılır: Ich lerne für die Prüfung — Ich studiere değil.","tr":"üniversitede okumak ↔ öğrenmek, çalışmak","s":"Sie studiert Mathematik und lernt jeden Abend zwei Stunden.","st":"Matematik okuyor ve her akşam iki saat çalışıyor.","f":"das Studium (üniversite eğitimi) · der Student (üniversite öğrencisi) · der Schüler (okul öğrencisi)"},{"w":"bestimmt ↔ bestimmen","t":"Karıştırılan çift","k":"bestimmen (belirlemek) → bestimmt","c":"bestimmt – bestimmte – hat bestimmt","br":"Partizip olarak „belirlenmiş, belirli“; zarf olarak ise „kesin, mutlaka“ demektir: Das schaffst du bestimmt. Aynı kelime hem belirleme hem güvence taşır.","tr":"belirli; (zarf) mutlaka, kesin","s":"Zu einer bestimmten Uhrzeit kommt er bestimmt nicht.","st":"Belirli bir saatte kesinlikle gelmez.","f":"bestimmen (belirlemek) · die Bestimmung (hüküm, belirleme) · unbestimmt (belirsiz)"}]},{"n":"Sıfat kökleri: hoch · tief · weit · eng · nah","e":"erheblich, weitreichend, Engpass, annähernd…","c":"#3c6e9f","g":"Sıfat aileleri","cards":[{"w":"erheblich","t":"Adjektiv","k":"er + heben (kaldırmak) + -lich","c":"—","br":"heben = kaldırmak. Fark edilecek kadar „yukarı kaldırılmış“ olan = kayda değer, ciddi boyutta. Resmî dilde „çok“ demenin ölçülü yolu.","tr":"kayda değer, hatırı sayılır","s":"Die Preise sind im letzten Jahr erheblich gestiegen.","st":"Fiyatlar geçen yıl kayda değer ölçüde arttı.","f":"heben (kaldırmak) · unerheblich (önemsiz) · die Erhebung (tahsil; anket)"},{"w":"die Höhe","t":"Nomen, -n","k":"hoch (yüksek) + -e","c":"die Höhe, die Höhen","br":"Sıfattan isim: yükseklik. Parada aynı imge tutarı anlatır — „ne kadar yükseğe çıktığı“. Resmî yazının kalıbı: in Höhe von …","tr":"yükseklik","s":"Der Berg erreicht eine Höhe von 1.200 Metern.","st":"Dağ 1.200 metre yüksekliğe ulaşıyor.","f":"hoch (yüksek) · erhöhen (artırmak) · die Erhöhung (artış)","m":[{"tr":"tutar, miktar","s":"Es wurde eine Nachzahlung in Höhe von 212 Euro gefordert.","st":"212 avro tutarında ek ödeme talep edildi."}]},{"w":"hochwertig","t":"Adjektiv","k":"hoch (yüksek) + Wert (değer) + -ig","c":"—","br":"Değeri yüksek olan. Aynı kalıptan: minderwertig (değersiz), gleichwertig (eşdeğer), vollwertig (tam değerli).","tr":"nitelikli, yüksek kaliteli","s":"Die Fenster sind hochwertig verarbeitet.","st":"Pencereler nitelikli işçilikle yapılmış.","f":"der Wert (değer) · gleichwertig (eşdeğer) · minderwertig (düşük değerli)"},{"w":"tiefgreifend","t":"Adjektiv","k":"tief (derin) + greifen (kavramak)","c":"—","br":"Derine uzanıp kavrayan = köklü, temelden etkileyen. Yüzeysel değişikliğin karşıtı.","tr":"köklü, derinden etkileyen","s":"Die Reform brachte tiefgreifende Veränderungen mit sich.","st":"Reform köklü değişiklikler getirdi.","f":"tief (derin) · vertiefen (derinleştirmek) · greifen (kavramak)"},{"w":"weitgehend","t":"Adjektiv / Adverb","k":"weit (uzak, geniş) + gehen (gitmek)","c":"—","br":"Uzağa kadar giden = büyük ölçüde. Tam değil ama neredeyse tam olan durumu anlatır.","tr":"büyük ölçüde, geniş çapta","s":"Die Angaben stimmen weitgehend mit den Belegen überein.","st":"Bilgiler büyük ölçüde belgelerle örtüşüyor.","f":"weit (geniş) · weitestgehend (mümkün olduğunca) · überwiegend (ağırlıklı olarak)"},{"w":"weitreichend","t":"Adjektiv","k":"weit (uzak) + reichen (uzanmak)","c":"—","br":"Uzağa uzanan = etkisi geniş alana yayılan. weitgehend „ne kadar tam“, weitreichend „ne kadar uzağa“ sorusunu yanıtlar.","tr":"geniş kapsamlı, uzun vadeli etkili","s":"Die Entscheidung hat weitreichende Folgen für alle Mieter.","st":"Karar bütün kiracılar için geniş kapsamlı sonuçlar doğuruyor.","f":"reichen (uzanmak) · die Reichweite (erim) · folgenschwer (ağır sonuçlu)"},{"w":"die Reichweite","t":"Nomen, -n","k":"reichen (uzanmak) + Weite (genişlik)","c":"die Reichweite, -n","br":"reichen uzanmak, Weite genişliktir: ne kadar uzağa uzanabildiği. Somutta menzil ve kapsama alanı, soyutta bir kararın ya da yayının etki alanı. Aynı kökten weitreichend (geniş kapsamlı) ve ausreichen (yetmek).","tr":"erim, menzil, etki alanı","s":"Die Reichweite dieser Regelung ist begrenzt.","st":"Bu düzenlemenin etki alanı sınırlı.","f":"die Weite (genişlik) · weitreichend (geniş kapsamlı) · der Bereich (alan)"},{"w":"eng","t":"Adjektiv","k":"eski Almanca angi: sıkışık","c":"—","br":"Dar ve sıkı. die Angst ile ortak kökten geldiği kabul edilir: darlık, göğsün sıkışması — Türkçedeki „içim daraldı“ ile aynı imge. Bu bağ etimolojik olarak yaygın kabul görür, ama sen yine de kelimeyi kullanımından tut: enger Zeitplan, enge Zusammenarbeit.","tr":"dar; sıkı, yakın","s":"Der Zeitplan ist ausgesprochen eng.","st":"Zaman planı son derece dar.","f":"die Enge (darlık) · einengen (daraltmak) · die Angst (korku)","m":[{"tr":"yakın, sıkı (ilişki)","s":"Die beiden Themen hängen eng zusammen.","st":"İki konu birbiriyle sıkı sıkıya bağlantılı."}]},{"w":"die Einschränkung","t":"Nomen, -en","k":"ein + Schranke (bariyer) + -ung","c":"die Einschränkung, -en","br":"Schranke = bariyer, engel çubuğu (bkz. Bahnschranke). Bir şeyi bariyerlerin içine almak = sınırlandırmak.","tr":"kısıtlama, sınırlama","s":"Die Nutzung ist nur mit erheblichen Einschränkungen möglich.","st":"Kullanım ancak ciddi kısıtlamalarla mümkün.","f":"einschränken (kısıtlamak) · die Schranke (bariyer) · uneingeschränkt (sınırsız)"},{"w":"der Engpass","t":"Nomen, ¨-e","k":"eng (dar) + Pass (geçit)","c":"der Engpass, die Engpässe","br":"Dağdaki dar geçit = darboğaz. Ekonomide ve okulda (öğretmen açığı) aynı imge kullanılır.","tr":"darboğaz, sıkıntı","s":"Bei der Vertretung gibt es derzeit einen personellen Engpass.","st":"Vekâlette şu anda personel darboğazı var.","f":"eng (dar) · der Pass (geçit; pasaport) · der Mangel (eksiklik)"},{"w":"nahezu","t":"Adverb","k":"nahe (yakın) + zu","c":"—","br":"Yakınına kadar = neredeyse. fast ile eşanlamlı, ama yazı dilinde daha resmî durur.","tr":"neredeyse","s":"Die Kosten sind nahezu unverändert geblieben.","st":"Masraflar neredeyse değişmeden kaldı.","f":"nahe (yakın) · fast (neredeyse) · annähernd (yaklaşık)"},{"w":"die Nähe","t":"Nomen (çoğulsuz)","k":"nah (yakın) + -e","c":"die Nähe","br":"Sıfattan isim: yakınlık. Hem mekân (in der Nähe) hem ilişki için kullanılır.","tr":"yakınlık, civar","s":"In unmittelbarer Nähe der Schule entsteht ein Neubau.","st":"Okulun hemen yakınında yeni bir bina yapılıyor.","f":"nah (yakın) · in der Nähe (yakınında) · unmittelbar (doğrudan, hemen)"},{"w":"annähernd","t":"Adjektiv / Adverb","k":"an + nähern (yaklaştırmak) + -nd","c":"—","br":"Yaklaşarak = yaklaşık olarak. Rakam verirken ölçülü konuşmanın yoludur: annähernd 200 Euro.","tr":"yaklaşık olarak","s":"Die beiden Werte sind annähernd gleich.","st":"İki değer yaklaşık olarak aynı.","f":"sich nähern (yaklaşmak) · die Annäherung (yakınlaşma) · ungefähr (aşağı yukarı)"},{"w":"die Annäherung","t":"Nomen, -en","k":"an + nähern + -ung","c":"die Annäherung, -en","br":"Yaklaşma hareketi: iki taraf arasında ya da matematikte bir değere yaklaşma.","tr":"yaklaşma, yakınlaşma","s":"In den Gesprächen gab es eine erste vorsichtige Annäherung.","st":"Görüşmelerde ilk temkinli yakınlaşma yaşandı.","f":"sich nähern (yaklaşmak) · annähernd (yaklaşık) · der Näherungswert (yaklaşık değer)"}]},{"n":"Zıt çiftler: stark/schwach · viel/wenig · früh/spät","e":"verstärken, geringfügig, rechtzeitig, veraltet…","c":"#7d3f6d","g":"Sıfat aileleri","cards":[{"w":"die Stärke","t":"Nomen, -n","k":"stark (güçlü) + -e","c":"die Stärke, die Stärken","br":"Sıfattan isim. Üç anlamı da „güç/kalınlık“ imgesinden çıkar: güç, kişinin güçlü yanı, malzeme kalınlığı.","tr":"güç, kuvvet","s":"Die Stärke des Windes nahm im Laufe des Tages zu.","st":"Rüzgârın şiddeti gün içinde arttı.","f":"stark (güçlü) · verstärken (güçlendirmek) · die Schwäche (zayıflık)","m":[{"tr":"güçlü yön","s":"Ihre größte Stärke ist die Struktur ihrer Argumentation.","st":"En güçlü yanı argümanının yapısı."}]},{"w":"die Schwäche","t":"Nomen, -n","k":"schwach (zayıf) + -e","c":"die Schwäche, die Schwächen","br":"Stärke’nin tam karşıtı, aynı kalıpla kurulmuş. Sıfat + -e kalıbı Almancada düzenlidir: Höhe, Länge, Breite, Tiefe, Nähe.","tr":"zayıflık, zayıf yön","s":"Die Argumentation hat an einer Stelle eine deutliche Schwäche.","st":"Argüman bir noktada belirgin bir zayıflık taşıyor.","f":"schwach (zayıf) · abschwächen (zayıflatmak) · schwächen (güçten düşürmek)"},{"w":"verstärken","t":"Verb","k":"ver + stark + -en","c":"verstärkt – verstärkte – hat verstärkt","br":"ver- + sıfat + -en kalıbı: güçlü hâle getirmek. Aynı kalıptan: vergrößern, verkleinern, verkürzen, verlängern.","tr":"güçlendirmek, artırmak","s":"Der Lärm hat den Eindruck noch verstärkt.","st":"Gürültü izlenimi daha da güçlendirdi.","f":"die Verstärkung (takviye) · stark (güçlü) · abschwächen (zayıflatmak)"},{"w":"abschwächen","t":"Verb","k":"ab + schwach + -en","c":"schwächt ab – schwächte ab – hat abgeschwächt","br":"ab- aşağı yönü verir: gücü düşürmek. verstärken ile tam bir çift oluşturur.","tr":"zayıflatmak, hafifletmek","s":"Sag es ruhig direkt, du musst es nicht abschwächen.","st":"Doğrudan söyle, yumuşatmana gerek yok.","f":"schwach (zayıf) · die Abschwächung (hafifleme) · verstärken (güçlendirmek)"},{"w":"beträchtlich","t":"Adjektiv","k":"be + trachten (bakmak, gözetmek) + -lich","c":"—","br":"trachten/betrachten = bakmak. Bakılmaya, hesaba katılmaya değer büyüklükte = hatırı sayılır. erheblich ile eşanlamlıdır.","tr":"hatırı sayılır, epeyce","s":"Der Aufwand war beträchtlich höher als geplant.","st":"Emek planlanandan hatırı sayılır ölçüde fazlaydı.","f":"betrachten (incelemek) · die Betrachtung (bakış) · erheblich (kayda değer)"},{"w":"geringfügig","t":"Adjektiv","k":"gering (az) + Fug (uygunluk) + -ig","c":"—","br":"gering = az, küçük. Hukukta eşik kelimesidir: geringfügige Beschäftigung (mini iş), geringfügiger Mangel — küçük olduğu için sonuç doğurmayan.","tr":"cüzi, önemsiz derecede az","s":"Die Abweichung ist geringfügig und rechtfertigt keine Minderung.","st":"Sapma cüzidir ve indirimi haklı çıkarmaz.","f":"gering (az) · die Geringfügigkeit (önemsizlik) · verringern (azaltmak)"},{"w":"die Mehrheit","t":"Nomen, -en","k":"mehr (daha çok) + -heit","c":"die Mehrheit, -en","br":"„Daha çok olma hâli“ = çoğunluk. Karşıtı die Minderheit (azınlık). Aynı kalıp: die Einheit, die Freiheit.","tr":"çoğunluk","s":"Die Mehrheit der Klasse war für den Ausflug.","st":"Sınıfın çoğunluğu gezi taraftarıydı.","f":"mehr (daha çok) · die Minderheit (azınlık) · mehrheitlich (çoğunlukla)"},{"w":"mindestens","t":"Adverb","k":"mindest (en az) + -ens","c":"—","br":"minder = daha az; mindest = en az. Karşıtı höchstens (en fazla). İkisi de -ens ekiyle zarf olur.","tr":"en az, asgari","s":"Die Unterlagen sind mindestens zwei Jahre aufzubewahren.","st":"Belgeler en az iki yıl saklanmalıdır.","f":"höchstens (en fazla) · das Mindestmaß (asgari ölçü) · der Mindestlohn (asgari ücret)"},{"w":"frühzeitig","t":"Adjektiv / Adverb","k":"früh (erken) + Zeit (zaman) + -ig","c":"—","br":"Zamanın erken kısmında = vaktinden önce, erkenden. rechtzeitig „tam zamanında“ demektir; frühzeitig ondan da öncedir.","tr":"erkenden, vaktinden önce","s":"Bitte melden Sie Fehlzeiten frühzeitig.","st":"Lütfen devamsızlıkları erkenden bildirin.","f":"früh (erken) · rechtzeitig (zamanında) · verfrüht (fazla erken)"},{"w":"rechtzeitig","t":"Adjektiv / Adverb","k":"recht (doğru) + Zeit (zaman) + -ig","c":"—","br":"„Doğru zamanda“ = geç kalmadan. Recht burada hukuk değil, „uygun, doğru“ demektir (bkz. recht haben).","tr":"zamanında, vaktinde","s":"Wenn wir jetzt losfahren, sind wir rechtzeitig da.","st":"Şimdi çıkarsak zamanında varırız.","f":"die Zeit (zaman) · fristgerecht (süresine uygun) · verspätet (gecikmeli)"},{"w":"die Verspätung","t":"Nomen, -en","k":"ver + spät (geç) + -ung","c":"die Verspätung, -en","br":"ver- + sıfat kalıbı yine iş başında: geç hâle gelmek. Aynı yapı: verzögern, verlängern, verkürzen.","tr":"gecikme, rötar","s":"Der Zug hat heute 20 Minuten Verspätung.","st":"Tren bugün 20 dakika rötarlı.","f":"spät (geç) · verspätet (gecikmiş) · die Verzögerung (gecikme, sürecin uzaması)"},{"w":"veraltet","t":"Adjektiv (Partizip)","k":"ver + alt (eski) + -et","c":"—","br":"„Eskiyip geçerliliğini yitirmiş“. alt yalnızca yaşlıdır; veraltet artık kullanılamaz olandır — bu fark önemlidir.","tr":"eskimiş, güncelliğini yitirmiş","s":"Die verwendeten Zahlen sind veraltet.","st":"Kullanılan rakamlar güncelliğini yitirmiş.","f":"alt (eski) · veralten (eskimek) · überholt (aşılmış)"},{"w":"erneut","t":"Adjektiv / Adverb","k":"er + neu (yeni) + -t","c":"—","br":"Yeniden yapılmış = tekrar. wieder günlük, erneut yazı dilidir; ikisi de „bir daha“ demektir.","tr":"yeniden, bir kez daha","s":"Er hat gestern Abend erneut angerufen.","st":"Dün akşam yine aradı.","f":"neu (yeni) · erneuern (yenilemek) · die Erneuerung (yenileme)"},{"w":"neuerdings","t":"Adverb","k":"neuer (daha yeni) + -dings","c":"—","br":"„Son zamanlarda başlayan“ bir durumu anlatır: eskiden böyle değildi, artık böyle. -dings eki neredeyse yalnızca birkaç kelimede yaşar: allerdings, neuerdings.","tr":"son zamanlarda, artık","s":"Neuerdings trinkt er nur noch Tee.","st":"Son zamanlarda yalnızca çay içiyor.","f":"neu (yeni) · allerdings (ne var ki) · seit Kurzem (kısa süredir)"}]},{"n":"Zıt çiftler: gut/schlecht · leicht/schwer · gleich","e":"Gutachten, erleichtern, schwerwiegend, Vergleich…","c":"#2f7d4f","g":"Sıfat aileleri","cards":[{"w":"das Gutachten","t":"Nomen, -","k":"gut (iyi) + achten (değerlendirmek)","c":"das Gutachten, die Gutachten","br":"achten = değer biçmek, gözetmek. Bir uzmanın „iyi düşünüp değerlendirmesi“ = bilirkişi raporu. Kelimenin içinde yargı değil, değerlendirme fikri var.","tr":"bilirkişi raporu, uzman görüşü","s":"Das Gericht hat ein unabhängiges Gutachten in Auftrag gegeben.","st":"Mahkeme bağımsız bir bilirkişi raporu istedi.","f":"der Gutachter (bilirkişi) · begutachten (incelemek) · achten (değerlendirmek)"},{"w":"begünstigen","t":"Verb","k":"be + Gunst (lütuf, iyilik) + -igen","c":"begünstigt – begünstigte – hat begünstigt","br":"Gunst = lütuf, teveccüh (bkz. zugunsten: …lehine). Birini ya da bir durumu lehte kılmak.","tr":"lehine olmak, kolaylaştırmak; kayırmak","s":"Feuchtigkeit begünstigt die Schimmelbildung.","st":"Nem küf oluşumunu kolaylaştırıyor.","f":"die Gunst (lütuf) · zugunsten (…lehine) · der Begünstigte (lehtar)"},{"w":"die Verschlechterung","t":"Nomen, -en","k":"ver + schlecht (kötü) + -ern + -ung","c":"die Verschlechterung, -en","br":"Yine ver- + sıfat kalıbı: kötü hâle gelme. Karşıtı die Verbesserung — aynı kalıp, zıt sıfat.","tr":"kötüleşme","s":"Eine Verschlechterung der Wohnsituation ist dokumentiert.","st":"Konut durumunun kötüleştiği belgelenmiş.","f":"sich verschlechtern (kötüleşmek) · die Verbesserung (iyileşme) · schlecht (kötü)"},{"w":"gutgläubig","t":"Adjektiv","k":"gut (iyi) + Glaube (inanç) + -ig","c":"—","br":"„İyi inançla hareket eden“ = iyi niyetli. Hukukta belirleyicidir: gutgläubiger Erwerb, iyi niyetli edinim korunur.","tr":"iyi niyetli","s":"Er hat gutgläubig auf die Auskunft des Amtes vertraut.","st":"Dairenin bilgisine iyi niyetle güvendi.","f":"der Glaube (inanç) · bösgläubig (kötü niyetli) · der gute Glaube (hüsnüniyet)"},{"w":"erleichtern","t":"Verb","k":"er + leicht (hafif) + -ern","c":"erleichtert – erleichterte – hat erleichtert","br":"Hafif hâle getirmek = kolaylaştırmak. Aynı kelime insan için „içini rahatlatmak“ demektir: erleichtert sein.","tr":"kolaylaştırmak, hafifletmek","s":"Ein klares Formular erleichtert die Antragstellung erheblich.","st":"Net bir form başvuruyu kayda değer ölçüde kolaylaştırır.","f":"leicht (hafif, kolay) · erleichtert (rahatlamış) · erschweren (zorlaştırmak)"},{"w":"die Erleichterung","t":"Nomen, -en","k":"er + leicht + -erung","c":"die Erleichterung, -en","br":"Hem yükün hafiflemesi (kolaylık) hem içteki hafifleme (rahatlama). Tek imge, iki alan.","tr":"kolaylık; rahatlama","s":"Die neue App ist eine echte Erleichterung im Alltag.","st":"Yeni uygulama günlük hayatta gerçek bir kolaylık.","f":"erleichtern (kolaylaştırmak) · leicht (hafif) · die Entlastung (yükün hafiflemesi)","m":[{"tr":"içi rahatlama","s":"Nach der Zusage machte sich allgemeine Erleichterung breit.","st":"Onaydan sonra genel bir rahatlama yayıldı."}]},{"w":"leichtfertig","t":"Adjektiv","k":"leicht (hafif) + fertig (hazır, biten)","c":"—","br":"İşi „fazla hafif alarak“ yapmak = savruk, düşüncesizce. Hukukta ihmalin ağır biçimine yakın durur.","tr":"savruk, düşüncesizce","s":"Solche Fristen darf man nicht leichtfertig verstreichen lassen.","st":"Bu tür süreler savrukça geçirilmemeli.","f":"leicht (hafif) · die Leichtfertigkeit (savrukluk) · fahrlässig (ihmalkâr)"},{"w":"erschweren","t":"Verb","k":"er + schwer (ağır) + -en","c":"erschwert – erschwerte – hat erschwert","br":"Ağır hâle getirmek = zorlaştırmak. erleichtern ile kusursuz bir çift: aynı kalıp, zıt sıfat.","tr":"zorlaştırmak, güçleştirmek","s":"Der Schnee erschwert die Fahrt erheblich.","st":"Kar yolculuğu epey zorlaştırıyor.","f":"schwer (ağır, zor) · erschwerend (ağırlaştırıcı) · erleichtern (kolaylaştırmak)"},{"w":"schwerwiegend","t":"Adjektiv","k":"schwer (ağır) + wiegen (tartmak)","c":"—","br":"wiegen = tartmak. Terazide ağır basan = ciddi, önemli. Hukukta eşik kelimesidir: schwerwiegender Mangel.","tr":"ciddi, ağır basan","s":"Es handelt sich um einen schwerwiegenden Verfahrensfehler.","st":"Söz konusu olan ciddi bir usul hatasıdır.","f":"wiegen (tartmak) · das Gewicht (ağırlık) · geringfügig (cüzi)"},{"w":"gleichzeitig","t":"Adjektiv / Adverb","k":"gleich (aynı) + Zeit (zaman) + -ig","c":"—","br":"Aynı zamanda olan. gleich- ön eki eşitlik kurar: gleichwertig, gleichberechtigt, gleichmäßig.","tr":"aynı anda, eşzamanlı","s":"Man kann nicht gleichzeitig Rücksicht nehmen und alles durchsetzen.","st":"Aynı anda hem gözetip hem her şeyi kabul ettirmek olmaz.","f":"gleich (aynı) · gleichberechtigt (eşit haklı) · zeitgleich (tam aynı anda)"},{"w":"der Vergleich","t":"Nomen, -e","k":"ver + gleich (aynı, eşit)","c":"der Vergleich, die Vergleiche","br":"İki şeyi „eşitleyerek“ yan yana koymak = karşılaştırma. Hukukta aynı kelime tarafların ortada buluşmasını, yani sulhu anlatır.","tr":"karşılaştırma","s":"Im Vergleich zum Vorjahr sind die Kosten um 12 Prozent gestiegen.","st":"Geçen yıla kıyasla masraflar yüzde 12 arttı.","f":"vergleichen (karşılaştırmak) · vergleichbar (karşılaştırılabilir) · gleich (aynı)","m":[{"tr":"sulh, uzlaşma (hukuk)","s":"Das Verfahren endete mit einem Vergleich.","st":"Dava sulhla sonuçlandı."}]},{"w":"gleichgültig","t":"Adjektiv","k":"gleich (aynı) + gültig (gelten: geçerli olmak)","c":"—","br":"„Hangisi olursa aynı ölçüde geçerli“ = fark etmez, umursamaz. Kelimenin içinde kayıtsızlığın mantığı yazılı.","tr":"kayıtsız, umursamaz; fark etmez","s":"Es ist nicht gleichgültig, wer den Antrag unterschreibt.","st":"Başvuruyu kimin imzaladığı fark etmez değildir.","f":"gültig (geçerli) · gelten (geçerli olmak) · die Gleichgültigkeit (kayıtsızlık)"},{"w":"andererseits","t":"Adverb","k":"ander (diğer) + Seite (taraf) + -s","c":"—","br":"„Öbür taraftan“. Daima çift çalışır: einerseits … andererseits — bir yandan … öte yandan. Argüman kurmanın standart iskeleti.","tr":"öte yandan, diğer taraftan","s":"Einerseits fehlt die Zeit, andererseits fehlt das Personal.","st":"Bir yandan zaman yok, öte yandan personel yok.","f":"einerseits (bir yandan) · die Seite (taraf) · hingegen (buna karşılık)"},{"w":"ähnlich","t":"Adjektiv + Dativ","k":"ahnen/eben kökü: benzeşmek","c":"—","br":"Benzer. Kökeni eski Almanca gelīh/ahnlich biçimlerine dayanır; kesin türetmesi tartışmalıdır, bu yüzden köken değil kullanım ayrımını aklında tut: gleich tam eşitliktir, ähnlich yakınlıktır. Matematikte de tam bu ayrım geçerlidir: ähnliche Dreiecke.","tr":"benzer","s":"Wir haben einen ähnlichen Geschmack.","st":"Zevklerimiz benzer.","f":"die Ähnlichkeit (benzerlik) · ähneln (benzemek) · gleich (aynı)"}]},{"n":"Sayı, oran ve ölçü dili","e":"um ↔ auf, knapp/rund/gut, jeweils, Spanne…","c":"#276b74","g":"Sıfat aileleri","cards":[{"w":"um ↔ auf (Prozent)","t":"Edat farkı","k":"um (fark kadar) / auf (varılan değere)","c":"—","br":"En kritik rakam farkı: um 10 Prozent gestiegen = yüzde 10 ARTMIŞ; auf 10 Prozent gestiegen = yüzde 10’A ÇIKMIŞ. Tek edat, tamamen başka rakam.","tr":"…kadar artmak ↔ …e çıkmak","s":"Die Kosten stiegen um 12 Prozent, der Anteil stieg auf 40 Prozent.","st":"Masraflar yüzde 12 arttı, pay yüzde 40’a çıktı.","f":"steigen (artmak) · sinken (düşmek) · der Anstieg (artış)"},{"w":"der Durchschnitt","t":"Nomen, -e","k":"durch (boyunca) + Schnitt (kesit)","c":"der Durchschnitt, die Durchschnitte","br":"Ortadan kesen çizgi = ortalama. Kalıp: im Durchschnitt / durchschnittlich; „ortalamanın üstünde“ = überdurchschnittlich.","tr":"ortalama","s":"Der Verbrauch liegt deutlich über dem Durchschnitt.","st":"Tüketim ortalamanın belirgin şekilde üstünde.","f":"durchschnittlich (ortalama) · überdurchschnittlich (ortalama üstü) · der Schnitt (kesit)"},{"w":"die Quote","t":"Nomen, -n","k":"quota pars (kaçta kaçlık pay)","c":"die Quote, die Quoten","br":"Latince „paya düşen kısım“. Oran, kota, katılım yüzdesi. Aynı kökten die Quotierung, quotenbasiert.","tr":"oran, kota","s":"Die Quote der Wiederholer ist im Vergleich zum Vorjahr gesunken.","st":"Sınıf tekrarı oranı geçen yıla kıyasla düştü.","f":"der Anteil (pay) · die Rate (oran, taksit) · prozentual (yüzde olarak)"},{"w":"die Steigerung ↔ der Rückgang","t":"Karşıt çift","k":"steigern (artırmak) / zurück + gehen (geri gitmek)","c":"die Steigerung, -en / der Rückgang, ¨-e","br":"Artış yukarı çıkar, düşüş geri gider. Yazı dilinde ikisi de rakam cümlelerinin gövdesidir: eine Steigerung um … / ein Rückgang von …","tr":"artış ↔ düşüş","s":"Nach einer Steigerung im Vorjahr folgte ein deutlicher Rückgang.","st":"Geçen yılki artışın ardından belirgin bir düşüş geldi.","f":"steigern (artırmak) · zurückgehen (azalmak) · der Anstieg (yükseliş) · sinken (düşmek)"},{"w":"rund / knapp / gut (rakamla)","t":"Rakam belirteçleri","k":"rund (yuvarlak) / knapp (kıt) / gut (iyi, dolgun)","c":"—","br":"Üçü de yaklaşıklığı işaretler ama yönü farklıdır: rund = yaklaşık; knapp = biraz altında; gut = biraz üstünde. knapp 200 Euro 195 civarıdır, gut 200 Euro ise 210.","tr":"yaklaşık / biraz altı / biraz üstü","s":"Die Nachzahlung beträgt knapp 200 Euro, die Vorauszahlung gut 1.800 Euro.","st":"Ek ödeme 200 avronun biraz altında, peşin ödeme 1.800’ün biraz üstünde.","f":"etwa (yaklaşık) · ungefähr (aşağı yukarı) · genau (tam)"},{"w":"jeweils","t":"Adverb","k":"je (her biri) + weils (Weile: süre)","c":"—","br":"„Her defasında, her biri için ayrı ayrı“. Dağıtımı netleştirir: zwei Kartons mit jeweils zehn Stück = her biri onar adetlik iki kutu.","tr":"her biri, her defasında","s":"Die Klassen erhalten jeweils zwei Stunden Förderunterricht.","st":"Sınıfların her biri ikişer saat destek dersi alıyor.","f":"je (her biri) · jeweilig (ilgili, o anki) · pro (başına)"},{"w":"insgesamt","t":"Adverb","k":"in + gesamt (bütün)","c":"—","br":"Parçaları toplayıp tek rakam verir: toplam. Karşıtı einzeln (tek tek); ara kelime durchschnittlich (ortalama).","tr":"toplam olarak","s":"Wir waren insgesamt zwölf Leute.","st":"Toplam on iki kişiydik.","f":"gesamt (bütün) · die Gesamtsumme (toplam tutar) · einzeln (tek tek)"},{"w":"die Hälfte / das Drittel / das Viertel","t":"Kesir isimleri","k":"halb → Hälfte; drei → Drittel; vier → Viertel","c":"die Hälfte, -n / das Drittel, - / das Viertel, -","br":"Kural: sayı + -tel eki, hepsi nötr (das Drittel, das Fünftel). Tek istisna „yarım“dır: die Hälfte, dişil ve ayrı bir kelime.","tr":"yarısı / üçte biri / dörtte biri","s":"Fast die Hälfte der Kosten entfällt auf die Heizung; ein Viertel auf Wasser.","st":"Masrafların neredeyse yarısı ısıtmaya, dörtte biri suya düşüyor.","f":"halb (yarım) · entfallen auf (…e düşmek) · das Fünftel (beşte bir)"},{"w":"das Doppelte / das Dreifache","t":"Kat sayıları","k":"doppelt (iki katı) / -fach (kat)","c":"das Doppelte / das Dreifache","br":"-fach eki katı bildirir: dreifach, mehrfach, vielfach. İsimleşince nötr olur ve sıfat gibi çekilir: das Dreifache des Betrags.","tr":"iki katı / üç katı","s":"Der Betrag ist inzwischen auf das Dreifache gestiegen.","st":"Tutar bu arada üç katına çıktı.","f":"mehrfach (defalarca) · vielfach (çok kez) · das Vielfache (katı)"},{"w":"je … desto","t":"Kalıp (orantı)","k":"je (ne kadar) + desto (o kadar)","c":"—","br":"İki değişkeni birbirine bağlar. Yapı sabittir: je + karşılaştırma + fiil sonda, sonra desto + karşılaştırma + fiil hemen. Eş biçimi: je … umso.","tr":"ne kadar … o kadar","s":"Je früher wir losfahren, desto weniger Stau haben wir.","st":"Ne kadar erken çıkarsak o kadar az trafiğe takılırız.","f":"umso (o kadar) · der Komparativ (karşılaştırma derecesi) · abhängen von (…e bağlı olmak)"},{"w":"sich belaufen auf (A)","t":"Verb","k":"be + laufen (akmak, ulaşmak)","c":"beläuft – belief – hat belaufen","br":"Toplamın bir rakama „akıp varması“ = o tutara ulaşmak. betragen ile eşanlamlıdır ama daha resmîdir ve daima refleksiftir.","tr":"(toplam) …e ulaşmak, tutmak","s":"Die Gesamtkosten belaufen sich auf 4.320 Euro.","st":"Toplam masraflar 4.320 avroyu buluyor.","f":"betragen (tutmak) · die Gesamtsumme (toplam) · laufen (akmak)"},{"w":"die Spanne","t":"Nomen, -n","k":"spannen (germek)","c":"die Spanne, die Spannen","br":"Gerilen iki uç arasındaki mesafe = aralık. Zaman için Zeitspanne, fiyat için Preisspanne, kâr için Gewinnspanne.","tr":"aralık, fark","s":"Die Preisspanne liegt zwischen 40 und 120 Euro.","st":"Fiyat aralığı 40 ile 120 avro arasında.","f":"spannen (germek) · die Zeitspanne (zaman aralığı) · die Bandbreite (yelpaze)"},{"w":"entfallen auf (A)","t":"Verb","k":"ent + fallen (düşmek)","c":"entfällt – entfiel – ist entfallen","br":"Bir payın kime düştüğünü söyler: „…e düşüyor“. Aynı fiilin ikinci anlamı „iptal olmak“tır: Der Unterricht entfällt.","tr":"(pay olarak) …e düşmek","s":"Auf die Heizkosten entfallen rund 45 Prozent der Gesamtsumme.","st":"Toplamın yaklaşık yüzde 45’i ısıtma giderlerine düşüyor.","f":"der Anteil (pay) · ausfallen (iptal olmak) · fallen (düşmek)","m":[{"tr":"iptal olmak, düşmek","s":"Die sechste Stunde entfällt heute.","st":"Altıncı ders bugün iptal."}]},{"w":"aufrunden ↔ abrunden","t":"Verb (çift)","k":"auf/ab + rund (yuvarlak) + -en","c":"rundet auf – rundete auf – hat aufgerundet","br":"Yukarı yuvarlamak ↔ aşağı yuvarlamak. abrunden ayrıca mecazî: bir sunumu ya da yemeği „tamamlayıp yuvarlamak“.","tr":"yukarı yuvarlamak ↔ aşağı yuvarlamak","s":"Runden wir einfach auf zehn Euro auf?","st":"Kolayca on avroya yuvarlayalım mı?","f":"rund (yuvarlak) · die Rundung (yuvarlama) · gerundet (yuvarlanmış)"}]},{"n":"Tutum ve kişilik sıfatları","e":"zuverlässig, hartnäckig, kulant, besonnen…","c":"#8a6d3b","g":"Sıfat aileleri","cards":[{"w":"zuverlässig","t":"Adjektiv","k":"zu + verlassen (güvenmek) + -ig","c":"—","br":"sich auf jemanden verlassen = birine bel bağlamak. Bel bağlanabilen kişi = güvenilir. Kelimenin içinde tanımı yazılı.","tr":"güvenilir","s":"Sie ist eine ausgesprochen zuverlässige Kollegin.","st":"Son derece güvenilir bir meslektaş.","f":"sich verlassen auf (güvenmek) · die Zuverlässigkeit (güvenilirlik) · unzuverlässig (güvenilmez)"},{"w":"gewissenhaft","t":"Adjektiv","k":"Gewissen (vicdan) + -haft","c":"—","br":"Gewissen = vicdan (wissen kökünden: birlikte bilme). Vicdan niteliği taşıyan = titiz, sorumluluk duygusuyla çalışan.","tr":"vicdanlı, titiz","s":"Er erledigt seine Aufgaben äußerst gewissenhaft.","st":"Görevlerini son derece titizlikle yerine getiriyor.","f":"das Gewissen (vicdan) · gewissenlos (vicdansız) · sorgfältig (özenli)"},{"w":"hartnäckig","t":"Adjektiv","k":"hart (sert) + Nacken (ense) + -ig","c":"—","br":"„Sert enseli“ — boyun eğmeyen. Olumlu yönde inatçı azim, olumsuz yönde inatçılık; lekeler ve hastalıklar için: geçmek bilmeyen.","tr":"inatçı, azimli; geçmek bilmeyen","s":"Er hat hartnäckig auf Belegeinsicht bestanden.","st":"Belge incelemesinde inatla ısrar etti.","f":"der Nacken (ense) · die Hartnäckigkeit (azim) · beharrlich (kararlı)"},{"w":"nachsichtig","t":"Adjektiv","k":"Nachsicht (nach + sehen) + -ig","c":"—","br":"jemandem etwas nachsehen = kusurunu görmezden gelmek. Nachsicht = müsamaha; sıfatı: hoşgörülü.","tr":"hoşgörülü, müsamahakâr","s":"Bei kleineren Verstößen ist die Schulleitung eher nachsichtig.","st":"Küçük ihlallerde okul yönetimi daha hoşgörülü.","f":"die Nachsicht (müsamaha) · nachsehen (görmezden gelmek) · streng (sıkı)"},{"w":"unnachgiebig","t":"Adjektiv","k":"un + nach + geben (vermek) + -ig","c":"—","br":"nachgeben = geri adım atmak, boyun eğmek. un- ile: hiç geri adım atmayan = tavizsiz.","tr":"tavizsiz, katı","s":"In diesem Punkt bleibt sie unnachgiebig.","st":"Bu noktada tavizsiz kalıyor.","f":"nachgeben (geri adım atmak) · kompromissbereit (uzlaşmaya açık) · stur (dik kafalı)"},{"w":"gelassen","t":"Adjektiv (Partizip)","k":"lassen (bırakmak) → gelassen","c":"—","br":"„Bırakabilmiş“ olan: olayları bırakıp taşımayan kişi = sakin, soğukkanlı. Kelimenin kendisi bir tavsiye taşıyor: bırakmak sakinleştirir.","tr":"sakin, soğukkanlı","s":"Sie hat auf die Vorwürfe gelassen reagiert.","st":"Suçlamalara soğukkanlı tepki verdi.","f":"die Gelassenheit (sükûnet) · lassen (bırakmak) · nervös (gergin)"},{"w":"voreilig","t":"Adjektiv","k":"vor (önden) + eilen (acele etmek) + -ig","c":"—","br":"Zamanından önce koşan = aceleci, erken karar veren. Kalıp: voreilige Schlüsse ziehen — acele sonuç çıkarmak.","tr":"aceleci, erken hükümlü","s":"Ziehen wir keine voreiligen Schlüsse.","st":"Acele sonuç çıkarmayalım.","f":"eilen (acele etmek) · die Eile (acele) · besonnen (temkinli)"},{"w":"besonnen","t":"Adjektiv (Partizip)","k":"sich besinnen (kendine gelmek, düşünmek)","c":"—","br":"sich besinnen = durup düşünmek (Sinn: akıl, duyu). Düşünüp taşınmış olan = temkinli, sağduyulu. voreilig’in tam karşıtı.","tr":"temkinli, sağduyulu","s":"In der Krise hat er ausgesprochen besonnen gehandelt.","st":"Krizde son derece sağduyulu davrandı.","f":"sich besinnen (düşünmek) · der Sinn (akıl, anlam) · die Besonnenheit (sağduyu)"},{"w":"eigenwillig","t":"Adjektiv","k":"eigen (kendi) + Wille (irade) + -ig","c":"—","br":"Kendi iradesine göre giden: bağımsız ve özgün, ama duruma göre dik başlı. İki değerlendirme de kelimenin içinde durur.","tr":"kendi bildiğini okuyan; özgün","s":"Ihre Herangehensweise ist eigenwillig, aber wirksam.","st":"Yaklaşımı kendine özgü ama etkili.","f":"der Wille (irade) · eigensinnig (dik kafalı) · eigenständig (bağımsız)"},{"w":"penibel","t":"Adjektiv","k":"Latince poena (ceza, zahmet) → zahmetli titizlik","c":"—","br":"Aşırı titiz. Fransızca pénible (zahmetli) üzerinden Latince poena (ceza, zahmet) köküne bağlanır — bağ makul ama zorlama sayılabilir. İşe yarayan fark şudur: sorgfältig olumlu özendir, penibel gereğinden fazlasını ima eder.","tr":"aşırı titiz, kılı kırk yaran","s":"Er führt die Unterlagen penibel genau.","st":"Belgeleri kılı kırk yararak tutuyor.","f":"sorgfältig (özenli) · pedantisch (bilgiçlik taslayan) · die Genauigkeit (kesinlik)"},{"w":"kulant","t":"Adjektiv","k":"Fransızca coulant: akıcı","c":"—","br":"„Akıcı, takılmayan“ = müşteriye karşı esnek davranan. Ticarette anahtar kelime: yasal zorunluluğu olmadığı hâlde iyi niyet göstermek.","tr":"esnek, jest yapan (ticarette)","s":"Der Händler hat sich sehr kulant gezeigt.","st":"Satıcı çok jest yaptı.","f":"die Kulanz (jest, esneklik) · entgegenkommend (anlayışlı) · das Entgegenkommen (jest)"},{"w":"nachlässig","t":"Adjektiv","k":"nachlassen (gevşetmek) + -ig","c":"—","br":"Dikkati gevşetmiş olan = savsak, özensiz. sorgfältig’in karşıtı; hukukta fahrlässig ile akrabadır.","tr":"savsak, özensiz","s":"Er arbeitet in letzter Zeit ziemlich nachlässig.","st":"Son zamanlarda epey özensiz çalışıyor.","f":"nachlassen (azalmak; gevşetmek) · fahrlässig (ihmalkâr) · sorgfältig (özenli)"},{"w":"aufgeschlossen","t":"Adjektiv (Partizip)","k":"auf + schließen (kilit açmak)","c":"—","br":"„Kilidi açılmış“ = yeniye açık, önyargısız. Karşıtı verschlossen: kapalı, içine kapanık. Aynı fiil, iki ön ek, iki karakter.","tr":"açık fikirli, yeniliğe açık","s":"Das Kollegium ist gegenüber neuen Methoden sehr aufgeschlossen.","st":"Öğretmenler kurulu yeni yöntemlere çok açık.","f":"verschlossen (kapalı, içine kapanık) · offen (açık) · schließen (kapatmak)"},{"w":"nachvollziehbar denkend: besonnen ↔ impulsiv","t":"Karşıt çift","k":"impulsiv: impellere (itmek) ↔ besonnen: sich besinnen","c":"—","br":"impulsiv = içeriden gelen itkiyle hareket eden; besonnen = önce durup düşünen. Karakter tarifinde bu çift, Almanca değerlendirme yazılarının klasiğidir.","tr":"dürtüsel ↔ sağduyulu","s":"Er reagiert eher impulsiv, sie eher besonnen.","st":"O daha çok dürtüsel, kadın ise daha sağduyulu tepki veriyor.","f":"impulsiv (dürtüsel) · der Impuls (itki) · überlegt (düşünülmüş)"}]},{"n":"Kira ve masraf dili","e":"Betriebskosten, Umlage, Nachzahlung, Belegeinsicht…","c":"#a35a12","g":"Hukuk & idare dili","cards":[{"w":"die Betriebskosten","t":"Nomen (çoğul)","k":"Betrieb (betreiben: işletmek) + Kosten","c":"die Betriebskosten (Pl.)","br":"Binanın işletilmesinden doğan, sürekli tekrarlayan masraflar. Yasal listesi Betriebskostenverordnung’da sayılıdır ve sınırlıdır — listede olmayan kalem kiracıya yansıtılamaz.","tr":"işletme giderleri","s":"Verwaltungskosten gehören nicht zu den umlagefähigen Betriebskosten.","st":"Yönetim giderleri yansıtılabilir işletme giderlerine dahil değildir.","f":"betreiben (işletmek) · die Betriebskostenverordnung (işletme giderleri yönetmeliği) · die Nebenkosten (yan giderler)"},{"w":"umlagefähig","t":"Adjektiv","k":"um + legen (dağıtmak) + -fähig (…ebilen)","c":"—","br":"umlegen = bir masrafı birden çok kişiye dağıtmak. -fähig eki „…yapabilir/…edilebilir“ katar. Kiracıya dağıtılabilen masraf = yansıtılabilir.","tr":"kiracıya yansıtılabilir","s":"Reparaturkosten sind grundsätzlich nicht umlagefähig.","st":"Tamir masrafları kural olarak kiracıya yansıtılamaz.","f":"umlegen (dağıtmak) · die Umlage (dağıtım payı) · leistungsfähig (kapasiteli)"},{"w":"der Verteilerschlüssel","t":"Nomen, -","k":"verteilen (dağıtmak) + Schlüssel (anahtar)","c":"der Verteilerschlüssel, die -schlüssel","br":"Masrafın hangi ölçüye göre bölüneceğini açan „anahtar“: konut alanı, kişi sayısı ya da tüketim. Hesabı denetlemenin ilk adımı anahtarı bulmaktır.","tr":"dağıtım anahtarı","s":"Als Verteilerschlüssel wurde die Wohnfläche zugrunde gelegt.","st":"Dağıtım anahtarı olarak konut alanı esas alınmış.","f":"verteilen (dağıtmak) · die Verteilung (dağıtım) · die Wohnfläche (konut alanı)"},{"w":"die Vorauszahlung","t":"Nomen, -en","k":"voraus (önceden) + zahlen + -ung","c":"die Vorauszahlung, -en","br":"Yıl boyunca peşin ödenen aylık taksit. Yıl sonunda gerçek masrafla karşılaştırılır; fark ya Nachzahlung ya Guthaben olur.","tr":"peşin ödeme, avans","s":"Die monatliche Vorauszahlung beträgt 180 Euro.","st":"Aylık peşin ödeme 180 avro.","f":"vorauszahlen (peşin ödemek) · die Abschlagszahlung (ara ödeme) · voraussichtlich (tahminen)"},{"w":"die Nachzahlung","t":"Nomen, -en","k":"nach (sonradan) + zahlen + -ung","c":"die Nachzahlung, -en","br":"Peşin ödemeler gerçek masrafı karşılamazsa doğan fark = ek ödeme. Karşıtı: das Guthaben.","tr":"ek ödeme, fark ödemesi","s":"Die geforderte Nachzahlung ist ohne Belege nicht überprüfbar.","st":"Talep edilen ek ödeme belgeler olmadan denetlenemez.","f":"nachzahlen (sonradan ödemek) · das Guthaben (alacak bakiyesi) · die Rückzahlung (geri ödeme)"},{"w":"das Guthaben","t":"Nomen, -","k":"gut (iyi, olumlu) + haben","c":"das Guthaben, die Guthaben","br":"gut burada „olumlu, artı“ demektir, haben ise sahip olmaktır: hesabın artı tarafında sahip olunan tutar. Mastarın isimleşmiş hâli olduğu için nötr. Karşıtı die Nachzahlung: eksik kaldığında doğan borç.","tr":"alacak bakiyesi, artı bakiye","s":"Das Guthaben wird mit der nächsten Miete verrechnet.","st":"Alacak bakiyesi bir sonraki kirayla mahsup edilecek.","f":"verrechnen (mahsup etmek) · das Konto (hesap) · die Nachzahlung (ek ödeme)"},{"w":"der Abrechnungszeitraum","t":"Nomen, ¨-e","k":"Abrechnung (ab+rechnen) + Zeitraum (zaman aralığı)","c":"der Abrechnungszeitraum, -räume","br":"Hesabın kapsadığı 12 aylık dönem. Ev sahibi dönem bitiminden itibaren 12 ay içinde hesabı sunmazsa ek ödeme talep edemez — süre burada da belirleyici.","tr":"hesap dönemi","s":"Der Abrechnungszeitraum umfasst das Kalenderjahr 2025.","st":"Hesap dönemi 2025 takvim yılını kapsıyor.","f":"abrechnen (hesaplaşmak) · die Abrechnung (hesap dökümü) · die Abrechnungsfrist (hesap süresi)"},{"w":"die Belegeinsicht","t":"Nomen (çoğulsuz)","k":"Beleg (belegen: belgelemek) + Einsicht (inceleme)","c":"die Belegeinsicht","br":"Kiracının orijinal faturaları yerinde görme hakkı. Hesabı denetlemenin tek gerçek yolu budur ve ücretsizdir.","tr":"belge inceleme (hakkı)","s":"Die Belegeinsicht darf nicht von einer Gebühr abhängig gemacht werden.","st":"Belge incelemesi bir ücrete bağlanamaz.","f":"der Beleg (belge, makbuz) · belegen (belgelemek) · die Einsicht (inceleme)"},{"w":"die Instandhaltung","t":"Nomen (çoğulsuz)","k":"instand (sağlam durumda) + halten (tutmak)","c":"die Instandhaltung","br":"Binayı sağlam durumda tutmak = koruyucu bakım. Masrafı ev sahibine aittir, kiracıya yansıtılamaz.","tr":"bakım, sağlam tutma","s":"Die Kosten der Instandhaltung trägt der Vermieter.","st":"Bakım masraflarını ev sahibi üstlenir.","f":"instand halten (bakımını yapmak) · die Instandsetzung (onarım) · der Zustand (durum)"},{"w":"die Instandsetzung","t":"Nomen, -en","k":"instand + setzen (koymak)","c":"die Instandsetzung, -en","br":"Bozulmuş olanı yeniden sağlam duruma „koymak“ = onarım. Instandhaltung koruma, Instandsetzung tamirdir; ikisi de kiracıya yansıtılamaz.","tr":"onarım, tamir","s":"Nach dem Wasserschaden war eine umfassende Instandsetzung nötig.","st":"Su hasarından sonra kapsamlı bir onarım gerekti.","f":"instand setzen (onarmak) · die Reparatur (tamir) · die Modernisierung (modernizasyon)"},{"w":"die Kaution","t":"Nomen, -en","k":"cautio (temkin, güvence — cavere: sakınmak)","c":"die Kaution, die Kautionen","br":"Latince „tedbir almak“ kökünden: olası zararlara karşı güvence = depozito. Yasal üst sınır üç aylık soğuk kiradır.","tr":"depozito, teminat","s":"Die Kaution ist auf einem separaten Konto anzulegen.","st":"Depozito ayrı bir hesapta tutulmalıdır.","f":"die Sicherheit (teminat) · hinterlegen (emanet etmek) · die Kautionsrückzahlung (depozito iadesi)"},{"w":"die Mietminderung","t":"Nomen, -en","k":"Miete (kira) + mindern (azaltmak) + -ung","c":"die Mietminderung, -en","br":"mindern = azaltmak (minder: daha az). Kusur varsa kira kendiliğinden azalır; kiracının ayrıca izin alması gerekmez, ama kusuru bildirmesi şarttır.","tr":"kira indirimi","s":"Bei erheblichen Mängeln ist eine Mietminderung zulässig.","st":"Ciddi kusurlarda kira indirimi caizdir.","f":"mindern (azaltmak) · der Mangel (kusur) · die Mängelanzeige (kusur bildirimi)"},{"w":"der Zählerstand","t":"Nomen, ¨-e","k":"Zähler (zählen: saymak) + Stand (stehen: durum)","c":"der Zählerstand, die -stände","br":"Sayacın o anda durduğu değer. Taşınırken tutanağa geçirilmezse, sonraki hesabın tamamı tartışmalı hâle gelir.","tr":"sayaç değeri","s":"Beim Auszug wurden die Zählerstände protokolliert.","st":"Taşınırken sayaç değerleri tutanağa geçirildi.","f":"der Zähler (sayaç) · ablesen (okumak) · das Übergabeprotokoll (teslim tutanağı)"},{"w":"die Modernisierung","t":"Nomen, -en","k":"modern + -isieren + -ung","c":"die Modernisierung, -en","br":"Onarımdan farkı: durumu eskisine getirmek değil, iyileştirmek. Bu fark önemlidir, çünkü modernizasyon masrafının bir kısmı kiraya yansıtılabilir.","tr":"modernizasyon, iyileştirme","s":"Nach der Modernisierung darf die Miete begrenzt erhöht werden.","st":"Modernizasyondan sonra kira sınırlı ölçüde artırılabilir.","f":"modernisieren (yenilemek) · die Instandsetzung (onarım) · die Mieterhöhung (kira artışı)"}]},{"n":"Konut arama ve taşınma","e":"Besichtigung, Makler, Nachmieter, Mietspiegel…","c":"#4a7a6a","g":"Hukuk & idare dili","cards":[{"w":"die Besichtigung","t":"Nomen, -en","k":"be + Sicht (bakış) + -igung","c":"die Besichtigung, -en","br":"Görmeye gitme: daire görme randevusu. Toplu yapılanına Massenbesichtigung denir. Fiil hâli: eine Wohnung besichtigen.","tr":"(daire) görme randevusu","s":"Die Besichtigung ist am Samstag um elf.","st":"Daire görme randevusu cumartesi saat on birde.","f":"besichtigen (görmeye gitmek) · die Sicht (bakış) · der Termin (randevu)"},{"w":"der Makler ↔ die Provision","t":"Emlak çifti","k":"makeln (aracılık etmek) / provisio (tedarik)","c":"—","br":"Aracı komisyonu artık kural olarak onu görevlendiren tarafa aittir (Bestellerprinzip) — yani kiralamada genelde ev sahibi öder. Satışta durum farklıdır.","tr":"emlakçı ↔ komisyon","s":"Bei dieser Wohnung fällt keine Provision an.","st":"Bu dairede komisyon çıkmıyor.","f":"provisionsfrei (komisyonsuz) · der Vermieter (kiraya veren) · das Bestellerprinzip (görevlendiren öder ilkesi)"},{"w":"die Wohnfläche","t":"Nomen, -n","k":"wohnen (oturmak) + Fläche (alan)","c":"die Wohnfläche, -n","br":"Kiranın ve çoğu yan giderin dağıtım ölçüsü. Gerçek alan ilanda yazandan yüzde 10’dan fazla küçükse kira indirimi gündeme gelir — bu yüzden ölçmek işe yarar.","tr":"konut alanı (m²)","s":"Die tatsächliche Wohnfläche ist kleiner als im Vertrag angegeben.","st":"Gerçek konut alanı sözleşmede yazandan küçük.","f":"die Fläche (alan) · der Quadratmeter (metrekare) · der Verteilerschlüssel (dağıtım anahtarı)"},{"w":"der Mietspiegel","t":"Nomen, -","k":"Miete + Spiegel (ayna, tablo)","c":"der Mietspiegel, -","br":"Şehirdeki alışılmış kira düzeyini gösteren resmî tablo — kiranın „aynası“. Kira artışının ve fahiş kiranın ölçüsü budur: ortsübliche Vergleichsmiete.","tr":"kira endeksi, kira tablosu","s":"Laut Mietspiegel liegt die Miete deutlich über dem Durchschnitt.","st":"Kira endeksine göre kira ortalamanın belirgin şekilde üstünde.","f":"die Vergleichsmiete (emsal kira) · ortsüblich (bölgede alışılmış) · die Mietpreisbremse (kira freni)"},{"w":"die Staffelmiete ↔ die Indexmiete","t":"Kira çifti","k":"Staffel (kademe) / Index (endeks)","c":"—","br":"İki artış modeli: Staffelmiete’de artışlar sözleşmede tarih ve tutar olarak baştan yazılır; Indexmiete’de kira enflasyona bağlanır. Hangisi imzalandıysa artış onun kuralına göre işler.","tr":"kademeli kira ↔ endeksli kira","s":"Im Vertrag ist eine Staffelmiete bis 2028 vereinbart.","st":"Sözleşmede 2028’e kadar kademeli kira kararlaştırılmış.","f":"die Mieterhöhung (kira artışı) · die Inflation (enflasyon) · vereinbaren (kararlaştırmak)"},{"w":"der Nachmieter","t":"Nomen, -","k":"nach (sonra) + Mieter (kiracı)","c":"der Nachmieter, -","br":"Senden sonra girecek kiracı. Sözleşme süresi bitmeden çıkmak isteyen kiracı genelde uygun bir Nachmieter önerir — ev sahibi kabul etmek zorunda değildir ama pratikte işi çözer.","tr":"yerine geçecek kiracı","s":"Wir suchen einen Nachmieter zum 1. Oktober.","st":"1 Ekim için yerimize geçecek kiracı arıyoruz.","f":"der Vormieter (önceki kiracı) · der Untermieter (alt kiracı) · vorzeitig (süresinden önce)"},{"w":"das Übergabeprotokoll","t":"Nomen, -e","k":"Übergabe (teslim) + Protokoll (tutanak)","c":"das Übergabeprotokoll, -e","br":"Giriş ve çıkışta dairenin durumunu ve sayaçları kayda geçiren tutanak. Depozito tartışmalarının kaderini bu kâğıt belirler: yazılmayan kusur sonradan sana yazılır.","tr":"teslim tutanağı","s":"Ohne Übergabeprotokoll wird es beim Auszug schwierig.","st":"Teslim tutanağı olmadan taşınırken işler zorlaşır.","f":"der Zählerstand (sayaç değeri) · der Mangel (kusur) · die Kaution (depozito)"},{"w":"die Untermiete ↔ die WG","t":"Ortak yaşam","k":"unter + Miete / Wohngemeinschaft","c":"—","br":"Untermiete kiracının odayı başkasına kiralamasıdır ve ev sahibinin izni gerekir. WG ise birden çok kişinin birlikte kiraladığı daire — Almanya’da öğrenci hayatının standardı.","tr":"alt kiracılık ↔ ev arkadaşlığı","s":"Für die Untermiete braucht man die Erlaubnis des Vermieters.","st":"Alt kiracılık için ev sahibinin izni gerekiyor.","f":"die Erlaubnis (izin) · die Wohngemeinschaft (ev arkadaşlığı) · das Zimmer (oda)"},{"w":"der Wohnberechtigungsschein","t":"Nomen, -e","k":"Wohn + Berechtigung (hak) + Schein (belge)","c":"der Wohnberechtigungsschein, -e","br":"Kısaltması WBS. Sosyal konut kiralayabilmek için gereken belge; gelir sınırına bağlıdır. İlanda „nur mit WBS“ yazıyorsa belge olmadan başvurmak boşunadır.","tr":"sosyal konut hakkı belgesi (WBS)","s":"Diese Wohnung wird nur mit WBS vergeben.","st":"Bu daire yalnızca WBS ile veriliyor.","f":"die Berechtigung (hak, yetki) · der Schein (belge) · die Sozialwohnung (sosyal konut)"},{"w":"die Schönheitsreparaturen","t":"Nomen (çoğul)","k":"Schönheit (güzellik) + Reparatur","c":"die Schönheitsreparaturen (Pl.)","br":"Schönheit güzelliktir (schön + -heit), Reparatur onarım: yani işlevi değil görünüşü onaran işler — boya, badana, delik kapatma. Fugen-s kuralı da burada çalışır: -heit ile biten kelimeden sonra daima s gelir.","tr":"boya badana işleri","s":"Starre Klauseln zu Schönheitsreparaturen sind meist unwirksam.","st":"Boya badanaya ilişkin katı maddeler çoğunlukla geçersizdir.","f":"streichen (boyamak) · unwirksam (geçersiz) · die Klausel (madde)"},{"w":"der Umzug","t":"Nomen, ¨-e","k":"um + Zug (ziehen)","c":"der Umzug, die Umzüge","br":"Kendini başka yere çekmek. Taşınma çevresi: der Umzugskarton, das Umzugsunternehmen, die Halteverbotszone (park yasağı alanı — kamyon için başvurulur).","tr":"taşınma","s":"Der Umzug ist für Ende September geplant.","st":"Taşınma eylül sonuna planlandı.","f":"umziehen (taşınmak) · der Einzug (girme) · der Auszug (çıkma)"},{"w":"der Nachsendeauftrag","t":"Nomen, ¨-e","k":"nach + senden + Auftrag (talimat)","c":"der Nachsendeauftrag, -aufträge","br":"Postanın yeni adrese yönlendirilmesi talimatı. Taşınırken unutulursa resmî yazılar eski adrese gider — süre kaçırmanın en sık sebeplerinden biri budur.","tr":"posta yönlendirme talimatı","s":"Den Nachsendeauftrag habe ich für sechs Monate eingerichtet.","st":"Posta yönlendirmeyi altı aylığına ayarladım.","f":"nachsenden (arkasından göndermek) · die Post (posta) · die Anschrift (adres)"},{"w":"die Kündigungsfrist (Miete)","t":"Nomen, -en","k":"Kündigung + Frist","c":"die Kündigungsfrist, -en","br":"Kiracı için kural olarak üç aydır ve ayın üçüncü iş gününe kadar verilen fesih o ay sayılır. Ev sahibi için süre kiracının oturma yılına göre uzar — asimetri kiracı lehinedir.","tr":"fesih ihbar süresi","s":"Die Kündigungsfrist beträgt für Mieter drei Monate.","st":"Kiracılar için fesih süresi üç aydır.","f":"kündigen (feshetmek) · fristgerecht (süresine uygun) · das Kündigungsschreiben (fesih yazısı)"},{"w":"die Mietkaution zurückfordern","t":"Kollokation","k":"Kaution + zurückfordern (geri istemek)","c":"fordert zurück – forderte zurück","br":"Depozito, hesaplaşma bitince iade edilir; ev sahibi makul bir süre (genelde 3–6 ay) tutabilir. Yan gider hesabı için küçük bir kısmı ayrılabilir, tamamı değil.","tr":"depozitoyu geri istemek","s":"Nach sechs Monaten habe ich die Kaution schriftlich zurückgefordert.","st":"Altı ay sonra depozitoyu yazılı olarak geri istedim.","f":"die Kaution (depozito) · einbehalten (alıkoymak) · die Abrechnung (hesaplaşma)"}]},{"n":"Sigorta dili","e":"Haftpflicht, Selbstbeteiligung, Schadensmeldung…","c":"#5a4a7a","g":"Hukuk & idare dili","cards":[{"w":"die Haftpflichtversicherung","t":"Nomen, -en","k":"Haftpflicht (sorumluluk) + Versicherung","c":"die Haftpflichtversicherung, -en","br":"Başkasına verdiğin zararı karşılayan sigorta. Almanya’da zorunlu değil ama neredeyse herkeste vardır — çünkü kişi kendi malvarlığıyla sınırsız sorumludur.","tr":"özel sorumluluk sigortası","s":"Das übernimmt normalerweise die Haftpflichtversicher
