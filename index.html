<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1b2430}
body{min-height:100vh}
#home{padding:18px 16px 60px;max-width:1100px;margin:0 auto}
.h-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:26px;margin:0;letter-spacing:-.5px}
.sub{color:#6b7785;font-size:14px;margin:6px 0 16px;line-height:1.45}
.stats{border-radius:16px;padding:16px 18px;color:#fff;background:linear-gradient(120deg,#2f6df6,#22b8a6);margin-bottom:16px}
.stats .row{display:flex;gap:22px;align-items:flex-end}
.stats b{font-size:26px;display:block;line-height:1}
.stats span{font-size:12px;opacity:.85}
.bar{height:7px;border-radius:6px;background:rgba(255,255,255,.28);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .3s}
#search{width:100%;padding:12px 14px;border:1px solid #dde3ea;border-radius:12px;font-size:16px;margin-bottom:16px;outline:none}
#search:focus{border-color:#2f6df6}
.grp{margin-bottom:14px}
.grp>h2{font-size:15px;margin:0;padding:12px 14px;background:#f3f6fa;border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:650}
.grp>h2 .gh{display:flex;flex-direction:column;gap:2px;min-width:0}
.grp>h2 .gh b{font-weight:700}
.grp>h2 .gh i{font-style:normal;font-size:11.5px;color:#8593a3;font-weight:500;line-height:1.3}
.grp>h2{align-items:flex-start}
.grp>h2 em{font-style:normal;color:#8593a3;font-size:12px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border:1px solid #e6ebf1;border-radius:14px;padding:12px 12px 10px;border-top:5px solid #999;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile:active{transform:scale(.98)}
.tile h3{margin:0;font-size:15px;line-height:1.25}
.thead{display:flex;align-items:center;gap:10px}
.ring{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 background:conic-gradient(var(--c) calc(var(--p) * 1%), #e8edf3 0)}
.ring i{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
 font-style:normal;font-size:11.5px;font-weight:800;color:#3b4653;letter-spacing:-.3px}
.tile .sub2{font-size:11.5px;color:#8593a3;margin-top:2px}
.tile.full .ring i{color:#12795a}
.tile p{margin:0;font-size:12px;color:#6b7785;line-height:1.35;flex:1}
.tile .foot{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:11px;background:#f1f4f8;border-radius:20px;padding:3px 9px;color:#54606e}
.mini{height:4px;background:#eef1f5;border-radius:4px;flex:1;margin-left:8px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:4px;background:#2f6df6}

.modes{display:flex;gap:7px;flex-wrap:wrap;margin:-6px 0 10px}
.chip{border:1px solid #dde3ea;background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;color:#54606e;cursor:pointer}
.chip.on{background:#2f6df6;border-color:#2f6df6;color:#fff;font-weight:600}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.quick button{border:1px solid #e6ebf1;background:#f7f9fc;border-radius:10px;padding:8px 12px;font-size:13px;color:#3b4653;cursor:pointer}
.quick button:active{background:#eef2f7}
.quick button.warn{color:#b23d17;border-color:#f2ded6;background:#fdf6f3}
.rev .word{font-size:26px}
.cb.know{background:#fff;color:#2f6df6;font-size:17px;font-weight:700}
.grp.locked>h2{opacity:.6}
.daybar{height:7px;border-radius:6px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden}
.daybar i{display:block;height:100%;background:#ffe27a;border-radius:6px;transition:width .3s}
.goalbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;font-size:12.5px;color:#6b7785}
.gchip{border:1px solid #dde3ea;background:#fff;border-radius:9px;padding:5px 11px;font-size:13px;color:#54606e;cursor:pointer;font-weight:600}
.gchip.on{background:#12795a;border-color:#12795a;color:#fff}
.gnote{color:#9aa6b4}
.plan b.rest{color:#ffe27a}
.foot-note{margin:26px 0 8px;text-align:center;font-size:11.5px;color:#a3adb9;line-height:1.6}
.lockmsg{margin-top:10px;font-size:12.5px;color:#8593a3;background:#f7f8fa;border:1px dashed #dde3ea;border-radius:12px;padding:12px 14px;line-height:1.45}
.tile.lock{background:#f7f8fa;border-color:#eceff3;opacity:.72}
.tile.lock h3,.tile.lock p{color:#9aa6b4}
.tile.lock .pill{background:#eef1f5;color:#8593a3}
.lockrow{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8593a3;font-weight:600}
.plan{font-size:12px;opacity:.9;margin-top:9px;line-height:1.4}
.srs{color:#fff;font-size:12.5px;opacity:.92;text-align:center;margin:-4px 0 8px;min-height:16px}
.srs b{font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:rgba(20,30,40,.92);color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
.gprog{display:flex;align-items:center;gap:8px;margin-top:6px}
.gprog .bar2{flex:1;height:5px;background:#e6ebf1;border-radius:5px;overflow:hidden}
.gprog .bar2 i{display:block;height:100%;background:#2f6df6;border-radius:5px}
.gprog span{font-size:11.5px;color:#6b7785;white-space:nowrap}
.gprog .due{color:#c2410c;font-weight:700}
.tile .duebadge{font-size:10.5px;background:#fdece3;color:#c2410c;border-radius:20px;padding:2px 7px;font-weight:700}
.tag.rev{background:#eafaf2;color:#12795a}
.hidden{display:none!important}

/* STUDY */
#study{position:fixed;inset:0;background:linear-gradient(160deg,#2f6df6,#1fa9a0 70%,#18b39a);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 14px)}
#study.on{display:flex}
.s-top{display:flex;align-items:center;gap:12px;color:#fff}
.back{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:15px;border-radius:10px;padding:8px 12px;cursor:pointer}
.s-title{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-count{font-size:13px;opacity:.9}
.pbar{height:5px;background:rgba(255,255,255,.25);border-radius:5px;margin:10px 0 12px;overflow:hidden}
.pbar i{display:block;height:100%;background:#fff;transition:width .25s}
.stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:1600px;min-height:0}
.card{width:100%;max-width:620px;height:100%;max-height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:20px;padding:20px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.face.b{transform:rotateY(180deg)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:#eef2f7;color:#4a5666;font-weight:600}
.tag.acc{background:#e7f0ff;color:#2159cf}
.word{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin:0}
@media(min-width:700px){.word{font-size:38px}}
.split{font-size:17px;color:#2159cf;font-weight:600}
.konj{font-size:14px;color:#6b7785;font-family:ui-monospace,Menlo,monospace}
.satz{font-size:19px;line-height:1.5;margin-top:auto}
@media(min-width:700px){.satz{font-size:22px}}
.hint{font-size:12px;color:#9aa6b4;text-align:center}
.blk{border-left:4px solid #22b8a6;padding-left:12px}
.blk h4{margin:0 0 4px;font-size:12px;color:#8593a3;font-weight:700}
.blk p{margin:0;font-size:17px;line-height:1.5}
.blk.logic{border-color:#f0a33a}
.blk.fam{border-color:#a06ef0}
.blk.fam p{font-size:15px;color:#41505f}
.blk.fam .fi{display:flex;gap:8px;align-items:baseline;margin:0 0 3px;font-size:15px;line-height:1.4}
.blk.fam .fi b{font-weight:650;color:#2b3744}
.blk.fam .fi span{color:#7c8794;font-size:14px}
.blk.mean2{border-color:#e0572f}
.blk.mean2 .m-tr{font-size:18px;font-weight:700;margin:0 0 4px}
.blk.mean2 .m-de{font-size:17px;margin:0;line-height:1.45}
.blk.mean2 .m-st{font-size:14px;color:#6b7785;margin:2px 0 0}
.tag.multi{background:#ffe9df;color:#b23d17}
.mean{font-size:24px;font-weight:700;line-height:1.3}
.ctrl{display:flex;justify-content:center;gap:11px;margin-top:14px}
.cb{width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cb:active{background:rgba(255,255,255,.35)}
.cb.done{background:#fff;color:#1fa9a0}
.cb.star.on{background:#ffd76a;color:#8a5b00}
.empty{color:#fff;text-align:center;padding:40px}
</style>
</head>
<body>
<div id="home">
  <div class="h-top"><h1>Wortlogik</h1></div>
  <p class="sub">Ezber değil çıkarım: her kelime kökine, ön ekine ve son ekine ayrılır; anlam bu parçalardan mantıkla türetilir. B1–C2.</p>
  <div class="stats">
    <div class="row">
      <div><b id="st-total">0</b><span>kart</span></div>
      <div><b id="st-done">0</b><span>çalışıldı</span></div>
      <div><b id="st-pct">0%</b><span>ilerleme</span></div>
      <div><b id="st-due">0</b><span>tekrar</span></div>
    </div>
    <div class="bar"><i id="st-bar" style="width:0"></i></div>
    <div class="daybar"><i id="day-bar" style="width:0"></i></div>
    <div class="plan" id="st-plan"></div>
  </div>
  <div class="goalbar">
    <span>Günlük hedef:</span>
    <button class="gchip" data-g="10">10</button>
    <button class="gchip" data-g="20">20</button>
    <button class="gchip" data-g="30">30</button>
    <button class="gchip" data-g="50">50</button>
    <span class="gnote">yeni kart / gün</span>
  </div>
  <input id="search" placeholder="Kelime, kök veya bölüm ara…" autocomplete="off">
  <div class="modes">
    <button class="chip on" data-f="all">Tümü</button>
    <button class="chip" data-f="star">★ Yıldızlı</button>
    <button class="chip" data-f="new">Çalışılmamış</button>
    <button class="chip" data-f="due">Tekrar zamanı</button>
    <button class="chip" id="t-shuffle">Karıştır</button>
    <button class="chip" id="t-rev">Ters yön</button>
    <button class="chip" id="t-free">Serbest mod</button>
  </div>
  <div class="quick">
    <button id="go-today">Bugünün destesi</button>
    <button id="go-due">Tekrarı başlat</button>
    <button id="go-star">Yıldızlıları çalış</button>
    <button id="go-new">Çalışılmamışları çalış</button>
    <button id="go-all">Rastgele 20 kart</button>
    <button id="reset" class="warn">İlerlemeyi sıfırla</button>
  </div>
  <div id="groups"></div>
  <div class="foot-note" id="foot"></div>
</div>

<div id="toast"></div>
<div id="study">
  <div class="s-top">
    <button class="back" id="btn-back">‹ Geri</button>
    <div class="s-title" id="s-title"></div>
    <div class="s-count" id="s-count"></div>
  </div>
  <div class="pbar"><i id="s-bar" style="width:0"></i></div>
  <div class="srs" id="s-srs"></div>
  <div class="stage">
    <div class="card" id="card">
      <div class="face f" id="face-f"></div>
      <div class="face b" id="face-b"></div>
    </div>
  </div>
  <div class="ctrl">
    <button class="cb" id="b-prev">‹</button>
    <button class="cb star" id="b-star">★</button>
    <button class="cb done" id="b-done">✓</button>
    <button class="cb know" id="b-know">✓✓</button>
    <button class="cb" id="b-next">›</button>
  </div>
</div>

<script>
const DATA = [{"n":"Ön ek: ver-","e":"yanlış yön · yok oluş · dönüşüm · pekiştirme","c":"#e0572f","g":"Ön ekler","cards":[{"w":"verlaufen","t":"Verb","k":"ver + laufen","c":"verläuft – verlief – ist verlaufen","br":"laufen = koşmak/akmak. ver- burada iki yönlü: (1) belli bir yönde akmak → seyretmek, (2) yanlış yöne gitmek → sich verlaufen = kaybolmak.","tr":"seyretmek, geçmek; sich ~ : yolunu kaybetmek","s":"Die Verhandlung ist überraschend ruhig verlaufen.","st":"Duruşma şaşırtıcı derecede sakin geçti.","f":"der Verlauf (seyir) · im Verlauf des Jahres (yıl içinde)","m":[{"tr":"sich verlaufen: yolunu kaybetmek","s":"In der Altstadt haben wir uns völlig verlaufen.","st":"Eski şehirde tamamen kaybolduk."}]},{"w":"versprechen","t":"Verb","k":"ver + sprechen","c":"verspricht – versprach – hat versprochen","br":"sprechen = konuşmak. ver- = sözü karşıya tamamen vermek → söz vermek. Aynı ön ek yanlış anlamıyla: sich versprechen = dili sürçmek.","tr":"söz vermek","s":"Er hat mir versprochen, die Unterlagen bis Freitag zu schicken.","st":"Evrakları cumaya kadar göndereceğine söz verdi.","f":"das Versprechen (söz, vaat) · der Versprecher (dil sürçmesi) · vielversprechend (umut vadeden)","m":[{"tr":"sich versprechen: dili sürçmek","s":"Ich habe mich versprochen und den falschen Termin genannt.","st":"Dilim sürçtü ve yanlış tarihi söyledim."}]},{"w":"verzichten","t":"Verb + auf (A)","k":"ver + zichten (eski: zeihen = ilan etmek)","c":"verzichtet – verzichtete – hat verzichtet","br":"Hakkını açıkça ilan edip kendinden uzaklaştırmak. ver- = uzaklaştırma.","tr":"vazgeçmek, feragat etmek","s":"Auf eine Klage möchte ich vorerst verzichten.","st":"Şimdilik dava açmaktan vazgeçmek istiyorum.","f":"der Verzicht (feragat) · verzichtbar (vazgeçilebilir) · unverzichtbar (vazgeçilmez)"},{"w":"verfügen","t":"Verb + über (A)","k":"ver + fügen (yerleştirmek)","c":"verfügt – verfügte – hat verfügt","br":"fügen = parçaları yerleştirmek. Bir şeyi istediğin yere yerleştirebiliyorsan ona sahipsindir; resmî dilde: yerleştirme emri vermek.","tr":"sahip olmak (über+A); resmî olarak karar vermek","s":"Das Hotel verfügt über einen Pool und einen kleinen Garten.","st":"Otelin havuzu ve küçük bir bahçesi var.","f":"die Verfügung (emir; tasarruf) · verfügbar (mevcut) · zur Verfügung stehen (emre amade olmak)","m":[{"tr":"über+A: sahip olmak","s":"Die Schule verfügt über zwei moderne Fachräume.","st":"Okulun iki modern branş dersliği var."}]},{"w":"vermeiden","t":"Verb","k":"ver + meiden (kaçınmak)","c":"vermeidet – vermied – hat vermieden","br":"meiden zaten „uzak durmak“ demektir; ver- onu tamamlanmış hâle getirir: baştan engellemek. Fark şurada: meiden bir şeyden kaçınmaktır (kişi, yer), vermeiden ise bir şeyin olmasını önlemektir. Türevi vermeidbar/unvermeidlich, resmî yazıda çok işlek.","tr":"önlemek, kaçınmak","s":"Missverständnisse lassen sich durch klare Absprachen vermeiden.","st":"Yanlış anlaşılmalar net anlaşmalarla önlenebilir.","f":"die Vermeidung (önleme, kaçınma) · vermeidbar (önlenebilir) · unvermeidlich (kaçınılmaz)"},{"w":"verschwinden","t":"Verb","k":"ver + schwinden (azalmak)","c":"verschwindet – verschwand – ist verschwunden","br":"schwinden = azalmak. ver- = sürecin sonuna kadar → azala azala yok olmak.","tr":"kaybolmak, ortadan yok olmak","s":"Die Akte ist spurlos verschwunden.","st":"Dosya izsiz şekilde kayboldu.","f":"das Verschwinden (kayboluş) · verschwunden (kaybolmuş)"},{"w":"verbringen","t":"Verb","k":"ver + bringen","c":"verbringt – verbrachte – hat verbracht","br":"bringen = getirmek. ver- = tüketerek bitirme → zamanı taşıyıp tüketmek.","tr":"(zaman) geçirmek","s":"Wir haben den ganzen Nachmittag mit Papierkram verbracht.","st":"Bütün öğleden sonrayı evrak işiyle geçirdik.","f":"das Verbringen (nadir) · vgl. verbrauchen (tüketmek)"},{"w":"verstoßen","t":"Verb + gegen (A)","k":"ver + stoßen (çarpmak)","c":"verstößt – verstieß – hat verstoßen","br":"stoßen = çarpmak. ver- = yanlış yöne → kurala çarpmak = kuralı ihlal etmek.","tr":"ihlal etmek, aykırı davranmak","s":"Wer hier parkt, verstößt gegen die Hausordnung.","st":"Buraya park eden bina kurallarını çiğniyor.","f":"der Verstoß (ihlal) · der Rechtsverstoß (hukuk ihlali)"},{"w":"verzögern","t":"Verb","k":"ver + zögern (tereddüt etmek)","c":"verzögert – verzögerte – hat verzögert","br":"zögern duraksamak, karar veremeyip beklemektir; ver- bu duraksamayı uzatıp sürece yayar. Yani gecikme burada bir tereddüdün büyütülmüş hâlidir. Refleksifi kendiliğinden gecikmeyi anlatır: Der Bescheid verzögert sich. İsim die Verzögerung; karşıtı unverzüglich (gecikmeksizin).","tr":"geciktirmek; sich ~ : gecikmek","s":"Mein Zug verzögert sich um zwanzig Minuten.","st":"Trenim yirmi dakika gecikiyor.","f":"die Verzögerung (gecikme) · verzögert (gecikmiş) · unverzüglich (gecikmeksizin)"},{"w":"verschärfen","t":"Verb","k":"ver + scharf + -en","c":"verschärft – verschärfte – hat verschärft","br":"ver- + sıfat + -en kalıbı: sıfatı fiile çevirir. scharf (keskin) → keskinleştirmek, sertleştirmek.","tr":"sertleştirmek, ağırlaştırmak","s":"Die Regierung hat die Auflagen deutlich verschärft.","st":"Hükümet şartları belirgin şekilde sertleştirdi.","f":"die Verschärfung (sertleştirme) · verschärft (sertleştirilmiş) · scharf (keskin)"},{"w":"vereinfachen","t":"Verb","k":"ver + einfach + -en","c":"vereinfacht – vereinfachte – hat vereinfacht","br":"ver- + sıfat + -en kalıbı: sıfatı fiile çevirir ve „o hâle getirmek“ anlamı verir. einfach (basit) → basitleştirmek. Aynı kalıptan verschärfen, verbessern, verschlechtern, verlängern — bu tek kural onlarca fiili birden açar.","tr":"basitleştirmek","s":"Das neue Formular vereinfacht den Antrag erheblich.","st":"Yeni form başvuruyu kayda değer ölçüde basitleştiriyor.","f":"die Vereinfachung (basitleştirme) · einfach (basit; sadece)"},{"w":"verwirklichen","t":"Verb","k":"ver + wirklich + -en","c":"verwirklicht – verwirklichte – hat verwirklicht","br":"wirklich gerçek demektir ve kökü wirken (etki etmek): gerçek olan, etki edendir. ver- + sıfat + -en kalıbı onu fiile çevirir: gerçek hâline getirmek. Aynı aileden die Wirklichkeit (gerçeklik), die Wirkung (etki), wirksam (etkili).","tr":"gerçekleştirmek, hayata geçirmek","s":"Er konnte seinen Plan endlich verwirklichen.","st":"Planını nihayet hayata geçirebildi.","f":"die Verwirklichung (gerçekleştirme) · die Wirklichkeit (gerçeklik) · wirken (etki etmek; …görünmek)"},{"w":"verkennen","t":"Verb","k":"ver + kennen","c":"verkennt – verkannte – hat verkannt","br":"kennen tanımaktır; ver- burada „yanlış yöne“ anlamı katar — aynı ön ek versprechen’de dil sürçmesini, verlaufen’de kaybolmayı yapar. Yani yanlış tanımak, değerini görememek. Partizip’i sıfat olmuştur: ein verkanntes Talent.","tr":"yanlış değerlendirmek, hafife almak","s":"Man darf die Tragweite dieser Entscheidung nicht verkennen.","st":"Bu kararın kapsamı hafife alınmamalı.","f":"verkannt (yanlış anlaşılmış) · die Verkennung (yanlış değerlendirme)"},{"w":"sich verhalten","t":"Verb (refleksiv)","k":"ver + halten (tutmak)","c":"verhält – verhielt – hat verhalten","br":"Kendini belli bir şekilde tutmak = davranmak. Aynı kökten Verhältnis: iki şeyin birbirine göre tutumu = oran/ilişki.","tr":"davranmak","s":"In solchen Situationen sollte man sich neutral verhalten.","st":"Böyle durumlarda tarafsız davranılmalı.","f":"das Verhalten (davranış) · das Verhältnis (oran, ilişki) · verhältnismäßig (orantılı)"},{"w":"verlangen","t":"Verb","k":"ver + langen (uzanmak)","c":"verlangt – verlangte – hat verlangt","br":"langen uzanmaktır (bkz. die Länge: uzunluk); ver- uzanmayı ısrarlı bir talebe çevirir: bir şeye uzanıp istemek. bitten nazik ricadır, fordern resmî taleptir, verlangen ise hak ya da güçle istemektir. İsim: das Verlangen (arzu).","tr":"talep etmek, istemek","s":"Der Vermieter verlangt eine Nachzahlung von 400 Euro.","st":"Ev sahibi 400 avroluk ek ödeme talep ediyor.","f":"das Verlangen (arzu) · auf Verlangen (talep üzerine)"},{"w":"verderben","t":"Verb","k":"ver + derben (eski: mahvolmak)","c":"verdirbt – verdarb – ist/hat verdorben","br":"ver- = bozulmaya doğru gitme. Nesnesiz: bozulmak (ist), nesneli: bozmak (hat).","tr":"bozulmak; bozmak, berbat etmek","s":"Bei dieser Hitze verdirbt das Fleisch innerhalb weniger Stunden.","st":"Bu sıcakta et birkaç saat içinde bozulur.","f":"verdorben (bozulmuş) · verderblich (çabuk bozulan) · das Verderben (mahvoluş)","m":[{"tr":"nesneli (hat): bozmak, berbat etmek","s":"Diese Nachricht hat mir den ganzen Abend verdorben.","st":"Bu haber bütün akşamımı berbat etti."}]}]},{"n":"Ön ek: be-","e":"nesneyi doğrudan hedef alır · isimden fiil üretir","c":"#2f6df6","g":"Ön ekler","cards":[{"w":"betreten","t":"Verb","k":"be + treten (adım atmak)","c":"betritt – betrat – hat betreten","br":"treten in+A ister; be- eklenince edat düşer, nesne doğrudan gelir: einen Raum betreten. be-nin ana işlevi budur.","tr":"(bir yere) girmek, ayak basmak","s":"Das Betreten der Baustelle ist für Unbefugte verboten.","st":"Şantiyeye yetkisiz kişilerin girmesi yasaktır.","f":"das Betreten (giriş, ayak basma) · der Tritt (adım, tekme) · vertreten (temsil etmek)"},{"w":"beantragen","t":"Verb","k":"be + Antrag (başvuru) + -en","c":"beantragt – beantragte – hat beantragt","br":"be- + isim + -en: ismi doğrudan fiile çevirir. Antrag = başvuru → başvuru yapmak.","tr":"başvurmak, talep etmek","s":"Nächste Woche beantrage ich einen neuen Personalausweis.","st":"Gelecek hafta yeni kimlik başvurusu yapacağım.","f":"der Antrag (başvuru) · die Beantragung (başvuruda bulunma) · der Antragsteller (başvuru sahibi)"},{"w":"bestehen","t":"Verb","k":"be + stehen (durmak)","c":"besteht – bestand – hat bestanden","br":"Sağlam durmak. Üç yönü: aus+D (parçalardan durmak = oluşmak), auf+D (üstünde durmak = ısrar etmek), nesneli (sınavda ayakta kalmak = geçmek).","tr":"oluşmak (aus); ısrar etmek (auf); (sınavı) geçmek","s":"Die Prüfung hat sie auf Anhieb bestanden.","st":"Sınavı ilk seferde geçti.","f":"der Bestand (mevcut, stok) · beständig (kalıcı) · der Bestandteil (bileşen)","m":[{"tr":"aus+D: …dan oluşmak","s":"Die Prüfung besteht aus einem schriftlichen und einem mündlichen Teil.","st":"Sınav yazılı ve sözlü iki bölümden oluşuyor."},{"tr":"auf+D: ısrar etmek","s":"Der Vermieter besteht auf einer schriftlichen Kündigung.","st":"Ev sahibi yazılı fesihte ısrar ediyor."}]},{"w":"behaupten","t":"Verb","k":"be + Haupt (baş) + -en","c":"behauptet – behauptete – hat behauptet","br":"Haupt = baş. Bir görüşün başına geçip onu savunmak → iddia etmek. sich behaupten: kendini kabul ettirmek.","tr":"iddia etmek","s":"Er behauptet, den Brief nie erhalten zu haben.","st":"Mektubu hiç almadığını iddia ediyor.","f":"die Behauptung (iddia) · das Haupt (baş) · hauptsächlich (başlıca)","m":[{"tr":"sich behaupten: kendini kabul ettirmek","s":"Sie konnte sich gegen drei Mitbewerber behaupten.","st":"Üç rakibine karşı kendini kabul ettirdi."}]},{"w":"beurteilen","t":"Verb","k":"be + Urteil (hüküm) + -en","c":"beurteilt – beurteilte – hat beurteilt","br":"Urteil = hüküm, karar. Bir şey hakkında hüküm kurmak = değerlendirmek.","tr":"değerlendirmek, hüküm vermek","s":"Diese Leistung lässt sich nur im Kontext beurteilen.","st":"Bu performans ancak bağlam içinde değerlendirilebilir.","f":"die Beurteilung (değerlendirme) · das Urteil (hüküm) · verurteilen (mahkûm etmek)"},{"w":"berücksichtigen","t":"Verb","k":"be + Rücksicht (geriye bakış) + -igen","c":"berücksichtigt – berücksichtigte – hat berücksichtigt","br":"Rück (geri) + Sicht (bakış) = bir şeye dönüp bakmak, gözetmek → hesaba katmak.","tr":"dikkate almak, göz önünde bulundurmak","s":"Bei der Planung müssen wir die Kinder berücksichtigen.","st":"Planlarken çocukları da hesaba katmalıyız.","f":"die Berücksichtigung (dikkate alma) · die Rücksicht (gözetme, nezaket) · rücksichtslos (düşüncesiz)"},{"w":"bewältigen","t":"Verb","k":"be + Gewalt (güç) + -igen","c":"bewältigt – bewältigte – hat bewältigt","br":"Gewalt = güç, kuvvet (bkz. gewaltig: muazzam). Bir şeye gücünü uygulayıp onu alt etmek. schaffen sadece bitirmektir, bewältigen ise direnç gösteren bir yükü yenmeyi ima eder: Stoff, Krise, Alltag.","tr":"üstesinden gelmek, başa çıkmak","s":"Die Klasse hat den Stoff erstaunlich schnell bewältigt.","st":"Sınıf müfredatı şaşırtıcı biçimde hızlı bitirdi.","f":"die Bewältigung (üstesinden gelme) · die Gewalt (güç, şiddet) · gewaltig (muazzam)"},{"w":"beeinflussen","t":"Verb","k":"be + Einfluss (ein + fließen: içeri akış) + -en","c":"beeinflusst – beeinflusste – hat beeinflusst","br":"Einfluss „içeri akan şey“dir (ein + fließen) — etki, akıntı gibi düşünülmüştür. be- ismi doğrudan nesne alan fiile çevirir: birine etki akıtmak. Aynı aileden einflussreich (nüfuzlu) ve die Beeinflussung.","tr":"etkilemek","s":"Der Lärm beeinflusst die Konzentration der Schüler erheblich.","st":"Gürültü öğrencilerin konsantrasyonunu ciddi şekilde etkiliyor.","f":"der Einfluss (etki) · die Beeinflussung (etkileme) · einflussreich (nüfuzlu)"},{"w":"begründen","t":"Verb","k":"be + Grund (temel, sebep) + -en","c":"begründet – begründete – hat begründet","br":"Grund hem zemin hem sebeptir; be- onu fiile çevirir: bir iddianın altına zemin koymak. Türkçedeki „temellendirmek“ ile birebir aynı imge. Aileden die Begründung (gerekçe), grundsätzlich (ilkesel), der Grundsatz (ilke).","tr":"gerekçelendirmek, temellendirmek","s":"Kannst du kurz begründen, warum du das anders siehst?","st":"Neden farklı düşündüğünü kısaca açıklayabilir misin?","f":"die Begründung (gerekçe) · der Grund (sebep, temel) · grundsätzlich (ilkesel olarak)"},{"w":"bezweifeln","t":"Verb","k":"be + Zweifel (şüphe) + -n","c":"bezweifelt – bezweifelte – hat bezweifelt","br":"Zweifel kökü zwei (iki): iki seçenek arasında kalmak = şüphe. Fiile çevrilince: şüphe duymak.","tr":"şüphe duymak, kuşkuyla karşılamak","s":"Ich bezweifle, dass wir das heute noch schaffen.","st":"Bunu bugün bitirebileceğimizden şüpheliyim.","f":"der Zweifel (şüphe) · zweifelhaft (şüpheli) · zweifellos (şüphesiz)"},{"w":"beabsichtigen","t":"Verb","k":"be + Absicht (ab + sehen: hedefe bakış) + -igen","c":"beabsichtigt – beabsichtigte – hat beabsichtigt","br":"Absicht = gözünü bir hedefe dikmek = niyet. Fiil: niyet etmek. Resmî yazı dilinde çok yaygın.","tr":"niyetinde olmak, amaçlamak","s":"Wir beabsichtigen, im Sommer umzuziehen.","st":"Yazın taşınmayı düşünüyoruz.","f":"die Absicht (niyet) · absichtlich (kasten) · unbeabsichtigt (kazara)"},{"w":"bewerten","t":"Verb","k":"be + Wert (değer) + -en","c":"bewertet – bewertete – hat bewertet","br":"Wert = değer; be- ismi doğrudan nesne alan fiile çevirir. Değer biçmek: okulda not vermek, ürüne yıldız vermek, durumu değerlendirmek. beurteilen ölçütle hüküm verir, bewerten ise bir değer atar — okul dilinde ikisi yan yana geçer.","tr":"değerlendirmek, not vermek","s":"Wie bewerten Sie die Qualität dieser Übersetzung?","st":"Bu çevirinin kalitesini nasıl değerlendiriyorsunuz?","f":"die Bewertung (değerlendirme, not) · der Wert (değer) · wertvoll (değerli) · abwerten (değer düşürmek)"},{"w":"belasten","t":"Verb","k":"be + Last (yük) + -en","c":"belastet – belastete – hat belastet","br":"Last = yük. Üstüne yük koymak. Tam zıddı ent- ile kurulur: entlasten (yükü almak).","tr":"yüklemek, zorlamak; (hesaba) borç yazmak","s":"Die hohen Nebenkosten belasten unser Haushaltsbudget stark.","st":"Yüksek yan giderler ev bütçemizi çok zorluyor.","f":"die Belastung (yük, baskı) · die Last (yük) · belastbar (yük kaldırabilen) · entlasten (yükünü hafifletmek)"},{"w":"beherrschen","t":"Verb","k":"be + Herr (efendi) + -schen","c":"beherrscht – beherrschte – hat beherrscht","br":"Herr = efendi, sahip. Bir şeyin efendisi olmak = ona hâkim olmak; sich beherrschen: kendine hâkim olmak.","tr":"hâkim olmak, iyi bilmek","s":"Sie beherrscht drei Sprachen nahezu fehlerfrei.","st":"Üç dile neredeyse hatasız hâkim.","f":"die Beherrschung (hâkimiyet) · der Herr (efendi, bey) · herrschen (hüküm sürmek) · beherrscht (kontrollü)","m":[{"tr":"sich beherrschen: kendine hâkim olmak","s":"Er konnte sich in der Diskussion kaum beherrschen.","st":"Tartışmada kendine güçlükle hâkim olabildi."}]}]},{"n":"Ön ek: ent-","e":"ayrılma · geri alma · tersine çevirme · başlangıç","c":"#8a4fd0","g":"Ön ekler","cards":[{"w":"entstehen","t":"Verb","k":"ent + stehen","c":"entsteht – entstand – ist entstanden","br":"ent- = ayrılıp çıkmak. Hiçlikten ayrılıp durur hâle gelmek = oluşmak, meydana gelmek.","tr":"oluşmak, meydana gelmek","s":"Durch das Leck ist ein Schaden von rund 2.000 Euro entstanden.","st":"Sızıntı yüzünden yaklaşık 2.000 avroluk hasar oluştu.","f":"die Entstehung (oluşum) · entstanden (oluşmuş)"},{"w":"entlassen","t":"Verb","k":"ent + lassen (bırakmak)","c":"entlässt – entließ – hat entlassen","br":"Bırakıp uzaklaştırmak. Bağlama göre: işten çıkarmak, taburcu etmek, tahliye etmek.","tr":"işten çıkarmak; taburcu etmek","s":"Die Firma hat im Januar zehn Leute entlassen.","st":"Şirket ocakta on kişiyi işten çıkardı.","f":"die Entlassung (işten çıkarma; taburcu) · das Entlassungsschreiben (fesih yazısı)","m":[{"tr":"işten çıkarmak","s":"Nach der Umstrukturierung wurden zwölf Mitarbeiter entlassen.","st":"Yeniden yapılanmadan sonra on iki çalışan işten çıkarıldı."}]},{"w":"entziehen","t":"Verb","k":"ent + ziehen (çekmek)","c":"entzieht – entzog – hat entzogen","br":"Çekip uzaklaştırmak. Resmî dilde bir hakkı geri almak için standart fiil.","tr":"geri almak, elinden almak; sich ~ : kaçınmak","s":"Nach dem Unfall hat man ihm den Führerschein entzogen.","st":"Kazadan sonra ehliyetini aldılar.","f":"der Entzug (geri alma) · entzogen (geri alınmış) · sich der Verantwortung entziehen (sorumluluktan kaçmak)","m":[{"tr":"sich entziehen: sıyrılmak, kaçınmak","s":"Er entzieht sich jeder Verantwortung.","st":"Her sorumluluktan sıyrılıyor."}]},{"w":"entsprechen","t":"Verb + Dativ","k":"ent + sprechen","c":"entspricht – entsprach – hat entsprochen","br":"sprechen konuşmaktır; ent- burada karşılıklılık katar: iki taraf birbirine „karşıdan konuşur“, yani denk düşer. Dativ nesne alır. Ortaç hâli edat gibi kullanılır: entsprechend den Vorgaben. İsim: die Entsprechung (karşılık).","tr":"uymak, karşılamak, denk gelmek","s":"Das Ergebnis entspricht genau meinen Erwartungen.","st":"Sonuç tam olarak beklentilerime uyuyor.","f":"entsprechend (buna uygun olarak) · die Entsprechung (karşılık)"},{"w":"sich entwickeln","t":"Verb","k":"ent + wickeln (sarmak)","c":"entwickelt – entwickelte – hat entwickelt","br":"wickeln = sarmak. ent- ters çevirir: sargıyı açmak → içindekinin ortaya çıkması = gelişmek.","tr":"gelişmek; geliştirmek","s":"Die Lage hat sich in eine völlig andere Richtung entwickelt.","st":"Durum bambaşka bir yöne gelişti.","f":"die Entwicklung (gelişim) · der Entwickler (geliştirici) · entwickelt (gelişmiş)","m":[{"tr":"nesneli: geliştirmek","s":"Das Team hat ein völlig neues Verfahren entwickelt.","st":"Ekip bambaşka bir yöntem geliştirdi."}]},{"w":"entdecken","t":"Verb","k":"ent + decken (örtmek)","c":"entdeckt – entdeckte – hat entdeckt","br":"decken = örtmek. ent- geri alır: örtüyü kaldırmak = keşfetmek. (İngilizce discover ile birebir aynı mantık.)","tr":"keşfetmek, fark etmek","s":"Ich habe in der Rechnung einen groben Fehler entdeckt.","st":"Faturada büyük bir hata fark ettim.","f":"die Entdeckung (keşif) · der Entdecker (kâşif) · die Decke (örtü, tavan)"},{"w":"entfernen","t":"Verb","k":"ent + fern (uzak) + -en","c":"entfernt – entfernte – hat entfernt","br":"fern = uzak. ent- + sıfat + -en kalıbı: uzak hâle getirmek, yani kaldırmak. Aynı kalıptan entschärfen, entlasten. Refleksifi yön değiştirir: sich entfernen = uzaklaşmak. İsim hâli die Entfernung hem kaldırma hem mesafe demektir.","tr":"kaldırmak, çıkarmak; sich ~ : uzaklaşmak","s":"Bitte entfernen Sie diesen Absatz aus dem Schreiben.","st":"Lütfen bu paragrafı yazıdan çıkarın.","f":"die Entfernung (mesafe) · fern (uzak) · entfernt (uzak, ırak)","m":[{"tr":"sich entfernen: uzaklaşmak","s":"Bitte entfernen Sie sich nicht vom Gebäude.","st":"Lütfen binadan uzaklaşmayın."}]},{"w":"entscheiden","t":"Verb","k":"ent + scheiden (ayırmak)","c":"entscheidet – entschied – hat entschieden","br":"scheiden = ayırmak (Scheidung = boşanma). Seçenekleri birbirinden ayırmak = karar vermek.","tr":"karar vermek","s":"Das Gericht entscheidet voraussichtlich im Herbst.","st":"Mahkeme muhtemelen sonbaharda karar verecek.","f":"die Entscheidung (karar) · entscheidend (belirleyici) · die Scheidung (boşanma)"},{"w":"entlasten","t":"Verb","k":"ent + Last (yük) + -en","c":"entlastet – entlastete – hat entlastet","br":"belasten (yük yüklemek) fiilinin tam tersi: yükü almak. be- ↔ ent- karşıtlığının en net örneği.","tr":"yükünü hafifletmek, rahatlatmak; aklamak","s":"Die neue Kollegin entlastet das gesamte Team spürbar.","st":"Yeni meslektaş bütün ekibin yükünü gözle görülür şekilde hafifletiyor.","f":"die Entlastung (yükü hafifletme) · belasten (yüklemek, zorlamak) · das Entlastungszeugnis (ibraname)"},{"w":"entgehen","t":"Verb + Dativ","k":"ent + gehen","c":"entgeht – entging – ist entgangen","br":"Yürüyerek uzaklaşmak. Nesne özneden kaçar: bir şey birinin gözünden kaçar.","tr":"gözden kaçmak; (bir şeyden) kurtulmak","s":"Der Fehler ist mir völlig entgangen.","st":"Hata tamamen gözümden kaçmış.","f":"entgangen (gözden kaçmış) · sich etwas entgehen lassen (fırsatı kaçırmak)"},{"w":"sich entschließen","t":"Verb + zu (D)","k":"ent + schließen (kapamak)","c":"entschließt – entschloss – hat entschlossen","br":"schließen = kapatmak. ent- açar: kararsızlık kilidini açıp bir yönü seçmek.","tr":"karar vermek, kararlaştırmak","s":"Wir haben uns entschlossen, das Auto zu verkaufen.","st":"Arabayı satmaya karar verdik.","f":"der Entschluss (karar) · entschlossen (kararlı) · die Entschlossenheit (kararlılık)"},{"w":"enttäuschen","t":"Verb","k":"ent + täuschen (yanıltmak)","c":"enttäuscht – enttäuschte – hat enttäuscht","br":"täuschen = aldatmak, yanıltmak. ent- geri alır: yanılsamayı ortadan kaldırmak → hayal kırıklığı yaratmak.","tr":"hayal kırıklığına uğratmak","s":"Das Ergebnis hat uns alle sehr enttäuscht.","st":"Sonuç hepimizi çok hayal kırıklığına uğrattı.","f":"die Enttäuschung (hayal kırıklığı) · enttäuschend (hayal kırıklığı yaratan) · die Täuschung (yanılsama)"},{"w":"entnehmen","t":"Verb + Dativ","k":"ent + nehmen","c":"entnimmt – entnahm – hat entnommen","br":"nehmen almaktır; ent- „içinden ayırıp çıkarma“ katar: kaptan su almak gibi. Soyut alanda aynı hareket bilgiye uygulanır — metinden anlam çıkarmak. Dativ nesne alır: dem Schreiben entnehmen. İsim: die Entnahme.","tr":"(içinden) almak; (metinden) anlamak, çıkarmak","s":"Wie du der Nachricht entnehmen kannst, kommt er später.","st":"Mesajdan anlayabileceğin gibi, geç gelecek.","f":"die Entnahme (alma, çekme) · die Blutentnahme (kan alma)"},{"w":"entgegenkommen","t":"Verb + Dativ","k":"ent + gegen + kommen","c":"kommt entgegen – kam entgegen – ist entgegengekommen","br":"gegen = karşı. Karşı tarafa doğru yürümek = ortada buluşmak = uzlaşmak.","tr":"karşılamaya gelmek; uzlaşmak, jest yapmak","s":"Der Vermieter ist uns bei der Nachzahlung entgegengekommen.","st":"Ev sahibi ek ödeme konusunda bize kolaylık gösterdi.","f":"das Entgegenkommen (jest) · entgegenkommend (anlayışlı)"}]},{"n":"Ön ek: er-","e":"başlangıç · sonuca ulaşma · elde etme","c":"#0f9b8e","g":"Ön ekler","cards":[{"w":"erreichen","t":"Verb","k":"er + reichen (uzanmak)","c":"erreicht – erreichte – hat erreicht","br":"reichen uzanmak ve yetmektir; er- eylemi sonuca vardırır: uzanıp hedefe varmak. Hem mekân (das Ziel erreichen) hem iletişim (jemanden telefonisch erreichen) hem sonuç (ein Ergebnis erreichen) için. Sıfat: erreichbar.","tr":"ulaşmak, erişmek; (birine telefonla) ulaşmak","s":"Unter dieser Nummer erreiche ich ihn leider nie.","st":"Bu numaradan ona maalesef hiç ulaşamıyorum.","f":"erreichbar (ulaşılabilir) · die Erreichbarkeit (ulaşılabilirlik) · unerreichbar (ulaşılamaz)"},{"w":"erkennen","t":"Verb","k":"er + kennen","c":"erkennt – erkannte – hat erkannt","br":"kennen = tanımak (durum). er- süreci sonuca taşır: tanıma noktasına varmak = fark etmek.","tr":"tanımak, fark etmek, teşhis etmek","s":"Man erkennt sofort, worauf er hinauswill.","st":"Neyi ima ettiği hemen anlaşılıyor.","f":"die Erkenntnis (kavrayış) · erkennbar (fark edilebilir) · anerkennen (tanımak, kabul etmek)"},{"w":"ergänzen","t":"Verb","k":"er + ganz (bütün) + -en","c":"ergänzt – ergänzte – hat ergänzt","br":"ganz bütün demektir; er- + sıfat + -en kalıbı „o duruma ulaştırmak“ katar: bütünlüğe kavuşturmak. Yani eksik olanı ekleyip tamamlamak. Aileden die Ergänzung (ek), ergänzend (tamamlayıcı), vollständig (eksiksiz).","tr":"tamamlamak, eklemek","s":"Ergänzen Sie bitte die fehlenden Angaben im Formular.","st":"Lütfen formdaki eksik bilgileri tamamlayın.","f":"die Ergänzung (tamamlama, ek) · ergänzend (tamamlayıcı) · ganz (bütün, tamamen)"},{"w":"erhöhen","t":"Verb","k":"er + hoch (yüksek) + -en","c":"erhöht – erhöhte – hat erhöht","br":"Aynı kalıp: yüksek olma durumuna ulaştırmak = artırmak. (Karşıtı: senken.)","tr":"artırmak, yükseltmek","s":"Der Vermieter will die Miete um fünfzig Euro erhöhen.","st":"Ev sahibi kirayı elli avro artırmak istiyor.","f":"die Erhöhung (artırım) · hoch (yüksek) · die Mieterhöhung (kira artışı)"},{"w":"ermöglichen","t":"Verb","k":"er + möglich (mümkün) + -en","c":"ermöglicht – ermöglichte – hat ermöglicht","br":"er- + sıfat + -en kalıbı: o duruma ulaştırmak. möglich (mümkün) → mümkün kılmak. Aynı kalıptan erhöhen, erweitern, ergänzen, erleichtern. Resmî yazıda özne çoğu kez bir kurum ya da imkândır: Das Stipendium ermöglicht …","tr":"olanaklı kılmak, imkân vermek","s":"Das Stipendium ermöglicht ihr ein Studium im Ausland.","st":"Burs ona yurt dışında okuma imkânı veriyor.","f":"möglich (mümkün) · die Möglichkeit (olanak) · die Ermöglichung (olanaklı kılma)"},{"w":"erklären","t":"Verb","k":"er + klar (net) + -en","c":"erklärt – erklärte – hat erklärt","br":"klar = net. Bir şeyi netlik durumuna getirmek = açıklamak. Resmî anlamı: beyan etmek.","tr":"açıklamak; beyan etmek","s":"Können Sie mir den Unterschied noch einmal erklären?","st":"Farkı bana bir kez daha açıklayabilir misiniz?","f":"die Erklärung (açıklama, beyan) · klar (net, açık) · die Steuererklärung (vergi beyanı)","m":[{"tr":"beyan etmek","s":"Er erklärte seinen Rücktritt zum Monatsende.","st":"Ay sonu itibarıyla istifasını açıkladı."}]},{"w":"erschöpfen","t":"Verb","k":"er + schöpfen (kuyudan su çekmek)","c":"erschöpft – erschöpfte – hat erschöpft","br":"schöpfen = su almak. er- sona vardırır: kuyudan son damlaya kadar çekmek = tüketmek, bitkin düşürmek.","tr":"tüketmek; bitkin düşürmek","s":"Nach der Prüfungswoche war ich völlig erschöpft.","st":"Sınav haftasından sonra tamamen tükenmiştim.","f":"die Erschöpfung (tükenmişlik) · erschöpfend (kapsamlı) · schöpfen ((su) çekmek; yaratmak)"},{"w":"erfahren","t":"Verb","k":"er + fahren (yol almak)","c":"erfährt – erfuhr – hat erfahren","br":"Yol alarak sonunda öğrenmek. Aynı kökten Erfahrung: yol boyunca biriken şey = tecrübe.","tr":"(haberi) öğrenmek; deneyimlemek","s":"Von der Kündigung habe ich erst gestern erfahren.","st":"Fesihten daha dün haberim oldu.","f":"die Erfahrung (tecrübe) · erfahren (Adj: tecrübeli) · erfahrungsgemäß (tecrübeye göre)","m":[{"tr":"deneyimlemek, görmek","s":"Das Projekt hat große Unterstützung erfahren.","st":"Proje büyük destek gördü."}]},{"w":"erlassen","t":"Verb","k":"er + lassen","c":"erlässt – erließ – hat erlassen","br":"İki resmî yön: bir borcu bırakıvermek (affetmek) ve bir düzenlemeyi ortaya bırakmak (çıkarmak).","tr":"(yasa) çıkarmak; (borç, ceza) affetmek","s":"Die Stadt hat ein neues Parkverbot erlassen.","st":"Şehir yeni bir park yasağı çıkardı.","f":"der Erlass (kararname) · der Schuldenerlass (borç affı)","m":[{"tr":"(borç, ceza) affetmek","s":"Ein Teil der Gebühren wurde ihm erlassen.","st":"Harçların bir kısmı ona bağışlandı."}]},{"w":"erweitern","t":"Verb","k":"er + weit (geniş) + -ern","c":"erweitert – erweiterte – hat erweitert","br":"weit = geniş; er- sonuca ulaştırır: genişlik durumuna getirmek. vergrößern hacmi büyütür, erweitern ise kapsamı açar — teklifi, yetkiyi, bilgiyi. İsim: die Erweiterung; sıfat: erweitert (genişletilmiş).","tr":"genişletmek, kapsamını büyütmek","s":"Wir möchten unser Angebot um zwei Kurse erweitern.","st":"Programımızı iki kursla genişletmek istiyoruz.","f":"die Erweiterung (genişletme) · weit (geniş, uzak) · erweitert (genişletilmiş)"},{"w":"sich erkundigen","t":"Verb + nach (D)","k":"er + Kunde (haber, bilgi) + -igen","c":"erkundigt – erkundigte – hat erkundigt","br":"Eski Kunde = haber, bilgi (bkz. Urkunde, kundtun). Bilgiye ulaşmak = bilgi almak.","tr":"bilgi almak, sormak","s":"Ich habe mich nach dem Stand des Verfahrens erkundigt.","st":"Sürecin durumu hakkında bilgi aldım.","f":"die Erkundigung (bilgi alma) · die Urkunde (belge) · kundig (bilgili)"},{"w":"erledigen","t":"Verb","k":"er + ledig (serbest) + -en","c":"erledigt – erledigte – hat erledigt","br":"ledig = serbest, bağsız. Bir işi üzerinden atıp serbest kalmak = halletmek.","tr":"halletmek, bitirmek","s":"Die Anmeldung ist damit erledigt.","st":"Kayıt böylece halledildi.","f":"die Erledigung (halletme) · erledigt (bitmiş; bitkin) · ledig (bekâr)","m":[{"tr":"erledigt: bitkin (günlük dil)","s":"Nach dem Umzug war ich völlig erledigt.","st":"Taşınmadan sonra tamamen bitkindim."}]},{"w":"ertragen","t":"Verb","k":"er + tragen (taşımak)","c":"erträgt – ertrug – hat ertragen","br":"tragen taşımaktır; er- „sonuna kadar“ katar: yükü bırakmadan taşıyabilmek. Türkçedeki „kaldırmak, çekmek“ ile aynı imge. Türevleri sınır bildirir: erträglich (katlanılır) ↔ unerträglich (dayanılmaz). Aynı kökten der Ertrag: toprağın taşıyıp verdiği.","tr":"katlanmak, tahammül etmek","s":"Diesen Lärm ertrage ich keine Stunde länger.","st":"Bu gürültüye bir saat daha katlanamam.","f":"erträglich (katlanılabilir) · unerträglich (dayanılmaz) · der Ertrag (verim, getiri)"},{"w":"erzielen","t":"Verb","k":"er + Ziel (hedef) + -en","c":"erzielt – erzielte – hat erzielt","br":"Ziel = hedef; er- hedefe varmayı bildirir. Sonuç, kâr, gol, anlaşma gibi ölçülebilir kazanımlarla kullanılır — çabayla değil. bekommen almaktır, erreichen ulaşmaktır, erzielen ise çalışarak elde etmektir.","tr":"elde etmek, (sonuç) almak","s":"Die Klasse hat bei der Vergleichsarbeit ein sehr gutes Ergebnis erzielt.","st":"Sınıf karşılaştırmalı sınavda çok iyi bir sonuç elde etti.","f":"das Ziel (hedef) · die Zielsetzung (hedef belirleme) · zielstrebig (hedefe kilitlenmiş)"}]},{"n":"Ön ek: auf-","e":"yukarı · açılma · başlangıç · fark ediliş","c":"#e08b00","g":"Ön ekler","cards":[{"w":"auffallen","t":"Verb + Dativ","k":"auf + fallen (düşmek)","c":"fällt auf – fiel auf – ist aufgefallen","br":"fallen düşmektir; auf- düşüşü bir yüzeyin üstüne yöneltir. Bir şey algının üstüne düşerse fark edilir — bu yüzden özne fark edilen şeydir, fark eden kişi Dativ alır: Mir ist aufgefallen … Sıfatı auffällig.","tr":"göze çarpmak, dikkat çekmek","s":"Ist dir aufgefallen, dass er nie zuhört?","st":"Onun hiç dinlemediği dikkatini çekti mi?","f":"auffällig (dikkat çekici) · unauffällig (göze çarpmayan) · die Auffälligkeit (dikkat çekicilik)"},{"w":"auffordern","t":"Verb + zu (D)","k":"auf + fordern (talep etmek)","c":"fordert auf – forderte auf – hat aufgefordert","br":"fordern talep, auf- karşıya yöneltir: birini bir şeye çağırmak. Resmî yazıların standart fiili.","tr":"(resmen) çağırmak, talep etmek","s":"Der Lehrer forderte uns auf, die Handys wegzulegen.","st":"Öğretmen telefonları kaldırmamızı istedi.","f":"die Aufforderung (resmî çağrı) · die Zahlungsaufforderung (ödeme ihtarı)"},{"w":"aufheben","t":"Verb","k":"auf + heben (kaldırmak)","c":"hebt auf – hob auf – hat aufgehoben","br":"Yerden kaldırmak → saklamak → hukukta: yürürlükten kaldırmak. Üç anlam da „kaldırmak“ hareketinden çıkar.","tr":"yerden kaldırmak; saklamak; (kararı) iptal etmek","s":"Die Maskenpflicht wurde vor zwei Jahren aufgehoben.","st":"Maske zorunluluğu iki yıl önce kaldırıldı.","f":"die Aufhebung (iptal, kaldırma) · der Aufhebungsvertrag (karşılıklı fesih)","m":[{"tr":"yerden kaldırmak","s":"Heb den Zettel bitte auf.","st":"Kâğıdı yerden kaldır lütfen."},{"tr":"saklamak, muhafaza etmek","s":"Die Quittungen sollten Sie mindestens zwei Jahre aufheben.","st":"Makbuzları en az iki yıl saklamalısınız."}]},{"w":"aufgeben","t":"Verb","k":"auf + geben","c":"gibt auf – gab auf – hat aufgegeben","br":"geben vermektir; auf- vermeyi yukarı ve karşıya yöneltir: elindekini bırakıp teslim etmek. Üç kullanım da bu hareketten çıkar — pes etmek, kargoyu vermek, ödev vermek. İsim die Aufgabe: hem görev hem terk.","tr":"pes etmek, vazgeçmek; (posta) vermek; (ödev) vermek","s":"Nach drei erfolglosen Versuchen hat er aufgegeben.","st":"Üç başarısız denemeden sonra pes etti.","f":"die Aufgabe (görev, ödev) · die Selbstaufgabe (kendinden vazgeçme)","m":[{"tr":"(ödev) vermek","s":"Der Lehrer hat uns drei Seiten aufgegeben.","st":"Öğretmen bize üç sayfa ödev verdi."},{"tr":"(posta, kargo) vermek","s":"Ich habe das Paket heute Morgen aufgegeben.","st":"Kargoyu bu sabah verdim."}]},{"w":"auftreten","t":"Verb","k":"auf + treten (basmak)","c":"tritt auf – trat auf – ist aufgetreten","br":"Sahneye ayak basmak = ortaya çıkmak; sorunlar için de kullanılır: ortaya çıkmak.","tr":"ortaya çıkmak; sahneye çıkmak; tavır sergilemek","s":"Seit dem Update treten bei meinem Handy dauernd Probleme auf.","st":"Güncellemeden beri telefonumda sürekli sorun çıkıyor.","f":"das Auftreten (tavır) · der Auftritt (sahne çıkışı)","m":[{"tr":"sahneye çıkmak; tavır sergilemek","s":"Im Gespräch tritt er sehr selbstbewusst auf.","st":"Görüşmede çok özgüvenli bir tavır sergiliyor."}]},{"w":"aufnehmen","t":"Verb","k":"auf + nehmen","c":"nimmt auf – nahm auf – hat aufgenommen","br":"nehmen almaktır; auf- yerden alıp içine katmayı bildirir. Bu yüzden hem kişiyi kabul etmek, hem sesi kayda almak, hem ilişkiyi başlatmaktır. İsim die Aufnahme aynı üç anlamı taşır: kabul, kayıt, çekim.","tr":"içeri almak; kaydetmek; başlatmak","s":"Darf ich das Gespräch aufnehmen?","st":"Görüşmeyi kaydedebilir miyim?","f":"die Aufnahme (kayıt, kabul) · aufnahmefähig (alım kapasiteli)","m":[{"tr":"kabul etmek, içeri almak","s":"Die Klasse hat den neuen Schüler herzlich aufgenommen.","st":"Sınıf yeni öğrenciyi sıcak karşıladı."},{"tr":"(ilişki, faaliyet) başlatmak","s":"Wir haben Kontakt zum Mieterverein aufgenommen.","st":"Kiracı derneğiyle iletişime geçtik."}]},{"w":"aufklären","t":"Verb + über (A)","k":"auf + klar + -en","c":"klärt auf – klärte auf – hat aufgeklärt","br":"klar = net. auf- kapağı kaldırır: karanlıkta kalanı netleştirmek = aydınlatmak, bilgilendirmek.","tr":"aydınlatmak, bilgilendirmek","s":"Der Arzt muss den Patienten über alle Risiken aufklären.","st":"Doktor hastayı tüm riskler hakkında bilgilendirmek zorundadır.","f":"die Aufklärung (aydınlanma, bilgilendirme) · aufgeklärt (bilgilendirilmiş)","m":[{"tr":"(olayı) aydınlatmak","s":"Der Vorfall konnte bislang nicht aufgeklärt werden.","st":"Olay şimdiye dek aydınlatılamadı."}]},{"w":"aufhören","t":"Verb + mit (D)","k":"auf + hören","c":"hört auf – hörte auf – hat aufgehört","br":"hören duymaktır; eski anlamı „dinleyip durmak“tan bugünkü „son vermek“e geçmiştir. mit + Dativ ile gelir: mit dem Rauchen aufhören. Karşıtı anfangen; ilgili sıfat unaufhörlich (durmaksızın).","tr":"son vermek, bırakmak, kesilmek","s":"Hör bitte auf, mich ständig zu unterbrechen.","st":"Lütfen sürekli sözümü kesmeyi bırak.","f":"ohne aufzuhören (durmaksızın) · unaufhörlich (durmaksızın)"},{"w":"auffassen","t":"Verb + als (A)","k":"auf + fassen (kavramak)","c":"fasst auf – fasste auf – hat aufgefasst","br":"fassen = tutmak, kavramak. Bir sözü şu şekilde tutmak = öyle yorumlamak.","tr":"algılamak, yorumlamak","s":"Ich habe seine Bemerkung als versteckte Kritik aufgefasst.","st":"Onun sözünü örtük bir eleştiri olarak algıladım.","f":"die Auffassung (görüş) · die Auffassungsgabe (kavrayış)"},{"w":"aufwenden","t":"Verb","k":"auf + wenden (çevirmek)","c":"wendet auf – wandte/wendete auf – hat aufgewandt/aufgewendet","br":"wenden çevirmektir; auf- kaynağı bir işe doğru çevirir. Yani zamanı, parayı ya da emeği o işe yöneltmek. İsim hâli der Aufwand hem masraf hem çabadır; sıfatı aufwendig „epey emek isteyen“ demektir.","tr":"(zaman, para, emek) harcamak","s":"Für die Vorbereitung musste ich zwei ganze Wochenenden aufwenden.","st":"Hazırlık için iki tam hafta sonu harcamak zorunda kaldım.","f":"der Aufwand (masraf, çaba) · aufwendig (masraflı) · der Verwaltungsaufwand (idari yük)"},{"w":"aufbauen","t":"Verb","k":"auf + bauen","c":"baut auf – baute auf – hat aufgebaut","br":"Yukarı doğru inşa etmek: kurmak; auf+D ile: bir şeyin üzerine kurulu olmak.","tr":"kurmak, inşa etmek","s":"Wir haben das Konzept von Grund auf neu aufgebaut.","st":"Konsepti temelden yeniden kurduk.","f":"der Aufbau (yapı) · aufbauend auf (…üzerine kurulu)"},{"w":"aufweisen","t":"Verb","k":"auf + weisen (göstermek)","c":"weist auf – wies auf – hat aufgewiesen","br":"weisen = göstermek. auf- yukarı doğru sunar: bir şeyi taşımak, barındırmak. Yazı dilinde „haben“ yerine kullanılır.","tr":"göstermek, içermek, sahip olmak","s":"Das Auto weist nur leichte Gebrauchsspuren auf.","st":"Arabada yalnızca hafif kullanım izleri var.","f":"der Hinweis (uyarı) · nachweisen (kanıtlamak) · hinweisen auf (…e dikkat çekmek)","m":[{"tr":"(olumlu) taşımak, sunmak","s":"Der Bewerber weist mehrjährige Berufserfahrung auf.","st":"Aday birkaç yıllık mesleki deneyime sahip."}]},{"w":"sich aufregen","t":"Verb + über (A)","k":"auf + regen (kımıldatmak)","c":"regt auf – regte auf – hat aufgeregt","br":"regen = kıpırdatmak. İçini yukarı doğru kıpırdatmak = heyecanlandırmak, sinirlendirmek.","tr":"sinirlenmek, öfkelenmek","s":"Reg dich über solche Kleinigkeiten nicht auf.","st":"Böyle ufak şeylere sinirlenme.","f":"die Aufregung (heyecan, telaş) · aufregend (heyecan verici) · aufgeregt (gergin)"},{"w":"aufschieben","t":"Verb","k":"auf + schieben (itmek)","c":"schiebt auf – schob auf – hat aufgeschoben","br":"schieben itmektir; auf- burada zamanı ileri iter. Kararı ya da işi öne değil, sonraya sürmek. İsim: der Aufschub; hukukta aufschiebende Wirkung, itirazın kararı askıya alması demektir — aynı „ileri itme“ imgesi.","tr":"ertelemek","s":"Diese Entscheidung lässt sich nicht länger aufschieben.","st":"Bu karar daha fazla ertelenemez.","f":"der Aufschub (erteleme) · aufschiebende Wirkung (yürütmeyi durdurucu etki)"}]},{"n":"Ön ek: aus-","e":"dışarı · sonuna kadar · tamamlama","c":"#3b7d3b","g":"Ön ekler","cards":[{"w":"ausgehen","t":"Verb + von (D)","k":"aus + gehen","c":"geht aus – ging aus – ist ausgegangen","br":"Bir noktadan dışarı yürümek = düşünceye o noktadan başlamak → varsaymak. Ayrıca: bitmek, sönmek, dışarı çıkmak.","tr":"varsaymak (von+D); (dışarı) çıkmak; bitmek","s":"Ich gehe davon aus, dass er pünktlich kommt.","st":"Onun dakik geleceğini varsayıyorum.","f":"der Ausgang (çıkış, sonuç) · ausgehend von (…dan hareketle) · der Ausgangspunkt (çıkış noktası)","m":[{"tr":"dışarı çıkmak (eğlenmeye)","s":"Am Wochenende gehen wir selten aus.","st":"Hafta sonları nadiren dışarı çıkarız."},{"tr":"bitmek, tükenmek","s":"Uns ist mitten im Winter das Heizöl ausgegangen.","st":"Kışın ortasında kalorifer yakıtımız bitti."}]},{"w":"ausschließen","t":"Verb","k":"aus + schließen (kapatmak)","c":"schließt aus – schloss aus – hat ausgeschlossen","br":"schließen kapatmaktır; aus- kapıyı kapatıp birini dışarıda bırakır. Somutta dışlama, soyutta ihtimali reddetme: Das ist nicht auszuschließen. Aileden der Ausschluss, ausschließlich (yalnızca), einschließlich (dahil).","tr":"hariç tutmak, dışlamak; ihtimal dışı bırakmak","s":"Ich kann nicht ausschließen, dass ich mich geirrt habe.","st":"Yanılmış olma ihtimalimi dışlayamam.","f":"der Ausschluss (hariç tutma) · ausschließlich (yalnızca) · ausgeschlossen (imkânsız)"},{"w":"ausdrücken","t":"Verb","k":"aus + drücken (bastırmak)","c":"drückt aus – drückte aus – hat ausgedrückt","br":"İçindekini dışarı bastırmak = ifade etmek. (Latince ex-primere de birebir aynı: express.)","tr":"ifade etmek, dile getirmek","s":"Er kann sich schriftlich sehr präzise ausdrücken.","st":"Yazılı olarak kendini çok kesin ifade edebiliyor.","f":"der Ausdruck (ifade) · ausdrücklich (açıkça) · der Druck (baskı)"},{"w":"ausfallen","t":"Verb","k":"aus + fallen","c":"fällt aus – fiel aus – ist ausgefallen","br":"Programın dışına düşmek = iptal olmak. Ayrıca „nasıl sonuçlandı“ anlamında: sonuç şöyle düştü.","tr":"iptal olmak; (belli şekilde) sonuçlanmak","s":"Der Unterricht fällt morgen wegen einer Konferenz aus.","st":"Ders yarın bir konferans nedeniyle iptal.","f":"der Ausfall (iptal, arıza) · ausgefallen (sıra dışı)","m":[{"tr":"(sonuç) …çıkmak","s":"Die Ergebnisse sind besser ausgefallen als erwartet.","st":"Sonuçlar beklenenden iyi çıktı."}]},{"w":"ausüben","t":"Verb","k":"aus + üben (uygulamak)","c":"übt aus – übte aus – hat ausgeübt","br":"üben = alıştırma yapmak. aus- dışa yansıtır: mesleği/hakkı/baskıyı fiilen uygulamak.","tr":"icra etmek, uygulamak, (baskı) kurmak","s":"Er übt seinen Beruf seit über zwanzig Jahren aus.","st":"Mesleğini yirmi yılı aşkın süredir icra ediyor.","f":"die Ausübung (icra, uygulama) · die Übung (alıştırma) · Druck ausüben (baskı kurmak)"},{"w":"ausreichen","t":"Verb","k":"aus + reichen (uzanmak, yetmek)","c":"reicht aus – reichte aus – hat ausgereicht","br":"reichen uzanmak ve yetmektir; aus- gereken sınıra kadar uzanmayı bildirir. Nesnesizdir: Die Zeit reicht aus. Sıfatı ausreichend hem „yeterli“ hem okul notu 4’tür; olumsuzu unzureichend resmî yazının kibar eleştirisidir.","tr":"yetmek, kâfi gelmek","s":"Die Zeit reicht für alle drei Aufgaben nicht aus.","st":"Süre üç görevin hepsine yetmiyor.","f":"ausreichend (yeterli; okul notu 4) · unzureichend (yetersiz)"},{"w":"sich auswirken","t":"Verb + auf (A)","k":"aus + wirken (etki etmek)","c":"wirkt aus – wirkte aus – hat ausgewirkt","br":"wirken = etki etmek. aus- etkiyi dışarı yayar: sonuçları başka bir alana yansır.","tr":"etki etmek, yansımak","s":"Die Änderung wirkt sich unmittelbar auf die Nebenkosten aus.","st":"Değişiklik doğrudan yan giderlere yansıyor.","f":"die Auswirkung (etki, yansıma) · wirksam (etkili) · die Wirkung (etki)"},{"w":"auslegen","t":"Verb","k":"aus + legen (koymak)","c":"legt aus – legte aus – hat ausgelegt","br":"legen koymaktır; aus- açıp dışa sermeyi bildirir. Metni açıp önüne sermek = yorumlamak; parayı öne koymak = geçici olarak vermek. İsim die Auslegung hukukta yorum demektir: die Gesetzesauslegung.","tr":"yorumlamak; (para) öne sürmek; sermek","s":"Diese Klausel lässt sich auf zwei Arten auslegen.","st":"Bu madde iki farklı şekilde yorumlanabilir.","f":"die Auslegung (yorum) · die Gesetzesauslegung (yasa yorumu)","m":[{"tr":"(parayı) geçici olarak vermek","s":"Kannst du das Geld kurz auslegen?","st":"Parayı kısa süreliğine sen verebilir misin?"}]},{"w":"ausschöpfen","t":"Verb","k":"aus + schöpfen (su çekmek)","c":"schöpft aus – schöpfte aus – hat ausgeschöpft","br":"schöpfen kuyudan su çekmektir (bkz. der Schöpflöffel: kepçe); aus- son damlaya kadar çekmeyi bildirir. Yani elde ne varsa sonuna kadar kullanmak. Aileden erschöpfen (tüketmek) ve erschöpft (bitkin).","tr":"sonuna kadar kullanmak, tüketmek","s":"Wir haben alle rechtlichen Mittel ausgeschöpft.","st":"Tüm hukuki yolları sonuna kadar kullandık.","f":"die Ausschöpfung (tamamen kullanma) · erschöpfen (tüketmek)"},{"w":"austauschen","t":"Verb","k":"aus + tauschen (değiştirmek)","c":"tauscht aus – tauschte aus – hat ausgetauscht","br":"Karşılıklı olarak dışa vermek = değiş tokuş etmek, fikir alışverişi yapmak.","tr":"değiştirmek; sich ~ : fikir alışverişinde bulunmak","s":"Wir haben uns über die Ergebnisse der Prüfung ausgetauscht.","st":"Sınav sonuçları hakkında fikir alışverişinde bulunduk.","f":"der Austausch (değiş tokuş) · der Schüleraustausch (öğrenci değişimi)"},{"w":"ausweichen","t":"Verb + Dativ","k":"aus + weichen (çekilmek)","c":"weicht aus – wich aus – ist ausgewichen","br":"weichen = yerini bırakmak. aus- yandan çıkar: çarpışmamak için kenara çekilmek → mecazî: sorudan kaçmak.","tr":"yol vermek, kaçınmak; (soruyu) geçiştirmek","s":"Er weicht jeder klaren Antwort geschickt aus.","st":"Her net cevaptan ustaca kaçınıyor.","f":"ausweichend (kaçamak) · das Ausweichmanöver (kaçınma manevrası)"},{"w":"ausstellen","t":"Verb","k":"aus + stellen (koymak)","c":"stellt aus – stellte aus – hat ausgestellt","br":"Dışarıya, görünür yere koymak: sergilemek; resmî dilde: belgeyi düzenleyip vermek.","tr":"sergilemek; (belge) düzenlemek","s":"Können Sie mir dafür bitte eine Rechnung ausstellen?","st":"Bunun için bana bir fatura kesebilir misiniz?","f":"die Ausstellung (sergi) · der Aussteller (düzenleyen)","m":[{"tr":"sergilemek","s":"Die Arbeiten der Schüler werden in der Aula ausgestellt.","st":"Öğrencilerin çalışmaları salonda sergileniyor."}]},{"w":"ausrichten","t":"Verb","k":"aus + richten (yöneltmek)","c":"richtet aus – richtete aus – hat ausgerichtet","br":"richten = yöneltmek. Bir mesajı karşıya yöneltmek = iletmek; bir şeyi bir hedefe göre hizalamak; etkinlik düzenlemek.","tr":"(selam, mesaj) iletmek; hizalamak; (etkinlik) düzenlemek","s":"Bitte richten Sie ihm aus, dass ich zurückgerufen habe.","st":"Lütfen ona geri aradığımı iletin.","f":"die Ausrichtung (yönelim) · sich richten nach (…e göre hareket etmek)","m":[{"tr":"(etkinlik) düzenlemek","s":"Die Stadt richtet den Wettbewerb zum dritten Mal aus.","st":"Şehir yarışmayı üçüncü kez düzenliyor."},{"tr":"hizalamak, yöneltmek","s":"Das gesamte Konzept ist auf Nachhaltigkeit ausgerichtet.","st":"Bütün konsept sürdürülebilirliğe göre kurgulanmış."}]}]},{"n":"Ön ek: ab-","e":"ayrılma · aşağı · tamamlama · reddediş","c":"#4d6ba6","g":"Ön ekler","cards":[{"w":"absehen","t":"Verb + von (D)","k":"ab + sehen","c":"sieht ab – sah ab – hat abgesehen","br":"Bakışı bir şeyden çekmek = onu göz ardı etmek, ondan vazgeçmek. Kalıp: abgesehen von (…hariç).","tr":"vazgeçmek (von+D); göz ardı etmek","s":"Von einer Klage sehen wir vorerst ab.","st":"Şimdilik dava açmaktan vazgeçiyoruz.","f":"absehbar (öngörülebilir) · abgesehen von (…bir yana) · die Absicht (niyet)"},{"w":"abhängen","t":"Verb + von (D)","k":"ab + hängen (asılı olmak)","c":"hängt ab – hing ab – hat abgehangen","br":"Bir yerden aşağı asılı olmak = onun taşımasına muhtaç olmak = bağlı olmak.","tr":"bağlı olmak","s":"Das hängt ganz von der Entscheidung des Amtes ab.","st":"Bu tamamen dairenin kararına bağlı.","f":"abhängig (bağımlı) · die Abhängigkeit (bağımlılık) · unabhängig (bağımsız)"},{"w":"ablehnen","t":"Verb","k":"ab + lehnen (yaslamak)","c":"lehnt ab – lehnte ab – hat abgelehnt","br":"lehnen yaslanmaktır; ab- geriye doğru yaslanıp uzak durmayı bildirir — reddin beden dili kelimeye geçmiş. annehmen (kabul etmek) ile tam çift oluşturur. İsim die Ablehnung; sıfat ablehnend (olumsuz tavırlı).","tr":"reddetmek","s":"Sie hat das Angebot höflich abgelehnt.","st":"Teklifi kibarca reddetti.","f":"die Ablehnung (ret) · ablehnend (ret yönünde) · der Ablehnungsbescheid (ret kararı)"},{"w":"abschließen","t":"Verb","k":"ab + schließen (kapatmak)","c":"schließt ab – schloss ab – hat abgeschlossen","br":"Kapıyı kilitlemek → bir işi kapatmak → sözleşmeyi bağlamak. Hepsi „kapama“ hareketi.","tr":"kilitlemek; bitirmek; (sözleşme) yapmak","s":"Wir haben den Mietvertrag im Mai abgeschlossen.","st":"Kira sözleşmesini mayısta yaptık.","f":"der Abschluss (bitirme, diploma) · abschließend (son olarak)","m":[{"tr":"kilitlemek","s":"Vergiss nicht, die Tür abzuschließen.","st":"Kapıyı kilitlemeyi unutma."},{"tr":"(eğitimi) bitirmek","s":"Sie hat ihr Studium mit Auszeichnung abgeschlossen.","st":"Üniversiteyi dereceyle bitirdi."}]},{"w":"abweichen","t":"Verb + von (D)","k":"ab + weichen (çekilmek)","c":"weicht ab – wich ab – ist abgewichen","br":"weichen yerini bırakıp çekilmektir; ab- ana çizgiden ayrılmayı bildirir. Rakam, plan ya da kural için: sapmak. İsim die Abweichung ölçüm ve hesap dilinde standart kelimedir; sıfat abweichend „farklı olarak“ anlamında cümle başında gelir.","tr":"sapmak, farklılık göstermek","s":"Der Preis weicht deutlich vom Angebot ab.","st":"Fiyat tekliften belirgin şekilde farklı.","f":"die Abweichung (sapma) · abweichend (farklı olarak)"},{"w":"abbrechen","t":"Verb","k":"ab + brechen (kırmak)","c":"bricht ab – brach ab – hat/ist abgebrochen","br":"brechen kırmaktır; ab- bir parçayı koparır. Somut kırılmadan soyut kesintiye geçer: eğitimi, görüşmeyi ya da yolculuğu ortada bırakmak. beenden düzgün bitirmedir, abbrechen ise yarıda kesmedir — bu fark önemlidir.","tr":"yarıda kesmek, bırakmak","s":"Er hat das Studium nach zwei Semestern abgebrochen.","st":"Üniversiteyi iki dönem sonra bıraktı.","f":"der Abbruch (yarıda kesme) · der Studienabbrecher (üniversiteyi bırakan)"},{"w":"abgeben","t":"Verb","k":"ab + geben","c":"gibt ab – gab ab – hat abgegeben","br":"geben vermektir; ab- elinden ayırmayı bildirir. Ödevi teslim etmek, oyu kullanmak, sorumluluğu devretmek. Karşıtı annehmen (kabul etmek). İsim die Abgabe hem teslim hem vergi-harç demektir: devlete „verilen“ pay.","tr":"teslim etmek, vermek","s":"Die Arbeiten sind bis Freitag im Sekretariat abzugeben.","st":"Ödevler cumaya kadar sekreterliğe teslim edilecek.","f":"die Abgabe (teslim; vergi, harç) · der Abgabetermin (teslim tarihi)","m":[{"tr":"(oy) kullanmak","s":"Bis 18 Uhr können Sie Ihre Stimme abgeben.","st":"Saat 18’e kadar oyunuzu kullanabilirsiniz."}]},{"w":"abnehmen","t":"Verb","k":"ab + nehmen","c":"nimmt ab – nahm ab – hat abgenommen","br":"Bir şeyden alıp eksiltmek: azalmak, kilo vermek, telefonu açmak. Zıddı: zunehmen.","tr":"azalmak; kilo vermek; (telefonu) açmak","s":"Das Interesse an dem Kurs hat spürbar abgenommen.","st":"Kursa ilgi gözle görülür şekilde azaldı.","f":"die Abnahme (azalma; kabul, muayene) · zunehmen (artmak)","m":[{"tr":"kilo vermek","s":"Er hat in drei Monaten acht Kilo abgenommen.","st":"Üç ayda sekiz kilo verdi."},{"tr":"(telefonu) açmak","s":"Im Sekretariat nimmt niemand ab.","st":"Sekreterlikte kimse telefonu açmıyor."}]},{"w":"abziehen","t":"Verb","k":"ab + ziehen (çekmek)","c":"zieht ab – zog ab – hat/ist abgezogen","br":"ziehen çekmektir; ab- bütünden koparıp ayırır. Yani toplamdan çekip almak = çıkarmak. İsim der Abzug kesinti, abzüglich ise „düşülerek“ demektir — faturaların standart kelimesi. Karşıtı zuzüglich.","tr":"çıkarmak, düşmek; çekilip gitmek","s":"Zieh die Anzahlung vom Gesamtpreis ab.","st":"Kaporayı toplam fiyattan düş.","f":"der Abzug (kesinti) · abzüglich (…düşülerek) · zuzüglich (…eklenerek)"},{"w":"abwarten","t":"Verb","k":"ab + warten","c":"wartet ab – wartete ab – hat abgewartet","br":"warten pasif beklemek; ab- bir sonun gelmesini bekler: sonucu görene kadar beklemek.","tr":"(sonucu) beklemek","s":"Wir sollten die schriftliche Antwort abwarten.","st":"Yazılı cevabı beklemeliyiz.","f":"abwartend (temkinli) · die Abwartehaltung (bekle gör tutumu)"},{"w":"abstimmen","t":"Verb + über (A) / mit (D)","k":"ab + stimmen (ses vermek)","c":"stimmt ab – stimmte ab – hat abgestimmt","br":"Stimme = ses, oy. Oyları tek tek ayırıp saymak = oylamak; sich abstimmen: sesleri uyumlandırmak = koordine olmak.","tr":"oylamak; sich ~ : mutabık kalmak, koordine olmak","s":"Wir müssen das weitere Vorgehen mit dem Anwalt abstimmen.","st":"Bundan sonraki adımı avukatla koordine etmeliyiz.","f":"die Abstimmung (oylama, mutabakat) · die Stimme (ses; oy) · zustimmen (onaylamak)"},{"w":"sich abfinden","t":"Verb + mit (D)","k":"ab + finden (bulmak)","c":"findet ab – fand ab – hat abgefunden","br":"Bir şeyi kapatıp bitmiş kabul etmek = kabullenmek. Aynı kökten Abfindung: ilişkiyi kapatan ödeme = tazminat.","tr":"kabullenmek, razı olmak","s":"Mit dieser Entscheidung kann ich mich nicht abfinden.","st":"Bu kararı kabullenemiyorum.","f":"die Abfindung (kıdem tazminatı) · abgefunden (kabullenmiş)"}]},{"n":"Ön ek: an-","e":"temas · yönelme · başlangıç · kısmi hareket","c":"#b0533f","g":"Ön ekler","cards":[{"w":"anerkennen","t":"Verb","k":"an + erkennen","c":"erkennt an – erkannte an – hat anerkannt","br":"erkennen = tanımak; an- resmî temas ekler: resmen tanımak, geçerli saymak.","tr":"tanımak, kabul etmek (resmen)","s":"Ich erkenne an, dass du dir Mühe gegeben hast.","st":"Emek verdiğini kabul ediyorum.","f":"die Anerkennung (tanınma, takdir) · anerkannt (tanınmış) · das Anerkennungsverfahren (denklik süreci)"},{"w":"anpassen","t":"Verb + an (A)","k":"an + passen (uymak)","c":"passt an – passte an – hat angepasst","br":"passen uymaktır; an- iki şeyi birbirine yanaştırır. Yani bir şeyi ölçüye göre ayarlamak: fiyatı tüketime, planı takvime. Refleksifi kişiyi anlatır: sich anpassen = uyum sağlamak. İsim die Anpassung idari yazının sık kelimesidir.","tr":"uyarlamak; sich ~ : uyum sağlamak","s":"Ich passe den Termin an deinen Zeitplan an.","st":"Randevuyu senin programına uyarlıyorum.","f":"die Anpassung (uyarlama) · angepasst (uyarlanmış) · anpassungsfähig (uyum sağlayabilen)"},{"w":"angeben","t":"Verb","k":"an + geben","c":"gibt an – gab an – hat angegeben","br":"Bir bilgiyi işaret ederek vermek = beyan etmek. Günlük dilde ikinci anlam: hava atmak.","tr":"belirtmek, beyan etmek; hava atmak","s":"Bitte geben Sie im Formular Ihre Steuer-Identifikationsnummer an.","st":"Lütfen formda vergi kimlik numaranızı belirtin.","f":"die Angabe (beyan, bilgi) · der Angeber (havacı) · angeblich (sözde)","m":[{"tr":"hava atmak (günlük dil)","s":"Er gibt ständig mit seinem neuen Auto an.","st":"Sürekli yeni arabasıyla hava atıyor."}]},{"w":"anfordern","t":"Verb","k":"an + fordern","c":"fordert an – forderte an – hat angefordert","br":"fordern talep etmektir; an- talebi belirli bir muhataba yöneltir ve genelde bir şeyin gönderilmesini ister. İsim die Anforderung ise anlam kaydırır: karşılanması gereken gereklilik. bitten nazik, anfordern resmîdir.","tr":"talep etmek, istemek (belge vb.)","s":"Ich habe die Originalbelege beim Vermieter angefordert.","st":"Orijinal belgeleri ev sahibinden talep ettim.","f":"die Anforderung (gereklilik, talep) · anspruchsvoll (zorlu, talepkâr)"},{"w":"ansprechen","t":"Verb","k":"an + sprechen","c":"spricht an – sprach an – hat angesprochen","br":"Konuşmayı birine doğru yöneltmek: hitap etmek; bir konuyu gündeme getirmek; bir şeyin insana hitap etmesi.","tr":"hitap etmek; (konuyu) açmak; hoşuna gitmek","s":"Ich möchte einen heiklen Punkt ansprechen.","st":"Hassas bir konuyu açmak istiyorum.","f":"ansprechend (cazip) · der Ansprechpartner (muhatap) · die Ansprache (konuşma, hitap)","m":[{"tr":"birine seslenmek, hitap etmek","s":"Ein Passant hat mich auf Türkisch angesprochen.","st":"Bir yaya bana Türkçe seslendi."},{"tr":"hoşuna gitmek, cazip gelmek","s":"Das Design spricht mich überhaupt nicht an.","st":"Tasarım bana hiç hitap etmiyor."}]},{"w":"annehmen","t":"Verb","k":"an + nehmen","c":"nimmt an – nahm an – hat angenommen","br":"nehmen almaktır; an- alışı kendine doğru yöneltir. Elle alırsan kabul etmek, zihinle alırsan varsaymak olur — Türkçedeki „kabul etmek“ ile „farz etmek“ arasındaki bağ ile aynı. İsim die Annahme her iki anlamı taşır.","tr":"kabul etmek; varsaymak","s":"Ich nehme an, dass die Widerspruchsfrist noch läuft.","st":"İtiraz süresinin hâlâ işlediğini varsayıyorum.","f":"die Annahme (kabul; varsayım) · angenommen, dass… (diyelim ki)","m":[{"tr":"kabul etmek","s":"Sie hat das Angebot ohne Zögern angenommen.","st":"Teklifi tereddütsüz kabul etti."}]},{"w":"anzeigen","t":"Verb","k":"an + zeigen (göstermek)","c":"zeigt an – zeigte an – hat angezeigt","br":"Bir şeyi resmî mercie göstermek: bildirmek, ihbar etmek; cihazlar için: göstermek.","tr":"bildirmek; şikâyet etmek; (ekranda) göstermek","s":"Den Schaden müssen Sie dem Vermieter unverzüglich anzeigen.","st":"Hasarı ev sahibine gecikmeksizin bildirmelisiniz.","f":"die Anzeige (ilan; ihbar) · die Anzeigepflicht (bildirim yükümlülüğü)","m":[{"tr":"şikâyet etmek, ihbar etmek","s":"Er hat den Vorfall bei der Polizei angezeigt.","st":"Olayı polise şikâyet etti."},{"tr":"(ekranda) göstermek","s":"Das Display zeigt den aktuellen Verbrauch an.","st":"Ekran güncel tüketimi gösteriyor."}]},{"w":"anstellen","t":"Verb","k":"an + stellen (koymak)","c":"stellt an – stellte an – hat angestellt","br":"Birini işin yanına koymak = işe almak; makineyi çalışır konuma koymak = açmak; sich anstellen: sıraya girmek.","tr":"işe almak; (cihaz) açmak; sich ~ : sıraya girmek","s":"Die Schule hat zum neuen Halbjahr zwei Lehrkräfte angestellt.","st":"Okul yeni dönem için iki öğretmen işe aldı.","f":"der/die Angestellte (memur, çalışan) · die Anstellung (istihdam)","m":[{"tr":"sich anstellen: sıraya girmek","s":"Wir mussten uns über eine Stunde anstellen.","st":"Bir saatten fazla sıraya girmek zorunda kaldık."},{"tr":"(cihazı) çalıştırmak; yaramazlık yapmak","s":"Was hast du denn schon wieder angestellt?","st":"Yine ne işler karıştırdın?"}]},{"w":"anregen","t":"Verb + zu (D)","k":"an + regen (kımıldatmak)","c":"regt an – regte an – hat angeregt","br":"regen kımıldatmaktır (bkz. sich regen: kıpırdamak). an- teması kurar: içerideki hareketi başlatmak. İki alanda çalışır: fikir olarak önermek (eine Prüfung anregen) ve bedeni canlandırmak (anregend: uyarıcı, canlandırıcı).","tr":"teşvik etmek; önermek","s":"Der Elternbeirat hat eine erneute Prüfung angeregt.","st":"Veli kurulu yeniden bir inceleme yapılmasını önerdi.","f":"die Anregung (öneri, uyarım) · anregend (canlandırıcı)"},{"w":"anhalten","t":"Verb","k":"an + halten (tutmak)","c":"hält an – hielt an – hat angehalten","br":"halten tutmaktır; an- hareketi tutup durdurur. İki yön: bir şeyi durdurmak (das Auto anhalten) ve bir durumun sürüp gitmesi (Der Regen hält an). Sıfatı anhaltend (süregelen); isim der Anhaltspunkt (ipucu, dayanak).","tr":"durdurmak, durmak; sürmek","s":"Die Diskussion hielt über zwei Stunden an.","st":"Tartışma iki saatten fazla sürdü.","f":"anhaltend (süregelen) · der Anhaltspunkt (ipucu)","m":[{"tr":"durdurmak, durmak","s":"Der Bus hielt direkt vor der Schule an.","st":"Otobüs tam okulun önünde durdu."}]},{"w":"anwenden","t":"Verb + auf (A)","k":"an + wenden (çevirmek)","c":"wendet an – wandte/wendete an – hat angewandt/angewendet","br":"wenden çevirmektir; an- kuralı somut duruma doğru çevirir — yani onu o duruma uygulamak. benutzen aleti kullanmaktır, anwenden ise bir yöntemi ya da kuralı işletmektir. Türevleri: die Anwendung, der Anwender, angewandte Mathematik.","tr":"uygulamak, kullanmak","s":"Diese Regelung lässt sich auf unseren Fall nicht anwenden.","st":"Bu düzenleme bizim durumumuza uygulanamaz.","f":"die Anwendung (uygulama) · der Anwender (kullanıcı) · angewandt (uygulamalı)"},{"w":"sich anschließen","t":"Verb + Dativ","k":"an + schließen (kapatmak, bağlamak)","c":"schließt an – schloss an – hat angeschlossen","br":"Kendini bir şeye bağlamak = katılmak; zamansal olarak: hemen ardından gelmek.","tr":"katılmak; (arkasından) gelmek","s":"Diesem Argument kann ich mich uneingeschränkt anschließen.","st":"Bu argümana çekincesiz katılıyorum.","f":"der Anschluss (bağlantı) · anschließend (ardından) · im Anschluss an (…nın ardından)"},{"w":"anbieten","t":"Verb","k":"an + bieten (sunmak)","c":"bietet an – bot an – hat angeboten","br":"bieten sunmaktır; an- sunuşu karşıya yöneltir: eli uzatmak gibi. Karşıt yönü anfordern taşır — biri benden karşıya, öbürü karşıdan bana. İsim das Angebot hem teklif hem indirimli üründür: im Angebot.","tr":"sunmak, teklif etmek","s":"Der Vermieter hat uns eine Ratenzahlung angeboten.","st":"Ev sahibi bize taksitli ödeme teklif etti.","f":"das Angebot (teklif, arz) · im Angebot (indirimde)"}]},{"n":"Ön ek: vor-","e":"önde olma · önceden yapma · sunma","c":"#1d7f9e","g":"Ön ekler","cards":[{"w":"vorschlagen","t":"Verb","k":"vor + schlagen (vurmak)","c":"schlägt vor – schlug vor – hat vorgeschlagen","br":"Bir fikri karşının önüne koyup vurgulamak = teklif etmek. vor- neredeyse hep „önüne, önceden“ anlamı taşır.","tr":"önermek, teklif etmek","s":"Ich schlage vor, den Termin auf nächste Woche zu verschieben.","st":"Randevuyu gelecek haftaya ertelemeyi öneriyorum.","f":"der Vorschlag (öneri) · vorschlagsberechtigt (öneri hakkı olan)"},{"w":"vorbereiten","t":"Verb + auf (A)","k":"vor + bereit (hazır) + -en","c":"bereitet vor – bereitete vor – hat vorbereitet","br":"bereit hazır demektir; vor- zamanda öne alır: olaydan önce hazır hâle getirmek. Refleksifi kişiyi anlatır: sich auf die Prüfung vorbereiten. Aileden die Vorbereitung, bereitstellen (hazır etmek), die Bereitschaft.","tr":"hazırlamak; sich ~ : hazırlanmak","s":"Die Schüler bereiten sich seit Wochen auf die Prüfung vor.","st":"Öğrenciler haftalardır sınava hazırlanıyor.","f":"die Vorbereitung (hazırlık) · bereit (hazır) · vorbereitend (hazırlayıcı)"},{"w":"vorliegen","t":"Verb","k":"vor + liegen (yatmak)","c":"liegt vor – lag vor – hat vorgelegen","br":"liegen yatmaktır; vor- onu önüne, masaya koyar. Bir şey önümüzde yatıyorsa mevcuttur — bu yüzden resmî dilde „var“ demenin yolu budur: Es liegt ein Antrag vor. Yakını vorlegen: sen koyarsın, vorliegen kendi durur.","tr":"mevcut olmak, elde bulunmak","s":"Das Ergebnis liegt spätestens Freitag vor.","st":"Sonuç en geç cuma elde olur.","f":"die Vorlage (şablon, sunulan belge) · vorlegen (sunmak, ibraz etmek)","m":[{"tr":"(durum) söz konusu olmak","s":"Hier liegt offensichtlich ein Missverständnis vor.","st":"Burada belli ki bir yanlış anlaşılma söz konusu."}]},{"w":"vornehmen","t":"Verb","k":"vor + nehmen","c":"nimmt vor – nahm vor – hat vorgenommen","br":"Bir işi önüne alıp yapmak. Resmî dilde „yapmak“ yerine kullanılır: eine Änderung vornehmen. sich etwas vornehmen: niyet etmek.","tr":"(işlem) yapmak, gerçekleştirmek","s":"An dem Text musste ich nur kleine Änderungen vornehmen.","st":"Metinde sadece küçük değişiklikler yapmam gerekti.","f":"das Vorhaben (tasarı) · sich etwas vornehmen (bir şeye niyet etmek)","m":[{"tr":"sich etwas vornehmen: niyet etmek","s":"Ich habe mir vorgenommen, täglich zwanzig Karten zu wiederholen.","st":"Her gün yirmi kart tekrar etmeye niyetlendim."}]},{"w":"vorsehen","t":"Verb","k":"vor + sehen","c":"sieht vor – sah vor – hat vorgesehen","br":"Önceden görmek = planlamak, öngörmek. Yasa metinlerinde: „…öngörmektedir“.","tr":"öngörmek, planlamak","s":"Der Plan sieht drei Pausen vor.","st":"Plan üç mola öngörüyor.","f":"vorgesehen (planlanmış) · die Vorsicht (dikkat) · vorsichtig (dikkatli, temkinli)"},{"w":"vorgehen","t":"Verb + gegen (A)","k":"vor + gehen","c":"geht vor – ging vor – ist vorgegangen","br":"Öne doğru yürümek: bir yöntemle ilerlemek; birine karşı harekete geçmek; saatin ileri gitmesi.","tr":"hareket etmek, işlem yapmak; (karşı) girişimde bulunmak","s":"Wie gehen wir jetzt am besten vor?","st":"Şimdi en iyi nasıl ilerleriz?","f":"das Vorgehen (yöntem) · der Vorgang (işlem, süreç)","m":[{"tr":"belli bir yöntemle ilerlemek","s":"Wir sollten schrittweise vorgehen.","st":"Adım adım ilerlemeliyiz."}]},{"w":"vorbeugen","t":"Verb + Dativ","k":"vor + beugen (eğmek)","c":"beugt vor – beugte vor – hat vorgebeugt","br":"Önceden eğilip zararı karşılamak = önlem almak. Tıpta ve hukukta önleyici tedbirlerin fiili.","tr":"önlem almak, önlemek","s":"Klare Absprachen beugen späteren Streitigkeiten vor.","st":"Net anlaşmalar sonraki ihtilafları önler.","f":"die Vorbeugung (önlem alma) · vorbeugend (önleyici) · die Prävention (önleme)"},{"w":"vorlegen","t":"Verb","k":"vor + legen (koymak)","c":"legt vor – legte vor – hat vorgelegt","br":"legen koymaktır; vor- birinin önüne yerleştirir. Belgeyi masaya koymak = ibraz etmek. Resmî dilde einreichen posta ya da sistemle sunmayı, vorlegen ise yüz yüze göstermeyi bildirir. İsim die Vorlage: hem sunulan belge hem şablon.","tr":"sunmak, ibraz etmek","s":"Bitte legen Sie die Originalbelege im Amt vor.","st":"Lütfen orijinal belgeleri dairede ibraz edin.","f":"die Vorlage (şablon; sunulan belge) · vorliegen (mevcut olmak) · der Gesetzesvorschlag (yasa önerisi)"},{"w":"vorschreiben","t":"Verb","k":"vor + schreiben","c":"schreibt vor – schrieb vor – hat vorgeschrieben","br":"schreiben yazmaktır; vor- „önceden ve karşının önüne“ katar: uyulmak üzere yazmak. Bu yüzden die Vorschrift yönetmeliktir. Türkçedeki „dayatmak“ tonunu da taşır: Niemand kann mir vorschreiben, was ich tue.","tr":"zorunlu kılmak, emretmek","s":"Niemand kann mir vorschreiben, was ich zu tun habe.","st":"Kimse bana ne yapacağımı dayatamaz.","f":"die Vorschrift (yönetmelik) · vorgeschrieben (zorunlu kılınmış) · vorschriftsmäßig (talimata uygun)"},{"w":"vorenthalten","t":"Verb + Dativ","k":"vor + ent + halten","c":"enthält vor – enthielt vor – hat vorenthalten","br":"enthalten = içinde tutmak; vor- bunu birinin önünde tutup vermemeye çevirir = esirgemek.","tr":"esirgemek, vermemek","s":"Man darf dem Mieter die Belegeinsicht nicht vorenthalten.","st":"Kiracıdan belge inceleme hakkı esirgenemez.","f":"enthalten (içermek) · die Vorenthaltung (esirgeme)"},{"w":"vorbringen","t":"Verb","k":"vor + bringen","c":"bringt vor – brachte vor – hat vorgebracht","br":"bringen getirmektir; vor- ortaya, herkesin önüne getirir. Argüman, itiraz ya da yeni bir olgu için kullanılır ve hep tartışma bağlamındadır. Resmî karşılığı geltend machen; günlük hâli einfach sagen.","tr":"ileri sürmek, dile getirmek","s":"Hat jemand noch etwas vorzubringen?","st":"Söylemek isteyen başka biri var mı?","f":"das Vorbringen (beyan) · der Vorwand (bahane)"},{"w":"vorwerfen","t":"Verb + Dativ","k":"vor + werfen (atmak)","c":"wirft vor – warf vor – hat vorgeworfen","br":"Birinin önüne bir şey fırlatmak = suçlamak. İsim hâli der Vorwurf aynı sahneyi taşır.","tr":"suçlamak, kabahat bulmak","s":"Sie wirft mir vor, ich würde nie zuhören.","st":"Beni hiç dinlememekle suçluyor.","f":"der Vorwurf (suçlama) · vorwurfsvoll (sitemkâr) · werfen (atmak)"},{"w":"vorziehen","t":"Verb","k":"vor + ziehen (çekmek)","c":"zieht vor – zog vor – hat vorgezogen","br":"ziehen çekmektir; vor- öne çeker. İki kullanım da bu hareketten çıkar: bir seçeneği öne çekmek (tercih etmek) ve bir randevuyu öne almak. İsim der Vorzug (üstünlük); sıfat vorzüglich (mükemmel).","tr":"tercih etmek; öne almak","s":"Ich ziehe eine schriftliche Lösung dem Telefonat vor.","st":"Yazılı bir çözümü telefon görüşmesine tercih ederim.","f":"der Vorzug (üstünlük) · vorzugsweise (tercihen) · bevorzugen (tercih etmek)","m":[{"tr":"(randevuyu) öne almak","s":"Können wir den Termin um eine Woche vorziehen?","st":"Randevuyu bir hafta öne alabilir miyiz?"}]},{"w":"vorkommen","t":"Verb","k":"vor + kommen","c":"kommt vor – kam vor – ist vorgekommen","br":"Önümüze gelmek: bir olayın meydana gelmesi; Dativ ile: birine öyle görünmek.","tr":"olmak, rastlanmak; (birine) …gibi gelmek","s":"So etwas kommt in den besten Familien vor.","st":"Böyle şeyler en iyi ailelerde bile olur.","f":"das Vorkommen (rastlanma) · das Vorkommnis (olay) · vorkommend (rastlanan)","m":[{"tr":"(birine) …gibi gelmek","s":"Diese Begründung kommt mir seltsam vor.","st":"Bu gerekçe bana tuhaf geliyor."}]}]},{"n":"Ön ek: nach-","e":"peşinden gitme · sonradan yapma · takip","c":"#7a8b1f","g":"Ön ekler","cards":[{"w":"nachweisen","t":"Verb","k":"nach + weisen (göstermek)","c":"weist nach – wies nach – hat nachgewiesen","br":"Bir şeyin izini sonradan gösterebilmek = kanıtlamak. Resmî dilde beweisen’in belgeye dayalı hâli.","tr":"kanıtlamak, belgelemek","s":"Die Zahlung lässt sich durch den Kontoauszug nachweisen.","st":"Ödeme hesap özetiyle kanıtlanabilir.","f":"der Nachweis (belge, kanıt) · nachweislich (kanıtlandığı üzere) · nachweisbar (kanıtlanabilir)"},{"w":"nachvollziehen","t":"Verb","k":"nach + voll + ziehen","c":"vollzieht nach – vollzog nach – hat nachvollzogen","br":"vollziehen = bir hareketi tam olarak gerçekleştirmek; nach- onu arkadan tekrar çizmek: başkasının adımlarını izleyip anlamak.","tr":"(başkasının mantığını) izleyip anlamak","s":"Ich kann Ihre Entscheidung nachvollziehen, teile sie aber nicht.","st":"Kararınızı anlayabiliyorum ama katılmıyorum.","f":"nachvollziehbar (anlaşılabilir) · der Vollzug (icra, infaz) · vollziehen (icra etmek, tamamlamak)"},{"w":"nachreichen","t":"Verb","k":"nach + reichen (uzatmak)","c":"reich
