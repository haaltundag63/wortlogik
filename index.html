oplayıp tutmak (özet), kavrayışa varmak (erfassen), şöyle anlamak (auffassen).","tr":"tutmak → kaleme almak → anayasa / toparlamak → özet","s":"Kannst du das Ganze in drei Sätzen zusammenfassen?","st":"Bütün bunları üç cümlede özetleyebilir misin?","f":"die Auffassung (görüş) · erfassen (kaydetmek) · umfassend (kapsamlı) · gefasst (sakin, hazırlıklı)"},{"w":"Zincir: schließen","t":"Kök zinciri","k":"schließen → beschließen → der Beschluss / entschließen → der Entschluss","c":"schließt – schloss – hat geschlossen","br":"Kapatmak: tartışmayı kapatmak (kurul kararı), kararsızlığı kapatmak (kişisel karar), dışarıda bırakmak (hariç tutmak), bağlamak (bağlantı, katılım).","tr":"kapatmak → karar almak → kurul kararı / karar vermek → karar","s":"Nach langem Hin und Her haben wir einen Entschluss gefasst.","st":"Uzun gidip gelmelerden sonra bir karara vardık.","f":"der Ausschluss (hariç tutma) · der Anschluss (bağlantı) · der Schluss (son; sonuç) · schlüssig (tutarlı) · abschließen (bitirmek)"},{"w":"Zincir: brechen","t":"Kök zinciri","k":"brechen → unterbrechen → die Unterbrechung / verbrechen → das Verbrechen","c":"bricht – brach – hat gebrochen","br":"Kırmak: araya girip akışı kırmak (sözünü kesmek), kuralı kırmak (suç), yarıda kırmak (bırakmak). Kesir de buradan: der Bruch.","tr":"kırmak → kesmek → kesinti / suç işlemek → suç","s":"Entschuldigung, ich wollte dich nicht unterbrechen.","st":"Kusura bakma, sözünü kesmek istemedim.","f":"der Abbruch (yarıda kesme) · der Bruch (kesir; kırık) · zerbrechlich (kırılgan) · einbrechen (hırsızlık için girmek)"},{"w":"Zincir: treten","t":"Kök zinciri","k":"treten → eintreten → der Eintritt / vertreten → die Vertretung","c":"tritt – trat – ist getreten","br":"Adım atmak: içeri adım (giriş, gerçekleşme), birinin yerine adım (temsil), sahneye adım (ortaya çıkma), sınırın üstüne adım (ihlal).","tr":"adım atmak → girmek → giriş / temsil etmek → vekâlet","s":"Der Eintritt ist frei, aber bitte vorher anmelden.","st":"Giriş ücretsiz ama önceden kayıt gerekiyor.","f":"der Auftritt (sahne çıkışı) · die Übertretung (ihlal) · betreten (girmek) · zurücktreten (istifa etmek)"},{"w":"Zincir: führen","t":"Kök zinciri","k":"führen → einführen → die Einführung / ausführen → die Ausführung","c":"führt – führte – hat geführt","br":"Götürmek, yönetmek: içeri götürmek (yürürlüğe koymak, tanıtmak), dışa götürmek (uygulamak, ayrıntılandırmak), baştan sona götürmek (gerçekleştirmek), yoldan çıkarmak (baştan çıkarmak).","tr":"yönetmek → yürürlüğe koymak → giriş / uygulamak → uygulama","s":"Die Einführung war kurz, die Ausführung dafür sehr genau.","st":"Giriş kısaydı, uygulama ise çok titizdi.","f":"die Durchführung (gerçekleştirme) · die Verführung (baştan çıkarma) · die Führung (yönetim) · ausführlich (ayrıntılı)"},{"w":"Zincir: wenden","t":"Kök zinciri","k":"wenden → anwenden → die Anwendung / einwenden → der Einwand","c":"wendet – wandte/wendete – hat gewandt","br":"Çevirmek: kuralı somut duruma çevirmek (uygulamak), sözü içeri çevirmek (itiraz), kaynağı işe çevirmek (harcamak). Verwandte de buradan: aynı yöne dönmüş olanlar.","tr":"çevirmek → uygulamak → uygulama / itiraz etmek → itiraz","s":"Dagegen habe ich einen Einwand: So lässt sich die Regel nicht anwenden.","st":"Buna itirazım var: kural bu şekilde uygulanamaz.","f":"die Verwendung (kullanım) · der Aufwand (masraf, çaba) · verwandt (akraba) · sich wenden an (başvurmak)"}]},{"n":"Kök zincirleri: günlük yüksek frekans","e":"machen, lassen, denken, wirken, sorgen…","c":"#6b4f2a","g":"Kök aileleri","cards":[{"w":"Zincir: machen","t":"Kök zinciri","k":"machen → ausmachen → abmachen → die Abmachung","c":"macht – machte – hat gemacht","br":"Yapmak fiili ön ekle sözleşmeye dönüşüyor: bir şeyi „dışarı çıkarıp netleştirmek“ = kararlaştırmak, sonra karşılıklı bağlamak = anlaşma. Ayrıca ausmachen: kapatmak ve önemli olmak.","tr":"yapmak → kararlaştırmak → anlaşmak → mutabakat","s":"Wir hatten doch ausgemacht, dass du anrufst.","st":"Hani senin arayacağını kararlaştırmıştık.","f":"die Abmachung (mutabakat) · mitmachen (katılmak) · aufmachen (açmak) · das macht nichts (önemli değil)"},{"w":"Zincir: lassen","t":"Kök zinciri","k":"lassen → verlassen → verlässlich / zulassen → die Zulassung","c":"lässt – ließ – hat gelassen","br":"Bırakmak: geride bırakmak (terk etmek) ama sich verlassen auf olunca „kendini bırakmak“ = güvenmek. İzin vererek bırakmak ruhsat olur; yapmayı bırakmak ise kaçınma.","tr":"bırakmak → terk etmek → güvenilir / izin vermek → ruhsat","s":"Auf ihn kann man sich verlassen — er lässt niemanden hängen.","st":"Ona güvenilir — kimseyi yarı yolda bırakmaz.","f":"die Entlassung (işten çıkarma) · die Unterlassung (kaçınma) · gelassen (sakin) · loslassen (bırakıvermek)"},{"w":"Zincir: denken","t":"Kök zinciri","k":"denken → bedenken → die Bedenken / nachdenken → nachdenklich","c":"denkt – dachte – hat gedacht","br":"Düşünmek: bir şeyi enine boyuna düşünmek (bedenken), oradan çoğul isim çekince „çekince“ olur (Bedenken haben). Ardından düşünmek = derin düşünmek; hatırlamak için ise das Andenken.","tr":"düşünmek → hesaba katmak → çekince / derin düşünmek → dalgın","s":"Ich habe da so meine Bedenken — lass mich kurz nachdenken.","st":"Şöyle bir çekincem var — bırak biraz düşüneyim.","f":"das Andenken (hatıra) · der Gedanke (düşünce) · bedenklich (endişe verici) · undenkbar (düşünülemez)"},{"w":"Zincir: kennen","t":"Kök zinciri","k":"kennen → erkennen → die Erkenntnis / anerkennen → die Anerkennung","c":"kennt – kannte – hat gekannt","br":"Tanımak: tanımaya varmak (fark etmek, bulguya ulaşmak), resmen tanımak (denklik, takdir). Kunde ve Urkunde de aynı kökten: bilinen, bilgi, belge.","tr":"tanımak → fark etmek → bulgu / resmen tanımak → tanınma","s":"Ich habe ihn sofort erkannt, obwohl wir uns kaum kennen.","st":"Neredeyse hiç tanışmadığımız hâlde onu hemen tanıdım.","f":"die Kenntnis (bilgi) · die Urkunde (belge) · bekannt (tanınan) · unkenntlich (tanınmaz)"},{"w":"Zincir: schaffen","t":"Kök zinciri","k":"schaffen → beschaffen → die Beschaffung / verschaffen","c":"schafft – schuf/schaffte – hat geschaffen/geschafft","br":"İki fiil bir arada: güçlü çekimle „yaratmak“ (schuf, geschaffen), zayıf çekimle „başarmak, halletmek“ (schaffte, geschafft). Ön ekli hâlleri temin etme anlamına kayar.","tr":"yaratmak / başarmak → temin etmek → tedarik","s":"Wir haben es geschafft — jetzt müssen wir nur noch das Material beschaffen.","st":"Başardık — şimdi sadece malzemeyi tedarik etmemiz kaldı.","f":"die Schaffung (yaratma) · geschafft (bitkin; başarıldı) · abschaffen (kaldırmak) · die Wirtschaft (ekonomi)"},{"w":"Zincir: treffen","t":"Kök zinciri","k":"treffen → betreffen → betroffen / zutreffen → zutreffend","c":"trifft – traf – hat getroffen","br":"İsabet etmek: birine dokunmak (ilgilendirmek, sarsmak), hedefe tam oturmak (doğru olmak). Kararı isabetle vurmak: eine Entscheidung treffen.","tr":"isabet etmek → ilgilendirmek → etkilenen / uymak → yerinde","s":"Das trifft auf mich nicht zu — betroffen sind nur Neumieter.","st":"Bu bana uymuyor — yalnızca yeni kiracılar kapsamda.","f":"das Treffen (buluşma) · zutreffend (yerinde, doğru) · die Betroffenheit (sarsılma) · Maßnahmen treffen (tedbir almak)"},{"w":"Zincir: steigen","t":"Kök zinciri","k":"steigen → einsteigen / umsteigen → der Umstieg / die Steigerung","c":"steigt – stieg – ist gestiegen","br":"Yükselmek: araca binmek (içeri yükselmek), aktarma yapmak (değiştirerek binmek), inmek (aussteigen). Soyut tarafı: artış, eğim, artırma.","tr":"yükselmek → binmek → aktarma / artırma → artış","s":"In Köln müssen wir umsteigen, sonst steigen die Fahrtkosten.","st":"Köln’de aktarma yapmalıyız, yoksa yol masrafı artar.","f":"der Anstieg (yükseliş) · die Steigung (eğim) · aussteigen (inmek) · der Einstieg (giriş, başlangıç)"},{"w":"Zincir: drücken","t":"Kök zinciri","k":"drücken → ausdrücken → der Ausdruck / der Eindruck → beeindrucken","c":"drückt – drückte – hat gedrückt","br":"Bastırmak: içindekini dışarı bastırmak (ifade etmek → ifade), içeri basılan iz (izlenim), alta bastırmak (baskı altına almak). Druck hem baskı hem basılı çıktı.","tr":"basmak → ifade etmek → ifade / iz bırakmak → izlenim","s":"Sie hat einen sehr guten Eindruck gemacht.","st":"Çok iyi bir izlenim bıraktı.","f":"der Druck (baskı) · unterdrücken (bastırmak) · ausdrücklich (açıkça) · eindrucksvoll (etkileyici)"},{"w":"Zincir: wirken","t":"Kök zinciri","k":"wirken → bewirken → die Wirkung / verwirklichen → die Verwirklichung","c":"wirkt – wirkte – hat gewirkt","br":"Etki etmek: etkiyi doğurmak (bewirken), etkiyi dışa yansıtmak (sich auswirken), gerçek hâline getirmek (verwirklichen). wirken tek başına ayrıca „…görünmek“ demektir.","tr":"etki etmek → doğurmak → etki / gerçekleştirmek → hayata geçirme","s":"Er wirkt heute ziemlich müde.","st":"Bugün epey yorgun görünüyor.","f":"wirksam (etkili) · die Auswirkung (yansıma) · die Wirklichkeit (gerçeklik) · die Wirtschaft (ekonomi)"},{"w":"Zincir: dienen","t":"Kök zinciri","k":"dienen → bedienen → die Bedienung / verdienen → der Verdienst","c":"dient – diente – hat gedient","br":"Hizmet etmek: müşteriye hizmet (servis, cihaz kullanımı), hizmetle kazanmak (verdienen: hak etmek ve para kazanmak). Almanca „kazanmak“ı hizmet üzerinden kurar.","tr":"hizmet etmek → servis yapmak → servis / kazanmak → kazanç, liyakat","s":"Er verdient nicht schlecht, aber die Bedienung der Maschine ist anstrengend.","st":"Fena kazanmıyor ama makineyi kullanmak yorucu.","f":"der Dienst (hizmet, görev) · die Dienstleistung (hizmet sektörü) · verdient (hak edilmiş) · dienstlich (resmî, iş ile ilgili)"},{"w":"Zincir: sorgen","t":"Kök zinciri","k":"sorgen → versorgen → die Versorgung / entsorgen → die Entsorgung","c":"sorgt – sorgte – hat gesorgt","br":"Bakmak, kaygılanmak: ihtiyacını karşılamak (versorgen), yükünü almak yani atığı ortadan kaldırmak (entsorgen), önceden bakmak (Vorsorge), temin etmek (besorgen).","tr":"sağlamak → beslemek → tedarik / bertaraf etmek → atık giderme","s":"Wer sorgt eigentlich für die Entsorgung des alten Sofas?","st":"Eski koltuğun atılmasını aslında kim ayarlıyor?","f":"die Fürsorge (bakım) · besorgen (temin etmek) · die Vorsorge (önlem) · sorgfältig (özenli)"},{"w":"Zincir: achten","t":"Kök zinciri","k":"achten → beachten → die Beachtung / missachten → die Missachtung","c":"achtet – achtete – hat geachtet","br":"Dikkate almak ve saygı duymak aynı kök: bir şeye değer biçmek. be- ile kurala uymak, miss- ile hiçe saymak, be+Rücksicht ile hesaba katmak.","tr":"dikkat etmek, saygı duymak → uymak → riayet","s":"Bitte beachten Sie die geänderten Öffnungszeiten.","st":"Lütfen değişen açılış saatlerine dikkat edin.","f":"die Achtung (saygı; dikkat) · berücksichtigen (dikkate almak) · beachtlich (kayda değer) · das Gutachten (bilirkişi raporu)"},{"w":"Zincir: gelten","t":"Kök zinciri","k":"gelten → gültig → die Gültigkeit / geltend machen","c":"gilt – galt – hat gegolten","br":"Geçerli olmak: geçerlilik (Gültigkeit), bir hakkı ileri sürüp geçerli kılmak (geltend machen), kesin ve nihai olan (endgültig). Değer ve para anlamı da aynı kökten: das Geld.","tr":"geçerli olmak → geçerli → geçerlilik / ileri sürmek","s":"Das Ticket gilt nur heute — den Rest kannst du nicht geltend machen.","st":"Bilet yalnızca bugün geçerli — gerisini ileri süremezsin.","f":"gültig (geçerli) · endgültig (nihai) · die Geltung (itibar, geçerlilik) · geltend machen (ileri sürmek)"},{"w":"Zincir: bilden","t":"Kök zinciri","k":"bilden → ausbilden → die Ausbildung / die Bildung","c":"bildet – bildete – hat gebildet","br":"Biçim vermek: insanı biçimlendirmek eğitim olur (Bildung: hem eğitim hem oluşum), meslek eğitimi ausbilden’dir. Kendine bir görüntü kurmak ise kuruntu: sich etwas einbilden.","tr":"oluşturmak → yetiştirmek → meslek eğitimi / eğitim","s":"Nach der Ausbildung hat er sofort eine Stelle gefunden.","st":"Meslek eğitiminden sonra hemen bir iş buldu.","f":"das Bild (görüntü) · die Bildung (eğitim; oluşum) · sich einbilden (kuruntuya kapılmak) · abbilden (göstermek)"}]},{"n":"Kök zincirleri: soyut ve idari kökler","e":"weisen → Ausweis, rechnen → Abrechnung","c":"#4a5f8f","g":"Kök aileleri","cards":[{"w":"Zincir: weisen","t":"Kök zinciri","k":"weisen → hinweisen → der Hinweis / ausweisen → der Ausweis","c":"weist – wies – hat gewiesen","br":"Göstermek: bir şeye doğru göstermek (uyarı, ipucu), sonradan gösterebilmek (kanıt), kişinin kimliğini gösteren belge (kimlik), talimatla göstermek (yönerge).","tr":"göstermek → dikkat çekmek → uyarı / kimliklendirmek → kimlik","s":"Bitte den Ausweis bereithalten — ich weise nur kurz darauf hin.","st":"Lütfen kimliği hazır tutun — sadece kısaca hatırlatıyorum.","f":"der Nachweis (kanıt belge) · die Anweisung (talimat) · nachweislich (kanıtlı olarak) · zuweisen (tahsis etmek)"},{"w":"Zincir: rechnen","t":"Kök zinciri","k":"rechnen → berechnen → die Berechnung / abrechnen → die Abrechnung","c":"rechnet – rechnete – hat gerechnet","br":"Hesaplamak: bir tutarı hesaplayıp yansıtmak (berechnen), dönemi kapatıp hesaplaşmak (abrechnen), hesaba katmak (anrechnen), mahsup etmek (verrechnen).","tr":"hesaplamak → hesaplamak/yansıtmak → hesaplama / hesaplaşmak → hesap dökümü","s":"Die Abrechnung kommt einmal im Jahr — damit muss man rechnen.","st":"Hesap dökümü yılda bir gelir — bunu hesaba katmak gerekir.","f":"die Anrechnung (mahsup etme) · verrechnen (mahsup etmek) · die Rechnung (fatura) · ausrechnen (hesaplayıp bulmak)"},{"w":"Zincir: zählen","t":"Kök zinciri","k":"zählen → erzählen → die Erzählung / aufzählen → die Aufzählung","c":"zählt – zählte – hat gezählt","br":"Saymak, anlatmaya dönüşüyor: olayları sırayla saymak = anlatmak. Türkçedeki „bir bir anlatmak“ ile aynı fikir. Aynı kökten zahlen (ödemek: sayıp vermek).","tr":"saymak → anlatmak → anlatı / sıralamak → sıralama","s":"Erzähl mal, wie war der Termin?","st":"Anlatsana, randevu nasıl geçti?","f":"zahlen (ödemek) · die Zahl (sayı) · der Zähler (sayaç; pay) · zählen zu (…arasında sayılmak)"},{"w":"Zincir: suchen","t":"Kök zinciri","k":"suchen → besuchen → der Besuch / untersuchen → die Untersuchung","c":"sucht – suchte – hat gesucht","br":"Aramak: birini arayıp bulmak (ziyaret), altını araştırmak (inceleme, muayene), denemek için aramak (versuchen: denemek → der Versuch).","tr":"aramak → ziyaret etmek → ziyaret / incelemek → inceleme","s":"Nach dem Besuch beim Arzt folgt noch eine Untersuchung.","st":"Doktor ziyaretinden sonra bir de tetkik var.","f":"der Versuch (deneme) · versuchen (denemek) · die Suche (arayış) · aufsuchen (ziyarete gitmek)"},{"w":"Zincir: richten","t":"Kök zinciri","k":"richten → berichten → der Bericht / einrichten → die Einrichtung","c":"richtet – richtete – hat gerichtet","br":"Yöneltmek, düzenlemek: haberi doğru yöne çevirmek (rapor), mekânı düzenlemek (döşemek, kurum), hizalamak, iletmek. Hem das Gericht (mahkeme, yemek) hem der Richter buradan.","tr":"yöneltmek → haber vermek → rapor / düzenlemek → kurum, döşeme","s":"Ich richte dir aus, was im Bericht steht.","st":"Raporda ne yazdığını sana ileteyim.","f":"das Gericht (mahkeme; yemek) · der Richter (hâkim) · die Richtung (yön) · die Richtlinie (yönerge) · sich richten nach (…e göre olmak)"},{"w":"Zincir: teilen","t":"Kök zinciri","k":"teilen → mitteilen → die Mitteilung / verteilen → die Verteilung","c":"teilt – teilte – hat geteilt","br":"Bölmek, paylaşmak: bilgiyi paylaşmak (bildirmek), her yana dağıtmak (dağıtım), pay almak (katılım), hüküm vererek ayırmak (urteilen → das Urteil).","tr":"paylaşmak → bildirmek → bildirim / dağıtmak → dağıtım","s":"Teil mir bitte kurz mit, wie wir die Kosten verteilen.","st":"Masrafları nasıl paylaştıracağımızı bana kısaca bildir.","f":"das Urteil (hüküm) · die Beteiligung (katılım) · der Anteil (pay) · der Verteilerschlüssel (dağıtım anahtarı)"},{"w":"Zincir: ordnen","t":"Kök zinciri","k":"ordnen → anordnen → die Anordnung / verordnen → die Verordnung","c":"ordnet – ordnete – hat geordnet","br":"Düzenlemek: düzeni birine dayatmak (emir), resmî olarak düzenlemek (yönetmelik; ilaç yazmak), yerine yerleştirmek (sınıflandırmak).","tr":"düzenlemek → emretmek → emir / düzenlemek → yönetmelik","s":"Wer hat diese Anordnung eigentlich getroffen?","st":"Bu emri aslında kim verdi?","f":"die Ordnung (düzen) · die Einordnung (sınıflandırma) · die Zuordnung (eşleştirme) · ordentlich (düzenli)"},{"w":"Zincir: decken","t":"Kök zinciri","k":"decken → entdecken → die Entdeckung / aufdecken → die Aufdeckung","c":"deckt – deckte – hat gedeckt","br":"Örtmek: örtüyü kaldırmak (keşfetmek), üstünü açmak (ortaya çıkarmak), masayı örtmek (kurmak), masrafı karşılamak (deckt die Kosten).","tr":"örtmek → keşfetmek → keşif / ortaya çıkarmak → ifşa","s":"Wer hat eigentlich entdeckt, dass die Zahlen nicht stimmen?","st":"Rakamların tutmadığını aslında kim fark etti?","f":"die Decke (örtü; tavan) · die Deckung (karşılık; siper) · bedecken (örtmek) · abdecken (kapsamak)"},{"w":"Zincir: messen","t":"Kök zinciri","k":"messen → ermessen → das Ermessen / angemessen","c":"misst – maß – hat gemessen","br":"Ölçmek: takdir edip ölçmek (idarenin takdir yetkisi: das Ermessen), ölçüsüne uygun olan (angemessen: uygun, ölçülü). Ölçü fikri hukuk diline böyle geçiyor.","tr":"ölçmek → takdir etmek → takdir yetkisi / ölçülü → uygun","s":"Der Betrag ist unter diesen Umständen angemessen.","st":"Tutar bu koşullar altında uygun.","f":"die Messung (ölçüm) · das Maß (ölçü) · unangemessen (uygunsuz) · vermessen (arazi ölçmek; küstah)"},{"w":"Zincir: binden","t":"Kök zinciri","k":"binden → verbinden → die Verbindung / die Verbindlichkeit","c":"bindet – band – hat gebunden","br":"Bağlamak: iki şeyi birbirine bağlamak (bağlantı, telefonda hattı bağlamak), kişiyi bağlayan yükümlülük (borç), bir işe dahil etmek (einbinden).","tr":"bağlamak → birleştirmek → bağlantı / bağlayıcılık → borç","s":"Können Sie mich bitte mit der Sachbearbeiterin verbinden?","st":"Beni lütfen dosya sorumlusuna bağlayabilir misiniz?","f":"verbindlich (bağlayıcı; nazik) · der Verband (birlik; sargı) · einbinden (dahil etmek) · das Bündnis (ittifak)"},{"w":"Zincir: laden","t":"Kök zinciri","k":"laden → einladen → die Einladung / die Ladung","c":"lädt – lud – hat geladen","br":"Yüklemek: birini davete yüklemek (davet etmek), yükü indirmek (entladen), pili doldurmak (aufladen). die Ladung hem yük hem mahkeme celbi demektir.","tr":"yüklemek → davet etmek → davet / yük, celp","s":"Danke für die Einladung — ich komme gern.","st":"Davet için teşekkürler — memnuniyetle gelirim.","f":"aufladen (şarj etmek) · die Ladesäule (şarj istasyonu) · entladen (boşaltmak) · der Auftrag (görev)"},{"w":"Zincir: kaufen","t":"Kök zinciri","k":"kaufen → verkaufen → der Verkauf / einkaufen → der Einkauf","c":"kauft – kaufte – hat gekauft","br":"Almak-satmak ekseni: ver- yönü tersine çevirip satmak yapıyor, ein- alışverişe çeviriyor. Deyimleşmiş hâli: etwas in Kauf nehmen — kusuruyla birlikte göze almak.","tr":"satın almak → satmak → satış / alışveriş yapmak → alışveriş","s":"Ich gehe kurz einkaufen, brauchst du was?","st":"Kısaca alışverişe çıkıyorum, bir şey lazım mı?","f":"der Kauf (alım) · der Verkäufer (satıcı) · in Kauf nehmen (göze almak) · der Einkaufszettel (alışveriş listesi)"},{"w":"Zincir: finden","t":"Kök zinciri","k":"finden → erfinden → die Erfindung / stattfinden","c":"findet – fand – hat gefunden","br":"Bulmak: yoktan bulmak (icat etmek), yer bulup gerçekleşmek (stattfinden), kendini bir yerde bulmak (sich befinden), içte bulmak (empfinden: hissetmek).","tr":"bulmak → icat etmek → icat / gerçekleşmek","s":"Wann findet die Sitzung statt?","st":"Toplantı ne zaman yapılıyor?","f":"sich befinden (bulunmak) · empfinden (hissetmek) · die Abfindung (tazminat) · der Fund (buluntu)"}]},{"n":"Kök ailesi: ziehen · stehen · stellen","e":"tek kökten türeyen isim ve sıfatlar","c":"#1f7a5c","g":"Kök aileleri","cards":[{"w":"der Bezug","t":"Nomen, ¨-e","k":"be + Zug (ziehen)","c":"der Bezug, die Bezüge","br":"beziehen = bir şeyi kendine doğru çekmek. Çekilen bağ = ilişki, referans. Kalıp: Bezug nehmen auf = atıfta bulunmak.","tr":"ilişki, atıf; (çoğul) gelir, ödenek","s":"Mit Bezug auf Ihr Schreiben vom 12. März teile ich Ihnen mit …","st":"12 Mart tarihli yazınıza atfen size bildiririm ki …","f":"beziehen (temin etmek; ilişkilendirmek) · die Beziehung (ilişki) · bezüglich (…ilişkin) · in Bezug auf (…e ilişkin)","m":[{"tr":"kılıf","s":"Der Bezug des Kissens lässt sich bei 60 Grad waschen.","st":"Yastığın kılıfı 60 derecede yıkanabilir."}]},{"w":"die Erziehung","t":"Nomen (çoğulsuz)","k":"er + ziehen + -ung","c":"die Erziehung","br":"erziehen = çocuğu belli bir yöne çeke çeke yetiştirmek. Almanca eğitimi „çekmek“ imgesiyle kurar.","tr":"terbiye, çocuk eğitimi","s":"Erziehung und Unterricht sind zwei verschiedene Aufgaben.","st":"Terbiye ile öğretim iki ayrı görevdir.","f":"erziehen (yetiştirmek, terbiye etmek) · der Erzieher (eğitmen) · die Erziehungsberechtigten (veliler)"},{"w":"der Auszug","t":"Nomen, ¨-e","k":"aus + Zug","c":"der Auszug, die Auszüge","br":"ziehen çekmektir, isim hâli der Zug; aus- dışarı yöneltir. Evden kendini çekmek = taşınıp çıkmak; metinden bir parça çekip almak = alıntı; hesaptan veri çekmek = ekstre. Karşıtı der Einzug: içeri çekilme.","tr":"taşınıp çıkma; alıntı, hesap özeti","s":"Bitte legen Sie einen aktuellen Kontoauszug bei.","st":"Lütfen güncel bir hesap özeti ekleyin.","f":"ausziehen (taşınıp çıkmak; soyunmak) · der Einzug (taşınma) · der Kontoauszug (hesap özeti)","m":[{"tr":"evden taşınıp çıkma","s":"Nach dem Auszug muss die Wohnung besenrein übergeben werden.","st":"Taşındıktan sonra daire süpürülmüş hâlde teslim edilmeli."}]},{"w":"der Vorzug","t":"Nomen, ¨-e","k":"vor + Zug","c":"der Vorzug, die Vorzüge","br":"ziehen çekmektir; vor- öne çeker. vorziehen = öne çekip tercih etmek; isim hâli o tercihin sebebini adlandırır: üstünlük. Sıfatı vorzüglich (mükemmel), zarfı vorzugsweise (tercihen).","tr":"üstünlük, tercih","s":"Diese Lösung hat den Vorzug, dass sie nichts kostet.","st":"Bu çözümün üstünlüğü hiçbir masrafının olmaması.","f":"vorziehen (tercih etmek; öne almak) · vorzugsweise (tercihen) · vorzüglich (mükemmel)"},{"w":"zügig","t":"Adjektiv / Adverb","k":"Zug + -ig","c":"—","br":"Kök der Zug: çekiş, tek hamlede yapılan hareket (bkz. in einem Zug: bir çırpıda). -ig ile sıfat olunca „duraksamadan çeken“ = hızlı ve akıcı demektir. Resmî yazıda acele etmeden acele istemenin kelimesidir: um zügige Bearbeitung bitten.","tr":"hızlı, aksatmadan","s":"Wir bitten um zügige Bearbeitung des Antrags.","st":"Başvurunun hızla işleme alınmasını rica ederiz.","f":"der Zug (çekiş; tren) · ziehen (çekmek) · zügeln (dizginlemek)"},{"w":"der Zustand","t":"Nomen, ¨-e","k":"zu + Stand (stehen)","c":"der Zustand, die Zustände","br":"Bir şeyin şu an nasıl durduğu = durum. stehen kökü Almancada „hâl“ kavramının merkezidir.","tr":"durum, hâl","s":"Die Wohnung befindet sich in einem einwandfreien Zustand.","st":"Daire kusursuz bir durumda.","f":"stehen (durmak) · der Umstand (koşul, hâl) · der Bestand (mevcut, stok) · beständig (kalıcı, istikrarlı)"},{"w":"der Umstand","t":"Nomen, ¨-e","k":"um + Stand","c":"der Umstand, die Umstände","br":"stehen durmaktır, isim hâli der Stand; um- etrafını gösterir. Yani olayın etrafında duran şeyler = koşullar. Aynı aileden der Zustand (içinde bulunulan hâl) ve der Gegenstand (karşıda duran). Kalıp: unter Umständen (duruma göre).","tr":"koşul, hâl","s":"Unter diesen Umständen ist eine Fristverlängerung angemessen.","st":"Bu koşullar altında sürenin uzatılması yerinde olur.","f":"umständlich (zahmetli) · unter Umständen (belki)"},{"w":"der Widerstand","t":"Nomen, ¨-e","k":"wider (karşı) + Stand","c":"der Widerstand, die Widerstände","br":"wider- = karşı (wieder „tekrar“ ile karıştırma). Karşıda durmak = direnç.","tr":"direniş, direnç","s":"Gegen die Pläne regt sich erheblicher Widerstand.","st":"Planlara karşı ciddi bir direnç oluşuyor.","f":"widersprechen (karşı çıkmak) · der Widerspruch (itiraz) · widerstehen (direnmek)"},{"w":"der Gegenstand","t":"Nomen, ¨-e","k":"gegen + Stand","c":"der Gegenstand, die Gegenstände","br":"gegen + Stand: karşımızda duran şey. Somutta eşya, soyutta ele alınan konu — ikisi de „karşıda durma“ imgesinden. Aynı kökten der Zustand, der Umstand, der Widerstand. Hukukta der Streitgegenstand: davanın konusu.","tr":"nesne, eşya; konu","s":"Auf dem Tisch liegen lauter spitze Gegenstände.","st":"Masada bir sürü sivri eşya duruyor.","f":"gegenständlich (nesnel, somut) · der Streitgegenstand (dava konusu)"},{"w":"selbstständig","t":"Adjektiv","k":"selbst + stehen + -ig","c":"—","br":"Kendi ayakları üzerinde duran: hem „bağımsız“ hem „serbest meslek sahibi“.","tr":"bağımsız, kendi başına; serbest çalışan","s":"Die Schüler sollen die Aufgabe selbstständig lösen.","st":"Öğrenciler görevi kendi başlarına çözmeli.","f":"die Selbstständigkeit (bağımsızlık; serbest çalışma) · unselbstständig (bağımlı, kendi başına yapamayan) · ständig (sürekli)"},{"w":"das Verständnis","t":"Nomen (çoğulsuz)","k":"ver + stehen + -nis","c":"das Verständnis","br":"verstehen = bir şeyin önünde doğru durabilmek = anlamak. -nis sonucu verir: anlayış.","tr":"anlayış, kavrayış","s":"Ich bitte um Ihr Verständnis für die Verzögerung.","st":"Gecikme için anlayışınızı rica ederim.","f":"verstehen (anlamak) · verständlich (anlaşılır) · das Missverständnis (yanlış anlaşılma) · einverstanden (hemfikir)"},{"w":"die Vorstellung","t":"Nomen, -en","k":"vor + stellen + -ung","c":"die Vorstellung, die Vorstellungen","br":"vorstellen = önüne koymak: birini tanıtmak, bir şeyi zihnin önüne koymak = hayal etmek. İsim üç anlamı da taşır.","tr":"tanıtım; tasavvur, fikir; gösteri","s":"Ich habe eine klare Vorstellung davon, wie das Ergebnis aussehen soll.","st":"Sonucun nasıl olması gerektiğine dair net bir fikrim var.","f":"sich vorstellen (kendini tanıtmak; hayal etmek) · das Vorstellungsgespräch (iş görüşmesi)","m":[{"tr":"tanıtım, kendini tanıtma","s":"Nach einer kurzen Vorstellung begann die Sitzung.","st":"Kısa bir tanışmanın ardından toplantı başladı."},{"tr":"gösteri, seans","s":"Die Vorstellung beginnt um 20 Uhr.","st":"Gösteri saat 20’de başlıyor."}]},{"w":"die Einstellung","t":"Nomen, -en","k":"ein + stellen + -ung","c":"die Einstellung, die Einstellungen","br":"einstellen = içine yerleştirmek: işe almak, ayar yapmak, faaliyeti durdurmak. Türev isim üç anlamı da taşır; en sık: tutum, ayar.","tr":"tutum, yaklaşım; ayar; işe alım","s":"Seine Einstellung zu dieser Frage hat sich völlig geändert.","st":"Bu soruya karşı tutumu tamamen değişti.","f":"einstellen (işe almak; ayarlamak; durdurmak) · die Einstellungen (ayarlar) · die Verfahrenseinstellung (davanın düşmesi)","m":[{"tr":"ayar","s":"Die Einstellungen lassen sich jederzeit zurücksetzen.","st":"Ayarlar her zaman sıfırlanabilir."},{"tr":"işe alım","s":"Über die Einstellung entscheidet die Schulleitung.","st":"İşe alıma okul yönetimi karar veriyor."}]},{"w":"die Bestellung","t":"Nomen, -en","k":"be + stellen + -ung","c":"die Bestellung, die Bestellungen","br":"bestellen = bir şeyi bir yere koydurtmak = sipariş etmek; resmî dilde: birini bir göreve atamak.","tr":"sipariş; atama","s":"Die Bestellung ist noch nicht eingegangen.","st":"Sipariş henüz ulaşmadı.","f":"bestellen (sipariş etmek; atamak) · die Bestellnummer (sipariş numarası) · bestellter Betreuer (atanmış vasi)","m":[{"tr":"(resmî) atama","s":"Die Bestellung eines Betreuers erfolgt durch das Gericht.","st":"Vasi ataması mahkeme tarafından yapılır."}]},{"w":"die Herstellung","t":"Nomen (çoğulsuz)","k":"her (buraya) + stellen + -ung","c":"die Herstellung","br":"stellen koymaktır; her- ise konuşana doğru yönü gösterir: „buraya koymak“, yani yoktan ortaya çıkarmak = üretmek. Aileden der Hersteller (üretici), herstellen, die Wiederherstellung (eski hâline getirme).","tr":"üretim, imalat","s":"Die Herstellung eines guten Brotes dauert seine Zeit.","st":"İyi bir ekmeğin yapımı zaman ister.","f":"herstellen (üretmek) · der Hersteller (üretici) · die Wiederherstellung (geri getirme)"}]},{"n":"Kök ailesi: tragen · führen · halten","e":"Vertrag, Antrag, Haushalt, Inhalt… tek üç kökten","c":"#2e7d5b","g":"Kök aileleri","cards":[{"w":"der Vertrag","t":"Nomen, ¨-e","k":"ver + tragen (taşımak)","c":"der Vertrag, die Verträge","br":"sich vertragen = birbirini taşıyabilmek, geçinmek. İki tarafın birlikte taşıdığı yük = sözleşme.","tr":"sözleşme","s":"Der Vertrag läuft zum 31. Dezember aus.","st":"Sözleşme 31 Aralık’ta sona eriyor.","f":"vertraglich (sözleşmeye dayalı) · sich vertragen (geçinmek) · der Mietvertrag (kira sözleşmesi)"},{"w":"der Antrag","t":"Nomen, ¨-e","k":"an + tragen","c":"der Antrag, die Anträge","br":"Bir talebi mercinin önüne taşımak = başvuru. Alman bürokrasisinin merkez kelimesi: einen Antrag stellen.","tr":"başvuru, dilekçe; teklif","s":"Der Antrag muss vollständig ausgefüllt eingereicht werden.","st":"Başvuru eksiksiz doldurulmuş olarak sunulmalıdır.","f":"beantragen (başvurmak) · der Antragsteller (başvuru sahibi) · antragsberechtigt (başvuru hakkı olan)"},{"w":"der Auftrag","t":"Nomen, ¨-e","k":"auf + tragen","c":"der Auftrag, die Aufträge","br":"jemandem etwas auftragen = birinin üstüne iş yüklemek. Yüklenen iş = görev, sipariş.","tr":"görev, sipariş","s":"Der Auftrag ist raus, jetzt heißt es warten.","st":"Sipariş verildi, şimdi beklemek var.","f":"beauftragen (görevlendirmek) · der Auftraggeber (iş veren)","m":[{"tr":"vekâlet, yetki","s":"Ich handle im Auftrag meines Mandanten.","st":"Müvekkilim adına hareket ediyorum."}]},{"w":"der Beitrag","t":"Nomen, ¨-e","k":"bei + tragen","c":"der Beitrag, die Beiträge","br":"beitragen = ortak yükün yanına kendi payını taşımak. Bu pay = katkı; parasal olunca aidat.","tr":"katkı; aidat, prim; (yazı) makale","s":"Jeder kann einen Beitrag zur Lösung leisten.","st":"Herkes çözüme bir katkı sunabilir.","f":"beitragen (katkıda bulunmak) · der Mitgliedsbeitrag (üyelik aidatı) · der Rundfunkbeitrag (yayın katkı payı)","m":[{"tr":"aidat, prim","s":"Der monatliche Beitrag zur Krankenversicherung ist gestiegen.","st":"Sağlık sigortasına aylık prim arttı."}]},{"w":"der Ertrag","t":"Nomen, ¨-e","k":"er + tragen","c":"der Ertrag, die Erträge","br":"ertragen = sonuna kadar taşımak; toprağın taşıyıp verdiği = ürün, getiri.","tr":"verim, getiri, hasılat","s":"Die Erträge aus der Vermietung sind steuerpflichtig.","st":"Kiralamadan elde edilen gelirler vergiye tabidir.","f":"ertragreich (verimli) · ertragen (katlanmak) · erträglich (katlanılabilir)"},{"w":"betragen","t":"Verb","k":"be + tragen","c":"beträgt – betrug – hat betragen","br":"Bir miktarın kendini taşıması = o kadar tutmak. Rakam bildiren cümlelerin resmî fiili.","tr":"(miktar) tutmak, olmak","s":"Die Nachzahlung beträgt insgesamt 212,40 Euro.","st":"Ek ödeme toplam 212,40 avro tutuyor.","f":"der Betrag (tutar) · sich betragen (davranmak) · das Betragen (davranış)","m":[{"tr":"sich betragen: davranmak (eski/resmî)","s":"Die Schüler haben sich während der Fahrt vorbildlich betragen.","st":"Öğrenciler gezi boyunca örnek davrandı."}]},{"w":"ausführlich","t":"Adjektiv","k":"aus + führen + -lich","c":"—","br":"ausführen = bir düşünceyi sonuna kadar dışarı götürmek = ayrıntılı anlatmak. Sıfatı: ayrıntılı.","tr":"ayrıntılı, etraflıca","s":"Erzähl mir das bitte ausführlich, ich habe Zeit.","st":"Bunu bana ayrıntılı anlat lütfen, vaktim var.","f":"ausführen (uygulamak; ayrıntılandırmak) · die Ausführung (uygulama; izahat) · die Durchführung (gerçekleştirme)"},{"w":"die Einführung","t":"Nomen, -en","k":"ein + führen + -ung","c":"die Einführung, die Einführungen","br":"Bir şeyi içeri götürmek: yeni bir kuralı yürürlüğe sokmak; bir konuya giriş yapmak.","tr":"giriş; yürürlüğe koyma","s":"Die Einführung des neuen Systems ist für Januar geplant.","st":"Yeni sistemin devreye alınması ocak ayına planlandı.","f":"einführen (yürürlüğe koymak; tanıtmak) · die Einleitung (yazıda giriş) · einführend (giriş niteliğinde)"},{"w":"der Haushalt","t":"Nomen, -e","k":"Haus + halten (tutmak)","c":"der Haushalt, die Haushalte","br":"Evi tutmak = ev idaresi. Oradan: hane, ev işleri, ve bir kurumun bütçesi.","tr":"hane, ev işleri; bütçe","s":"In unserem Haushalt leben vier Personen.","st":"Hanemizde dört kişi yaşıyor.","f":"haushalten (idareli kullanmak) · das Haushaltsbuch (gider defteri) · der Bundeshaushalt (federal bütçe)","m":[{"tr":"bütçe","s":"Der Haushalt der Stadt wurde im Dezember beschlossen.","st":"Şehrin bütçesi aralıkta kabul edildi."}]},{"w":"der Unterhalt","t":"Nomen (çoğulsuz)","k":"unter + halten","c":"der Unterhalt","br":"Birini alttan tutmak = geçimini sağlamak. Aile hukukunda nafaka; eşyada bakım masrafı.","tr":"nafaka, geçim; bakım masrafı","s":"Für die Kinder wird monatlich Unterhalt gezahlt.","st":"Çocuklar için aylık nafaka ödeniyor.","f":"unterhalten (geçindirmek; eğlendirmek) · unterhaltspflichtig (nafaka yükümlüsü) · die Instandhaltung (bakım onarım)"},{"w":"die Unterhaltung","t":"Nomen, -en","k":"unter + halten + -ung","c":"die Unterhaltung, die Unterhaltungen","br":"sich unterhalten = birbirini ayakta tutmak → sohbet etmek. Aynı isim hem sohbeti hem eğlenceyi anlatır.","tr":"sohbet; eğlence","s":"Wir hatten gestern eine richtig gute Unterhaltung.","st":"Dün gerçekten güzel bir sohbetimiz oldu.","f":"sich unterhalten (sohbet etmek) · unterhaltsam (eğlenceli) · die Unterhaltungsbranche (eğlence sektörü)","m":[{"tr":"eğlence","s":"Für Unterhaltung ist auf dem Schulfest gesorgt.","st":"Okul şenliğinde eğlence tarafı düşünülmüş."}]},{"w":"der Aufenthalt","t":"Nomen, -e","k":"auf + ent + halten","c":"der Aufenthalt, die Aufenthalte","br":"sich aufhalten = bir yerde kendini tutmak, bulunmak. İsim: bulunma süresi = ikamet, mola.","tr":"ikamet, kalış; mola","s":"Für einen längeren Aufenthalt benötigen Sie eine Genehmigung.","st":"Daha uzun bir ikamet için izne ihtiyacınız var.","f":"sich aufhalten (bir yerde bulunmak) · die Aufenthaltserlaubnis (oturma izni) · der Aufenthaltsraum (dinlenme odası)"},{"w":"der Inhalt","t":"Nomen, -e","k":"in + halten (içinde tutmak)","c":"der Inhalt, die Inhalte","br":"halten tutmaktır; in- onu içeriye çevirir: içinde tutulan şey. Somutta kutunun içindekiler, soyutta metnin içeriği. Aileden enthalten (içermek), inhaltlich (içerik bakımından), das Inhaltsverzeichnis (içindekiler).","tr":"içerik, muhteva","s":"Der Inhalt des Schreibens war eindeutig.","st":"Yazının içeriği açıktı.","f":"enthalten (içermek) · inhaltlich (içerik bakımından) · das Inhaltsverzeichnis (içindekiler)"},{"w":"enthalten","t":"Verb","k":"ent + halten","c":"enthält – enthielt – hat enthalten","br":"İçinde tutmak = içermek. sich enthalten (+G): kendini tutmak = çekimser kalmak.","tr":"içermek, kapsamak","s":"Die Miete enthält bereits die Heizkosten.","st":"Kira, ısıtma giderlerini zaten içeriyor.","f":"der Inhalt (içerik) · enthalten sein in (…in içinde bulunmak) · die Enthaltung (çekimser oy)","m":[{"tr":"sich enthalten: çekimser kalmak","s":"Zwei Mitglieder haben sich bei der Abstimmung enthalten.","st":"İki üye oylamada çekimser kaldı."}]},{"w":"die Verhandlung","t":"Nomen, -en","k":"ver + handeln (eylemek) + -ung","c":"die Verhandlung, die Verhandlungen","br":"handeln = eylemek, alışveriş yapmak. ver- karşılıklılık katar: karşılıklı eyleme = müzakere; mahkemede: duruşma.","tr":"müzakere, görüşme; duruşma","s":"Die Verhandlungen über den Preis liefen zäh.","st":"Fiyat müzakereleri ağır ilerledi.","f":"verhandeln (müzakere etmek) · handeln (eylemek; ticaret yapmak) · der Handel (ticaret)","m":[{"tr":"duruşma","s":"Die mündliche Verhandlung findet am 14. Mai statt.","st":"Duruşma 14 Mayıs’ta yapılacak."}]}]},{"n":"Kök ailesi: kommen · gehen · sprechen","e":"Zukunft, Einkommen, Zugang, Anspruch…","c":"#8a5a2b","g":"Kök aileleri","cards":[{"w":"die Herkunft","t":"Nomen, ¨-e","k":"her (buraya) + Kunft (kommen’in eski isim biçimi)","c":"die Herkunft, die Herkünfte","br":"Kunft = geliş. Buraya nereden gelindiği = köken. Aynı kalıptan Ankunft, Zukunft.","tr":"köken, menşe","s":"Man hört seiner Aussprache die Herkunft kaum an.","st":"Telaffuzundan kökeni neredeyse anlaşılmıyor.","f":"herkommen (buraya gelmek; kaynaklanmak) · die Ankunft (varış) · die Zukunft (gelecek)"},{"w":"die Zukunft","t":"Nomen (çoğulsuz)","k":"zu + Kunft (kommen)","c":"die Zukunft","br":"Üzerimize doğru gelen zaman = gelecek. Almanca zamanı hareket olarak kurar: geçmiş gitti (vergangen), gelecek geliyor.","tr":"gelecek","s":"In Zukunft mache ich das anders.","st":"Bundan sonra bunu farklı yapacağım.","f":"zukünftig (gelecekteki) · die Vergangenheit (geçmiş) · zukunftsfähig (geleceğe uygun)"},{"w":"das Einkommen","t":"Nomen, -","k":"ein + kommen","c":"das Einkommen, die Einkommen","br":"kommen gelmektir; ein- yönü içeri çevirir: içeri gelen = gelir. Mastarın isimleşmiş hâli olduğu için nötr. Aynı mantık İngilizce income’da da vardır. Aileden die Einkommensteuer ve das Auskommen (geçinme).","tr":"gelir","s":"Das zu versteuernde Einkommen wird jährlich neu ermittelt.","st":"Vergilendirilecek gelir her yıl yeniden belirlenir.","f":"die Einkommensteuer (gelir vergisi) · einkommensschwach (düşük gelirli) · das Auskommen (geçim)"},{"w":"das Abkommen","t":"Nomen, -","k":"ab + kommen","c":"das Abkommen, die Abkommen","br":"überein|kommen = ortak bir noktaya gelmek. İsim biçimi: taraflar arası anlaşma.","tr":"anlaşma, antlaşma","s":"Zwischen beiden Ländern besteht ein bilaterales Abkommen.","st":"İki ülke arasında ikili bir anlaşma var.","f":"übereinkommen (anlaşmaya varmak) · die Übereinkunft (mutabakat) · die Vereinbarung (anlaşma)"},{"w":"der Vorgang","t":"Nomen, ¨-e","k":"vor + Gang (gehen)","c":"der Vorgang, die Vorgänge","br":"Gang = yürüyüş, gidiş. Önümüzde akan gidiş = süreç; idari dilde: dosya, işlem.","tr":"süreç, olay; (idari) işlem dosyası","s":"Der ganze Vorgang hat keine fünf Minuten gedauert.","st":"Bütün işlem beş dakika bile sürmedi.","f":"vorgehen (işlem yapmak, ilerlemek) · das Vorgehen (izlenen yöntem) · der Vorgänger (selef)"},{"w":"der Zugang","t":"Nomen, ¨-e","k":"zu + Gang","c":"der Zugang, die Zugänge","br":"gehen gitmektir, isim hâli der Gang; zu- yönü bir hedefe çevirir. Yani bir şeye giden yol = erişim. Hukukta aynı kelime bildirimin muhataba ulaşmasıdır — yine „ona doğru giden yol“. Sıfatı zugänglich.","tr":"erişim, giriş","s":"Der Zugang zu den Belegen darf nicht verweigert werden.","st":"Belgelere erişim reddedilemez.","f":"zugänglich (erişilebilir) · unzugänglich (erişilemez) · zugehen (ulaşmak; …e doğru gitmek)","m":[{"tr":"(bildirimin) ulaşması","s":"Maßgeblich ist der Zugang der Kündigung, nicht das Datum des Briefes.","st":"Belirleyici olan feshin ulaşmasıdır, mektubun tarihi değil."}]},{"w":"der Übergang","t":"Nomen, ¨-e","k":"über + Gang","c":"der Übergang, die Übergänge","br":"über + Gang (gehen): üstünden geçerek bir durumdan öbürüne varış. Somutta geçit ve köprü, soyutta değişim dönemi. Sıfatı vorübergehend: geçici. Okul dilinde en sık geçtiği yer: der Übergang von der Grundschule zur weiterführenden Schule.","tr":"geçiş; geçit","s":"Der Übergang von der Grundschule zum Gymnasium fällt vielen schwer.","st":"İlkokuldan liseye geçiş çoğu çocuğa zor geliyor.","f":"übergehen (geçmek; atlamak) · vorübergehend (geçici) · der Bahnübergang (hemzemin geçit)"},{"w":"der Eingang","t":"Nomen, ¨-e","k":"ein + Gang","c":"der Eingang, die Eingänge","br":"gehen gitmektir, isim hâli der Gang; ein- içeri yönü verir: içeri giden yer = giriş. Resmî dilde ikinci anlamı vardır: yazının kuruma ulaşması — nach Eingang Ihres Schreibens. Karşıtı der Ausgang.","tr":"giriş; (evrakın) ulaşması","s":"Nach Eingang Ihres Schreibens beginnt die Prüfung.","st":"Yazınızın ulaşmasından sonra inceleme başlar.","f":"eingehen (ulaşmak; girmek; üstlenmek) · der Eingangsstempel (giriş kaşesi) · eingehend (ayrıntılı)"},{"w":"die Vergangenheit","t":"Nomen (çoğulsuz)","k":"ver + gehen → vergangen + -heit","c":"die Vergangenheit","br":"vergehen geçip gitmektir; Partizip’i vergangen, -heit ile soyut isme döner. Almanca zamanı hareket olarak kurar: geçmiş gitti, gelecek geliyor (die Zukunft: üzerimize gelen). Karşıtları die Gegenwart ve die Zukunft.","tr":"geçmiş","s":"Das gehört der Vergangenheit an.","st":"O artık geçmişte kaldı.","f":"vergehen (geçip gitmek) · vergangen (geçmiş, geçen) · die Gegenwart (şimdi)"},{"w":"der Anspruch","t":"Nomen, ¨-e","k":"an + Spruch (sprechen)","c":"der Anspruch, die Ansprüche","br":"Spruch = söylenen söz. Birine yöneltilen söz = hak talebi. Kalıp: Anspruch haben auf.","tr":"hak talebi, hak; (çoğul) beklentiler","s":"Als Mieter haben Sie Anspruch auf eine funktionierende Heizung.","st":"Kiracı olarak çalışan bir kalorifere hakkınız var.","f":"anspruchsvoll (zorlu, talepkâr) · beanspruchen (talep etmek; (yer, zaman) almak) · in Anspruch nehmen (yararlanmak)","m":[{"tr":"beklenti, iddia","s":"Seine Ansprüche an die Wohnung sind ziemlich hoch.","st":"Daireden beklentileri epey yüksek."}]},{"w":"der Widerspruch","t":"Nomen, ¨-e","k":"wider (karşı) + Spruch","c":"der Widerspruch, die Widersprüche","br":"Karşı söz: hem hukuki itiraz hem mantıksal çelişki. İki anlam da „karşıya konan söz“den çıkar.","tr":"itiraz; çelişki","s":"Zwischen dem, was er sagt, und dem, was er tut, liegt ein klarer Widerspruch.","st":"Söyledikleriyle yaptıkları arasında net bir çelişki var.","f":"widersprechen (karşı çıkmak) · widersprüchlich (çelişkili) · der Widerstand (direniş, direnç)","m":[{"tr":"çelişki","s":"Zwischen den beiden Aussagen besteht ein klarer Widerspruch.","st":"İki ifade arasında net bir çelişki var."}]},{"w":"die Absprache","t":"Nomen, -n","k":"ab + Sprache (sprechen)","c":"die Absprache, die Absprachen","br":"Bir konuyu birlikte konuşup kapatmak = mutabakat. Resmî olmayan anlaşmalar için kullanılır.","tr":"mutabakat, anlaşma (sözlü)","s":"Nach kurzer Absprache mit meiner Frau sage ich zu.","st":"Eşimle kısaca konuştuktan sonra kabul ediyorum.","f":"absprechen (kararlaştırmak) · sich absprechen (aralarında anlaşmak) · nach Absprache (mutabakat üzerine)"},{"w":"die Aussprache","t":"Nomen, -n","k":"aus + Sprache","c":"die Aussprache, die Aussprachen","br":"Sesin dışarı çıkış biçimi = telaffuz; kişiler arasında: her şeyin açıkça konuşulduğu görüşme.","tr":"telaffuz; açık konuşma","s":"Ihre Aussprache ist inzwischen fast akzentfrei.","st":"Telaffuzu artık neredeyse aksansız.","f":"aussprechen (telaffuz etmek; dile getirmek) · die Sprache (dil) · der Ausspruch (veciz söz)","m":[{"tr":"açık konuşma, hesaplaşma","s":"Nach einer offenen Aussprache war das Problem geklärt.","st":"Açık bir konuşmadan sonra sorun çözüldü."}]},{"w":"die Rücksprache","t":"Nomen, -n","k":"rück (geri) + Sprache","c":"die Rücksprache, die Rücksprachen","br":"Karar vermeden önce geri dönüp konuşmak = danışma. Resmî yazının kalıbı: nach Rücksprache mit …","tr":"görüşme, danışma","s":"Ich halte kurz Rücksprache mit meinem Kollegen und melde mich.","st":"Meslektaşımla kısaca görüşüp size dönerim.","f":"Rücksprache halten mit (…ile görüşmek) · absprechen (kararlaştırmak) · die Absprache (mutabakat)"},{"w":"der Versprecher","t":"Nomen, -","k":"ver + sprechen + -er","c":"der Versprecher, die Versprecher","br":"sich versprechen = yanlış söylemek. -er faili değil, olayın kendisini adlandırır: dil sürçmesi.","tr":"dil sürçmesi","s":"Das war nur ein Versprecher, kein Widerruf.","st":"Bu sadece bir dil sürçmesiydi, cayma değil.","f":"sich versprechen (dili sürçmek) · das Versprechen (söz) · der Freudsche Versprecher (Freudyen dil sürçmesi)"}]},{"n":"Kök ailesi: setzen · legen · geben · nehmen","e":"Einsatz, Ersatz, Grundlage, Ausnahme…","c":"#356b8f","g":"Kök aileleri","cards":[{"w":"der Einsatz","t":"Nomen, ¨-e","k":"ein + Satz (setzen: koymak)","c":"der Einsatz, die Einsätze","br":"İçeri koyulan şey: ortaya konan emek, devreye sokulan araç, oyunda konulan para. Üç anlam da „içine koymak“ imgesinden.","tr":"gayret, çaba; kullanım, görev","s":"Ohne den Einsatz der Eltern wäre das Projekt gescheitert.","st":"Velilerin çabası olmasa proje çökerdi.","f":"einsetzen (kullanmak, görevlendirmek) · sich einsetzen für (savunmak) · einsatzbereit (göreve hazır)"},{"w":"der Ersatz","t":"Nomen (çoğulsuz)","k":"er + Satz (setzen)","c":"der Ersatz","br":"ersetzen = bir şeyin yerine başkasını koymak. Yerine konan = yedek, ikame; hukukta: tazmin.","tr":"yedek, ikame; tazminat","s":"Für den kaputten Wasserkocher gab es sofort Ersatz.","st":"Bozulan su ısıtıcısının yerine hemen yenisi verildi.","f":"ersetzen (yerine koymak) · der Schadensersatz (tazminat) · die Ersatzteile (yedek parça)"},{"w":"der Absatz","t":"Nomen, ¨-e","k":"ab + Satz (setzen)","c":"der Absatz, die Absätze","br":"Yazıda: satırı kesip aşağı koymak = paragraf. Ticarette: malı elden çıkarmak = satış. Ayakkabıda: topuk. Üçü de „ayırıp koymak“tan.","tr":"paragraf, fıkra (yasada)","s":"Nach § 556 Absatz 3 BGB muss jährlich abgerechnet werden.","st":"BGB 556. maddenin 3. fıkrasına göre yıllık hesap yapılmalıdır.","f":"absetzen (indirmek; satmak) · der Paragraf (madde) · der Satz (cümle)","m":[{"tr":"satış, sürüm","s":"Der Absatz ist im zweiten Quartal deutlich eingebrochen.","st":"Satışlar ikinci çeyrekte belirgin şekilde düştü."}]},{"w":"der Zusatz","t":"Nomen, ¨-e","k":"zu + Satz (setzen)","c":"der Zusatz, die Zusätze","br":"setzen koymaktır, isim hâli der Satz; zu- var olanın yanına ekler. Yani sonradan konulan parça = ek. Sıfatı zusätzlich (ek olarak), fiil hâli hinzusetzen. Aynı aileden der Einsatz, der Absatz, der Gegensatz.","tr":"ek, ilave","s":"Der Vertrag enthält einen handschriftlichen Zusatz.","st":"Sözleşmede el yazısıyla bir ek var.","f":"zusätzlich (ek olarak) · hinzufügen (eklemek) · der Nachtrag (sonradan ek)"},{"w":"der Gegensatz","t":"Nomen, ¨-e","k":"gegen (karşı) + Satz (setzen)","c":"der Gegensatz, die Gegensätze","br":"setzen koymaktır, isim hâli der Satz; gegen- karşıya yerleştirir: karşı karşıya konan iki şey. Kalıp: im Gegensatz zu. Sıfatı gegensätzlich; yakını der Widerspruch (çelişki) — o çatışmayı, bu farkı anlatır.","tr":"karşıtlık, zıtlık","s":"Im Gegensatz zu mir steht sie gern früh auf.","st":"Benim aksime o erken kalkmayı seviyor.","f":"gegensätzlich (zıt) · im Gegensatz zu (…nın aksine) · der Widerspruch (çelişki)"},{"w":"die Grundlage","t":"Nomen, -n","k":"Grund (temel) + Lage (legen: koymak)","c":"die Grundlage, -n","br":"Temele koyulan = dayanak. Hukukta Rechtsgrundlage: bir işlemin dayandığı yasa maddesi — resmî itirazın ilk sorusu budur.","tr":"temel, dayanak","s":"Für diese Forderung fehlt jede rechtliche Grundlage.","st":"Bu talebin hiçbir hukuki dayanağı yok.","f":"grundlegend (temel niteliğinde) · die Rechtsgrundlage (yasal dayanak) · die Lage (konum, durum)"},{"w":"die Auflage","t":"Nomen, -n","k":"auf + Lage (legen)","c":"die Auflage, -n","br":"Üstüne koyulan: yerine getirilmesi şart koşulan yükümlülük; kitapta ise basılan miktar = baskı. Aynı imge, iki alan.","tr":"şart, yükümlülük","s":"Wir haben den Kredit nur mit strengen Auflagen bekommen.","st":"Krediyi ancak sıkı şartlarla aldık.","f":"auferlegen (yüklemek) · die Bedingung (koşul) · auflegen (üstüne koymak)","m":[{"tr":"baskı (kitap)","s":"Das Buch erscheint bereits in der fünften Auflage.","st":"Kitap şimdiden beşinci baskısını yapıyor."}]},{"w":"die Überlegung","t":"Nomen, -en","k":"über + legen (koymak) + -ung","c":"die Überlegung, -en","br":"überlegen = düşünceleri üst üste koyup tartmak. Sonucu: değerlendirme, düşünce. Aynı kelime sıfat olarak „üstün“ demektir — bu kez „üstte duran“.","tr":"düşünme, değerlendirme","s":"Nach reiflicher Überlegung haben wir uns dagegen entschieden.","st":"Uzun uzun düşündükten sonra buna karşı karar verdik.","f":"überlegen (düşünmek; üstün) · überlegt (ölçülü, düşünülmüş) · legen (koymak)"},{"w":"das Anliegen","t":"Nomen, -","k":"an + liegen (yatmak)","c":"das Anliegen, die Anliegen","br":"Birinin içinde duran, ona yakın olan mesele = talep, dert. Resmî görüşmelerin açılış kelimesi: Was ist Ihr Anliegen?","tr":"talep, mesele, dert","s":"Ich möchte Ihnen mein Anliegen kurz schriftlich darlegen.","st":"Talebimi size kısaca yazılı olarak açıklamak istiyorum.","f":"anliegen (yakın olmak) · das Hauptanliegen (asıl talep) · liegen (yatmak)"},{"w":"die Ausgabe","t":"Nomen, -n","k":"aus + geben (vermek)","c":"die Ausgabe, -n","br":"Dışarı verilen: para (gider), dağıtılan şey (dağıtım) ya da yayın (sayı, sürüm). Karşıtı die Einnahme.","tr":"gider, harcama","s":"Die Ausgaben übersteigen in diesem Jahr die Einnahmen.","st":"Bu yıl giderler gelirleri aşıyor.","f":"ausgeben (harcamak; dağıtmak) · die Einnahme (gelir) · der Ausgabetag (dağıtım günü)","m":[{"tr":"sayı, sürüm (yayın)","s":"Die neue Ausgabe des Lehrbuchs enthält andere Aufgaben.","st":"Ders kitabının yeni sürümü farklı sorular içeriyor."}]},{"w":"die Übergabe","t":"Nomen, -n","k":"über + geben (vermek)","c":"die Übergabe, -n","br":"Karşı tarafa vermek = teslim. Kiralamada Übergabeprotokoll, sonraki bütün tartışmaların kaderini belirler.","tr":"teslim, devir","s":"Bei der Übergabe haben wir alles gemeinsam durchgeschaut.","st":"Teslim sırasında her şeye birlikte baktık.","f":"übergeben (teslim etmek) · das Übergabeprotokoll (teslim tutanağı) · die Rückgabe (iade)"},{"w":"die Vorgabe","t":"Nomen, -n","k":"vor + geben (vermek)","c":"die Vorgabe, -n","br":"Önceden verilen = uyulması gereken ölçü, talimat. Okulda müfredat, idarede yönetmelik hep Vorgabe olarak anılır.","tr":"talimat, belirlenen ölçüt","s":"Die Vorgaben des Ministeriums lassen kaum Spielraum.","st":"Bakanlığın talimatları neredeyse hiç hareket alanı bırakmıyor.","f":"vorgeben (belirlemek; ileri sürmek) · die Richtlinie (yönerge) · der Spielraum (hareket alanı)"},{"w":"die Ausnahme","t":"Nomen, -n","k":"aus + nehmen (almak)","c":"die Ausnahme, -n","br":"Kuralın dışına alınan = istisna. Kalıp: mit Ausnahme von … Kural (die Regel) ile birlikte çalışır: Ausnahmen bestätigen die Regel.","tr":"istisna","s":"Ausnahmen sind nur in begründeten Einzelfällen möglich.","st":"İstisnalar yalnızca gerekçeli tek tek durumlarda mümkün.","f":"ausnehmen (hariç tutmak) · ausnahmsweise (istisnai olarak) · die Regel (kural)"},{"w":"die Einnahme","t":"Nomen, -n","k":"ein + nehmen (almak)","c":"die Einnahme, -n","br":"İçeri alınan = gelir; ilaç için: alım. Ausgabe ile tam bir çift oluşturur.","tr":"gelir; (ilaç) alımı","s":"Die Einnahmen der Gemeinde sind leicht gestiegen.","st":"Belediyenin gelirleri hafif arttı.","f":"einnehmen (almak; işgal etmek) · die Ausgabe (gider) · das Einkommen (gelir)"},{"w":"das Benehmen","t":"Nomen (çoğulsuz)","k":"be + nehmen (almak)","c":"das Benehmen","br":"sich benehmen = kendini şu şekilde ele almak = davranmak. Verhalten yansız bir gözlemdir, Benehmen ise görgüye bakar.","tr":"tavır, terbiye, görgü","s":"Sein Benehmen im Unterricht hat sich deutlich gebessert.","st":"Derste davranışı belirgin şekilde düzeldi.","f":"sich benehmen (terbiyeli davranmak) · das Verhalten (davranış) · unverschämt (arsız)"}]},{"n":"Kök ailesi: schließen · greifen · werfen · fassen","e":"soyut kavramların somut kökleri","c":"#6b3fa0","g":"Kök aileleri","cards":[{"w":"der Beschluss","t":"Nomen, ¨-e","k":"be + Schluss (schließen)","c":"der Beschluss, die Beschlüsse","br":"schließen = kapatmak. Tartışmayı kapatan şey = karar. Kurul kararlarının resmî adı.","tr":"karar (kurul, mahkeme)","s":"Der Beschluss des Vereins gilt ab Januar.","st":"Derneğin kararı ocaktan itibaren geçerli.","f":"beschließen (karar vermek) · die Beschlussfassung (karar alma) · der Entschluss (kişisel karar)"},{"w":"schlüssig","t":"Adjektiv","k":"Schluss + -ig","c":"—","br":"Schluss son ve kapanış demektir (schließen: kapatmak); -ig eki niteliğe çevirir: halkaları kapanan, boşluk bırakmayan. Yani argümanın sızdırmaz olması. Aileden die Schlussfolgerung (çıkarım) ve folgerichtig (mantık gereği).","tr":"tutarlı, ikna edici","s":"Die Begründung des Amtes ist nicht schlüssig.","st":"Dairenin gerekçesi tutarlı değil.","f":"der Schluss (son; sonuç) · die Schlussfolgerung (çıkarım) · folgern (sonuç çıkarmak)"},{"w":"die Schlussfolgerung","t":"Nomen, -en","k":"Schluss + folgen + -ung","c":"die Schlussfolgerung, die Schlussfolgerungen","br":"Kapanıştan çıkan sonuç = çıkarım. Aynı mantık Latince conclusio ve Türkçe „sonuç çıkarmak“ta da var.","tr":"çıkarım, vardığı sonuç","s":"Aus diesen Zahlen lässt sich keine eindeutige Schlussfolgerung ziehen.","st":"Bu rakamlardan net bir çıkarım yapılamaz.","f":"folgern (sonuç çıkarmak) · die Folge (sonuç) · folglich (dolayısıyla)"},{"w":"der Begriff","t":"Nomen, -e","k":"be + Griff (greifen)","c":"der Begriff, die Begriffe","br":"greifen = elle kavramak. begreifen = zihinle kavramak. Kavranan şey = kavram. Türkçe „kavram“ ile birebir aynı mantık.","tr":"kavram, terim","s":"Der Begriff „Betriebskosten“ ist gesetzlich definiert.","st":"„İşletme giderleri“ kavramı yasal olarak tanımlıdır.","f":"begreifen (kavramak) · begrifflich (kavramsal) · im Begriff sein zu (…üzere olmak)"},{"w":"der Eingriff","t":"Nomen, -e","k":"ein + Griff","c":"der Eingriff, die Eingriffe","br":"greifen kavramaktır; ein- eli içeri sokar: müdahale. Tıpta ameliyat, hukukta bir hakka dokunma anlamına gelir — ikisi de „içeri uzanan el“. Aynı kökten der Angriff (saldırı), der Zugriff (erişim), der Begriff (kavram).","tr":"müdahale, operasyon","s":"Ein solcher Eingriff in die Privatsphäre ist unzulässig.","st":"Özel hayata böyle bir müdahale hukuka aykırıdır.","f":"eingreifen (müdahale etmek) · der Angriff (saldırı) · greifbar (elle tutulur)"},{"w":"der Vorwurf","t":"Nomen, ¨-e","k":"vor + Wurf (werfen)","c":"der Vorwurf, die Vorwürfe","br":"Birinin önüne bir şey fırlatmak = suçlama. jemandem etwas vorwerfen kalıbı bu imgeyi doğrudan yaşatır.","tr":"suçlama, sitem","s":"Der Vorwurf, ich hätte nie zugehört, hat mich getroffen.","st":"Hiç dinlemediğim suçlaması bana dokundu.","f":"vorwerfen (suçlamak) · vorwurfsvoll (sitemkâr) · der Wurf (atış)"},{"w":"der Entwurf","t":"Nomen, ¨-e","k":"ent + Wurf","c":"der Entwurf, die Entwürfe","br":"werfen atmaktır; ent- onu dışarı çıkarır: içerideki fikri dışarı atmak. Yani ilk hâliyle ortaya konan taslak — henüz bağlayıcı değil. Aynı kökten der Vorwurf (birinin önüne atılan: suçlama) ve verwerfen (atıp reddetmek).","tr":"taslak, tasarı","s":"Der Entwurf des Schreibens liegt Ihnen als Anlage bei.","st":"Yazının taslağı ek olarak bilginize sunulmuştur.","f":"entwerfen (taslak çizmek) · der Gesetzentwurf (yasa tasarısı)"},{"w":"die Verfassung","t":"Nomen, -en","k":"ver + fassen + -ung","c":"die Verfassung, die Verfassungen","br":"fassen = tutmak, kapsamak. Bir devletin temel düzenini kapsayan metin = anayasa; kişi için: içinde bulunduğu hâl.","tr":"anayasa; (kişisel) hâl, kondisyon","s":"Er war gesundheitlich in keiner guten Verfassung.","st":"Sağlık açısından iyi bir durumda değildi.","f":"verfassen (kaleme almak) · verfassungswidrig (anayasaya aykırı) · der Verfasser (yazar)","m":[{"tr":"anayasa","s":"Das Grundgesetz ist die Verfassung der Bundesrepublik.","st":"Temel Yasa, Federal Almanya’nın anayasasıdır."}]},{"w":"zusammenfassen","t":"Verb","k":"zusammen + fassen","c":"fasst zusammen – fasste zusammen – hat zusammengefasst","br":"fassen tutmak ve kapsamaktır; zusammen dağınık olanı bir araya getirir. Yani çok şeyi tek elde tutabilmek = özetlemek. Aynı kökten die Auffassung (görüş), erfassen (kavramak), umfassend (kapsamlı). Kalıp: kurz zusammengefasst.","tr":"özetlemek, toplamak","s":"Fassen Sie bitte die wichtigsten Punkte in fünf Sätzen zusammen.","st":"Lütfen en önemli noktaları beş cümlede özetleyin.","f":"die Zusammenfassung (özet) · fassen (tutmak, kavramak) · zusammenfassend (özetle)"},{"w":"erfassen","t":"Verb","k":"er + fassen","c":"erfasst – erfasste – hat erfasst","br":"Kavrayışa ulaşmak: zihnen kavramak; idari dilde: veriyi kayda geçirmek.","tr":"kavramak; kaydetmek, tespit etmek","s":"Die Zählerstände werden jährlich elektronisch erfasst.","st":"Sayaç değerleri her yıl elektronik olarak kaydediliyor.","f":"die Erfassung (kayda geçirme) · umfassen (kapsamak) · umfassend (kapsamlı)"},{"w":"der Anlass","t":"Nomen, ¨-e","k":"an + lassen","c":"der Anlass, die Anlässe","br":"anlassen = bir şeyi çalıştırmak, harekete geçirmek. Harekete geçiren şey = vesile, sebep. Grund (asıl sebep) ile ince farkı vardır.","tr":"vesile, sebep, münasebet","s":"Es besteht kein Anlass, an diesen Angaben zu zweifeln.","st":"Bu beyanlardan şüphe etmek için bir sebep yok.","f":"veranlassen (harekete geçirmek) · die Veranlassung (harekete geçirme, vesile) · anlässlich (…münasebetiyle)"},{"w":"die Unterlage","t":"Nomen, -n","k":"unter + legen","c":"die Unterlage, die Unterlagen","br":"Altına konan şey = dayanak; çoğulda dosya, evrak. Resmî yazışmada neredeyse hep çoğul kullanılır.","tr":"belge, evrak (genelde çoğul)","s":"Reichen Sie bitte alle Unterlagen im Original ein.","st":"Lütfen tüm belgeleri orijinal olarak sunun.","f":"unterlegen (altında kalan, yenik) · die Grundlage (temel) · die Vorlage (şablon, sunum)"},{"w":"die Voraussetzung","t":"Nomen, -en","k":"voraus + setzen + -ung","c":"die Voraussetzung, die Voraussetzungen","br":"Önceden konulmuş olan şey = ön koşul, varsayım. voraussetzen = peşinen kabul etmek.","tr":"ön koşul, varsayım","s":"Die Voraussetzungen für eine Befreiung liegen hier nicht vor.","st":"Muafiyet koşulları burada mevcut değil.","f":"voraussetzen (ön koşul saymak) · vorausgesetzt, dass… (…şartıyla)"},{"w":"die Auseinandersetzung","t":"Nomen, -en","k":"auseinander + setzen + -ung","c":"die Auseinandersetzung, die Auseinandersetzungen","br":"sich mit etwas auseinandersetzen = bir konuyu parçalarına ayırıp önüne koymak = derinlemesine uğraşmak. Kişilerle olunca: çekişme.","tr":"derinlemesine inceleme; tartışma, çekişme","s":"Die Auseinandersetzung mit dem Vermieter dauert nun schon ein Jahr.","st":"Ev sahibiyle çekişme şimdiden bir yıldır sürüyor.","f":"sich auseinandersetzen (derinlemesine uğraşmak) · auseinander (birbirinden ayrı)"}]},{"n":"Karıştırılan temel fiiller","e":"machen↔tun, sagen↔reden, denken↔meinen…","c":"#7a4f2f","g":"Kök aileleri","cards":[{"w":"machen ↔ tun","t":"Fiil çifti","k":"machen (yapmak, üretmek) / tun (etmek, eylemek)","c":"macht – machte / tut – tat","br":"machen bir sonuç üretir: Essen machen, Fotos machen, Fehler machen. tun ise soyut eylemi anlatır ve genelde belirsiz nesneyle gelir: etwas tun, nichts tun, das tut weh. Somut ürün varsa machen, eylemin kendisi vurgulanıyorsa tun.","tr":"yapmak (üretmek) ↔ etmek (eylemek)","s":"Ich muss noch etwas tun — zuerst mache ich Kaffee.","st":"Bir şey yapmam lazım — önce kahve yapayım.","f":"erledigen (halletmek) · das tut mir leid (üzgünüm) · unternehmen (girişimde bulunmak)"},{"w":"sagen ↔ sprechen ↔ reden ↔ erzählen","t":"Konuşma fiilleri","k":"sagen (söylemek) / sprechen (konuşmak) / reden (laf etmek) / erzählen (anlatmak)","c":"—","br":"Dördü de ağızdan çıkar ama işleri farklıdır: sagen bir içeriği aktarır (Was hast du gesagt?), sprechen dil ve resmî konuşmadır (Deutsch sprechen), reden serbest konuşmadır ve bazen boş konuşmayı ima eder, erzählen ise olay anlatır.","tr":"söylemek ↔ konuşmak ↔ laf etmek ↔ anlatmak","s":"Sag mir kurz, worüber ihr geredet habt — erzähl es mir in Ruhe.","st":"Ne konuştuğunuzu kısaca söyle — sonra bana sakince anlat.","f":"die Aussprache (telaffuz) · das Gespräch (görüşme) · die Erzählung (anlatı)"},{"w":"denken ↔ glauben ↔ meinen ↔ finden","t":"Görüş fiilleri","k":"denken (düşünmek) / glauben (sanmak) / meinen (kastetmek) / finden (bulmak)","c":"—","br":"Türkçede dördü de „bence“ye gider: denken zihinsel süreçtir (an + Akkusativ), glauben doğruluğuna inanmaktır, meinen kastettiğini ya da görüşünü söyler, finden ise değerlendirmedir: Ich finde das gut.","tr":"düşünmek ↔ sanmak ↔ demek istemek ↔ bulmak","s":"Ich finde das gut — glaubst du, dass es klappt? Was meinst du?","st":"Bence iyi — sence olur mu? Ne dersin?","f":"die Meinung (görüş) · der Gedanke (düşünce) · der Glaube (inanç)"},{"w":"sehen ↔ schauen ↔ ansehen","t":"Bakma fiilleri","k":"sehen (görmek) / schauen (bakmak) / ansehen (izlemek, incelemek)","c":"—","br":"sehen istemsizdir: göz görür. schauen ve gucken bilinçli bakıştır. sich etwas ansehen ise dikkatle incelemektir: Ich sehe mir den Vertrag an. Aynı ayrım hören ↔ zuhören’de de vardır.","tr":"görmek ↔ bakmak ↔ inceleyerek bakmak","s":"Schau mal — hast du das gesehen? Ich sehe es mir gleich genauer an.","st":"Bak hele — bunu gördün mü? Birazdan daha yakından bakacağım.","f":"zusehen (seyretmek) · betrachten (incelemek) · der Blick (bakış)"},{"w":"hören ↔ zuhören","t":"Duyma çifti","k":"hören (duymak) / zu + hören (kulak vermek)","c":"—","br":"hören kulağa gelen sestir; zu- dikkati o sese yöneltir: dinlemek. Bu yüzden Dativ alır: jemandem zuhören. Şikâyet cümlesinin çekirdeği budur: Du hörst mir nie zu — duyuyor ama dinlemiyor.","tr":"duymak ↔ dinlemek","s":"Ich höre dich — aber du hörst mir nicht zu.","st":"Seni duyuyorum — ama sen beni dinlemiyorsun.","f":"gehören (ait olmak) · das Gehör (işitme) · aufmerksam (dikkatli)"},{"w":"gehen ↔ laufen ↔ fahren","t":"Hareket fiilleri","k":"gehen (yürümek) / laufen (koşmak, yürümek) / fahren (araçla gitmek)","c":"—","br":"Almanca hareketi araca göre ayırır: ayakla gehen, araçla fahren, uçakla fliegen. laufen bölgeye göre hem koşmak hem yürümektir. Ayrıca gehen soyut anlamda „işlemek“tir: Es geht nicht.","tr":"yürümek ↔ koşmak ↔ (araçla) gitmek","s":"Wir gehen zu Fuß, ihr fahrt mit dem Rad.","st":"Biz yürüyerek gidiyoruz, siz bisikletle.","f":"zu Fuß (yürüyerek) · fliegen (uçmak) · unterwegs (yolda)"},{"w":"bringen ↔ holen ↔ mitnehmen","t":"Taşıma fiilleri","k":"bringen (götürmek/getirmek) / holen (alıp getirmek) / mitnehmen (yanına almak)","c":"—","br":"Yön mantığı: bringen bir şeyi konuşanın olduğu yere ya da hedefe taşır, holen gidip alır ve döner, mitnehmen ise zaten gideceğin yola bir şeyi katar. Üçünde de hedef kimin yanında, o belirleyicidir.","tr":"getirmek ↔ gidip almak ↔ yanında götürmek","s":"Kannst du Brot mitbringen? Sonst hole ich es später.","st":"Ekmek getirebilir misin? Yoksa sonra ben alırım.","f":"abholen (gidip almak, karşılamak) · mitbringen (yanında getirmek) · liefern (teslim etmek)"},{"w":"wohnen ↔ leben","t":"Fiil çifti","k":"wohnen (ikamet etmek) / leben (yaşamak)","c":"—","br":"wohnen adresle ilgilidir: nerede kalıyorsun. leben hayatla ilgilidir: nerede ve nasıl yaşıyorsun. Bu yüzden Ich wohne in Alsdorf adres bildirir, Ich lebe in Deutschland ise hayatın merkezini.","tr":"oturmak, ikamet etmek ↔ yaşamak","s":"Ich wohne in Alsdorf, aber ich lebe seit dreißig Jahren in Deutschland.","st":"Alsdorf’ta oturuyorum ama otuz yıldır Almanya’da yaşıyorum.","f":"die Wohnung (daire) · das Leben (hayat) · der Wohnsitz (ikametgâh)"},{"w":"treffen ↔ begegnen ↔ kennenlernen","t":"Karşılaşma fiilleri","k":"treffen (buluşmak) / begegnen (rastlamak) / kennenlernen (tanışmak)","c":"—","br":"treffen planlıdır: sözleşip buluşmak. begegnen tesadüfidir ve Dativ alır: Ich bin ihm zufällig begegnet. kennenlernen ise ilk kez tanışmaktır — bir kere olur, sonra treffen’e geçilir.","tr":"buluşmak ↔ rastlamak ↔ tanışmak","s":"Wir haben uns letztes Jahr kennengelernt und treffen uns seitdem regelmäßig.","st":"Geçen yıl tanıştık ve o zamandan beri düzenli buluşuyoruz.","f":"das Treffen (buluşma) · die Begegnung (karşılaşma) · sich verabreden (sözleşmek)"},{"w":"verlieren ↔ vergessen ↔ verpassen ↔ versäumen","t":"Kayıp fiilleri","k":"dördü de ver- ön ekiyle: bir şeyin elden çıkması","c":"—","br":"Ortak ön ek ver- „yitirme“ katıyor ama nesne farklı: verlieren eşyayı, vergessen bilgiyi, verpassen fırsatı ya da aracı, versäumen ise süreyi ve yükümlülüğü kaçırmaktır — sonuncusu resmî ve en ağır olanıdır.","tr":"kaybetmek ↔ unutmak ↔ kaçırmak ↔ (süreyi) kaçırmak","s":"Ich habe den Bus verpasst, den Schlüssel verloren und den Termin vergessen.","st":"Otobüsü kaçırdım, anahtarı kaybettim ve randevuyu unuttum.","f":"die Frist versäumen (süreyi kaçırmak) · der Verlust (kayıp) · die Versäumnis (ihmal)"},{"w":"mögen ↔ gefallen ↔ lieben","t":"Beğeni fiilleri","k":"mögen (sevmek) / gefallen (hoşuna gitmek) / lieben (sevmek, âşık olmak)","c":"—","br":"Yapıları farklıdır: Ich mag den Film (özne benim) ↔ Der Film gefällt mir (özne film, ben Dativ). lieben ise güçlü ve genelde kişiler içindir; eşya için abartılı durur. Görünüş için gefallen, tat için schmecken kullanılır.","tr":"sevmek ↔ hoşuna gitmek ↔ âşık olmak","s":"Die Wohnung gefällt mir, aber die Lage mag ich nicht.","st":"Daire hoşuma gitti ama konumunu sevmedim.","f":"gern haben (sevmek) · schmecken (tadı hoşuna gitmek) · die Zuneigung (sevgi)"},{"w":"bekommen ↔ erhalten ↔ kriegen","t":"Alma fiilleri","k":"aynı anlam, üç dil düzeyi","c":"—","br":"Üçü de „almak“tır: kriegen günlük, bekommen nötr, erhalten resmîdir — yazışmada erhalten kullanılır: Ihr Schreiben habe ich erhalten. Hiçbiri İngilizce become (olmak) değildir; o werden’dir.","tr":"almak (günlük ↔ nötr ↔ resmî)","s":"Ihre Nachricht habe ich erhalten — die Unterlagen bekomme ich morgen.","st":"Mesajınızı aldım — belgeleri yarın alıyorum.","f":"erhalten (almak, resmî) · empfangen (teslim almak) · werden (olmak)"},{"w":"fragen ↔ bitten ↔ verlangen","t":"İsteme fiilleri","k":"fragen (sormak) / bitten um (rica etmek) / verlangen (talep etmek)","c":"—","br":"Şiddet sırası: fragen bilgi ister, bitten nazikçe rica eder (um + Akkusativ), verlangen ise hak ya da güçle talep eder. Yanlış seçim tonu bozar: müşteri bittet, alacaklı verlangt.","tr":"sormak ↔ rica etmek ↔ talep etmek","s":"Ich frage nur nach — ich bitte um eine kurze Rückmeldung.","st":"Sadece soruyorum — kısa bir geri bildirim rica ediyorum.","f":"die Bitte (rica) · die Forderung (talep) · nachfragen (tekrar sormak)"},{"w":"bleiben ↔ übrig bleiben","t":"Kalma çifti","k":"bleiben (kalmak) / übrig (artan) + bleiben","c":"bleibt – blieb – ist geblieben","br":"bleiben yer değiştirmemektir ve sein ile çekilir. übrig bleiben ise artmaktır: tüketildikten sonra kalan. Kalıp: Mir bleibt nichts anderes übrig — başka çarem kalmıyor.","tr":"kalmak ↔ artmak, geriye kalmak","s":"Vom Kuchen ist nichts übrig geblieben.","st":"Kekten hiçbir şey artmadı.","f":"übrig (artan) · der Rest (kalan) · verbleiben (geriye kalmak, resmî)"}]},{"n":"Refleksif fiiller","e":"sich beeilen, sich kümmern, sich weigern…","c":"#6f4a6a","g":"Kök aileleri","cards":[{"w":"sich beeilen","t":"Refleksiv fiil","k":"be + Eile (acele) + -en","c":"beeilt – beeilte – hat beeilt","br":"die Eile aceledir; be- onu fiile çevirir, sich ise eylemi öznenin kendisine döndürür: kendini acele ettirmek. Daima refleksiftir — refleksifsiz kullanılmaz.","tr":"acele etmek","s":"Beeil dich, der Bus kommt in drei Minuten!","st":"Acele et, otobüs üç dakikaya geliyor!","f":"die Eile (acele) · eilig (acele) · sich Zeit lassen (acele etmemek)"},{"w":"sich kümmern um (A)","t":"Refleksiv fiil","k":"Kummer (dert, tasa) kökünden","c":"kümmert – kümmerte – hat gekümmert","br":"der Kummer derttir: bir şeyi dert edinmek = onunla ilgilenmek, sorumluluğunu almak. Olumsuzu suçlama taşır: Er kümmert sich um nichts. Yakını sich sorgen um — o endişedir, bu ise ilgilenmedir.","tr":"…ile ilgilenmek, işini üstlenmek","s":"Ich kümmere mich um die Anmeldung, du um die Unterlagen.","st":"Kayıt işiyle ben ilgileneyim, belgelerle sen.","f":"der Kummer (dert) · sich sorgen um (endişelenmek) · zuständig (yetkili)"},{"w":"sich bewerben um (A)","t":"Refleksiv fiil","k":"be + werben (uğraşmak) + sich","c":"bewirbt – bewarb – hat beworben","br":"werben eskiden „elde etmek için uğraşmak“tı: kendini bir iş için ortaya koymak. Edat um’dur — bir hedefin etrafında çabalamak. İsim: die Bewerbung; kişi: der Bewerber.","tr":"…e başvurmak (iş için)","s":"Ich habe mich um eine Stelle an der Realschule beworben.","st":"Ortaokuldaki bir kadroya başvurdum.","f":"die Bewerbung (başvuru) · werben (reklam yapmak) · sich vorstellen (tanıtmak)"},{"w":"sich gewöhnen an (A)","t":"Refleksiv fiil","k":"Gewohnheit (alışkanlık) kökünden","c":"gewöhnt – gewöhnte – hat gewöhnt","br":"wohnen ile aynı köke bağlanır: bir yerde durmak, yerleşmek. Yani alışmak, bir şeyin içine yerleşmektir. Sıfatı gewohnt (alışılmış), ismi die Gewohnheit.","tr":"…e alışmak","s":"An das frühe Aufstehen gewöhnt man sich irgendwann.","st":"Erken kalkmaya insan bir noktada alışıyor.","f":"die Gewohnheit (alışkanlık) · gewohnt (alışılmış) · üblich (alışıldık)"},{"w":"sich entscheiden für (A)","t":"Refleksiv fiil","k":"ent + scheiden (ayırmak)","c":"entscheidet – entschied – hat entschieden","br":"Seçenekleri birbirinden ayırıp birini seçmek. Refleksif hâli kişinin kendi kararını anlatır; refleksifsiz hâli ise bir merciin kararıdır: Das Gericht entscheidet.","tr":"…i tercih etmeye karar vermek","s":"Wir haben uns für die kleinere Wohnung entschieden.","st":"Daha küçük daireye karar verdik.","f":"die Entscheidung (karar) · sich entschließen (karara varmak) · die Wahl (seçim)"},{"w":"sich interessieren für (A)","t":"Refleksiv fiil","k":"inter + esse (arada olan şey)","c":"interessiert – interessierte – hat interessiert","br":"Latince „arada olan“: ilgi. Dikkat — fiil für alır, sıfat ise an: sich interessieren für ↔ interessiert an. Aynı kök, iki farklı edat; en sık yapılan hatalardan.","tr":"…ile ilgilenmek","s":"Mein Sohn interessiert sich sehr für Technik.","st":"Oğlum tekniğe çok ilgi duyuyor.","f":"das Interesse (ilgi) · interessiert an (ilgili) · spannend (ilgi çekici)"},{"w":"sich verabreden mit (D)","t":"Refleksiv fiil","k":"ver + abreden (konuşup kararlaştırmak)","c":"verabredet – verabredete – hat verabredet","br":"reden konuşmaktır; ab- kararlaştırır, ver- karşılıklı hâle getirir: sözleşmek. İsim die Verabredung hem randevu hem sözleşilmiş buluşmadır — Termin resmî, Verabredung kişiseldir.","tr":"(biriyle) sözleşmek, buluşmaya söz vermek","s":"Ich bin mit Kolleginnen zum Essen verabredet.","st":"Meslektaşlarımla yemek için sözleştim.","f":"die Verabredung (randevu) · absagen (iptal etmek) · der Termin (resmî randevu)"},{"w":"sich bedanken für (A)","t":"Refleksiv fiil","k":"be + Dank (teşekkür) + sich","c":"bedankt – bedankte – hat bedankt","br":"danken Dativ alır (Ich danke dir), sich bedanken ise für ile gelir ve daha resmîdir: Ich möchte mich für Ihre Hilfe bedanken. İki yapı, aynı kök, farklı nezaket düzeyi.","tr":"…için teşekkür etmek","s":"Ich möchte mich für Ihre schnelle Antwort bedanken.","st":"Hızlı cevabınız için teşekkür etmek isterim.","f":"danken (teşekkür etmek) · der Dank (teşekkür) · dankbar (minnettar)"},{"w":"sich entschuldigen für (A)","t":"Refleksiv fiil","k":"ent + Schuld (kusur) + sich","c":"entschuldigt – entschuldigte – hat entschuldigt","br":"Kusuru kendi üzerinden kaldırmak. Yapı önemlidir: sich entschuldigen özür dilemektir, jemanden entschuldigen ise onu mazur görmektir — okulda velinin yaptığı işlem budur.","tr":"özür dilemek","s":"Ich möchte mich für die Verspätung entschuldigen.","st":"Gecikme için özür dilemek istiyorum.","f":"die Entschuldigung (özür; mazeret) · die Schuld (kusur) · verzeihen (affetmek)"},{"w":"sich weigern","t":"Refleksiv fiil","k":"weigern (reddetmek) — Waage/wägen kökü","c":"weigert – weigerte – hat geweigert","br":"Yapmayı açıkça reddetmek: ablehnen bir teklifi geri çevirir, sich weigern ise bir talebi yerine getirmeyi reddeder — daha güçlü ve daha çatışmalıdır. İsim: die Weigerung.","tr":"(yapmayı) reddetmek","s":"Er weigert sich, die Belege herauszugeben.","st":"Belgeleri vermeyi reddediyor.","f":"die Weigerung (ret) · ablehnen (reddetmek) · verweigern (esirgemek, reddetmek)"},{"w":"sich täuschen","t":"Refleksiv fiil","k":"täuschen (aldatmak) + sich","c":"täuscht – täuschte – hat getäuscht","br":"täuschen başkasını aldatmaktır; sich ile kişi kendini aldatır = yanılır. Kibar itiraf kalıbı: Da habe ich mich wohl getäuscht. Aynı kökten die Enttäuschung — yanılsamanın kalkması.","tr":"yanılmak","s":"Wenn ich mich nicht täusche, war das letzte Woche.","st":"Yanılmıyorsam bu geçen haftaydı.","f":"sich irren (yanılmak) · die Täuschung (yanılsama) · enttäuschen (hayal kırıklığına uğratmak)"},{"w":"sich beklagen über (A)","t":"Refleksiv fiil","k":"Klage (şikâyet) + sich","c":"beklagt – beklagte – hat beklagt","br":"sich beschweren resmî şikâyettir, bir mercie yapılır; sich beklagen ise yakınmadır, genelde günlük ve muhatapsızdır. Aynı kökten die Klage: hem yakınma hem dava.","tr":"yakınmak, sızlanmak","s":"Er beklagt sich ständig über die Lautstärke.","st":"Sürekli ses seviyesinden yakınıyor.","f":"sich beschweren (şikâyet etmek) · die Klage (şikâyet; dava) · meckern (mızmızlanmak)"},{"w":"sich anstrengen","t":"Refleksiv fiil","k":"an + strengen (streng: sıkı)","c":"strengt an – strengte an – hat angestrengt","br":"streng sıkı demektir: kendini sıkmak = çaba göstermek. Refleksifsiz hâli yorucu olmayı anlatır: Das strengt an. Sıfatı anstrengend (yorucu), ismi die Anstrengung.","tr":"çaba göstermek, kendini zorlamak","s":"Wenn du dich anstrengst, schaffst du das locker.","st":"Biraz çaba gösterirsen bunu rahat başarırsın.","f":"anstrengend (yorucu) · die Anstrengung (gayret) · sich Mühe geben (emek vermek)"},{"w":"sich lohnen ↔ sich rechnen","t":"Refleksiv çift","k":"Lohn (karşılık) / rechnen (hesaplamak)","c":"—","br":"sich lohnen genel değerdir (zahmete değer mi), sich rechnen ise parasal hesaptır (kâr çıkar mı). İşletme dilinde ikincisi tercih edilir: Die Investition rechnet sich nach fünf Jahren.","tr":"değmek ↔ (parasal olarak) kâra geçmek","s":"Die Anschaffung rechnet sich erst nach ein paar Jahren.","st":"Bu alım ancak birkaç yıl sonra kendini amorti eder.","f":"der Lohn (karşılık) · sich amortisieren (kendini ödemek) · der Aufwand (masraf)"}]},{"n":"Aynı fiil, iki vurgu","e":"übersetzen ↔ übersetzen: vurgu anlamı değiştirir","c":"#a1522f","g":"Kök aileleri","cards":[{"w":"übersetzen ↔ übersetzen","t":"Verb (çift)","k":"über + setzen","c":"übersetzt – übersetzte – hat übersetzt / setzt über – setzte über – hat übergesetzt","br":"Ayrılmayanda vurgu köke düşer (überSETZen) ve anlam soyuttur: bir metni öbür dile geçirmek = çevirmek. Ayrılanda vurgu ön ektedir (ÜBERsetzen) ve anlam somuttur: karşı kıyıya geçirmek. Kural geneldir: ayrılmayan = soyut, ayrılan = somut.","tr":"çevirmek (ayrılmaz)","s":"Kannst du mir den Satz kurz übersetzen?","st":"Bu cümleyi bana kısaca çevirebilir misin?","f":"die Übersetzung (çeviri) · der Übersetzer (çevirmen) · die Überfahrt (karşıya geçiş)","m":[{"tr":"karşı kıyıya geçirmek (ayrılan)","s":"Der Fährmann setzte uns ans andere Ufer über.","st":"Kayıkçı bizi karşı kıyıya geçirdi."}]},{"w":"umfahren ↔ umfahren","t":"Verb (çift)","k":"um + fahren","c":"umfährt – umfuhr – hat umfahren / fährt um – fuhr um – hat umgefahren","br":"Aynı harflerle iki zıt olay: ayrılmayan umFAHren = etrafından dolaşmak; ayrılan UMfahren = çarpıp devirmek. Konuşurken vurguyu kaçırırsan anlam tersine döner.","tr":"etrafından dolaşmak (ayrılmaz)","s":"Wir haben die Innenstadt großräumig umfahren.","st":"Şehir merkezini geniş bir yay çizerek dolandık.","f":"die Umfahrung (çevre yolu) · die Umgehungsstraße (çevre yolu) · anfahren (çarpmak)","m":[{"tr":"çarpıp devirmek (ayrılan)","s":"Er hat beim Rangieren einen Poller umgefahren.","st":"Manevra yaparken bir babayı devirdi."}]},{"w":"umstellen ↔ umstellen","t":"Verb (çift)","k":"um + stellen","c":"umstellt – umstellte – hat umstellt / stellt um – stellte um – hat umgestellt","br":"Ayrılmayan umSTELLen: etrafını sarmak (polis binayı sarar). Ayrılan UMstellen: yerini değiştirmek, sistemi değiştirmek. Somut/soyut kuralının tersi göründüğü ender bir çifttir — burada ayrılmayan olan kuşatmadır.","tr":"(sisteme) geçmek, yerini değiştirmek (ayrılan)","s":"Die Schule hat auf digitale Zeugnisse umgestellt.","st":"Okul dijital karneye geçti.","f":"die Umstellung (geçiş, değişim) · umziehen (taşınmak) · einstellen (ayarlamak)","m":[{"tr":"etrafını sarmak (ayrılmaz)","s":"Die Polizei hatte das Gebäude bereits umstellt.","st":"Polis binayı çoktan kuşatmıştı."}]},{"w":"unterstellen ↔ unterstellen","t":"Verb (çift)","k":"unter + stellen","c":"unterstellt – unterstellte – hat unterstellt / stellt unter – stellte unter – hat untergestellt","br":"Ayrılmayan: birine bir şeyi „altına koymak“ = ona yakıştırmak, isnat etmek; ayrıca birini birinin emrine vermek. Ayrılan: eşyayı bir yerin altına koymak.","tr":"isnat etmek, yakıştırmak; emrine vermek (ayrılmaz)","s":"Ich möchte niemandem böse Absicht unterstellen.","st":"Kimseye kötü niyet yakıştırmak istemiyorum.","f":"die Unterstellung (isnat) · unterstellt (tabi, bağlı) · unterordnen (alt sıraya koymak)","m":[{"tr":"altına koymak, barındırmak (ayrılan)","s":"Die Fahrräder können wir im Keller unterstellen.","st":"Bisikletleri bodrumda barındırabiliriz."}]},{"w":"wiederholen ↔ wiederholen","t":"Verb (çift)","k":"wieder + holen","c":"wiederholt – wiederholte – hat wiederholt / holt wieder – holte wieder – hat wiedergeholt","br":"Ayrılmayan wiederHOLen: tekrarlamak (soyut). Ayrılan WIEderholen: bir şeyi fiilen geri getirmek (somut, nadir). Somut/soyut kuralı burada tam işler.","tr":"tekrarlamak (ayrılmaz)","s":"Wir wiederholen den Stoff vor jeder Klausur.","st":"Her sınavdan önce konuyu tekrar ediyoruz.","f":"die Wiederholung (tekrar) · wiederholt (defalarca) · holen (getirmek)"},{"w":"übergehen ↔ übergehen","t":"Verb (çift)","k":"über + gehen","c":"übergeht – überging – hat übergangen / geht über – ging über – ist übergegangen","br":"Ayrılmayan überGEHen: birini atlamak, hiçe saymak. Ayrılan ÜBERgehen: bir durumdan öbürüne geçmek, mülkiyetin devrolması.","tr":"atlamak, görmezden gelmek (ayrılmaz)","s":"Bei der Beförderung hat man sie einfach übergangen.","st":"Terfide onu öylece atladılar.","f":"die Übergehung (atlama) · der Übergang (geçiş) · übergeben (teslim etmek)","m":[{"tr":"…e geçmek, devrolmak (ayrılan)","s":"Das Eigentum geht mit der Übergabe auf den Käufer über.","st":"Mülkiyet teslimle birlikte alıcıya geçer."}]},{"w":"umschreiben ↔ umschreiben","t":"Verb (çift)","k":"um + schreiben","c":"umschreibt – umschrieb – hat umschrieben / schreibt um – schrieb um – hat umgeschrieben","br":"Ayrılmayan umSCHREIBen: bir şeyin etrafında dolaşarak anlatmak = dolaylı tarif etmek. Ayrılan UMschreiben: metni yeniden yazmak, kaydı başkasının adına geçirmek.","tr":"dolaylı olarak tarif etmek (ayrılmaz)","s":"Er hat das Problem sehr vorsichtig umschrieben.","st":"Sorunu çok temkinli biçimde dolaylı anlattı.","f":"die Umschreibung (dolaylı anlatım; devir kaydı) · beschreiben (betimlemek) · umformulieren (yeniden ifade etmek)","m":[{"tr":"yeniden yazmak; adına geçirmek (ayrılan)","s":"Das Fahrzeug wurde auf meinen Namen umgeschrieben.","st":"Araç benim adıma geçirildi."}]},{"w":"übertreten ↔ übertreten","t":"Verb (çift)","k":"über + treten","c":"übertritt – übertrat – hat übertreten / tritt über – trat über – ist übergetreten","br":"Ayrılmayan überTREten: sınırın üstüne basmak = kuralı çiğnemek. Ayrılan ÜBERtreten: bir taraftan öbürüne geçmek (din, parti, okul değiştirmek).","tr":"(kuralı) ihlal etmek (ayrılmaz)","s":"Wer die Vorschrift übertritt, muss mit einem Bußgeld rechnen.","st":"Kuralı çiğneyen para cezasını hesaba katmalı.","f":"die Übertretung (ihlal) · der Übertritt (geçiş) · verstoßen gegen (ihlal etmek)"},{"w":"umreißen ↔ umreißen","t":"Verb (çift)","k":"um + reißen","c":"umreißt – umriss – hat umrissen / reißt um – riss um – hat umgerissen","br":"Ayrılmayan umREIßen: konunun etrafına çizgi çekmek = ana hatlarıyla anlatmak. Ayrılan UMreißen: çekip devirmek. Aynı kökten der Umriss: dış hat, silüet.","tr":"ana hatlarıyla anlatmak (ayrılmaz)","s":"Können Sie das Vorhaben kurz umreißen?","st":"Projeyi kısaca ana hatlarıyla anlatabilir misiniz?","f":"der Umriss (dış hat) · skizzieren (taslak çizmek) · einreißen (yırtmak, yıkmak)","m":[{"tr":"çekip devirmek (ayrılan)","s":"Der Sturm hat mehrere Bäume umgerissen.","st":"Fırtına birkaç ağacı devirdi."}]},{"w":"unterlaufen","t":"Verb + Dativ","k":"unter + laufen","c":"unterläuft – unterlief – ist unterlaufen","br":"Bir hatanın kişinin „altından geçip“ fark edilmeden olması. Kalıp daima böyledir: Mir ist ein Fehler unterlaufen — hata özne, kişi Dativ. Suçlamayı yumuşatan kibar yapı.","tr":"(hata) olmak, kaçmak","s":"Bei der Berechnung ist uns ein Fehler unterlaufen.","st":"Hesaplamada bir hata yapmışız.","f":"der Fehler (hata) · unterwandern (sızmak) · umgehen (dolanmak)"},{"w":"überziehen ↔ überz
