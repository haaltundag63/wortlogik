},{"w":"die Summe ↔ die Differenz","t":"Sonuç çifti","k":"summa (en üst) / differre (ayrı taşımak)","c":"die Summe, -n / die Differenz, -en","br":"Dört işlemin sonucu ayrı adlar taşır: Summe, Differenz, Produkt, Quotient. Sözel problemi çözerken hangi kelimenin geçtiği işlemi ele verir.","tr":"toplam ↔ fark","s":"Bilden Sie die Summe der beiden Zahlen und danach ihre Differenz.","st":"İki sayının toplamını, sonra farkını bulun.","f":"das Produkt (çarpım) · der Quotient (bölüm) · der Summand (toplanan)"},{"w":"die Gleichung lösen","t":"Kollokation","k":"Gleichung + lösen (çözmek)","c":"löst – löste – hat gelöst","br":"Denklem çözme dilinin fiilleri sırayla: umformen (dönüştürmek), einsetzen (yerine koymak), auflösen nach x (x’e göre çözmek), zusammenfassen (sadeleştirmek), die Probe machen (sağlama yapmak).","tr":"denklemi çözmek","s":"Setzen Sie die Lösung ein und machen Sie die Probe.","st":"Çözümü yerine koyun ve sağlamasını yapın.","f":"umformen (dönüştürmek) · einsetzen (yerine koymak) · die Lösungsmenge (çözüm kümesi)"},{"w":"der Winkel","t":"Nomen, -","k":"Winkel (köşe, açı)","c":"der Winkel, -","br":"Açı türleri şeffaf bileşiklerdir: der rechte Winkel (dik açı, 90°), spitzer Winkel (dar), stumpfer Winkel (geniş). Ölçüm aleti: der Winkelmesser.","tr":"açı","s":"Der Winkel beträgt genau 90 Grad.","st":"Açı tam 90 derece.","f":"rechtwinklig (dik açılı) · der Grad (derece) · der Scheitelpunkt (tepe noktası)"},{"w":"die Gerade ↔ die Strecke","t":"Geometri çifti","k":"gerade (düz) / Strecke (uzanan parça)","c":"die Gerade, -n / die Strecke, -n","br":"Gerade iki yöne de sonsuz uzanır; Strecke iki nokta arasında sınırlıdır; der Strahl ise bir yöne sonsuzdur. Üç kelime, üç ayrı nesne.","tr":"doğru ↔ doğru parçası","s":"Zeichnen Sie eine Strecke von A nach B und verlängern Sie sie zur Geraden.","st":"A’dan B’ye bir doğru parçası çizin ve onu doğruya uzatın.","f":"der Strahl (ışın) · der Punkt (nokta) · verlängern (uzatmak)"},{"w":"senkrecht ↔ parallel","t":"Konum çifti","k":"senkrecht (dik) / parallel (koşut)","c":"—","br":"senkrecht dik açı yapar (zu + Dativ), parallel yan yana ve hiç kesişmez. Ayrıca waagerecht: yatay. Üçü birlikte koordinat dilini kurar.","tr":"dik ↔ paralel","s":"Die Geraden verlaufen parallel, die Achse steht senkrecht dazu.","st":"Doğrular paralel gidiyor, eksen ise onlara dik duruyor.","f":"waagerecht (yatay) · die Achse (eksen) · schneiden (kesişmek)"},{"w":"das Dreieck / das Viereck","t":"Şekil ailesi","k":"drei/vier + Eck (köşe)","c":"das Dreieck, -e","br":"Şekiller köşe sayısıyla adlandırılır: Dreieck, Viereck, Fünfeck, Sechseck. Özel hâlleri ayrı isim alır: das Quadrat (kare), das Rechteck (dikdörtgen).","tr":"üçgen / dörtgen","s":"Zeichnen Sie ein rechtwinkliges Dreieck.","st":"Bir dik üçgen çizin.","f":"das Quadrat (kare) · das Rechteck (dikdörtgen) · die Ecke (köşe)"},{"w":"der Kreis ↔ der Radius","t":"Daire ailesi","k":"Kreis (daire) / radius (yarıçap)","c":"der Kreis, -e","br":"Daire dili: der Radius (yarıçap), der Durchmesser (çap — „boydan boya ölçen“), der Umfang (çevre), der Mittelpunkt (merkez).","tr":"daire ↔ yarıçap","s":"Der Durchmesser ist doppelt so groß wie der Radius.","st":"Çap yarıçapın iki katıdır.","f":"der Durchmesser (çap) · der Umfang (çevre) · der Mittelpunkt (merkez)"},{"w":"die Fläche ↔ das Volumen","t":"Ölçü çifti","k":"flach (düz) / volumen (hacim)","c":"die Fläche, -n / das Volumen, Volumina","br":"İki boyut alan, üç boyut hacimdir. Almanca alan için ayrıca der Flächeninhalt, hacim için der Rauminhalt kullanır — „içerik“ mantığı.","tr":"alan ↔ hacim","s":"Berechnen Sie zuerst die Fläche, dann das Volumen.","st":"Önce alanı, sonra hacmi hesaplayın.","f":"der Flächeninhalt (alan) · der Rauminhalt (hacim) · der Quadratmeter (metrekare)"},{"w":"die Achse ↔ die Koordinate","t":"Koordinat sistemi","k":"Achse (eksen) / Koordinate","c":"die Achse, -n","br":"x-Achse yatay, y-Achse dikeydir; kesişimleri der Ursprung (orijin). Nokta gösterimi: P(3|5) — Almanca dikey çizgi kullanır, virgül değil.","tr":"eksen ↔ koordinat","s":"Der Punkt P(3|5) liegt oberhalb der x-Achse.","st":"P(3|5) noktası x ekseninin üstünde.","f":"der Ursprung (orijin) · das Koordinatensystem (koordinat sistemi) · abtragen (işaretlemek)"},{"w":"der Graph ↔ die Funktion","t":"Analiz çifti","k":"graphein (yazmak, çizmek) / functio (işlev)","c":"der Graph, -en / die Funktion, -en","br":"Fonksiyon kuraldır, grafik onun çizimidir. Fiiller: eine Funktion aufstellen (kurmak), den Graphen zeichnen, einen Wert ablesen.","tr":"grafik ↔ fonksiyon","s":"Der Graph der Funktion schneidet die x-Achse bei x = 2.","st":"Fonksiyonun grafiği x eksenini x = 2’de kesiyor.","f":"die Steigung (eğim) · der Schnittpunkt (kesişim noktası) · ablesen (okumak)"},{"w":"runden ↔ schätzen","t":"Yaklaşıklık çifti","k":"rund (yuvarlak) / schätzen (tahmin etmek)","c":"—","br":"runden kurala göre yuvarlamaktır (auf zwei Stellen runden), schätzen ise hesaplamadan tahmindir. Sınav yönergesinde ikisi ayrı iş ister.","tr":"yuvarlamak ↔ tahmin etmek","s":"Runden Sie das Ergebnis auf zwei Stellen nach dem Komma.","st":"Sonucu virgülden sonra iki basamağa yuvarlayın.","f":"die Stelle (basamak) · das Komma (virgül) · ungefähr (yaklaşık)"},{"w":"der Term umformen","t":"Kollokation","k":"um + formen (biçim vermek)","c":"formt um – formte um – hat umgeformt","br":"İfadenin değerini değiştirmeden biçimini değiştirmek. Alt işlemler: ausmultiplizieren (dağıtmak), ausklammern (parantez dışına almak), kürzen (sadeleştirmek).","tr":"ifadeyi dönüştürmek, düzenlemek","s":"Formen Sie den Term so um, dass x allein steht.","st":"İfadeyi x yalnız kalacak şekilde düzenleyin.","f":"ausklammern (parantezine almak) · kürzen (sadeleştirmek) · gleichwertig (eşdeğer)"}]},{"n":"Akademik yazı fiilleri","e":"erörtern, darlegen, belegen, abwägen…","c":"#3b6e5a","g":"Okul & öğretim dili","cards":[{"w":"erörtern","t":"Verb","k":"er + Ort (yer) + -ern","c":"erörtert – erörterte – hat erörtert","br":"Kök der Ort (yer); er- sonuca ulaşmayı bildirir. Yani bir konuyu her „yerinden“ dolaşıp bitirmek = enine boyuna tartışmak. İsim die Erörterung, Almanca kompozisyon türünün adıdır ve yapısı da bu kelimeden çıkar: her yönü gez, sonra karar ver.","tr":"enine boyuna tartışmak","s":"Im Aufsatz sind Vor- und Nachteile zu erörtern.","st":"Kompozisyonda artılar ve eksiler tartışılacak.","f":"die Erörterung (tartışma yazısı) · der Ort (yer) · diskutieren (tartışmak)"},{"w":"darlegen","t":"Verb","k":"dar (ortaya) + legen (koymak)","c":"legt dar – legte dar – hat dargelegt","br":"Bir düşünceyi açıkça ortaya sermek = ayrıntılı açıklamak. Resmî yazının fiili: Ich lege Ihnen den Sachverhalt dar.","tr":"ortaya koymak, açıklamak","s":"Der Anwalt hat die Rechtslage ausführlich dargelegt.","st":"Avukat hukuki durumu ayrıntılı biçimde ortaya koydu.","f":"die Darlegung (açıklama) · darstellen (betimlemek) · legen (koymak)"},{"w":"belegen","t":"Verb","k":"be + legen (koymak)","c":"belegt – belegte – hat belegt","br":"Bir iddianın altına belge koymak = kanıtlamak. Ayrıca: yer tutmak, ders almak (einen Kurs belegen) — hepsi „bir şeyi bir yere koymak“tan.","tr":"belgelemek, kanıtlamak","s":"Diese Behauptung ist durch nichts belegt.","st":"Bu iddia hiçbir şeyle belgelenmiş değil.","f":"der Beleg (belge) · belegbar (belgelenebilir) · unbelegt (dayanaksız)","m":[{"tr":"(ders, yer) almak, tutmak","s":"Im dritten Semester habe ich zwei Seminare belegt.","st":"Üçüncü dönemde iki seminer aldım."}]},{"w":"widerlegen","t":"Verb","k":"wider (karşı) + legen (koymak)","c":"widerlegt – widerlegte – hat widerlegt","br":"Karşı tarafın iddiasının karşısına kanıt koymak = çürütmek. belegen ile tam bir çift: biri altına koyar, diğeri karşısına.","tr":"çürütmek","s":"Diese These lässt sich mit den vorliegenden Daten widerlegen.","st":"Bu tez eldeki verilerle çürütülebilir.","f":"belegen (kanıtlamak) · unwiderlegbar (çürütülemez) · der Widerspruch (çelişki)"},{"w":"gliedern","t":"Verb","k":"Glied (uzuv, halka) + -ern","c":"gliedert – gliederte – hat gegliedert","br":"Glied = uzuv, zincir halkası. Metni halkalara ayırmak = yapılandırmak. İsim: die Gliederung — kompozisyonun planı.","tr":"bölümlere ayırmak, yapılandırmak","s":"Der Aufsatz ist klar in drei Teile gegliedert.","st":"Kompozisyon net biçimde üç bölüme ayrılmış.","f":"die Gliederung (plan, yapı) · das Glied (uzuv, halka) · untergliedern (alt bölümlere ayırmak)"},{"w":"abwägen","t":"Verb","k":"ab + wägen (tartmak)","c":"wägt ab – wog ab – hat abgewogen","br":"İki tarafı teraziye koyup tartmak = karşılaştırıp ölçmek. Hukukta temel işlem: Interessenabwägung, çıkarların tartılması.","tr":"tartmak, karşılaştırarak değerlendirmek","s":"Man muss Nutzen und Risiko sorgfältig gegeneinander abwägen.","st":"Fayda ile riski özenle birbirine karşı tartmak gerekir.","f":"die Abwägung (tartma, değerlendirme) · das Gewicht (ağırlık) · abgewogen (ölçülü)"},{"w":"hinterfragen","t":"Verb","k":"hinter (arkasına) + fragen (sormak)","c":"hinterfragt – hinterfragte – hat hinterfragt","br":"Söylenenin arkasına geçip sormak = sorgulamak, altındaki varsayımı açmak. Eleştirel düşünmenin fiili.","tr":"sorgulamak, arkasını irdelemek","s":"Solche Zahlen sollte man immer kritisch hinterfragen.","st":"Bu tür rakamlar her zaman eleştirel biçimde sorgulanmalı.","f":"kritisch (eleştirel) · die Annahme (varsayım) · fragen (sormak)"},{"w":"einordnen","t":"Verb","k":"ein + ordnen (düzenlemek)","c":"ordnet ein – ordnete ein – hat eingeordnet","br":"Bir olguyu düzenin içine yerleştirmek = bağlamına oturtmak, sınıflandırmak.","tr":"bağlamına oturtmak, sınıflandırmak","s":"Dieses Ereignis muss historisch eingeordnet werden.","st":"Bu olay tarihsel bağlamına oturtulmalı.","f":"die Einordnung (sınıflandırma) · die Ordnung (düzen) · zuordnen (eşleştirmek)"},{"w":"gegenüberstellen","t":"Verb","k":"gegenüber (karşı karşıya) + stellen","c":"stellt gegenüber – stellte gegenüber – hat gegenübergestellt","br":"İki şeyi karşı karşıya koymak = yan yana karşılaştırmak. Kompozisyonda tezle antitezi buluşturan hareket.","tr":"karşı karşıya koymak, karşılaştırmak","s":"Im zweiten Teil werden beide Positionen gegenübergestellt.","st":"İkinci bölümde iki görüş karşı karşıya konuyor.","f":"die Gegenüberstellung (karşılaştırma) · gegenüber (karşısında) · vergleichen (karşılaştırmak)"},{"w":"verdeutlichen","t":"Verb","k":"ver + deutlich (net) + -en","c":"verdeutlicht – verdeutlichte – hat verdeutlicht","br":"ver- + sıfat kalıbı: net hâle getirmek. deutlich kökü deuten (işaret etmek, yorumlamak) ile akrabadır.","tr":"netleştirmek, açıkça göstermek","s":"Das Beispiel verdeutlicht den Unterschied sehr gut.","st":"Örnek farkı çok iyi netleştiriyor.","f":"deutlich (net) · deuten (yorumlamak) · veranschaulichen (somutlaştırmak)"},{"w":"schlussfolgern","t":"Verb","k":"Schluss (son) + folgern (sonuç çıkarmak)","c":"schlussfolgert – schlussfolgerte – hat geschlussfolgert","br":"Öncüllerden zorunlu olarak çıkanı söylemek. Matematikteki „o hâlde“ ile aynı işlem; isim: die Schlussfolgerung.","tr":"sonuç çıkarmak, çıkarımda bulunmak","s":"Daraus lässt sich schlussfolgern, dass er es wusste.","st":"Bundan bunu bildiği sonucu çıkarılabilir.","f":"die Schlussfolgerung (çıkarım) · folgern (sonuç çıkarmak) · folglich (dolayısıyla)"},{"w":"würdigen","t":"Verb","k":"Würde (değer, onur) + -igen","c":"würdigt – würdigte – hat gewürdigt","br":"Bir şeye hak ettiği değeri vermek: takdir etmek; hukukta ise delilleri değerlendirmek (Beweiswürdigung).","tr":"takdir etmek; (delili) değerlendirmek","s":"Seine Arbeit wird viel zu selten gewürdigt.","st":"Emeği çok az takdir ediliyor.","f":"die Würde (onur) · die Beweiswürdigung (delil değerlendirmesi) · anerkennen (takdir etmek)"},{"w":"relativieren","t":"Verb","k":"relativ (göreli) + -ieren","c":"relativiert – relativierte – hat relativiert","br":"Bir ifadeyi mutlak olmaktan çıkarıp bağlama bağlamak = görelileştirmek, sertliğini almak. Tartışmada hem dürüstlük hem geri çekilme aracı olabilir.","tr":"görelileştirmek, yumuşatmak","s":"Diese Aussage muss man angesichts der Datenlage relativieren.","st":"Bu ifadeyi veri durumu karşısında görelileştirmek gerekir.","f":"relativ (göreli) · einschränken (sınırlamak) · absolut (mutlak)"},{"w":"veranlassen","t":"Verb","k":"ver + an + lassen","c":"veranlasst – veranlasste – hat veranlasst","br":"Bir işi harekete geçirip yaptırmak. Kişi kendi yapmaz, yapılmasını sağlar — resmî dilde bu ayrım önemlidir.","tr":"yapılmasını sağlamak, başlatmak","s":"Wir haben eine erneute Prüfung veranlasst.","st":"Yeniden bir inceleme yapılmasını sağladık.","f":"die Veranlassung (harekete geçirme) · der Anlass (vesile) · anordnen (emretmek)"}]},{"n":"Medya ve tartışma dili","e":"Debatte, Quelle, Standpunkt, Glaubwürdigkeit…","c":"#7f4f24","g":"Okul & öğretim dili","cards":[{"w":"die Debatte","t":"Nomen, -n","k":"de (aşağı) + battuere (vurmak, dövmek)","c":"die Debatte, die Debatten","br":"Latince „karşılıklı vurmak“: argümanların birbirine çarptığı tartışma. Diskussion daha nötr, Debatte daha çekişmelidir.","tr":"tartışma, müzakere","s":"Die Debatte über die Schulzeiten dauert seit Jahren an.","st":"Okul saatleri tartışması yıllardır sürüyor.","f":"debattieren (tartışmak) · die Diskussion (tartışma) · umstritten (tartışmalı)"},{"w":"die Schlagzeile","t":"Nomen, -n","k":"schlagen (vurmak) + Zeile (satır)","c":"die Schlagzeile, -n","br":"Göze vuran satır = manşet. Kalıp: Schlagzeilen machen — gündeme oturmak.","tr":"manşet","s":"Der Fall hat wochenlang Schlagzeilen gemacht.","st":"Olay haftalarca manşetlere taşındı.","f":"die Zeile (satır) · schlagen (vurmak) · die Überschrift (başlık)"},{"w":"die Meldung","t":"Nomen, -en","k":"melden (bildirmek) + -ung","c":"die Meldung, die Meldungen","br":"Bildirilen şey = haber; idarede: bildirim. Aynı kökten die Anmeldung (kayıt), die Abmeldung (kaydı silme), die Rückmeldung (geri bildirim).","tr":"haber; bildirim","s":"Die Meldung stand heute Morgen in allen Nachrichten.","st":"Haber bu sabah bütün bültenlerdeydi.","f":"melden (bildirmek) · die Anmeldung (kayıt) · die Abmeldung (kayıt silme)"},{"w":"der Bericht","t":"Nomen, -e","k":"be + richten (yöneltmek, düzeltmek)","c":"der Bericht, die Berichte","br":"berichten = olayı doğru yöne çevirerek aktarmak. Yorumsuz aktarım = haber metni; Kommentar ise görüştür. Gazetecilikte bu ayrım esastır.","tr":"rapor, haber metni","s":"Der Bericht enthält keine Bewertung, nur Fakten.","st":"Rapor değerlendirme içermiyor, yalnızca olgular.","f":"berichten (haber vermek) · der Kommentar (yorum) · richten (yöneltmek)"},{"w":"der Kommentar","t":"Nomen, -e","k":"commentari (üzerinde düşünmek)","c":"der Kommentar, die Kommentare","br":"Latince commentari: bir şey üzerinde etraflıca düşünmek. Yani olguya eklenen düşünce. Bu yüzden gazetede haber (der Bericht) ile yorum kesin biçimde ayrılır. Hukukta ise aynı kelime yasa şerhidir: maddeye eklenen açıklama.","tr":"yorum; (hukukta) şerh","s":"Im Kommentar vertritt die Zeitung eine klare Position.","st":"Yorumda gazete net bir tavır alıyor.","f":"kommentieren (yorumlamak) · kommentarlos (yorumsuz) · der Bericht (haber metni)"},{"w":"die Öffentlichkeit","t":"Nomen (çoğulsuz)","k":"offen (açık) + -lich + -keit","c":"die Öffentlichkeit","br":"„Açıklık hâli“ = kamu, kamuoyu. Herkese açık olan alan. Kalıp: an die Öffentlichkeit gehen — kamuoyuna açıklamak.","tr":"kamuoyu, kamusal alan","s":"Er meidet die Öffentlichkeit, wo er nur kann.","st":"Elinden geldiğince kamuoyundan uzak duruyor.","f":"öffentlich (kamusal, açık) · offen (açık) · die Öffentlichkeitsarbeit (halkla ilişkiler)"},{"w":"die Quelle","t":"Nomen, -n","k":"quellen (kaynayıp çıkmak)","c":"die Quelle, die Quellen","br":"Suyun yerden çıktığı yer = pınar. Bilginin çıktığı yer = kaynak. Türkçe „kaynak“ ile birebir aynı imge.","tr":"kaynak; pınar","s":"Die Behauptung stützt sich auf eine einzige Quelle.","st":"İddia tek bir kaynağa dayanıyor.","f":"quellen (kaynamak) · die Quellenangabe (kaynak gösterme) · zuverlässig (güvenilir)"},{"w":"die Recherche","t":"Nomen, -n","k":"Fransızca rechercher: yeniden aramak","c":"die Recherche, die Recherchen","br":"Tekrar tekrar arayarak bilgiyi doğrulama = araştırma. Almanca eşdeğeri die Nachforschung: nach + forschen.","tr":"araştırma (gazetecilik)","s":"Für den Artikel war eine lange Recherche nötig.","st":"Yazı için uzun bir araştırma gerekti.","f":"recherchieren (araştırmak) · die Nachforschung (soruşturma) · nachweisen (kanıtlamak)"},{"w":"der Standpunkt","t":"Nomen, -e","k":"Stand (duruş) + Punkt (nokta)","c":"der Standpunkt, die Standpunkte","br":"Kişinin durduğu nokta = bakış açısı, tavır. Kalıp: einen Standpunkt vertreten — bir görüşü savunmak.","tr":"görüş, tavır, duruş","s":"Ich teile diesen Standpunkt ausdrücklich nicht.","st":"Bu görüşü açıkça paylaşmıyorum.","f":"vertreten (savunmak, temsil etmek) · die Position (duruş) · Stellung beziehen (tavır almak)"},{"w":"die Aussage","t":"Nomen, -n","k":"aus + sagen (söylemek)","c":"die Aussage, die Aussagen","br":"Dışa söylenen şey: bir cümlenin ilettiği önerme; mahkemede: ifade, tanıklık.","tr":"ifade, beyan; söylenen önerme","s":"Die Aussagen der beiden Zeugen widersprechen sich.","st":"İki tanığın ifadeleri birbiriyle çelişiyor.","f":"aussagen (ifade vermek) · aussagekräftig (anlamlı, açıklayıcı) · die Zeugenaussage (tanık ifadesi)"},{"w":"der Sachverhalt","t":"Nomen, -e","k":"Sache (şey, mesele) + Verhalt (halten: durum)","c":"der Sachverhalt, die Sachverhalte","br":"Meselenin nasıl durduğu = olgusal durum. Hukuk ve idarenin anahtar kelimesi: önce Sachverhalt tespit edilir, sonra hukuk uygulanır.","tr":"olay, maddi vaka, durumun özü","s":"Zunächst muss der Sachverhalt vollständig geklärt werden.","st":"Önce olayın tamamen açıklığa kavuşması gerekiyor.","f":"die Sache (mesele) · sachlich (nesnel) · der Tatbestand (yasal unsurlar)"},{"w":"das Vorurteil","t":"Nomen, -e","k":"vor (önce) + Urteil (hüküm)","c":"das Vorurteil, die Vorurteile","br":"İncelemeden önce verilmiş hüküm = önyargı. Kelimenin içinde tanımı yazılı: „ön-yargı“ ile birebir aynı yapı.","tr":"önyargı","s":"Solche Vorurteile halten sich hartnäckig.","st":"Bu tür önyargılar inatla sürüyor.","f":"das Urteil (hüküm) · vorurteilsfrei (önyargısız) · beurteilen (değerlendirmek)"},{"w":"die Glaubwürdigkeit","t":"Nomen (çoğulsuz)","k":"Glaube (inanç) + würdig (layık) + -keit","c":"die Glaubwürdigkeit","br":"„İnanılmaya layık olma hâli“. -würdig eki bir şeyin neye layık olduğunu söyler: sehenswürdig (görülmeye değer), fragwürdig (soru sorulmayı hak eden, yani şüpheli).","tr":"inandırıcılık, güvenilirlik","s":"Die Glaubwürdigkeit der Angaben steht infrage.","st":"Beyanların inandırıcılığı sorgulanıyor.","f":"glaubwürdig (inandırıcı) · fragwürdig (şüpheli) · die Sehenswürdigkeit (görülmeye değer yer)"},{"w":"die Meinungsfreiheit","t":"Nomen (çoğulsuz)","k":"Meinung + s + Freiheit","c":"die Meinungsfreiheit","br":"Fugen-s kuralı yine iş başında (-ung → -s). Anayasal hak: görüşü serbestçe ifade etme. Sınırı başkasının onurudur.","tr":"ifade özgürlüğü","s":"Die Meinungsfreiheit endet dort, wo die Würde anderer verletzt wird.","st":"İfade özgürlüğü, başkasının onuru zedelendiği yerde biter.","f":"die Meinung (görüş) · die Freiheit (özgürlük) · die Würde (onur)"}]},{"n":"Latin kökler: spec · duc · ferre · pon","e":"akademik Almancanın gizli iskeleti","c":"#2a5d9c","g":"Latin & Yunan kökleri","cards":[{"w":"der Aspekt","t":"Nomen, -e","k":"ad (…e doğru) + spectare (bakmak)","c":"der Aspekt, die Aspekte","br":"spec- kökü „bakmak“ demektir. Bir şeye yöneltilen bakış = bakış açısı, yön. Bu kökü tanıyınca Perspektive, Inspektion, Respekt, Spekulation hepsi çözülür.","tr":"yön, bakış açısı, husus","s":"Unter diesem Aspekt sieht die Sache völlig anders aus.","st":"Bu açıdan bakılınca mesele bambaşka görünüyor.","f":"die Perspektive (bakış açısı) · der Respekt (saygı) · die Inspektion (denetim) · das Spektrum (yelpaze)"},{"w":"die Perspektive","t":"Nomen, -n","k":"per (içinden) + spec (bakmak)","c":"die Perspektive, die Perspektiven","br":"Bir şeyin içinden geçerek bakmak = bakış açısı; geleceğe bakınca: fırsat, ufuk.","tr":"bakış açısı; gelecek beklentisi","s":"Aus der Perspektive der Mieter stellt sich das anders dar.","st":"Kiracıların bakış açısından bu farklı görünüyor.","f":"der Aspekt (yön, bakış açısı) · perspektivisch (perspektif açısından) · die Zukunftsperspektive (gelecek perspektifi)"},{"w":"respektieren","t":"Verb","k":"re (geri) + spec (bakmak)","c":"respektiert – respektierte – hat respektiert","br":"Birine dönüp yeniden bakmak = onu dikkate almak = saygı göstermek. Almanca karşılığı achten aynı mantığı taşır: dikkat etmek → saygı duymak.","tr":"saygı duymak; (kurala) uymak","s":"Diese Grenze müssen alle Beteiligten respektieren.","st":"Bu sınıra tüm taraflar saygı göstermelidir.","f":"der Respekt (saygı) · respektvoll (saygılı) · achten (saygı duymak) · die Achtung (saygı; dikkat)"},{"w":"die Inspektion","t":"Nomen, -en","k":"in (içine) + spec (bakmak) + -tion","c":"die Inspektion, die Inspektionen","br":"İçine bakmak = denetim. -tion eki Latince fiilden daima dişil isim üretir: Inspektion, Reduktion, Produktion.","tr":"denetim, muayene","s":"Die jährliche Inspektion der Heizungsanlage ist umlagefähig.","st":"Kalorifer tesisatının yıllık bakımı kiracıya yansıtılabilir.","f":"inspizieren (denetlemek) · der Inspektor (müfettiş) · die Aufsicht (denetim, Almanca karşılığı)"},{"w":"produzieren","t":"Verb","k":"pro (öne) + ducere (götürmek)","c":"produziert – produzierte – hat produziert","br":"duc- kökü „götürmek, sevk etmek“. Öne götürmek = ortaya çıkarmak = üretmek. Almanca eşdeğeri herstellen (buraya koymak) aynı mantıkta.","tr":"üretmek","s":"Das Werk produziert seit Mai wieder auf Vollauslastung.","st":"Fabrika mayıstan beri yeniden tam kapasiteyle üretiyor.","f":"die Produktion (üretim) · das Produkt (ürün) · der Produzent (üretici) · herstellen (üretmek)"},{"w":"reduzieren","t":"Verb + auf (A)","k":"re (geri) + ducere (götürmek)","c":"reduziert – reduzierte – hat reduziert","br":"Geri götürmek = azaltmak, bir şeye indirgemek. Aynı kök: Reduktion, aber auch „Konduktor“.","tr":"azaltmak, indirgemek","s":"Die Kosten ließen sich um rund 15 Prozent reduzieren.","st":"Masraflar yaklaşık yüzde 15 azaltılabildi.","f":"die Reduzierung (azaltma) · die Reduktion (azaltma) · verringern (Almanca eşdeğeri)"},{"w":"die Konferenz","t":"Nomen, -en","k":"con (birlikte) + ferre (taşımak)","c":"die Konferenz, die Konferenzen","br":"ferre = taşımak. Herkesin fikrini birlikte ortaya taşıması = toplantı. Okul dilinde Lehrerkonferenz, Zeugniskonferenz.","tr":"toplantı, konferans","s":"Die Zeugniskonferenz findet am letzten Schultag statt.","st":"Karne toplantısı okulun son gününde yapılıyor.","f":"die Differenz (fark) · der Transfer (aktarım) · referieren (sunum yapmak) · die Referenz (referans)"},{"w":"die Differenz","t":"Nomen, -en","k":"dis (ayrı) + ferre (taşımak)","c":"die Differenz, die Differenzen","br":"Ayrı yönlere taşımak = ayrışma = fark. Matematikte çıkarma sonucu, kişilerde anlaşmazlık.","tr":"fark; anlaşmazlık","s":"Die Differenz zwischen Vorauszahlung und Endabrechnung beträgt 212 Euro.","st":"Peşin ödeme ile son hesap arasındaki fark 212 avro.","f":"differenzieren (ayrım yapmak) · der Unterschied (Almanca eşdeğeri) · differenziert (ayrıntılı, nüanslı)"},{"w":"transferieren","t":"Verb","k":"trans (öteye) + ferre (taşımak)","c":"transferiert – transferierte – hat transferiert","br":"Öteye taşımak. Almanca karşılığı übertragen birebir aynı yapıda: über + tragen.","tr":"aktarmak, transfer etmek","s":"Die Daten werden verschlüsselt transferiert.","st":"Veriler şifrelenmiş olarak aktarılıyor.","f":"der Transfer (aktarım) · übertragen (aktarmak; yayınlamak) · die Übertragung (aktarım; yayın)"},{"w":"referieren","t":"Verb + über (A)","k":"re (geri) + ferre (taşımak)","c":"referiert – referierte – hat referiert","br":"Bilgiyi alıp geri, dinleyiciye taşımak = sunum yapmak. Aynı kökten: Referat (sunum), Referenz (referans).","tr":"sunum yapmak, aktarmak","s":"Sie hat über die Ergebnisse der Studie referiert.","st":"Çalışmanın sonuçları üzerine sunum yaptı.","f":"das Referat (sunum) · der Referent (sunum yapan; uzman) · die Referenz (referans)"},{"w":"die Position","t":"Nomen, -en","k":"pon/posit (koymak) + -ion","c":"die Position, die Positionen","br":"pon- kökü „koymak“. Konulmuş yer = konum, duruş; hesaplarda: kalem. Almanca eşdeğeri stellen kökünden Stellung.","tr":"konum, duruş; (hesapta) kalem","s":"Auf dem Kassenzettel stehen drei Positionen, die ich nicht kenne.","st":"Fişte tanımadığım üç kalem var.","f":"positionieren (konumlandırmak) · die Stellung (konum, mevki) · die Komposition (bileşim, beste)","m":[{"tr":"duruş, tutum","s":"Er hat seine Position in der Debatte klar dargelegt.","st":"Tartışmadaki duruşunu net biçimde ortaya koydu."}]},{"w":"die Komponente","t":"Nomen, -n","k":"con (birlikte) + ponere (koymak)","c":"die Komponente, die Komponenten","br":"Birlikte konulmuş parça = bileşen. Almanca eşdeğeri Bestandteil (be+stehen+Teil) aynı fikri kurar.","tr":"bileşen, unsur","s":"Die menschliche Komponente ist bei so etwas entscheidend.","st":"Böyle bir şeyde insani bileşen belirleyicidir.","f":"komponieren (bestelemek, kurmak) · die Komposition (bileşim, beste) · der Bestandteil (bileşen)"},{"w":"disponieren","t":"Verb + über (A)","k":"dis (ayrı ayrı) + ponere (koymak)","c":"disponiert – disponierte – hat disponiert","br":"Her şeyi ayrı ayrı yerine koymak = planlamak, tasarrufta bulunmak. Almanca eşdeğeri: verfügen über.","tr":"planlamak, tasarrufta bulunmak","s":"Über diesen Betrag können Sie frei disponieren.","st":"Bu tutar üzerinde serbestçe tasarrufta bulunabilirsiniz.","f":"die Disposition (planlama, tasarruf) · disponibel (tasarruf edilebilir) · verfügen über (…e sahip olmak)"},{"w":"exponiert","t":"Adjektiv (Partizip)","k":"ex (dışarı) + ponere (koymak)","c":"—","br":"Dışarı konulmuş = açıkta, korumasız, göz önünde. Aynı kökten Export: dışarı taşınan.","tr":"açıkta, göz önünde, korunmasız","s":"In dieser Funktion ist er politisch stark exponiert.","st":"Bu görevde siyaseten fazlasıyla göz önünde.","f":"exponieren (açığa çıkarmak) · die Exposition (sergileme, maruz kalma) · der Export (ihracat)"}]},{"n":"Latin kökler: struct · vert · cap · ject","e":"tek kök, onlarca C1–C2 kelimesi","c":"#8c5a1f","g":"Latin & Yunan kökleri","cards":[{"w":"die Struktur","t":"Nomen, -en","k":"struere (üst üste koymak, inşa etmek)","c":"die Struktur, die Strukturen","br":"struct- kökü „inşa“ demektir. Kurulmuş düzen = yapı. Bu kökü tanıyınca konstruieren, Instruktion, Infrastruktur, destruktiv hepsi açılır.","tr":"yapı, düzen","s":"Der Text hat eine klare argumentative Struktur.","st":"Metnin net bir argüman yapısı var.","f":"strukturieren (yapılandırmak) · strukturell (yapısal) · der Aufbau (Almanca eşdeğeri)"},{"w":"konstruieren","t":"Verb","k":"con (birlikte) + struere (kurmak)","c":"konstruiert – konstruierte – hat konstruiert","br":"Parçaları birlikte kurmak = tasarlamak. Olumsuz kullanımı: yapay biçimde kurgulamak.","tr":"tasarlamak, kurmak; kurgulamak","s":"Dieser Zusammenhang wirkt konstruiert.","st":"Bu bağlantı kurgulanmış duruyor.","f":"die Konstruktion (yapı, kurgu) · konstruktiv (yapıcı) · destruktiv (yıkıcı)"},{"w":"die Instruktion","t":"Nomen, -en","k":"in (içine) + struere (kurmak)","c":"die Instruktion, die Instruktionen","br":"Bilgiyi birinin içine kurmak = talimat, öğretim. Almanca eşdeğeri: die Anweisung (an+weisen).","tr":"talimat, yönerge","s":"Die Instruktionen für das Verfahren sind der Anlage zu entnehmen.","st":"Sürece ilişkin talimatlar ekten görülebilir.","f":"instruieren (talimat vermek) · die Anweisung (talimat) · der Instrukteur (eğitmen)"},{"w":"die Version","t":"Nomen, -en","k":"vertere/versus (çevirmek)","c":"die Version, die Versionen","br":"vert- kökü „çevirmek, döndürmek“. Bir olayın çevrilmiş hâli = anlatım biçimi, sürüm.","tr":"sürüm; (olayın) anlatımı","s":"Beide Parteien schildern eine völlig andere Version des Vorfalls.","st":"İki taraf da olayın bambaşka bir versiyonunu anlatıyor.","f":"die Konversion (dönüşüm) · konvertieren (dönüştürmek) · die Kontroverse (görüş ayrılığı)"},{"w":"die Kontroverse","t":"Nomen, -n","k":"contra (karşı) + vertere (çevirmek)","c":"die Kontroverse, die Kontroversen","br":"Karşı yönlere çevrilmiş duruşlar = derin görüş ayrılığı. kontrovers sıfatı C1 metinlerinin klasiğidir.","tr":"tartışma, görüş ayrılığı","s":"Das Thema wird seit Jahren kontrovers diskutiert.","st":"Konu yıllardır tartışmalı biçimde ele alınıyor.","f":"kontrovers (tartışmalı) · die Diskussion (tartışma) · der Streit (ihtilaf, kavga)"},{"w":"divers","t":"Adjektiv","k":"dis (ayrı) + vertere (çevirmek)","c":"—","br":"Latince dis (ayrı) + vertere (çevirmek): ayrı yönlere çevrilmiş, yani türlü türlü. Aynı vert- kökünden die Version, die Kontroverse, konvertieren. Almanca eşdeğeri verschieden; ismi die Diversität (çeşitlilik).","tr":"çeşitli, muhtelif","s":"Aus diversen Gründen haben wir den Termin verschoben.","st":"Muhtelif nedenlerle randevuyu erteledik.","f":"die Diversität (çeşitlilik) · die Vielfalt (Almanca eşdeğeri) · verschieden (çeşitli, farklı)"},{"w":"akzeptieren","t":"Verb","k":"ad (…e) + capere (almak)","c":"akzeptiert – akzeptierte – hat akzeptiert","br":"cap- kökü „almak, tutmak“. Kendine doğru almak = kabul etmek. Almanca annehmen (an+nehmen) birebir aynı yapı.","tr":"kabul etmek","s":"Diese Bedingungen kann ich so nicht akzeptieren.","st":"Bu koşulları bu şekilde kabul edemem.","f":"die Akzeptanz (kabul görme) · akzeptabel (kabul edilebilir) · annehmen (kabul etmek; varsaymak)"},{"w":"das Konzept","t":"Nomen, -e","k":"con (birlikte) + capere (almak)","c":"das Konzept, die Konzepte","br":"Dağınık fikirleri birlikte tutmak = kavram, tasarı. Almanca Begriff (be+greifen) tam olarak aynı imgeyi kurar: kavramak.","tr":"kavram, tasarı, konsept","s":"Für die Umsetzung fehlt bislang ein tragfähiges Konzept.","st":"Uygulama için şimdiye dek sağlam bir konsept yok.","f":"konzipieren (tasarlamak) · konzeptionell (kavramsal, tasarım düzeyinde) · der Begriff (kavram)"},{"w":"die Kapazität","t":"Nomen, -en","k":"capere (almak) + -ität","c":"die Kapazität, die Kapazitäten","br":"Latince capere almak, tutmak demektir (bkz. akzeptieren, das Konzept, das Prinzip). Kapasite „ne kadar alabildiği“dir. İkinci anlamı kişi içindir: alanında çok şey tutabilen, yani otorite. Almanca eşdeğeri das Fassungsvermögen.","tr":"kapasite; (kişi) otorite","s":"Die personellen Kapazitäten reichen dafür nicht aus.","st":"Personel kapasitesi buna yetmiyor.","f":"das Fassungsvermögen (Almanca eşdeğeri: fassen) · kapazitiv (kapasitif)","m":[{"tr":"(kişi) alanının otoritesi","s":"Sie gilt als Kapazität auf dem Gebiet des Mietrechts.","st":"Kira hukuku alanında bir otorite sayılıyor."}]},{"w":"das Prinzip","t":"Nomen, -ien","k":"primus (ilk) + capere (almak)","c":"das Prinzip, die Prinzipien","br":"Latince primus (ilk) + capere (almak): ilk alınan, temele konan. Yani başka her şeyin üzerine kurulduğu ilke. Kalıp: im Prinzip (esasen). Almanca eşdeğeri der Grundsatz; sıfatı prinzipiell.","tr":"ilke, prensip","s":"Im Prinzip haben Sie recht, praktisch ändert das aber nichts.","st":"Esasen haklısınız, ama pratikte bu bir şey değiştirmiyor.","f":"prinzipiell (ilkesel olarak) · der Grundsatz (Almanca eşdeğeri) · grundsätzlich (ilke olarak)"},{"w":"das Objekt","t":"Nomen, -e","k":"ob (karşıya) + jacere (atmak)","c":"das Objekt, die Objekte","br":"ject- kökü „atmak“. Karşımıza atılmış olan = nesne. Almanca Gegenstand (gegen+stehen) aynı sahneyi kurar: karşıda duran.","tr":"nesne, obje; (emlakta) taşınmaz","s":"Das Museum zeigt Objekte aus aller Welt.","st":"Müze dünyanın her yerinden nesneler sergiliyor.","f":"objektiv (nesnel) · die Objektivität (nesnellik) · der Gegenstand (nesne; konu)","m":[{"tr":"nesne, obje","s":"Das Museum zeigt Objekte aus dem 18. Jahrhundert.","st":"Müze 18. yüzyıla ait nesneler sergiliyor."}]},{"w":"subjektiv","t":"Adjektiv","k":"sub (altına) + jacere (atmak)","c":"—","br":"Altına atılmış olan, yani algının süzgecine düşen = kişiye bağlı. Karşıtı objektiv: karşıda, herkese aynı görünen.","tr":"öznel, kişisel","s":"Ihre Einschätzung ist rein subjektiv und lässt sich nicht belegen.","st":"Değerlendirmeniz tamamen öznel ve kanıtlanamaz.","f":"das Subjekt (özne) · objektiv (nesnel) · die Subjektivität (öznellik)"},{"w":"das Projekt","t":"Nomen, -e","k":"pro (öne) + jacere (atmak)","c":"das Projekt, die Projekte","br":"Latince pro (öne) + jacere (atmak): ileriye atılan şey. Yani henüz gerçekleşmemiş, öne fırlatılmış tasarı. Aynı ject- kökünden das Objekt (karşıya atılan) ve subjektiv (altına atılan) — üçü birlikte öğrenilir.","tr":"proje","s":"Das Projekt liegt gerade auf Eis.","st":"Proje şu an askıda.","f":"die Projektion (yansıtma) · projizieren (yansıtmak) · das Vorhaben (Almanca eşdeğeri)"},{"w":"die Injektion","t":"Nomen, -en","k":"in (içine) + jacere (atmak)","c":"die Injektion, die Injektionen","br":"İçeri atmak = enjeksiyon. Aynı kök teknik dilde de yaşar: Kraftstoffeinspritzung.","tr":"iğne, enjeksiyon","s":"Vor der Injektion wird die Stelle desinfiziert.","st":"İğneden önce bölge dezenfekte ediliyor.","f":"injizieren (enjekte etmek) · die Einspritzung (Almanca eşdeğeri)"}]},{"n":"-ieren fiilleri","e":"organisieren, funktionieren, realisieren…","c":"#3f5f9c","g":"Latin & Yunan kökleri","cards":[{"w":"organisieren","t":"Verb","k":"Organ (organ, araç) + -isieren","c":"organisiert – organisierte – hat organisiert","br":"-ieren eki yabancı kökü Almanca fiile çevirir. Bu fiillerin ortak kuralı: Partizip’te ge- ALMAZLAR — organisiert, studiert, telefoniert. Vurgu da daima -ie- hecesindedir.","tr":"düzenlemek, organize etmek","s":"Wer organisiert das Klassenfest?","st":"Sınıf partisini kim organize ediyor?","f":"die Organisation (organizasyon) · veranstalten (düzenlemek) · das Organ (organ)"},{"w":"funktionieren","t":"Verb","k":"Funktion (işlev) + -ieren","c":"funktioniert – funktionierte – hat funktioniert","br":"Cihaz ve sistemler için „çalışmak“ budur; arbeiten insan içindir. Bu ayrım Türkçe konuşanlarda sık karışır: Der Drucker arbeitet nicht ✗ → funktioniert nicht ✓.","tr":"çalışmak, işlemek (cihaz, sistem)","s":"Der Drucker funktioniert seit dem Update nicht mehr.","st":"Yazıcı güncellemeden beri çalışmıyor.","f":"die Funktion (işlev) · klappen (yolunda gitmek) · kaputt (bozuk)"},{"w":"realisieren","t":"Verb","k":"real (gerçek) + -isieren","c":"realisiert – realisierte – hat realisiert","br":"İki anlam: bir projeyi hayata geçirmek (umsetzen) ve bir şeyin farkına varmak (İngilizceden geçen yeni kullanım). Resmî yazıda birincisi tercih edilir.","tr":"hayata geçirmek; farkına varmak","s":"Das Projekt lässt sich in dieser Form nicht realisieren.","st":"Proje bu hâliyle hayata geçirilemez.","f":"umsetzen (uygulamaya koymak) · verwirklichen (gerçekleştirmek) · merken (fark etmek)"},{"w":"kontrollieren ↔ überprüfen","t":"Karıştırılan çift","k":"Kontrolle + -ieren / über + prüfen","c":"kontrolliert – kontrollierte – hat kontrolliert","br":"kontrollieren denetlemek ve gözetim altında tutmaktır (Fahrkarten kontrollieren), überprüfen ise doğruluğunu sınamaktır. Almanca „kontrol etmek“i Türkçedeki kadar geniş kullanmaz.","tr":"denetlemek ↔ doğruluğunu sınamak","s":"Im Zug wurden die Fahrkarten kontrolliert; die Angaben überprüfen wir später.","st":"Trende biletler denetlendi; bilgileri sonra kontrol edeceğiz.","f":"die Kontrolle (denetim) · prüfen (sınamak) · nachprüfen (teyit etmek)"},{"w":"reagieren ↔ agieren","t":"Kök çifti","k":"agere (eylemek) + re- (geri)","c":"reagiert – reagierte – hat reagiert","br":"agieren kendiliğinden eylemektir, reagieren gelen etkiye karşılık vermektir. Aynı kökten: aktiv, die Aktion, der Akteur, die Reaktion.","tr":"tepki vermek ↔ eylemde bulunmak","s":"Er hat auf die Nachricht gar nicht reagiert.","st":"Mesaja hiç tepki vermedi.","f":"die Reaktion (tepki) · aktiv (etkin) · der Akteur (aktör, taraf)"},{"w":"diskutieren ↔ besprechen","t":"Karıştırılan çift","k":"discutere (parçalayarak incelemek) / be + sprechen","c":"diskutiert – diskutierte – hat diskutiert","br":"diskutieren farklı görüşlerin çarpıştığı tartışmadır; besprechen ise bir konuyu birlikte konuşup karara bağlamaktır. Toplantıda ikincisi kullanılır.","tr":"tartışmak ↔ görüşüp konuşmak","s":"Wir haben lange diskutiert und dann alles in Ruhe besprochen.","st":"Uzun tartıştık, sonra her şeyi sakince konuştuk.","f":"die Diskussion (tartışma) · die Besprechung (toplantı) · die Debatte (müzakere)"},{"w":"existieren ↔ bestehen","t":"Karıştırılan çift","k":"ex + sistere (durmak) / be + stehen","c":"existiert – existierte – hat existiert","br":"İkisi de „var olmak“ demektir; bestehen Almanca kökten gelir ve resmî dilde tercih edilir: Es besteht ein Anspruch. existieren daha felsefi ya da somut varlık içindir.","tr":"var olmak (yabancı kök ↔ Almanca kök)","s":"Für diesen Fall besteht bereits eine klare Regelung.","st":"Bu durum için zaten net bir düzenleme var.","f":"die Existenz (varlık) · bestehen (var olmak) · vorhanden (mevcut)"},{"w":"reparieren ↔ instand setzen","t":"Karıştırılan çift","k":"reparare (onarmak) / instand setzen","c":"repariert – reparierte – hat repariert","br":"Günlük dilde reparieren, resmî ve teknik dilde instand setzen ya da beheben kullanılır. Aynı olay, üç dil düzeyi.","tr":"tamir etmek (günlük ↔ resmî)","s":"Kannst du das reparieren oder muss ein Fachmann ran?","st":"Bunu tamir edebilir misin, yoksa usta mı lazım?","f":"die Reparatur (tamir) · beheben (gidermek) · der Schaden (hasar)"},{"w":"telefonieren ↔ anrufen","t":"Karıştırılan çift","k":"telefonieren mit (D) / anrufen + Akkusativ","c":"telefoniert / ruft an – rief an – hat angerufen","br":"Yapıları farklı: anrufen kişiyi doğrudan alır (Ich rufe dich an), telefonieren edat ister (Ich telefoniere mit dir). Türkçe konuşanlarda en sık hatalardan.","tr":"telefonla konuşmak ↔ (birini) aramak","s":"Ich rufe dich später an — gestern habe ich lange mit deiner Mutter telefoniert.","st":"Seni sonra ararım — dün annenle uzun konuştum.","f":"der Anruf (telefon araması) · zurückrufen (geri aramak) · das Telefonat (görüşme)"},{"w":"informieren ↔ mitteilen","t":"Karıştırılan çift","k":"in + forma / mit + teilen","c":"informiert / teilt mit","br":"informieren kişiyi Akkusativ alır ve konu über ile gelir; mitteilen ise kişiyi Dativ alır ve konuyu doğrudan verir: Ich teile Ihnen mit, dass …","tr":"bilgilendirmek ↔ bildirmek","s":"Ich informiere Sie über den Stand und teile Ihnen das Ergebnis morgen mit.","st":"Sizi durum hakkında bilgilendireceğim ve sonucu yarın bildireceğim.","f":"die Information (bilgi) · die Mitteilung (bildirim) · benachrichtigen (haber vermek)"},{"w":"studieren ↔ untersuchen","t":"Karıştırılan çift","k":"studere (gayret etmek) / unter + suchen","c":"studiert / untersucht","br":"studieren üniversitede okumaktır; bir konuyu bilimsel incelemek untersuchen ya da erforschen’dir. „Konuyu çalışmak“ için studieren kullanılmaz.","tr":"üniversitede okumak ↔ incelemek","s":"Sie studiert Medizin und untersucht in ihrer Arbeit Schlafmuster.","st":"Tıp okuyor ve çalışmasında uyku düzenlerini inceliyor.","f":"das Studium (üniversite eğitimi) · die Untersuchung (inceleme) · erforschen (araştırmak)"},{"w":"akzeptieren ↔ hinnehmen","t":"Karıştırılan çift","k":"ad + capere (almak) / hin + nehmen","c":"akzeptiert / nimmt hin","br":"akzeptieren onaylayarak kabuldür; hinnehmen ise istemeden katlanmaktır. İkincisi genelde olumsuz kullanılır: Das müssen wir nicht hinnehmen.","tr":"kabul etmek ↔ katlanmak","s":"Ich akzeptiere die Entscheidung, aber die Begründung nehme ich nicht einfach hin.","st":"Kararı kabul ediyorum ama gerekçeye öylece katlanmam.","f":"die Akzeptanz (kabul) · hinnehmbar (katlanılabilir) · dulden (göz yummak)"},{"w":"garantieren ↔ zusichern","t":"Karıştırılan çift","k":"Garantie / zu + sichern","c":"garantiert / sichert zu","br":"garantieren ticari taahhüttür, zusichern ise kişisel ya da resmî güvence: Man hat mir zugesichert, dass … Hukukta ikincisi bağlayıcıdır.","tr":"garanti etmek ↔ güvence vermek","s":"Man hat mir zugesichert, dass die Reparatur nichts kostet.","st":"Tamiratın ücretsiz olacağına dair bana güvence verildi.","f":"die Garantie (garanti) · die Zusicherung (güvence) · versprechen (söz vermek)"},{"w":"-ieren: Partizip kuralı","t":"Yapı kuralı","k":"ge- YOK: studiert, telefoniert, repariert","c":"—","br":"Bu fiillerin vurgusu -ie- hecesindedir, ilk hecede değil. Almanca ge- ekini yalnızca vurgusu ilk hecede olan fiillere verir — bu yüzden studiert, telefoniert, repariert. Aynı sebeple ayrılmayan ön ekli fiiller de ge- almaz: verstanden, bezahlt.","tr":"-ieren fiillerinde ge- kullanılmaz","s":"Ich habe gestern drei Stunden telefoniert und alles notiert.","st":"Dün üç saat telefonla konuştum ve her şeyi not aldım.","f":"das Partizip II (üçüncü hâl) · betonen (vurgulamak) · unbetont (vurgusuz)"}]},{"n":"Latin kökler: script · dict · fact","e":"yazmak · söylemek · yapmak","c":"#1f6f8b","g":"Latin & Yunan kökleri","cards":[{"w":"das Manuskript","t":"Nomen, -e","k":"manus (el) + scribere (yazmak)","c":"das Manuskript, die Manuskripte","br":"script- kökü „yazmak“. Elle yazılmış olan = müsvedde, metin. Almanca eşdeğeri die Handschrift birebir aynı iki parçadan kurulu: Hand + Schrift.","tr":"müsvedde, el yazması metin","s":"Das Manuskript muss bis Ende des Monats eingereicht werden.","st":"Metin ay sonuna kadar teslim edilmeli.","f":"die Handschrift (el yazısı) · das Skript (ders notu) · schreiben (yazmak)"},{"w":"transkribieren","t":"Verb","k":"trans (öteye) + scribere (yazmak)","c":"transkribiert – transkribierte – hat transkribiert","br":"Konuşmayı öteki ortama, yazıya geçirmek. Aynı kalıp: transferieren, transportieren — trans- hep „öteye“ demektir.","tr":"deşifre etmek, yazıya geçirmek","s":"Ich transkribiere das Interview heute Abend.","st":"Röportajı bu akşam yazıya geçireceğim.","f":"die Transkription (deşifre metni) · übertragen (aktarmak) · die Abschrift (suret)"},{"w":"die Vorschrift","t":"Nomen, -en","k":"vor + Schrift (schreiben)","c":"die Vorschrift, die Vorschriften","br":"Latince praescriptum ile birebir aynı yapı: önceden yazılmış olan = uyulması gereken kural. Almanca ön ekle, Latince prä- ile.","tr":"yönetmelik, talimat, kural","s":"Die Vorschriften zur Belegeinsicht sind eindeutig.","st":"Belge incelemesine ilişkin kurallar açık.","f":"vorschreiben (zorunlu kılmak) · vorschriftsmäßig (kurala uygun) · das Rezept (reçete)"},{"w":"das Diktat","t":"Nomen, -e","k":"dicere/dictare (söylemek)","c":"das Diktat, die Diktate","br":"dict- kökü „söylemek“. Söylenip yazdırılan = dikte. Bu kök Diktator, Diktion, Widerspruch’un Latince karşılığı contradictio’da da yaşar.","tr":"dikte; dayatma","s":"In der dritten Klasse schreiben die Kinder wöchentlich ein Diktat.","st":"Üçüncü sınıfta çocuklar haftada bir dikte yazıyor.","f":"diktieren (dikte etmek) · der Diktator (diktatör) · die Ansage (duyuru)","m":[{"tr":"dayatma, tek taraflı emir","s":"Das war kein Vorschlag, sondern ein Diktat.","st":"Bu bir öneri değil, dayatmaydı."}]},{"w":"diktieren","t":"Verb","k":"dictare (söyleyip yazdırmak)","c":"diktiert – diktierte – hat diktiert","br":"dictare söyleyip yazdırmaktır; kök dict- „söylemek“ demektir. Sınıfta metni yazdırmak, hayatta ise koşulları dayatmak. Aynı kökten das Diktat, der Diktator, die Diktion ve Latince contradictio — Almancası der Widerspruch.","tr":"dikte etmek; dayatmak","s":"Der Markt diktiert inzwischen die Preise.","st":"Artık fiyatları piyasa dayatıyor.","f":"das Diktat (dikte) · diktatorisch (buyurgan) · vorgeben (belirlemek)"},{"w":"der Widerspruch (contradictio)","t":"Kök karşılaştırması","k":"wider + Spruch  ≙  contra + dictio","c":"—","br":"Almanca ve Latince aynı iki parçayı kullanır: karşı + söz. Bir dilde kökü çözünce diğerinin kelimesi de bedava gelir. Bu uygulamanın temel kazancı budur.","tr":"itiraz, çelişki (Alm.) = contradictio (Lat.)","s":"Das ist ein Widerspruch in sich.","st":"Bu kendi içinde bir çelişki.","f":"widersprechen (karşı çıkmak) · der Spruch (söz) · das Verdikt (hüküm)"},{"w":"der Faktor","t":"Nomen, -en","k":"facere (yapmak) + -or","c":"der Faktor, die Faktoren","br":"fact- kökü „yapmak“. Sonucu yapan şey = etken. Aynı kökten Effekt, perfekt, Defizit, Fabrik.","tr":"etken, faktör; çarpan","s":"Der entscheidende Faktor war der Zeitpunkt der Zustellung.","st":"Belirleyici etken tebliğ tarihiydi.","f":"die Fakten (olgular) · faktisch (fiilen) · der Effekt (etki)"},{"w":"der Effekt","t":"Nomen, -e","k":"ex (dışarı) + facere (yapmak)","c":"der Effekt, die Effekte","br":"Dışarı çıkan yapım = sonuç, etki. Almanca eşdeğeri die Wirkung (wirken: etki etmek).","tr":"etki, sonuç","s":"Die Maßnahme hatte kaum einen messbaren Effekt.","st":"Tedbirin ölçülebilir bir etkisi neredeyse olmadı.","f":"effektiv (etkili) · die Effizienz (verimlilik) · die Wirkung (etki)"},{"w":"perfekt","t":"Adjektiv","k":"per (sonuna kadar) + facere (yapmak)","c":"—","br":"Sonuna kadar yapılmış = eksiksiz. Aynı mantık dilbilgisinde de var: Perfekt = tamamlanmış geçmiş zaman.","tr":"kusursuz, tamamlanmış","s":"Der Entwurf ist noch nicht perfekt, aber brauchbar.","st":"Taslak henüz kusursuz değil ama kullanılabilir.","f":"die Perfektion (kusursuzluk) · vollkommen (mükemmel) · das Perfekt (dilbilgisi zamanı)"},{"w":"das Defizit","t":"Nomen, -e","k":"de (eksilterek) + facere (yapmak)","c":"das Defizit, die Defizite","br":"Latince deficere: eksik kalmak (de + facere, „yapımdan düşmek“). Yani olması gerekenle olan arasındaki eksik. Aynı fact- kökünden der Effekt, perfekt, der Faktor. Almanca karşılığı: der Fehlbetrag ya da das Minus.","tr":"açık, eksiklik","s":"Im Haushalt der Stadt klafft ein erhebliches Defizit.","st":"Şehrin bütçesinde ciddi bir açık var.","f":"defizitär (açık veren) · der Mangel (eksiklik) · der Überschuss (fazla)"},{"w":"qualifizieren","t":"Verb","k":"qualis (nasıl, nitelik) + facere (yapmak)","c":"qualifiziert – qualifizierte – hat qualifiziert","br":"Nitelikli hâle getirmek. -fizieren eki daima „…yapmak“ demektir: identifizieren, klassifizieren, spezifizieren.","tr":"yeterlilik kazandırmak; nitelendirmek","s":"Die Fortbildung qualifiziert für die Arbeit mit Jugendlichen.","st":"Bu eğitim gençlerle çalışma yeterliliği kazandırıyor.","f":"die Qualifikation (yeterlilik) · qualifiziert (nitelikli) · die Qualität (nitelik)"},{"w":"identifizieren","t":"Verb","k":"idem (aynı) + facere (yapmak)","c":"identifiziert – identifizierte – hat identifiziert","br":"Bir şeyi „aynı“ kılmak, yani neyle özdeş olduğunu belirlemek = teşhis etmek. sich identifizieren mit: kendini özdeşleştirmek.","tr":"teşhis etmek, kimliğini belirlemek","s":"Die Ursache des Fehlers konnte schnell identifiziert werden.","st":"Hatanın sebebi hızla tespit edilebildi.","f":"die Identität (kimlik) · die Identifikation (teşhis) · feststellen (tespit etmek)"},{"w":"spezifisch","t":"Adjektiv","k":"species (tür) + facere (yapmak)","c":"—","br":"Latince species tür, facere yapmaktır: türe özgü kılınmış. Yani genel değil, o duruma ait. Aynı kökten spezifizieren (ayrıntılandırmak), der Spezialist, die Spezies. Almanca eşdeğeri: eigen ya da besonders.","tr":"kendine özgü, spesifik","s":"Für diesen Fall gelten spezifische Regelungen.","st":"Bu durum için özel düzenlemeler geçerli.","f":"spezifizieren (ayrıntılandırmak) · der Spezialist (uzman) · besonders (özellikle)"},{"w":"die Fabrik","t":"Nomen, -en","k":"fabricare (yapmak, imal etmek)","c":"die Fabrik, die Fabriken","br":"Yapım yeri = fabrika. Almanca karşılığı das Werk ya da die Herstellung kökünden herstellen.","tr":"fabrika","s":"Die Fabrik liegt am Rand des Industriegebiets.","st":"Fabrika sanayi bölgesinin kenarında.","f":"fabrizieren (imal etmek) · das Werk (fabrika, eser) · herstellen (üretmek)"}]},{"n":"Latin kökler: port · form · mitt · sequ","e":"taşımak · biçim vermek · göndermek · izlemek","c":"#9c4f2a","g":"Latin & Yunan kökleri","cards":[{"w":"der Transport","t":"Nomen, -e","k":"trans (öteye) + portare (taşımak)","c":"der Transport, die Transporte","br":"port- kökü „taşımak“. Öteye taşıma = nakliye. Almanca eşdeğeri die Beförderung (fördern: ilerletmek).","tr":"nakliye, taşıma","s":"Der Transport der Möbel dauerte einen halben Tag.","st":"Mobilyaların taşınması yarım gün sürdü.","f":"transportieren (taşımak) · die Beförderung (nakil; terfi) · tragen (taşımak)"},{"w":"der Import","t":"Nomen, -e","k":"in (içeri) + portare (taşımak)","c":"der Import, die Importe","br":"İçeri taşıma = ithalat; karşıtı Export: dışarı taşıma. Almanca eşdeğerleri Einfuhr ve Ausfuhr aynı yapıyı Almanca parçalarla kurar.","tr":"ithalat","s":"Der Import dieser Waren ist genehmigungspflichtig.","st":"Bu malların ithalatı izne tabidir.","f":"importieren (ithal etmek) · die Einfuhr (ithalat) · die Ausfuhr (ihracat)"},{"w":"die Reform","t":"Nomen, -en","k":"re (yeniden) + forma (biçim)","c":"die Reform, die Reformen","br":"form- kökü „biçim“. Yeniden biçimlendirme = reform. Almanca eşdeğeri die Umgestaltung: um + Gestalt.","tr":"reform, yeniden düzenleme","s":"Die Reform des Schulsystems wird seit Jahren diskutiert.","st":"Okul sisteminin reformu yıllardır tartışılıyor.","f":"reformieren (reform yapmak) · die Umgestaltung (yeniden düzenleme) · die Form (biçim)"},{"w":"formulieren","t":"Verb","k":"formula (küçük biçim, kalıp)","c":"formuliert – formulierte – hat formuliert","br":"Düşünceye kalıp vermek = ifadeyi kurmak. Yazışmada „nasıl söylediğin“ bu fiille anlatılır.","tr":"ifade etmek, kaleme almak","s":"Formulier das bitte etwas freundlicher.","st":"Bunu lütfen biraz daha nazik ifade et.","f":"die Formulierung (ifade biçimi) · das Formular (form) · die Formel (formül)"},{"w":"informieren","t":"Verb + über (A)","k":"in (içine) + forma (biçim)","c":"informiert – informierte – hat informiert","br":"Birinin zihnine biçim vermek = bilgi vermek. Information: zihne verilen biçim. Almanca eşdeğeri: mitteilen, unterrichten.","tr":"bilgilendirmek; sich ~ : bilgi edinmek","s":"Bitte informieren Sie uns über jede Adressänderung.","st":"Lütfen her adres değişikliğinden bizi haberdar edin.","f":"die Information (bilgi) · mitteilen (bildirmek) · informiert (bilgili)"},{"w":"die Formalität","t":"Nomen, -en","k":"forma (biçim) + -alität","c":"die Formalität, die Formalitäten","br":"Yalnızca biçime ilişkin olan = şekil şartı. Hukukta biçim (Form) ile öz (Inhalt) ayrımı belirleyicidir.","tr":"şekil şartı, formalite","s":"Es fehlt nur noch eine Formalität, dann ist der Antrag vollständig.","st":"Sadece bir formalite eksik, sonra başvuru tamam.","f":"formal (biçimsel) · förmlich (resmî) · der Formfehler (şekil hatası)"},{"w":"die Kommission","t":"Nomen, -en","k":"com (birlikte) + mittere (göndermek)","c":"die Kommission, die Kommissionen","br":"mitt- kökü „göndermek“. Birlikte bir göreve gönderilenler = komisyon. Aynı kökten Mission, Emission, Kompromiss.","tr":"komisyon, kurul","s":"Die Kommission tagt einmal im Quartal.","st":"Komisyon çeyrekte bir toplanıyor.","f":"der Kommissar (komiser) · der Ausschuss (komisyon, Alm.) · die Mission (görev)"},{"w":"die Emission","t":"Nomen, -en","k":"ex (dışarı) + mittere (göndermek)","c":"die Emission, die Emissionen","br":"Dışarı gönderme = salım (gaz, ses) ya da ihraç (tahvil). Almanca eşdeğeri der Ausstoß: aus + stoßen.","tr":"salım, emisyon; ihraç","s":"Die Emissionen sollen bis 2030 halbiert werden.","st":"Salımlar 2030’a kadar yarıya indirilecek.","f":"emittieren (salmak, ihraç etmek) · der Ausstoß (salım) · die Immission (çevreye ulaşan etki)"},{"w":"der Kompromiss","t":"Nomen, -e","k":"com (birlikte) + promittere (söz vermek)","c":"der Kompromiss, die Kompromisse","br":"Karşılıklı söz vermek = uzlaşma. Almanca eşdeğeri der Vergleich hukukta „sulh“ demektir.","tr":"uzlaşma, taviz anlaşması","s":"Am Ende haben beide Seiten einen Kompromiss gefunden.","st":"Sonunda iki taraf bir uzlaşmaya vardı.","f":"kompromissbereit (uzlaşmaya açık) · der Vergleich (sulh; karşılaştırma) · die Einigung (anlaşma)"},{"w":"die Konsequenz","t":"Nomen, -en","k":"con (birlikte) + sequi (izlemek)","c":"die Konsequenz, die Konsequenzen","br":"sequ- kökü „izlemek“. Ardından gelen şey = sonuç. Almanca eşdeğeri die Folge (folgen: izlemek) birebir aynı mantıkta.","tr":"sonuç, netice","s":"Diese Entscheidung hat weitreichende Konsequenzen.","st":"Bu kararın geniş kapsamlı sonuçları var.","f":"die Folge (sonuç) · folglich (dolayısıyla) · die Sequenz (dizi, sıra)","m":[{"tr":"tutarlılık, kararlılık","s":"Er verfolgt seine Ziele mit großer Konsequenz.","st":"Hedeflerini büyük bir kararlılıkla takip ediyor."}]},{"w":"konsequent","t":"Adjektiv","k":"con + sequi (izlemek)","c":"—","br":"Kendi çizgisini kesintisiz izleyen = tutarlı, ilkeli. „Sonuçları göze alarak“ anlamını da taşır.","tr":"tutarlı, kararlı, ilkeli","s":"Die Regeln müssen konsequent angewendet werden.","st":"Kurallar tutarlı biçimde uygulanmalı.","f":"inkonsequent (tutarsız) · folgerichtig (mantık gereği) · streng (sıkı)"},{"w":"die Sequenz","t":"Nomen, -en","k":"sequi (izlemek) + -enz","c":"die Sequenz, die Sequenzen","br":"Birbirini izleyen öğeler = dizi, sıra. Aynı kökten sekundär (ikinci sırada gelen).","tr":"dizi, sıra, sahne dizisi","s":"Die Sequenz der Arbeitsschritte ist genau festgelegt.","st":"İş adımlarının sırası tam olarak belirlenmiş.","f":"die Reihenfolge (sıralama) · sekundär (ikincil) · die Konsequenz (sonuç)"},{"w":"die Prozedur","t":"Nomen, -en","k":"pro (öne) + cedere (yürümek)","c":"die Prozedur, die Prozeduren","br":"ced-/zess- kökü „yürümek“. Öne doğru yürüyüş = işlem sırası. Aynı kökten Prozess, Rezession, Konzession.","tr":"işlem, prosedür","s":"Die Prozedur beim Amt dauert erfahrungsgemäß mehrere Wochen.","st":"Dairedeki işlem tecrübeye göre birkaç hafta sürüyor.","f":"der Prozess (süreç, dava) · das Verfahren (usul, yöntem) · vorgehen (işlem yapmak)"},{"w":"die Konzession","t":"Nomen, -en","k":"con (birlikte) + cedere (yürümek, geri çekilmek)","c":"die Konzession, die Konzessionen","br":"Karşı tarafa doğru bir adım geri çekilmek = taviz; resmî anlamı: ruhsat, imtiyaz.","tr":"taviz; ruhsat, imtiyaz","s":"Ohne gegenseitige Konzessionen ist keine Einigung möglich.","st":"Karşılıklı taviz olmadan anlaşma mümkün değil.","f":"das Zugeständnis (taviz) · die Lizenz (lisans) · konzessionspflichtig (ruhsata tabi)"}]},{"n":"Yunan kökler: log · graph · these · kritik","e":"söz · yazı · koyulan tez · ayırt etme","c":"#5b4bb0","g":"Latin & Yunan kökleri","cards":[{"w":"die Logik","t":"Nomen (çoğulsuz)","k":"logos (söz, akıl)","c":"die Logik","br":"log- kökü hem „söz“ hem „akıl“ demektir. Aynı kök: Dialog, Katalog, Analogie, Biologie — her -logie bir alanın söylemi/bilimi.","tr":"mantık","s":"Die Logik dieser Begründung erschließt sich mir nicht.","st":"Bu gerekçenin mantığını kavrayamıyorum.","f":"logisch (mantıklı) · die Vernunft (akıl) · folgerichtig (tutarlı)"},{"w":"der Dialog","t":"Nomen, -e","k":"dia (arasında) + logos (söz)","c":"der Dialog, die Dialoge","br":"İki taraf arasında akan söz. dia- „arasından“ demektir (Diagonale, Diagnose).","tr":"diyalog, karşılıklı konuşma","s":"Wir setzen weiterhin auf den Dialog mit der Schulleitung.","st":"Okul yönetimiyle diyaloğa güvenmeye devam ediyoruz.","f":"das Gespräch (görüşme) · der Monolog (tek kişilik konuşma) · dialogisch (diyaloğa dayalı)"},{"w":"der Katalog","t":"Nomen, -e","k":"kata (boyunca, aşağı) + logos (söz, liste)","c":"der Katalog, die Kataloge","br":"Baştan sona sıralanan söz = liste. Resmî dilde: ölçüt listesi (Kriterienkatalog).","tr":"katalog, liste","s":"Der Katalog der umlagefähigen Kosten ist gesetzlich abschließend.","st":"Yansıtılabilir masrafların listesi yasada sınırlı sayıdadır.","f":"das Verzeichnis (dizin) · die Liste (liste) · der Fragenkatalog (soru listesi)"},{"w":"das Programm","t":"Nomen, -e","k":"pro (önceden) + gramma (yazı)","c":"das Programm, die Programme","br":"graph-/gramm- kökü „yazmak, çizmek“. Önceden yazılmış olan = plan, program.","tr":"program, plan","s":"Das Programm der Veranstaltung steht noch nicht fest.","st":"Etkinliğin programı henüz belli değil.","f":"programmieren (programlamak) · der Ablauf (akış) · das Diagramm (grafik)"},{"w":"das Diagramm","t":"Nomen, -e","k":"dia (arasından) + gramma (çizgi)","c":"das Diagramm, die Diagramme","br":"Aradan geçen çizgilerle anlatım = grafik. Almanca eşdeğeri die Grafik ya da das Schaubild (Schau + Bild).","tr":"grafik, çizim","s":"Das Diagramm zeigt den Verbrauch der letzten fünf Jahre.","st":"Grafik son beş yılın tüketimini gösteriyor.","f":"die Grafik (grafik) · das Schaubild (şema) · grafisch (grafiksel)"},{"w":"die Biografie","t":"Nomen, -n","k":"bios (yaşam) + graphein (yazmak)","c":"die Biografie, die Biografien","br":"Yaşamın yazılması = yaşam öyküsü. Aynı kökten Autobiografie (kendi eliyle), Fotografie (ışıkla yazma).","tr":"biyografi, yaşam öyküsü","s":"Seine Biografie erklärt vieles an seiner Haltung.","st":"Yaşam öyküsü tutumundaki çok şeyi açıklıyor.","f":"der Lebenslauf (özgeçmiş) · die Fotografie (fotoğraf) · biografisch (biyografik)"},{"w":"die These","t":"Nomen, -n","k":"tithenai (koymak) → thesis (konulmuş olan)","c":"die These, die Thesen","br":"thes- kökü „koymak“ demektir — Latince pon- ile aynı işi görür. Ortaya konan iddia = tez.","tr":"tez, iddia","s":"Der Autor belegt seine These mit mehreren Studien.","st":"Yazar tezini birkaç çalışmayla destekliyor.","f":"die Behauptung (iddia) · die Hypothese (varsayım) · thematisch (konuya ilişkin)"},{"w":"die Hypothese","t":"Nomen, -n","k":"hypo (altına) + thesis (koymak)","c":"die Hypothese, die Hypothesen","br":"Altına konan varsayım = üzerine akıl yürütülen geçici temel. Aynı hypo-: Hypotonie, Hypothek (altına konan rehin).","tr":"varsayım, hipotez","s":"Diese Hypothese ließ sich empirisch nicht bestätigen.","st":"Bu varsayım deneysel olarak doğrulanamadı.","f":"die Annahme (varsayım) · hypothetisch (varsayımsal) · die Hypothek (ipotek)"},{"w":"die Synthese","t":"Nomen, -n","k":"syn (birlikte) + thesis (koymak)","c":"die Synthese, die Synthesen","br":"Birlikte koymak = birleştirme. Karşıtı Analyse: ana + lyein (çözmek) = parçalara ayırma.","tr":"sentez, birleştirme","s":"Der Aufsatz ist eine gelungene Synthese beider Ansätze.","st":"Makale iki yaklaşımın başarılı bir sentezi.","f":"die Analyse (çözümleme) · synthetisch (sentetik) · zusammenfassen (birleştirmek)"},{"w":"das Thema","t":"Nomen, Themen","k":"thema (ortaya konan şey)","c":"das Thema, die Themen","br":"Aynı thes- kökü: ortaya konulan mesele = konu. Kalıp: zum Thema werden, das Thema ansprechen.","tr":"konu, mesele","s":"Wechseln wir das Thema, das führt zu nichts.","st":"Konuyu değiştirelim, bu bir yere varmıyor.","f":"der Gegenstand (konu) · thematisieren (gündeme getirmek) · die Thematik (konu bütünü)"},{"w":"das Kriterium","t":"Nomen, Kriterien","k":"krinein (ayırt etmek, yargılamak)","c":"das Kriterium, die Kriterien","br":"krit- kökü „ayırt etmek“. Ayırt etmeye yarayan ölçüt = kriter. Aynı kökten Kritik, Krise (ayrım anı), kritisch.","tr":"ölçüt, kriter","s":"Für mich ist der Preis nicht das wichtigste Kriterium.","st":"Benim için fiyat en önemli ölçüt değil.","f":"der Maßstab (ölçüt) · kritisch (eleştirel; kritik) · die Voraussetzung (ön koşul)"},{"w":"die Kritik","t":"Nomen, -en","k":"krinein (ayırt etmek)","c":"die Kritik, die Kritiken","br":"Ayırt edici değerlendirme = eleştiri. Türkçedeki gibi olumsuz olmak zorunda değil: konstruktive Kritik.","tr":"eleştiri; değerlendirme yazısı","s":"Kritik höre ich gern, wenn sie konkret ist.","st":"Somut olduğu sürece eleştiriyi severim.","f":"kritisieren (eleştirmek) · der Kritiker (eleştirmen) · die Beanstandung (itiraz, kusur bildirimi)","m":[{"tr":"eleştiri yazısı, değerlendirme","s":"Die Kritik in der Zeitung war überwiegend positiv.","st":"Gazetedeki değerlendirme ağırlıklı olarak olumluydu."}]},{"w":"die Demokratie","t":"Nomen, -n","k":"demos (halk) + kratos (güç)","c":"die Demokratie, die Demokratien","br":"Gücün halkta olması. -kratie eki daima „kimin gücü“ sorusunu yanıtlar: Bürokratie (büro gücü), Autokratie (tek kişi).","tr":"demokrasi","s":"Die Meinungsfreiheit ist ein Kernbestandteil jeder Demokratie.","st":"İfade özgürlüğü her demokrasinin çekirdek unsurudur.","f":"demokratisch (demokratik) · die Bürokratie (bürokrasi) · die Volksherrschaft (halk egemenliği)"},{"w":"die Bürokratie","t":"Nomen, -n","k":"Büro (yazı masası) + kratos (güç)","c":"die Bürokratie, die Bürokratien","br":"Masanın, yani yazılı usulün gücü. Almancada hem yansız (idare) hem eleştirel (kırtasiyecilik) kullanılır.","tr":"bürokrasi; kırtasiyecilik","s":"Die Bürokratie beim Antrag hat mehrere Monate gekostet.","st":"Başvurudaki bürokrasi birkaç ay kaybettirdi.","f":"bürokratisch (bürokratik) · die Verwaltung (idare) · der Amtsweg (resmî yol)"}]},{"n":"Günlük konuşma kalıpları","e":"Alles klar, Passt schon, Mach’s gut…","c":"#a3562f","g":"Deyimler","cards":[{"w":"Alles klar!","t":"Konuşma kalıbı","k":"alles (her şey) + klar (net)","c":"—","br":"Almancanın en sık onay kalıbı: „anlaşıldı, tamam“. Soru hâlinde ise durum sorar: Alles klar? = İyi misin, her şey yolunda mı?","tr":"Tamam, anlaşıldı","s":"Alles klar, dann sehen wir uns um sieben.","st":"Tamam, o zaman yedide görüşürüz.","f":"klar (net) · in Ordnung (tamam) · verstanden (anlaşıldı)"},{"w":"Passt schon.","t":"Konuşma kalıbı","k":"passen (uymak) + schon","c":"—","br":"passen uymaktır: „uyuyor işte“. schon partikeli endişeyi hafifletir, bu yüzden cümle „sorun değil, olur o“ tonunu alır. Aynı fiilden das passt mir (bana uyar) ve unpassend (yakışıksız).","tr":"Sorun değil, boş ver","s":"Entschuldige die Verspätung! — Passt schon.","st":"Geciktiğim için kusura bakma! — Sorun değil.","f":"kein Problem (sorun değil) · macht nichts (önemli değil) · halb so wild (o kadar da önemli değil)"},{"w":"Mach’s gut!","t":"Vedalaşma","k":"machen (yapmak) + es + gut","c":"—","br":"machen yapmaktır: „onu iyi yap“ — yani hayatını iyi idare et. Vedalaşmada kalıplaşmıştır ve cevabı da sabittir: Du auch! Resmî karşılıkları: Auf Wiedersehen; telefonda Auf Wiederhören.","tr":"Kendine iyi bak!","s":"Mach’s gut, wir telefonieren nächste Woche.","st":"Kendine iyi bak, gelecek hafta konuşuruz.","f":"tschüss (hoşça kal) · bis bald (yakında görüşürüz) · auf Wiedersehen (görüşmek üzere)"},{"w":"Bis dann / bis gleich","t":"Vedalaşma","k":"bis (…e kadar) + zaman zarfı","c":"—","br":"Vedalaşmada „…e kadar“ kalıbı zaman farkına göre değişir: bis gleich (birazdan), bis später (sonra), bis morgen (yarın), bis bald (yakında), bis dann (o zaman).","tr":"Sonra görüşürüz","s":"Ich muss los — bis später!","st":"Çıkmam lazım — sonra görüşürüz!","f":"bis morgen (yarına) · bis bald (yakında) · sich sehen (görüşmek)"},{"w":"Viel Erfolg! / Viel Glück!","t":"Dilek kalıbı","k":"viel + Erfolg (başarı) / Glück (şans)","c":"—","br":"Emek gerektiren işlerde Erfolg (sınav, görüşme), şansa bağlı işlerde Glück dilenir. Sanatçıya ise ters bir kalıp: Toi, toi, toi.","tr":"Başarılar! / Bol şans!","s":"Viel Erfolg bei der Prüfung morgen!","st":"Yarınki sınavda başarılar!","f":"der Erfolg (başarı) · das Glück (şans) · Daumen drücken (şans dilemek)"},{"w":"Gute Besserung!","t":"Dilek kalıbı","k":"gut + Besserung (iyileşme)","c":"—","br":"Hasta olana söylenir. Yakın kalıplar: Werde schnell wieder gesund, Erhol dich gut (iyi dinlen), baldige Genesung (resmî yazıda).","tr":"Geçmiş olsun!","s":"Gute Besserung — ruh dich richtig aus!","st":"Geçmiş olsun — iyice dinlen!","f":"die Besserung (düzelme) · sich erholen (dinlenmek) · die Genesung (şifa)"},{"w":"Herzlichen Glückwunsch!","t":"Dilek kalıbı","k":"Glück + Wunsch (dilek)","c":"—","br":"Doğum günü ve başarı için standart tebrik. Alles Gute daha kısa ve geniş kapsamlıdır: her iyi dilek için kullanılır.","tr":"Tebrikler! / Kutlarım!","s":"Herzlichen Glückwunsch zum Geburtstag!","st":"Doğum günün kutlu olsun!","f":"gratulieren (tebrik etmek) · alles Gute (her şey gönlünce) · der Wunsch (dilek)"},{"w":"Es tut mir leid.","t":"Özür kalıbı","k":"leid tun (acı vermek) + Dativ","c":"—","br":"leid eski Almancada acı, keder demektir; tun ise yapmak. Kelimesi kelimesine „bana acı veriyor“. Bu yüzden hem özür hem üzüntü bildirir. Sorumluluk almak için farklı kelime kullanılır: Entschuldigung ya da Verzeihung.","tr":"Üzgünüm / Kusura bakma","s":"Es tut mir leid, das war mein Fehler.","st":"Üzgünüm, benim hatamdı.","f":"die Entschuldigung (özür) · bedauern (üzülmek) · Verzeihung (affedersiniz)"},{"w":"Schade!","t":"Duygu kalıbı","k":"der Schaden (zarar) kökünden","c":"—","br":"„Yazık oldu“: kaçırılan fırsata verilen tepki. Genişletilmiş hâli: Schade, dass du nicht kommen kannst.","tr":"Yazık! Ne yazık!","s":"Schade, dass es nicht geklappt hat.","st":"Yazık, olmadı.","f":"der Schaden (zarar) · leider (maalesef) · bedauerlich (üzücü)"},{"w":"Na klar! / Klar doch!","t":"Onay kalıbı","k":"na + klar (elbette)","c":"—","br":"Vurgulu evet: „tabii ki“. Resmî hâli: Selbstverständlich. Tereddütlü onay ise: Meinetwegen (bence sakıncası yok, isteksiz onay).","tr":"Tabii ki! Elbette!","s":"Kannst du mich mitnehmen? — Na klar!","st":"Beni de alabilir misin? — Tabii ki!","f":"selbstverständlich (elbette) · natürlich (doğal olarak) · meinetwegen (bana göre hava hoş)"},{"w":"Kein Wunder.","t":"Değerlendirme kalıbı","k":"kein + Wunder (mucize)","c":"—","br":"„Şaşılacak bir şey yok“ = normal, beklenirdi. Karşıtı: Kein Wunder, dass … kalıbı sebebi hemen ekler.","tr":"Şaşılacak bir şey değil","s":"Kein Wunder, dass du müde bist — du hast kaum geschlafen.","st":"Yorgun olmana şaşmamalı — neredeyse hiç uyumadın.","f":"das Wunder (mucize) · logisch (mantıklı) · verständlich (anlaşılır)"},{"w":"Das kommt darauf an.","t":"Konuşma kalıbı","k":"ankommen auf (bağlı olmak)","c":"—","br":"„Duruma bağlı“: kesin cevap vermeden zaman kazandıran kalıp. Kısaltılmışı tek kelimeyle: Kommt drauf an. Devamı genelde ob ile gelir.","tr":"Duruma bağlı","s":"Kommt drauf an, wann du da sein musst.","st":"Ne zaman orada olman gerektiğine bağlı.","f":"ankommen auf (bağlı olmak) · je nachdem (duruma göre) · abhängen von (…e bağlı)"},{"w":"Ich melde mich.","t":"Kapanış kalıbı","k":"sich melden (haber vermek)","c":"—","br":"„Haber veririm“: görüşmeyi kapatırken bağı açık bırakır. Netleştirmek için zaman eklenir: Ich melde mich morgen.","tr":"Haber veririm","s":"Ich schaue nach und melde mich heute Abend.","st":"Bakıp bu akşam haber veririm.","f":"sich melden (haber vermek) · Bescheid geben (bilgi vermek) · zurückrufen (geri aramak)"},{"w":"Guten Appetit! / Prost!","t":"Sofra kalıpları","k":"Appetit (iştah) / prosit (faydası olsun)","c":"—","br":"Yemeğe başlarken Guten Appetit, kadeh kaldırırken Prost ya da Zum Wohl. Prost’un kökü Latince prosit: „faydalı olsun“ — Türkçedeki „afiyet olsun“ ile aynı fikir.","tr":"Afiyet olsun! / Şerefe!","s":"Guten Appetit! — Danke, gleichfalls.","st":"Afiyet olsun! — Teşekkürler, size de.","f":"gleichfalls (size de) · das Wohl (sağlık, esenlik) · anstoßen (kadeh tokuşturmak)"}]},{"n":"Deyimler: gündelik mantık","e":"her deyimin arkasındaki somut sahne","c":"#b5502e","g":"Deyimler","cards":[{"w":"den Faden verlieren","t":"Redewendung","k":"Faden (iplik) + verlieren (kaybetmek)","c":"verliert – verlor – hat verloren","br":"Dokuma tezgâhından gelir: elindeki ipliği kaybeden dokumacı işi sürdüremez. Konuşurken sözün ipini kaybetmek.","tr":"konuşurken kopmak, ipin ucunu kaçırmak","s":"Bei der Präsentation habe ich kurz den Faden verloren.","st":"Sunumda kısa süre ipin ucunu kaçırdım.","f":"der rote Faden (ana çizgi) · der Faden (iplik) · anknüpfen an (…e bağlanmak)"},{"w":"ins Wasser fallen","t":"Redewendung","k":"Wasser (su) + fallen (düşmek)","c":"fällt – fiel – ist gefallen","br":"Suya düşen şey kaybolur, geri alınamaz. Plan için: gerçekleşmeden yok olmak. Türkçedeki „suya düştü“ ile birebir aynı imge.","tr":"suya düşmek, iptal olmak","s":"Der Wandertag ist wegen des Sturms ins Wasser gefallen.","st":"Gezi günü fırtına yüzünden suya düştü.","f":"ausfallen (iptal olmak) · platzen (bozulmak, patlamak) · scheitern (başarısız olmak)"},{"w":"unter den Tisch fallen","t":"Redewendung","k":"unter + Tisch (masa) + fallen","c":"fällt – fiel – ist gefallen","br":"Masanın altına düşen şey görülmez, kimse almaz. Gündemden düşüp unutulan konu.","tr":"göz ardı edilmek, es geçilmek","s":"Dieser Punkt darf bei der Sitzung nicht unter den Tisch fallen.","st":"Bu nokta toplantıda es geçilmemeli.","f":"übergehen (atlamak) · vernachlässigen (ihmal etmek) · der Tisch (masa)"},{"w":"aus dem Ruder laufen","t":"Redewendung","k":"Ruder (dümen, kürek) + laufen","c":"läuft – lief – ist gelaufen","br":"Dümenden çıkan tekne kontrolden çıkar. Süreç için: kontrolü kaybetmek.","tr":"kontrolden çıkmak, çığırından çıkmak","s":"Die Kosten sind völlig aus dem Ruder gelaufen.","st":"Masraflar tamamen kontrolden çıktı.","f":"das Ruder (dümen) · außer Kontrolle geraten (kontrolden çıkmak) · eskalieren (tırmanmak)"},{"w":"den Rahmen sprengen","t":"Redewendung","k":"Rahmen (çerçeve) + sprengen (patlatmak)","c":"sprengt – sprengte – hat gesprengt","br":"İçeriğin çerçeveyi patlatması = ayrılan yere sığmaması. Sunum ve yazıda kibar bir sınır ifadesi.","tr":"kapsamı aşmak, sınırı zorlamak","s":"Eine vollständige Erörterung würde hier den Rahmen sprengen.","st":"Konunun tümüyle tartışılması burada kapsamı aşardı.","f":"der Rahmen (çerçeve) · im Rahmen von (…çerçevesinde) · überschreiten (aşmak)"},{"w":"auf die lange Bank schieben","t":"Redewendung","k":"lange Bank (uzun sıra) + schieben (itmek)","c":"schiebt – schob – hat geschoben","br":"Eski mahkemelerde dosyalar uzun sandık-sıraların içine konurdu; oraya itilen dosyaya aylarca bakılmazdı. Bugün: sürüncemede bırakmak.","tr":"sürüncemede bırakmak, ertelemek","s":"Schieb den Zahnarzttermin nicht wieder auf die lange Bank.","st":"Diş hekimi randevusunu yine sürüncemede bırakma.","f":"aufschieben (ertelemek) · verschleppen (sürüncemeye sokmak) · die Bank (sıra, bank)"},{"w":"Hand und Fuß haben","t":"Redewendung","k":"Hand (el) + Fuß (ayak) + haben","c":"hat – hatte – hat gehabt","br":"Hand el, Fuß ayaktır: eli ayağı tam olan iş görür. Ortaçağ imgesi, tam ve işlevsel olanı anlatır. Bugün plan ve gerekçeler için kullanılır; /* ---------- storage (window.storage, fallback: bellek) ---------- */
const mem = {};
const hasWS = (typeof window !== "undefined") && window.storage && typeof window.storage.get === "function";
let hasLS = false;
try { localStorage.setItem("wl-test","1"); localStorage.removeItem("wl-test"); hasLS = true; } catch(e) { hasLS = false; }
async function sget(k){
  if(hasWS){ try{ const r = await window.storage.get(k); if(r) return JSON.parse(r.value); }catch(e){} }
  if(hasLS){ try{ const v = localStorage.getItem(k); if(v !== null) return JSON.parse(v); }catch(e){} }
  return mem[k] || null;
}
async function sset(k,v){
  mem[k]=v;
  if(hasWS){ try{ await window.storage.set(k, JSON.stringify(v)); }catch(e){} }
  if(hasLS){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
}

let done = {}, star = {}, day = { d:'', n:0, r:0 }, goal = 20;
const DAY = 86400000;
const STEPS = [1, 3, 7, 16, 35, 70];
const lvl = id => (done[id] && done[id].n) ? done[id].n : (done[id] ? 1 : 0);
const stamp = id => (done[id] && done[id].t) ? done[id].t : 0;
const isDone = id => !!done[id];
const nextDue = id => stamp(id) + STEPS[Math.min(lvl(id), STEPS.length) - 1] * DAY;
const isDue = id => isDone(id) && Date.now() >= nextDue(id);
const daysLeft = id => Math.ceil((nextDue(id) - Date.now())/DAY);
const plural = n => n + " gün";
function srsText(id){
  if(!isDone(id)) return "Henüz çevrilmedi · karta dokununca çalışıldı sayılır";
  const d = daysLeft(id), n = lvl(id);
  if(d <= 0) return "<b>Tekrar zamanı geldi</b> · seviye "+n+"/"+STEPS.length;
  return "Sonraki tekrar: <b>"+plural(d)+" sonra</b> · seviye "+n+"/"+STEPS.length;
}
function toast(msg){
  const t = el("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(window._tt); window._tt = setTimeout(()=>t.classList.remove("on"), 1800);
}
const today = () => new Date().toISOString().slice(0,10);
async function logToday(isNew){
  if(day.d !== today()) day = { d: today(), n: 0, r: 0 };
  if(isNew) day.n++; else day.r = (day.r||0) + 1;
  await sset("wl-day", day);
}
function migrate(){ Object.keys(done).forEach(k=>{ if(done[k]===true) done[k]={n:1,t:0}; }); }
