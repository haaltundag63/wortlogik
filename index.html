 demektir: engelden arınmışlık = erişilebilirlik. Yalnızca rampa değil, dijital erişim de bu kapsamdadır.","tr":"engelsiz erişim","s":"Die neue Website erfüllt die Anforderungen an Barrierefreiheit.","st":"Yeni site engelsiz erişim koşullarını karşılıyor.","f":"barrierefrei (engelsiz) · frei (serbest) · zugänglich (erişilebilir)"},{"w":"die Datensicherung","t":"Nomen, -en","k":"Daten + Sicherung (sichern: güvence altına almak)","c":"die Datensicherung, -en","br":"Sicherung hem yedekleme hem elektrik sigortasıdır: ikisi de „güvenceye alma“ demektir. Yedek = die Sicherungskopie.","tr":"veri yedekleme","s":"Die Datensicherung erfolgt automatisch jede Nacht.","st":"Veri yedekleme her gece otomatik yapılıyor.","f":"sichern (güvence altına almak) · sicher (güvenli) · die Sicherungskopie (yedek kopya)"},{"w":"der Bildschirm","t":"Nomen, -e","k":"Bild (görüntü) + Schirm (şemsiye, siper)","c":"der Bildschirm, die Bildschirme","br":"Schirm = siper, örtü (bkz. Regenschirm). „Görüntü siperi“ = ekran. Almanca yabancı kelime yerine kendi parçalarını birleştirmeyi sever.","tr":"ekran","s":"Bitte teilen Sie kurz Ihren Bildschirm.","st":"Lütfen kısaca ekranınızı paylaşın.","f":"das Bild (görüntü) · der Schirm (siper) · der Bildschirmarbeitsplatz (ekran başı çalışma yeri)"},{"w":"die Störung","t":"Nomen, -en","k":"stören (rahatsız etmek) + -ung","c":"die Störung, die Störungen","br":"Akışın bozulması: teknikte arıza, derste rahatsız etme, iletişimde kesinti. Aynı kelime her üç alanda da „düzenin bozulması“nı anlatır.","tr":"arıza, kesinti; rahatsız etme","s":"Wegen einer technischen Störung ist das Portal derzeit nicht erreichbar.","st":"Teknik bir arıza nedeniyle portala şu an erişilemiyor.","f":"stören (rahatsız etmek) · die Betriebsstörung (işletme arızası) · beheben (gidermek)"}]},{"n":"Yolculuk ve ulaşım dili","e":"Anschluss, Ermäßigung, Umleitung, Gleis…","c":"#357266","g":"Hukuk & idare dili","cards":[{"w":"der Anschluss","t":"Nomen, ¨-e","k":"an + schließen (bağlamak)","c":"der Anschluss, die Anschlüsse","br":"Bağlantı: aktarmalı yolculukta yetişilecek sonraki araç; teknikte priz, hat. Kalıp: den Anschluss verpassen — aktarmayı kaçırmak.","tr":"aktarma bağlantısı; bağlantı","s":"In Köln haben Sie nur acht Minuten für den Anschluss.","st":"Köln’de aktarma için yalnızca sekiz dakikanız var.","f":"anschließen (bağlamak) · verpassen (kaçırmak) · anschließend (ardından)"},{"w":"das Gleis","t":"Nomen, -e","k":"eski: geleise, tekerlek izi","c":"das Gleis, die Gleise","br":"Tekerleğin bıraktığı iz → ray. Peron numarası Almanya’da Gleis ile verilir: Gleis 7. Mecaz: aus dem Gleis geraten — raydan çıkmak.","tr":"peron, ray","s":"Der Zug fährt heute ausnahmsweise von Gleis 11 ab.","st":"Tren bugün istisnai olarak 11. perondan kalkıyor.","f":"der Bahnsteig (peron alanı) · die Abfahrt (kalkış) · entgleisen (raydan çıkmak)"},{"w":"die Ermäßigung","t":"Nomen, -en","k":"er + Maß (ölçü) + -igen + -ung","c":"die Ermäßigung, -en","br":"Ölçüyü aşağı çekmek = indirim. Rabatt ticari pazarlıktır, Ermäßigung ise bir sıfata bağlı resmî indirimdir: öğrenci, emekli, engelli.","tr":"indirim (statüye bağlı)","s":"Mit dem Schülerausweis erhalten Sie eine Ermäßigung von 50 Prozent.","st":"Öğrenci kartıyla yüzde 50 indirim alıyorsunuz.","f":"ermäßigt (indirimli) · das Maß (ölçü) · der Rabatt (iskonto)"},{"w":"der Zuschlag","t":"Nomen, ¨-e","k":"zu + Schlag (schlagen: vurmak)","c":"der Zuschlag, die Zuschläge","br":"Fiyatın üstüne „vurulan“ ek = ek ücret. İhalede aynı kelime „ihalenin verilmesi“ demektir: den Zuschlag erhalten.","tr":"ek ücret, fark","s":"Für den ICE ist ein Zuschlag zu zahlen.","st":"ICE için ek ücret ödenmesi gerekiyor.","f":"die Zuzahlung (katkı payı) · der Aufpreis (fiyat farkı) · den Zuschlag erhalten (ihaleyi kazanmak)"},{"w":"die Umleitung","t":"Nomen, -en","k":"um (etrafından) + leiten (yönlendirmek) + -ung","c":"die Umleitung, -en","br":"Trafiği başka yöne yönlendirme = alternatif güzergâh. Sarı „U“ levhaları bunu gösterir.","tr":"alternatif güzergâh, sapak","s":"Wegen der Baustelle gilt eine großräumige Umleitung.","st":"Şantiye nedeniyle geniş çaplı bir alternatif güzergâh geçerli.","f":"leiten (yönlendirmek) · die Baustelle (şantiye) · die Sperrung (kapatma)"},{"w":"der Schienenersatzverkehr","t":"Nomen (çoğulsuz)","k":"Schiene (ray) + Ersatz (yedek) + Verkehr (ulaşım)","c":"der Schienenersatzverkehr","br":"Üç parçalı bileşik, sağdan sola çözülür: ulaşım → neyin yerine? → rayın yerine. Yani tren yerine otobüs. Kısaltması: SEV.","tr":"tren yerine otobüs seferi","s":"Zwischen Aachen und Herzogenrath fährt am Wochenende Schienenersatzverkehr.","st":"Hafta sonu Aachen ile Herzogenrath arasında tren yerine otobüs çalışıyor.","f":"der Ersatz (yedek, ikame) · der Verkehr (trafik, ulaşım) · die Schiene (ray)"},{"w":"die Entwertung","t":"Nomen, -en","k":"ent + Wert (değer) + -ung","c":"die Entwertung, -en","br":"Bileti değerinden etmek = damgalamak. Kullanılmış hâle getirmeden binmek kaçak sayılır. Ekonomide aynı kelime: değer kaybı.","tr":"bilet damgalama; değer kaybı","s":"Ohne Entwertung gilt der Fahrschein als ungültig.","st":"Damgalanmayan bilet geçersiz sayılır.","f":"entwerten (damgalamak) · der Wert (değer) · der Fahrschein (bilet)"},{"w":"die Fahrgemeinschaft","t":"Nomen, -en","k":"fahren (gitmek) + Gemeinschaft (topluluk)","c":"die Fahrgemeinschaft, -en","br":"Birlikte gitme topluluğu = araç paylaşımı. -gemeinschaft eki ortaklık kurar: Wohngemeinschaft (WG), Erbengemeinschaft (miras ortaklığı).","tr":"araç paylaşımı, ortak yolculuk","s":"Für den Weg zur Schule haben wir eine Fahrgemeinschaft gebildet.","st":"Okula gidiş için bir araç paylaşımı kurduk.","f":"die Gemeinschaft (topluluk) · die Wohngemeinschaft (ev arkadaşlığı) · gemeinsam (ortak)"},{"w":"der Stau","t":"Nomen, -s","k":"stauen (biriktirmek, tıkamak)","c":"der Stau, die Staus","br":"stauen = suyu bentle biriktirmek (bkz. der Stausee: baraj gölü). Trafikte birikmiş araç kütlesi = tıkanıklık.","tr":"trafik sıkışıklığı","s":"Auf der A44 stehen wir seit zwanzig Minuten im Stau.","st":"A44 otoyolunda yirmi dakikadır trafikte duruyoruz.","f":"stauen (biriktirmek) · der Stausee (baraj gölü) · stockender Verkehr (ağır ilerleyen trafik)"},{"w":"die Verkehrsberuhigung","t":"Nomen, -en","k":"Verkehr + Ruhe (sakinlik) + -igung","c":"die Verkehrsberuhigung, -en","br":"Trafiği „sakinleştirme“: hız düşürücü önlemler. Verkehrsberuhigter Bereich levhası yürüyüş hızını (Schrittgeschwindigkeit) zorunlu kılar.","tr":"trafik sakinleştirme (yavaşlatma)","s":"In verkehrsberuhigten Bereichen gilt Schrittgeschwindigkeit.","st":"Trafiğin sakinleştirildiği bölgelerde yürüyüş hızı geçerlidir.","f":"die Ruhe (sakinlik) · beruhigen (sakinleştirmek) · die Schrittgeschwindigkeit (yürüyüş hızı)"},{"w":"die Vorfahrt","t":"Nomen (çoğulsuz)","k":"vor (önde) + Fahrt (gidiş)","c":"die Vorfahrt","br":"Önce gitme hakkı = geçiş üstünlüğü. Kalıp: die Vorfahrt beachten / missachten — bu ihlal kaza sorumluluğunu doğrudan belirler.","tr":"geçiş üstünlüğü","s":"Er hat die Vorfahrt missachtet und den Unfall verursacht.","st":"Geçiş üstünlüğünü ihlal edip kazaya sebep oldu.","f":"die Fahrt (gidiş) · Vorfahrt gewähren (yol vermek) · missachten (hiçe saymak)"},{"w":"die Ladesäule","t":"Nomen, -n","k":"laden (şarj etmek, yüklemek) + Säule (sütun, direk)","c":"die Ladesäule, -n","br":"Yükleme direği = şarj istasyonu. laden aynı anda „yüklemek, davet etmek, şarj etmek“ demektir; bağlam ayırır.","tr":"şarj istasyonu","s":"Vor dem Rathaus wurden zwei Ladesäulen installiert.","st":"Belediye önüne iki şarj istasyonu kuruldu.","f":"laden (yüklemek; şarj etmek) · die Säule (sütun) · der Ladevorgang (şarj işlemi)"},{"w":"die Mitfahrgelegenheit","t":"Nomen, -en","k":"mit + fahren + Gelegenheit (fırsat)","c":"die Mitfahrgelegenheit, -en","br":"Birlikte gitme fırsatı. Gelegenheit, liegen kökünden: „önüne çıkan durum“ = fırsat. Uzun ama şeffaf bir bileşik.","tr":"araca ortak binme imkânı","s":"Über die App findet man leicht eine Mitfahrgelegenheit nach Köln.","st":"Uygulama üzerinden Köln’e giden bir araç kolayca bulunuyor.","f":"die Gelegenheit (fırsat) · mitfahren (birlikte gitmek) · gelegentlich (ara sıra)"},{"w":"die Verspätungsmeldung","t":"Nomen, -en","k":"Verspätung + s + Meldung","c":"die Verspätungsmeldung, -en","br":"Fugen-s kuralı yine iş başında (-ung → -s). Gecikme bildirimi; tazminat talebinde (Fahrgastrechte) dayanak olur.","tr":"gecikme bildirimi","s":"Für die Erstattung benötigen Sie eine Verspätungsmeldung der Bahn.","st":"İade için demiryolundan bir gecikme bildirimi gerekiyor.","f":"die Verspätung (rötar) · die Meldung (bildirim) · die Erstattung (iade)"}]},{"n":"Ekonomi ve iş dili","e":"Umsatz, Rendite, Bilanz, Insolvenz…","c":"#2d6a4f","g":"Hukuk & idare dili","cards":[{"w":"der Umsatz","t":"Nomen, ¨-e","k":"um + Satz (setzen: koymak)","c":"der Umsatz, die Umsätze","br":"umsetzen = malı paraya çevirmek, dönüştürmek. Dönen toplam para = ciro. Kâr değildir: masraflar henüz düşülmemiştir.","tr":"ciro, satış hasılatı","s":"Der Umsatz ist im letzten Quartal um acht Prozent gestiegen.","st":"Ciro son çeyrekte yüzde sekiz arttı.","f":"umsetzen (paraya çevirmek; hayata geçirmek) · die Umsatzsteuer (KDV) · der Gewinn (kâr)"},{"w":"der Gewinn","t":"Nomen, -e","k":"gewinnen (kazanmak)","c":"der Gewinn, die Gewinne","br":"Kazanılan şey: masraflar düşüldükten sonra kalan = kâr; ayrıca piyangoda ikramiye. Karşıtı der Verlust.","tr":"kâr; kazanç, ikramiye","s":"Nach Abzug aller Kosten bleibt ein bescheidener Gewinn.","st":"Tüm masraflar düşüldükten sonra mütevazı bir kâr kalıyor.","f":"gewinnen (kazanmak) · der Verlust (zarar) · gewinnbringend (kâr getiren)"},{"w":"die Rendite","t":"Nomen, -n","k":"İtalyanca rendita (getiri) — reddere: geri vermek","c":"die Rendite, die Renditen","br":"Yatırılan paranın geri verdiği oran = getiri. Gewinn mutlak tutardır, Rendite orandır — bu ayrım yatırım dilinin temelidir.","tr":"getiri oranı","s":"Die Rendite liegt derzeit bei knapp drei Prozent.","st":"Getiri şu anda yüzde üçün biraz altında.","f":"der Ertrag (getiri) · die Anlage (yatırım) · das Risiko (risk)"},{"w":"der Vertrieb","t":"Nomen, -e","k":"ver + treiben (sürmek)","c":"der Vertrieb, die Vertriebe","br":"vertreiben = malı piyasaya sürmek. Ürünü müşteriye ulaştıran birim = satış, dağıtım. Aynı fiilin ikinci anlamı „kovmak“tır — ikisi de „sürmek“ten.","tr":"satış ve dağıtım (birimi)","s":"Der Vertrieb läuft überwiegend über den Online-Handel.","st":"Satış ağırlıklı olarak çevrimiçi ticaret üzerinden yürüyor.","f":"vertreiben (piyasaya sürmek; kovmak) · der Handel (ticaret) · der Absatz (satış, sürüm)"},{"w":"die Verbindlichkeit","t":"Nomen, -en","k":"ver + binden (bağlamak) + -lich + -keit","c":"die Verbindlichkeit, -en","br":"Kişiyi bağlayan şey: çoğulda borçlar, tekilde bağlayıcılık ya da nezaket. Üç anlam da „bağ“ imgesinden çıkar.","tr":"borç, yükümlülük; bağlayıcılık","s":"Die Verbindlichkeiten übersteigen das Vermögen des Unternehmens.","st":"Borçlar şirketin varlığını aşıyor.","f":"verbindlich (bağlayıcı; nazik) · unverbindlich (bağlayıcı olmayan) · binden (bağlamak)"},{"w":"die Rücklage","t":"Nomen, -n","k":"zurück (geri) + legen (koymak)","c":"die Rücklage, -n","br":"etwas zurücklegen = kenara koymak. Kenara konan para = yedek akçe, birikim. Apartman yönetiminde Instandhaltungsrücklage şarttır.","tr":"yedek akçe, ihtiyat fonu","s":"Für größere Reparaturen besteht eine Rücklage.","st":"Büyük tamiratlar için bir yedek fon var.","f":"zurücklegen (kenara koymak) · die Ersparnis (tasarruf) · die Instandhaltungsrücklage (bakım fonu)"},{"w":"die Bilanz","t":"Nomen, -en","k":"bilancia (terazi — bi: iki + lanx: kefe)","c":"die Bilanz, die Bilanzen","br":"İki kefeli terazi: bir yanda varlık, öbür yanda borç. İki taraf eşit olmak zorundadır. Mecazî olarak: bir dönemin değerlendirmesi.","tr":"bilanço; genel değerlendirme","s":"Die Bilanz des Schuljahres fällt insgesamt positiv aus.","st":"Okul yılının genel bilançosu olumlu.","f":"bilanzieren (bilanço çıkarmak) · Bilanz ziehen (değerlendirme yapmak) · die Waage (terazi)"},{"w":"der Vorstand","t":"Nomen, ¨-e","k":"vor (önde) + Stand (stehen: durmak)","c":"der Vorstand, die Vorstände","br":"Kurumun önünde duran organ = yönetim kurulu. Aufsichtsrat ise onu denetleyen kuruldur: biri yönetir, öbürü gözetir.","tr":"yönetim kurulu","s":"Der Vorstand des Vereins wird alle zwei Jahre gewählt.","st":"Derneğin yönetim kurulu iki yılda bir seçiliyor.","f":"vorstehen (başında olmak) · der Aufsichtsrat (denetim kurulu) · der Vorsitzende (başkan)"},{"w":"die Branche","t":"Nomen, -n","k":"Fransızca branche: dal","c":"die Branche, die Branchen","br":"Ekonominin bir dalı = sektör. Almanca eşdeğeri der Zweig aynı imgeyi taşır: dal.","tr":"sektör, iş kolu","s":"In dieser Branche herrscht ein starker Fachkräftemangel.","st":"Bu sektörde ciddi bir nitelikli eleman açığı var.","f":"der Zweig (dal) · der Sektor (sektör) · branchenüblich (sektörde alışılmış)"},{"w":"der Wettbewerb","t":"Nomen, -e","k":"Wette (bahis) + werben (çabalamak, kazanmaya çalışmak)","c":"der Wettbewerb, die Wettbewerbe","br":"werben eskiden „uğraşmak, elde etmeye çalışmak“ demekti (bugün: reklam yapmak). Karşılıklı uğraş = rekabet; okulda: yarışma.","tr":"rekabet; yarışma","s":"Der Wettbewerb unter den Anbietern hält die Preise niedrig.","st":"Sağlayıcılar arasındaki rekabet fiyatları düşük tutuyor.","f":"werben (reklam yapmak) · die Konkurrenz (rekabet) · wettbewerbsfähig (rekabet edebilir)"},{"w":"die Konjunktur","t":"Nomen, -en","k":"con (birlikte) + iungere (bağlamak) → birlikte seyir","c":"die Konjunktur, die Konjunkturen","br":"Etkenlerin birlikte oluşturduğu genel gidiş = ekonomik konjonktür. Aynı kökten Konjunktion (bağlaç), Konjunktiv (bağlanmış kip).","tr":"konjonktür, ekonomik gidişat","s":"Die Konjunktur hat sich zuletzt spürbar abgekühlt.","st":"Konjonktür son dönemde gözle görülür şekilde soğudu.","f":"konjunkturell (konjonktürel) · der Aufschwung (canlanma) · die Rezession (durgunluk)"},{"w":"die Investition","t":"Nomen, -en","k":"in (içine) + vestire (giydirmek)","c":"die Investition, die Investitionen","br":"Latince „giydirmek“: parayı bir işin üstüne giydirmek = ona bağlamak. Almanca eşdeğeri die Anlage: bir yere konulan para.","tr":"yatırım","s":"Die Investition amortisiert sich nach etwa sieben Jahren.","st":"Yatırım yaklaşık yedi yılda kendini amorti ediyor.","f":"investieren (yatırım yapmak) · die Anlage (yatırım) · sich amortisieren (kendini ödemek)"},{"w":"die Insolvenz","t":"Nomen, -en","k":"in (…değil) + solvere (çözmek, ödemek)","c":"die Insolvenz, die Insolvenzen","br":"solvere = borcu çözüp ödemek (bkz. zahlungsfähig: solvent). in- olumsuzlar: ödeyememe = iflas.","tr":"iflas, ödeme aczi","s":"Das Unternehmen hat Insolvenz angemeldet.","st":"Şirket iflas başvurusunda bulundu.","f":"insolvent (aciz, iflas etmiş) · solvent (ödeme gücü olan) · die Zahlungsunfähigkeit (ödeme aczi)"},{"w":"der Anteil","t":"Nomen, -e","k":"an + Teil (parça)","c":"der Anteil, die Anteile","br":"Teil parçadır; an- onu bir bütüne bağlar: bütünden birine düşen parça. Şirkette hisse, hesapta oran, katılımda pay. Aileden anteilig (pay oranında), die Beteiligung (katılım), teilen (bölmek).","tr":"pay, hisse; oran","s":"Der Anteil der Heizkosten beträgt fast die Hälfte der Nebenkosten.","st":"Isıtma giderlerinin payı yan giderlerin neredeyse yarısı.","f":"anteilig (pay oranında) · der Teil (parça) · die Beteiligung (katılım, pay)"}]},{"n":"Okul dili: değerlendirme ve not","e":"Leistung, Zeugnis, Versetzung, Förderung…","c":"#2b7a78","g":"Okul & öğretim dili","cards":[{"w":"die Leistung","t":"Nomen, -en","k":"leisten (yerine getirmek) + -ung","c":"die Leistung, die Leistungen","br":"leisten = bir işi fiilen yapıp ortaya koymak. Ortaya konan şey = performans. Aynı kelime hukukta „edim“, teknikte „güç“ demektir — hepsi „ortaya konan iş“ imgesinden.","tr":"başarı, performans","s":"Die Leistungen haben sich im zweiten Halbjahr deutlich verbessert.","st":"Başarı ikinci yarıyılda belirgin şekilde iyileşti.","f":"leisten (yapmak, sunmak) · leistungsstark (başarılı) · die Leistungsbereitschaft (çaba gösterme isteği)","m":[{"tr":"edim, hizmet (hukuk/ekonomi)","s":"Die vertraglich geschuldete Leistung wurde nicht erbracht.","st":"Sözleşmeyle borçlanılan edim yerine getirilmedi."}]},{"w":"das Zeugnis","t":"Nomen, -se","k":"zeugen (tanıklık etmek) + -nis","c":"das Zeugnis, die Zeugnisse","br":"Zeuge = tanık. Bir başarıya tanıklık eden belge = karne, sertifika, bonservis. Aynı kökten überzeugen: kanıtla tanık kılmak.","tr":"karne; belge, bonservis","s":"Das Zeugnis wird am letzten Schultag ausgegeben.","st":"Karne okulun son gününde veriliyor.","f":"der Zeuge (tanık) · überzeugen (ikna etmek) · das Arbeitszeugnis (bonservis)"},{"w":"die Versetzung","t":"Nomen, -en","k":"ver + setzen (koymak) + -ung","c":"die Versetzung, die Versetzungen","br":"Öğrenciyi bir üst sınıfa „koymak“ = sınıf geçirme. Aynı kelime memur için „başka yere atama“ demektir; ikisi de yer değiştirmedir.","tr":"sınıf geçme","s":"Die Versetzung ist in diesem Fall nicht gefährdet.","st":"Bu durumda sınıf geçme tehlikede değil.","f":"versetzen (nakletmek, sınıf geçirmek) · versetzungsgefährdet (sınıfta kalma riski olan) · der Sitz (yer)","m":[{"tr":"(görev) nakli, tayin","s":"Er hat eine Versetzung an eine andere Schule beantragt.","st":"Başka bir okula tayin talebinde bulundu."}]},{"w":"die Klassenarbeit","t":"Nomen, -en","k":"Klasse (sınıf) + Arbeit (çalışma)","c":"die Klassenarbeit, -en","br":"Sınıfça yazılan değerlendirme = yazılı sınav. Üst kademede aynı işe Klausur denir; Test ise kısa ve genelde nota daha az etkilidir.","tr":"yazılı sınav","s":"Die Klassenarbeit wird nächste Woche zurückgegeben.","st":"Yazılı sınav gelecek hafta iade edilecek.","f":"die Klausur (yazılı sınav, üst kademe) · der Test (kısa sınav) · die Arbeit (iş, çalışma)"},{"w":"die Klausur","t":"Nomen, -en","k":"clausura (kapatılmış yer — claudere: kapatmak)","c":"die Klausur, die Klausuren","br":"Latince claudere kapatmaktır, clausura ise kapalı ortam (bkz. die Klausel: sözleşmede kapalı madde, inklusive: içine kapatılmış). Yani dış yardıma kapalı koşullarda yazılan sınav. Aynı kökten die Inklusion ve exklusiv.","tr":"yazılı sınav","s":"Die Klausur dauert 180 Minuten und ist ohne Hilfsmittel zu schreiben.","st":"Sınav 180 dakika sürüyor ve yardımcı araçsız yazılacak.","f":"die Klausel (madde, şart) · ausschließen (hariç tutmak) · die Aufsicht (gözetim)"},{"w":"der Notendurchschnitt","t":"Nomen, -e","k":"Note (not) + durch (boyunca) + Schnitt (schneiden: kesmek)","c":"der Notendurchschnitt, -e","br":"Durchschnitt = „ortadan kesen çizgi“ = ortalama. Almanca ortalamayı bir kesit imgesiyle kurar.","tr":"not ortalaması","s":"Für den Kurs ist ein Notendurchschnitt von 2,5 erforderlich.","st":"Kurs için 2,5 not ortalaması gerekiyor.","f":"durchschnittlich (ortalama olarak) · der Schnitt (kesit) · die Note (not)"},{"w":"die Mitarbeit","t":"Nomen (çoğulsuz)","k":"mit (birlikte) + Arbeit","c":"die Mitarbeit","br":"Derse birlikte çalışarak katılma = sözlü katılım. Almanya’da nota büyük ölçüde bu kalem üzerinden etki eder.","tr":"derse katılım","s":"Die mündliche Mitarbeit fließt zu 50 Prozent in die Note ein.","st":"Sözlü katılım nota yüzde 50 oranında yansıyor.","f":"mitarbeiten (birlikte çalışmak) · der Mitarbeiter (çalışan) · die Beteiligung (katılım)"},{"w":"sitzen bleiben","t":"Verb","k":"sitzen (oturmak) + bleiben (kalmak)","c":"bleibt sitzen – blieb sitzen – ist sitzen geblieben","br":"Aynı sırada oturmaya devam etmek = sınıf tekrarı. Yeni imlada ayrı yazılır (sitzen bleiben); resmî dili ise: die Klasse wiederholen.","tr":"sınıfta kalmak","s":"Zwei Schüler sind in diesem Jahr sitzen geblieben.","st":"Bu yıl iki öğrenci sınıfta kaldı.","f":"die Klasse wiederholen (sınıf tekrarlamak) · der Sitzenbleiber (sınıfta kalan) · die Versetzung (sınıf geçme)"},{"w":"die Förderung","t":"Nomen, -en","k":"fördern (ilerletmek) + -ung","c":"die Förderung, die Förderungen","br":"fördern madencilikten gelir: cevheri yukarı çıkarmak. Öğrencide: içindeki potansiyeli yukarı çıkarmak = destekleme. Karşıtı fordern (talep etmek) ile karıştırma.","tr":"destekleme, geliştirme","s":"Jedes Kind hat Anspruch auf individuelle Förderung.","st":"Her çocuğun bireysel destek alma hakkı vardır.","f":"fördern (desteklemek) · fordern (talep etmek) · der Förderbedarf (destek ihtiyacı)","m":[{"tr":"hibe, mali destek","s":"Das Projekt erhält eine Förderung des Landes.","st":"Proje eyaletten mali destek alıyor."}]},{"w":"der Nachteilsausgleich","t":"Nomen, -e","k":"Nachteil (dezavantaj) + Ausgleich (aus+gleich: eşitleme)","c":"der Nachteilsausgleich, -e","br":"Dezavantajı dengeleyerek eşit koşul sağlamak: örneğin ek süre. Amaç kolaylık değil, eşitlik — bu ayrım tartışmalarda belirleyicidir.","tr":"dezavantaj denkleştirmesi","s":"Sie bekommt als Nachteilsausgleich 25 Prozent mehr Zeit.","st":"Denkleştirme olarak yüzde 25 daha fazla süre alıyor.","f":"der Ausgleich (denge, denkleştirme) · ausgleichen (dengelemek) · der Nachteil (dezavantaj)"},{"w":"die Kompetenz","t":"Nomen, -en","k":"com (birlikte) + petere (yönelmek, talep etmek)","c":"die Kompetenz, die Kompetenzen","br":"Latince „bir işe birlikte yönelme, ona yeterli olma“. Eğitimde: yetkinlik; idarede: yetki alanı. Aynı kökten Konkurrenz: aynı hedefe birlikte koşma.","tr":"yetkinlik, beceri","s":"Der Lehrplan ist konsequent nach Kompetenzen aufgebaut.","st":"Müfredat tutarlı biçimde yetkinliklere göre kurulmuş.","f":"kompetent (yetkin) · die Konkurrenz (rekabet) · die Fähigkeit (beceri)","m":[{"tr":"yetki alanı","s":"Diese Entscheidung fällt nicht in die Kompetenz der Schulleitung.","st":"Bu karar okul yönetiminin yetki alanına girmiyor."}]},{"w":"der Fortschritt","t":"Nomen, -e","k":"fort (ileri) + Schritt (adım)","c":"der Fortschritt, die Fortschritte","br":"İleriye atılan adım. fort- daima „uzaklaşarak devam etme“ demektir: fortsetzen, fortfahren, fortlaufend.","tr":"ilerleme, gelişme","s":"Sie macht beim Lesen erkennbare Fortschritte.","st":"Okumada gözle görülür ilerleme kaydediyor.","f":"fortschrittlich (ilerici) · fortsetzen (sürdürmek) · der Rückschritt (gerileme)"},{"w":"die Nachhilfe","t":"Nomen (çoğulsuz)","k":"nach (sonradan) + Hilfe (yardım)","c":"die Nachhilfe","br":"Ders sonrasında verilen destek = özel ders. Kelimenin içinde „geriden gelene yardım“ fikri var.","tr":"özel ders, takviye ders","s":"Für Mathematik nimmt er seit einem Halbjahr Nachhilfe.","st":"Matematik için yarıyıldır özel ders alıyor.","f":"der Nachhilfeunterricht (takviye ders) · helfen (yardım etmek) · die Unterstützung (destek)"},{"w":"die Rückmeldung","t":"Nomen, -en","k":"rück (geri) + melden (bildirmek) + -ung","c":"die Rückmeldung, -en","br":"Geri bildirim. Üniversitede aynı kelime „kayıt yenileme“ demektir: dönem başında kendini geri bildirmek.","tr":"geri bildirim","s":"Eine schriftliche Rückmeldung erhalten die Eltern bis Freitag.","st":"Veliler cumaya kadar yazılı geri bildirim alacak.","f":"melden (bildirmek) · sich zurückmelden (kayıt yenilemek) · das Feedback (geri bildirim)"}]},{"n":"Okul dili: ders ve yöntem","e":"Unterricht, Lehrplan, Differenzierung…","c":"#5c6f1f","g":"Okul & öğretim dili","cards":[{"w":"der Unterricht","t":"Nomen (çoğulsuz)","k":"unter + richten (yöneltmek)","c":"der Unterricht","br":"unterrichten = birini bir konuya doğru yöneltmek, ona bilgi vermek. Aynı fiil „haberdar etmek“ anlamını da korur: Ich unterrichte Sie über den Stand.","tr":"ders, öğretim","s":"Der Unterricht fällt in der ersten Stunde aus.","st":"İlk saatte ders iptal.","f":"unterrichten (ders vermek; bilgilendirmek) · die Unterrichtsstunde (ders saati) · richten (yöneltmek)"},{"w":"der Lehrplan","t":"Nomen, ¨-e","k":"lehren (öğretmek) + Plan","c":"der Lehrplan, die Lehrpläne","br":"Neyin hangi sırayla öğretileceğini belirleyen plan. Eyalet düzeyinde bağlayıcıdır; yeni adı çoğu eyalette Kernlehrplan.","tr":"müfredat, öğretim programı","s":"Dieses Thema ist im Lehrplan für Klasse 9 vorgesehen.","st":"Bu konu 9. sınıf müfredatında öngörülmüş.","f":"lehren (öğretmek) · der Kernlehrplan (çekirdek müfredat) · das Curriculum (müfredat)"},{"w":"der Stoff","t":"Nomen, -e","k":"eski Fransızca estoffe: malzeme","c":"der Stoff, die Stoffe","br":"Temel anlam „malzeme“: kumaş, madde ve işlenecek ders içeriği. Üçü de „üzerinde çalışılan madde“ fikrinden çıkar.","tr":"ders konusu, işlenecek içerik","s":"Den Stoff des letzten Halbjahres wiederholen wir vor der Klausur.","st":"Geçen yarıyılın konusunu sınavdan önce tekrar ediyoruz.","f":"der Lernstoff (ders içeriği) · der Schadstoff (zararlı madde) · das Material (malzeme)","m":[{"tr":"kumaş; madde","s":"Der Stoff ist bei 30 Grad waschbar.","st":"Kumaş 30 derecede yıkanabilir."}]},{"w":"die Vertretungsstunde","t":"Nomen, -n","k":"Vertretung (temsil, yerine bakma) + Stunde (saat)","c":"die Vertretungsstunde, -n","br":"Asıl öğretmenin yerine girilen ders saati. Okul dilinde en sık duyulan kelimelerden.","tr":"vekâlet dersi","s":"Ich habe heute zwei Vertretungsstunden in der Oberstufe.","st":"Bugün üst kademede iki vekâlet dersim var.","f":"vertreten (yerine bakmak) · der Vertretungsplan (vekâlet planı) · der Ausfall (iptal)"},{"w":"die Wiederholung","t":"Nomen, -en","k":"wieder (tekrar) + holen (getirmek) + -ung","c":"die Wiederholung, -en","br":"Bir şeyi tekrar getirmek = tekrar etmek. wieder (tekrar) ile wider (karşı) tek harf farkla tamamen ayrı iki kelimedir.","tr":"tekrar","s":"Ohne regelmäßige Wiederholung bleibt kaum etwas hängen.","st":"Düzenli tekrar olmadan neredeyse hiçbir şey kalıcı olmuyor.","f":"wiederholen (tekrarlamak) · wiederholt (defalarca) · wider (karşı)"},{"w":"die Vertiefung","t":"Nomen, -en","k":"ver + tief (derin) + -ung","c":"die Vertiefung, -en","br":"ver- + sıfat kalıbı: derin hâle getirmek. Konuyu yüzeyden derine taşımak = derinleştirme.","tr":"derinleştirme, pekiştirme","s":"Zur Vertiefung bearbeiten die Schüler zwei Zusatzaufgaben.","st":"Pekiştirme için öğrenciler iki ek soru çözüyor.","f":"vertiefen (derinleştirmek) · tief (derin) · die Vertiefungsphase (pekiştirme aşaması)"},{"w":"das Arbeitsblatt","t":"Nomen, ¨-er","k":"Arbeit (çalışma) + Blatt (yaprak)","c":"das Arbeitsblatt, die -blätter","br":"Üzerinde çalışılan yaprak. Almanca bileşik isimlerde son kelime türü ve cinsi belirler: das Blatt → das Arbeitsblatt.","tr":"çalışma kâğıdı","s":"Das Arbeitsblatt bearbeiten Sie bitte in Partnerarbeit.","st":"Çalışma kâğıdını lütfen eşli çalışma olarak yapın.","f":"das Blatt (yaprak, sayfa) · die Partnerarbeit (eşli çalışma) · das Aufgabenblatt (soru kâğıdı)"},{"w":"der Ablauf","t":"Nomen, ¨-e","k":"ab + laufen (koşmak, akmak)","c":"der Ablauf, die Abläufe","br":"Bir şeyin baştan sona akışı = akış, sıralama. İkinci anlamı sürenin akıp bitmesidir — resmî dilde çok sık: nach Ablauf der Frist.","tr":"akış, işleyiş sırası","s":"Der Ablauf der Prüfung wird vorher genau erklärt.","st":"Sınavın işleyişi önceden ayrıntılı anlatılıyor.","f":"ablaufen (akıp geçmek; dolmak) · abgelaufen (süresi dolmuş) · der Verlauf (seyir)","m":[{"tr":"sürenin dolması","s":"Nach Ablauf der Widerspruchsfrist ist der Bescheid bestandskräftig.","st":"İtiraz süresinin dolmasıyla karar kesinleşir."}]},{"w":"die Differenzierung","t":"Nomen, -en","k":"differre (ayrı taşımak) + -ierung","c":"die Differenzierung, -en","br":"Aynı sınıfta farklı düzeylere farklı görev vermek = farklılaştırma. Kök ferre (taşımak) ile Differenz, Transfer, Konferenz akrabadır.","tr":"farklılaştırma (öğretimde)","s":"Ohne innere Differenzierung erreicht man in dieser Klasse niemanden.","st":"İç farklılaştırma olmadan bu sınıfta kimseye ulaşılamaz.","f":"differenzieren (ayrım yapmak) · die Differenz (fark) · binnendifferenziert (sınıf içi farklılaştırılmış)"},{"w":"der Schwerpunkt","t":"Nomen, -e","k":"schwer (ağır) + Punkt (nokta)","c":"der Schwerpunkt, -e","br":"Fizikten gelir: ağırlık merkezi. Mecazî olarak: bir çalışmanın ağırlık verdiği alan.","tr":"ağırlık noktası, odak","s":"Der Schwerpunkt liegt in diesem Halbjahr auf der Geometrie.","st":"Bu yarıyılın ağırlık noktası geometri.","f":"schwerpunktmäßig (ağırlıklı olarak) · schwer (ağır) · der Fokus (odak)"},{"w":"die Veranschaulichung","t":"Nomen, -en","k":"ver + anschaulich (an+schauen: bakmak) + -ung","c":"die Veranschaulichung, -en","br":"anschaulich = gözle görülür, elle tutulur. Soyut olanı görülebilir hâle getirmek = somutlaştırma. Matematikte anlatımın bel kemiği.","tr":"somutlaştırma, görselleştirme","s":"Zur Veranschaulichung nutze ich ein einfaches Streichholzmodell.","st":"Somutlaştırmak için basit bir kibrit modeli kullanıyorum.","f":"anschaulich (somut, görsel) · veranschaulichen (somutlaştırmak) · schauen (bakmak)"},{"w":"die Aufgabenstellung","t":"Nomen, -en","k":"Aufgabe (görev) + stellen (koymak) + -ung","c":"die Aufgabenstellung, -en","br":"Sorunun nasıl kurulduğu, yani öğrencinin tam olarak ne yapması istendiği. Sınavlarda itirazların çoğu buradan çıkar.","tr":"soru yönergesi, görev tanımı","s":"Die Aufgabenstellung war für mehrere Schüler missverständlich.","st":"Soru yönergesi birçok öğrenci için yanlış anlaşılmaya açıktı.","f":"die Aufgabe (görev, ödev) · stellen (koymak) · die Fragestellung (soru kurgusu)"},{"w":"der Lösungsweg","t":"Nomen, -e","k":"Lösung (lösen: çözmek) + Weg (yol)","c":"der Lösungsweg, -e","br":"lösen = bağı çözmek, gevşetmek. Çözüme giden yol = izlenen adımlar. Matematikte not çoğu zaman sonuca değil, bu yola verilir.","tr":"çözüm yolu","s":"Der Lösungsweg muss vollständig nachvollziehbar sein.","st":"Çözüm yolu baştan sona takip edilebilir olmalı.","f":"lösen (çözmek) · die Lösung (çözüm) · nachvollziehbar (izlenebilir, anlaşılır)"},{"w":"der Ansatz","t":"Nomen, ¨-e","k":"an + setzen (koymak)","c":"der Ansatz, die Ansätze","br":"Bir işe başlarken ilk konulan nokta = yaklaşım; matematikte: kurulan ilk denklem. Kısmi puanın verildiği yer çoğu zaman burasıdır.","tr":"yaklaşım; (matematikte) kuruluş, ilk denklem","s":"Der Ansatz war richtig, nur die Umformung ist misslungen.","st":"Kuruluş doğruydu, yalnızca dönüştürme yanlış oldu.","f":"ansetzen (kurmak, başlamak) · der Lösungsansatz (çözüm yaklaşımı) · im Ansatz (esasen)"}]},{"n":"Sınıf içi dil","e":"öğretmenin ve öğrencinin hazır cümleleri","c":"#7a5f2a","g":"Okul & öğretim dili","cards":[{"w":"Setzt euch bitte.","t":"Sınıf kalıbı","k":"sich setzen (oturmak) — çoğul emir","c":"—","br":"Sınıf komutları ihr biçiminde kurulur: Setzt euch, nehmt eure Hefte raus, hört bitte zu. Fiil kökü + t, zamir yok — en kısa emir biçimi.","tr":"Lütfen oturun.","s":"Setzt euch bitte und holt eure Hefte raus.","st":"Lütfen oturun ve defterlerinizi çıkarın.","f":"sich hinsetzen (yerine oturmak) · aufstehen (kalkmak) · rausholen (çıkarmak)"},{"w":"Wer möchte anfangen?","t":"Sınıf kalıbı","k":"anfangen (başlamak) + möchte","c":"—","br":"Söz verme dili: Wer möchte anfangen? / Wer meldet sich? / Bitte, du bist dran. sich melden = parmak kaldırmak; dran sein = sıra sende.","tr":"Kim başlamak ister?","s":"Wer möchte anfangen? — Ja bitte, du bist dran.","st":"Kim başlamak ister? — Buyur, sıra sende.","f":"sich melden (parmak kaldırmak) · dran sein (sırası olmak) · aufrufen (söz vermek)"},{"w":"Passt bitte auf.","t":"Sınıf kalıbı","k":"aufpassen (dikkat etmek)","c":"passt auf – passte auf – hat aufgepasst","br":"aufpassen hem „dikkat et“ hem „göz kulak ol“ demektir. Sınıfta üç kademe: Passt auf → Seid bitte leise → So geht das nicht.","tr":"Lütfen dikkat edin.","s":"Passt bitte kurz auf, das kommt in der Arbeit dran.","st":"Kısaca dikkat edin, bu yazılıda çıkacak.","f":"aufmerksam (dikkatli) · zuhören (kulak vermek) · stören (rahatsız etmek)"},{"w":"in Partnerarbeit / in Gruppen","t":"Çalışma biçimi","k":"Partner + Arbeit / die Gruppe","c":"—","br":"Ders biçimleri: Einzelarbeit (bireysel), Partnerarbeit (eşli), Gruppenarbeit (grup), Plenum (tüm sınıf). Yönerge kalıbı: Bearbeitet die Aufgabe in Partnerarbeit.","tr":"eşli çalışma / gruplar hâlinde","s":"Die nächste Aufgabe bearbeitet ihr in Partnerarbeit.","st":"Sonraki görevi eşli çalışmayla yapacaksınız.","f":"die Einzelarbeit (bireysel çalışma) · das Plenum (tüm sınıf) · bearbeiten (üzerinde çalışmak)"},{"w":"Hausaufgaben aufgeben / kontrollieren","t":"Kollokation","k":"aufgeben (vermek) / kontrollieren","c":"—","br":"Ödev verilir (aufgeben), yapılır (machen), teslim edilir (abgeben) ve kontrol edilir (kontrollieren, vergleichen). Öğrenci tarafı: Ich habe die Hausaufgaben vergessen.","tr":"ödev vermek / kontrol etmek","s":"Als Hausaufgabe gebe ich euch Seite 42, Nummer 3 auf.","st":"Ödev olarak size sayfa 42, üç numarayı veriyorum.","f":"abgeben (teslim etmek) · vergleichen (karşılaştırmak) · nachholen (telafi etmek)"},{"w":"an die Tafel schreiben","t":"Kollokation","k":"Tafel (tahta) + schreiben","c":"—","br":"Tahta dili: an die Tafel schreiben (yön: Akkusativ), an der Tafel stehen (duruş: Dativ), die Tafel wischen (silmek). Yön–duruş kuralının günlük örneği.","tr":"tahtaya yazmak","s":"Schreib das bitte an die Tafel.","st":"Bunu lütfen tahtaya yaz.","f":"die Tafel (tahta) · wischen (silmek) · das Whiteboard (beyaz tahta)"},{"w":"Wer fehlt heute?","t":"Sınıf kalıbı","k":"fehlen (eksik olmak) + Dativ","c":"fehlt – fehlte – hat gefehlt","br":"Yoklamanın standart sorusu. fehlen ayrıca „birine eksik gelmek“ demektir: Du hast mir gefehlt (seni özledim) — aynı fiil, iki dünya.","tr":"Bugün kim yok?","s":"Wer fehlt heute? — Zwei, beide entschuldigt.","st":"Bugün kim yok? — İki kişi, ikisi de mazeretli.","f":"die Fehlzeit (devamsızlık) · entschuldigt (mazeretli) · anwesend (mevcut)"},{"w":"Noch Fragen?","t":"Sınıf kalıbı","k":"Frage (soru)","c":"—","br":"Konu bitiminin standart cümlesi. Genişletilmiş biçimleri: Ist das so weit klar? / Soll ich das noch mal erklären? / Wer hat’s verstanden?","tr":"Sorusu olan?","s":"Noch Fragen? Sonst machen wir weiter.","st":"Sorusu olan? Yoksa devam ediyoruz.","f":"nachfragen (tekrar sormak) · klar (net) · weitermachen (devam etmek)"},{"w":"Das kommt in der Arbeit dran.","t":"Sınıf kalıbı","k":"drankommen (sırası gelmek, çıkmak)","c":"kommt dran – kam dran – ist drangekommen","br":"drankommen iki iş görür: sınavda „çıkmak“ ve sırada „sıra gelmek“. Öğrencinin en sık sorusu budur: Kommt das dran?","tr":"Bu sınavda çıkacak.","s":"Kommt das in der Klassenarbeit dran? — Ja, ganz sicher.","st":"Bu yazılıda çıkacak mı? — Evet, kesinlikle.","f":"dran sein (sırası olmak) · die Klassenarbeit (yazılı) · der Stoff (konu)"},{"w":"Ich habe eine Frage.","t":"Öğrenci kalıbı","k":"Frage haben / stellen","c":"—","br":"Öğrencinin temel kalıpları: Ich habe eine Frage / Ich verstehe die Aufgabe nicht / Können Sie das bitte wiederholen? / Wie schreibt man das?","tr":"Bir sorum var.","s":"Entschuldigung, ich habe eine Frage zur Aufgabe drei.","st":"Pardon, üç numaralı soruyla ilgili bir sorum var.","f":"wiederholen (tekrarlamak) · erklären (açıklamak) · verstehen (anlamak)"},{"w":"Wie schreibt man das?","t":"Öğrenci kalıbı","k":"schreiben + man","c":"—","br":"Yazımı sorma kalıbı; cevap harf harf verilir (buchstabieren). Yakın kalıplar: Was heißt das auf Türkisch? / Wie sagt man …?","tr":"Bu nasıl yazılıyor?","s":"Wie schreibt man das? Können Sie es bitte buchstabieren?","st":"Bu nasıl yazılıyor? Harf harf söyler misiniz?","f":"buchstabieren (harflemek) · die Rechtschreibung (yazım) · heißen (anlamına gelmek)"},{"w":"Bitte leise / Ruhe bitte.","t":"Sınıf kalıbı","k":"leise (sessiz) / Ruhe (sessizlik)","c":"—","br":"Sınıf sessizliğinin iki biçimi: Bitte leise arbeiten (fısıltıyla çalışma) ve Ruhe bitte (tam sessizlik). Kademe: Es ist zu laut → Bitte leiser → Jetzt ist Ruhe.","tr":"Sessiz olun lütfen.","s":"Bitte etwas leiser — die Nachbarklasse schreibt eine Arbeit.","st":"Biraz daha sessiz — yan sınıf yazılı yapıyor.","f":"laut (gürültülü) · die Ruhe (sessizlik) · flüstern (fısıldamak)"},{"w":"Wir machen eine Pause.","t":"Sınıf kalıbı","k":"Pause (mola) + machen","c":"—","br":"Teneffüs dili: die große Pause (uzun teneffüs), die Aufsicht (nöbet), es klingelt (zil çalıyor), nach der Pause geht es weiter.","tr":"Mola veriyoruz.","s":"Wir machen fünf Minuten Pause, danach geht es weiter.","st":"Beş dakika mola veriyoruz, sonra devam.","f":"die Pause (teneffüs) · klingeln (zil çalmak) · die Aufsicht (nöbet)"},{"w":"Gut gemacht! / Fast richtig.","t":"Geri bildirim","k":"machen / richtig (doğru)","c":"—","br":"Geri bildirim kademesi: Genau! → Gut gemacht! → Fast richtig, schau noch mal → Da ist noch ein Denkfehler. Almanca sınıfta doğrudan „falsch“ demek yerine bu ara basamaklar kullanılır.","tr":"Aferin! / Neredeyse doğru.","s":"Fast richtig — schau dir das Vorzeichen noch einmal an.","st":"Neredeyse doğru — işarete bir daha bak.","f":"der Denkfehler (düşünme hatası) · das Vorzeichen (işaret) · verbessern (düzeltmek)"}]},{"n":"Sınav yönergeleri (Operatoren)","e":"Berechne, Begründe, Erläutere, Vergleiche…","c":"#2f5f7f","g":"Okul & öğretim dili","cards":[{"w":"berechnen ↔ bestimmen","t":"Operator","k":"be + rechnen / be + stimmen","c":"—","br":"Sınav yönergeleri (Operatoren) resmî olarak tanımlıdır ve beklenen işi belirler. berechnen: hesap yaparak sayıya ulaş; bestimmen: sonucu belirle — hesapla da olabilir, okuyarak da. Yanlış operatör okuması puan kaybının en sık sebebi.","tr":"hesapla ↔ belirle","s":"Berechnen Sie den Flächeninhalt des Dreiecks.","st":"Üçgenin alanını hesaplayın.","f":"die Berechnung (hesaplama) · ermitteln (tespit etmek) · der Rechenweg (çözüm yolu)"},{"w":"begründen (Operator)","t":"Operator","k":"be + Grund (temel)","c":"—","br":"Yalnızca sonucu değil, dayanağını da iste: „neden böyle?“ Cevap kalıbı: …, da/weil … İkinci basamak operatördür; sadece nennen’den daha fazlasını ister.","tr":"gerekçelendir","s":"Begründen Sie Ihre Entscheidung mit zwei Argumenten.","st":"Kararınızı iki argümanla gerekçelendirin.","f":"die Begründung (gerekçe) · der Grund (sebep) · nachvollziehbar (anlaşılır)"},{"w":"nennen ↔ beschreiben","t":"Operator çifti","k":"nennen (adını söyle) / beschreiben (betimle)","c":"—","br":"Birinci basamak ile ikinci basamak farkı: nennen yalnızca listeler, beschreiben ise cümleyle anlatır. Öğrenci nennen’de cümle kurarsa zaman kaybeder, beschreiben’de liste yaparsa puan kaybeder.","tr":"say, adlandır ↔ betimle","s":"Nennen Sie drei Beispiele und beschreiben Sie eines davon genauer.","st":"Üç örnek verin ve birini daha ayrıntılı betimleyin.","f":"aufzählen (sıralamak) · die Beschreibung (betimleme) · schildern (anlatmak)"},{"w":"erläutern ↔ erklären","t":"Operator çifti","k":"er + läutern (arıtmak) / er + klar","c":"—","br":"İkisi de açıklamadır ama erläutern örnek ve ayrıntı ister, erklären nedeni açık hâle getirir. Sınav dilinde erläutern daha kapsamlıdır.","tr":"ayrıntılandırarak açıkla ↔ açıkla","s":"Erläutern Sie den Zusammenhang an einem Beispiel.","st":"Bağlantıyı bir örnek üzerinden ayrıntılı açıklayın.","f":"die Erläuterung (izahat) · verdeutlichen (netleştirmek) · das Beispiel (örnek)"},{"w":"vergleichen (Operator)","t":"Operator","k":"ver + gleich (aynı)","c":"—","br":"Ortak yönleri ve farkları birlikte ister. Beklenen yapı: önce ölçüt (Kriterium), sonra karşılaştırma, sonunda sonuç. Yalnızca iki şeyi ayrı ayrı anlatmak karşılaştırma sayılmaz.","tr":"karşılaştır","s":"Vergleichen Sie die beiden Verfahren hinsichtlich Aufwand und Genauigkeit.","st":"İki yöntemi emek ve kesinlik bakımından karşılaştırın.","f":"der Vergleich (karşılaştırma) · das Kriterium (ölçüt) · gegenüberstellen (karşı karşıya koymak)"},{"w":"beurteilen ↔ bewerten","t":"Operator çifti","k":"Urteil (hüküm) / Wert (değer)","c":"—","br":"Üçüncü basamak operatörler: beurteilen ölçütlere dayanarak hüküm verir; bewerten ayrıca kendi değer yargını da katmanı ister (Stellung beziehen). Cevap gerekçesiz olamaz.","tr":"değerlendir (ölçütle) ↔ değer biç (kendi tavrınla)","s":"Beurteilen Sie, ob das Ergebnis realistisch ist.","st":"Sonucun gerçekçi olup olmadığını değerlendirin.","f":"die Beurteilung (değerlendirme) · Stellung nehmen (tavır almak) · das Urteil (hüküm)"},{"w":"beweisen ↔ zeigen","t":"Operator çifti","k":"be + weisen / zeigen","c":"—","br":"Matematikte beweisen genel geçer bir ispat ister (her durum için); zeigen ise verilen somut durumda doğruluğu göstermek yeterlidir. Bu ayrım not farkı yaratır.","tr":"ispatla ↔ göster","s":"Zeigen Sie, dass die Gleichung für n = 5 gilt, und beweisen Sie die Aussage allgemein.","st":"Denklemin n = 5 için sağlandığını gösterin ve önermeyi genel olarak ispatlayın.","f":"der Beweis (ispat) · widerlegen (çürütmek) · die Behauptung (önerme)"},{"w":"skizzieren ↔ zeichnen","t":"Operator çifti","k":"Skizze (kroki) / zeichnen (çizmek)","c":"—","br":"skizzieren serbest elle, ölçüsüz ana hatlar; zeichnen ise cetvel ve ölçüyle doğru çizim ister. Yönerge hangisini diyorsa o beklenir.","tr":"kabaca çiz ↔ ölçekli çiz","s":"Skizzieren Sie den Graphen und zeichnen Sie die Tangente ein.","st":"Grafiği kabaca çizin ve teğeti çizerek işaretleyin.","f":"die Skizze (kroki) · die Zeichnung (çizim) · einzeichnen (üzerine çizmek)"},{"w":"ordne zu ↔ kreuze an","t":"Operator çifti","k":"zuordnen (eşleştirmek) / ankreuzen (işaretlemek)","c":"—","br":"Kapalı uçlu görev dili: zuordnen eşleştirir, ankreuzen çarpı koyar. Formlarda da aynı kelime geçer: Zutreffendes bitte ankreuzen.","tr":"eşleştir ↔ işaretle","s":"Ordnen Sie die Begriffe den Definitionen zu.","st":"Kavramları tanımlarla eşleştirin.","f":"die Zuordnung (eşleştirme) · das Kreuz (çarpı) · zutreffend (uygun, doğru)"},{"w":"ergänze ↔ vervollständige","t":"Operator çifti","k":"ergänzen (tamamlamak) / voll + ständig","c":"—","br":"Boşluk doldurma dili: ergänzen eksik parçayı ekler; vervollständigen bütünü tamamlar. Kalıp: Ergänzen Sie die fehlenden Angaben.","tr":"tamamla (eksiği ekle) ↔ bütünle","s":"Ergänzen Sie die fehlenden Werte in der Tabelle.","st":"Tablodaki eksik değerleri tamamlayın.","f":"die Ergänzung (tamamlama) · fehlen (eksik olmak) · vollständig (eksiksiz)"},{"w":"werte aus (auswerten)","t":"Operator","k":"aus + werten (değerlendirmek)","c":"wertet aus – wertete aus – hat ausgewertet","br":"Veriden anlam çıkarmak: tablo ya da grafikten sonuç okumak. Sıra: önce ablesen (oku), sonra auswerten (yorumla), sonra deuten (anlamlandır).","tr":"verileri değerlendir, analiz et","s":"Werten Sie das Diagramm aus und formulieren Sie eine Aussage.","st":"Grafiği analiz edin ve bir önerme kurun.","f":"die Auswertung (analiz) · ablesen (okumak) · das Diagramm (grafik)"},{"w":"diskutiere ↔ erörtere","t":"Operator çifti","k":"diskutieren / erörtern (her yönden ele almak)","c":"—","br":"En üst basamak: her ikisi de artı ve eksiyi ister, ama erörtern yapılı bir yazı bekler (Einleitung – Hauptteil – Fazit) ve sonunda kendi sonucunu ister.","tr":"tartış ↔ enine boyuna tartış","s":"Erörtern Sie, ob Handys im Unterricht sinnvoll sind.","st":"Derste cep telefonlarının anlamlı olup olmadığını enine boyuna tartışın.","f":"die Erörterung (tartışma yazısı) · das Fazit (sonuç) · das Argument (argüman)"},{"w":"nimm Stellung","t":"Operator","k":"Stellung nehmen zu (D)","c":"—","br":"Kendi tavrını gerekçelendirerek bildirmeyi ister. Yapı: iddia → gerekçe → örnek. Tarafsız kalmak burada eksik cevaptır; tavır beklenir.","tr":"görüş bildir, tavır al","s":"Nehmen Sie zu der folgenden Aussage Stellung.","st":"Aşağıdaki ifadeye ilişkin görüş bildirin.","f":"die Stellungnahme (görüş yazısı) · begründen (gerekçelendirmek) · die Meinung (görüş)"},{"w":"überprüfe ↔ untersuche","t":"Operator çifti","k":"über + prüfen / unter + suchen","c":"—","br":"überprüfen verilen bir iddianın doğruluğunu sınar (doğru mu?); untersuchen ise açık uçlu incelemedir (ne oluyor?). Matematikte ilki sıklıkla „kontrol et ve karar ver“ demektir.","tr":"doğrula, sına ↔ incele","s":"Überprüfen Sie, ob der Punkt auf der Geraden liegt.","st":"Noktanın doğru üzerinde olup olmadığını kontrol edin.","f":"die Überprüfung (kontrol) · die Untersuchung (inceleme) · nachweisen (kanıtlamak)"}]},{"n":"Okul dili: veli, kurum, davranış","e":"Elternabend, Aufsichtspflicht, Ordnungsmaßnahme…","c":"#8b4a2b","g":"Okul & öğretim dili","cards":[{"w":"der Elternabend","t":"Nomen, -e","k":"Eltern (veliler) + Abend (akşam)","c":"der Elternabend, -e","br":"Akşam yapılan veli toplantısı. Bireysel görüşme ise Elternsprechtag ya da Sprechstunde’dir; ikisi karıştırılmamalı.","tr":"veli toplantısı","s":"Der Elternabend findet am 12. September um 19 Uhr statt.","st":"Veli toplantısı 12 Eylül saat 19’da yapılacak.","f":"der Elternsprechtag (veli görüşme günü) · die Elternvertretung (veli temsilciliği) · der Abend (akşam)"},{"w":"die Sprechstunde","t":"Nomen, -n","k":"sprechen (konuşmak) + Stunde (saat)","c":"die Sprechstunde, -n","br":"Konuşmaya ayrılmış saat: öğretmenin veli görüşme saati, doktorun muayene saati. Aynı kelime iki kurumda da aynı işi görür.","tr":"görüşme saati","s":"Meine Sprechstunde ist dienstags in der dritten Stunde.","st":"Görüşme saatim salı günleri üçüncü derste.","f":"sprechen (konuşmak) · der Sprechtag (görüşme günü) · die Sprechzeit (görüşme vakti)"},{"w":"die Erziehungsberechtigten","t":"Nomen (çoğul)","k":"Erziehung (terbiye) + berechtigt (hak sahibi)","c":"die Erziehungsberechtigten (Pl.)","br":"„Terbiye etme hakkına sahip olanlar“ = hukuken veli. Eltern biyolojiktir, Erziehungsberechtigte hukuki sıfattır — resmî yazışmada bu kelime kullanılır.","tr":"veliler (hukuki anlamda)","s":"Die Erziehungsberechtigten werden schriftlich informiert.","st":"Veliler yazılı olarak bilgilendirilecek.","f":"berechtigt (hak sahibi) · die Berechtigung (yetki, hak) · das Sorgerecht (velayet)"},{"w":"die Schulleitung","t":"Nomen, -en","k":"Schule + leiten (yönetmek) + -ung","c":"die Schulleitung, -en","br":"leiten = yönlendirmek, sevk etmek (bkz. Leiter: yönetici; Leitung: hat, boru, yönetim). Okulu yöneten makam.","tr":"okul yönetimi","s":"Die Entscheidung liegt bei der Schulleitung.","st":"Karar okul yönetiminde.","f":"leiten (yönetmek) · der Schulleiter (okul müdürü) · die Leitung (yönetim; hat)"},{"w":"die Klassenkonferenz","t":"Nomen, -en","k":"Klasse + Konferenz (con+ferre: birlikte taşımak)","c":"die Klassenkonferenz, -en","br":"Sınıfın tüm öğretmenlerinin fikrini ortaya taşıdığı kurul. Not, sınıf geçme ve disiplin kararları burada alınır.","tr":"sınıf öğretmenler kurulu","s":"Über die Maßnahme entscheidet die Klassenkonferenz.","st":"Tedbir hakkında sınıf kurulu karar verir.","f":"die Konferenz (toplantı) · die Zeugniskonferenz (karne toplantısı) · beschließen (karara bağlamak)"},{"w":"die Ordnungsmaßnahme","t":"Nomen, -n","k":"Ordnung (düzen) + Maßnahme (Maß+nehmen: ölçü alma)","c":"die Ordnungsmaßnahme, -n","br":"Maßnahme = „ölçü almak“, yani duruma uygun tedbir. Düzeni sağlamak için alınan resmî tedbir; eğitsel uyarılardan (Erziehungsmittel) hukuken daha ağırdır.","tr":"disiplin tedbiri","s":"Ordnungsmaßnahmen müssen schriftlich begründet werden.","st":"Disiplin tedbirleri yazılı olarak gerekçelendirilmelidir.","f":"die Maßnahme (tedbir) · das Maß (ölçü) · das Erziehungsmittel (eğitsel önlem)"},{"w":"die Aufsichtspflicht","t":"Nomen, -en","k":"Aufsicht (auf+sehen: gözetmek) + Pflicht (görev)","c":"die Aufsichtspflicht, -en","br":"Öğretmenin öğrenciyi gözetme yükümlülüğü. İhlali durumunda kişisel sorumluluk (Haftung) doğabilir — bu yüzden teneffüs nöbetleri resmî görevdir.","tr":"gözetim yükümlülüğü","s":"Während der Pause besteht Aufsichtspflicht auf dem gesamten Schulhof.","st":"Teneffüste bütün okul bahçesinde gözetim yükümlülüğü vardır.","f":"die Aufsicht (gözetim, nöbet) · beaufsichtigen (gözetmek) · die Pflicht (yükümlülük)"},{"w":"die Schulpflicht","t":"Nomen (çoğulsuz)","k":"Schule + Pflicht (görev)","c":"die Schulpflicht","br":"Almanya’da eğitim bir hak olduğu kadar zorunluluktur: Schulpflicht, evde eğitimi kural olarak dışlar. İhlali para cezasına kadar gidebilir.","tr":"zorunlu eğitim","s":"Die Schulpflicht endet in der Regel nach zehn Schuljahren.","st":"Zorunlu eğitim kural olarak on okul yılından sonra biter.","f":"schulpflichtig (okul çağında) · die Pflicht (yükümlülük) · der Schulzwang (okul zorunluluğu)"},{"w":"die Beurlaubung","t":"Nomen, -en","k":"be + Urlaub (izin) + -ung","c":"die Beurlaubung, -en","br":"Birini resmen izinli saymak. Öğrenci için: derse katılmama izni; memur için: ücretsiz izin.","tr":"izinli sayılma","s":"Für den Flug am Freitag brauchen wir eine Beurlaubung.","st":"Cuma günkü uçuş için izin almamız gerekiyor.","f":"beurlauben (izin vermek) · der Urlaub (izin, tatil) · die Freistellung (görevden muafiyet)"},{"w":"das Fehlverhalten","t":"Nomen (çoğulsuz)","k":"fehl- (yanlış) + Verhalten (davranış)","c":"das Fehlverhalten","br":"fehl- ön eki „yanlış, hatalı“ katar: Fehlentscheidung, Fehleinschätzung, Fehlurteil. Davranışın yanlış olanı = kusurlu davranış.","tr":"hatalı davranış, kusur","s":"Wir haben sein Fehlverhalten offen angesprochen.","st":"Hatalı davranışını açıkça konuştuk.","f":"sich verhalten (davranmak) · die Fehlentscheidung (yanlış karar) · das Verhalten (davranış)"},{"w":"die Entschuldigung","t":"Nomen, -en","k":"ent + Schuld (kusur, borç) + -ung","c":"die Entschuldigung, -en","br":"Schuld = kusur, suç. ent- onu kaldırır: kusuru üzerinden almak. Okulda aynı kelime „velinin verdiği mazeret yazısı“ demektir.","tr":"özür; mazeret yazısı","s":"Die Entschuldigung ist innerhalb von drei Tagen vorzulegen.","st":"Mazeret yazısı üç gün içinde sunulmalıdır.","f":"entschuldigen (mazur görmek) · die Schuld (kusur, borç) · unentschuldigt (mazeretsiz)","m":[{"tr":"özür dileme","s":"Eine förmliche Entschuldigung wäre hier angebracht gewesen.","st":"Burada resmî bir özür yerinde olurdu."}]},{"w":"die Anwesenheit","t":"Nomen (çoğulsuz)","k":"an + Wesen (varlık) + -heit","c":"die Anwesenheit","br":"Wesen = varlık, öz. Bir yerde varlık göstermek = hazır bulunmak. Karşıtı die Abwesenheit; sıfatları anwesend/abwesend.","tr":"hazır bulunma, devam","s":"Die Anwesenheit wird zu Beginn jeder Stunde kontrolliert.","st":"Devam her dersin başında kontrol ediliyor.","f":"anwesend (hazır) · die Abwesenheit (yokluk) · das Wesen (varlık, öz)"},{"w":"die Chancengleichheit","t":"Nomen (çoğulsuz)","k":"Chance (fırsat) + gleich (eşit) + -heit","c":"die Chancengleichheit","br":"Herkese aynı muamele değil, aynı başlangıç fırsatı. Bu yüzden Nachteilsausgleich bu ilkenin ihlali değil, gereğidir.","tr":"fırsat eşitliği","s":"Chancengleichheit bedeutet nicht, dass alle dasselbe bekommen.","st":"Fırsat eşitliği, herkesin aynı şeyi alması demek değildir.","f":"gleich (eşit) · die Gleichbehandlung (eşit muamele) · benachteiligt (dezavantajlı)"},{"w":"die Inklusion","t":"Nomen, -en","k":"in (içine) + claudere (kapamak) → içeri almak","c":"die Inklusion, die Inklusionen","br":"Latince „içine kapamak, kapsamak“ — Exklusion’un (dışarıda bırakma) karşıtı. Aynı kök Klausur ve Klausel’de de var: claudere = kapatmak.","tr":"kapsayıcı eğitim, içerme","s":"Inklusion setzt personelle und räumliche Voraussetzungen voraus.","st":"Kapsayıcı eğitim, personel ve mekân koşullarını gerektirir.","f":"inklusiv (kapsayıcı) · die Exklusion (dışlama) · einschließlich (dahil)"}]},{"n":"Veli görüşmesi ve zor konuşmalar","e":"Sorge äußern, Vereinbarung treffen, nachfassen…","c":"#6a4a7a","g":"Okul & öğretim dili","cards":[{"w":"das Anliegen schildern","t":"Görüşme kalıbı","k":"schildern (tasvir etmek) + Anliegen (mesele)","c":"schildert – schilderte – hat geschildert","br":"Görüşmenin açılışı: konuyu suçlamadan anlatmak. schildern „olduğu gibi anlatmak“tır; beschuldigen (suçlamak) ile arasındaki fark ilk cümlede tonu belirler.","tr":"konuyu anlatmak, durumu aktarmak","s":"Ich schildere Ihnen kurz, worum es geht.","st":"Konunun ne olduğunu size kısaca anlatayım.","f":"das Anliegen (mesele) · sachlich (nesnel) · beschuldigen (suçlamak)"},{"w":"eine Sorge äußern","t":"Görüşme kalıbı","k":"Sorge (kaygı) + äußern (dile getirmek)","c":"äußert – äußerte – hat geäußert","br":"äußern = dışa vurmak (außen kökünden). Kaygıyı suçlama yapmadan söylemenin yolu: Ich mache mir Sorgen, dass … Karşı taraf savunmaya geçmez.","tr":"kaygısını dile getirmek","s":"Ich möchte eine Sorge äußern, ohne jemandem einen Vorwurf zu machen.","st":"Kimseyi suçlamadan bir kaygımı dile getirmek istiyorum.","f":"die Sorge (kaygı) · die Äußerung (beyan) · der Vorwurf (suçlama)"},{"w":"aus meiner Sicht","t":"Görüşme kalıbı","k":"Sicht (bakış) + aus","c":"—","br":"İddiayı mutlak olmaktan çıkarır: „benim gördüğüm kadarıyla“. Zor görüşmenin temel tekniği: gözlemi kişiselleştir, kişiyi değil. Eş biçimleri: meines Erachtens, für mich sieht es so aus.","tr":"bana kalırsa, benim açımdan","s":"Aus meiner Sicht liegt das Problem eher an der Zeitplanung.","st":"Bana kalırsa sorun daha çok zaman planlamasında.","f":"die Sicht (bakış) · meines Erachtens (kanaatimce) · die Perspektive (bakış açısı)"},{"w":"mir ist aufgefallen, dass …","t":"Görüşme kalıbı","k":"auffallen (göze çarpmak) + Dativ","c":"—","br":"Gözlem bildirmenin en yumuşak yolu: özne sen değilsin, olgu. „Du machst nie …“ yerine „Mir ist aufgefallen, dass …“ — aynı içerik, bambaşka tepki.","tr":"şunu fark ettim ki …","s":"Mir ist aufgefallen, dass die Hausaufgaben in letzter Zeit oft fehlen.","st":"Son zamanlarda ödevlerin sık sık eksik olduğunu fark ettim.","f":"auffallen (göze çarpmak) · die Beobachtung (gözlem) · sachlich (nesnel)"},{"w":"gemeinsam nach einer Lösung suchen","t":"Görüşme kalıbı","k":"gemeinsam (birlikte) + Lösung + suchen","c":"—","br":"Görüşmeyi suçlamadan çözüme çeviren cümle. Yakın kalıplar: an einem Strang ziehen (aynı yönde çekmek), einen Weg finden.","tr":"birlikte çözüm aramak","s":"Lassen Sie uns gemeinsam nach einer Lösung suchen.","st":"Birlikte bir çözüm arayalım.","f":"die Lösung (çözüm) · an einem Strang ziehen (birlik olmak) · der Kompromiss (uzlaşma)"},{"w":"eine Vereinbarung treffen","t":"Görüşme kalıbı","k":"vereinbaren (kararlaştırmak) + treffen","c":"trifft – traf – hat getroffen","br":"Görüşmenin kapanışı: ne konuşulduğu değil, ne kararlaştırıldığı kalır. Somutlaştırma: Wer macht was bis wann? Ardından yazılı teyit gelir.","tr":"anlaşma yapmak, mutabakata varmak","s":"Wir treffen folgende Vereinbarung: Er zeigt die Hausaufgaben täglich vor.","st":"Şu anlaşmayı yapıyoruz: ödevlerini her gün gösterecek.","f":"die Vereinbarung (mutabakat) · verbindlich (bağlayıcı) · festhalten (kayda geçirmek)"},{"w":"nachfassen","t":"Verb","k":"nach + fassen (tutmak)","c":"fasst nach – fasste nach – hat nachgefasst","br":"Konuşulan işin arkasını bırakmamak: sonradan tekrar sormak, hatırlatmak. Kalıp: In vier Wochen fasse ich noch einmal nach.","tr":"takibini yapmak, arkasını sormak","s":"In zwei Wochen fasse ich noch einmal nach, ob es klappt.","st":"İki hafta sonra işleyip işlemediğini tekrar soracağım.","f":"nachhaken (üstüne gitmek) · die Rückmeldung (geri bildirim) · erinnern an (hatırlatmak)"},{"w":"das sehe ich anders","t":"İtiraz kalıbı","k":"sehen (görmek) + anders (farklı)","c":"—","br":"Karşı çıkmanın en nazik biçimi: görüşü reddeder, kişiyi değil. Yumuşatılmış hâli: Da bin ich anderer Meinung. Sert hâli: Das stimmt so nicht.","tr":"Ben bunu farklı görüyorum","s":"Das sehe ich anders — und ich sage Ihnen auch, warum.","st":"Ben bunu farklı görüyorum — nedenini de söyleyeyim.","f":"anderer Meinung sein (farklı düşünmek) · widersprechen (karşı çıkmak) · zustimmen (katılmak)"},{"w":"Verständnis zeigen","t":"Görüşme kalıbı","k":"Verständnis (anlayış) + zeigen","c":"—","br":"Kabul etmeden anlayış göstermek: Ich kann verstehen, dass … Aber … Bu yapı karşı tarafı savunmadan çıkarır ve konuşmayı sürdürür.","tr":"anlayış göstermek","s":"Ich kann gut verstehen, dass Sie verärgert sind.","st":"Kızgın olmanızı çok iyi anlıyorum.","f":"das Verständnis (anlayış) · nachvollziehen (izleyip anlamak) · zuhören (dinlemek)"},{"w":"sachlich bleiben","t":"Görüşme kalıbı","k":"Sache (mesele) + -lich","c":"—","br":"Konuyu kişiselleştirmemek: sachlich bleiben = meselede kalmak. Karşıtı: persönlich werden — kişiselleştirmek. Zor görüşmenin ana kuralı budur.","tr":"nesnel kalmak, konuda kalmak","s":"Bleiben wir bitte sachlich, dann kommen wir weiter.","st":"Lütfen konuda kalalım, o zaman ilerleriz.","f":"die Sache (mesele) · persönlich werden (kişiselleştirmek) · ruhig (sakin)"},{"w":"das Gespräch protokollieren","t":"Kollokation","k":"Protokoll (tutanak) + -ieren","c":"—","br":"Görüşülenin kısa yazılı özeti: kim, ne zaman, ne kararlaştırıldı. Zor konuşmalarda tek koruma budur; tarafların imzası kalıcı hâle getirir.","tr":"görüşmeyi tutanağa geçirmek","s":"Wir halten die Vereinbarung kurz schriftlich fest.","st":"Anlaşmayı kısaca yazılı olarak kayda geçiriyoruz.","f":"das Protokoll (tutanak) · festhalten (kayda geçirmek) · unterschreiben (imzalamak)"},{"w":"an die Grenze kommen","t":"Kalıp","k":"Grenze (sınır) + kommen","c":"—","br":"Kendi sınırını dile getirmek: Da komme ich an meine Grenzen. Suçlama içermeden „bu benim yapabileceğimin ötesinde“ demenin yolu; ardından destek talebi gelir.","tr":"sınırına gelmek, yetersiz kalmak","s":"Bei diesem Punkt komme ich an meine Grenzen — da brauchen wir Unterstützung.","st":"Bu noktada sınırıma geliyorum — burada desteğe ihtiyacımız var.","f":"die Grenze (sınır) · die Unterstützung (destek) · überfordert (aşırı yüklenmiş)"},{"w":"Rücksprache mit … halten","t":"Görüşme kalıbı","k":"Rücksprache + halten","c":"—","br":"Rück geriye, Sprache konuşma demektir: karar vermeden önce geri dönüp danışmak. halten fiili konuşma türlerini taşır — einen Vortrag halten, eine Rede halten, Rücksprache halten. Baskı altında karar vermemenin kibar yoludur.","tr":"…ile görüşüp dönmek","s":"Ich halte kurz Rücksprache mit der Schulleitung und melde mich dann.","st":"Okul yönetimiyle kısaca görüşüp size döneceğim.","f":"sich melden (haber vermek) · abklären (netleştirmek) · zuständig (yetkili)"},{"w":"das Gespräch beenden","t":"Kapanış kalıbı","k":"beenden (bitirmek)","c":"beendet – beendete – hat beendet","br":"beenden, das Ende (son) kökünden gelir ve be- ile geçişli olur: bir şeyi sona erdirmek. aufhören öznesizdir (kendiliğinden biter), beenden ise özneyi gerektirir — kim bitiriyorsa o sorumludur. Bu yüzden görüşme kapanışında bu fiil kullanılır.","tr":"görüşmeyi bitirmek","s":"Ich fasse kurz zusammen, dann können wir das Gespräch beenden.","st":"Kısaca özetleyeyim, sonra görüşmeyi bitirebiliriz.","f":"zusammenfassen (özetlemek) · der nächste Schritt (sonraki adım) · sich bedanken (teşekkür etmek)"}]},{"n":"Karne ve rapor dili","e":"beteiligt sich rege, benötigt Unterstützung…","c":"#8a6a4a","g":"Okul & öğretim dili","cards":[{"w":"beteiligt sich rege am Unterricht","t":"Karne kalıbı","k":"sich beteiligen an + rege (canlı)","c":"—","br":"Karne dili kademelidir: beteiligt sich rege (çok iyi) > regelmäßig (iyi) > gelegentlich (orta) > selten (zayıf). Aynı cümle iskeleti, tek kelimeyle dört ayrı not.","tr":"derse canlı biçimde katılıyor","s":"Er beteiligt sich rege und bringt eigene Ideen ein.","st":"Derse canlı biçimde katılıyor ve kendi fikirlerini getiriyor.","f":"rege (canlı) · gelegentlich (ara sıra) · sich einbringen (katkı sunmak)"},{"w":"arbeitet zuverlässig und sorgfältig","t":"Karne kalıbı","k":"zuverlässig (güvenilir) + sorgfältig (özenli)","c":"—","br":"Çalışma tutumunun iki ekseni: güvenilirlik (söz verdiğini yapar) ve özen (nasıl yapar). İkisi birlikte kullanılınca övgü tamdır.","tr":"güvenilir ve özenli çalışıyor","s":"Sie arbeitet zuverlässig, sorgfältig und meist selbstständig.","st":"Güvenilir, özenli ve çoğunlukla kendi başına çalışıyor.","f":"selbstständig (kendi başına) · gewissenhaft (titiz) · flüchtig (baştan savma)"},{"w":"benötigt noch Unterstützung","t":"Karne kalıbı","k":"benötigen (ihtiyaç duymak) + Unterstützung","c":"—","br":"Eksiği olumsuz demeden söylemenin yolu: „henüz desteğe ihtiyacı var“. Kalıptaki noch kelimesi gelişime açık kapı bırakır — kaldırılırsa cümle sertleşir.","tr":"henüz desteğe ihtiyaç duyuyor","s":"Beim selbstständigen Arbeiten benötigt er noch Unterstützung.","st":"Kendi başına çalışmada henüz desteğe ihtiyacı var.","f":"die Unterstützung (destek) · die Förderung (destekleme) · noch (henüz)"},{"w":"zeigt deutliche Fortschritte","t":"Karne kalıbı","k":"Fortschritt (ilerleme) + zeigen","c":"—","br":"Mutlak seviye yerine gelişimi ölçer. Zayıf öğrenciye adil davranmanın standart yolu: düşük seviye ama görünür ilerleme.","tr":"belirgin ilerleme gösteriyor","s":"Im zweiten Halbjahr zeigt sie deutliche Fortschritte im Lesen.","st":"İkinci yarıyılda okumada belirgin ilerleme gösteriyor.","f":"der Fortschritt (ilerleme) · die Entwicklung (gelişim) · sich steigern (kendini geliştirmek)"},{"w":"erfasst Zusammenhänge schnell","t":"Karne kalıbı","k":"erfassen (kavramak) + Zusammenhang (bağlantı)","c":"—","br":"Kavrama hızının resmî ifadesi. Kademeler: erfasst sehr schnell > erfasst sicher > braucht dafür etwas Zeit > benötigt zusätzliche Erklärungen.","tr":"bağlantıları hızlı kavrıyor","s":"Er erfasst mathematische Zusammenhänge sehr schnell.","st":"Matematiksel bağlantıları çok hızlı kavrıyor.","f":"der Zusammenhang (bağlantı) · begreifen (kavramak) · die Auffassungsgabe (kavrayış)"},{"w":"lässt sich leicht ablenken","t":"Karne kalıbı","k":"ablenken (dikkatini dağıtmak)","c":"lenkt ab – lenkte ab – hat abgelenkt","br":"lenken = yönlendirmek; ab- yönü saptırır. Eleştiriyi pasif yapıyla söylemek, öğrenciyi suçlamadan sorunu bildirmenin standart yolu.","tr":"kolayca dikkati dağılıyor","s":"In Gruppenphasen lässt er sich leicht ablenken.","st":"Grup çalışmalarında dikkati kolayca dağılıyor.","f":"lenken (yönlendirmek) · die Ablenkung (dikkat dağınıklığı) · konzentriert (odaklanmış)"},{"w":"hält sich an Absprachen","t":"Karne kalıbı","k":"sich halten an (uymak) + Absprache","c":"—","br":"Kurallara uyum bildiriminin nötr biçimi. Olumsuzu doğrudan söylenmez; „muss sich noch an Absprachen gewöhnen“ denir.","tr":"anlaşmalara uyuyor","s":"Sie hält sich zuverlässig an vereinbarte Regeln.","st":"Kararlaştırılan kurallara güvenilir biçimde uyuyor.","f":"die Absprache (mutabakat) · sich halten an (uymak) · die Regel (kural)"},{"w":"das Arbeitstempo","t":"Nomen (çoğulsuz)","k":"Arbeit + Tempo (hız)","c":"das Arbeitstempo","br":"Arbeit iş, Tempo ise İtalyanca „zaman“dan gelen hızdır. Yani işin zaman içindeki hızı. Fugen-s kuralı burada da çalışır. Değerlendirme kademesi kelimeyle verilir: zügig, angemessen, eher langsam.","tr":"çalışma temposu","s":"Das Arbeitstempo ist angemessen, die Ergebnisse sind sorgfältig.","st":"Çalışma temposu uygun, sonuçlar özenli.","f":"zügig (hızlı) · angemessen (uygun) · gründlich (esaslı)"},{"w":"die Leistungsbereitschaft","t":"Nomen (çoğulsuz)","k":"Leistung (performans) + Bereitschaft (hazır olma)","c":"die Leistungsbereitschaft","br":"„Çaba göstermeye hazır olma“: yetenekten farklı, tutumu ölçer. Karne dilinde yetenek düşük ama tutum iyi olan öğrenciyi korumanın yolu budur.","tr":"çaba gösterme isteği","s":"Seine Leistungsbereitschaft ist durchweg hoch.","st":"Çaba gösterme isteği baştan sona yüksek.","f":"leisten (yapmak, sunmak) · die Bereitschaft (hazır olma) · die Anstrengung (gayret)"},{"w":"das Sozialverhalten","t":"Nomen (çoğulsuz)","k":"sozial + Verhalten (davranış)","c":"das Sozialverhalten","br":"sich verhalten kendini belli bir şekilde tutmaktır, isim hâli das Verhalten; sozial ise başkalarıyla ilişki alanını gösterir. Yani ders başarısından ayrı ölçülen alan: nasıl tuttuğun değil, başkalarıyla nasıl davrandığın.","tr":"sosyal davranış","s":"Ihr Sozialverhalten ist vorbildlich.","st":"Sosyal davranışı örnek niteliğinde.","f":"hilfsbereit (yardımsever) · teamfähig (takım çalışmasına yatkın) · rücksichtsvoll (düşünceli)"},{"w":"vorbildlich ↔ verbesserungswürdig","t":"Değerlendirme çifti","k":"Vorbild (örnek) / Verbesserung + würdig","c":"—","br":"Ölçeğin iki ucu. verbesserungswürdig „iyileştirilmeye değer“ demektir — Almanca karne dili olumsuzu bile bir gelişim daveti biçiminde kurar.","tr":"örnek niteliğinde ↔ iyileştirmeye açık","s":"Die Heftführung ist noch verbesserungswürdig.","st":"Defter düzeni henüz iyileştirmeye açık.","f":"das Vorbild (örnek) · verbessern (iyileştirmek) · die Heftführung (defter düzeni)"},{"w":"stets ↔ meist ↔ überwiegend","t":"Sıklık kademesi","k":"stets (daima) / meist (çoğunlukla) / überwiegend (ağırlıklı olarak)","c":"—","br":"Karne dilinin gizli not sistemi: stets = en yüksek, meist ve überwiegend orta, teilweise ve gelegentlich düşük. Tek zarf notu belirler.","tr":"daima ↔ çoğunlukla ↔ ağırlıklı olarak","s":"Sie arbeitet stets konzentriert und überwiegend selbstständig.","st":"Daima odaklı ve ağırlıklı olarak kendi başına çalışıyor.","f":"immer (her zaman) · teilweise (kısmen) · gelegentlich (ara sıra)"},{"w":"die Versetzung ist gefährdet","t":"Karne uyarısı","k":"Versetzung (sınıf geçme) + gefährdet","c":"—","br":"Resmî uyarı cümlesi: sınıf geçme risk altında. Yazılı bildirim (Mahnung ya da blauer Brief) yasal olarak zorunludur — velinin önlem alma hakkı buna dayanır.","tr":"sınıf geçme tehlikede","s":"In Mathematik ist die Versetzung derzeit gefährdet.","st":"Matematikte sınıf geçme şu an tehlikede.","f":"gefährden (tehlikeye atmak) · der blaue Brief (uyarı mektubu) · die Nachprüfung (bütünleme)"},{"w":"die Empfehlung aussprechen","t":"Kollokation","k":"Empfehlung (tavsiye) + aussprechen","c":"—","br":"Resmî tavsiye bildirme: dördüncü sınıf sonunda okul türü tavsiyesi (Schulformempfehlung) böyle verilir. aussprechen burada „resmen dile getirmek“ demektir.","tr":"tavsiyede bulunmak","s":"Die Klassenkonferenz spricht eine Empfehlung für das Gymnasium aus.","st":"Sınıf kurulu lise için tavsiyede bulunuyor.","f":"empfehlen (önermek) · die Empfehlung (tavsiye) · die Klassenkonferenz (sınıf kurulu)"}]},{"n":"Öğrenme ve hafıza dili","e":"auswendig, sich merken, Eselsbrücke, üben…","c":"#3f7a5f","g":"Okul & öğretim dili","cards":[{"w":"auswendig lernen","t":"Kollokation","k":"aus + wendig (wenden: çevirmek)","c":"—","br":"„İçini dışına çevirerek“ bilmek = ezberlemek. Karşıtı verstehen; Almanca da bu ikisini karşı karşıya koyar: auswendig können ≠ verstanden haben.","tr":"ezberlemek","s":"Formeln auswendig zu lernen bringt wenig, wenn man sie nicht versteht.","st":"Formülleri anlamadan ezberlemek pek işe yaramıyor.","f":"wenden (çevirmek) · das Auswendiglernen (ezber) · verstehen (anlamak)"},{"w":"sich etwas merken","t":"Verb + Dativ refleksif","k":"merken (fark etmek) + sich (Dativ)","c":"merkt – merkte – hat gemerkt","br":"Refleksifin hâli anlamı ayırır: sich (Dativ) etwas merken = aklında tutmak; etwas merken = fark etmek. Cümlede başka Akkusativ nesne olduğu için sich Dativ olur.","tr":"aklında tutmak","s":"Diese Regel kann ich mir einfach nicht merken.","st":"Bu kuralı bir türlü aklımda tutamıyorum.","f":"merken (fark etmek) · das Merkmal (özellik) · die Merkhilfe (hatırlatıcı)"},{"w":"die Eselsbrücke","t":"Nomen, -n","k":"Esel (eşek) + Brücke (köprü)","c":"die Eselsbrücke, -n","br":"„Eşek köprüsü“: eşekler suya girmek istemediği için üzerlerine küçük köprüler kurulurmuş. Bugün: hatırlamayı kolaylaştıran küçük hile — bu uygulamanın mantığıyla akraba.","tr":"hatırlatıcı püf noktası, hafıza köprüsü","s":"Für die Reihenfolge gibt es eine gute Eselsbrücke.","st":"Sıralama için güzel bir hatırlatıcı püf noktası var.","f":"die Brücke (köprü) · die Merkhilfe (hatırlatıcı) · sich einprägen (zihne kazımak)"},{"w":"sich einprägen","t":"Verb","k":"ein + prägen (damga vurmak)","c":"prägt ein – prägte ein – hat eingeprägt","br":"prägen madeni paraya damga vurmaktır. Bir şeyi zihne damgalamak = kalıcı hâle getirmek. Aynı kökten prägnant (özlü, çarpıcı).","tr":"zihne kazımak, kalıcı kılmak","s":"Bilder prägen sich besser ein als reine Listen.","st":"Görseller salt listelerden daha kalıcı oluyor.","f":"prägen (damgalamak) · prägnant (özlü) · nachhaltig (kalıcı)"},{"w":"üben ↔ wiederholen","t":"Çalışma çifti","k":"üben (alıştırma yapmak) / wieder + holen","c":"—","br":"üben yeni beceriyi kurar, wiederholen var olanı tazeler. Öğrenme sırası bu ikisinin dönüşümüdür: üben → wiederholen → anwenden.","tr":"alıştırma yapmak ↔ tekrar etmek","s":"Erst üben, dann in Abständen wiederholen.","st":"Önce alıştırma yap, sonra aralıklarla tekrar et.","f":"die Übung (alıştırma) · die Wiederholung (tekrar) · anwenden (uygulamak)"},{"w":"pauken ↔ verstehen","t":"Karşıt çift","k":"pauken (davul çalmak → tıka basa çalışmak)","c":"—","br":"pauken davul kökünden gelir: gürültülü, zorlama ezber. Konuşma dilinde sınav öncesi tıkınmayı anlatır; karşıtı anlayarak öğrenmedir.","tr":"tıka basa ezberlemek ↔ anlamak","s":"Vor der Prüfung wird gepaukt statt verstanden.","st":"Sınavdan önce anlamak yerine tıkınılıyor.","f":"büffeln (ineklemek) · die Prüfung (sınav) · begreifen (kavramak)"},{"w":"sich konzentrieren auf (A)","t":"Verb + Präposition","k":"con (birlikte) + centrum (merkez)","c":"konzentriert – konzentrierte – hat konzentriert","br":"Latince: her şeyi tek merkeze toplamak. Karşıtı sich ablenken lassen. İsim: die Konzentration; sıfat: konzentriert.","tr":"…e odaklanmak","s":"Ich kann mich bei Musik einfach nicht konzentrieren.","st":"Müzik varken bir türlü odaklanamıyorum.","f":"die Konzentration (odaklanma) · ablenken (dikkat dağıtmak) · die Ruhe (sessizlik)"},{"w":"der Lernstoff bewältigen","t":"Kollokation","k":"Lernstoff (öğrenilecek içerik) + bewältigen","c":"—","br":"Konu yığınını alt etmek. Parçalama dili: in Etappen, in kleinen Schritten, Kapitel für Kapitel — bu ifadeler öğrenme planının iskeletidir.","tr":"konuyu alt etmek, bitirmek","s":"Den ganzen Stoff bewältigt man nur in kleinen Schritten.","st":"Bütün konu ancak küçük adımlarla alt edilir.","f":"der Stoff (konu) · bewältigen (üstesinden gelmek) · die Etappe (aşama)"},{"w":"in Etappen lernen","t":"Kalıp","k":"Etappe (aşama, etap)","c":"—","br":"Aralıklı çalışma ilkesi: uzun bir seferde değil, bölünmüş aralıklarla. Almanca karşılığı: verteiltes Lernen; karşıtı: alles auf einmal.","tr":"aşamalara bölerek öğrenmek","s":"In Etappen lernt man langfristig deutlich mehr.","st":"Aşamalara bölerek çalışmak uzun vadede çok daha fazlasını kazandırır.","f":"die Etappe (aşama) · langfristig (uzun vadeli) · die Pause (mola)"},{"w":"der Zusammenhang herstellen","t":"Kollokation","k":"Zusammenhang (bağlantı) + herstellen (kurmak)","c":"—","br":"Öğrenmenin çekirdek işi: yeni bilgiyi bilinene bağlamak. Bağsız bilgi unutulur; kurulan bağ hatırlamanın tutamağı olur.","tr":"bağlantı kurmak","s":"Wer Zusammenhänge herstellt, muss weniger auswendig lernen.","st":"Bağlantı kuran daha az ezberlemek zorunda kalır.","f":"zusammenhängen (bağlantılı olmak) · herstellen (kurmak) · verknüpfen (bağlamak)"},{"w":"die Wissenslücke","t":"Nomen, -n","k":"Wissen (bilgi) + Lücke (boşluk)","c":"die Wissenslücke, -n","br":"Bilgideki boşluk. Kalıp: Lücken schließen (boşlukları kapatmak). Aynı kelime metinlerde de kullanılır: der Lückentext (boşluk doldurma metni).","tr":"bilgi boşluğu, eksik","s":"Wir sollten zuerst die größten Lücken schließen.","st":"Önce en büyük boşlukları kapatmalıyız.","f":"die Lücke (boşluk) · lückenhaft (eksik) · der Lückentext (boşluklu metin)"},{"w":"der Aha-Effekt","t":"Nomen, -e","k":"„Aha!“ ünlemi + Effekt","c":"der Aha-Effekt, -e","br":"Anlamanın bir anda geldiği o an. Almanca bu deneyimi ünlemle adlandırmış; ilgili fiil: Es dämmert mir — kafamda ışık yanıyor.","tr":"anlama anı, ampulün yanması","s":"Bei dieser Erklärung hatte die halbe Klasse einen Aha-Effekt.","st":"Bu açıklamada sınıfın yarısında ampul yandı.","f":"dämmern (yavaş yavaş anlaşılmak) · begreifen (kavramak) · die Einsicht (kavrayış)"},{"w":"motivieren ↔ demotivieren","t":"Karşıt çift","k":"movere (hareket ettirmek) + -ieren","c":"—","br":"Latince kökü „hareket ettirmek“: motivasyon insanı yerinden oynatan şeydir. Aynı kökten das Motiv (güdü; motif) ve die Bewegung (hareket).","tr":"motive etmek ↔ hevesini kırmak","s":"Kleine Erfolge motivieren mehr als große Ziele.","st":"Küçük başarılar büyük hedeflerden daha çok motive ediyor.","f":"die Motivation (motivasyon) · das Motiv (güdü) · der Antrieb (itici güç)"},{"w":"dranbleiben","t":"Verb","k":"dran (bitişik) + bleiben (kalmak)","c":"bleibt dran – blieb dran – ist drangeblieben","br":"Bir işin ucunu bırakmamak: sürdürmek, pes etmemek. Öğrenmede en sık verilen tavsiye tek kelimeye iner: Bleib dran.","tr":"bırakmamak, devam etmek","s":"Wichtiger als Talent ist, jeden Tag dranzubleiben.","st":"Yetenekten önemlisi her gün devam etmektir.","f":"aufgeben (pes etmek) · durchhalten (dayanmak) · die Ausdauer (dayanıklılık)"}]},{"n":"Matematik ve fen dili","e":"Gleichung, Bruch, Steigung, Ableitung…","c":"#2a4d69","g":"Okul & öğretim dili","cards":[{"w":"die Gleichung","t":"Nomen, -en","k":"gleich (eşit) + -ung","c":"die Gleichung, die Gleichungen","br":"Eşitleme eylemi = denklem. Türkçe „denklem“ (denk) ile birebir aynı mantık: iki tarafın denk olması.","tr":"denklem","s":"Lösen Sie die Gleichung nach x auf.","st":"Denklemi x’e göre çözün.","f":"gleich (eşit) · das Gleichheitszeichen (eşittir işareti) · die Ungleichung (eşitsizlik)"},{"w":"der Term","t":"Nomen, -e","k":"terminus (sınır, uç)","c":"der Term, die Terme","br":"Latince „sınır“: bir ifadenin kendi içinde kapalı parçası. Term hesaplanır, Gleichung ise iki termi eşitler — bu ayrım öğrencilerin en sık karıştırdığı yerdir.","tr":"terim, cebirsel ifade","s":"Vereinfachen Sie den Term so weit wie möglich.","st":"İfadeyi mümkün olduğunca sadeleştirin.","f":"vereinfachen (sadeleştirmek) · der Termin (randevu: belirlenmiş uç nokta) · umformen (dönüştürmek)"},{"w":"der Bruch","t":"Nomen, ¨-e","k":"brechen (kırmak)","c":"der Bruch, die Brüche","br":"Kırılmış bütün = kesir. Türkçe „kesir“ (kesmek) ile aynı imge. Aynı kelime kırık, kopuş ve fıtık anlamlarını da taşır.","tr":"kesir","s":"Kürzen Sie den Bruch so weit wie möglich.","st":"Kesri mümkün olduğunca sadeleştirin.","f":"brechen (kırmak) · kürzen (sadeleştirmek, kısaltmak) · erweitern (genişletmek, payda büyütmek)","m":[{"tr":"kırık, kopuş","s":"Nach dem Streit kam es zum endgültigen Bruch.","st":"Kavgadan sonra kesin bir kopuş yaşandı."}]},{"w":"der Zähler / der Nenner","t":"Nomen, -","k":"zählen (saymak) / nennen (adlandırmak)","c":"der Zähler, -; der Nenner, -","br":"Üstteki sayı kaç parça olduğunu SAYAR (Zähler), alttaki parçanın adını KOYAR (Nenner): üçte bir, beşte bir. İsimlendiren alttadır — bu yüzden „ortak payda“ der gemeinsame Nenner’dir.","tr":"pay / payda","s":"Zähler und Nenner werden durch dieselbe Zahl geteilt.","st":"Pay ve payda aynı sayıya bölünür.","f":"zählen (saymak) · nennen (adlandırmak) · der gemeinsame Nenner (ortak payda)"},{"w":"die Steigung","t":"Nomen, -en","k":"steigen (yükselmek) + -ung","c":"die Steigung, die Steigungen","br":"Yükselme miktarı = eğim. Yolda yokuş, grafikte doğrunun eğimi — aynı kelime. Negatif olursa das Gefälle (iniş) denir.","tr":"eğim, yokuş","s":"Die Steigung der Geraden beträgt zwei.","st":"Doğrunun eğimi iki.","f":"steigen (yükselmek) · das Gefälle (iniş, eğim) · das Steigungsdreieck (eğim üçgeni)"},{"w":"die Ableitung","t":"Nomen, -en","k":"ab + leiten (yönlendirmek, iletmek) + -ung","c":"die Ableitung, die Ableitungen","br":"ableiten = bir şeyden başka bir şeyi türetmek. Fonksiyondan türetilen fonksiyon = türev. Aynı fiil dilbilgisinde de kullanılır: kelime türetme.","tr":"türev; türetme","s":"Bilden Sie die erste Ableitung der Funktion.","st":"Fonksiyonun birinci türevini alın.","f":"ableiten (türetmek) · leiten (yönetmek, iletmek) · die Herleitung (çıkarım, ispat yolu)"},{"w":"die Wurzel","t":"Nomen, -n","k":"Wurzel (bitki kökü)","c":"die Wurzel, die Wurzeln","br":"Sayının „kökü“: karesi alındığında onu veren sayı. Türkçe „kök“ ile birebir aynı imge; dilbilgisinde de kelime kökü aynı kelimeyle anılır (Wortwurzel).","tr":"kök (karekök)","s":"Die Wurzel aus 144 ist zwölf.","st":"144’ün karekökü on ikidir.","f":"die Quadratwurzel (karekök) · ziehen (kök almak: die Wurzel ziehen) · wurzeln in (…e dayanmak)"},{"w":"die Klammer","t":"Nomen, -n","k":"klemmen (sıkıştırmak)","c":"die Klammer, die Klammern","br":"Sıkıştıran şey: mandal, ataç ve parantez. Parantez de içindekini sıkıştırıp bir arada tutar. Kalıp: Klammer auflösen — parantezi açmak.","tr":"parantez; mandal","s":"Zuerst wird die Klammer aufgelöst.","st":"Önce parantez açılır.","f":"klemmen (sıkıştırmak) · ausklammern (dışarıda bırakmak) · die Klammer auflösen (parantezi açmak)"},{"w":"der Rest","t":"Nomen, -e","k":"restare (geride kalmak)","c":"der Rest, die Reste","br":"Geriye kalan. Bölmede kalan sayı; günlükte artık, kalıntı. Kalıp: 17 geteilt durch 5 ist 3 Rest 2.","tr":"kalan; artık","s":"Siebzehn geteilt durch fünf ergibt drei Rest zwei.","st":"On yedi bölü beş, üç kalan iki eder.","f":"restlich (geri kalan) · restlos (tamamen) · übrig bleiben (geriye kalmak)"},{"w":"die Fläche","t":"Nomen, -n","k":"flach (düz) + -e","c":"die Fläche, die Flächen","br":"Düz olan = yüzey; ölçülünce alan. Aynı kalıp: hoch→Höhe, tief→Tiefe, weit→Weite, flach→Fläche.","tr":"alan, yüzey","s":"Berechnen Sie die Fläche des Dreiecks.","st":"Üçgenin alanını hesaplayın.","f":"flach (düz) · der Flächeninhalt (alan) · die Wohnfläche (konut alanı)"},{"w":"der Umfang","t":"Nomen, ¨-e","k":"um (etrafında) + fangen (yakalamak, kavramak)","c":"der Umfang, die Umfänge","br":"Etrafını saran şey = çevre. Soyut olarak: bir işin kapsamı, hacmi. İki anlam da „etrafını kavramak“tan çıkar.","tr":"çevre (geometri)","s":"Der Umfang des Kreises beträgt etwa 31,4 cm.","st":"Dairenin çevresi yaklaşık 31,4 cm.","f":"umfangreich (kapsamlı) · umfassen (kapsamak) · fangen (yakalamak)","m":[{"tr":"kapsam, hacim","s":"Der Umfang der Arbeiten war vorher nicht absehbar.","st":"İşlerin kapsamı önceden öngörülebilir değildi."}]},{"w":"die Wahrscheinlichkeit","t":"Nomen, -en","k":"wahr (doğru) + scheinen (görünmek) + -lich + -keit","c":"die Wahrscheinlichkeit, -en","br":"„Doğru görünme hâli“ = olasılık. Kelime kavramın tanımını taşıyor: kesin değil, doğru görünen. Türkçe „olasılık“ ile aynı mantıkta.","tr":"olasılık","s":"Die Wahrscheinlichkeit beträgt in diesem Fall ein Sechstel.","st":"Olasılık bu durumda altıda birdir.","f":"wahrscheinlich (muhtemel) · wahr (doğru) · scheinen (görünmek)"},{"w":"beweisen","t":"Verb","k":"be + weisen (göstermek)","c":"beweist – bewies – hat bewiesen","br":"Göstererek kesinleştirmek. Matematikte ispat, hukukta delil. Kalıp: den Beweis führen — ispatı yürütmek, adım adım götürmek.","tr":"ispatlamak, kanıtlamak","s":"Beweisen Sie, dass die Summe stets gerade ist.","st":"Toplamın daima çift olduğunu ispatlayın.","f":"der Beweis (ispat, delil) · den Beweis führen (ispat etmek) · nachweisen (belgelemek)"},{"w":"es gilt / daraus folgt","t":"Kalıp (matematik dili)","k":"gelten (geçerli olmak) / folgen (izlemek)","c":"gilt – galt – hat gegolten","br":"İspatın iki ana bağlacı: „es gilt …“ = şu geçerlidir (önerme kurar); „daraus folgt …“ = bundan şu çıkar (adımı bağlar). Almanca matematik dili neredeyse bu iki kalıpla yürür.","tr":"…geçerlidir / bundan …çıkar","s":"Für alle natürlichen Zahlen gilt: Daraus folgt unmittelbar die Behauptung.","st":"Tüm doğal sayılar için geçerlidir: buradan iddia doğrudan çıkar.","f":"gelten (geçerli olmak) · folgen (izlemek) · die Behauptung (iddia, önerme)"}]},{"n":"Matematik: işlem ve şekil","e":"addieren, Winkel, Gerade, senkrecht…","c":"#3a5f9c","g":"Okul & öğretim dili","cards":[{"w":"addieren ↔ subtrahieren","t":"İşlem çifti","k":"addere (eklemek) / subtrahere (aşağı çekmek)","c":"addiert / subtrahiert","br":"Latince kökler işlemi anlatıyor: eklemek ve „altından çekip almak“. Almanca karşılıkları da vardır: zusammenzählen ve abziehen — okulda ikisi de kullanılır.","tr":"toplamak ↔ çıkarmak","s":"Addieren Sie zuerst die Klammer, subtrahieren Sie danach.","st":"Önce parantezi toplayın, sonra çıkarma yapın.","f":"die Summe (toplam) · die Differenz (fark) · abziehen (çıkarmak)"},{"w":"multiplizieren ↔ dividieren","t":"İşlem çifti","k":"multiplex (çok katlı) / dividere (bölmek)","c":"multipliziert / dividiert","br":"„Kat kat yapmak“ ve „bölmek“. Almanca hâlleri: malnehmen ve teilen. Sonuçlarının adı: das Produkt ve der Quotient.","tr":"çarpmak ↔ bölmek","s":"Multiplizieren Sie beide Seiten mit drei.","st":"Her iki tarafı üçle çarpın.","f":"das Produkt (çarpım) · der Quotient (bölüm) · der Faktor (çarpan)"
