mehr, zunehmend.","tr":"giderek daha …","s":"Die Wohnungen werden immer teurer.","st":"Daireler giderek daha pahalı oluyor.","f":"zunehmend (giderek artan) · immer mehr (giderek daha çok) · stetig (istikrarlı biçimde)"},{"w":"möglichst","t":"Adverb","k":"möglich (mümkün) + -st","c":"—","br":"„Mümkün olduğunca“: sıfatın önüne gelir ve talebi yumuşatarak sınırı gösterir. Eş biçimi: so … wie möglich.","tr":"mümkün olduğunca","s":"Melde dich möglichst bald, am besten noch heute.","st":"Mümkün olduğunca çabuk haber ver, en iyisi bugün.","f":"möglich (mümkün) · so bald wie möglich (en kısa sürede) · spätestens (en geç)"},{"w":"ziemlich ↔ ganz ↔ recht","t":"Derece belirteçleri","k":"ziemlich (epey) · ganz (oldukça/tamamen) · recht (hayli)","c":"—","br":"Hepsi „biraz fazla“ demek gibi görünse de güçleri farklıdır: ganz gut ölçülü bir övgüdür (fena değil), ziemlich gut daha güçlüdür, sehr gut en üsttür. Vurgu ganz’ı „tamamen“ye çevirir.","tr":"epey / oldukça / hayli","s":"Das Essen war ganz gut, der Service allerdings ziemlich langsam.","st":"Yemek fena değildi, servis ise epey yavaştı.","f":"sehr (çok) · ganz (tamamen; oldukça) · äußerst (son derece)"},{"w":"äußerst / überaus / höchst","t":"Yükseltici belirteçler","k":"äußerst (en dışta) · überaus (aşırı ölçüde)","c":"—","br":"sehr’in yazı dilindeki güçlü karşılıkları. äußerst en yaygını, höchst daha resmî, überaus daha edebîdir. Resmî yazıda sehr yerine bunlar tercih edilir.","tr":"son derece, fevkalade","s":"Ihre Rückmeldung war äußerst hilfreich.","st":"Geri bildiriminiz son derece yardımcı oldu.","f":"sehr (çok) · besonders (özellikle) · überaus (aşırı derecede)"},{"w":"kaum","t":"Adverb","k":"eski: güçlükle","c":"—","br":"Neredeyse hiç. Eski anlamı „güçlükle, zar zor“dur ve bu ton hâlâ içindedir. Olumsuza yakındır ama nicht kadar kesin değildir — arada bir yerde durur: kaum jemand (neredeyse hiç kimse), kaum zu glauben (inanması güç).","tr":"neredeyse hiç; güçlükle","s":"Ich habe letzte Nacht kaum geschlafen.","st":"Dün gece neredeyse hiç uyumadım.","f":"fast nicht (neredeyse hiç) · gar nicht (hiç) · kaum zu glauben (inanması güç)"},{"w":"mindestens ↔ höchstens ↔ etwa","t":"Sınır belirteçleri","k":"en az / en fazla / yaklaşık","c":"—","br":"Bir rakamın hangi yönde sınırlandığını söyler: mindestens alt sınır, höchstens üst sınır, etwa iki yöne de açık. Sözleşme ve tarifte üçü de belirleyicidir.","tr":"en az / en fazla / yaklaşık","s":"Die Fahrt dauert mindestens eine Stunde, höchstens zwei.","st":"Yolculuk en az bir, en fazla iki saat sürer.","f":"wenigstens (hiç değilse) · maximal (azami) · ungefähr (aşağı yukarı)"},{"w":"halb so viel / doppelt so viel","t":"Oran kalıbı","k":"kat + so + sıfat + wie","c":"—","br":"Katı ve oranı wie ile bağlar: doppelt so teuer wie, halb so lang wie. Türkçedeki „iki katı kadar“ yapısıyla aynı sıra.","tr":"yarısı kadar / iki katı kadar","s":"Die neue Wohnung kostet fast doppelt so viel wie die alte.","st":"Yeni daire eskisinin neredeyse iki katı tutuyor.","f":"das Doppelte (iki katı) · die Hälfte (yarısı) · so viel wie (…kadar)"},{"w":"je … desto (derece)","t":"Orantı kalıbı","k":"je + Komparativ … desto + Komparativ","c":"—","br":"İki değişkeni birlikte hareket ettirir. Dizim sabittir: je’li kısımda fiil sonda, desto’lu kısımda hemen arkada. Eş biçimi je … umso.","tr":"ne kadar … o kadar","s":"Je später es wird, desto leerer werden die Straßen.","st":"Vakit ilerledikçe sokaklar boşalıyor.","f":"umso (o kadar) · abhängen von (bağlı olmak) · der Zusammenhang (bağlantı)"},{"w":"eher ↔ lieber","t":"Karşılaştırma çifti","k":"eher (daha ziyade) · lieber (tercihen)","c":"—","br":"eher bir değerlendirmeyi yumuşatır: „daha çok şuna yakın“. lieber ise tercihi bildirir: „daha severim“. İkisi Türkçede çoğu kez aynı kelimeyle çevrildiği için karışır.","tr":"daha ziyade ↔ tercihen","s":"Das ist eher ein Missverständnis; ich würde lieber direkt fragen.","st":"Bu daha çok bir yanlış anlaşılma; ben doğrudan sormayı tercih ederim.","f":"lieber (tercihen) · am liebsten (en çok) · vielmehr (aksine)"},{"w":"vergleichsweise / verhältnismäßig","t":"Karşılaştırma belirteci","k":"Vergleich (karşılaştırma) / Verhältnis (oran) + -weise/-mäßig","c":"—","br":"„Diğerlerine kıyasla“ demenin iki resmî yolu. Rakam vermeden bir değeri konumlandırır; yazı dilinde çok işlek.","tr":"kıyasla, nispeten","s":"Die Nebenkosten sind hier vergleichsweise niedrig.","st":"Yan giderler burada kıyasla düşük.","f":"der Vergleich (karşılaştırma) · relativ (göreli) · im Vergleich zu (…e kıyasla)"},{"w":"bei Weitem / mit Abstand","t":"Vurgulu üstünlük","k":"Weite (genişlik) / Abstand (mesafe)","c":"—","br":"Farkın büyüklüğünü vurgular: „açık ara“. Superlativ ile birlikte gelir: mit Abstand die beste Lösung. Olumsuzda ise „hiç de değil“: bei Weitem nicht genug.","tr":"açık ara, kat kat","s":"Das ist mit Abstand die einfachste Lösung.","st":"Bu, açık ara en basit çözüm.","f":"der Abstand (mesafe) · deutlich (belirgin) · knapp (kıl payı)"}]},{"n":"Konjunktiv: nezaket ve mesafe","e":"wäre, würde, dürfte, sollte — resmî dilin ince ayarı","c":"#6a4c93","g":"Dilbilgisi mantığı","cards":[{"w":"Ich wäre Ihnen dankbar, wenn …","t":"Kalıp (Konjunktiv II)","k":"sein → wäre + wenn-cümlesi","c":"ist – war – wäre","br":"Gerçek olmayan kip, talebi gerçekten bir adım uzağa iter: „öyle olsaydı minnettar olurdum“. Bu mesafe kibarlığı üretir; doğrudan „Ich will“ resmî yazıda kabalık sayılır.","tr":"…rsanız minnettar olurum","s":"Ich wäre Ihnen dankbar, wenn Sie mir kurz Bescheid geben könnten.","st":"Bana kısaca haber verebilirseniz minnettar olurum.","f":"dankbar (minnettar) · die Bitte (rica) · höflich (nazik)"},{"w":"Ich würde es begrüßen, wenn …","t":"Kalıp (Konjunktiv II)","k":"würde + begrüßen (selamlamak, hoş karşılamak)","c":"begrüßt – begrüßte – würde begrüßen","br":"begrüßen = kapıda karşılamak. Bir öneriyi „karşılamak“ = onaylamak. Konjunktiv ile: ısrar etmeden istek bildirmek.","tr":"…olmasını memnuniyetle karşılarım","s":"Ich würde es begrüßen, wenn wir das im Gespräch klären könnten.","st":"Bunu görüşmede açıklığa kavuşturabilmemizi memnuniyetle karşılarım.","f":"begrüßen (hoş karşılamak) · der Gruß (selam) · befürworten (desteklemek)"},{"w":"Es wäre hilfreich, wenn …","t":"Kalıp (Konjunktiv II)","k":"wäre + hilfreich (yardımcı)","c":"—","br":"Talebi kişiden koparıp duruma bağlar: „faydalı olurdu“. Kimseyi suçlamadan eksik isteme yolu.","tr":"…olsa yardımcı olurdu","s":"Es wäre hilfreich, wenn Sie den Verteilerschlüssel angeben würden.","st":"Dağıtım anahtarını belirtirseniz yardımcı olur.","f":"hilfreich (yardımcı, faydalı) · die Hilfe (yardım) · nützlich (yararlı)"},{"w":"Dürfte ich Sie bitten, …","t":"Kalıp (Konjunktiv II)","k":"dürfen → dürfte + bitten (rica etmek)","c":"darf – durfte – dürfte","br":"„İzin verilir miydi“ diye sormak: ricayı izne dönüştürmek. Almancanın en nazik istek kalıbı.","tr":"Sizden … rica edebilir miyim","s":"Dürfte ich Sie bitten, den Termin schriftlich zu bestätigen?","st":"Randevuyu yazılı olarak teyit etmenizi rica edebilir miyim?","f":"bitten um (rica etmek) · die Bitte (rica) · gestatten (izin vermek)"},{"w":"Es dürfte sich um … handeln","t":"Kalıp (varsayım)","k":"dürfte + es handelt sich um","c":"—","br":"dürfte burada izin değil, tahmin bildirir: „büyük ihtimalle şudur“. Kesin konuşmadan sonuç söylemenin resmî yolu; kesinlik sırası: dürfte < müsste < muss.","tr":"muhtemelen … söz konusudur","s":"Es dürfte sich um einen Übertragungsfehler handeln.","st":"Muhtemelen bir aktarım hatası söz konusu.","f":"vermutlich (muhtemelen) · die Vermutung (tahmin) · es handelt sich um (söz konusu olan)"},{"w":"Das müsste eigentlich …","t":"Kalıp (beklenti)","k":"müssen → müsste + eigentlich (aslında)","c":"muss – musste – müsste","br":"müsste = mantık gereği öyle olması beklenir; eigentlich bu beklentiye „ama emin değilim“ tonunu ekler.","tr":"aslında … olması lazım","s":"Das Paket müsste eigentlich längst da sein.","st":"Kargonun aslında çoktan gelmiş olması lazım.","f":"eigentlich (aslında) · vermutlich (muhtemelen) · offenbar (görünüşe göre)"},{"w":"Sollte sich herausstellen, dass …","t":"Kalıp (koşul, bağlaçsız)","k":"sollte + devrik cümle (wenn atlanır)","c":"soll – sollte – sollte","br":"wenn atılıp fiil başa alınınca koşul kurulur: „ortaya çıkacak olursa“. Resmî yazıda ihtimali dile getirmenin ölçülü biçimi.","tr":"…olduğu ortaya çıkarsa","s":"Sollte sich herausstellen, dass es nicht passt, tauschen wir es um.","st":"Uymadığı ortaya çıkarsa değiştiririz.","f":"sich herausstellen (ortaya çıkmak) · falls (…ise) · andernfalls (aksi hâlde)"},{"w":"Hätte ich … gewusst, …","t":"Kalıp (geçmiş irreal)","k":"hätte + Partizip II (Konjunktiv II der Vergangenheit)","c":"hat – hatte – hätte","br":"Olmamış geçmişi anlatır: „bilseydim, şöyle yapardım“. Yapı iki kez Konjunktiv ister: hätte … gewusst, hätte … getan.","tr":"…bilseydim, …","s":"Hätte ich das früher gewusst, hätte ich sofort widersprochen.","st":"Bunu daha önce bilseydim hemen itiraz ederdim.","f":"wissen (bilmek) · das Versäumnis (ihmal) · bereuen (pişman olmak)"},{"w":"Beinahe wäre …","t":"Kalıp (az kalsın)","k":"beinahe / fast + Konjunktiv II","c":"—","br":"Gerçekleşmemiş ama kıl payı kalmış olayı anlatır. Almanca bunu Konjunktiv ile işaretler: olmadı, ama olmasına ramak kaldı.","tr":"az kalsın … oluyordu","s":"Beinahe wäre ich in den falschen Zug gestiegen.","st":"Az kalsın yanlış trene biniyordum.","f":"beinahe (neredeyse) · fast (neredeyse) · um ein Haar (kıl payı)"},{"w":"An Ihrer Stelle würde ich …","t":"Kalıp (tavsiye)","k":"an … Stelle (yerinde) + würde","c":"—","br":"Kendini karşının yerine koyup öneri vermek. Emir kipinden çok daha yumuşak: „ben olsam“.","tr":"sizin yerinizde olsam …","s":"An Ihrer Stelle würde ich zunächst Belegeinsicht verlangen.","st":"Sizin yerinizde olsam önce belge incelemesi talep ederdim.","f":"die Stelle (yer) · raten (tavsiye etmek) · empfehlen (önermek)"},{"w":"Er sei / habe … (Konjunktiv I)","t":"Kalıp (dolaylı aktarım)","k":"sein → sei; haben → habe","c":"ist – sei / hat – habe","br":"Konjunktiv I aktarılan sözü işaretler: „öyle söylüyor, ben doğruluğunu üstlenmiyorum“. Gazete ve resmî tutanakların dili budur.","tr":"…olduğunu söylüyor (aktarım)","s":"Er sagt, er sei im Stau gestanden.","st":"Trafikte kaldığını söylüyor.","f":"die indirekte Rede (dolaylı anlatım) · angeblich (sözde) · laut (…göre)"},{"w":"es sei denn, …","t":"Kalıp (istisna)","k":"es sei (Konjunktiv I) + denn","c":"—","br":"Donmuş bir Konjunktiv I: „şu olmadıkça“. Bir kuralın tek istisnasını eklemenin en kısa yolu.","tr":"…olmadıkça, ancak … ise","s":"Die Kosten trägt der Mieter, es sei denn, der Schaden war bereits vorhanden.","st":"Masrafları kiracı üstlenir, meğerki hasar önceden mevcut olsun.","f":"außer wenn (…dışında) · sofern nicht (…değilse) · die Ausnahme (istisna)"},{"w":"Wie dem auch sei","t":"Kalıp","k":"wie + dem + auch + sei (Konjunktiv I)","c":"—","br":"„Durum nasıl olursa olsun“ — tartışmayı kapatıp asıl konuya dönmenin kalıbı. Yine donmuş bir Konjunktiv I.","tr":"her hâlükârda, nasıl olursa olsun","s":"Wie dem auch sei — wir fangen jetzt an.","st":"Nasıl olursa olsun, şimdi başlıyoruz.","f":"jedenfalls (her hâlükârda) · ohnehin (zaten) · unabhängig davon (bundan bağımsız)"},{"w":"Ich hätte da noch eine Frage","t":"Kalıp (yumuşatma)","k":"hätte + da (öylesine) + noch","c":"—","br":"Gerçekte „habe“ olmalı; Konjunktiv soruyu küçültür, araya sıkıştırır. da ve noch kelimeleri de aynı işi yapar: talebi hafifletmek.","tr":"bir sorum daha olacaktı","s":"Ich hätte da noch eine Frage zur Verteilung der Heizkosten.","st":"Isıtma giderlerinin dağıtımıyla ilgili bir sorum daha olacaktı.","f":"die Frage (soru) · nachfragen (tekrar sormak) · höflich (nazik)"}]},{"n":"Edatlar: Akkusativ ve Dativ","e":"durch, für, gegen, ohne · aus, bei, mit, nach, seit, von, zu","c":"#25607a","g":"Edatlı fiiller & kalıplar","cards":[{"w":"durch (+ Akkusativ)","t":"Präposition","k":"durch (içinden geçerek)","c":"—","br":"Bir şeyin içinden geçmek: mekânda tünelden, soyutta ise araçtan. „…sayesinde, …yoluyla“ anlamı buradan doğar: bilgi bir kanaldan geçip gelir.","tr":"…içinden; …aracılığıyla","s":"Wir sind durch den Park gelaufen.","st":"Parkın içinden yürüdük.","f":"hindurch (boyunca) · dadurch (bu sayede) · durchqueren (kat etmek)","m":[{"tr":"aracılığıyla, sayesinde","s":"Durch einen Kollegen habe ich von der Stelle erfahren.","st":"O işten bir meslektaş aracılığıyla haberim oldu."}]},{"w":"für (+ Akkusativ)","t":"Präposition","k":"für (…yararına, …karşılığında)","c":"—","br":"Yön kimin lehine? Bunu für gösterir: alıcı, amaç, süre ve karşılık. Süre bildirdiğinde geleceğe bakar: für zwei Wochen.","tr":"…için; …karşılığında","s":"Das habe ich für dich mitgebracht.","st":"Bunu senin için getirdim.","f":"dafür (bunun için) · wofür (ne için) · sich einsetzen für (savunmak)"},{"w":"gegen (+ Akkusativ)","t":"Präposition","k":"gegen (karşı, …e doğru)","c":"—","br":"Karşıtlık: bir şeye karşı olmak, çarpmak. Saatle kullanılınca „civarı“ olur — zaman da bir noktaya doğru gelir: gegen acht.","tr":"…e karşı; (saat) civarı","s":"Ich bin gegen diesen Vorschlag.","st":"Bu öneriye karşıyım.","f":"dagegen (buna karşı) · der Gegensatz (karşıtlık) · gegenüber (karşısında)","m":[{"tr":"(saat) sularında","s":"Wir kommen gegen sieben.","st":"Yedi sularında geliriz."}]},{"w":"ohne (+ Akkusativ)","t":"Präposition","k":"ohne (…siz)","c":"—","br":"Yokluk bildirir ve arkasından gelen isim genelde artikelsiz kalır: ohne Auto, ohne Termin. Mastar kalıbı: ohne … zu.","tr":"…siz, …olmadan","s":"Ohne Termin geht hier gar nichts.","st":"Randevusuz burada hiçbir şey olmuyor.","f":"ohne zu (…meden) · ohnehin (zaten) · mit (ile)"},{"w":"um (+ Akkusativ)","t":"Präposition","k":"um (etrafında; tam saatte)","c":"—","br":"Etrafını dolanmak: mekânda çevresinde, saatte tam nokta (um acht), rakamda ise fark (um zehn Prozent). Üç kullanım da „bir nokta etrafında“ fikrinden.","tr":"etrafında; saat …de; …kadar (fark)","s":"Wir treffen uns um halb acht am Bahnhof.","st":"Yedi buçukta garda buluşuyoruz.","f":"herum (etrafında) · sich kümmern um (ilgilenmek) · um … zu (…mek için)"},{"w":"bis (+ Akkusativ)","t":"Präposition","k":"bis (…e kadar, sınır noktası)","c":"—","br":"Sınırı işaretler. Tek başına artikelsiz gelir (bis Montag), artikel gerekiyorsa yanına ikinci edat alır: bis zum Wochenende, bis zur Ampel.","tr":"…e kadar","s":"Bis Freitag schaffe ich das auf keinen Fall.","st":"Cumaya kadar bunu asla yetiştiremem.","f":"bis zu (…e kadar) · bislang (şimdiye dek) · ab (…den itibaren)"},{"w":"aus (+ Dativ)","t":"Präposition","k":"aus (içinden dışarı; …den yapılmış)","c":"—","br":"Çıkış noktası: mekân (aus der Türkei), malzeme (aus Holz) ve sebep (aus Versehen: yanlışlıkla). Üçü de „kaynak“ fikrini taşır.","tr":"…den (içinden); …dan yapılmış","s":"Der Tisch ist aus massivem Holz.","st":"Masa masif ahşaptan.","f":"heraus (dışarı) · daraus (bundan) · aus Versehen (yanlışlıkla)"},{"w":"bei (+ Dativ)","t":"Präposition","k":"bei (yanında, nezdinde, …sırasında)","c":"—","br":"Yakınlık: kişi yanında (bei uns), kurum nezdinde (bei der Bank), eylem sırasında (beim Essen). Türkçedeki „…de, …iken“ karşılığı.","tr":"…nın yanında; …de; …iken","s":"Beim Frühstück reden wir kaum.","st":"Kahvaltıda pek konuşmuyoruz.","f":"dabei (bu sırada) · beim (bei dem) · vorbei (yanından)"},{"w":"mit (+ Dativ)","t":"Präposition","k":"mit (birlikte; araç)","c":"—","br":"Beraberlik ve araç: kiminle ve neyle. Ulaşım aracı daima mit alır: mit dem Bus, mit dem Rad. Yaş için de: mit 18.","tr":"ile, birlikte","s":"Ich fahre lieber mit dem Rad.","st":"Ben bisikletle gitmeyi tercih ederim.","f":"damit (bununla) · mitkommen (birlikte gelmek) · miteinander (birbiriyle)"},{"w":"nach (+ Dativ)","t":"Präposition","k":"nach (…dan sonra; …e doğru; …e göre)","c":"—","br":"Üç iş: zamanda sonra (nach dem Essen), yönde şehir ve ülkeye (nach Köln, nach Italien), ölçüde göre (nach Vorschrift). Şehir/ülke yönü daima nach’tır — istisna artikelli ülkeler: in die Türkei.","tr":"…dan sonra; …e; …e göre","s":"Nach der Arbeit fahre ich direkt nach Hause.","st":"İşten sonra doğruca eve gidiyorum.","f":"danach (ondan sonra) · nachher (sonra) · sich richten nach (…e göre olmak)"},{"w":"seit (+ Dativ)","t":"Präposition","k":"seit (…den beri)","c":"—","br":"Başlamış ve hâlâ süren zaman; bu yüzden Almanca Präsens ister: Ich wohne seit 2019 hier. Türkçede „…dır“ ile aynı mantık.","tr":"…den beri","s":"Wir kennen uns seit der Schulzeit.","st":"Okul zamanından beri tanışıyoruz.","f":"seitdem (o zamandan beri) · seither (o günden bu yana) · vor (…önce)"},{"w":"von (+ Dativ)","t":"Präposition","k":"von (…dan; …nın)","c":"—","br":"Kaynak ve aidiyet: nereden geldi, kime ait. Konuşma dilinde Genitiv’in yerini alır: das Auto von meinem Bruder. „…dan …e“ kalıbı: von … bis.","tr":"…dan; …nın","s":"Das ist ein Geschenk von meiner Schwester.","st":"Bu, kız kardeşimden bir hediye.","f":"davon (ondan) · von … bis (…dan …e) · vom (von dem)"},{"w":"zu (+ Dativ)","t":"Präposition","k":"zu (…e doğru, kişiye/kuruma)","c":"—","br":"Hedef: kişiye ya da kuruma gidilirken zu kullanılır (zum Arzt, zu meiner Mutter); şehir ve ülkeye nach. Ayrıca amaç bildirir: zum Lernen.","tr":"…e, …ye (kişi, kurum)","s":"Ich muss noch schnell zum Arzt.","st":"Çabucak doktora gitmem lazım.","f":"dazu (buna) · zum (zu dem) · zur (zu der)"},{"w":"gegenüber / außer (+ Dativ)","t":"Präposition","k":"gegenüber (karşısında) / außer (…hariç)","c":"—","br":"gegenüber isimden sonra da gelebilir: dem Haus gegenüber. außer istisnayı gösterir: außer mir kannte niemand den Weg.","tr":"karşısında / …hariç","s":"Außer mir war niemand pünktlich.","st":"Benden başka kimse dakik değildi.","f":"gegenüberstellen (karşılaştırmak) · außerdem (ayrıca) · die Ausnahme (istisna)"}]},{"n":"Edatlar: zaman edatları","e":"am, im, um, ab, bis, in, über, zu…","c":"#3d6f8f","g":"Edatlı fiiller & kalıplar","cards":[{"w":"am (Tag) / im (Monat) / um (Uhr)","t":"Zaman edatı","k":"an dem / in dem / um","c":"—","br":"Üç kalıp bir arada öğrenilir: gün ve günün bölümü am (am Montag, am Abend), ay ve mevsim im (im Mai, im Winter), saat um (um acht). Tek istisna: in der Nacht.","tr":"…günü / …ayında / saat …de","s":"Am Montag um neun, also noch im Januar.","st":"Pazartesi saat dokuzda, yani daha ocak ayında.","f":"an (…de) · in (…içinde) · um (saat …de) · in der Nacht (geceleyin)"},{"w":"vor ↔ nach (zaman)","t":"Zaman edatı","k":"vor (önce) / nach (sonra) + Dativ","c":"—","br":"Zaman ekseninde iki yön. vor bitmiş bir noktayı gösterir (vor drei Jahren), nach ise ardından geleni (nach dem Essen). İkisi de Dativ alır.","tr":"…önce ↔ …sonra","s":"Vor dem Termin trinken wir noch einen Kaffee, nach dem Termin fahre ich direkt heim.","st":"Randevudan önce bir kahve içeriz, randevudan sonra doğruca eve giderim.","f":"vorher (önceden) · nachher (sonra) · davor (ondan önce) · danach (ondan sonra)"},{"w":"ab ↔ bis (zaman)","t":"Zaman edatı","k":"ab (…den itibaren) / bis (…e kadar)","c":"—","br":"Bir aralığın iki ucu: ab başlangıcı açar (ab Montag gilt der neue Plan), bis sonu kapatır. Birlikte: von … bis.","tr":"…den itibaren ↔ …e kadar","s":"Ab morgen gelten die neuen Öffnungszeiten — bis Ende Juni.","st":"Yarından itibaren yeni açılış saatleri geçerli — haziran sonuna kadar.","f":"von … bis (…dan …e) · ab sofort (hemen itibaren) · spätestens (en geç)"},{"w":"in (+ Dativ, gelecek)","t":"Zaman edatı","k":"in (…sonra)","c":"—","br":"Dikkat: gelecekteki bir andan söz ederken „…sonra“ karşılığı in’dir, nach değil. in zwei Wochen = iki hafta sonra. nach zaman aralığıyla değil, olayla kullanılır: nach dem Urlaub.","tr":"…(süre) sonra","s":"In zehn Minuten bin ich da.","st":"On dakikaya oradayım.","f":"in einer Woche (bir hafta sonra) · nach (…dan sonra) · innerhalb (…içinde)"},{"w":"über (+ Akkusativ, süre)","t":"Zaman edatı","k":"über (…boyunca)","c":"—","br":"Bir süre boyunca kesintisiz: über das Wochenende, über Nacht, über Jahre hinweg. Mekân anlamındaki über ile aynı imge: bir aralığın üstünden geçmek.","tr":"…boyunca","s":"Über das Wochenende bleiben wir zu Hause.","st":"Hafta sonu boyunca evde kalıyoruz.","f":"über Nacht (bir gecede) · während (…sırasında) · hinweg (boyunca)"},{"w":"zwischen (zaman)","t":"Zaman edatı","k":"zwischen (arasında) + Dativ","c":"—","br":"İki nokta arasındaki aralık: zwischen acht und zehn. Randevu ve teslimat dilinin standart kalıbı.","tr":"…ile … arasında","s":"Der Handwerker kommt zwischen acht und zwölf.","st":"Usta sekizle on iki arası geliyor.","f":"von … bis (…dan …e) · dazwischen (arada) · der Zeitraum (zaman aralığı)"},{"w":"zu (bayram) / an (tarih)","t":"Zaman edatı","k":"zu Weihnachten / an meinem Geburtstag","c":"—","br":"Bayram ve özel günler zu alır (zu Ostern, zu Silvester), belirli tarihler ve doğum günü an: an meinem Geburtstag, am 14. Mai.","tr":"…bayramında / …tarihinde","s":"Zu Weihnachten fahren wir immer zu meinen Eltern.","st":"Noel’de hep aileme gideriz.","f":"an Feiertagen (bayram günlerinde) · am Wochenende (hafta sonunda) · das Fest (bayram)"},{"w":"gegen (saat)","t":"Zaman edatı","k":"gegen (…e doğru, civarı)","c":"—","br":"Yaklaşık saat: gegen sieben = yedi civarı. Kesinlik sırası: Punkt sieben (tam yedi) > um sieben > gegen sieben > so gegen sieben.","tr":"saat … civarı","s":"Wir sind so gegen halb acht bei euch.","st":"Yedi buçuk civarı size geliriz.","f":"etwa (yaklaşık) · Punkt (tam) · pünktlich (dakik)"},{"w":"seit ↔ vor (kullanım farkı)","t":"Zaman edatı","k":"seit (süregelen) / vor (bitmiş nokta)","c":"—","br":"Türkçede ikisi de „önce/-dır“ gibi çevrildiği için en sık hata burada: seit hâlâ süreni anlatır ve Präsens ister, vor bitmiş bir anı gösterir ve Perfekt alır.","tr":"…den beri ↔ …önce","s":"Ich arbeite seit fünf Jahren hier; vor fünf Jahren habe ich angefangen.","st":"Beş yıldır burada çalışıyorum; beş yıl önce başladım.","f":"seitdem (o zamandan beri) · damals (o zaman) · inzwischen (bu arada)"},{"w":"binnen / innerhalb","t":"Zaman edatı (resmî)","k":"binnen (+ Dativ) / innerhalb (+ Genitiv)","c":"—","br":"Süre sınırını resmî olarak koyar: binnen einer Woche = innerhalb einer Woche. Resmî yazışmada süre bildirmenin standart yolu.","tr":"…içinde (süre sınırı)","s":"Der Betrag ist binnen 14 Tagen zu überweisen.","st":"Tutar 14 gün içinde havale edilmelidir.","f":"die Frist (süre) · spätestens (en geç) · fristgerecht (süresinde)"},{"w":"pro / je (sıklık)","t":"Ölçü edatı","k":"pro (başına) / je (her biri için)","c":"—","br":"Birim başına miktar: dreimal pro Woche, 20 Euro je Person. Artikel almazlar; je biraz daha resmîdir.","tr":"…başına, …de bir","s":"Ich gehe zweimal pro Woche schwimmen.","st":"Haftada iki kez yüzmeye gidiyorum.","f":"jeweils (her biri) · der Durchschnitt (ortalama) · täglich (günlük)"},{"w":"gegenüber (zaman/kıyas)","t":"Edat","k":"gegenüber (…e kıyasla)","c":"—","br":"Karşılaştırma kurar: gegenüber dem Vorjahr = geçen yıla kıyasla. Mekân anlamı (karşısında) ile aynı imge: iki şeyi karşı karşıya koymak.","tr":"…e kıyasla","s":"Gegenüber dem Vorjahr sind die Kosten leicht gesunken.","st":"Geçen yıla kıyasla masraflar hafif düştü.","f":"im Vergleich zu (…e kıyasla) · verglichen mit (…ile karşılaştırıldığında) · der Vergleich (karşılaştırma)"},{"w":"außerhalb ↔ innerhalb (mekân)","t":"Edat + Genitiv","k":"außer (dış) / inner (iç) + halb","c":"—","br":"Sınırın dışında ve içinde: hem mekân hem süre. Resmî yazının kalıbı: außerhalb der Geschäftszeiten (mesai dışında).","tr":"…dışında ↔ …içinde","s":"Außerhalb der Sprechzeiten erreichen Sie uns per Mail.","st":"Görüşme saatleri dışında bize e-postayla ulaşabilirsiniz.","f":"die Grenze (sınır) · draußen (dışarıda) · die Öffnungszeit (açılış saati)"},{"w":"dank / wegen","t":"Sebep edatı","k":"dank (sayesinde) / wegen (yüzünden)","c":"—","br":"İkisi de sebep bildirir ama tonu zıttır: dank olumlu sonuç (dank deiner Hilfe), wegen yansız ya da olumsuz (wegen des Wetters). Resmî yazıda wegen yerine aufgrund tercih edilir.","tr":"sayesinde / yüzünden","s":"Dank deiner Hilfe sind wir früher fertig geworden.","st":"Senin yardımın sayesinde erken bitirdik.","f":"aufgrund (…nedeniyle) · infolge (…sonucunda) · der Dank (teşekkür)"}]},{"n":"Edatlar: mekân ayrımları","e":"an/auf/in, bei/zu/nach, aus/von","c":"#2a6d8a","g":"Edatlı fiiller & kalıplar","cards":[{"w":"an ↔ auf ↔ in (mekân)","t":"Edat ayrımı","k":"an (dikey temas) · auf (yatay üst) · in (içinde)","c":"—","br":"Üçünü ayıran şey temas biçimi: an dikey yüzeye değer (an der Wand, am Fenster), auf yatay yüzeyin üstündedir (auf dem Tisch), in içindedir (in der Schublade). Türkçede üçü de „-de“ olduğu için bu ayrım öğrenilmek zorundadır.","tr":"…de (dikey / üst / iç)","s":"Das Bild hängt an der Wand, der Schlüssel liegt auf dem Tisch und das Geld ist in der Schublade.","st":"Tablo duvarda asılı, anahtar masanın üstünde, para da çekmecede.","f":"hängen (asılı olmak) · liegen (yatmak) · stecken (içine sıkışmış olmak)"},{"w":"in ↔ nach (yön)","t":"Edat ayrımı","k":"nach: artikelsiz yerler · in: artikelli yerler","c":"—","br":"Şehir ve çoğu ülke artikelsizdir, bu yüzden nach alır: nach Köln, nach Italien. Artikelli ülkeler ve bölgeler in + Akkusativ alır: in die Türkei, in die Schweiz, in die Stadt.","tr":"…e (şehir/ülke yönü)","s":"Im Sommer fahren wir in die Türkei, im Herbst nach Berlin.","st":"Yazın Türkiye’ye, sonbaharda Berlin’e gidiyoruz.","f":"nach Hause (eve) · zu Hause (evde) · ins Ausland (yurt dışına)"},{"w":"zu ↔ nach ↔ in (gidiş)","t":"Edat ayrımı","k":"zu: kişi/kurum · nach: yer adı · in: içine girilen mekân","c":"—","br":"Kime gidiliyorsa zu (zum Arzt, zu Oma), yer adıysa nach (nach Aachen), içine girilecek bir mekânsa in (ins Kino, in die Schule). Bu üçlü ayrım yol tarifinin çekirdeğidir.","tr":"…e gitmek: kişi / şehir / mekân","s":"Ich gehe zum Arzt, danach in die Apotheke und dann nach Hause.","st":"Doktora gidiyorum, sonra eczaneye, sonra da eve.","f":"zum Arzt (doktora) · ins Kino (sinemaya) · nach Hause (eve)"},{"w":"bei ↔ zu (durum/yön)","t":"Edat ayrımı","k":"bei: yanında bulunmak · zu: yanına gitmek","c":"—","br":"Yön mü duruş mu: Ich gehe zu meiner Schwester (gidiyorum) ↔ Ich bin bei meiner Schwester (oradayım). Aynı ayrım kurumlarda da geçerli: zum Amt gehen ↔ beim Amt arbeiten.","tr":"…nın yanında ↔ …nın yanına","s":"Heute Abend bin ich bei meinem Bruder, morgen fahre ich zu meinen Eltern.","st":"Bu akşam kardeşimdeyim, yarın aileme gidiyorum.","f":"bei uns (bizde) · zu uns (bize) · beim Arzt (doktorda)"},{"w":"aus ↔ von (çıkış)","t":"Edat ayrımı","k":"aus: içinden dışarı · von: bir noktadan itibaren","c":"—","br":"İçinden çıkılıyorsa aus (aus dem Haus, aus der Türkei), bir noktadan ayrılınıyorsa von (vom Bahnhof, von der Arbeit). Kişiden gelen şey daima von’dur.","tr":"…in içinden ↔ …dan (noktadan)","s":"Ich komme gerade von der Arbeit, nicht aus dem Urlaub.","st":"Şu an işten geliyorum, tatilden değil.","f":"aus Versehen (yanlışlıkla) · von hier (buradan) · heraus (dışarı)"},{"w":"vor ↔ hinter (mekân)","t":"Edat çifti","k":"vor (önünde) / hinter (arkasında)","c":"—","br":"İki hâlli edatlardan: duruş Dativ (vor dem Haus), hareket Akkusativ (vor das Haus). Zaman anlamında ise yalnızca vor kullanılır: vor drei Tagen.","tr":"önünde ↔ arkasında","s":"Das Auto steht vor dem Haus, die Mülltonnen stehen hinter der Garage.","st":"Araba evin önünde, çöp kovaları garajın arkasında.","f":"davor (önünde) · dahinter (arkasında) · vorne (önde)"},{"w":"über ↔ unter (mekân)","t":"Edat çifti","k":"über (üstünde, temassız) / unter (altında)","c":"—","br":"auf temas eder, über etmez: die Lampe hängt über dem Tisch. unter ayrıca „arasında“ demektir: unter Kollegen, unter anderem.","tr":"üstünde (değmeden) ↔ altında","s":"Die Lampe hängt genau über dem Esstisch.","st":"Lamba tam yemek masasının üstünde asılı.","f":"darüber (onun üstünde) · darunter (altında) · unter anderem (diğerlerinin yanı sıra)"},{"w":"neben ↔ zwischen","t":"Edat çifti","k":"neben (yanında) / zwischen (iki şey arasında)","c":"—","br":"neben tek bir şeyin yanıdır, zwischen iki şeyin ortasıdır ve daima iki öğe gerektirir: zwischen dem Sofa und dem Fenster.","tr":"yanında ↔ arasında","s":"Der Stuhl steht zwischen dem Regal und dem Fenster, nicht neben der Tür.","st":"Sandalye rafla pencerenin arasında, kapının yanında değil.","f":"daneben (yanında) · dazwischen (arasında) · nebenan (bitişikte)"},{"w":"gegenüber ↔ entlang (mekân)","t":"Edat çifti","k":"gegenüber (karşısında) / entlang (boyunca)","c":"—","br":"gegenüber Dativ alır ve isimden sonra da gelebilir: dem Bahnhof gegenüber. entlang ise isimden sonra Akkusativ alır: die Straße entlang.","tr":"karşısında ↔ boyunca","s":"Die Apotheke ist gegenüber der Post; gehen Sie einfach die Straße entlang.","st":"Eczane postanenin karşısında; caddeyi takip edin.","f":"vorbei (yanından geçerek) · gegenüberliegend (karşıdaki) · die Richtung (yön)"},{"w":"in ↔ auf (kurumlar)","t":"Kullanım ayrımı","k":"in der Schule ↔ auf der Bank / auf dem Amt","c":"—","br":"Bazı kurumlar geleneksel olarak auf alır: auf der Bank, auf der Post, auf dem Amt, auf dem Rathaus. Okul, hastane, kilise ise in alır. Bu liste kural değil, alışkanlıktır.","tr":"…de (kurum kullanımı)","s":"Ich war heute auf dem Amt und danach in der Apotheke.","st":"Bugün daireye, sonra da eczaneye gittim.","f":"auf der Post (postanede) · in der Schule (okulda) · beim Arzt (doktorda)"},{"w":"an ↔ bei (kişi/kurum)","t":"Kullanım ayrımı","k":"sich wenden an ↔ arbeiten bei","c":"—","br":"Başvururken an kullanılır (sich an das Amt wenden, eine Frage an dich), çalışma yeri bildirilirken bei (bei Ford arbeiten, bei der Stadt angestellt sein).","tr":"…e (başvuru) ↔ …de (çalışma yeri)","s":"Wenden Sie sich bitte an die Verwaltung — sie arbeitet seit Jahren bei der Stadt.","st":"Lütfen idareye başvurun — o yıllardır belediyede çalışıyor.","f":"sich wenden an (başvurmak) · angestellt bei (…de çalışan) · die Anfrage (soru, talep)"},{"w":"Kaynaşmalar: im, am, zum, zur","t":"Edat + artikel","k":"in dem → im · an dem → am · zu dem → zum · zu der → zur","c":"—","br":"Sık kullanılan edat + artikel birleşimleri kaynaşır. Dativ: im, am, beim, vom, zum, zur. Akkusativ: ins, ans, aufs, durchs, fürs. Artikel vurgulanacaksa kaynaşma çözülür: in dem Haus, nicht in diesem.","tr":"edat–artikel birleşmeleri","s":"Wir treffen uns am Bahnhof und gehen dann ins Café.","st":"Garda buluşup sonra kafeye gidiyoruz.","f":"beim (bei dem) · vom (von dem) · fürs (für das) · ans (an das)"},{"w":"hinein / heraus / hinauf","t":"Yönlü edat zarfları","k":"hin/her + in, aus, auf","c":"—","br":"Edat, yön ekseniyle birleşir: hinein (buradan içeri, uzağa doğru), herein (bana doğru içeri), hinauf (yukarı, uzağa), herunter (aşağı, bana doğru). Konuşmada kısalır: rein, raus, rauf, runter.","tr":"içeri / dışarı / yukarı (yön belirterek)","s":"Komm rein! Ich gehe kurz raus.","st":"İçeri gel! Ben kısaca dışarı çıkıyorum.","f":"herein (içeri, buraya) · hinaus (dışarı) · runter (aşağı, günlük)"},{"w":"innen ↔ außen","t":"Konum çifti","k":"innen (iç tarafta) / außen (dış tarafta)","c":"—","br":"Bir nesnenin iç ve dış yüzeyi: die Tür ist innen weiß, außen grau. Kişi ve mekân için ise drinnen ↔ draußen kullanılır — bu ayrım karıştırılır.","tr":"iç tarafta ↔ dış tarafta","s":"Der Schrank ist außen dunkel und innen hell.","st":"Dolap dıştan koyu, içten açık renk.","f":"drinnen (içeride) · draußen (dışarıda) · innerhalb (…içinde)"}]},{"n":"Sabit edat: auf · über · an","e":"fiilin edatı anlamın parçasıdır","c":"#c2562f","g":"Edatlı fiiller & kalıplar","cards":[{"w":"achten auf (A)","t":"Verb + Präposition","k":"achten (saymak, dikkate almak) + auf","c":"achtet – achtete – hat geachtet","br":"achten tek başına „saygı duymak“; auf+A alınca bakışı bir şeye yöneltir = dikkat etmek. Aynı kökten beachten, missachten, die Achtung.","tr":"dikkat etmek, göz kulak olmak","s":"Achte bitte auf die Kinder, ich bin gleich zurück.","st":"Lütfen çocuklara göz kulak ol, hemen dönerim.","f":"beachten (dikkate almak) · missachten (hiçe saymak) · die Achtung (saygı; dikkat) · beachtlich (kayda değer)","m":[{"tr":"achten (edatsız): saygı duymak","s":"Ich achte seine Meinung, auch wenn ich sie nicht teile.","st":"Katılmasam da görüşüne saygı duyuyorum."}]},{"w":"sich verlassen auf (A)","t":"Verb + Präposition","k":"ver + lassen + auf","c":"verlässt – verließ – hat verlassen","br":"lassen bırakmaktır; ver- burada „kendini tamamen bırakma“ katar: ağırlığını birine yaslamak = güvenmek. Aynı fiil refleksifsiz „terk etmek“tir — yani bırakmanın iki ucu: birine bırakmak ve bir yeri bırakmak. Sıfat: verlässlich, zuverlässig.","tr":"güvenmek, bel bağlamak","s":"Auf diese Zusage kann man sich nicht verlassen.","st":"Bu söze güvenilmez.","f":"verlässlich (güvenilir) · die Verlässlichkeit (güvenilirlik) · zuverlässig (güvenilir)","m":[{"tr":"verlassen (sich’siz): terk etmek","s":"Er hat den Raum wortlos verlassen.","st":"Odayı tek kelime etmeden terk etti."}]},{"w":"reagieren auf (A)","t":"Verb + Präposition","k":"re (geri) + agere (eylemek) + auf","c":"reagiert – reagierte – hat reagiert","br":"Latince agere = eylemek; re- geri: gelen etkiye karşı eylemek. Almanca eşdeğeri: eingehen auf.","tr":"tepki vermek, karşılık vermek","s":"Auf meine Nachricht hat er bis heute nicht reagiert.","st":"Mesajıma bugüne kadar cevap vermedi.","f":"die Reaktion (tepki) · reaktionsschnell (hızlı tepki veren) · agieren (hareket etmek)"},{"w":"sich einlassen auf (A)","t":"Verb + Präposition","k":"ein + lassen + auf","c":"lässt ein – ließ ein – hat eingelassen","br":"Kendini bir şeyin içine bırakmak = riskini alarak girişmek, razı olmak. Genelde temkinli bir ton taşır.","tr":"(bir işe) girişmek, razı olmak","s":"Auf einen solchen Vergleich würde ich mich nicht einlassen.","st":"Böyle bir sulh anlaşmasına girişmezdim.","f":"einlassen (içeri almak) · die Einlassung (hukukta: savunma beyanı)"},{"w":"sich freuen auf / über","t":"Verb + Präposition","k":"freuen + auf (A) / über (A)","c":"freut – freute – hat gefreut","br":"Edat zamanı belirler: auf gelecekteki bir şeye sevinmek, über olmuş bitmiş bir şeye sevinmek. Tek harflik fark, iki farklı zaman.","tr":"(auf) dört gözle beklemek","s":"Ich freue mich auf die Sommerferien.","st":"Yaz tatilini dört gözle bekliyorum.","f":"die Freude (sevinç) · erfreulich (sevindirici) · freudig (sevinçli)","m":[{"tr":"über+A: olan bir şeye sevinmek","s":"Über Ihre schnelle Antwort habe ich mich sehr gefreut.","st":"Hızlı cevabınıza çok sevindim."}]},{"w":"sich beschweren über (A)","t":"Verb + Präposition","k":"be + schwer (ağır) + -en","c":"beschwert – beschwerte – hat beschwert","br":"schwer = ağır. İçindeki ağırlığı dile getirmek = şikâyet etmek. İsim: die Beschwerde, hukukta resmî şikâyet yolu.","tr":"şikâyet etmek","s":"Wir haben uns beim Vermieter über den Lärm beschwert.","st":"Gürültü konusunda ev sahibine şikâyette bulunduk.","f":"die Beschwerde (şikâyet) · beschwerlich (zahmetli) · schwer (ağır; zor)"},{"w":"klagen über (A)","t":"Verb + Präposition","k":"klagen (yakınmak) + über","c":"klagt – klagte – hat geklagt","br":"über ile yakınmak, gegen ile dava açmak. Aynı fiil, edat değişince hukuki anlama geçer.","tr":"yakınmak, şikâyet etmek","s":"Mehrere Mieter klagen über feuchte Wände.","st":"Birkaç kiracı nemli duvarlardan yakınıyor.","f":"die Klage (dava; yakınma) · der Kläger (davacı) · beklagenswert (acınası)","m":[{"tr":"gegen+A / auf+A: dava açmak","s":"Er hat gegen den Bescheid geklagt.","st":"Karara karşı dava açtı."}]},{"w":"sich einigen auf (A)","t":"Verb + Präposition","k":"ein (bir) + -igen + auf","c":"einigt – einigte – hat geeinigt","br":"Kök ein, yani „bir“: eins werden. -igen eki onu fiile çevirir: birden çok tarafı tek noktada birleştirmek. İsim die Einigung; sıfat einig sein (hemfikir olmak); aynı kökten vereinen ve die Vereinigung.","tr":"uzlaşmak, anlaşmak","s":"Wir haben uns auf eine Ratenzahlung geeinigt.","st":"Taksitli ödemede anlaştık.","f":"die Einigung (uzlaşma) · einig sein (hemfikir olmak) · die Vereinigung (birleşme, dernek)"},{"w":"zweifeln an (D)","t":"Verb + Präposition","k":"Zweifel (zwei: iki) + an","c":"zweifelt – zweifelte – hat gezweifelt","br":"İki seçenek arasında kalmak = şüphe. an+D ile: bir şeyin varlığından şüphe etmek. bezweifeln nesneyi doğrudan alır — be- ön ekinin klasik işlevi.","tr":"şüphe etmek","s":"An seiner Sorgfalt zweifelt hier niemand.","st":"Onun titizliğinden burada kimse şüphe etmiyor.","f":"bezweifeln (şüphe duymak) · der Zweifel (şüphe) · zweifelhaft (şüpheli)"},{"w":"teilnehmen an (D)","t":"Verb + Präposition","k":"Teil (pay) + nehmen + an","c":"nimmt teil – nahm teil – hat teilgenommen","br":"Bir bütünden pay almak = katılmak. Türkçe „katılmak“ ile birebir aynı mantık: parça olmak.","tr":"katılmak","s":"An der Elternversammlung haben nur acht Personen teilgenommen.","st":"Veli toplantısına yalnızca sekiz kişi katıldı.","f":"die Teilnahme (katılım) · der Teilnehmer (katılımcı) · teilnahmslos (ilgisiz)"},{"w":"liegen an (D)","t":"Verb + Präposition","k":"liegen (yatmak) + an","c":"liegt – lag – hat gelegen","br":"Sorumluluğun nerede yattığı = neyin sebep olduğu. Kalıp: Es liegt daran, dass…","tr":"…dan kaynaklanmak","s":"Die Verzögerung liegt an den fehlenden Belegen.","st":"Gecikme eksik belgelerden kaynaklanıyor.","f":"daran liegen (ondan kaynaklanmak) · es liegt mir viel daran (benim için önemli)","m":[{"tr":"jemandem liegt an etwas: önem vermek","s":"Uns liegt an einer schnellen Klärung.","st":"Bizim için hızlı bir açıklığa kavuşma önemli."}]},{"w":"mangeln an (D)","t":"Verb + Präposition","k":"Mangel (eksiklik) + an","c":"mangelt – mangelte – hat gemangelt","br":"Mangel = kusur, eksiklik. Kalıp daima es ile: Es mangelt an … = …eksik. Kira hukukunda der Mangel merkez kavramdır.","tr":"eksik olmak","s":"Es mangelt vor allem an nachvollziehbaren Belegen.","st":"Her şeyden önce anlaşılır belgeler eksik.","f":"der Mangel (kusur, eksiklik) · mangelhaft (kusurlu; not: 5) · mangels (…yokluğunda)"},{"w":"sich beteiligen an (D)","t":"Verb + Präposition","k":"be + Teil + -igen + an","c":"beteiligt – beteiligte – hat beteiligt","br":"Kendini bir işin parçası yapmak = iştirak etmek; masraf için: paya katılmak.","tr":"katılmak, iştirak etmek","s":"Der Vermieter beteiligt sich an den Kosten der Reparatur.","st":"Ev sahibi tamir masraflarına katılıyor.","f":"die Beteiligung (katılım, pay) · beteiligt (ilgili, katılan) · der Beteiligte (ilgili taraf)"},{"w":"sich erinnern an (A)","t":"Verb + Präposition","k":"er + innen (iç) + -n + an","c":"erinnert – erinnerte – hat erinnert","br":"innen = iç. Bir şeyi içeriden yeniden gün yüzüne çıkarmak = hatırlamak. Refleksifsiz: birine hatırlatmak.","tr":"hatırlamak","s":"An das genaue Datum kann ich mich nicht erinnern.","st":"Kesin tarihi hatırlayamıyorum.","f":"die Erinnerung (hatıra; hatırlatma) · innerlich (içsel) · erinnerlich (hatırlanabilir)","m":[{"tr":"jemanden an etwas erinnern: hatırlatmak","s":"Darf ich Sie an die offene Rechnung erinnern?","st":"Ödenmemiş faturayı hatırlatabilir miyim?"}]},{"w":"scheitern an (D)","t":"Verb + Präposition","k":"Scheit (kütük parçası) + -ern + an","c":"scheitert – scheiterte – ist gescheitert","br":"Scheit = yarılmış odun. Bir engelde parçalanmak = başarısız olmak. Daima „ist“ ile.","tr":"başarısız olmak, takılıp kalmak","s":"Die Verhandlungen sind an einer einzigen Klausel gescheitert.","st":"Görüşmeler tek bir madde yüzünden çöktü.","f":"das Scheitern (başarısızlık) · gescheitert (başarısız olmuş) · zum Scheitern verurteilt (başarısızlığa mahkûm)"}]},{"n":"Sabit edat: für · von · mit · zu · um","e":"aynı fiil, farklı edat, farklı anlam","c":"#4a7c1f","g":"Edatlı fiiller & kalıplar","cards":[{"w":"sich einsetzen für (A)","t":"Verb + Präposition","k":"ein + setzen + für","c":"setzt ein – setzte ein – hat eingesetzt","br":"Kendini bir dava için ortaya koymak = onu savunmak, uğraş vermek. Refleksifsiz einsetzen: göreve koymak, kullanmak.","tr":"(bir şey için) mücadele etmek, savunmak","s":"Der Elternbeirat setzt sich für kleinere Klassen ein.","st":"Veli kurulu daha küçük sınıflar için mücadele ediyor.","f":"der Einsatz (kullanım, gayret) · einsetzen (kullanmak; görevlendirmek) · einsatzbereit (göreve hazır)","m":[{"tr":"einsetzen: kullanmak, görevlendirmek","s":"Für die Vertretung wurden zwei Referendare eingesetzt.","st":"Vekâlet için iki stajyer öğretmen görevlendirildi."}]},{"w":"sorgen für / sich sorgen um","t":"Verb + Präposition","k":"Sorge (kaygı, ilgi) + für / um","c":"sorgt – sorgte – hat gesorgt","br":"Sorge iki yönlü: bakım ve endişe. für ile bakmak, sağlamak; sich … um ile endişelenmek. Edat duyguyu belirler.","tr":"(für) sağlamak, bakmak","s":"Für die Verpflegung sorgt die Schule.","st":"Yemek işini okul sağlıyor.","f":"die Sorge (kaygı; bakım) · die Fürsorge (bakım) · sorgfältig (özenli) · besorgt (endişeli)","m":[{"tr":"sich sorgen um: endişelenmek","s":"Viele Eltern sorgen sich um den Unterrichtsausfall.","st":"Birçok veli derslerin boş geçmesinden endişe ediyor."}]},{"w":"halten von / halten für","t":"Verb + Präposition","k":"halten (tutmak) + von (D) / für (A)","c":"hält – hielt – hat gehalten","br":"von ile: bir şeyi ne kadar değerli tutuyorsun = ne düşünüyorsun. für ile: birini ne sayıyorsun. Aynı fiil, edatla iki ayrı soru.","tr":"(von) …hakkında fikri olmak","s":"Was halten Sie von diesem Vorschlag?","st":"Bu öneri hakkında ne düşünüyorsunuz?","f":"die Haltung (tutum) · anhalten (durmak; sürmek) · aufhalten (alıkoymak; bulunmak)","m":[{"tr":"für+A: …saymak, …olarak görmek","s":"Ich halte diese Frist für unangemessen kurz.","st":"Bu süreyi uygunsuz derecede kısa buluyorum."}]},{"w":"profitieren von (D)","t":"Verb + Präposition","k":"Profit (kazanç) + -ieren + von","c":"profitiert – profitierte – hat profitiert","br":"Kazanç sağlamak. Almanca eşdeğeri: von etwas haben ya da Nutzen ziehen aus.","tr":"yararlanmak, kazançlı çıkmak","s":"Von der Neuregelung profitieren vor allem Mieter.","st":"Yeni düzenlemeden özellikle kiracılar yararlanıyor.","f":"der Profit (kâr) · profitabel (kârlı) · der Nutzen (fayda)"},{"w":"rechnen mit (D)","t":"Verb + Präposition","k":"rechnen (hesaplamak) + mit","c":"rechnet – rechnete – hat gerechnet","br":"Bir şeyi hesaba katmak = onu beklemek. mit ile beklenti, auf ile bir kişiye güven.","tr":"beklemek, hesaba katmak","s":"Mit einer Antwort ist vor Mai nicht zu rechnen.","st":"Mayıstan önce cevap beklenmiyor.","f":"die Rechnung (fatura; hesap) · berechnen (hesaplamak) · damit rechnen (bunu beklemek)","m":[{"tr":"auf+A: birine güvenmek","s":"Auf ihn kann man immer rechnen.","st":"Ona her zaman güvenilir."}]},{"w":"sich befassen mit (D)","t":"Verb + Präposition","k":"be + fassen (kavramak) + mit","c":"befasst – befasste – hat befasst","br":"Bir konuyu eline alıp kavramak = onunla uğraşmak. sich beschäftigen mit ile eşanlamlı, ama daha resmî.","tr":"(bir konuyla) uğraşmak, ele almak","s":"Der Ausschuss befasst sich seit März mit dem Thema.","st":"Komisyon konuyu marttan beri ele alıyor.","f":"fassen (tutmak, kavramak) · sich beschäftigen mit (…ile uğraşmak) · die Befassung (ele alma)"},{"w":"führen zu (D)","t":"Verb + Präposition","k":"führen (götürmek) + zu","c":"führt – führte – hat geführt","br":"Bir sonuca götürmek = ona yol açmak. Argüman cümlelerinin standart bağlantısı.","tr":"yol açmak, sebep olmak","s":"Die fehlenden Angaben führen zu erheblichen Verzögerungen.","st":"Eksik bilgiler ciddi gecikmelere yol açıyor.","f":"die Führung (yönetim; rehberlik) · verführen (baştan çıkarmak) · die Folge (sonuç; dizi)"},{"w":"neigen zu (D)","t":"Verb + Präposition","k":"neigen (eğilmek) + zu","c":"neigt – neigte – hat geneigt","br":"Bir yöne eğilmek = ona meyilli olmak. İsim: die Neigung — hem eğim hem eğilim.","tr":"eğilimli olmak, meyletmek","s":"Er neigt dazu, Fristen bis zum letzten Tag auszureizen.","st":"Süreleri son güne kadar zorlama eğiliminde.","f":"die Neigung (eğilim, eğim) · geneigt (eğilimli) · zuneigen (meyletmek)"},{"w":"beitragen zu (D)","t":"Verb + Präposition","k":"bei + tragen + zu","c":"trägt bei – trug bei – hat beigetragen","br":"Ortak yükün yanına kendi payını taşımak = katkıda bulunmak. İsim: der Beitrag.","tr":"katkıda bulunmak","s":"Klare Absprachen tragen zu einem besseren Klima bei.","st":"Net anlaşmalar daha iyi bir ortama katkıda bulunur.","f":"der Beitrag (katkı; aidat) · die Beitragspflicht (aidat yükümlülüğü) · tragen (taşımak)"},{"w":"sich richten nach (D)","t":"Verb + Präposition","k":"richten (yöneltmek) + nach","c":"richtet – richtete – hat gerichtet","br":"Kendini bir ölçüye göre yöneltmek = ona göre belirlenmek. Resmî metinlerde: „…e göre tayin edilir“.","tr":"…e göre belirlenmek, uymak","s":"Die Höhe der Kosten richtet sich nach der Wohnfläche.","st":"Masrafların tutarı konut alanına göre belirlenir.","f":"die Richtung (yön) · die Richtlinie (yönerge) · ausrichten (iletmek; düzenlemek)","m":[{"tr":"sich richten an+A: hitap etmek","s":"Das Schreiben richtet sich an alle Mieter des Hauses.","st":"Yazı binadaki bütün kiracılara hitaben yazılmış."}]},{"w":"streben nach (D)","t":"Verb + Präposition","k":"streben (didinmek) + nach","c":"strebt – strebte – hat gestrebt","br":"Bir hedefe doğru gerilmek = onu amaçlamak. Aynı kökten anstreben (hedeflemek), der Ehrgeiz değil ama strebsam (çalışkan).","tr":"peşinde olmak, amaçlamak","s":"Wir streben nach einer außergerichtlichen Lösung.","st":"Mahkeme dışı bir çözümün peşindeyiz.","f":"anstreben (hedeflemek) · strebsam (gayretli) · das Bestreben (gayret)"},{"w":"sich wehren gegen (A)","t":"Verb + Präposition","k":"wehren (savmak) + gegen","c":"wehrt – wehrte – hat gewehrt","br":"Wehr = savunma seti. Kendini bir şeye karşı savunmak. Aynı kökten die Feuerwehr: ateşi savan.","tr":"karşı koymak, kendini savunmak","s":"Gegen diese Forderung können Sie sich rechtlich wehren.","st":"Bu talebe karşı hukuken karşı koyabilirsiniz.","f":"die Wehr (savunma) · die Feuerwehr (itfaiye) · abwehren (savuşturmak) · wehrlos (savunmasız)"},{"w":"sich bemühen um (A)","t":"Verb + Präposition","k":"be + Mühe (zahmet) + -en + um","c":"bemüht – bemühte – hat bemüht","br":"Mühe = zahmet. Bir şeyin etrafında zahmete girmek = onun için çaba göstermek. Resmî yazının nazik fiili.","tr":"çaba göstermek, uğraşmak","s":"Wir bemühen uns um eine rasche Klärung.","st":"Hızlı bir açıklığa kavuşma için çaba gösteriyoruz.","f":"die Mühe (zahmet) · bemüht (çaba gösteren) · mühsam (zahmetli) · sich Mühe geben (çaba göstermek)"},{"w":"es handelt sich um (A)","t":"Kalıp fiil","k":"handeln (eylemek) + sich + um","c":"handelt – handelte – hat gehandelt","br":"Kelimesi kelimesine „iş şunun etrafında dönüyor“ = söz konusu olan şu. Daima es ile kurulur, başka özne almaz.","tr":"söz konusu olan …dır","s":"Bei diesem Posten handelt es sich um eine Verwaltungsgebühr.","st":"Bu kalemde söz konusu olan bir yönetim harcıdır.","f":"handeln von (konusu olmak) · der Handel (ticaret) · die Handlung (eylem; olay örgüsü)","m":[{"tr":"handeln von: (kitap, film) …hakkında olmak","s":"Der Text handelt von den Folgen der Digitalisierung.","st":"Metin dijitalleşmenin sonuçlarını konu alıyor."}]},{"w":"bitten um (A)","t":"Verb + Präposition","k":"bitten (rica etmek) + um","c":"bittet – bat – hat gebeten","br":"Bir şeyin etrafında rica etmek. bitten (rica) ile beten (dua) aynı kökten; fragen soru sormaktır, bitten talep.","tr":"rica etmek, istemek","s":"Wir bitten um Verständnis für die Verzögerung.","st":"Gecikme için anlayış rica ederiz.","f":"die Bitte (rica) · bitte (lütfen) · beten (dua etmek)"}]},{"n":"Sıfat + sabit edat","e":"stolz auf, zuständig für, überzeugt von…","c":"#8f5e2a","g":"Edatlı fiiller & kalıplar","cards":[{"w":"zuständig für (A)","t":"Adjektiv + Präposition","k":"zu + stehen + -ig","c":"—","br":"Bir işin başında duran = yetkili. Alman idaresinde ilk soru budur: Wer ist zuständig? Yetkisiz makama yapılan başvuru yine de süreyi korur, ama gecikir.","tr":"…den sorumlu, yetkili","s":"Für Bauanträge ist ausschließlich das Bauamt zuständig.","st":"Yapı başvurularından yalnızca imar dairesi sorumludur.","f":"die Zuständigkeit (yetki) · unzuständig (yetkisiz) · stehen (durmak)"},{"w":"verantwortlich für (A)","t":"Adjektiv + Präposition","k":"Antwort (cevap) + -lich","c":"—","br":"Kelimenin içinde „cevap“ var: sorulduğunda cevap vermek zorunda olan = sorumlu. Türkçedeki „sorumlu“ da sormaktan gelir — aynı mantık.","tr":"…den sorumlu","s":"Für die Verkehrssicherheit auf dem Gehweg ist der Eigentümer verantwortlich.","st":"Kaldırımın güvenliğinden mülk sahibi sorumludur.","f":"die Antwort (cevap) · die Verantwortung (sorumluluk) · haften für (hukuken sorumlu olmak)"},{"w":"stolz auf (A)","t":"Adjektiv + Präposition","k":"stolz (gururlu) + auf","c":"—","br":"Gurur bir şeyin ÜSTÜNE kurulur, bu yüzden edat auf’tur. Aynı „üstünde durma“ mantığı: sich verlassen auf, sich freuen auf.","tr":"…ile gurur duyan","s":"Sie ist zu Recht stolz auf dieses Ergebnis.","st":"Bu sonuçla haklı olarak gurur duyuyor.","f":"der Stolz (gurur) · die Freude (sevinç) · sich freuen über (sevinmek)"},{"w":"überzeugt von (D)","t":"Adjektiv + Präposition","k":"über + zeugen (tanıklık etmek)","c":"—","br":"Kanıtın kaynağını gösterdiği için edat von’dur: nereden ikna oldun? Aynı yapı: abhängig von, betroffen von.","tr":"…e ikna olmuş, …den emin","s":"Ich bin nach wie vor von der Richtigkeit meiner Berechnung überzeugt.","st":"Hesabımın doğruluğuna hâlâ eminim.","f":"überzeugen (ikna etmek) · die Überzeugung (kanaat) · der Zeuge (tanık)"},{"w":"bereit zu (D)","t":"Adjektiv + Präposition","k":"bereit (hazır) + zu","c":"—","br":"Hazır olmak bir hedefe yöneliktir, bu yüzden zu. Aynı mantıkla: fähig zu, entschlossen zu, verpflichtet zu.","tr":"…e hazır, …meye razı","s":"Wir sind zu einem Kompromiss bereit.","st":"Bir uzlaşmaya hazırız.","f":"die Bereitschaft (hazır olma) · vorbereiten (hazırlamak) · kompromissbereit (uzlaşmaya açık)"},{"w":"interessiert an (D)","t":"Adjektiv + Präposition","k":"inter (arasında) + esse (olmak) + an","c":"—","br":"Latince „arada olan şey“ = ilgi. Edat an’dır çünkü ilgi bir konuya temas eder. Fiil hâli farklıdır: sich interessieren FÜR — aynı kök, başka edat.","tr":"…ile ilgilenen","s":"Wir sind an einer schnellen Lösung interessiert.","st":"Hızlı bir çözümle ilgileniyoruz.","f":"das Interesse (ilgi) · sich interessieren für (ilgilenmek) · interessant (ilginç)"},{"w":"beteiligt an (D)","t":"Adjektiv + Präposition","k":"be + Teil (pay) + -igt + an","c":"—","br":"Bir işin parçası olmak. an temas kurar: neye dahilsin? Şirkette ise sahiplik payını anlatır.","tr":"…e katılmış, dahil","s":"An dem Projekt sind drei Schulen beteiligt.","st":"Projeye üç okul dahil.","f":"die Beteiligung (katılım, pay) · sich beteiligen an (katılmak) · der Beteiligte (ilgili)"},{"w":"abhängig von (D)","t":"Adjektiv + Präposition","k":"ab + hängen (asılı olmak) + von","c":"—","br":"Bir yerden aşağı asılı olmak: kaynağı von gösterir. Karşıtı unabhängig von; aynı yapı: betroffen von, überzeugt von.","tr":"…e bağlı","s":"Die Höhe der Nachzahlung ist vom tatsächlichen Verbrauch abhängig.","st":"Ek ödemenin tutarı gerçek tüketime bağlı.","f":"die Abhängigkeit (bağımlılık) · unabhängig (bağımsız) · hängen (asılı olmak)"},{"w":"geeignet für (A)","t":"Adjektiv + Präposition","k":"sich eignen (uygun düşmek) + für","c":"—","br":"Kimin ya da neyin yararına uygun? Bunu für gösterir. Aynı hedef mantığı: nützlich für, wichtig für, typisch für.","tr":"…için uygun","s":"Diese Methode ist für große Klassen kaum geeignet.","st":"Bu yöntem kalabalık sınıflar için pek uygun değil.","f":"sich eignen (uygun olmak) · die Eignung (uygunluk) · ungeeignet (uygunsuz)"},{"w":"typisch für (A)","t":"Adjektiv + Präposition","k":"typos (kalıp, damga) + für","c":"—","br":"Yunanca typos = basılan kalıp. Bir gruba özgü olan. Günlük dilde sitem kalıbı: Typisch Montag!","tr":"…e özgü, tipik","s":"Diese Formulierung ist typisch für Behördenschreiben.","st":"Bu ifade resmî yazılara özgü.","f":"der Typ (tip) · untypisch (alışılmadık) · charakteristisch (karakteristik)"},{"w":"zufrieden mit (D)","t":"Adjektiv + Präposition","k":"zu + Frieden (huzur) + mit","c":"—","br":"Frieden = barış, huzur. Bir şeyle huzura ermek = memnun olmak. Beraberlik bildirdiği için mit alır: neyle birlikte huzurlusun?","tr":"…den memnun","s":"Mit dem Ergebnis der Verhandlung bin ich nicht zufrieden.","st":"Görüşmenin sonucundan memnun değilim.","f":"der Frieden (barış) · unzufrieden (memnuniyetsiz) · die Zufriedenheit (memnuniyet)"},{"w":"betroffen von (D)","t":"Adjektiv + Präposition","k":"betreffen (dokunmak, ilgilendirmek) + von","c":"—","br":"Bir olayın kendisine dokunduğu kişi. Etki nereden geldiği için von. İkinci anlamı „sarsılmış, üzgün“dur — aynı dokunma imgesi, duygusal yönde.","tr":"…den etkilenen, muhatap","s":"Von der Regelung sind rund 200 Haushalte betroffen.","st":"Düzenlemeden yaklaşık 200 hane etkileniyor.","f":"betreffen (ilgilendirmek) · der Betroffene (etkilenen kişi) · die Betroffenheit (sarsılma)"},{"w":"verwandt mit (D)","t":"Adjektiv + Präposition","k":"ver + wenden (dönmek) → aynı yöne dönmüş","c":"—","br":"Aynı köke dönenler = akraba. Kelimeler için de kullanılır: verwandte Wörter — bu uygulamanın tam konusu.","tr":"…ile akraba, bağlantılı","s":"Diese beiden Wörter sind etymologisch eng miteinander verwandt.","st":"Bu iki kelime köken olarak birbiriyle yakın akraba.","f":"der Verwandte (akraba) · die Verwandtschaft (akrabalık) · sich wenden (dönmek)"},{"w":"schuld an (D) ↔ schuldig","t":"Karıştırılan çift","k":"Schuld (kusur, borç) + an / schuldig (borçlu, suçlu)","c":"—","br":"schuld an: bir olayın sebebi olmak (küçük harfle, sıfat gibi). schuldig: hukuken suçlu ya da borçlu — jemandem etwas schuldig sein. İkisi aynı kökten ama farklı alanda çalışır.","tr":"…den sorumlu, kusurlu ↔ suçlu, borçlu","s":"An der Verzögerung ist niemand schuld; schuldig ist hier auch niemand.","st":"Gecikmede kimsenin kusuru yok; burada suçlu da yok.","f":"die Schuld (kusur; borç) · schulden (borçlu olmak) · die Entschuldigung (özür)"}]},{"n":"İsim + fiil kalıpları","e":"Antrag stellen, in Kraft treten, Bezug nehmen…","c":"#8b2f6a","g":"Edatlı fiiller & kalıplar","cards":[{"w":"einen Antrag stellen","t":"Nomen-Verb-Verbindung","k":"Antrag (an+tragen) + stellen (koymak)","c":"stellt – stellte – hat gestellt","br":"Resmî Almancada fiilin yükü isme geçer, fiil sadece taşıyıcı olur. „Başvurmak“ değil, „başvuruyu ortaya koymak“. Bu yapıya Funktionsverbgefüge denir.","tr":"başvuruda bulunmak","s":"Den Antrag auf Wohngeld können Sie online stellen.","st":"Konut yardımı başvurusunu çevrimiçi yapabilirsiniz.","f":"beantragen (başvurmak) · der Antragsteller (başvuru sahibi) · eine Frage stellen (soru sormak)"},{"w":"Widerspruch einlegen","t":"Nomen-Verb-Verbindung","k":"Widerspruch (wider+Spruch) + ein + legen","c":"legt ein – legte ein – hat eingelegt","br":"İtirazı dosyanın içine koymak = resmen itiraz etmek. Almanya’da idari kararlara itirazın tek doğru ifadesi budur.","tr":"itiraz etmek (idari)","s":"Gegen den Bescheid habe ich fristgerecht Widerspruch eingelegt.","st":"Karara süresinde itiraz ettim.","f":"der Widerspruch (itiraz; çelişki) · die Widerspruchsfrist (itiraz süresi) · widersprechen (karşı çıkmak)"},{"w":"in Kraft treten","t":"Nomen-Verb-Verbindung","k":"Kraft (güç) + treten (basmak)","c":"tritt – trat – ist getreten","br":"Bir kuralın „güce ayak basması“ = yürürlüğe girmesi. Karşıtı: außer Kraft treten (güçten çıkmak).","tr":"yürürlüğe girmek","s":"Die neue Verordnung tritt zum 1. Januar in Kraft.","st":"Yeni yönetmelik 1 Ocak’ta yürürlüğe giriyor.","f":"außer Kraft setzen (yürürlükten kaldırmak) · die Kraft (güç) · kräftig (güçlü)"},{"w":"zur Verfügung stellen","t":"Nomen-Verb-Verbindung","k":"Verfügung (ver+fügen) + stellen","c":"stellt – stellte – hat gestellt","br":"Birinin tasarrufuna koymak = kullanımına sunmak. Eşi: zur Verfügung stehen (hazır olmak).","tr":"kullanıma sunmak, tahsis etmek","s":"Die Schule stellt den Eltern einen Raum zur Verfügung.","st":"Okul velilere bir oda tahsis ediyor.","f":"zur Verfügung stehen (hizmete hazır olmak) · verfügen (karar vermek; tasarruf etmek) · die Verfügung (emir; tasarruf)"},{"w":"Bezug nehmen auf (A)","t":"Nomen-Verb-Verbindung","k":"Bezug (be+ziehen) + nehmen","c":"nimmt – nahm – hat genommen","br":"İlişkiyi eline almak = atıfta bulunmak. Resmî yazıların açılış kalıbı; kısaltılmışı: unter Bezugnahme auf.","tr":"atıfta bulunmak, göndermede bulunmak","s":"Ich nehme Bezug auf Ihr Schreiben vom 3. Februar.","st":"3 Şubat tarihli yazınıza atıfta bulunuyorum.","f":"die Bezugnahme (atıf) · sich beziehen auf (…e atıfta bulunmak) · bezüglich (…e ilişkin)"},{"w":"eine Entscheidung treffen","t":"Nomen-Verb-Verbindung","k":"Entscheidung (ent+scheiden) + treffen (isabet ettirmek)","c":"trifft – traf – hat getroffen","br":"treffen = isabet etmek. Kararı isabetle vurmak = karar vermek. Aynı fiille: Maßnahmen treffen, Vorkehrungen treffen.","tr":"karar vermek","s":"Wir müssen bis morgen eine Entscheidung treffen.","st":"Yarına kadar bir karar vermeliyiz.","f":"entscheiden (karar vermek) · entscheidend (belirleyici) · Maßnahmen treffen (önlem almak)"},{"w":"Rücksicht nehmen auf (A)","t":"Nomen-Verb-Verbindung","k":"Rücksicht (Rück+Sicht) + nehmen","c":"nimmt – nahm – hat genommen","br":"Rück + Sicht: geriye dönüp bakma. Yani yalnızca önüne değil, arkanda kalana da bakmak — başkasını gözetmek. Almanca nezaketin çekirdeği bu kelimededir; olumsuzu rücksichtslos ağır bir sitemdir. Fiil hâli: berücksichtigen (hesaba katmak).","tr":"gözetmek, dikkate almak","s":"Bitte nehmen Sie Rücksicht auf die Nachbarn.","st":"Lütfen komşuları gözetin.","f":"rücksichtsvoll (düşünceli) · rücksichtslos (pervasız) · berücksichtigen (dikkate almak)"},{"w":"in Anspruch nehmen","t":"Nomen-Verb-Verbindung","k":"Anspruch (an+Spruch) + nehmen","c":"nimmt – nahm – hat genommen","br":"Hak talebini eline almak = o haktan fiilen yararlanmak. Zaman için: çok vakit almak.","tr":"(haktan) yararlanmak; (zaman) almak","s":"Diese Beratung können Sie kostenlos in Anspruch nehmen.","st":"Bu danışmanlıktan ücretsiz yararlanabilirsiniz.","f":"der Anspruch (hak talebi) · beanspruchen (talep etmek; (yer, zaman) almak) · anspruchsvoll (zorlu, talepkâr)","m":[{"tr":"zaman, emek almak","s":"Die Prüfung der Belege nimmt viel Zeit in Anspruch.","st":"Belgelerin incelenmesi çok zaman alıyor."}]},{"w":"Stellung nehmen zu (D)","t":"Nomen-Verb-Verbindung","k":"Stellung (stehen/stellen) + nehmen","c":"nimmt – nahm – hat genommen","br":"Bir konu karşısında duruşunu eline almak = görüş bildirmek. Okul ve idare yazışmasının anahtar kalıbı.","tr":"görüş bildirmek, tavır almak","s":"Zu diesen Vorwürfen möchte ich schriftlich Stellung nehmen.","st":"Bu suçlamalara yazılı olarak görüş bildirmek istiyorum.","f":"die Stellungnahme (görüş yazısı) · die Stellung (konum, mevki) · stellen (koymak, dikmek)"},{"w":"Abstand nehmen von (D)","t":"Nomen-Verb-Verbindung","k":"Abstand (ab+stehen: mesafe) + nehmen","c":"nimmt – nahm – hat genommen","br":"Mesafeyi eline almak = geri çekilmek, vazgeçmek. absehen von ile aynı işi görür, daha resmîdir.","tr":"vazgeçmek, uzak durmak","s":"Von einer Klage haben wir zunächst Abstand genommen.","st":"Dava açmaktan şimdilik vazgeçtik.","f":"der Abstand (mesafe) · abstehen (ayrık durmak) · absehen von (vazgeçmek)"},{"w":"in Betracht ziehen","t":"Nomen-Verb-Verbindung","k":"Betracht (betrachten: incelemek) + ziehen","c":"zieht – zog – hat gezogen","br":"Bir seçeneği inceleme alanına çekmek = onu hesaba katmak. Yakın kalıp: in Erwägung ziehen.","tr":"göz önünde bulundurmak, düşünmek","s":"Auch ein Vergleich sollte in Betracht gezogen werden.","st":"Sulh yolu da göz önünde bulundurulmalı.","f":"betrachten (incelemek) · die Betrachtung (inceleme, bakış) · beträchtlich (hatırı sayılır)"},{"w":"zur Kenntnis nehmen","t":"Nomen-Verb-Verbindung","k":"Kenntnis (kennen) + nehmen","c":"nimmt – nahm – hat genommen","br":"Bilgiyi kayda almak = bilgi edinmek, öğrendiğini kabul etmek. Yazışmada: zur Kenntnisnahme (bilgi için).","tr":"bilgi edinmek, kayda geçirmek","s":"Ihre Mitteilung habe ich zur Kenntnis genommen.","st":"Bildiriminizi öğrendim / kayda aldım.","f":"die Kenntnis (bilgi) · die Kenntnisnahme (bilgi edinme) · kennen (tanımak, bilmek) · die Erkenntnis (kavrayış, bulgu)"},{"w":"Klage erheben","t":"Nomen-Verb-Verbindung","k":"Klage (klagen) + erheben (yükseltmek)","c":"erhebt – erhob – hat erhoben","br":"erheben = ayağa kaldırmak. Davayı mahkemenin önünde ayağa kaldırmak = dava açmak. Aynı fiil: Einspruch erheben, Gebühren erheben.","tr":"dava açmak","s":"Innerhalb eines Monats kann Klage erhoben werden.","st":"Bir ay içinde dava açılabilir.","f":"die Klage (dava; yakınma) · der Kläger (davacı) · Einspruch erheben (itiraz etmek) · die Erhebung (tahsil; anket, ayaklanma)"},{"w":"eine Rolle spielen","t":"Nomen-Verb-Verbindung","k":"Rolle (rol) + spielen","c":"spielt – spielte – hat gespielt","br":"Sahne mecazı: bir olguda rol üstlenmek = önemli olmak. Olumsuzu çok sık: Das spielt keine Rolle.","tr":"rol oynamak, önemi olmak","s":"Der Zeitpunkt der Zustellung spielt hier eine entscheidende Rolle.","st":"Tebliğ tarihi burada belirleyici bir rol oynuyor.","f":"die Rolle (rol) · Das spielt keine Rolle (fark etmez)"},{"w":"Rechnung tragen (D)","t":"Nomen-Verb-Verbindung","k":"Rechnung (rechnen) + tragen","c":"trägt – trug – hat getragen","br":"Bir şeyin hesabını taşımak = onu gereğince dikkate almak. Resmî ve yasal metinlerin kalıbı.","tr":"gereğince dikkate almak","s":"Die Regelung trägt den Interessen beider Seiten Rechnung.","st":"Düzenleme her iki tarafın çıkarlarını gözetiyor.","f":"die Rechnung (fatura; hesap) · berücksichtigen (dikkate almak) · rechnen (hesaplamak)"},{"w":"zur Sprache bringen","t":"Nomen-Verb-Verbindung","k":"Sprache (sprechen) + bringen","c":"bringt – brachte – hat gebracht","br":"Sprache konuşmadır; bringen bir şeyi oraya taşır. Yani susulan konuyu konuşmanın içine sokmak = gündeme getirmek. Kendiliğinden olursa fiil değişir: zur Sprache kommen. Yakını ansprechen — daha doğrudan ve kişiseldir.","tr":"gündeme getirmek, dile getirmek","s":"Diesen Punkt sollten wir in der Sitzung zur Sprache bringen.","st":"Bu noktayı toplantıda gündeme getirmeliyiz.","f":"die Sprache (dil) · ansprechen (hitap etmek) · zur Sprache kommen (gündeme gelmek)"}]},{"n":"Eşdizimler: hangi isim hangi fiille","e":"Frage stellen, Fehler machen, Kritik üben…","c":"#5f7a2a","g":"Edatlı fiiller & kalıplar","cards":[{"w":"eine Frage stellen","t":"Kollokation","k":"Frage (soru) + stellen (koymak)","c":"stellt – stellte – hat gestellt","br":"Almancada soru „sorulmaz“, ortaya konur. fragen fiili nesne olarak kişiyi alır (jemanden fragen), soruyu ise stellen taşır. Bu ayrım karıştırılınca cümle bozulur.","tr":"soru sormak","s":"Darf ich noch eine Frage stellen?","st":"Bir soru daha sorabilir miyim?","f":"fragen (sormak) · die Nachfrage (ek soru) · eine Bitte äußern (rica dile getirmek)"},{"w":"einen Fehler machen","t":"Kollokation","k":"Fehler (hata) + machen","c":"macht – machte – hat gemacht","br":"Hata machen ile gelir, tun ile değil. Resmî dilde ise başka fiil kullanılır: ein Fehler ist unterlaufen — hata „altından geçmiş“, yani kimse suçlanmadan bildirilmiş olur.","tr":"hata yapmak","s":"Jeder macht mal einen Fehler.","st":"Herkes bir hata yapar.","f":"unterlaufen (hata olmak) · der Irrtum (yanılgı) · sich irren (yanılmak)"},{"w":"ein Problem lösen","t":"Kollokation","k":"Problem + lösen (çözmek)","c":"löst – löste – hat gelöst","br":"lösen bağı çözmektir: hem sorun hem denklem hem düğüm. Sorun için diğer fiiller: ein Problem angehen (ele almak), aus der Welt schaffen (ortadan kaldırmak).","tr":"sorun çözmek","s":"Das Problem lässt sich in fünf Minuten lösen.","st":"Sorun beş dakikada çözülebilir.","f":"die Lösung (çözüm) · angehen (ele almak) · beheben (gidermek)"},{"w":"einen Termin vereinbaren / absagen","t":"Kollokation","k":"Termin + vereinbaren (kararlaştırmak) / absagen (iptal)","c":"vereinbart – vereinbarte – hat vereinbart","br":"Randevu dilinin üçlüsü: vereinbaren (almak, kararlaştırmak), verschieben (ertelemek), absagen (iptal etmek). „Randevu almak“ için nehmen kullanılmaz.","tr":"randevu almak / iptal etmek","s":"Ich möchte einen Termin vereinbaren — und den von Montag absagen.","st":"Bir randevu almak istiyorum — pazartesikini de iptal etmek istiyorum.","f":"die Vereinbarung (anlaşma) · verschieben (ertelemek) · die Absage (iptal)"},{"w":"Verantwortung übernehmen","t":"Kollokation","k":"Verantwortung (sorumluluk) + übernehmen (üstlenmek)","c":"übernimmt – übernahm – hat übernommen","br":"Sorumluluk üstlenilir (übernehmen), taşınır (tragen) ve devredilir (abgeben). Üçü de aynı yük imgesinden çıkar.","tr":"sorumluluk üstlenmek","s":"Dafür übernehme ich die Verantwortung.","st":"Bunun sorumluluğunu ben üstleniyorum.","f":"Verantwortung tragen (sorumluluk taşımak) · verantwortlich (sorumlu) · die Haftung (hukuki sorumluluk)"},{"w":"Kritik üben","t":"Kollokation","k":"Kritik + üben (uygulamak)","c":"übt – übte – hat geübt","br":"Eleştiri „yapılmaz“, uygulanır: Kritik üben an + Dativ. Daha yumuşak biçim: etwas kritisch sehen; daha resmî: Beanstandungen erheben.","tr":"eleştiride bulunmak","s":"An der Abrechnung wurde von mehreren Seiten Kritik geübt.","st":"Hesaplama birçok taraftan eleştirildi.","f":"kritisieren (eleştirmek) · die Beanstandung (kusur bildirimi) · beanstanden (itiraz etmek)"},{"w":"Druck ausüben","t":"Kollokation","k":"Druck (baskı) + ausüben (icra etmek)","c":"übt aus – übte aus – hat ausgeübt","br":"Aynı fiil hak ve meslek için de kullanılır: ein Recht ausüben, einen Beruf ausüben. Baskı ayrıca „altında olunur“: unter Druck stehen.","tr":"baskı uygulamak","s":"Niemand darf hier Druck ausüben.","st":"Burada kimse baskı uygulayamaz.","f":"unter Druck stehen (baskı altında olmak) · die Ausübung (icra) · der Zeitdruck (zaman baskısı)"},{"w":"Rücksprache halten","t":"Kollokation","k":"Rücksprache + halten (tutmak)","c":"hält – hielt – hat gehalten","br":"halten fiili konuşma türlerini taşır: einen Vortrag halten (sunum yapmak), eine Rede halten (konuşma yapmak), Rücksprache halten (görüşmek).","tr":"görüşüp danışmak","s":"Ich halte kurz Rücksprache und melde mich dann.","st":"Kısaca görüşüp size dönerim.","f":"einen Vortrag halten (sunum yapmak) · sich absprechen (mutabık kalmak) · die Absprache (mutabakat)"},{"w":"Aufmerksamkeit schenken","t":"Kollokation","k":"Aufmerksamkeit (dikkat) + schenken (hediye etmek)","c":"schenkt – schenkte – hat geschenkt","br":"Almanca dikkati „hediye eder“: birine dikkat vermek bir armağandır. Aynı yapı: Beachtung schenken, Vertrauen schenken, Glauben schenken.","tr":"dikkatini vermek, ilgi göstermek","s":"Diesem Punkt sollten wir mehr Aufmerksamkeit schenken.","st":"Bu noktaya daha çok dikkat vermeliyiz.","f":"Vertrauen schenken (güvenmek) · beachten (dikkate almak) · die Aufmerksamkeit (dikkat)"},{"w":"einen Eindruck machen / gewinnen","t":"Kollokation","k":"Eindruck (izlenim) + machen / gewinnen","c":"—","br":"Kim kime: sen izlenim bırakırsın (machen), karşı taraf izlenim edinir (gewinnen). Üçüncüsü: unter dem Eindruck stehen — etkisi altında olmak.","tr":"izlenim bırakmak / izlenim edinmek","s":"Ich habe den Eindruck gewonnen, dass er es ernst meint.","st":"Ciddi olduğu izlenimini edindim.","f":"beeindrucken (etkilemek) · eindrucksvoll (etkileyici) · der Eindruck (izlenim)"},{"w":"Maßnahmen ergreifen","t":"Kollokation","k":"Maßnahme (tedbir) + ergreifen (kavramak)","c":"ergreift – ergriff – hat ergriffen","br":"Tedbir ya „alınır“ (treffen) ya „kavranır“ (ergreifen); ikisi de doğrudur, ergreifen daha kararlı bir ton taşır. Aynı fiil: die Initiative ergreifen, das Wort ergreifen (söz almak).","tr":"tedbir almak","s":"Die Schule hat sofort Maßnahmen ergriffen.","st":"Okul derhal tedbir aldı.","f":"Maßnahmen treffen (önlem almak) · die Initiative ergreifen (inisiyatif almak) · das Wort ergreifen (söz almak)"},{"w":"eine Entscheidung fällen","t":"Kollokation","k":"Entscheidung + fällen (devirmek, kesmek)","c":"fällt – fällte – hat gefällt","br":"fällen ağaç devirmektir; mahkeme kararı da böyle „indirilir“: ein Urteil fällen. Günlük dilde ise eine Entscheidung treffen daha yaygındır.","tr":"karar vermek (resmî)","s":"Das Gericht hat sein Urteil gestern gefällt.","st":"Mahkeme kararını dün verdi.","f":"das Urteil (hüküm) · eine Entscheidung treffen (karar vermek) · beschließen (karara bağlamak)"},{"w":"Anspruch erheben auf (A)","t":"Kollokation","k":"Anspruch (hak talebi) + erheben (yükseltmek)","c":"erhebt – erhob – hat erhoben","br":"erheben talebi ortaya kaldırır: Anspruch erheben, Einspruch erheben, Klage erheben, Gebühren erheben. Hepsinde „ayağa kaldırma“ imgesi var.","tr":"hak iddia etmek","s":"Auf diesen Betrag erhebt niemand mehr Anspruch.","st":"Bu tutar üzerinde artık kimse hak iddia etmiyor.","f":"der Anspruch (hak talebi) · Klage erheben (dava açmak) · die Erhebung (tahsil)"},{"w":"in Anspruch nehmen / in Kauf nehmen","t":"Kollokation çifti","k":"nehmen ile kurulan iki kalıp","c":"nimmt – nahm – hat genommen","br":"İkisi de nehmen ile kurulur ama yönleri zıttır: in Anspruch nehmen bir imkândan yararlanmaktır, in Kauf nehmen istenmeyen bir sonucu göze almaktır.","tr":"yararlanmak / göze almak","s":"Ich nehme die Beratung in Anspruch und nehme die Wartezeit in Kauf.","st":"Danışmanlıktan yararlanıyorum ve bekleme süresini göze alıyorum.","f":"der Anspruch (hak) · der Kauf (alım) · hinnehmen (katlanmak)"}]},{"n":"Genitiv edatları: resmî dilin çatısı","e":"aufgrund, angesichts, mangels, ungeachtet…","c":"#6b4fa0","g":"Edatlı fiiller & kalıplar","cards":[{"w":"aufgrund (+ Genitiv)","t":"Präposition","k":"auf + Grund (temel, zemin)","c":"—","br":"„…zemininde“ = sebebiyle. Yazı dilinde wegen’in resmî karşılığıdır. Genitiv alır: aufgrund der Angaben.","tr":"…nedeniyle, …dayanarak","s":"Aufgrund des schlechten Wetters fällt das Spiel aus.","st":"Kötü hava nedeniyle maç iptal.","f":"der Grund (sebep) · wegen (yüzünden) · begründen (gerekçelendirmek)"},{"w":"infolge (+ Genitiv)","t":"Präposition","k":"in + Folge (sonuç)","c":"—","br":"„…sonucunda“. aufgrund sebebi, infolge sonucu vurgular: biri nereden geldiğini, öbürü neyin ardından geldiğini söyler.","tr":"…sonucunda","s":"Infolge des Wasserschadens war die Wohnung zwei Wochen unbewohnbar.","st":"Su hasarı sonucunda daire iki hafta oturulamaz hâldeydi.","f":"die Folge (sonuç) · infolgedessen (bunun sonucunda) · folglich (dolayısıyla)"},{"w":"angesichts (+ Genitiv)","t":"Präposition","k":"an + Gesicht (yüz, bakış)","c":"—","br":"Kelimenin içinde „yüz yüze gelmek“ var: bir durumun karşısında durarak. Ağır ve resmî bir tonu vardır.","tr":"…karşısında, …göz önüne alındığında","s":"Angesichts der langen Fahrt fahren wir lieber früh los.","st":"Yolun uzunluğu göz önüne alınınca erken çıkalım.","f":"das Gesicht (yüz) · in Anbetracht (…dikkate alındığında) · gegenüber (karşısında)"},{"w":"hinsichtlich (+ Genitiv)","t":"Präposition","k":"hin + Sicht (bakış) + -lich","c":"—","br":"„…yönünden bakıldığında“ = …bakımından. bezüglich ile yakın: bezüglich konuyu, hinsichtlich bakış açısını işaret eder.","tr":"…bakımından, …açısından","s":"Hinsichtlich der Kosten bestehen erhebliche Zweifel.","st":"Masraflar bakımından ciddi şüpheler var.","f":"die Sicht (bakış) · bezüglich (…ilişkin) · in Bezug auf (…e ilişkin)"},{"w":"anhand (+ Genitiv)","t":"Präposition","k":"an + Hand (el)","c":"—","br":"„Elinde tutarak“ = bir belgeye ya da örneğe dayanarak. Somut bir dayanağı işaret eder: anhand der Belege.","tr":"…yardımıyla, …dayanarak","s":"Anhand der Zählerstände lässt sich der Verbrauch nachvollziehen.","st":"Sayaç değerleri sayesinde tüketim izlenebiliyor.","f":"die Hand (el) · mithilfe (yardımıyla) · anhand von (…yoluyla)"},{"w":"anstelle (+ Genitiv)","t":"Präposition","k":"an + Stelle (yer)","c":"—","br":"„…nın yerinde“ = onun yerine. statt ile eşanlamlı, ama daha açık ve resmî durur.","tr":"…yerine","s":"Anstelle eines Kuchens habe ich Obst mitgebracht.","st":"Kek yerine meyve getirdim.","f":"die Stelle (yer) · statt (yerine) · stattdessen (onun yerine)"},{"w":"trotz (+ Genitiv)","t":"Präposition","k":"Trotz (inat, direnç)","c":"—","br":"İsim hâli der Trotz „inat“ demektir. Yani „…na inat“ = rağmen. Zarf biçimi trotzdem, bağlaç biçimi obwohl.","tr":"…rağmen","s":"Trotz des Regens sind wir zu Fuß gegangen.","st":"Yağmura rağmen yürüyerek gittik.","f":"trotzdem (buna rağmen) · obwohl (…mesine rağmen) · dennoch (yine de)"},{"w":"mangels (+ Genitiv)","t":"Präposition","k":"Mangel (eksiklik) + -s","c":"—","br":"„…yokluğu nedeniyle“. Hukuk kararlarının kısa ve kesin dili: mangels Nachweises, mangels Beweisen.","tr":"…olmadığı için, …yokluğunda","s":"Mangels Interesse fiel der Kurs aus.","st":"İlgi olmadığı için kurs iptal edildi.","f":"der Mangel (eksiklik) · mangelhaft (kusurlu) · mangeln an (eksik olmak)"},{"w":"mithilfe (+ Genitiv)","t":"Präposition","k":"mit + Hilfe (yardım)","c":"—","br":"„…yardımıyla“. anhand bir dayanağı, mithilfe bir aracı ya da kişiyi işaret eder.","tr":"…yardımıyla, …aracılığıyla","s":"Mithilfe meines Nachbarn habe ich den Schrank aufgebaut.","st":"Komşumun yardımıyla dolabı kurdum.","f":"die Hilfe (yardım) · helfen (yardım etmek) · anhand (dayanarak)"},{"w":"seitens (+ Genitiv)","t":"Präposition","k":"Seite (taraf) + -ens","c":"—","br":"„…tarafından“, ama edilgen çatının von’undan farklı olarak bir kurumu ya da tarafı işaret eder: seitens der Behörde.","tr":"…tarafından, …cephesinden","s":"Seitens der Schulleitung bestehen keine Einwände.","st":"Okul yönetimi tarafından bir itiraz yok.","f":"die Seite (taraf) · vonseiten (…tarafından) · andererseits (öte yandan)"},{"w":"zwecks (+ Genitiv)","t":"Präposition","k":"Zweck (amaç) + -s","c":"—","br":"„…amacıyla“. Çok kuru ve idari bir tondadır; günlük dilde um … zu tercih edilir.","tr":"…amacıyla","s":"Zwecks Klärung des Sachverhalts bitten wir um einen Termin.","st":"Olayın açıklığa kavuşturulması amacıyla bir randevu rica ederiz.","f":"der Zweck (amaç) · zweckmäßig (amaca uygun) · um … zu (…mek için)"},{"w":"ungeachtet (+ Genitiv)","t":"Präposition","k":"un + geachtet (achten: dikkate almak)","c":"—","br":"„Dikkate alınmaksızın“ = …bakılmaksızın. trotz ile yakın, ama daha ağır: bir şeyin hesaba katılmadığını söyler.","tr":"…bakılmaksızın, …rağmen","s":"Ungeachtet aller Warnungen ist er losgefahren.","st":"Bütün uyarılara rağmen yola çıktı.","f":"achten (dikkate almak) · missachten (hiçe saymak) · trotz (rağmen)"},{"w":"innerhalb (+ Genitiv)","t":"Präposition","k":"inner (iç) + halb (yan, taraf)","c":"—","br":"„İç tarafında“: hem mekân hem süre için. Karşıtı außerhalb. Sürelerde standart kalıptır: innerhalb eines Monats.","tr":"…içinde (süre, mekân)","s":"Das Paket kommt innerhalb einer Woche.","st":"Kargo bir hafta içinde geliyor.","f":"außerhalb (dışında) · innerlich (içsel) · die Frist (süre)"},{"w":"laut (+ Genitiv/Dativ)","t":"Präposition","k":"Laut (ses) → „…nın sesine göre“","c":"—","br":"Kelimenin kökü „ses“tir: bir metnin ya da kişinin söylediğine göre. Kaynağı gösterir, doğruluğunu üstlenmez — gazete dilinin anahtarı.","tr":"…göre","s":"Laut Mietvertrag sind die Gartenkosten umlagefähig.","st":"Kira sözleşmesine göre bahçe masrafları yansıtılabilir.","f":"der Laut (ses) · gemäß (…uyarınca) · zufolge (…göre)"}]},{"n":"Edatlar: kalan resmî edatlar","e":"gemäß, zufolge, zugunsten, mittels…","c":"#4a6a8a","g":"Edatlı fiiller & kalıplar","cards":[{"w":"gemäß (+ Dativ)","t":"Präposition","k":"ge + mäß (Maß: ölçü)","c":"—","br":"Maß ölçüdür; ge- ile „ölçüsüne uygun“ olur. Yani bir kurala göre, onun ölçüsünde. İsimden önce de sonra da gelebilir: gemäß § 5 ya da dem Gesetz gemäß. Sıfat eki hâli çok işlektir: ordnungsgemäß, fristgemäß.","tr":"…uyarınca, …e uygun olarak","s":"Gemäß Paragraf 5 ist der Antrag schriftlich zu stellen.","st":"5. madde uyarınca başvuru yazılı yapılmalıdır.","f":"das Maß (ölçü) · ordnungsgemäß (usulüne uygun) · laut (…göre)"},{"w":"entsprechend (+ Dativ)","t":"Präposition","k":"entsprechen (denk düşmek) + -d","c":"—","br":"entsprechen karşılıklı konuşup denk düşmektir; ortaç hâli edata dönüşmüştür: „ona denk düşer biçimde“. gemäß kurala uymayı, entsprechend ise uyarlamayı vurgular: talebe göre ayarlanmış.","tr":"…e uygun olarak, …e göre","s":"Die Kosten werden entsprechend der Wohnfläche verteilt.","st":"Masraflar konut alanına göre dağıtılıyor.","f":"entsprechen (uymak) · die Entsprechung (karşılık) · dementsprechend (buna uygun olarak)"},{"w":"zufolge (+ Dativ)","t":"Präposition","k":"zu + Folge (sonuç, izleme)","c":"—","br":"folgen izlemektir; zufolge „ondan çıkan sonuca göre“ demektir. Kaynak gösterir ve daima isimden SONRA gelir: dem Bericht zufolge. Bu sıralama laut’tan ayırır: laut önce gelir.","tr":"…e göre (kaynağa dayanarak)","s":"Dem Bericht zufolge sind die Kosten deutlich gestiegen.","st":"Rapora göre masraflar belirgin şekilde artmış.","f":"die Folge (sonuç) · laut (…göre) · demzufolge (buna göre)"},{"w":"entgegen (+ Dativ)","t":"Präposition","k":"ent + gegen (karşı)","c":"—","br":"gegen karşıdır; entgegen „beklenenin tersine“ katar. Yani bir kurala ya da beklentiye aykırı olarak. Fiil hâli farklı çalışır: entgegenkommen (karşılamaya gelmek, uzlaşmak).","tr":"…nın aksine, …e aykırı olarak","s":"Entgegen der Absprache wurde der Termin verschoben.","st":"Anlaşmanın aksine randevu ertelendi.","f":"gegen (karşı) · entgegenkommen (uzlaşmak) · das Entgegenkommen (jest)"},{"w":"bezüglich (+ Genitiv)","t":"Präposition","k":"Bezug (be + ziehen) + -lich","c":"—","br":"beziehen bir şeyi kendine doğru çekip ilişki kurmaktır; Bezug o ilişkidir. Yani „şununla ilişkili olarak“. Kısaltması bzgl.; yazı dilindeki uzun hâli: in Bezug auf.","tr":"…e ilişkin, …ile ilgili","s":"Bezüglich Ihrer Anfrage kann ich Ihnen Folgendes mitteilen.","st":"Talebinize ilişkin size şunu bildirebilirim.","f":"der Bezug (ilişki) · sich beziehen auf (atıfta bulunmak) · hinsichtlich (…bakımından)"},{"w":"zugunsten ↔ zulasten","t":"Edat çifti (+ Genitiv)","k":"zu + Gunst (lütuf) / zu + Last (yük)","c":"—","br":"Gunst lütuf, Last yüktür: biri lehe, öbürü aleyhe. Hesap ve hukuk dilinin en net çiftlerinden — kimin kazandığını ve kimin ödediğini tek kelime söyler.","tr":"…lehine ↔ …aleyhine","s":"Die Änderung geht zulasten der Mieter und zugunsten des Vermieters.","st":"Değişiklik kiracıların aleyhine, ev sahibinin lehine.","f":"die Gunst (lütuf) · die Last (yük) · begünstigen (kayırmak)"},{"w":"abzüglich ↔ zuzüglich","t":"Edat çifti (+ Genitiv)","k":"ab/zu + ziehen (çekmek) + -lich","c":"—","br":"ziehen çekmektir: ab- tutardan çeker, zu- üstüne ekler. Fatura ve maaş bordrosunun iki yönü. Kısaltmaları: abzgl. ve zzgl.","tr":"…düşülerek ↔ …eklenerek","s":"Der Preis beträgt 900 Euro zuzüglich Nebenkosten, abzüglich Rabatt.","st":"Fiyat 900 avro artı yan giderler, indirim düşülerek.","f":"der Abzug (kesinti) · der Zusatz (ek) · inklusive (dahil)"},{"w":"einschließlich ↔ ausschließlich","t":"Edat çifti (+ Genitiv)","k":"ein/aus + schließen (kapatmak) + -lich","c":"—","br":"schließen kapatmaktır: ein- içeri kapatır (dahil), aus- dışarıda bırakır (hariç). Sözleşmede kapsamı belirleyen çifttir; kısaltmaları inkl. ve exkl.","tr":"…dahil ↔ …hariç","s":"Die Miete versteht sich einschließlich Wasser, ausschließlich Strom.","st":"Kira su dahil, elektrik hariç anlaşılmalıdır.","f":"der Ausschluss (hariç tutma) · inklusive (dahil) · umfassen (kapsamak)"},{"w":"anlässlich (+ Genitiv)","t":"Präposition","k":"Anlass (an + lassen: vesile) + -lich","c":"—","br":"anlassen harekete geçirmektir; der Anlass o vesiledir. Yani „şu vesileyle“. Davetiye ve resmî duyuruların kelimesi; günlük dilde yerine zu kullanılır: zum Geburtstag.","tr":"…münasebetiyle, …vesilesiyle","s":"Anlässlich des Jubiläums gibt es eine kleine Feier.","st":"Yıl dönümü münasebetiyle küçük bir kutlama var.","f":"der Anlass (vesile) · veranlassen (harekete geçirmek) · das Jubiläum (yıl dönümü)"},{"w":"(an)statt (+ Genitiv)","t":"Präposition","k":"an + Statt (yer)","c":"—","br":"die Statt eski Almancada „yer“ demektir (bkz. die Stadt, die Werkstatt, stattfinden). Yani „onun yerinde“. Mastar kalıbı da aynı kökten: anstatt … zu.","tr":"…yerine","s":"Statt eines Anrufs schreibe ich lieber eine kurze Mail.","st":"Te
